name: Validate docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate docs config and generated API references
        run: npx --yes mint@4.2.930 validate

      - name: Guide-claims checker self-test
        run: node eval/check-guide-claims.mjs --self-test

      - name: Check advertised docs URLs
        run: node eval/check-advertised-docs-links.mjs

      - name: Eval harness unit tests
        # `node --test eval/` is not usable on Node 22.x: a bare directory
        # positional is resolved as a module entrypoint, not a scan root. Running
        # the runner with eval/ as the working directory scans it and picks up
        # only *.test.mjs (check-hosted-docs.mjs / check-guide-claims.mjs are not
        # test files, so they are never executed as tests). These tests are
        # offline and need no credentials; check-hosted-docs.mjs itself is a
        # manual post-deploy check and is deliberately not run here.
        working-directory: eval
        run: node --test

      - name: Check guide claims against spec
        run: node eval/check-guide-claims.mjs

      - name: Check internal links, anchors, snippets and redirect destinations
        # Deterministic: checks only this repo's own pages. Runs the pinned mint
        # CLI's broken-links check;
        # links into generated TypeDoc pages are exempt only for symbols present in
        # the synced TypeDoc artifacts. The mint version lives in
        # eval/check-broken-links.mjs and must match the pins in this file and in
        # sync-generated-api-references.yml (a unit test checks all three).
        if: success() || failure()
        run: node eval/check-broken-links.mjs

      - name: Report broken external links (non-gating)
        # Needs the network, and the CLI also counts a timeout or network error as
        # broken, so this step reports but never fails the build.
        if: success() || failure()
        continue-on-error: true
        run: node eval/check-broken-links.mjs --external
