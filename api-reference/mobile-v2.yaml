  "/api/v2/mobile_navigations":
    get:
      operationId: mobile_v0_mobile_navigations_index
      summary: List mobile navigations
      tags:
      - mobile-navigations
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
        required: false
        description: Number of records per page (capped at 100)
      - name: search_query
        in: query
        schema:
          type: string
        required: false
        description: Filter by navigation name (case-insensitive substring)
      - name: with_status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
        required: false
        description: Filter by status
      - name: with_country_ids[]
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Navigations with a country access rule referencing any of
          these country ids
      - name: with_language_ids[]
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Navigations with a language access rule referencing any of
          these language ids
      - name: with_rank_ids[]
        in: query
        schema:
          type: array
          items:
            type: integer
        required: false
        description: Navigations with a rank access rule referencing any of
          these rank ids
      - name: sort_by
        in: query
        schema:
          type: string
          default: created_at_desc
        required: false
        description: 'Sort order (name_asc, name_desc, status_asc, status_desc, created_at_asc,
          created_at_desc); unknown values fall back to created_at_desc'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MobileNavigationListResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
    post:
      operationId: mobile_v0_mobile_navigations_create
      summary: Create mobile navigation customization or blank draft
      tags:
      - mobile-navigations
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MobileNavigationCreateRequest"
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MobileNavigationResponse"
        '400':
          description: Invalid member_type_id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
