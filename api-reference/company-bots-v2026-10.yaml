  /api/company/v2026-10/bots/{bot_id}/capabilities:
    parameters:
    - $ref: '#/components/parameters/NestedBotId'
    get:
      operationId: companyBotCapabilitiesIndex
      summary: List a bot's capabilities
      description: |-
        Everything a bot you own or steward can be allowed to do, with whether its current settings enable each one and whether its grant covers it. Switch capabilities on and off with `capabilities` in `PATCH /bots/{id}/settings`; that never changes the grant.

        A bot uses only the keys its enabled capabilities need, so switching one off stops the bot calling what it needed at the next run. A new bot starts with none enabled, and a capability Fluid adds later is off until you enable it. `use_ai` lets the bot use your company's AI models; without it a bot cannot think or reply.

        Needs the `we_bots.view` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Every capability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotCapabilityListResponse'
              example:
                capabilities:
                - key: use_ai
                  label: Use AI
                  description: Think and reply with your company's AI models. A bot can do nothing else without it.
                  permission_keys:
                  - mist.view
                  enabled: true
                  available: true
                  missing_keys: []
                - key: list_orders
                  label: Read orders
                  description: List and read your store's orders, without customer names or contact details.
                  permission_keys:
                  - orders.view
                  enabled: false
                  available: false
                  missing_keys:
                  - orders.view
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
