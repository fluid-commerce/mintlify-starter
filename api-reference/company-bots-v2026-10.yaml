          $ref: '#/components/responses/NotFound'
    post:
      operationId: companyBotTriggersCreate
      summary: Add a trigger
      description: |-
        Give a bot you own or steward a way to wake on its own: a `schedule` (a cron in an IANA time zone), an `event` (a store event named by its public webhook topic key) or a `webhook` (a signed inbound request). Each firing starts one run (store events gather over the trigger's window first), and a run a trigger starts acts for the bot's owner and posts into the trigger's conversation, which must seat the bot and be read only by admins. A bot has at most 20 triggers.

        A webhook trigger takes the signing secret its sender will use, as `config.secret`; Fluid stores it encrypted and never returns it.

        Needs the `we_bots.update` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotTriggerCreateRequest'
            example:
              trigger:
                kind: event
                name: Abandoned carts
                conversation_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                window_seconds: 300
                config:
                  trigger_key: cart.updated
      responses:
        '201':
          description: The new trigger. A webhook trigger's signing secret is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotTriggerResponse'
              example:
                trigger:
                  id: 019a0b1c-2d3e-7f40-8a51-6b7c8d9e0f13
                  bot_id: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  kind: event
                  name: Abandoned carts
                  enabled: true
                  conversation_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  window_seconds: 300
                  config:
                    trigger_key: cart.updated
                  created_by_admin_id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2b
                  changed_by_admin_id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2b
                  changed_at: '2026-10-22T15:35:00.000Z'
                  lock_version: 0
                  last_fired_at:
                  created_at: '2026-10-22T15:35:00.000Z'
                  updated_at: '2026-10-22T15:35:00.000Z'
                status: 201
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:35:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Invalid parameters or config (`invalid_trigger`), a conversation that does not seat the bot, is not your company's, or is read by someone who is not an admin (`conversation_not_admin_only`), an unknown time zone (`unknown_timezone`), a cron firing less than 15 minutes apart (`schedule_too_frequent`), a key or field whose permission the bot's grant lacks (`permission_not_granted`), or a bot that already has 20 triggers (`trigger_limit`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The bot's grant does not hold orders.view, which this trigger needs
                  details:
                    permission_key:
                    - orders.view
                    type: permission_not_granted
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:35:00Z'
