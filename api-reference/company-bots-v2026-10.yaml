    get:
      operationId: companyBotSettingsShow
      summary: Read a bot's settings
      description: |-
        The current settings of a bot you own or steward: its instructions, model and limits, with the version number and who made it. A bot that was never changed is at version 0.

        Needs the `we_bots.view` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The bot's settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSettingsResponse'
              example:
                settings:
                  version: 3
                  edited_by:
                    kind: admin
                    id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2c
                    name: Maya
                  edited_at: '2026-10-22T09:12:00.000Z'
                  instructions: Only chase orders more than three days unpaid.
                  model: auto
                  capabilities:
                  - list_orders
                  - use_ai
                  connectors: []
                  limits:
                    budget:
                      daily_cents: 500
                      monthly_cents: 10000
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:15:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: companyBotSettingsUpdate
      summary: Change a bot's settings
      description: |-
        Change the instructions, model, capabilities, connectors or limits of a bot you own or steward. Only the fields you send change. Send the `version` you read as `base_version`: if someone changed the settings since, the change is refused with `stale_settings` and nothing is written, so read them again.

        Every accepted change is a new version that records who made it and which fields changed. A run uses the version that was current when it started, so a change never reaches a run already going. A change that sets every field to the value it already has writes nothing and answers the current version.

        A pinned `model` must be `auto` or a text model the AI Gateway offers (`GET /api/v202604/ai/models`) when you save it.

        Needs the `we_bots.update` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotSettingsUpdateRequest'
            example:
              settings:
                base_version: 2
                instructions: Only chase orders more than three days unpaid.
                limits:
                  budget:
                    daily_cents: 500
                    monthly_cents: 10000
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotSettingsResponse'
              example:
                settings:
                  version: 3
                  edited_by:
                    kind: admin
                    id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2c
                    name: Maya
                  edited_at: '2026-10-22T09:12:00.000Z'
                  instructions: Only chase orders more than three days unpaid.
                  model: auto
                  capabilities:
                  - list_orders
                  - use_ai
                  connectors: []
                  limits:
                    budget:
                      daily_cents: 500
                      monthly_cents: 10000
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:12:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The settings changed after you read them (`stale_settings`). Read them again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The bot's settings were changed by another request; read them again
                  details:
                    type: stale_settings
                status: 409
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:12:00Z'
        '422':
          description: Invalid parameters, settings that are not valid (`invalid_settings`, such as a daily cap above the monthly one), or a model that is not a text model the AI Gateway offers (`unknown_model`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: openai/not-a-model is not a text model the AI Gateway offers
                  details:
                    model:
                    - is not a text model in the AI Gateway catalogue
                    type: unknown_model
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:12:00Z'
        '503':
          description: The AI Gateway model catalogue could not be read to check a pinned model (`model_catalogue_unavailable`). Nothing was written; try again shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The AI Gateway model catalogue could not be read; try again shortly
                  details:
                    type: model_catalogue_unavailable
                status: 503
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T09:12:00Z'
