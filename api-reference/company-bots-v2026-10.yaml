              example:
                error:
                  message: Only the person who connected this can change it
                  details:
                    type: not_connector
                status: 403
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '404':
          description: No connection by that id that you can see, or bots are not turned on for your company.
          content:
