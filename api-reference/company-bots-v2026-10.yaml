      description: |-
        Make another admin of your company the owner of a bot. From its next run the bot uses the new owner's permissions, narrowed by any limit it already has, and the limit becomes theirs to change. A steward who becomes the owner stops being a steward. The change is recorded as a settings version naming you and the field `owner`. The bot keeps its status: resume a bot paused because its owner left once it has a new owner.

