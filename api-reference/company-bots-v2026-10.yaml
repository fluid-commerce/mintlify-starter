      description: |-
        Limit a bot you own to exactly these keys, or remove its limit with an empty list. Without a limit, a bot's runs hold all of its owner's current keys. Only the owner sets or removes the limit; a steward gets 403 (`not_owner`). Every key must be registered, explicit, grantable to a bot, and held by you now through your roles; otherwise nothing changes and `error.details` names the refused keys under `unknown`, `wildcard`, `reserved` and `not_held`. Refused with `company_roles_missing` when your company has no roles. Your company's roles never change.

        Needs the `we_bots.update` permission.
