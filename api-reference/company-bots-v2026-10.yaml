  /api/company/v2026-10/bot-connections:
    get:
      operationId: companyBotConnectionsIndex
      summary: List bot connections
      description: |-
        Every company connection and your own personal ones, with their tools. Revoked connections are left out.

        Needs the `we_bots.view` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The connections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotConnectionListResponse'
              example:
                bot_connections:
                - id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a99
                  kind: mcp_server
                  scope: company
                  connector_key: remote_mcp
                  name: Helpdesk
                  mcp_host: mcp.helpdesk.example
                  status: active
                  connected_by_admin_id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2c
                  has_api_key: true
                  tools_refreshed_at: '2026-10-25T09:00:00.000Z'
                  last_used_at:
                  created_at: '2026-10-25T09:00:00.000Z'
                  tools:
                  - name: search_tickets
                    description: Find tickets.
                    effect: read
                    enabled: false
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FlagNotFound'
    post:
      operationId: companyBotConnectionsCreate
      summary: Connect a remote MCP server
      description: |-
        Connect an MCP server by its https URL, with an optional API key. Fluid opens a session, lists the server's tools and stores them with every tool off; switch on the ones bots may use with `PATCH /bot-connections/{id}`. Your company must allow remote MCP servers (`PUT /bot-connectors/remote_mcp`), or the request is refused with `connector_disallowed`.

        Needs the `we_bots.update` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConnectionCreateRequest'
            example:
              connection:
                kind: mcp_server
                scope: company
                name: Helpdesk
                url: https://mcp.helpdesk.example/mcp
                api_key: hd_live_example
      responses:
        '201':
          description: The connection, with its tools all off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotConnectionResponse'
              example:
                bot_connection:
                  id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a99
                  kind: mcp_server
                  scope: company
                  connector_key: remote_mcp
                  name: Helpdesk
                  mcp_host: mcp.helpdesk.example
                  status: active
                  connected_by_admin_id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a2c
                  has_api_key: true
                  tools_refreshed_at: '2026-10-25T09:00:00.000Z'
                  last_used_at:
                  created_at: '2026-10-25T09:00:00.000Z'
                  tools:
                  - name: search_tickets
                    description: Find tickets.
                    effect: read
                    enabled: false
                status: 201
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: You lack the permission, your company has not allowed remote MCP servers (`connector_disallowed`), or you asked for a company connection without `company_settings.update` (`not_connector`).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ForbiddenError'
              example:
                error:
                  message: Your company has not allowed remote MCP servers
                  details:
                    type: connector_disallowed
                status: 403
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '404':
          $ref: '#/components/responses/FlagNotFound'
        '422':
          description: The body is not valid, the URL is not https (`invalid_mcp_url`), the server turned the key down (`mcp_unauthorized`), or its address is private (`mcp_blocked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The MCP server's address must be an https URL
                  details:
                    type: invalid_mcp_url
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '502':
          description: The server could not be reached (`mcp_unreachable`) or did not answer MCP (`mcp_invalid`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The MCP server could not be reached
                  details:
                    type: mcp_unreachable
                status: 502
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
  /api/company/v2026-10/bot-connections/{id}:
    parameters:
    - name: id
      in: path
      required: true
      description: The connection's id.
      schema:
        type: string
        format: uuid
    patch:
      operationId: companyBotConnectionsUpdate
      summary: Switch a connection's tools
      description: |-
        Send the complete list of tools bots may use; every other tool is switched off. An unknown tool name is refused with `unknown_tool`.

        Needs the `we_bots.update` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotConnectionUpdateRequest'
            example:
              connection:
                enabled_tools:
                - search_tickets
      responses:
        '200':
          description: The connection after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotConnectionResponse'
              example:
                bot_connection:
                  id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a99
                  kind: mcp_server
                  scope: company
                  connector_key: remote_mcp
                  name: Helpdesk
