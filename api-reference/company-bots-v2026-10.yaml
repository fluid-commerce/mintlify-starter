---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Bots
  version: 2026-10
  description: |-
    The bots your company's admins own and steward. A bot is an agent that belongs to your company, acts through the Fluid API with a permission grant of its own, and never holds more than the admin who granted it.

    Bots are being released company by company. Until bots are turned on for your company, every endpoint here answers 404.

    ## Authentication

    Sign in as an admin of your company and send the session token as `Authorization: Bearer <token>`. A bot belongs to a person, so company API tokens, partner tokens and droplet installation tokens are refused with 403. Reads need the `we_bots.view` permission; creating a bot needs `we_bots.create`, changing, pausing and resuming one needs `we_bots.update`, and deleting one needs `we_bots.delete`.

    ## Who sees a bot

    You see the bots you own and the bots you steward. Every other bot answers 404, as if it did not exist. The admin who creates a bot owns it. The owner names stewards, other admins of the company who may rename, pause, resume and delete the bot; only the owner adds and removes stewards.

    ## Responses

    Every response wraps the resource under its own key with `status` and `meta`:

    ```json
    { "bot": { "id": "0192f3c4-…", "name": "Order helper" }, "status": 200, "meta": { "request_uuid": "…", "timestamp": "…" } }
    ```

    Errors use the same envelope with `error.message` and field-keyed `error.details`; a refused write also names its reason in `error.details.type`. A 401 is a bare `{ "message": … }`, and so is a 403 for a credential that cannot manage bots.

    ## Granting permissions

    Every run of a bot holds its owner's current permissions, whoever woke it and wherever, so a permission the owner loses is gone from the bot's next run. A bot has no limit by default (`permissions_limited` false): it can do everything its owner can. `PUT /bots/{id}/grant` limits it to explicit keys such as `orders.view`, each one you hold yourself through your roles, and an empty list removes the limit. Only the bot's owner sets or removes the limit; a steward gets 403 (`not_owner`). Wildcards, unknown keys and the keys a bot can never hold are refused, and so is a key you do not hold; the refusal names each one. The keys a bot can never hold are every `we_bots`, `roles`, `developer` and `company_admins` key, and `droplets.create`, `droplets.update`, `integrations.create`, `integrations.update`, `github_installations.update`, `mist.env_vars`, `reporting_databases.access`, `reporting_databases.manage` and `users.change_email`.

    ## Settings and history

    A bot's owner and stewards change its instructions, model, capabilities and limits with `PATCH /bots/{id}/settings`. Capabilities (`GET /bots/{bot_id}/capabilities`) are what the bot may do within its grant: a new bot starts with only `use_ai` enabled, so it can talk and keep its own persona and memory; enable more after granting it. Every change, including a rename through `PATCH /bots/{id}`, is a new numbered settings version that records who made it and which fields changed; `GET /bots/{bot_id}/settings-versions` lists them. A change names the version it was based on and is refused if someone changed the settings since. A run uses the settings version that was current when it started, and `GET /bots/{bot_id}/runs` lists every run, refused starts included, with the version it used.

    ## Seating a bot in a conversation

    A bot talks to people only in Fluid Messaging. Its owner or a steward seats it in a direct, group, channel or downline conversation they are in themselves, with `POST /bots/{bot_id}/conversations`; everyone in the conversation sees it join. Email and SMS conversations cannot seat a bot. A seated bot keeps its seat when it is paused, and when a downline conversation refreshes its members. Mentioning a seated bot, or writing to it in a conversation where it is the only other participant, wakes it for the admin who wrote, within what every admin in the conversation may see. A bot does not work for members: in a conversation anyone other than an admin reads, it answers at most once a day that it works only for admins.

    ## Pausing

    A paused bot starts no runs. `POST /bots/{id}/pause` pauses one bot and records whether its owner or a steward did it; `POST /bots/{id}/resume` starts it again. `POST /bots/pause-all` is your company's stop button: it pauses every active bot in the company at once, including bots you cannot see.

    A bot whose owner left the company or was locked out cannot run, and resuming it is refused (`owner_unavailable`) until `PUT /bots/{id}/owner` gives it a new owner. The owner can hand their bot on at any time; a steward can once the owner is unavailable. `GET /bots/{id}/owner-candidates` lists the admins it can go to, and each bot says whether you may change its owner (`can_change_owner`) or its limit (`can_change_limit`).

    ## Posting as a bot

    A running bot posts its reply with `POST /bot-runs/current/messages`, signed in with its run login rather than an admin's session. It posts only into the conversation it was woken in, while the run is open. Before the reply is written, Fluid checks who reads the conversation: a reply is refused while anyone other than an admin is in it, or while an admin in it lacks a permission the run used. The bot then leaves a short notice saying its reply was withheld. A posted reply counts as unread and notifies people with `<bot> posted in <conversation>`, never its text. Someone who joins later without every permission the run used sees the reply hidden.

    ## Triggers

    A bot wakes on its own through its triggers: a schedule (a five-field cron in an IANA time zone), a store event (a public webhook topic key from `GET /bot-trigger-topics`), or a signed inbound webhook. Each firing starts one run, recorded as that run with the trigger and what fired it: a schedule fires at most once every 15 minutes, a burst of store events for one trigger gathers over its window (five minutes by default) into one run that receives every subject id, and a webhook delivery starts a run with its declared fields. There is no pre-check: the bot reads the store itself, and a run that finds nothing to do ends quickly. A firing that finds the bot already running waits and tries again for up to an hour. A bot that is refused a run says why in the conversation instead of staying silent. A bot can also add, change and remove its own triggers while it runs, for anyone at your company it works for in a chat, the way the group shapes its persona; its budget still caps what the runs cost. A run a trigger starts acts for the bot's owner and posts only into the trigger's conversation, which must seat the bot and be read only by admins. A webhook trigger's signing secret is chosen by its sender and given to Fluid on create and on rotation; Fluid stores it encrypted and never returns it.

    ### Sending to a webhook trigger

    Send `POST` to the trigger's `config.inbound_url` (`https://api.fluid.app/webhooks/we-bots/{trigger_id}`) with a JSON object body of at most 64 KiB and three headers: `X-Fluid-Timestamp` (Unix seconds, within five minutes of now), `X-Fluid-Delivery-Id` (1 to 128 letters, digits, `_` or `-`, unique per delivery) and `X-Fluid-Signature-V2`, the hex HMAC-SHA256 of `"{timestamp}.{trigger_id}.{delivery_id}.{body}"` under the trigger's secret. A delivery that verifies answers 202 and starts one run of the bot with only the fields the trigger declares, each parsed to its type (send a `decimal` as a string or an integer: a JSON number with a fraction is dropped, never rounded); a delivery id received in the last 24 hours answers 200 and starts nothing; if Fluid cannot check that, it answers 503 and the sender should retry. Every refusal (an unknown or disabled trigger, a bad or stale signature, a missing or malformed delivery id, a body too large or not a JSON object, or bots off for your company) answers 404 with no body. Each trigger takes 60 deliveries a minute and each source IP 600; past that, 429. After a rotation the previous secret keeps verifying for one hour.

    ## Autonomy

    Every request a bot makes is an action of one class (`GET /bot-action-classes`), and Fluid holds it to that class's mode whatever the bot's runtime does. Reads always run: a request that only reads (GET) on an endpoint needing a view permission. A view permission on any other method counts as a change to the store. A bot's replies are `post_report` actions. A class that is off is refused, a class that needs approval waits for a person, and an automatic class runs until its daily cap, after which the bot says so once in the conversation and is refused until the 24 hours roll on. Moving money is never automatic. A refused bot request answers 403 and names its reason in the `Fluid-Bot-Refusal` header: `action_off`, `approval_required` or `cap_reached`.

    ## Approvals

    A request that needs approval waits on a card in the conversation the bot was asked in, and the bot's run pauses without holding a login. Someone who owns or stewards the bot, holds `we_bots.update` and every permission the request needs, and reads that conversation approves or declines it in the app. An approval names one exact request and its inputs, is used once, and expires after 72 hours; pausing or deleting the bot cancels it. A reply to an email never approves anything.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: bots
  description: Bots your company's admins own and steward, and their stewards.
  x-fluid-section: Settings
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: The session token of an admin of your company. Company API, partner and droplet installation tokens are refused.
    bot_run_auth:
      type: http
      scheme: bearer
      description: A bot's run login, minted for one run when it starts. Admin sessions and every other token are refused.
  parameters:
    BotId:
      name: id
      in: path
      required: true
      description: The bot's id.
      schema:
        type: string
        format: uuid
      example: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
    ApprovalId:
      name: approval_id
      in: path
      required: true
      description: The approval's id.
      schema:
        type: string
        format: uuid
      example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
    NestedBotId:
      name: bot_id
      in: path
      required: true
      description: The bot's id.
      schema:
        type: string
        format: uuid
      example: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
    TriggerId:
      name: id
      in: path
      required: true
      description: The trigger's id.
      schema:
        type: string
        format: uuid
      example: 019a0b1c-2d3e-7f40-8a51-6b7c8d9e0f12
    DocumentKind:
      name: kind
      in: path
      required: true
      description: Which document, `persona` (who the bot is, its tone, preferences and how it works) or `memory` (its notes, what it did and what it learned).
      schema:
        type: string
        enum:
        - persona
        - memory
      example: persona
  schemas:
    Meta:
      type: object
      description: Response metadata on every body. List endpoints add `pagination`.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      description: Cursor pagination. Follow `next_cursor` until it is null.
      required:
      - cursor
      - limit
      - prev_cursor
      - next_cursor
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: The cursor of this page.
        limit:
          type: integer
          description: The page size.
          example: 25
        prev_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the previous page, or null on the first.
        next_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the next page, or null on the last.
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: What went wrong.
            details:
              type: object
              additionalProperties: true
              description: Field-keyed errors; a refused write adds its reason as `type`.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    UnauthorizedError:
      type: object
      description: Bare 401 body, not the error envelope.
      required:
      - message
      properties:
        message:
          type: string
          example: Invalid credentials.
    ForbiddenError:
      description: |
        Bare 403 body: `{ error }` when a `we_bots` permission is missing, or `{ message }` when the credential is not an admin of the company signed in as themselves.
      oneOf:
      - type: object
        required:
        - error
        properties:
          error:
            type: string
            example: Not authorized.
      - type: object
        required:
        - message
        properties:
          message:
            type: string
            example: Not authorized.
    BotOwner:
      type: object
      description: The admin who owns the bot.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The owner's admin id.
        name:
          type:
          - string
          - 'null'
          description: The owner's name.
    Bot:
      type: object
      required:
      - id
      - kind
      - name
      - description
      - avatar_emoji
      - avatar_background_color
      - avatar_character
      - status
      - paused_reason
      - permission_keys
      - granted_by_admin_id
      - granted_at
      - lock_version
      - owner
      - recipient_id
      - relationship
      - can_change_limit
      - can_change_owner
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The bot's id.
        kind:
          type: string
          enum:
          - personal
          - shared
          description: '`personal` works for its owner; `shared` works for the team.'
        name:
          type: string
          description: The bot's display name.
        description:
          type:
          - string
          - 'null'
          description: What the bot is for.
        avatar_emoji:
          type:
          - string
          - 'null'
          description: The emoji shown as the bot's avatar.
        avatar_background_color:
          type:
          - string
          - 'null'
          description: The avatar's background color.
        avatar_character:
          description: The animated character the bot is drawn as, set by the template it was installed from; null for the emoji avatar.
          oneOf:
          - $ref: '#/components/schemas/BotCharacter'
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - paused
          description: A paused bot starts no runs.
        paused_reason:
          type:
          - string
          - 'null'
          enum:
          - owner
          - steward
          - owner_unavailable
          - bulk
          - null
          description: Why the bot is paused, or null while it is active. `owner_unavailable` means its owner left the company or was locked out; `bulk` means everything was paused at once.
        permission_keys:
          type: array
          items:
            type: string
          description: The keys the owner limited the bot to, when `permissions_limited` is true. Otherwise they do not narrow anything; a run acts with all of its owner's current keys.
        permissions_limited:
          type: boolean
          description: Whether the owner limited the bot to `permission_keys`. False, the default, means the bot can do everything its owner can.
        granted_by_admin_id:
          type: string
          format: uuid
          description: The admin who last set the bot's permission limit, or its owner when nobody has. It records who made the change; a run uses its owner's keys, not this admin's.
        granted_at:
          type: string
          format: date-time
          description: When the permission limit was last set, or when the bot was created.
        lock_version:
          type:
          - integer
          - 'null'
          description: Send it back on `PATCH` to refuse the change if someone else changed the bot first.
        owner:
          $ref: '#/components/schemas/BotOwner'
        recipient_id:
          type:
          - integer
          - 'null'
          description: The bot's Fluid Messaging recipient id, matching a conversation recipient's `id`; null until the bot first joins a conversation.
        relationship:
          type: string
          enum:
          - owner
          - steward
          description: Whether you own or steward this bot.
        can_change_limit:
          type: boolean
          description: Whether you may set or remove the bot's permission limit with `PUT /bots/{id}/grant`. True for its owner and for a Fluid root admin.
        can_change_owner:
          type: boolean
          description: Whether you may give the bot a new owner with `PUT /bots/{id}/owner`. True for its owner and a Fluid root admin always, and for a steward once the owner has left the company or been locked out.
        created_at:
          type: string
          format: date-time
          description: When the bot was created.
        updated_at:
          type: string
          format: date-time
          description: When the bot last changed.
    BotResponse:
      type: object
      required:
      - bot
      - status
      - meta
      properties:
        bot:
          $ref: '#/components/schemas/Bot'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotListResponse:
      type: object
      required:
      - bots
      - status
      - meta
      properties:
        bots:
          type: array
          items:
            $ref: '#/components/schemas/Bot'
          description: A page of bots, newest first.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotCreateRequest:
      type: object
      required:
      - bot
      properties:
        bot:
          type: object
          additionalProperties: false
          required:
          - name
          - kind
          description: The bot to create.
          properties:
            name:
              type: string
              maxLength: 120
              description: The display name.
            kind:
              type: string
              enum:
              - personal
              - shared
              description: '`personal` or `shared`.'
            description:
              type:
              - string
              - 'null'
              maxLength: 2000
              description: What the bot is for.
            avatar_emoji:
              type:
              - string
              - 'null'
              maxLength: 16
              description: The avatar emoji.
            avatar_background_color:
              type:
              - string
              - 'null'
              maxLength: 32
              description: The avatar's background color.
    BotCharacter:
      type: object
      additionalProperties: false
      description: A bot character, drawn by the shared BotCharacter component.
      required:
      - body
      - color
      - eyes
      - accessory
      properties:
        body:
          type: string
          enum:
          - round
          - square
          - capsule
          - blob
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        eyes:
          type: string
          enum:
          - dots
          - happy
          - wide
          - sleepy
        accessory:
          type: string
          enum:
          - none
          - antenna
          - headset
          - glasses
          - cap
          - bowtie
          - crown
          - magnifier
          - clipboard
          - megaphone
          - coin
          - box
          - heart
          - star
    BotUpdateRequest:
      type: object
      required:
      - bot
      properties:
        bot:
          type: object
          additionalProperties: false
          minProperties: 1
          description: The fields to change; only the ones sent change.
          properties:
            name:
              type: string
              maxLength: 120
              description: The display name.
            description:
              type:
              - string
              - 'null'
              maxLength: 2000
              description: What the bot is for.
            avatar_emoji:
              type:
              - string
              - 'null'
              maxLength: 16
              description: The avatar emoji.
            avatar_background_color:
              type:
              - string
              - 'null'
              maxLength: 32
              description: The avatar's background color.
            lock_version:
              type: integer
              minimum: 0
              description: The `lock_version` you last read; a mismatch answers 409.
    BotPauseAllResponse:
      type: object
      required:
      - paused_count
      - status
      - meta
      properties:
        paused_count:
          type: integer
          description: How many active bots were paused.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotGrantRequest:
      type: object
      required:
      - grant
      properties:
        grant:
          type: object
          additionalProperties: false
          required:
          - permission_keys
          description: The bot's limit from now on.
          properties:
            permission_keys:
              type: array
              items:
                type: string
              description: Explicit permission keys, each one you hold now. An empty list removes the limit, so the bot can do everything its owner can.
    BotOwnerRequest:
      type: object
      required:
      - owner
      properties:
        owner:
          type: object
          additionalProperties: false
          required:
          - admin_id
          description: The admin who will own the bot.
          properties:
            admin_id:
              type: string
              format: uuid
              description: The new owner's admin id, an admin of your company.
    BotOwnerCandidate:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The admin's id, to send as `owner.admin_id`.
        name:
          type:
          - string
          - 'null'
          description: The admin's name.
    BotOwnerCandidateListResponse:
      type: object
      required:
      - admins
      - status
      - meta
      properties:
        admins:
          type: array
          items:
            $ref: '#/components/schemas/BotOwnerCandidate'
          description: The admins who could own the bot, by name, at most 200.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotSteward:
      type: object
      required:
      - admin_id
      - name
      - created_at
      properties:
        admin_id:
          type: string
          format: uuid
          description: The steward's admin id.
        name:
          type:
          - string
          - 'null'
          description: The steward's name.
        created_at:
          type: string
          format: date-time
          description: When they became a steward.
    BotStewardResponse:
      type: object
      required:
      - steward
      - status
      - meta
      properties:
        steward:
          $ref: '#/components/schemas/BotSteward'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotStewardListResponse:
      type: object
      required:
      - stewards
      - status
      - meta
      properties:
        stewards:
          type: array
          items:
            $ref: '#/components/schemas/BotSteward'
          description: Every steward, in the order they were added. A bot has at most 20.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotStewardCreateRequest:
      type: object
      required:
      - steward
      properties:
        steward:
          type: object
          additionalProperties: false
          required:
          - admin_id
          description: The admin to make a steward.
          properties:
            admin_id:
              type: string
              format: uuid
              description: The id of another admin of your company.
    BotSeat:
      type: object
      required:
      - conversation_id
      - conversation_kind
      - conversation_name
      - added_at
      properties:
        conversation_id:
          type: string
          format: uuid
          description: The conversation's id.
        conversation_kind:
          type:
          - string
          - 'null'
          enum:
          - direct
          - group
          - channel
          - downline
          - null
          description: The kind of conversation; null for a legacy conversation with no kind.
        conversation_name:
          type:
          - string
          - 'null'
          description: The conversation's name, when it has one.
        added_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the bot joined the conversation.
    BotSeatResponse:
      type: object
      required:
      - seat
      - status
      - meta
      properties:
        seat:
          $ref: '#/components/schemas/BotSeat'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotDirectConversationResponse:
      type: object
      required:
      - conversation
      - status
      - meta
      properties:
        conversation:
          type: object
          additionalProperties: false
          required:
          - id
          - messaging_conversation_id
          properties:
            id:
              type: string
              format: uuid
              description: The conversation's id, as the seat endpoints take it.
            messaging_conversation_id:
              type: integer
              description: The conversation's id in the Fluid Messaging app, for linking to it.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotSeatCreateRequest:
      type: object
      required:
      - seat
      properties:
        seat:
          type: object
          additionalProperties: false
          required:
          - conversation_id
          description: The conversation to seat the bot in.
          properties:
            conversation_id:
              type: string
              format: uuid
              description: The id of a conversation you are in.
    BotPermissionRequestResponse:
      type: object
      required: [requested, status, meta]
      properties:
        requested:
          type: object
          required: [permission_key]
          properties:
            permission_key:
              type: string
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    BotHttpHost:
      type: object
      required: [id, host, approved_by_admin_id, approved_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        host:
          type: string
        approved_by_admin_id:
          type: [string, 'null']
        approved_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
    BotSecret:
      type: object
      required: [id, name, host, header_name, created_at]
      description: A secret without its value, which no response carries.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        host:
          type: string
        header_name:
          type: string
        created_at:
          type: string
          format: date-time
    BotRunMessage:
      type: object
      required:
      - id
      - conversation_id
      - run_id
      - body
      - required_keys
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The message's id.
        conversation_id:
          type: string
          format: uuid
          description: The conversation the reply was posted in.
        run_id:
          type: string
          format: uuid
          description: The run that posted it.
        body:
          type: string
          description: The reply as posted.
        blocks:
          type: array
          description: The interactive cards posted with the reply.
          items:
            $ref: '#/components/schemas/BotMessageBlock'
        required_keys:
          type: array
          items:
            type: string
          description: The permissions a reader must hold to see the reply; the run's effective grant.
        created_at:
          type: string
          format: date-time
          description: When the reply was posted.
    BotRunMessageResponse:
      type: object
      required:
      - message
      - status
      - meta
      properties:
        message:
          $ref: '#/components/schemas/BotRunMessage'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotRunMessageCreateRequest:
      type: object
      required:
      - message
      properties:
        message:
          type: object
          additionalProperties: false
          required:
          - body
          description: The reply to post.
          properties:
            body:
              type: string
              minLength: 1
              maxLength: 10000
              description: The reply's text.
            conversation_id:
              type: string
              format: uuid
              description: Optional. The conversation the run was woken in; any other is refused (`wrong_conversation`).
            blocks:
              type: array
              maxItems: 3
              description: Optional. Interactive cards to post with the reply. Text is trimmed to its limit; a malformed card refuses the post (`invalid`).
              items:
                $ref: '#/components/schemas/BotMessageBlock'
    BotMessageBlock:
      description: An interactive card. A `choices` card asks one question with two to four options, and `answered_option_id` records the first pick. An `integration` card offers a connection the bot can use.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - prompt
        - options
        properties:
          type:
            type: string
            enum:
            - choices
          prompt:
            type: string
            maxLength: 300
          options:
            type: array
            minItems: 2
            maxItems: 4
            items:
              type: object
              additionalProperties: false
              required:
              - label
              properties:
                id:
                  type: string
                  description: Optional on input; options default to A, B, C and D.
                label:
                  type: string
                  maxLength: 80
          answered_option_id:
            type:
            - string
            - 'null'
      - type: object
        additionalProperties: false
        required:
        - type
        - key
        - title
        properties:
          type:
            type: string
            enum:
            - integration
          key:
            type: string
          title:
            type: string
          description:
            type: string
          status:
            type: string
            enum:
            - available
            - added
    BotActionClass:
      type: object
      description: One kind of action a bot can take, the modes an owner may choose for it, and the permission keys it covers.
      required:
      - key
      - label
      - description
      - allowed_modes
      - default_mode
      - cap_fields
      - default_max_per_day
      - permission_keys
      properties:
        key:
          type: string
          description: The class's key.
          enum:
          - read
          - post_report
          - member_visible_post
          - create_discount
          - message_customer
          - change_store
          - money_movement
          - spend_extension
          example: money_movement
        label:
          type: string
          description: The class's name, as owners see it.
          example: Move money
        description:
          type: string
          description: What the class covers.
          example: Refund, delete, or mark an order paid or free. Never automatic.
        allowed_modes:
          type: array
          items:
            type: string
            enum:
            - 'off'
            - approval
            - automatic
          description: The modes an owner may choose. `off` refuses the action, `approval` holds it for a person's approval, and `automatic` runs it within its daily caps.
          example:
          - 'off'
          - approval
        default_mode:
          type: string
          enum:
          - 'off'
          - approval
          - automatic
          description: The mode the class has until an owner chooses one.
          example: approval
        cap_fields:
          type: array
          items:
            type: string
            enum:
            - max_per_day
            - max_value_cents_per_day
          description: The caps an owner may set for the class when it is automatic. Empty for a class that is never automatic, and for reads, which are never counted.
          example:
          - max_per_day
        default_max_per_day:
          type:
          - integer
          - 'null'
          description: How many automatic actions of the class may run in a rolling 24 hours when no cap is set, or null when the class is never counted.
          example: 25
        permission_keys:
          type: array
          items:
            type: string
          description: The permission keys whose endpoints are actions of this class. Every view key is `read` on a GET (on any other method it is `change_store`), and every write key no other class lists is `change_store`. Empty for a class of actions that need no key, such as a reply.
          example:
          - orders.delete
          - orders.mark_free
          - orders.mark_paid
          - refunds.create
          - refunds.update
    BotActionClassListResponse:
      type: object
      required:
      - action_classes
      - status
      - meta
      properties:
        action_classes:
          type: array
          items:
            $ref: '#/components/schemas/BotActionClass'
          description: Every action class, in the order owners see them.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotApproval:
      type: object
      description: One request a bot asked to make that waits on, or had, a person's decision. It names exactly one request, by its method, path and the SHA-256 digest of its canonical body, and authorizes it once.
      required:
      - id
      - bot_id
      - run_id
      - action_class
      - tool_key
      - http_method
      - path
      - inputs_digest
      - required_permission_keys
      - status
      - requested_at
      - expires_at
      - decided_at
      - decline_reason
      - consumed_at
      - conversation_id
      - decided_by
      properties:
        id:
          type: string
          format: uuid
          description: The approval's id.
        bot_id:
          type: string
          format: uuid
          description: The bot that asked.
        run_id:
          type: string
          format: uuid
          description: The run that waits on it.
        action_class:
          type: string
          description: The action class of the request (`GET /bot-action-classes`).
          example: change_store
        tool_key:
          type: string
          description: The bot's tool that makes the request.
          example: update_order_status
        http_method:
          type: string
          enum:
          - POST
          - PUT
          - PATCH
          - DELETE
          description: The request's method.
        path:
          type: string
          description: The request's path on the Fluid API.
          example: /api/orders/1234
        inputs_digest:
          type: string
          description: The SHA-256 hex digest of the request's canonical JSON body (keys sorted, numbers normalized). Approving sends it back.
          example: 5f2b8c3a1d4e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
        required_permission_keys:
          type: array
          items:
            type: string
          description: The keys the approver must hold.
          example:
          - orders.update
        status:
          type: string
          enum:
          - pending
          - approved
          - declined
          - expired
          - cancelled
          - consumed
          description: '`pending` waits for a decision; `approved` waits for the bot to make the request; `consumed` means the request was made, once. Declined, expired and cancelled approvals authorize nothing.'
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 72 hours after it was asked for.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decline_reason:
          type:
          - string
          - 'null'
          description: Why it was declined, when a reason was given or no one could decide it.
        consumed_at:
          type:
          - string
          - 'null'
          format: date-time
        conversation_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The conversation the card is in.
        decided_by:
          type:
          - object
          - 'null'
          description: Who decided it.
          required:
          - id
          - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type:
              - string
              - 'null'
    BotApprovalCard:
      description: An approval as its card shows it, with the request body and whether you may decide it.
      allOf:
      - $ref: '#/components/schemas/BotApproval'
      - type: object
        required:
        - inputs
        - can_decide
        properties:
          inputs:
            type: object
            description: The request's canonical JSON body.
            example:
              order:
                order_status: cancelled
          can_decide:
            type: boolean
            description: Whether you may approve or decline it now.
    BotApprovalResponse:
      type: object
      required:
      - approval
      - status
      - meta
      properties:
        approval:
          $ref: '#/components/schemas/BotApprovalCard'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotApprovalListResponse:
      type: object
      required:
      - approvals
      - status
      - meta
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/BotApproval'
          description: The bot's approvals, newest first, without their inputs.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotApprovalApproveRequest:
      type: object
      required:
      - approval
      properties:
        approval:
          type: object
          additionalProperties: false
          required:
          - inputs_digest
          properties:
            inputs_digest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: The `inputs_digest` the card showed. A different digest is refused (`inputs_changed`).
    BotApprovalDeclineRequest:
      type: object
      properties:
        approval:
          type: object
          additionalProperties: false
          properties:
            reason:
              type:
              - string
              - 'null'
              maxLength: 500
              description: Optional. Why, for the bot to pass on.
    BotEditor:
      type: object
      description: Who made a settings version.
      required:
      - kind
      - id
      - name
      properties:
        kind:
          type: string
          enum:
          - admin
          - system
          description: '`admin` for a change an admin made; `system` for one Fluid made.'
        id:
          type:
          - string
          - 'null'
          format: uuid
          description: The admin's id, or null for a `system` change.
        name:
          type:
          - string
          - 'null'
          description: The admin's name.
    BotBudget:
      type: object
      description: The bot's own spending caps, in US cents of the bot's model cost, counted on the AI Gateway's billing day and month (Pacific time) when each call happens. A null cap means no cap of that kind. Once a cap is spent the bot starts no runs (`budget_exhausted`) and a running one gets no more model calls. Your company's AI limits apply as well.
      required:
      - daily_cents
      - monthly_cents
      properties:
        daily_cents:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000000
          description: The most the bot may spend in a day, in US cents.
        monthly_cents:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000000
          description: The most the bot may spend in a month, in US cents. Never lower than the daily cap.
    BotLimits:
      type: object
      description: The bot's own limits.
      required:
      - budget
      properties:
        budget:
          $ref: '#/components/schemas/BotBudget'
    BotSettings:
      type: object
      description: A bot's current settings.
      required:
      - version
      - edited_by
      - edited_at
      - instructions
      - model
      - capabilities
      - connectors
      - limits
      properties:
        version:
          type: integer
          minimum: 0
          description: The current version number, 0 before the first change. Send it back as `base_version` when you change the settings.
        edited_by:
          oneOf:
          - $ref: '#/components/schemas/BotEditor'
          - type: 'null'
          description: Who made the current version, or null for version 0.
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the current version was made, or null for version 0.
        instructions:
          type: string
          maxLength: 16000
          description: What the owner tells the bot, added to Fluid's own instructions. Empty when none are set.
        model:
          type: string
          description: '`auto`, which picks a model for each turn, or the AI Gateway model the bot always uses, such as `anthropic/claude-opus-5.5`.'
        capabilities:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The capabilities the bot may use, from `GET /bots/{bot_id}/capabilities`, or null for every capability its grant covers (bots from before capabilities). A new bot starts with none.
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/BotConnectorRef'
          description: The sales-channel connectors whose data the bot may read, from `GET /bots/{bot_id}/connectors`. A new bot starts with none.
        limits:
          $ref: '#/components/schemas/BotLimits'
    BotSettingsResponse:
      type: object
      required:
      - settings
      - status
      - meta
      properties:
        settings:
          $ref: '#/components/schemas/BotSettings'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotSettingsUpdateRequest:
      type: object
      required:
      - settings
      properties:
        settings:
          type: object
          required:
          - base_version
          additionalProperties: false
          properties:
            base_version:
              type: integer
              minimum: 0
              description: The `version` you read. The change is refused with `stale_settings` if the settings changed since.
            instructions:
              type: string
              maxLength: 16000
              description: What to tell the bot. An empty string clears it.
            model:
              type: string
              minLength: 1
              maxLength: 200
              description: '`auto`, or the id of a text model (`type` `language`) from `GET /api/v202604/ai/models`. Any other id, an embedding or image model included, is refused with `unknown_model`.'
            capabilities:
              type:
              - array
              - 'null'
              maxItems: 50
              items:
                type: string
              description: The complete list of capabilities to enable, from `GET /bots/{bot_id}/capabilities`, or null for every capability the grant covers. A list that enables anything must include `use_ai`, without which the bot cannot think or reply (`invalid_settings`). An unknown key is refused with `unknown_capability`.
            connectors:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/BotConnectorRef'
              description: The complete list of sales-channel connectors to enable, from `GET /bots/{bot_id}/connectors`; an empty list turns every connector off. A provider your company has no connection to is refused with `unknown_connector`. The bot still needs the endpoint's permission to read the data.
            limits:
              type: object
              additionalProperties: false
              description: The bot's own limits. Replaces the stored limits, so a cap you leave out is cleared.
              properties:
                budget:
                  type: object
                  additionalProperties: false
                  properties:
                    daily_cents:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                      maximum: 10000000
                      description: The daily cap in US cents, or null for none.
                    monthly_cents:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                      maximum: 10000000
                      description: The monthly cap in US cents, or null for none. Must not be lower than the daily cap.
    BotSettingsVersion:
      type: object
      description: One change to a bot's settings.
      required:
      - number
      - edited_by
      - changed_fields
      - created_at
      properties:
        number:
          type: integer
          minimum: 1
          description: The version number, counting up from 1 for each bot.
        edited_by:
          $ref: '#/components/schemas/BotEditor'
        changed_fields:
          type: array
          items:
            type: string
          description: The fields this version changed, such as `avatar_emoji` or `instructions`.
        created_at:
          type: string
          format: date-time
          description: When the change was made.
    BotSettingsVersionSnapshot:
      description: One change to a bot's settings, with the profile and settings it left in place.
      allOf:
      - $ref: '#/components/schemas/BotSettingsVersion'
      - type: object
        required:
        - name
        - description
        - avatar_emoji
        - avatar_background_color
        - instructions
        - model
        - capabilities
        - connectors
        - limits
        properties:
          name:
            type: string
            description: The bot's name after this change.
          description:
            type:
            - string
            - 'null'
            description: The bot's description after this change.
          avatar_emoji:
            type:
            - string
            - 'null'
            description: The avatar emoji after this change.
          avatar_background_color:
            type:
            - string
            - 'null'
            description: The avatar background color after this change.
          instructions:
            type: string
            description: The owner's instructions after this change.
          model:
            type: string
            description: The model setting after this change.
          capabilities:
            type:
            - array
            - 'null'
            items:
              type: string
            description: The enabled capabilities after this change, or null for every capability.
          connectors:
            type: array
            items:
              $ref: '#/components/schemas/BotConnectorRef'
            description: The enabled sales-channel connectors after this change.
          limits:
            $ref: '#/components/schemas/BotLimits'
    BotSettingsVersionResponse:
      type: object
      required:
      - settings_version
      - status
      - meta
      properties:
        settings_version:
          $ref: '#/components/schemas/BotSettingsVersionSnapshot'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotSettingsVersionListResponse:
      type: object
      required:
      - settings_versions
      - status
      - meta
      properties:
        settings_versions:
          type: array
          items:
            $ref: '#/components/schemas/BotSettingsVersion'
          description: A page of versions, newest first.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotCapability:
      type: object
      description: One thing a bot can do, and whether it may.
      required:
      - key
      - label
      - description
      - permission_keys
      - enabled
      - available
      - missing_keys
      properties:
        key:
          type: string
          description: The capability key to send in `capabilities`.
          example: list_orders
        label:
          type: string
          description: The capability's name.
        description:
          type: string
          description: What the capability lets the bot do.
        permission_keys:
          type: array
          items:
            type: string
          description: The permission keys the capability needs.
        enabled:
          type: boolean
          description: Whether the bot's current settings enable it.
        available:
          type: boolean
          description: Whether the bot's grant holds every key it needs and the bot's granter still holds them. An enabled capability that is not available does nothing until the grant covers it.
        missing_keys:
          type: array
          items:
            type: string
          description: The keys the grant or the granter lacks, empty when available.
    BotCapabilityListResponse:
      type: object
      required:
      - capabilities
      - status
      - meta
      properties:
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/BotCapability'
          description: Every capability.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotConnector:
      type: object
      description: A connected integration a bot could read your company's data through. Every connector is off for a bot until its owner enables it.
      required:
      - kind
      - provider
      - display_name
      - connected
      - enabled
      properties:
        kind:
          type: string
          enum:
          - sales_channel
          description: The connector kind. Sales channels are the only kind.
        provider:
          type: string
          description: The sales channel, such as `amazon` or `tiktok`. One connector covers every connection to it.
        display_name:
          type:
          - string
          - 'null'
          description: The name of the provider's main connection.
        connected:
          type: boolean
          description: Whether any connection to the provider is connected now.
        enabled:
          type: boolean
          description: Whether the bot's current settings let it read this provider's data.
    BotCatalogConnectorTool:
      type: object
      description: One tool of an app connector.
      required:
      - name
      - effect
      - description
      properties:
        name:
          type: string
          description: The tool's name, as a bot is offered it.
          example: gmail_search
        effect:
          type: string
          enum:
          - read
          - write
          - send
          - delete
          description: What the tool does outside Fluid.
        description:
          type: string
          description: What the tool does, for people.
    BotCatalogConnector:
      type: object
      description: One connector a bot can be connected to, and whether your company allows it.
      required:
      - key
      - name
      - kind
      - provider
      - description
      - tools
      - enabled
      - changed_by
      - changed_at
      properties:
        key:
          type: string
          description: The connector's key. Send it in `PUT /bot-connectors/{key}`.
          example: gmail
        name:
          type: string
          example: Gmail
        kind:
          type: string
          enum:
          - app_connector
          - mcp_server
          description: '`app_connector` for one of Fluid''s approved apps, `mcp_server` for remote MCP servers added by URL.'
        provider:
          type: string
          description: Whose account a connection acts as, such as `google`, `microsoft`, `github` or `mcp`.
        description:
          type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/BotCatalogConnectorTool'
          description: The connector's tools. Empty for remote MCP servers, whose tools are listed when one is connected.
        enabled:
          type: boolean
          description: Whether your company lets people connect it. App connectors are allowed and remote MCP servers are not until an admin chooses.
        changed_by:
          oneOf:
          - type: object
            required:
            - id
            - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type:
                - string
                - 'null'
          - type: 'null'
          description: The admin who last chose, or null while the connector has its default.
        changed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an admin last chose, or null.
    BotCatalogConnectorListResponse:
      type: object
      required:
      - bot_connectors
      - status
      - meta
      properties:
        bot_connectors:
          type: array
          items:
            $ref: '#/components/schemas/BotCatalogConnector'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    BotCatalogConnectorUpdateRequest:
      type: object
      required:
      - connector
      additionalProperties: false
      properties:
        connector:
          type: object
          required:
          - enabled
          additionalProperties: false
          properties:
            enabled:
              type: boolean
              description: true to let people connect it, false to stop them.
    BotConnectionTool:
      type: object
      required:
      - name
      - description
      - effect
      - enabled
      properties:
        name:
          type: string
          example: search_tickets
        description:
          type: string
        effect:
          type: string
          enum:
          - read
          - write
          - send
          - delete
          description: What the tool does outside Fluid. For an MCP server it comes from the server's hints; a tool not marked read-only or destructive is a write.
        enabled:
          type: boolean
          description: Whether bots may use it. Every tool starts off.
    BotConnection:
      type: object
      description: A link to an outside account or remote MCP server that bots can use. Secrets are never returned.
      required:
      - id
      - kind
      - scope
      - connector_key
      - name
      - mcp_host
      - status
      - connected_by_admin_id
      - has_api_key
      - tools_refreshed_at
      - last_used_at
      - created_at
      - tools
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - app_connector
          - mcp_server
        scope:
          type: string
          enum:
          - personal
          - company
          description: '`personal` for bots the connecting person owns or stewards, `company` for every bot in the company.'
        connector_key:
          type: string
          description: The catalogue key, from `GET /bot-connectors`. `remote_mcp` for an MCP server.
        name:
          type: string
        mcp_host:
          type:
          - string
          - 'null'
          description: The MCP server's host, or null for an app connector. The full URL is stored encrypted and never returned, since it can carry a token.
        status:
          type: string
          enum:
          - active
          - broken
          - disabled
          - revoked
        connected_by_admin_id:
          type: string
          format: uuid
          description: The admin who connected it, whose account it acts as.
        has_api_key:
          type: boolean
          description: Whether an API key is stored. The key itself is never returned.
        tools_refreshed_at:
          type:
          - string
          - 'null'
          format: date-time
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        tools:
          type: array
          items:
            $ref: '#/components/schemas/BotConnectionTool'
    BotConnectionResponse:
      type: object
      required:
      - bot_connection
      - status
      - meta
      properties:
        bot_connection:
          $ref: '#/components/schemas/BotConnection'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    BotConnectionListResponse:
      type: object
      required:
      - bot_connections
      - status
      - meta
      properties:
        bot_connections:
          type: array
          items:
            $ref: '#/components/schemas/BotConnection'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    BotConnectionCreateRequest:
      type: object
      required:
      - connection
      additionalProperties: false
      properties:
        connection:
          type: object
          required:
          - kind
          - scope
          - name
          - url
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
              - mcp_server
              description: Only `mcp_server` for now; app connectors connect through their provider's consent screen.
            scope:
              type: string
              enum:
              - personal
              - company
              description: '`company` needs the `company_settings.update` permission.'
            name:
              type: string
              maxLength: 120
            url:
              type: string
              maxLength: 2048
              description: The server's https MCP endpoint. A private or internal address is refused.
            api_key:
              type:
              - string
              - 'null'
              maxLength: 4096
              description: Sent to the server as a bearer token, stored encrypted and never returned.
    BotConnectionUpdateRequest:
      type: object
      required:
      - connection
      additionalProperties: false
      properties:
        connection:
          type: object
          required:
          - enabled_tools
          additionalProperties: false
          properties:
            enabled_tools:
              type: array
              maxItems: 200
              items:
                type: string
              description: The complete list of tool names to switch on; every other tool is switched off.
    BotConnectorRef:
      type: object
      description: One enabled connector in a bot's settings.
      required:
      - kind
      - provider
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - sales_channel
          description: The connector kind. Only `sales_channel` for now.
        provider:
          type: string
          description: The sales channel, such as `amazon`, `meta`, `tiktok`, `pinterest` or `google`.
          example: amazon
    BotConnectorListResponse:
      type: object
      required:
      - connectors
      - status
      - meta
      properties:
        connectors:
          type: array
          items:
            $ref: '#/components/schemas/BotConnector'
          description: One connector per sales channel your company has connected.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotRun:
      type: object
      description: One attempt to run a bot, including a start that was refused.
      required:
      - id
      - trigger_kind
      - status
      - refusal_reason
      - failure_reason
      - on_behalf_of
      - settings_version
      - effective_permission_keys
      - created_at
      - deadline_at
      - ended_at
      properties:
        id:
          type: string
          format: uuid
          description: The run's id.
        trigger_kind:
          type: string
          description: What started the run. `manual` for a run its owner started, `mention` for one woken by a message in a conversation, `introduce` for a new bot greeting its owner, and `schedule`, `event` or `webhook` for one a trigger fired.
          example: mention
        api_calls_count:
          type: integer
          description: How many Fluid API calls the run made.
        status:
          type: string
          enum:
          - running
          - parked
          - succeeded
          - failed
          - refused
          description: '`parked` means the run waits on an approval; `refused` means it never started, and `refusal_reason` says why.'
        refusal_reason:
          type:
          - string
          - 'null'
          enum:
          - disabled
          - paused
          - grant_empty
          - company_roles_missing
          - credential_unavailable
          - busy
          - budget_exhausted
          - null
          description: Why a refused run did not start, or null. `disabled` means bots were off for your company or the bot was deleted; `paused` that it was paused, or its owner left or was locked out; `grant_empty` that none of its permissions were held by the people it would act for, or its enabled capabilities left it none it could use; `company_roles_missing` that your company has no roles; `credential_unavailable` that its run login could not be made; `busy` that it was already running; `budget_exhausted` that it had spent a budget cap in its settings.
        failure_reason:
          type:
          - string
          - 'null'
          enum:
          - runtime_unavailable
          - null
          description: Why a run that started failed, when known, or null. A run ended by a pause or its deadline has none.
        on_behalf_of:
          $ref: '#/components/schemas/BotOwner'
        settings_version:
          type: integer
          minimum: 0
          description: The settings version the run used (`GET /bots/{bot_id}/settings-versions/{number}`); 0 for the settings before the first change.
        effective_permission_keys:
          type: array
          items:
            type: string
          description: The permission keys the run held. Empty for a refused run.
        created_at:
          type: string
          format: date-time
          description: When the run started or was refused.
        deadline_at:
          type: string
          format: date-time
          description: When the run's login stops working.
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the run ended, or null while it runs.
    BotRunResponse:
      type: object
      required:
      - run
      - status
      - meta
      properties:
        run:
          $ref: '#/components/schemas/BotRun'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotRunListResponse:
      type: object
      required:
      - runs
      - status
      - meta
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BotRun'
          description: A page of runs, newest first.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotTriggerScheduleConfig:
      type: object
      additionalProperties: false
      description: A schedule trigger's config.
      required:
      - cron
      - timezone
      - next_fire_at
      properties:
        cron:
          type: string
          description: A five-field cron expression (minute hour day month weekday), read in `timezone`.
          example: 0 8 * * *
        timezone:
          type: string
          description: The IANA time zone the cron is read in.
          example: America/Denver
        next_fire_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the schedule next fires; its cron occurrence plus a fixed offset of up to five minutes that spreads schedules sharing a time.
    BotTriggerEventConfig:
      type: object
      additionalProperties: false
      description: An event trigger's config.
      required:
      - trigger_key
      properties:
        trigger_key:
          type: string
          description: The store event, as a public webhook topic key from `GET /bot-trigger-topics`.
          example: cart.updated
    BotTriggerWebhookField:
      type: object
      additionalProperties: false
      description: A typed field an inbound webhook delivery may carry. Only declared fields that parse to their type reach the bot.
      required:
      - name
      - type
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The field's name in the delivery body.
        type:
          type: string
          enum:
          - string_enum
          - integer
          - decimal
          - boolean
          - fluid_id
          description: The field's type. Free text is never accepted.
        values:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 50
          description: For `string_enum`, the values the field may take.
        resource:
          type: string
          enum:
          - order
          - cart
          - subscription
          - member
          - product
          description: For `fluid_id`, the resource the id names. The bot's grant must hold that resource's view permission.
    BotTriggerWebhookConfig:
      type: object
      additionalProperties: false
      description: A webhook trigger's config. Its signing secret is never returned.
      required:
      - inbound_url
      - fields
      - previous_secret_expires_at
      properties:
        inbound_url:
          type: string
          format: uri
          description: Where a sender posts deliveries. It names the trigger by id; it is an address, not a credential, since every delivery must be signed with the trigger's secret.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/BotTriggerWebhookField'
          maxItems: 20
          description: The fields a delivery may carry.
        previous_secret_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Until when the secret replaced by the last rotation still verifies, or null.
    BotTrigger:
      type: object
      required:
      - id
      - bot_id
      - kind
      - name
      - enabled
      - conversation_id
      - window_seconds
      - config
      - created_by_admin_id
      - changed_by_admin_id
      - changed_at
      - lock_version
      - last_fired_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The trigger's id.
        bot_id:
          type: string
          format: uuid
          description: The bot it wakes.
        kind:
          type: string
          enum:
          - schedule
          - event
          - webhook
          description: What wakes the bot.
        name:
          type: string
          description: The trigger's name.
        enabled:
          type: boolean
          description: A disabled trigger wakes nothing.
        conversation_id:
          type: string
          format: uuid
          description: The admin-only conversation the bot's runs from this trigger post into.
        window_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: For an event trigger, how long store events gather into one run, from the first one.
        last_fired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the trigger last started (or, for a schedule, queued) a run; null until it first fires.
        config:
          description: What the kind stores.
          oneOf:
          - $ref: '#/components/schemas/BotTriggerScheduleConfig'
          - $ref: '#/components/schemas/BotTriggerEventConfig'
          - $ref: '#/components/schemas/BotTriggerWebhookConfig'
        created_by_admin_id:
          type: string
          format: uuid
          description: The admin who created the trigger.
        changed_by_admin_id:
          type: string
          format: uuid
          description: The admin who last changed it.
        changed_at:
          type: string
          format: date-time
          description: When it was last changed.
        lock_version:
          type: integer
          description: Send it back on `PATCH`; a mismatch answers 409.
        created_at:
          type: string
          format: date-time
          description: When the trigger was created.
        updated_at:
          type: string
          format: date-time
          description: When the trigger last changed.
    BotTriggerResponse:
      type: object
      required:
      - trigger
      - status
      - meta
      properties:
        trigger:
          $ref: '#/components/schemas/BotTrigger'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotTriggerListResponse:
      type: object
      required:
      - triggers
      - status
      - meta
      properties:
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/BotTrigger'
          description: Every trigger of the bot, oldest first. A bot has at most 20.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotTriggerConfigRequest:
      type: object
      description: The kind's config. A schedule takes `cron` (firing at most once every 15 minutes) and `timezone`; an event takes `trigger_key`; a webhook takes `secret` (on create) and `fields` (optional, at most 20). A key the kind does not take is refused.
      properties:
        cron:
          type: string
          maxLength: 200
          description: A five-field cron expression.
        timezone:
          type: string
          maxLength: 64
          description: An IANA time zone, such as `America/Denver`.
        trigger_key:
          type: string
          maxLength: 120
          description: The event's trigger key.
        secret:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 256
          description: A new webhook trigger's signing secret, 32 to 256 printable characters, chosen by its sender. Required on create; Fluid stores it encrypted and never returns it. Change it with `rotate-secret`.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/BotTriggerWebhookField'
          maxItems: 20
          description: The webhook's declared fields.
    BotTriggerCreateRequest:
      type: object
      required:
      - trigger
      properties:
        trigger:
          type: object
          required:
          - kind
          - name
          - conversation_id
          description: The trigger to create.
          properties:
            kind:
              type: string
              enum:
              - schedule
              - event
              - webhook
              description: What wakes the bot.
            name:
              type: string
              maxLength: 120
              description: The trigger's name.
            conversation_id:
              type: string
              format: uuid
              description: A conversation of your company that seats the bot and that only admins read.
            enabled:
              type: boolean
              description: Defaults to true.
            window_seconds:
              type: integer
              minimum: 60
              maximum: 3600
              description: For an event trigger, how long store events gather into one run. Defaults to 300.
            config:
              $ref: '#/components/schemas/BotTriggerConfigRequest'
    BotTriggerUpdateRequest:
      type: object
      required:
      - trigger
      properties:
        trigger:
          type: object
          required:
          - lock_version
          minProperties: 2
          description: The fields to change; only the ones sent change. `config`, when sent, replaces the kind's config whole. A trigger's kind never changes.
          properties:
            lock_version:
              type: integer
              minimum: 0
              description: The `lock_version` you last read; a mismatch answers 409.
            name:
              type: string
              maxLength: 120
              description: The trigger's name.
            conversation_id:
              type: string
              format: uuid
              description: A conversation of your company that seats the bot and that only admins read.
            enabled:
              type: boolean
              description: Whether the trigger wakes the bot.
            window_seconds:
              type: integer
              minimum: 60
              maximum: 3600
              description: For an event trigger, how long store events gather into one run.
            config:
              $ref: '#/components/schemas/BotTriggerConfigRequest'
    BotTriggerSecretRotationRequest:
      type: object
      required:
      - rotation
      properties:
        rotation:
          type: object
          additionalProperties: false
          required:
          - secret
          description: The new secret.
          properties:
            secret:
              type: string
              writeOnly: true
              minLength: 32
              maxLength: 256
              description: The new signing secret, 32 to 256 printable characters.
    BotTriggerTopic:
      type: object
      required:
      - key
      - label
      - required_permission
      properties:
        key:
          type: string
          description: The trigger key, a public webhook topic.
          example: cart.updated
        label:
          type: string
          description: What the event is, for people.
        required_permission:
          type: string
          description: The permission the bot's grant must hold to subscribe.
          example: orders.view
    BotTriggerTopicListResponse:
      type: object
      required:
      - topics
      - status
      - meta
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/BotTriggerTopic'
          description: Every topic an event trigger can listen to.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotDocument:
      type: object
      required:
      - kind
      - version
      - body
      - author_run_id
      - author_admin_id
      - source_message_id
      - reverted_from_version
      - created_at
      properties:
        kind:
          type: string
          enum:
          - persona
          - memory
          description: Which document this is.
        version:
          type: integer
          minimum: 0
          description: The version number. Each save adds one. Version 0 is the default a bot starts with, never saved.
        body:
          type: string
          description: The whole document, in markdown. At most 32 KB.
        author_run_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The run that saved this version, or null when an admin saved it.
        author_admin_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The admin who saved this version, or the admin the run that saved it acted for.
        source_message_id:
          type:
          - integer
          - 'null'
          description: The message that woke the run that saved this version, when a message did.
        reverted_from_version:
          type:
          - integer
          - 'null'
          description: The earlier version this one restores, when it is a revert.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When this version was saved; null for version 0.
    BotDocumentResponse:
      type: object
      required:
      - document
      - status
      - meta
      properties:
        document:
          $ref: '#/components/schemas/BotDocument'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotDocumentListResponse:
      type: object
      required:
      - documents
      - status
      - meta
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/BotDocument'
          description: The document's saved versions, newest first, at most 50.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    BotDocumentUpdateRequest:
      type: object
      required:
      - document
      properties:
        document:
          type: object
          additionalProperties: false
          required:
          - body
          description: The new version.
          properties:
            body:
              type: string
              description: The whole new document, in markdown, at most 32 KB. It replaces the current version.
    BotDocumentRevertRequest:
      type: object
      required:
      - document
      properties:
        document:
          type: object
          additionalProperties: false
          required:
          - version
          description: The version to go back to.
          properties:
            version:
              type: integer
              minimum: 1
              description: A saved version of this document.
    BotRunAction:
      type: object
      required:
      - id
      - run_id
      - action_class
      - permission_key
      - value_cents
      - executed_at
      properties:
        id:
          type: string
          format: uuid
          description: The action's id.
        run_id:
          type: string
          format: uuid
          description: The run that took it.
        action_class:
          type: string
          description: The kind of action, as `GET /bot-action-classes` lists them.
        permission_key:
          type:
          - string
          - 'null'
          description: The permission the action used.
        value_cents:
          type:
          - integer
          - 'null'
          description: The money the action moved, in cents, when it moved any.
        executed_at:
          type: string
          format: date-time
          description: When it was taken.
    BotRunActionListResponse:
      type: object
      required:
      - actions
      - status
      - meta
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/BotRunAction'
          description: The bot's 50 newest actions, newest first.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
  responses:
    Unauthorized:
      description: Missing or invalid bearer token. The body is a bare `{ message }`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            message: Invalid credentials.
    Forbidden:
      description: Authenticated, but not an admin of the company signed in as themselves, or without the `we_bots` permission the endpoint needs. The body is bare.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
          example:
            message: Not authorized.
    NotFound:
      description: No bot by that id that you own or steward, or bots are not turned on for your company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Bot not found
              details: {}
            status: 404
            meta:
              request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-21T15:32:08Z'
    FlagNotFound:
      description: Bots are not turned on for your company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Not found
              details: {}
            status: 404
            meta:
              request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-21T15:32:08Z'
    TriggerNotFound:
      description: No bot by that id you own or steward, no trigger of it by that id, or bots are not turned on for your company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Trigger not found
              details: {}
            status: 404
            meta:
              request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-22T15:32:08Z'
paths:
  /api/company/v2026-10/bots:
    get:
      operationId: companyBotsIndex
      summary: List your bots
      description: |-
        The bots you own or steward, newest first, a page at a time. Follow `meta.pagination.next_cursor` until it is null.

        Needs the `we_bots.view` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: page[limit]
        in: query
        required: false
        description: Bots per page, 1 to 100. Defaults to 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: page[cursor]
        in: query
        required: false
        description: A cursor from `meta.pagination`, to read another page.
        schema:
          type: string
      responses:
        '200':
          description: A page of bots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotListResponse'
              example:
                bots:
                - id: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  kind: shared
                  name: Order helper
                  description: Follows up on unpaid orders.
                  avatar_emoji: null
                  avatar_background_color: null
                  avatar_character: null
                  status: active
                  paused_reason: null
                  permission_keys:
                  - orders.view
                  granted_by_admin_id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a1b
                  granted_at: '2026-10-21T15:32:08.000Z'
                  lock_version: 1
                  owner:
                    id: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a1b
                    name: Patrick Reeves
                  recipient_id: 4812
                  relationship: steward
                  can_change_limit: false
                  can_change_owner: false
                  created_at: '2026-10-21T15:32:08.000Z'
                  updated_at: '2026-10-21T15:40:00.000Z'
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-21T15:32:08Z'
                  pagination:
                    cursor: null
                    limit: 25
                    prev_cursor: null
                    next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/FlagNotFound'
        '422':
          description: An invalid page limit or cursor.
          content:
            application/json:
              schema:
