                  last_used_at:
                  created_at: '2026-10-25T09:00:00.000Z'
                  tools:
                  - name: search_tickets
                    description: Find tickets.
                    effect: read
                    enabled: false
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: You lack the permission the endpoint needs, or may not change this connection (`not_connector`). A personal connection is changed only by the person who connected it, a company connection only by an admin who has `company_settings.update` now.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/ForbiddenError'
              example:
                error:
                  message: Only the person who connected this can change it
                  details:
                    type: not_connector
                status: 403
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '404':
          description: No connection by that id that you can see, or bots are not turned on for your company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Connection not found
                  details: {}
                status: 404
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
        '422':
          description: The body is not valid, names a tool the connection lacks (`unknown_tool`), or arrived while a refresh changed the tools (`tools_changed`), so review them and switch again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: 'Unknown tools: export'
                  details:
                    type: unknown_tool
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-25T09:00:00Z'
    delete:
      operationId: companyBotConnectionsDestroy
      summary: Disconnect
      description: |-
