  /api/company/v2026-10/bot-runs/current/messages:
    post:
      operationId: companyBotRunMessagesCreate
      summary: Post a running bot's reply
      description: |-
        Post the reply of the run whose login signs the request, as its bot, into the conversation the run was woken in. Only a run login reaches this endpoint.

        The reply is written only while the run is running and before its deadline, and while the bot is still seated in the conversation (`not_seated`). Who reads the conversation does not decide the reply: the run acts with the bot owner's keys (D-422).

        Send an `Idempotency-Key` header naming the post. Posting again with the same key answers the first reply with 200; the same key with a different body is refused (`idempotency_conflict`).

        A reply with no cards that mostly repeats a card the same run already posted in the conversation (half or more of its words of four letters or more are the card's) is not posted again: the answer is that card, with 200 (D-442).
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bot_run_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Names this post for the run, at most 255 characters.
        schema:
          type: string
          minLength: 1
          maxLength: 255
        example: session-4f1c:call-7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotRunMessageCreateRequest'
            example:
              message:
                body: Carts are up 12% on last week.
      responses:
        '200':
          description: The reply an earlier request with this idempotency key posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotRunMessageResponse'
              example:
                message:
                  id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a70
                  conversation_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  run_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a80
                  body: Carts are up 12% on last week.
                  required_keys:
                  - orders.view
                  created_at: '2026-10-22T15:45:00.000Z'
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:45:02Z'
        '201':
          description: The reply, posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotRunMessageResponse'
              example:
                message:
                  id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a70
                  conversation_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60
                  run_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a80
                  body: Carts are up 12% on last week.
                  required_keys:
                  - orders.view
                  created_at: '2026-10-22T15:45:00.000Z'
                status: 201
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:45:00Z'
        '401':
          description: Missing or invalid bearer token, or a run login whose run has ended, passed its deadline, or whose bot is paused or deleted. The body is a bare `{ message }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
              example:
                message: Invalid credentials.
        '403':
          description: Authenticated with something other than a run login. The body is a bare `{ message }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
              example:
                message: Only a running bot can post here
        '409':
          description: The run is no longer open (`run_not_open`), the bot is not seated in the conversation (`not_seated`), the idempotency key was used for a different reply (`idempotency_conflict`), or the bot's autonomy settings turn replies off (`action_off`), hold them for approval (`approval_required`) or have reached their daily cap (`cap_reached`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The bot is no longer in this conversation
                  details:
                    type: not_seated
                status: 409
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:45:00Z'
        '422':
          description: Invalid parameters, a missing or overlong `Idempotency-Key` (`idempotency_key_required`), a run not woken in a conversation (`no_conversation`), or a `conversation_id` other than the run's (`wrong_conversation`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: A run posts only into the conversation it was started in
                  details:
                    type: wrong_conversation
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:45:00Z'
  /api/company/v2026-10/bot-action-classes:
    get:
      operationId: companyBotActionClassesIndex
      summary: List the kinds of action a bot can take
      description: |-
        Every action class, with the modes an owner may choose for it, the mode it has until one is chosen, the caps it runs under when automatic, and the permission keys whose endpoints are actions of that class. The list is the same for every bot and is not paginated.

        Fluid checks a bot's every request against its class: a read always runs, a class that is off is refused, a class that needs approval is held for a person, and an automatic class runs until its daily cap. Moving money and spending past a run's ceiling are never automatic.

        Needs the `we_bots.view` permission.
      tags:
      - bots
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The action classes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotActionClassListResponse'
              example:
                action_classes:
                - key: money_movement
                  label: Move money
                  description: Refund, delete, or mark an order paid or free. Never automatic.
                  allowed_modes:
                  - 'off'
                  - approval
                  default_mode: approval
                  cap_fields: []
                  default_max_per_day:
                  permission_keys:
                  - orders.delete
                  - orders.mark_free
                  - orders.mark_paid
                  - refunds.create
                  - refunds.update
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:40:00Z'
