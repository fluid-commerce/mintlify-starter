---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Droplets
  description: Query an installed Droplet backend using the bearer member’s
    identity. No account-host cookie, site context, CSRF token or member-storefront
    feature flag is required. A supported writable member credential is required;
    a legacy member JWT, or a portal JWT minted read-only, is read-only and refused. The operation name and parameters are Droplet-defined,
    not a server-enforced read-only allowlist.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: droplets
  description: Bounded member data queries to installed Droplet backends.
  x-fluid-section: Members
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: >-
        A writable opaque member token, portal (user-company) JWT or supported verified identity access token in the Authorization: Bearer header.
        The credential alone identifies the member and company. A legacy member session JWT, and a portal JWT
        minted read-only, are refused with 403, as are other read-only credentials.
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          description: The error message and field-keyed details.
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Machine-readable details, keyed by field where a field
                is at fault.
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
  responses:
    Error:
      description: Standard member error. Backend 4xx/5xx status and bounded response
        are retained under error.details.backend_response.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
paths:
  "/api/member/v2026-10/droplet-queries":
    post:
      tags:
      - droplets
      operationId: member_droplets_query
      summary: Query an installed Droplet backend
      description: Send at most 64 KiB of JSON. Identity comes only from the member
        credential. Supply exactly one extension or droplet_uuid. The extension must be published and actively installed in the
        member’s company, its section or block template active, and its Droplet operational.
        Alternatively, droplet_uuid selects the installed, available operational Droplet directly,
        without any theme extension, template, marketplace publication or Members Site requirement.
        Use the existing public drp_ UUID returned by Droplet management APIs.
        The backend receives server-signed company/member identity; canonical widget_type is included
        only for extension queries and omitted for direct queries.
        Successful replies must be JSON objects no larger than 256 KiB. Redirects
        and unsafe network destinations are refused. At most 60 queries per UTC minute
        per company/member/Droplet, shared with the browser cookie endpoint across
        operations. Unknown envelope keys, query parameters and X-Fluid-Theme are
        refused. Authentication and credential write policy run before payload errors.
        Responses are private and no-store; no browser session_context is returned.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - operation
              - params
              oneOf:
              - required: [extension]
                not:
                  required: [droplet_uuid]
              - required: [droplet_uuid]
                not:
                  required: [extension]
              properties:
                droplet_uuid:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^\x00-\x1F\x7F]+$'
                  description: Existing public UUID of an actively installed, available operational Droplet. Mutually exclusive with extension.
                  example: drp_testdroplet0000000000000000000000
                extension:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Canonical published section or block extension URI.
                  example: fluid://extensions/42/sections/commission-summary
                operation:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: "^[a-zA-Z0-9][a-zA-Z0-9_.:-]*$"
                  description: Operation supported and authorized by the Droplet backend.
                  example: commissions.summary
                params:
                  type: object
                  additionalProperties: true
                  description: Droplet-defined operation parameters; they cannot override
                    signed top-level identity.
                  example:
                    period: 2026-09
            example:
              extension: fluid://extensions/42/sections/commission-summary
              operation: commissions.summary
              params:
                period: 2026-09
      responses:
        '200':
          description: The bounded backend JSON object.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    additionalProperties: true
                    description: Droplet backend response object.
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
              example:
                data:
                  total: '25.00'
                meta:
                  request_uuid: '0196aabe-725d-7000-8000-000000000001'
                  timestamp: '2026-10-15T12:00:00Z'
        '400':
          "$ref": "#/components/responses/Error"
        '401':
          "$ref": "#/components/responses/Error"
        '403':
          "$ref": "#/components/responses/Error"
        '404':
          "$ref": "#/components/responses/Error"
        '409':
          "$ref": "#/components/responses/Error"
        '410':
          "$ref": "#/components/responses/Error"
        '413':
          "$ref": "#/components/responses/Error"
        '422':
          "$ref": "#/components/responses/Error"
        '429':
          "$ref": "#/components/responses/Error"
        '500':
          "$ref": "#/components/responses/Error"
        '502':
          "$ref": "#/components/responses/Error"
        '503':
          "$ref": "#/components/responses/Error"
        '504':
          "$ref": "#/components/responses/Error"
        default:
          "$ref": "#/components/responses/Error"
