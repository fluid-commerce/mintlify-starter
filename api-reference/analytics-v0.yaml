---
openapi: 3.1.0
info:
  title: Fluid Analytics v0 API
  version: v0
  description: >-
    Company-facing analytics endpoints: the unversioned analytics summary and traffic (overview, campaigns, sources, geography, flows, reps) reads that back the Traffic tab in the fluid admin. Bearer-authenticated,
    one shared reporting-period contract across every traffic read.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
- url: https://{company}.fluid.app
  description: Production server with company subdomain
  variables:
    company:
      default: myco
      description: Company subdomain
tags:
- name: analytics
  description: >-
    Analytics reads: the store's traffic overview, ranked campaigns / sources / geographies / flows, per-rep breakdown, and the legacy shares/views/visitors summary. All reads accept the shared reporting-period
    contract.
paths:
  "/api/analytics":
    get:
      summary: Get analytics summary
      tags:
      - analytics
      operationId: company_v0_get_analytics_summary
      description: |
        Returns analytics summary for the current user.

        When the user has affiliate data, returns metrics including:
        - Unique visitors
        - Total views
        - Total leads
        - Total shares
        - Conversion rates
        - Top performing content

        Returns an empty object if no analytics data is available.
      security:
      - bearer_auth: []
      parameters:
      - name: start_date
        in: query
        required: false
        description: Start date for analytics period (ISO 8601 format)
        schema:
          type: string
      - name: end_date
        in: query
        required: false
        description: End date for analytics period (ISO 8601 format)
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyAnalyticsSummaryResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
  "/api/analytics/all":
    get:
      operationId: commerce_v0_analytics_all_get
      summary: Get all analytics
      tags:
      - analytics
      description: |
        Returns the calling company's rep-activity summary bucketed by
        every supported reporting period at once — `today`, `1d`, `3m`,
        `6m`, `1m`, `1y`, and `ytd`. Each bucket carries three parallel
        series: `shares`, `views`, and `visitors`. Bearer-authenticated;
        no request body or query parameters.

        Prefer the dated `analytics-v2026-04` Home dashboard endpoints
        (`/api/v202604/analytics/dashboard/*`) for new integrations —
        each dashboard card there answers one question with a
        purpose-built payload, whereas this endpoint returns every
        period together for a fluid-admin legacy report shape.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyAnalyticsAllResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      security:
      - bearer_auth: []
  "/api/analytics/traffic/campaign-summary":
    get:
      summary: Get traffic campaign summary
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_campaign_summary
      description: |
        Returns campaign headline totals for a named reporting period without
        calculating or serializing ranked campaign or UTM arrays. Revenue is the
        exact base-currency sum across every paid merchant-campaign attribution
        in the period; it never derives from a visible campaign page.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficCampaignSummaryResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '403':
          description: Missing dashboard.view permission
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardForbiddenResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/campaign-placements":
    get:
      summary: Search traffic campaign placements
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_campaign_placements
      description: |
        Searches real campaign placements by campaign name for a named reporting
        period. Matching is case-insensitive and treats pattern characters as
        literal text. Rows are ranked by distinct visitors, then campaign,
        source, and medium. The bounded response never contains a synthetic
        "(other)" row; `truncated` tells the client to request a narrower query.
        Results are served only for companies cut over to campaign serving facts.
        Companies not yet cut over receive a normal 200 response with an empty
        `rows` array and `truncated` set to false.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
        example: last_30_days
      - name: q
        in: query
        required: true
        description: Literal campaign-name fragment, matched case-insensitively.
        schema:
          type: string
          minLength: 2
          maxLength: 100
        example: spring
      responses:
        '200':
          description: Bounded campaign placement search results
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficCampaignPlacementSearchResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '403':
          description: Missing dashboard.view permission
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardForbiddenResponse"
        '422':
          description: Unsupported period or invalid campaign-name query
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/campaigns":
    get:
      summary: Get traffic campaigns
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_campaigns
      description: |
        Returns the store's UTM-tagged traffic broken down by campaign for a
        named reporting period.

        The payload carries the resolved period window, the tagged-traffic
        summary headline (distinct tagged visitors, their share of all
        visitors, and the number of active campaigns), the ranked per-campaign
        split keyed by the (campaign, source, medium) tuple with a trailing
        "(other)" row folding the tail, and the five per-dimension UTM rankings
        (sources, mediums, campaigns, contents, terms).
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficCampaignsResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/flows":
    get:
      summary: Get traffic flows
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_flows
      description: |
        Returns which acquisition channel sent traffic to which piece of
        content, for a named reporting period — the Sankey behind the Sources
        tab's flow card.

        The payload carries the resolved period window, the days of it the
        channel rollups could answer, one ribbon per (channel, destination) pair
        with its bot-free visits, and the two counts a client states coverage
        from. Ribbon values are visits, not distinct visitors.

        Destinations are ranked and cut server-side. Each channel with folded
        traffic carries one remainder ribbon — resource null, other true — whose
        visits are the exact tail it replaced, so the ribbons always sum to
        accounted_visits. folded_destinations counts the distinct destinations
        the fold replaced, and is zero when nothing was folded.

        covered_window is null for a period lying entirely before the channel
        rollups began, which is distinct from a covered window with no flows in
        it. capture_start reports when the rollups began either way, so an empty
        period reads as an empty period rather than as an absence of traffic.

        stamped_visits is gross while the ribbons are bot-free, so the coverage
        ratio under-claims and never over-claims.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficFlowsResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/geography":
    get:
      summary: Get traffic geography
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_geography
      description: |
        Returns where the store's visitors were for a named reporting period.

        The payload carries the resolved period window, the days of it geography
        could answer, the country breakdown ranked by visitors (capped at ten
        with a trailing "(other)" row folding the tail), the nested city
        breakdown, and the visitor totals the shares divide by.

        Unlike the channel split on traffic/sources, the country breakdown is a
        partition: each visitor resolves to exactly one country, and visitors
        with no placed visit in the window are reported as unplaced_visitors
        rather than dropped, so the parts provably sum to the whole. Shares are
        not renormalised — their gap is the unplaced traffic.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficGeographyResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/overview":
    get:
      summary: Get traffic overview
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_overview
      description: |
        Returns the store's traffic overview for a named reporting period.

        The payload carries the resolved period window, the gross page-view
        headline with its period-over-period change, the distinct-visitor split
        into new and returning, the bot-free device mix, a gap-free daily
        page-view series, the content mix by resource type, and the
        highest-viewed individual resources — each with its own image, per-day
        view series, the channel that sent it the most traffic, and the orders
        and revenue it earned.

        Two fields carry readings a client must not coerce. unique_visitors is
        null, rather than zero, for a window visitor state cannot answer. A
        resource's top_channel is null, rather than "direct", when no
        channel-stamped visit to it fell in the window.

        A resource's orders and revenue credit exactly the one resource each
        order's attributing visit landed on, so they do not decompose store
        totals and must not be presented as doing so.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficOverviewResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/reps":
    get:
      summary: Get traffic by rep
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_reps
      description: |
        Returns the traffic a store's field of reps drove for a named reporting
        period — the leaderboard behind the Reps tab and the two traffic tiles
        above it.

        A visit is credited to a rep by identity rather than by channel: it
        carries the rep's attribution_member_id, or a share_id whose share
        belongs to them, or both. Where both are present and disagree, the
        stamped member wins. Identity has been recorded since long before the
        channel column existed, so this reaches back further than the
        channel-keyed figures on the Sources tab, and the two will not agree
        over a long window.

        visitor_share and the ranked rows come from that one filter, so the tile
        and the leaderboard beneath it cannot disagree. Its denominator is every
        visitor the store saw over the requested window and is deliberately not
        narrowed to the first rep-driven visit: months before the field drove
        anything held no rep traffic, and dilution is the answer rather than a
        distortion.

        Rows are ranked by distinct visitors descending, ties broken on the
        rep's name, and cut to a top N. Because one visitor can be sent by two
        reps, the rows' visitors need not sum to total_visitors and must not be
        rendered as a share of a whole. Reps the merchant hid from leaderboards
        are omitted from the rows while their traffic still counts toward
        active_reps and visitor_share, and a rep whose member record has since
        been deleted still ranks and is still named.

        Each row also names the resource that drew the most of that rep's
        traffic, or null when none did. That column is read from the
        per-resource rollups rather than from the events, so it answers only for
        traffic that landed on a tracked resource — about half of rep traffic,
        and a different half per store. A null there is a rep whose traffic
        never touched one, not a gap in their numbers.

        unattributed is not a rep. It folds the rep-classified traffic that
        names nobody — an admin-owned share has no member — so the rows plus the
        remainder reconcile with visitor_share. It carries no member_id and no
        name, and is served beside the rows rather than among them.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficRepsResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/analytics/traffic/sources":
    get:
      summary: Get traffic sources
      tags:
      - analytics
      operationId: company_v0_get_analytics_traffic_sources
      description: |
        Returns the store's traffic broken down by acquisition source for a
        named reporting period.

        The payload carries the resolved period window, the per-channel split
        across all seven canonical channels (reps, email, paid, social, organic,
        referral, direct) with each channel's gross page views, distinct
        visitors, visitor share, and period-over-period page-view change, the
        ranked top referring sites (with a trailing "(other)" row folding the
        tail), and the total distinct visitors over the window.

        A referring site is ranked once even when it reaches the store under
        several hostnames: each row carries the site's `name` alongside one real
        `host` observed under it.
      security:
      - bearer_auth: []
      parameters:
      - name: period
        in: query
        required: false
        description: |
          Named reporting period (default last_30_days). Supported names:
          today, last_7_days, last_30_days, last_90_days, last_12_months,
          this_month, last_month. An unsupported name returns 422.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyTrafficSourcesResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported period
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    CompanyAnalyticsAllResponse:
      type: object
      properties:
        1d:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        1m:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        1y:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        3m:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        6m:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time
          required:
          - request_id
          - timestamp
          additionalProperties: false
        today:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
        ytd:
          type: object
          properties:
            shares:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            views:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
            visitors:
              "$ref": "#/components/schemas/CompanyAnalyticsMetricSeries"
          required:
          - shares
          - views
          - visitors
          additionalProperties: false
      required:
      - 1d
      - 1m
      - 1y
      - 3m
      - 6m
      - meta
      - today
      - ytd
      additionalProperties: false
    CompanyAnalyticsMetricSeries:
      description: Analytics metric values keyed by the requested time bucket.
      type:
      - object
      - 'null'
      additionalProperties:
        type:
        - integer
        - number
        - string
        - 'null'
    CompanyAnalyticsSummaryResponse:
      type: object
      additionalProperties: false
    CompanyTrafficCampaignSummaryResponse:
      description: Campaign headline totals for a period, without ranked arrays.
      type: object
      additionalProperties: false
      required:
      - period
      - summary
      - status
      - meta
      properties:
        period:
          "$ref": "#/components/schemas/CompanyTrafficReportingPeriod"
        summary:
          type: object
          additionalProperties: false
          required:
          - tagged_visitors
          - tagged_share
          - active_campaigns
          - revenue
          properties:
            tagged_visitors:
              type: integer
              minimum: 0
              description: Distinct bot-free visitors carrying any merchant UTM value.
            tagged_share:
              type: number
              minimum: 0
              maximum: 1
              description: Tagged visitors over capture-era distinct visitors.
            active_campaigns:
              type: integer
              minimum: 0
              description: Distinct merchant utm_campaign values in the window.
            revenue:
              type: string
              pattern: "^-?[0-9]+\\.[0-9]{2}$"
              description: Exact paid merchant-campaign revenue in platform base currency.
        status:
          type: integer
          enum:
          - 200
        meta:
          "$ref": "#/components/schemas/CompanyTrafficResponseMeta"
    CompanyTrafficCampaignPlacementSearchResponse:
      description: Bounded real campaign placements matching one literal name query.
      type: object
      additionalProperties: false
      required:
      - period
      - rows
      - truncated
      - status
      - meta
      properties:
        period:
          "$ref": "#/components/schemas/CompanyTrafficReportingPeriod"
        rows:
          type: array
          description: Real campaign placements ranked by distinct visitors with deterministic tuple tie-breaks.
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - source
            - medium
            - visitors
            - page_views
            - orders
            - revenue
            - conversion_rate
            properties:
              name:
                type: string
                description: The nonblank utm_campaign value identifying the placement.
              source:
                type:
                - string
                - 'null'
                description: The placement's utm_source value, or null when blank.
              medium:
                type:
                - string
                - 'null'
                description: The placement's utm_medium value, or null when blank.
              visitors:
                type: integer
                minimum: 0
                description: Distinct bot-free visitors for the placement over the reporting period.
              page_views:
                type: integer
                minimum: 0
                description: Bot-free page views for the placement over the reporting period.
              orders:
                type: integer
                minimum: 0
                description: Paid orders attributed to the placement over the conversion-capture-forward window.
              revenue:
                type: string
                pattern: "^-?[0-9]+\\.[0-9]{2}$"
                description: Base-currency revenue from those paid orders, rounded at the response boundary.
              conversion_rate:
                type:
                - number
                - 'null'
                minimum: 0
                description: Orders divided by capture-forward visitors, or null when no eligible visitor was measured.
        truncated:
          type: boolean
          description: True when more real placements matched than this bounded response returned.
        status:
          type: integer
          enum:
          - 200
        meta:
          "$ref": "#/components/schemas/CompanyTrafficResponseMeta"
    CompanyTrafficCampaignsResponse:
      description: >-
        Store-traffic campaigns for a period — the resolved window, the tagged-traffic summary headline, the ranked per-campaign split, and the five per-dimension UTM rankings, wrapped in the standard API
        response envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - summary
      - campaigns
      - utm
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day").
        summary:
          type: object
          additionalProperties: false
          required:
          - tagged_visitors
          - tagged_share
          - active_campaigns
          properties:
            tagged_visitors:
              type: integer
              description: Distinct bot-free visitors whose visit carried any UTM value.
            tagged_share:
              type: number
              description: tagged_visitors over the window's total distinct visitors, in the range 0 to 1.
            active_campaigns:
              type: integer
              description: Count of distinct non-blank utm_campaign values seen in the window.
        campaigns:
          type: array
          description: Campaigns ranked by distinct visitors, keyed by the (campaign, source, medium) tuple, optionally ending in an "(other)" row folding the tail.
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - source
            - medium
            - visitors
            - page_views
            - other
            - orders
            - revenue
            - conversion_rate
            properties:
              name:
                type: string
                description: The utm_campaign value, or "(other)" for the folded tail.
              source:
                type:
                - string
                - 'null'
                description: The utm_source value, or null (including on the "(other)" row).
              medium:
                type:
                - string
                - 'null'
                description: The utm_medium value, or null (including on the "(other)" row).
              visitors:
                type: integer
                description: Distinct bot-free visitors for the tuple.
              page_views:
                type: integer
                description: Bot-free page views for the tuple.
              other:
                type: boolean
                description: True only on the synthetic (other) tail row; false on real campaigns.
              orders:
                type: integer
                description: >-
                  Orders attributed to this campaign tuple that reached paid, counted over the conversion-capture-forward part of the window — zero for a window entirely before the company's first stamped
                  order. On the "(other)" row, a true aggregate over the same folded tuples, never the total minus the listed rows. Campaign rows cover conversions whose tuple appears in the window's ranking
                  or its "(other)" tail, so the campaign totals can undercount the channel totals in the Sources view when few tuples ranked.
              revenue:
                type: string
                description: Revenue from those orders, as a decimal string in the platform base currency (the sum of each order's amount_in_base), rounded once to the base currency's minor units.
              conversion_rate:
                type:
                - number
                - 'null'
                minimum: 0
                description: >-
                  Those orders divided by the row's distinct visitors over the conversion-capture-forward part of the window, rounded to four decimals. Null when that visitor count is zero, including every
                  window with no conversion-capture-forward day. Normally at most 1, and higher only when a campaign's visitors placed more than one order each.
        utm:
          type: object
          additionalProperties: false
          required:
          - sources
          - mediums
          - campaigns
          - contents
          - terms
          properties:
            sources:
              type: array
              description: utm_source values ranked by distinct visitors, optionally ending in an "(other)" row folding the tail.
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - visitors
                - page_views
                - other
                properties:
                  value:
                    type: string
                    description: The utm_source value, or "(other)" for the folded tail.
                  visitors:
                    type: integer
                    description: Distinct bot-free visitors for the value.
                  page_views:
                    type: integer
                    description: Bot-free page views for the value.
                  other:
                    type: boolean
                    description: True only on the synthetic (other) tail row.
            mediums:
              type: array
              description: utm_medium values ranked by distinct visitors, optionally ending in an "(other)" row folding the tail.
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - visitors
                - page_views
                - other
                properties:
                  value:
                    type: string
                    description: The utm_medium value, or "(other)" for the folded tail.
                  visitors:
                    type: integer
                    description: Distinct bot-free visitors for the value.
                  page_views:
                    type: integer
                    description: Bot-free page views for the value.
                  other:
                    type: boolean
                    description: True only on the synthetic (other) tail row.
            campaigns:
              type: array
              description: utm_campaign values ranked by distinct visitors, optionally ending in an "(other)" row folding the tail.
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - visitors
                - page_views
                - other
                properties:
                  value:
                    type: string
                    description: The utm_campaign value, or "(other)" for the folded tail.
                  visitors:
                    type: integer
                    description: Distinct bot-free visitors for the value.
                  page_views:
                    type: integer
                    description: Bot-free page views for the value.
                  other:
                    type: boolean
                    description: True only on the synthetic (other) tail row.
            contents:
              type: array
              description: utm_content values ranked by distinct visitors, optionally ending in an "(other)" row folding the tail.
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - visitors
                - page_views
                - other
                properties:
                  value:
                    type: string
                    description: The utm_content value, or "(other)" for the folded tail.
                  visitors:
