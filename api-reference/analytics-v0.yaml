    CompanyTrafficFlowsResponse:
      description: >-
        Store-traffic flows for a period — the resolved window, the days of it the channel rollups could answer, the ranked channel-to-content ribbons with their folded remainder, and the two counts a client
        states coverage from, wrapped in the standard API response envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - covered_window
      - capture_start
      - flows
      - folded_destinations
      - accounted_visits
      - stamped_visits
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the requested window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the requested window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day").
        covered_window:
          type:
          - object
          - 'null'
          description: |
            The days of the requested period the flows could be drawn over — the
            requested window intersected with the days this store's channel
            rollups have carried rows. Every count in the payload is taken over
            this window rather than the requested one, the coverage denominator
            included.

            Null when the two do not meet, which means the period lies entirely
            before the channel rollups began. Null arrives with empty flows and
            zeroed counts, and is deliberately distinct from a covered window
            whose flows are empty — that means the days were answerable and
            nothing was visited. Do not coerce one into the other.
          additionalProperties: false
          required:
          - starts_on
          - ends_on
          properties:
            starts_on:
              type: string
              format: date
              description: Inclusive first answerable day (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last answerable day (YYYY-MM-DD, UTC).
        capture_start:
          type:
          - string
          - 'null'
          format: date
          description: |
            The day this store's channel rollups first carried a row
            (YYYY-MM-DD, UTC), or null when they never have. Reported whether or
            not the requested period overlaps it, so a client can say when the
            flows begin rather than presenting an empty period as an absence of
            traffic.

            A null covered_window with a capture_start set is a period that ends
            before capture; a null covered_window with a null capture_start is a
            store that has never had a rollup row at all.
        flows:
          type: array
          description: |
            One ribbon per (channel, destination) pair with visits over the
            covered window, ranked destinations only. Channels with no traffic in
            the window are absent rather than zero-filled.

            Destinations are cut to a bounded ranked set server-side, and each
            channel with folded traffic carries one remainder ribbon — resource
            null, other true — so the ribbons still sum to accounted_visits.
          items:
            type: object
            additionalProperties: false
            required:
            - channel
            - resource
            - visits
            - other
            properties:
              channel:
                type: string
                description: The acquisition channel the ribbon leaves (reps, email, paid, social, organic, referral, or direct).
              resource:
                type:
                - object
                - 'null'
                description: The destination the ribbon lands on, or null on a folded remainder ribbon, which lands nowhere nameable.
                additionalProperties: false
                required:
                - id
                - title
                - type
                properties:
                  id:
                    type: integer
                    description: The destination resource's id, within its own content type rather than globally unique.
                  title:
                    type:
                    - string
                    - 'null'
                    description: >-
                      The destination's display title, so a client renders a name rather than an id. Null when the resource has none — a product synced from an external catalogue is exempt from the title
                      requirement its five sibling content types enforce, and such a product can still rank as a destination on visits it really drew. Same reading as top_content.title on the overview payload.
                  type:
                    type: string
                    description: The destination's content type (products, pages, posts, media, libraries, or enrollment_packs).
              visits:
                type: integer
                description: Bot-free channel-stamped visits from this channel to this destination over the covered window. Visits, not distinct visitors — a counting rollup cannot recover the latter.
              other:
                type: boolean
                description: True on the single folded remainder ribbon for this channel, false on a real destination. A flag rather than a title to string-match.
        folded_destinations:
          type: integer
          description: How many distinct destinations the fold replaced across every channel, counting a destination reached by three channels once. Zero when nothing was folded, in which case no ribbon
            carries other.
        accounted_visits:
          type: integer
          description: The sum of the visits on the ribbons this payload carries, the folded remainder included, so a merchant adding the diagram up arrives at this number.
        stamped_visits:
          type: integer
          description: |
            Channel-stamped visits over the same covered window, read from the
            store's channel rollup — the traffic there was, against the
            accounted_visits the diagram draws.

            Gross, bots included, while every ribbon is bot-free. So
            accounted_visits over stamped_visits is bot-free over gross and
            under-claims coverage: the real share of nameable traffic is at least
            what this payload implies, never less. Two checkable numbers rather
            than one computed percentage, so the client owns the phrasing.
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: The request correlation id, or null when unset.
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the response was built.
    CompanyTrafficGeographyResponse:
      description: >-
        Store-traffic geography for a period — the resolved window, the days of it geography could answer, the ranked country breakdown with the revenue delivered to each country, and a nested city breakdown
        carrying its own capture window, wrapped in the standard API response envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - effective_window
      - revenue_window
      - capture_start
      - countries
      - cities
      - total_visitors
      - unplaced_visitors
      - accounted_revenue
      - paid_revenue
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the requested window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the requested window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day").
        effective_window:
          type:
          - object
          - 'null'
          description: |
            The days of the requested period that geography could answer — the
            requested window intersected with the days this store has carried
            placed visits. Every count in the payload is taken over this window
            rather than the requested one.

            Null when the two do not meet, which means the period lies entirely
            before this store began carrying placed visits. Null arrives with an
            empty countries list and zeroed totals, and is deliberately distinct
            from an answerable window whose counts are all zero — that means
            nobody came. Do not coerce one into the other.
          additionalProperties: false
          required:
          - starts_on
          - ends_on
          properties:
            starts_on:
              type: string
              format: date
              description: Inclusive first answerable day (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last answerable day (YYYY-MM-DD, UTC).
        revenue_window:
          type: object
          description: |
            The days the revenue figures cover — the whole requested period, on
            the order's own clock. An order falls inside it by created_at, over
            the half-open UTC range [starts_on 00:00, (ends_on + 1) 00:00), the
            same predicate every conversion figure on this tab applies.

            Never null, unlike effective_window, and it covers a **different and
            longer span**. Orders have carried a delivery country for years,
            while visit geography only reaches capture_start and can never be
            backfilled — an IP that was never recorded cannot be recovered. So on
            a period reaching back past capture, a country row shows revenue for
            the whole window beside visitors for only part of it. Neither number
            is wrong; each is right over its own span. Do not render the two
            columns as one measurement — say which days each covers, rather than
            leaving a reader to infer the gap from a suspiciously low visitor
            count. The gap closes as capture accrues and never inverts: revenue
            always covers at least as much of the window as visitors do.
          additionalProperties: false
          required:
          - starts_on
          - ends_on
          properties:
            starts_on:
              type: string
              format: date
              description: Inclusive first day revenue is counted over (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day revenue is counted over (YYYY-MM-DD, UTC).
        capture_start:
          type:
          - string
          - 'null'
          format: date
          description: |
            The day this store first carried a placed visit (YYYY-MM-DD, UTC), or
            null when it never has. Reported whether or not the requested period
            overlaps it, so a client can say when geography began rather than
            presenting an empty period as an absence of traffic.
        countries:
          type: array
          description: |
            Countries ranked by resolved visitors, capped at ten and optionally
            ending in a single "(other)" row folding the tail.

            This is a partition, not an attribution split: each visitor resolves
            to exactly one country — the country of their most recent placed visit
            in the window — so the rows are disjoint and
            Σ(visitors) + unplaced_visitors == total_visitors holds exactly.

            A row's visitors and revenue answer two different questions and are
            not a numerator and a denominator: visitors counts people an IP
            placed in this country, revenue sums orders whose delivery address is
            here. **Never divide one by the other into a conversion rate** — the
            two populations are not the same people and the quotient means
            nothing. They also cover different spans; see revenue_window.
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - name
            - visitors
            - page_views
            - share
            - other
            - revenue
            properties:
              code:
                type: string
                description: ISO 3166-1 alpha-2 country code, or "(other)" for the folded remainder row.
              name:
                type: string
                description: The country's ISO short name, falling back to the code when the ISO data does not recognise it, or "Other" for the remainder row.
              visitors:
                type: integer
                description: Distinct bot-free visitors who resolved to this country.
              page_views:
                type: integer
                description: Gross page views from this country over the window — bots and cookie-less visits included, read from the daily country rollup. Reconciles with no visitor number on this payload,
                  by design.
              share:
                type: number
                minimum: 0
                maximum: 1
                description: The country's visitor share of total_visitors, rounded to four decimals.
              other:
                type: boolean
                description: True for the single folded remainder row, false for a real country.
              revenue:
                type: string
                description: |
                  Revenue delivered to this country over revenue_window, as a
                  decimal string in the platform base currency (the sum of each
                  order's amount_in_base), rounded once to the base currency's
                  minor units. A country with visitors and no orders serves a
                  decimal zero ("0.00" in a two-minor-unit base currency), never
                  null — zero revenue is a measurement, null would mean "not
                  knowable".

                  Sourced from the order's own delivery country, not from the
                  visit geography the rest of the row is built from, so it
                  answers a different question than visitors beside it and must
                  never be divided into a conversion rate.

                  **This column covers storefront purchases and does not
                  decompose store revenue.** Imported orders are outside the
                  population entirely rather than missing from it, and they are
                  a material share of platform revenue, so the column totalling
                  less than a merchant's whole book is the design and not a gap
                  in it. It is the same population the conversion figures on
                  this tab measure — only orders a shopper session attributed —
                  so imports, integrations, renewals, admin orders and drafts
                  are absent from both, and the two agree by design.
        cities:
          type: object
          description: |
            The city breakdown, nested rather than listed beside the countries
            because it answers a different set of days. City capture began after
            country capture, so this object carries its own capture_start, its
            own effective_window, and its own total_visitors.

            cities.total_visitors will usually differ from the top-level
            total_visitors, because each counts the visitors of its own window.
            Both are correct. Divide city shares by cities.total_visitors and
            never by the top-level one.
          additionalProperties: false
          required:
          - capture_start
          - effective_window
          - rows
          - total_visitors
          - cityless_visitors
          - unplaced_visitors
          properties:
            capture_start:
              type:
              - string
              - 'null'
              format: date
              description: |
                The day this store first carried a visit placed to a city
                (YYYY-MM-DD, UTC), or null when it never has. Later than the
                top-level capture_start, since the edge began sending cities
                after it began sending countries. Reported whether or not the
                requested period overlaps it, so a client can say when city
                capture began rather than presenting unrecorded days as an
                absence of traffic.
            effective_window:
              type:
              - object
              - 'null'
              description: |
                The days of the requested period the city breakdown could
                answer — the requested window intersected with the days this
                store has carried visits placed to a city. Every figure inside
                this object is taken over this window, never the top-level one.

                Null when the two do not meet, which means the period lies
                entirely before this store began carrying cities. Null arrives
                with empty rows and zeroed totals, and is deliberately distinct
                from an answerable window whose counts are all zero — that means
                nobody came.
              additionalProperties: false
              required:
              - starts_on
              - ends_on
              properties:
                starts_on:
                  type: string
                  format: date
                  description: Inclusive first answerable day (YYYY-MM-DD, UTC).
                ends_on:
                  type: string
                  format: date
                  description: Inclusive last answerable day (YYYY-MM-DD, UTC).
            rows:
              type: array
              description: |
                Cities ranked by resolved visitors, capped at ten and optionally
                ending in a single remainder row folding the tail.

                A partition, like the countries above: each visitor resolves to
                exactly one city — the city of their most recent city-carrying
                visit in the window — so the rows are disjoint and
                Σ(visitors) + cityless_visitors + unplaced_visitors ==
                total_visitors holds exactly.
              items:
                type: object
                additionalProperties: false
                required:
                - country_code
                - subdivision
                - city
                - name
                - visitors
                - page_views
                - share
                - other
                properties:
                  country_code:
                    type:
                    - string
                    - 'null'
                    description: ISO 3166-1 alpha-2 code of the country the city is in, or null for the folded remainder row, which names no place.
                  subdivision:
                    type:
                    - string
                    - 'null'
                    description: CLDR subdivision id — the country code followed by the ISO 3166-2 suffix, e.g. USUT — or null when the edge resolved a city but no subdivision, and for the remainder row.
                  city:
                    type: string
                    description: The city name as the edge resolved it, or "(other)" for the folded remainder row. Not unique on its own — the place is the country, subdivision and city together.
                  name:
                    type: string
                    description: Display label — "City, Subdivision, Country", dropping the subdivision segment when the row carries none, and "Other" for the remainder row.
                  visitors:
                    type: integer
                    description: Distinct bot-free visitors who resolved to this city.
                  page_views:
                    type: integer
                    description: Gross page views from this city over the city window — bots and cookie-less visits included, read from the daily city rollup. Reconciles with no visitor number on this payload,
                      by design.
                  share:
                    type: number
                    minimum: 0
                    maximum: 1
                    description: The city's visitor share of cities.total_visitors, rounded to four decimals.
                  other:
                    type: boolean
                    description: True for the single folded remainder row, false for a real city.
            total_visitors:
              type: integer
              description: Total distinct bot-free visitors over the city effective window, in a city or not. The denominator every city share divides by, and not interchangeable with the top-level total_visitors.
            cityless_visitors:
              type: integer
              description: |
                Visitors the edge placed in a country but not in a city over the
                city effective window. Kept separate from unplaced_visitors
                rather than folded into it: they are a coverage gap in the city
                signal, not visitors the edge failed to place at all.
            unplaced_visitors:
              type: integer
              description: Visitors with no placed visit at all in the city effective window — counted, not dropped, so the three states are exhaustive and the city rows provably sum to the whole.
        total_visitors:
          type: integer
          description: Total distinct bot-free visitors over the effective window, placed and unplaced together. The denominator every share divides by.
        unplaced_visitors:
          type: integer
          description: |
            Visitors with no placed visit in the effective window — counted, not
            dropped, so the country breakdown provably sums to the whole.

            Shares are against total_visitors and are deliberately not
            renormalised, so Σ(shares) is the placed fraction rather than 1. The
            gap is this number, and it is meant to stay visible.
        accounted_revenue:
          type: string
          description: |
            The revenue the country rows add up to over revenue_window, as a
            decimal string in the platform base currency — so a merchant totting
            the column up arrives at this number. The folded "(other)" row is
            included, exactly as it is in the column.
        paid_revenue:
          type: string
          description: |
            Every purchased order's revenue over the same revenue_window,
            whatever country it was delivered to or whether it named one at all,
            as a decimal string in the platform base currency — the whole of the
            population the country column is cut from.

            Paired with accounted_revenue this is what makes the rows auditable:
            two checkable numbers rather than one computed percentage, so the
            client owns the phrasing. The identity is exact — accounted_revenue
            plus the revenue of purchased orders carrying no delivery country
            equals paid_revenue — and the two do not usually diverge, so a gap
            between them is worth looking into rather than the ordinary state of
            things.

            Read it as the population's total, not as store revenue. It covers
            storefront purchases and excludes imported orders, which are a
            material share of platform revenue, so neither this number nor the
            column beneath it is a merchant's whole book.
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: The request correlation id, or null when unset.
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the response was built.
    CompanyTrafficOverviewResponse:
      description: >-
        Store-traffic overview for a period — the resolved window, the page-view headline with its period-over-period change, the visitor split, the bot-free device mix, the gap-free daily series, the content
        mix by resource type, and the highest-viewed individual resources, wrapped in the standard API response envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - page_views
      - unique_visitors
      - device_mix
      - series
      - content_mix
      - top_content
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the requested window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the requested window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day").
        page_views:
          type: object
          additionalProperties: false
          required:
          - total
          - change_pct
          properties:
            total:
              type: integer
              description: Gross page views over the window, bots included, from the store's own daily rollup.
            change_pct:
              type:
              - number
              - 'null'
              description: Change against the immediately preceding window of equal length, or null when that window carried no views to compare with.
        unique_visitors:
          type:
          - object
          - 'null'
          description: |
            The distinct-visitor split over the window, or null for a window
            visitor state cannot answer — one that has already closed, or one
            reaching back before this store began capturing visitors.

            Null means "not knowable" and is deliberately distinct from a zero,
            which means "nobody came". A client must not coerce one into the
            other. It carries no change_pct, unlike page_views: the numbers come
            from session state, which records a visitor's most recent activity
            and so cannot describe the previous window.
          additionalProperties: false
          required:
          - total
          - new
          - returning
          properties:
            total:
              type: integer
              description: Distinct visitors over the window.
            new:
              type: integer
              description: Visitors on their first session.
            returning:
              type: integer
              description: Visitors with more than one session.
        device_mix:
          type: object
          additionalProperties: false
          description: Bot-free page views by device type, always carrying all four keys, zero-filled, so a client can render a stable set of segments.
          required:
          - desktop
          - mobile
          - tablet
          - unknown
          properties:
            desktop:
              type: integer
              description: Bot-free page views from desktop devices.
            mobile:
              type: integer
              description: Bot-free page views from mobile devices.
            tablet:
              type: integer
              description: Bot-free page views from tablets.
            unknown:
              type: integer
              description: Bot-free page views whose device could not be determined.
        series:
          type: array
          description: Gross page views per day over the window, gap-filled so every day in the window has a point, oldest first.
          items:
            type: object
            additionalProperties: false
            required:
            - at
            - page_views
            properties:
              at:
                type: string
                format: date
                description: The day this point covers (YYYY-MM-DD, UTC).
              page_views:
                type: integer
                description: Gross page views on that day.
        content_mix:
          type: object
          additionalProperties: false
          description: |
            Gross page views by content type, always carrying all six types
            plus "other", zero-filled, in a stable order. "other" is the views
            that resolved to no resource — a storefront root, a cart, a checkout
            URL.

            "promotions" was a seventh key until 2026-07-31. It was removed
            because it was always zero: no storefront visit has ever resolved to
            a promotion, and the rollup behind it has never held a row.

            The values sum to page_views.total with one exception: for windows
            predating the store rollup's backfill the per-resource rollups can
            over-count, and the mix then exceeds the headline. Every value is a
            real rollup total either way, so a client deriving shares should
            divide by the mix's own sum rather than by page_views.total — the two
            agree in the normal case, and dividing by the mix keeps a share at or
            below 100% in both.
          required:
          - products
          - pages
          - posts
          - media
          - libraries
          - enrollment_packs
          - other
          properties:
            products:
              type: integer
              description: Gross page views of individual products.
            pages:
              type: integer
              description: Gross page views of individual pages.
            posts:
              type: integer
              description: Gross page views of individual posts.
            media:
              type: integer
              description: Gross page views of individual media items.
            libraries:
              type: integer
              description: Gross page views of individual libraries.
            enrollment_packs:
              type: integer
              description: Gross page views of individual enrollment packs.
            other:
              type: integer
              description: Gross page views that resolved to no individual resource.
        top_content:
          type: array
          description: The highest-viewed individual resources over the window, ranked by gross page views across every content type and cut to a top-N.
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - id
            - title
            - page_views
            - image_url
            - series
            - top_channel
            - top_channel_from
            - orders
            - revenue
            properties:
              type:
                type: string
                description: The resource's content type (e.g. products, pages).
              id:
                type: integer
                description: The resource's own identifier within its type.
              title:
                type:
                - string
                - 'null'
                description: The resource's title, or null when it has none.
              page_views:
                type: integer
                description: Gross page views of this resource over the window.
              image_url:
                type:
                - string
                - 'null'
                description: |
                  The resource's own image, or null when it has none.

                  Null is a real reading — the client renders a typed
                  placeholder. It is never an empty string and never a
                  server-chosen fallback.
              series:
                type: array
                description: |
                  This resource's gross page views per day over the same window
                  as the store-level series, gap-filled, oldest first.

                  Deliberately a bare array of integers rather than the
                  store-level series' at/page_views objects: it feeds a sparkline
                  with no axis, and the period object already says which days
                  those are. The two are the same length for the same period.
                items:
                  type: integer
              top_channel:
                type:
                - string
                - 'null'
                description: |
                  The canonical channel key that sent this resource the most page
                  views over the window, or null when no channel-stamped visit to
                  it fell in the window.

                  Null means "nothing sent it that we recorded". It is not
                  "direct", and a client must not render it as one.
              top_channel_from:
                type:
                - string
                - 'null'
                format: date
                description: |
                  The day top_channel starts covering (YYYY-MM-DD, UTC).

                  This field is the only statement of how much of the window the
                  channel ranking answers. Do not infer coverage from any other
                  date: how far back a store's channel data reaches depends on
                  when that store began recording it and on whether historical
                  visits have since been replayed into it, and both vary by store
                  and change over time.

                  What is fixed is the floor. Channel data cannot begin before
                  2026-07-22 under any circumstance, because no visit before that
                  day carries a resolved channel. That bounds how far back this
                  value can ever go; it does not promise any store reaches it.

                  A window reaching back before this store's first channel row
                  ranks the channel over the covered span while page_views beside
                  it counts the whole window. This names the day that span
                  begins, and a client showing the channel should say so rather
                  than let the two read as the same span.

                  Null in both the ordinary case and the empty one: null when the
                  ranking covers the whole window, and null again when it covers
                  none of it, where top_channel is already null and a span with no
                  days has no first day. Null therefore never means "unknown" —
                  pair it with top_channel to tell the two apart.
              orders:
                type: integer
                description: |
                  Paid orders whose attributing visit landed on this resource.

                  An order credits exactly one resource, so this does not
                  decompose store orders: an order whose attributing visit landed
                  on a storefront root, a cart, or a checkout URL credits no row
                  at all and is not spread across them. Zero is a real count, not
                  missing data. Resource credit is forward-only, so orders placed
                  before the platform began recording the attributing visit's
                  resource carry none.
              revenue:
                type: string
                description: |
                  Revenue from those orders as a decimal string in the platform's
                  base currency, summed from each order's creation-time converted
                  total.

                  A string rather than a number so no precision is lost in JSON.
                  Carries the same single-resource credit rule as orders, so
                  summing this column across the served rows is always less than
                  store revenue and must not be presented as a decomposition of
                  it.
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: The request correlation id, or null when unset.
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the response was built.
    CompanyTrafficReportingPeriod:
      description: Resolved UTC reporting window shared by traffic reads.
      type: object
      additionalProperties: false
      required:
      - name
      - starts_on
      - ends_on
      - bucket
      properties:
        name:
          type: string
          description: The resolved period name (e.g. last_30_days).
        starts_on:
          type: string
          format: date
          description: Inclusive first day of the window (YYYY-MM-DD, UTC).
        ends_on:
          type: string
          format: date
          description: Inclusive last day of the window (YYYY-MM-DD, UTC).
        bucket:
          type: string
          enum:
          - day
          description: Bucket granularity of the resolved period.
    CompanyTrafficRepsResponse:
      description: >-
        The traffic a store's field of reps drove over a period — the resolved window, how many reps were active, the field's share of every visitor, the ranked leaderboard, and the remainder that names
        nobody, wrapped in the standard API response envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - active_reps
      - visitor_share
      - revenue
      - revenue_from
      - new_reps
      - total_visitors
      - total_reps
      - reps
      - unattributed
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day"), so a twelve-month period is 365 series points per rep.
        active_reps:
          type: object
          description: How many reps drove traffic, with the comparison every other headline figure carries.
          additionalProperties: false
          required:
          - current
          - previous
          - change_pct
          properties:
            current:
              type: integer
              description: Distinct reps with at least one qualifying visit in the window, including reps hidden from the leaderboard.
            previous:
              type: integer
              description: The same count over the equal-length window before it.
            change_pct:
              type:
              - number
              - 'null'
              description: Percentage change versus the previous window, or null when that window had no active reps.
        visitor_share:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            Distinct visitors who arrived on a rep-carrying visit over every distinct visitor in the window, rounded to four decimals, and 0 when the store saw none. Computed from the same identity filter
            as the rows, and its denominator is not narrowed to the first rep-driven visit.
        revenue:
          type: string
          description: |
            Revenue from every order this store's field drove over the window, as
            a decimal string in the platform's base currency (the sum of each
            order's amount_in_base), rounded once to the base currency's minor
            units.

            A string rather than a number so no precision is lost in JSON. A
            client must not parse it into a display path that rounds it a second
            time.

            Summed from the same stamped rows as the reps[].revenue column
            beneath it, so the two are one measurement rather than two. It is not
            the conversion figure the Sources tab serves for `channel = 'reps'`,
            which is keyed on a column three years younger than rep identity and
            would disagree with the leaderboard.

            It counts every rep credited in the window, including reps below the
            rank cut and reps the merchant has hidden from leaderboards, so the
            served rows do not add up to it — the same rule visitor_share and
            active_reps follow. It is not the store's whole revenue either: an
            order no rep drove is counted here in no row at all.

            This is **traffic** credit, not commission credit. It answers "whose
            link brought the shopper who bought", which is a different question
            from the rep a sale is credited to at checkout, so it will not
            reconcile with the order's own attribution or with commission
            reporting, and neither figure is a check on the other.
        revenue_from:
          type:
          - string
          - 'null'
          format: date
          description: |
            The day this store's rep revenue starts covering (YYYY-MM-DD, UTC),
            or null when no order has ever been credited to a rep here.

            Read every money figure on this card against it. Rep credit is
            recorded forward only and was never backfilled, so the money columns
            have a far shorter history than the visitor columns beside them on
            the very same row, and a window can sit entirely before this date —
            in which case orders are 0 and revenue is the currency's zero string
            for an era that was simply never measured. `$0` over a twelve-month
            window means "the field earned nothing" only when this date precedes
            the window; otherwise it means "we started measuring recently", and
            in this tab's first months that is the more common reading. Surface
            it wherever the money is shown.

            Null therefore means "no rep-credited order exists yet", not
            "unknown" and not "covers the whole window".

            It can never precede 2026-07-22 under any circumstance, because an
            order is only credited from a visit carrying a resolved channel and
            no earlier visit carries one. In practice it is later still: it is
            the first rep-credited order this store recorded, so a store whose
            first orders after the feature shipped were all driven by nobody
            reports a slightly later day than recording actually began. It moves
            earlier only in that it settles at the true first credited order.
        new_reps:
          type: integer
          description: |
            How many of the window's reps drove traffic for this store for the
            first time — they have a qualifying visit inside the window and none
            before it, back to the store's first recorded day.

            Always an integer, never null. A zero is a real count meaning no rep
            started this period, so no not-measured state is needed for it.

            It is scoped to this store: a rep with years of history under another
            company is new here, because this is the first traffic they drove
            here. And "qualifying" is deliberately not the same bar the rows use
            — a rep whose earlier traffic was all bots is new, because a bot is
            not traffic anybody drove, but a rep whose earlier traffic was merely
            cookieless is NOT new. visitor_uid began populating 2026-07-08, so
            requiring it on the lookback would report most of the field as newly
            activated and measure that column's rollout instead.

            Measured like active_reps rather than like the list: it counts the
            resolved rep identity, so a rep hidden from leaderboards is counted
            when they start driving traffic, exactly as their traffic is counted
            in active_reps and visitor_share. It is therefore not a subset of
            total_reps, and on a store that hides reps it can exceed it.
        total_visitors:
          type: integer
          description: Total distinct bot-free visitors over the window — the denominator visitor_share is taken against.
        total_reps:
          type: integer
          description: |
            How many reps this leaderboard ranked before it cut to the rows in
            `reps`, so a card serving a top N can state what it is not showing.

            The endpoint serves neither a search nor a sort parameter, so a
            client filtering or re-ordering the rows it has is working over a
            prefix of this many reps, not over the field. Read "no reps match"
            against this number: it means "none in the top N", never "no such
            rep".

            It counts the list rather than the field, which is the one place it
            parts company with active_reps.current. A rep the merchant has
            hidden from leaderboards, and a rep identity this store cannot name,
            are both measured in the tiles and appear on no page of this list,
            so neither is counted here. The unattributed remainder is not
            counted either — it is rep-classified traffic, not a rep. So
            total_reps is at most active_reps.current, and equal to it for a
            store that has hidden nobody.
        reps:
          type: array
          description: Reps ranked by distinct visitors descending, ties broken on name, cut to a top N. Reps hidden from leaderboards are absent.
          items:
            type: object
            additionalProperties: false
            required:
            - member_id
            - name
            - visitors
            - visits
            - orders
            - revenue
            - series
            - top_asset
            properties:
              member_id:
                type: string
                description: The rep's member id.
              name:
                type: string
                description: The rep's display name, resolved even for a member the merchant has since deleted.
              visitors:
                type: integer
                description: Distinct bot-free visitors this rep sent over the window. Rows need not sum to total_visitors, because one visitor can be sent by two reps.
              visits:
                type: integer
                description: Bot-free visits this rep sent over the window.
              orders:
                type: integer
                description: |
                  Paid orders whose attributing visit this rep drove.

                  Zero is a real count, not missing data — most rep traffic never
                  converts, so an empty cell here is the ordinary reading rather
                  than a gap. Read it against revenue_from: rep credit is
                  forward-only, so orders placed before this store's first
                  rep-credited order count on no row.

                  This is traffic credit, not commission credit, and it will not
                  match what the rep is paid on.
              revenue:
                type: string
                description: |
                  Revenue from those orders as a decimal string in the platform's
                  base currency, summed from each order's creation-time converted
                  total.

                  A string rather than a number so no precision is lost in JSON,
                  and a client must not parse it into a display path that rounds
                  it again. A rep who earned nothing serves the base currency's
                  own zero — "0.00" for a two-decimal currency — never null and
                  never a blank.

                  Carries the same forward-only credit rule and the same
                  traffic-not-commission meaning as orders above, and reads
                  against the same revenue_from. Summing this column across the
                  served rows does not reach the card's own revenue figure: that
                  one counts every credited rep, while these stop at the rank cut
                  and skip reps hidden from leaderboards.
              series:
                type: array
                description: Distinct visitors per day over the window, oldest first, gap-filled with zeros. Distinct-per-day does not sum to distinct-over-window, so this normally totals more than visitors.
                items:
                  type: integer
              top_asset:
                type:
                - object
                - 'null'
                additionalProperties: false
                description: |
                  The resource that drew the most of this rep's traffic over the
                  window, or null when none did.

                  Null is a real reading rather than missing data, and a client
                  must render an explicit empty cell for it. This column is read
                  from the per-resource rollups, which observe only tracked
                  resource types — rep traffic lands on one about half the time
                  — so a rep whose traffic never touched one genuinely has no
                  top asset. The traffic figures beside it come from the events
                  and are unaffected: a null here never means the row's
                  visitors, visits, or series are short.

                  Ties break on the kind and then on the resource's own id, so
                  the same window returns the same answer every time.

                  The three keys match the top_asset the Home > Field
                  leaderboard serves, so one card component renders both. The
                  resource's id is not among them: the card names an asset, it
                  does not link to one.
                required:
                - title
                - kind
                - thumbnail_url
                properties:
                  title:
                    type:
                    - string
                    - 'null'
                    description: The resource's title, or null when it has none. A resource the merchant has since deleted still names the row it earned.
                  kind:
                    type: string
                    enum:
                    - product
                    - page
                    - media
                    - blog
                    - collection
                    - enrollment
                    description: |
                      What kind of thing the asset is, as the card's own content
                      vocabulary names it.

                      Three of these do not read like the resource behind them:
                      a blog post is `blog`, a library is `collection`, and an
                      enrollment pack is `enrollment`. The Home > Field
                      leaderboard's top_asset spells the same three differently
                      — `post`, `library`, `enrollment_pack` — because it feeds
                      a different card. Promotions never appear: that rollup
                      holds no rows and is not read.
                  thumbnail_url:
                    type:
                    - string
                    - 'null'
                    description: |
                      The resource's own image, or null when it has none.

                      Null is a real reading — the client renders a typed
                      placeholder. It is never an empty string and never a
                      server-chosen fallback.
        unattributed:
          type: object
          description: >-
            The rep-classified traffic that names nobody, folded into one remainder — chiefly visits arriving through an admin-owned share, which carries no member. It is not a rep row, and carries neither
            a member_id nor a name.
          additionalProperties: false
          required:
          - visitors
          - visits
          properties:
            visitors:
              type: integer
              description: Distinct bot-free visitors whose rep-carrying visit resolved to no member.
            visits:
              type: integer
              description: Bot-free visits that resolved to no member.
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: The request correlation id, or null when unset.
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the response was built.
    CompanyTrafficResponseMeta:
      description: Standard metadata emitted by Api::Response.
      type: object
      additionalProperties: false
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: The request correlation id, or null when unset.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the response was built.
    CompanyTrafficSourcesResponse:
      description: Store-traffic sources for a period — the resolved window, the per-channel split across the seven canonical channels, and the ranked top referring sites, wrapped in the standard API response
        envelope.
      type: object
      additionalProperties: false
      required:
      - period
      - channels
      - referrers
      - total_visitors
      - status
      - meta
      properties:
        period:
          type: object
          additionalProperties: false
          required:
          - name
          - starts_on
          - ends_on
          - bucket
          properties:
            name:
              type: string
              description: The resolved period name (e.g. last_30_days).
            starts_on:
              type: string
              format: date
              description: Inclusive first day of the window (YYYY-MM-DD, UTC).
            ends_on:
              type: string
              format: date
              description: Inclusive last day of the window (YYYY-MM-DD, UTC).
            bucket:
              type: string
              description: The bucket granularity of the period window (always "day").
        channels:
          type: array
          description: The seven canonical acquisition channels in fixed order.
          minItems: 7
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required:
            - key
            - page_views
            - visitors
            - share
            - change_pct
            - orders
            - revenue
            - conversion_rate
            properties:
              key:
                type: string
                description: Channel key (reps, email, paid, social, organic, referral, or direct).
              page_views:
                type: integer
                description: Gross page views for the channel over the window.
              visitors:
                type: integer
                description: Distinct bot-free visitors attributed to the channel.
              share:
                type: number
                description: The channel's visitor share of the window total, in the range 0 to 1.
              change_pct:
                type:
                - number
                - 'null'
                description: Percentage change in page views versus the previous equal-length window, or null when the previous window had no data.
              orders:
                type: integer
                description: Orders attributed to this channel that reached paid, counted over the conversion-capture-forward part of the window — zero for a window entirely before the company's first stamped
                  order.
              revenue:
                type: string
                description: Revenue from those orders, as a decimal string in the platform base currency (the sum of each order's amount_in_base), rounded once to the base currency's minor units.
              conversion_rate:
                type:
                - number
                - 'null'
                minimum: 0
                description: >-
                  Those orders divided by the channel's distinct visitors over the conversion-capture-forward part of the window, rounded to four decimals. Null when that visitor count is zero, including
                  every window with no conversion-capture-forward day. Normally at most 1, and higher only when a channel's visitors placed more than one order each.
        referrers:
          type: array
          description: >-
            Referring sites ranked by distinct visitors, optionally ending in an "(other)" row folding the tail. A site that reaches the store under several hostnames (facebook.com, m.facebook.com, l.facebook.com)
            is one row, not one row per hostname.
          items:
            type: object
            additionalProperties: false
            required:
            - host
            - name
            - visitors
            - page_views
            - orders
            - revenue
            - conversion_rate
            properties:
              host:
                type: string
                description: One real referring host observed under this row's name — the lowest of them when the site was reached under several. "(other)" for the folded tail.
              name:
                type: string
                description: The referring site this row is keyed by — the platform's name ("Facebook", "Google") when it is a site the referrer dataset knows, and the host itself when it is not. "(other)"
                  for the folded tail.
              visitors:
                type: integer
                description: Distinct bot-free visitors referred by the site — a distinct union across its hostnames, never a sum of theirs.
              page_views:
                type: integer
                description: Bot-free page views referred by the site, summed across its hostnames.
              orders:
                type: integer
                description: >-
                  Orders attributed to this referring site that reached paid, counted over the conversion-capture-forward part of the window — zero for a window entirely before the company's first stamped
                  order. On the "(other)" row, a true aggregate over the same folded sites, never the total minus the listed rows.
              revenue:
                type: string
                description: Revenue from those orders, as a decimal string in the platform base currency (the sum of each order's amount_in_base), rounded once to the base currency's minor units.
              conversion_rate:
                type:
                - number
                - 'null'
                minimum: 0
                description: >-
                  Those orders divided by the site's distinct visitors over the conversion-capture-forward part of the window, rounded to four decimals. Null when that visitor count is zero, including every
                  window with no conversion-capture-forward day. Normally at most 1, and higher only when a site's visitors placed more than one order each.
        total_visitors:
          type: integer
          description: Total distinct bot-free visitors over the window.
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: The request correlation id, or null when unset.
            timestamp:
              type: string
              format: date-time
              description: ISO 8601 timestamp when the response was built.
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata, or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    Meta:
      type:
      - object
      - 'null'
      properties:
        request_id:
          type:
          - string
          - number
          - integer
          - 'null'
        timestamp:
          type:
          - string
          - number
          - integer
          - 'null'
          format: date-time
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardForbiddenResponse:
      description: Common legacy forbidden response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
