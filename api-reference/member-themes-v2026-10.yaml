  "/api/member/v2026-10/mysite/stats":
    get:
      operationId: member_mysite_stats_show
      x-fluid-audience: member
      tags:
      - mysite-stats
      summary: Read MySite statistics
      description: >-
        Read MySite visits and captured leads for the period from the daily member rollup, never by counting
        raw visits. Visits and leads are those the legacy profile fields count: attributed to the member's MySite
        by the member's own visitors and contacts. Requires a rep-eligible membership or root administrator.
        Responses are private for 60 seconds. While the company's member rollup is not enabled nothing is
        computed, and the read answers 503 rather than zero.
      parameters:
      - name: period
        in: query
        description: Trailing UTC days including today (7d, 30d, 90d, 1y), or every day on record (all). Defaults to all.
        schema:
          "$ref": "#/components/schemas/MysiteStatsPeriod"
      - name: If-None-Match
        in: header
        description: Previously returned private ETag. Authentication and MySite eligibility are checked before
          responding with 304.
        schema:
          type: string
      responses:
        '200':
          description: MySite statistics.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MysiteStatsEnvelope"
              example:
                status: 200
                data:
                  period: 30d
                  views: 412
                  leads: 9
                  computed_through: '2026-10-01T15:00:00Z'
                meta:
                  request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
                  timestamp: '2026-10-01T15:04:05Z'
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The authenticated member representation matches If-None-Match.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The membership cannot access MySite, or the credential is the shopper session JWT that order and subscription email links carry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Unsupported parameter or invalid period, with field-keyed details.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: The company's member rollup is not enabled yet, so MySite statistics are not computed; retry later.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
