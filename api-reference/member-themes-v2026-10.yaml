        content:
          application/json:
            schema:
              type: object
              description: Every current link UUID exactly once, in display order.
              additionalProperties: false
              required:
              - ids
              properties:
                ids:
                  type: array
                  uniqueItems: true
                  description: Complete ordered collection; empty only when no links
                    exist.
                  items:
                    type: string
                    format: uuid
            example:
              ids:
              - '01900000-0000-7000-8000-000000000001'
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReorderedLinksEnvelope"
              example:
                status: 200
                data:
                  - id: 019303aa-8380-7000-8000-2f384f0a448f
                    title: Riley's blog
                    url: https://riley.example.com/blog
                    position: 1
                meta:
                  request_uuid: 019303ac-50e0-7000-8000-8da76947ea44
                  timestamp: '2026-10-01T12:00:00Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access, or this credential cannot write.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid or incomplete order, model validation failed, or links changed concurrently.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/mysite/favorites":
    get:
      operationId: member_mysite_favorites_index
      x-fluid-audience: member
      tags:
      - mysite-favorites
      summary: List MySite featured products
      description: Return the bearer member’s saved company products ordered by shared
        MySite position then public UUID. Preserve the legacy management collection,
        including unpublished products. Other favorite kinds and foreign products are
        excluded. Requires MySite eligibility. Cursors expire after three days; a cursor
        from another scope restarts within the authenticated scope.
      parameters:
      - name: If-None-Match
        in: header
        description: Previously returned private ETag. Authentication and MySite access
          are checked before a 304.
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Signed cursor from meta.pagination.next_cursor.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum favorites per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Featured products in display order with cursor pagination.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FavoritesEnvelope"
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The private representation is unchanged.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: Invalid, tampered, or expired pagination cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      operationId: member_mysite_favorites_create
      x-fluid-audience: member
      tags:
      - mysite-favorites
      summary: Feature a product on MySite
      description: Feature an existing company product through the shared native writer.
        Preserve legacy management eligibility, including unpublished products. Require
        MySite access and a writable member credential. Reject ownership fields and
        duplicate favorites; invalidate MySite after commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Existing product and optional position in the shared MySite
                content order.
              additionalProperties: false
              required:
              - product_id
              properties:
                position:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Optional positive position in the shared MySite content
                    order; omitted products are placed at the top.
                product_id:
                  type: string
                  format: uuid
                  description: Public UUID of an existing product in the bearer member’s
                    company.
            example:
              product_id: '01900000-0000-7000-8000-000000000001'
              position: 1
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '201':
          description: The saved featured product and its public favorite identifier.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FavoriteEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access, or this credential cannot write.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid product or position parameters, duplicate favorite, or
            a product changed concurrently.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No company product matches the supplied identifier.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
