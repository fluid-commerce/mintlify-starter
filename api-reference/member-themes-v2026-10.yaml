          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access, or this credential cannot write.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/mysite/links/reorder":
    patch:
      operationId: member_mysite_links_reorder
      x-fluid-audience: member
      tags:
      - mysite-links
      summary: Reorder MySite custom links
      description: Replace the complete display order atomically. Requires MySite eligibility
        and a writable member credential. Missing, duplicate, foreign or unavailable
        IDs return 422 without changing any positions. Concurrent writes serialize on
        the native member. Clear MySite cache after commit.
