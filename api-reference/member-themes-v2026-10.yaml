---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Themes
  description: >-
    MySite settings, available themes, custom links, featured products and visit statistics for the
    authenticated member. The bearer alone determines the member and company. Settings support existing
    reads and theme selection.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: mysite-settings
  x-fluid-section: Members
  description: Read supported MySite settings and change the selected theme.
- name: mysite-themes
  x-fluid-section: Members
  description: Available company MySite themes.
- name: mysite-links
  x-fluid-section: Members
  description: Manage the authenticated member's custom links and their order.
- name: mysite-favorites
  x-fluid-section: Members
  description: Manage products featured on the authenticated member’s MySite.
- name: mysite-stats
  x-fluid-section: Members
  description: >-
    Visits to and leads captured by the authenticated member's MySite, from the daily member rollup. A
    period is the trailing 7, 30, 90 or 365 UTC days including today, or every day on record (the default, the lifetime counts the profile fields carry). Today is recomputed every 15 minutes, the 364
    days before it nightly, and older days weekly.
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or an opaque member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it is
        unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: private, max-age=300
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    SelectedTheme:
      type: object
      description: Currently selectable company theme.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public theme UUID.
        name:
          type:
          - string
          - 'null'
          description: Display name of the theme.
      required:
      - id
      - name
    Theme:
      type: object
      description: An available MySite theme.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public theme UUID.
        name:
          type:
          - string
          - 'null'
          description: Display name of the theme.
        preview_url:
          type:
          - string
          - 'null'
          description: Preview image URL, when configured.
      required:
      - id
      - name
      - preview_url
    Settings:
      type: object
      description: Supported existing MySite settings for the bearer membership.
      additionalProperties: false
      properties:
        slug:
          type:
          - string
          - 'null'
          description: Existing member username; read-only in this slice.
        url:
          type:
          - string
          - 'null'
          description: Public MySite URL; null when the member has no username.
        email_signature:
          type:
          - string
          - 'null'
          description: Existing membership email signature; read-only.
        theme:
          description: Selected eligible theme, or null when cleared or no longer available.
          anyOf:
          - "$ref": "#/components/schemas/SelectedTheme"
          - type: 'null'
      required:
      - slug
      - url
      - email_signature
      - theme
    SettingsEnvelope:
      type: object
      description: Settings response envelope.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
          const: 200
          description: HTTP response status.
        data:
          "$ref": "#/components/schemas/Settings"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ThemesEnvelope:
      type: object
      description: Themes response envelope.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
          const: 200
          description: HTTP response status.
        data:
          type: array
          description: The themes on this page.
          items:
            "$ref": "#/components/schemas/Theme"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
    Link:
      type: object
      description: Saved MySite custom link. URLs are stored values without tracking decoration.
      additionalProperties: false
      required:
      - id
      - title
      - url
      - position
      properties:
        id:
          type: string
          format: uuid
          description: Public link UUID.
        title:
          type: string
          description: Link label.
        url:
          type: string
          description: Saved destination URL, normalized by the existing link writer.
        position:
          type:
          - integer
          - 'null'
          description: Display position; null only for historical unpositioned links.
    LinkEnvelope:
      type: object
      description: Standard successful link response.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Link"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    LinksEnvelope:
      type: object
      description: Standard successful link response.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Link"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    ReorderedLinksEnvelope:
      type: object
      description: Standard successful link response.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Link"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    Favorite:
      type: object
      description: A product featured on the member’s MySite, not a private bookmark.
      additionalProperties: false
      required:
      - id
      - product
      - position
      properties:
        id:
          type: string
          format: uuid
          description: Public favorite UUID.
        position:
          type:
          - integer
          - 'null'
          description: Position in the shared MySite content order; null only for historical
            unpositioned rows.
        product:
          type: object
          description: Existing company product, including unpublished products the member
            can manage.
          additionalProperties: false
          required:
          - id
          - title
          - image_url
          - url
          properties:
            id:
              type: string
              format: uuid
              description: Public product UUID.
            title:
              type:
              - string
              - 'null'
              description: Localized product title.
            image_url:
              type:
              - string
              - 'null'
              description: Localized product image with the existing DAM and legacy fallbacks.
            url:
              type: string
              description: Canonical company storefront product URL.
    FavoriteEnvelope:
      type: object
      description: Successful featured-product creation with the saved favorite.
      example:
        status: 201
        data:
          id: '019a0488-a22d-78b9-a989-dcbca61d3c3d'
          product:
            id: '019a0488-8d12-753e-b623-27368412244e'
            title: Daily Wellness Kit
            image_url: https://cdn.primex.com/products/daily-wellness-kit.jpg
            url: https://shop.primex.com/products/daily-wellness-kit
          position: 1
        meta:
          request_uuid: '019a0489-1215-7461-ad49-ab123315c4b1'
          timestamp: '2026-10-01T13:00:00Z'
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Favorite"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    FavoritesEnvelope:
      type: object
      description: Paginated featured products and the cursor for the next page.
      example:
        status: 200
        data:
        - id: '019a0488-a22d-78b9-a989-dcbca61d3c3d'
          product:
            id: '019a0488-8d12-753e-b623-27368412244e'
            title: Daily Wellness Kit
            image_url: https://cdn.primex.com/products/daily-wellness-kit.jpg
            url: https://shop.primex.com/products/daily-wellness-kit
          position: 1
        meta:
          request_uuid: '019a0489-1215-7461-ad49-ab123315c4b1'
          timestamp: '2026-10-01T13:00:00Z'
          pagination:
            next_cursor:
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Favorite"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    MysiteStatsPeriod:
      type: string
      description: Trailing UTC days including today (7d, 30d, 90d, 1y is 365 days), or every day on record (all). Defaults to all.
      default: all
      enum:
      - 7d
      - 30d
      - 90d
      - 1y
      - all
    MysiteStats:
      type: object
      description: MySite visits and captured leads for one period.
      additionalProperties: false
      properties:
        period:
          "$ref": "#/components/schemas/MysiteStatsPeriod"
        views:
          type: integer
          minimum: 0
          description: MySite visits in the period.
        leads:
          type: integer
          minimum: 0
          description: Leads captured by the MySite in the period.
        computed_through:
          type:
          - string
          - 'null'
          format: date-time
          description: The latest time any rollup row read was recomputed, which shows when the newest row was
            written, not how old every row is; null when no activity was recorded in the period.
      required:
      - period
      - views
      - leads
      - computed_through
    MysiteStatsEnvelope:
      type: object
      description: MySite statistics for one period.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
          const: 200
          description: HTTP response status.
        data:
          "$ref": "#/components/schemas/MysiteStats"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ReorderedFavoritesEnvelope:
      type: object
      description: Successful featured-product reorder in the requested display order.
      example:
        status: 200
        data:
        - id: '019a0488-a22d-78b9-a989-dcbca61d3c3d'
          product:
            id: '019a0488-8d12-753e-b623-27368412244e'
            title: Daily Wellness Kit
            image_url: https://cdn.primex.com/products/daily-wellness-kit.jpg
            url: https://shop.primex.com/products/daily-wellness-kit
          position: 1
        meta:
          request_uuid: '019a0489-1215-7461-ad49-ab123315c4b1'
          timestamp: '2026-10-01T13:00:00Z'
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Favorite"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
paths:
  "/api/member/v2026-10/mysite/settings":
    get:
      operationId: member_mysite_settings_show
      x-fluid-audience: member
      tags:
      - mysite-settings
      summary: Read MySite settings
      description: >-
        Read supported settings for the bearer membership. Slug and email signature are read-only. Arbitrary preferences
        and planned settings without a native contract are omitted. Requires a rep-eligible membership or root administrator.
      parameters:
      - name: If-None-Match
        in: header
        description: Previously returned private ETag. Authentication is checked before responding with 304.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsEnvelope"
              example:
                status: 200
                data:
                  slug: rae-kim
                  url: https://primex.fluid.app/my/rae-kim
                  email_signature: null
                  theme: null
                meta:
                  request_uuid: 0198ec16-a579-7000-8000-000000000001
                  timestamp: "2026-10-01T12:00:00Z"
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The authenticated member representation matches If-None-Match.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '403':
          description: The membership cannot access MySite.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: member_mysite_settings_update
      x-fluid-audience: member
      tags:
      - mysite-settings
      summary: Update supported MySite settings
      description: >-
        Set theme_id to a public UUID from the available theme list, or null to clear it. Only public company-owned
        themes backed by a company MySite template are selectable. Requires a writable opaque member or AuthToken
        credential; member and portal JWTs are read-only. Supply slug to change the tenant username or email_signature
        to update or clear the signature. Slugs use legacy Unicode-aware lowercase normalization and honor the tenant
        username edit lock, reserved words, existing routes, redirects and tenant identity uniqueness.
        Supplied settings change atomically; omitted settings remain unchanged. Other settings writes are rejected. Successful
        changes invalidate MySite pages and publish mysite_settings.updated after commit. Requires a rep-eligible membership or root administrator.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one supported MySite setting.
              additionalProperties: false
              properties:
                theme_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Available theme UUID, or null to clear the selection.
                slug:
                  type: string
                  minLength: 1
                  description: New tenant username, normalized to a lowercase slug. Cannot be cleared.
                  example: rae-kim
                email_signature:
                  type: [string, 'null']
                  description: Saved email signature, or null to clear it.
                  example: Best regards, Rae
              minProperties: 1
            examples:
              clear:
                summary: Clear the selected theme
                value:
                  theme_id:
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettingsEnvelope"
              example:
                status: 200
                data:
                  slug: rae-kim
                  url: https://primex.fluid.app/my/rae-kim
                  email_signature: null
                  theme: null
                meta:
                  request_uuid: 0198ec16-a579-7000-8000-000000000001
                  timestamp: "2026-10-01T12:00:00Z"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The membership cannot access MySite or the member credential is read-only.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid body, unavailable theme, or settings changed concurrently; reload and retry concurrent edits.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/mysite/themes":
    get:
      operationId: member_mysite_themes_index
      x-fluid-audience: member
      tags:
      - mysite-themes
      summary: List available MySite themes
      description: >-
        Use the same public, company-owned theme picker as the existing member API. Excludes root themes, private
        development copies, and themes without a company-owned MySite template. Sorted by name then public UUID.
        Requires a rep-eligible membership or root administrator. A signed cursor lasts three days; a cursor from another company restarts the list in the current company.
      parameters:
      - name: If-None-Match
        in: header
        description: Previously returned private ETag. Authentication is checked before responding with 304.
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Signed cursor from meta.pagination.next_cursor.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum number of themes per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemesEnvelope"
              example:
                status: 200
                data:
                  - id: 0198ec16-a579-7000-8000-000000000002
                    name: Classic
                    preview_url: null
                meta:
                  request_uuid: 0198ec16-a579-7000-8000-000000000001
                  timestamp: "2026-10-01T12:00:00Z"
                  pagination:
                    next_cursor: null
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The authenticated member representation matches If-None-Match.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: Malformed, tampered, or expired pagination cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The membership cannot access MySite.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/mysite/links":
    get:
      operationId: member_mysite_links_index
      x-fluid-audience: member
      tags:
      - mysite-links
      summary: List MySite custom links
      description: Return only the bearer member’s links, ordered by position then public
        UUID. Requires existing MySite eligibility. Cursors expire after three days;
        a cursor from another member restarts within the authenticated member’s scope.
      parameters:
      - name: If-None-Match
        in: header
        description: Previously returned private ETag. Authentication and MySite access
          are checked before a 304.
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: Signed cursor from meta.pagination.next_cursor.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum links per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LinksEnvelope"
              example:
                status: 200
                data:
                  - id: 019303aa-8380-7000-8000-2f384f0a448f
                    title: Riley's blog
                    url: https://riley.example.com/blog
                    position: 1
                meta:
                  request_uuid: 019303ac-50e0-7000-8000-8da76947ea44
                  timestamp: '2026-10-01T12:00:00Z'
                  pagination:
                    next_cursor: null
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The private representation is unchanged.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: Invalid, tampered, or expired pagination cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      operationId: member_mysite_links_create
      x-fluid-audience: member
      tags:
      - mysite-links
      summary: Add a MySite custom link
      description: Create a link for the bearer member through the shared native writer.
        Requires MySite eligibility and a writable member credential. Invalidate the
        member’s MySite after commit. Ownership fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: New custom link.
              additionalProperties: false
              required:
              - title
              - url
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Nonblank link label.
                url:
                  type: string
                  minLength: 1
                  description: Nonblank destination accepted by the existing URL normalizer.
                position:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: Optional initial display position; omitted links are
                    appended.
            example:
              title: My blog
              url: https://example.com/blog
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LinkEnvelope"
              example:
                status: 201
                data:
                  id: 019303aa-8380-7000-8000-2f384f0a448f
                  title: Riley's blog
                  url: https://riley.example.com/blog
                  position: 1
                meta:
                  request_uuid: 019303ac-50e0-7000-8000-8da76947ea44
                  timestamp: '2026-10-01T12:00:00Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access, or this credential cannot write.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid link attributes or display position, or model validation failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/mysite/links/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Public UUID of a link owned by the bearer member.
      schema:
        type: string
        format: uuid
    patch:
      operationId: member_mysite_links_update
      x-fluid-audience: member
      tags:
      - mysite-links
      summary: Edit a MySite custom link
