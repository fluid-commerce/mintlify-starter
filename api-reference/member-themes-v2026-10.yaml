            schema:
              type: object
              description: Fields to change; all others remain untouched.
              additionalProperties: false
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Nonblank link label.
                url:
                  type: string
                  minLength: 1
                  description: Nonblank destination accepted by the existing URL normalizer.
            example:
              title: Latest posts
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LinkEnvelope"
              example:
                status: 200
                data:
                  id: 019303aa-8380-7000-8000-2f384f0a448f
                  title: Riley's blog
                  url: https://riley.example.com/blog
                  position: 1
                meta:
                  request_uuid: 019303ac-50e0-7000-8000-8da76947ea44
                  timestamp: '2026-10-01T12:00:00Z'
        '404':
          description: No owned link matches the identifier.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Membership has no MySite access, or this credential cannot write.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Invalid link attributes, model validation failed, or the link changed concurrently.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
