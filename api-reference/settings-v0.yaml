    post:
      summary: Start company bank-account setup
      description: |
        Reserve a durable setup attempt after the authenticated company admin
        accepts the current variable-amount ACH authorization and submits its exact
        frontend wording for fingerprint verification. Returns the
        Stripe client secret used by Stripe-rendered bank account collection.
        The optional existing-bank fields select a company-owned encrypted
        account for server-side Stripe tokenization; all three must be sent
        together. Bank and routing numbers are never accepted by this endpoint.
      tags:
      - billing
      operationId: settings_v0_create_billing_instrument_setup
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [instrument_setup]
              properties:
                instrument_setup:
                  type: object
                  additionalProperties: false
                  required: [billing_name, billing_email, authorization_version, authorization_text, accepted]
                  dependentRequired:
                    bank_account_id: [bank_account_type, account_holder_type]
                    bank_account_type: [bank_account_id, account_holder_type]
                    account_holder_type: [bank_account_id, bank_account_type]
                  if:
                    required: [instrument_type]
                    properties: { instrument_type: { const: card } }
                  then:
                    properties: { bank_account_id: false, bank_account_type: false, account_holder_type: false }
                  properties:
                    instrument_type:
                      type: string
                      enum: [us_bank_account, card]
                      default: us_bank_account
                      description: Rail to set up. A card takes no bank account fields, and is refused while the card agreement is not approved.
                    billing_name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: '\S'
                    billing_email:
                      type: string
                      format: email
                    authorization_version:
                      type: string
                      minLength: 1
                      pattern: '\S'
                    authorization_text:
                      type: string
                      minLength: 1
                      maxLength: 20000
                      description: Exact frontend agreement accepted; the server verifies its approved SHA-256 fingerprint.
                    accepted:
                      type: boolean
                      const: true
                    bank_account_id:
                      type: integer
                      minimum: 1
                      description: Existing bank account owned by the authenticated company.
                    bank_account_type:
                      type: string
                      enum: [checking, savings]
                    account_holder_type:
                      type: string
                      const: company
            example:
              instrument_setup:
                instrument_type: us_bank_account
                billing_name: Dunder Mifflin Paper Company
                billing_email: angela.martin@dundermifflin.com
                authorization_version: fluid-ach-v1
                authorization_text: 'MERCHANT BANK ACCOUNT DEBIT AUTHORIZATION AND PLATFORM FEE AGREEMENT
              
              
                  By creating and maintaining a merchant profile on Fluid and providing the bank account information requested by Fluid (the “Platform”), Merchant authorizes the Platform and its designated payment processor, financial institution, or payment service provider to initiate electronic debits (including ACH debits, where applicable) from the bank account designated by Merchant for amounts that Merchant owes to the Platform under the Platform’s applicable Merchant Agreement, Terms of Service, fee schedule, or other agreement governing Merchant’s use of the Platform (collectively, the “Platform Fees”).
              
              
                  This authorization is provided voluntarily and constitutes Merchant’s authorization for the Platform, through its payment processor or financial institution, to debit the designated bank account for Platform Fees and other amounts expressly authorized under Merchant’s agreement with the Platform.
              
              
                  Merchant represents and warrants that it is authorized to use the designated bank account and to authorize electronic debits from that account. Merchant agrees that the bank-account information provided to the Platform is accurate and complete and will promptly update that information if the account changes, is closed, or is no longer authorized for such debits.
              
              
                  Amount of Debits. Debits may be made for Platform Fees and other amounts that are due and payable by Merchant under the applicable Merchant Agreement. Where the amount of a debit is not a fixed amount, the amount will be determined in accordance with the Platform’s then-current fee schedule and the transaction activity or other applicable charges associated with Merchant’s use of the Platform.
              
              
                  Authorization Duration. This authorization will remain in effect for as long as Merchant maintains an account with the Platform and has amounts payable to the Platform, unless and until Merchant properly revokes the authorization as described below. Revocation does not relieve Merchant of any payment obligation incurred before revocation or otherwise terminate Merchant’s obligations under the applicable Merchant Agreement.
              
              
                  How to Revoke Authorization. Merchant may revoke this authorization by providing written notice to finance@fluid.app. To allow reasonable time to process the revocation and prevent additional authorized debits, Merchant should submit the revocation notice at least 15 business days before the date of any debit Merchant wishes to prevent. Revocation will become effective after the Platform has had a reasonable opportunity to process the request. Revocation of this authorization does not cancel, waive, or otherwise affect Platform Fees or other amounts already owed by Merchant.
              
              
                  Merchant acknowledges that it has read and understands this authorization and agrees that submitting the bank-account information and accepting these terms constitutes its authorization for the Platform and its designated payment processor to initiate the debits described above.'
                accepted: true
                bank_account_id: 3187
                bank_account_type: checking
                account_holder_type: company
      responses:
