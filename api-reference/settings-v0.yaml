      - name: Authorization
        in: header
        required: true
        description: Bearer token for authentication
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
        required: false
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
        required: false
        description: 'Number of records per page (default: 25)'
      - name: view
        in: query
        required: false
        description: Use picker for company ID, UUID, and name only, without membership counts. Defaults to the full index response.
