  "/api/settings/billing/standing":
    get:
      summary: Show the company's billing standing
      description: >-
        The authenticated company's derived standing: whether enforcement is held, what has
        lapsed, and the dates each tier could act. Never names internal identifiers, another
        company, a waiver decision, or a bank account. Reading changes nothing.
      tags:
      - billing
      operationId: settings_v0_get_billing_standing
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingStandingResponse"
              example:
                standing:
                  state: clear
                  waived: false
                  authorization_missing: false
                  evidence_complete: true
                  observed_at: '2026-09-30T14:05:11Z'
                  lapses: []
                  conditions: []
                status: 200
                meta:
                  request_id: f3b8c2d1-6a4e-4f7b-9c1d-2e5a8b7c4d90
                  timestamp: '2026-09-30T14:05:11Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.view permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: Platform billing does not invoice this company
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Financial evidence could not be read on a coherent snapshot
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/settings/billing/documents":
    get:
      summary: List the company's Stripe documents
      description: >-
        Every Stripe document of the authenticated company's billing, newest
        first, one cursor page at a time: the paid invoice of each charge (a
        credit purchase or a pull from its bank account or card) and the
        credit note of each refund. A voided document is not listed. Open one
        with GET /api/settings/billing/documents/{id}/link. Reading changes
        nothing.
      tags:
      - billing
      x-fluid-lint-exempt: "Joins the unversioned merchant billing settings routes (settings-v0) the Admin app already calls; a dated path would split one resource family across two versions."
      x-fluid-audience: company
      operationId: settings_v0_list_billing_documents
      security:
      - bearer_auth: []
      parameters:
      - name: page[cursor]
        in: query
        required: false
        description: The cursor of the page to read; left out is the newest page.
        schema: { type: string }
      - name: page[limit]
        in: query
        required: false
        description: Documents per page.
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingDocumentsResponse"
              example:
                documents:
                - id: 412
                  kind: credit_note
                  description: "Refund: usage credits"
                  amount_cents: 5000
                  surcharge_cents: 0
                  total_cents: 5000
                  currency_code: USD
                  occurred_at: "2026-09-29T14:12:03Z"
                - id: 409
                  kind: invoice
                  description: Usage credits
                  amount_cents: 10000
                  surcharge_cents: 0
                  total_cents: 10000
                  currency_code: USD
                  occurred_at: "2026-09-28T09:30:41Z"
                meta:
                  pagination:
                    cursor: null
                    limit: 25
                    prev_cursor: null
                    next_cursor: null
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.view permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: The page cursor or limit could not be read
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/settings/billing/documents/{id}/link":
    get:
      summary: Get the Stripe link of a document
      description: >-
        The link to read one Stripe document of the authenticated company: the
        hosted invoice page and PDF of a paid charge, or the PDF of a refund's
        credit note, which Stripe gives no hosted page. Stripe's links expire,
        so each call fetches a fresh one; open it straight away. Reading
        changes nothing.
      tags:
      - billing
      x-fluid-lint-exempt: "Joins the unversioned merchant billing settings routes (settings-v0) the Admin app already calls; a dated path would split one resource family across two versions."
      x-fluid-audience: company
      operationId: settings_v0_get_billing_document_link
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The document's id.
        schema: { type: integer }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingDocumentLinkResponse"
              example:
                document:
                  url: https://invoice.stripe.com/i/acct_1MExQ9BjIQrRQnux/live_YWNjdF8xTUV4UTlCaklRclJRbnV4
                  pdf_url: https://pay.stripe.com/invoice/acct_1MExQ9BjIQrRQnux/live_YWNjdF8xTUV4UTlCaklRclJRbnV4/pdf
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.view permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: No such document for the company, or it is void
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '502':
          description: Stripe refused the request or failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '503':
          description: Stripe is not configured for the document's mode
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/settings/billing/payments":
    get:
      summary: List the company's payments
      description: >-
        Every pull from the authenticated company's bank account or card,
        newest first, one cursor page at a time, with where each one's money
        stands and the invoices it was for. Refunds are not listed, and a
        won dispute shows as the returned pull's recovered_at rather than as
        a second payment. Reading
        changes nothing.
      tags:
      - billing
      operationId: settings_v0_list_billing_payments
      security:
      - bearer_auth: []
      parameters:
      - name: page[cursor]
        in: query
        required: false
        description: The cursor of the page to read; left out is the newest page.
        schema: { type: string }
      - name: page[limit]
        in: query
        required: false
        description: Payments per page.
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingPaymentsResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.view permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: The page cursor or limit could not be read
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/settings/billing/payments/{id}/invoice":
    get:
      summary: Get the Stripe invoice link of a payment
      description: >-
        The link to the Stripe-hosted invoice page, and its PDF, for one pull from the authenticated company's bank account or card. Stripe's links expire, so each call fetches a fresh one; open it straight away. A pull has an invoice once its payment is paid in Stripe, which the payment's invoice_available says. Reading changes nothing.
      tags:
      - billing
      x-fluid-lint-exempt: "Joins the unversioned merchant billing settings routes (settings-v0) the Admin app already calls; a dated path would split one resource family across two versions."
      x-fluid-audience: company
      operationId: settings_v0_get_billing_payment_invoice
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The pull's id.
        schema: { type: integer }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingChargeInvoiceResponse"
              example:
                invoice:
                  url: https://invoice.stripe.com/i/acct_1MExQ9BjIQrRQnux/live_YWNjdF8xTUV4UTlCaklRclJRbnV4
                  pdf_url: https://pay.stripe.com/invoice/acct_1MExQ9BjIQrRQnux/live_YWNjdF8xTUV4UTlCaklRclJRbnV4/pdf
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.view permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: No such payment for the company, or it has no paid invoice yet
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '502':
          description: Stripe refused the request or failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '503':
          description: Stripe is not configured for the charge's mode
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/settings/billing/usage-controls":
    get:
      summary: Show the company's spend limits
      description: >-
        The authenticated company's monthly spend limits and auto-reload.
        Reading changes nothing.
      tags:
      - billing
      operationId: settings_v0_get_billing_usage_controls
      security:
      - bearer_auth: []
      responses:
        '200':
