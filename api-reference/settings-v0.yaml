  "/api/settings/billing/credits/pay-now":
    post:
      summary: Pay the overdrawn credit balance now
      description: >-
        Charges the saved card or bank account for what the credit balance is
        overdrawn by, now instead of at the next billing run: exactly the debt
        (never more), at least $0.50 on any rail, and no auto-reload top-up. A
        debt under $0.50 is refused (below_minimum, 422). Only for a company whose billing is paid from
        credits. It is the merchant's own charge, so it works while automatic
        charges are blocked: a success lifts that block, a failure keeps it. A
        declined card returns the charge as failed, with its reason (201).
        Takes no key. The optional body names the total the page showed,
        credit card fee included; a total that is no longer what the charge
        would be is refused (409, quote_changed), and a request with no total
        is refused the same way when the charge carries a fee. Only one charge
        runs at a time: while one is on its way a repeat is refused (409), and
        once the debt is paid a repeat finds nothing owed (422); neither
        charges. Needs billing.update; never a Droplet token.
      tags:
      - billing
      x-fluid-lint-exempt: "Joins the unversioned merchant billing settings routes (settings-v0) the Admin app already calls; a dated path would split one resource family across two versions."
      x-fluid-audience: company
      operationId: settings_v0_create_billing_credit_debt_payment
      security:
      - bearer_auth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_total_cents: { type: integer, minimum: 1, description: "The total the page showed, in cents: exactly the debt, plus any credit card fee. Left out means the page showed the debt with no fee." }
            example:
              expected_total_cents: 102900
      responses:
        '201':
          description: The charge was reserved and sent; its status says where the payment stands
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingCreditPayNowResponse"
              example:
                credit_purchase:
                  id: 7391
                  origin: settlement
                  status: succeeded
                  instrument_type: card
                  failure_message: null
                  invoice_available: false
                  top_up_cents: 0
                  amount_cents: 100000
                  bonus_percent: 0
                  bonus_cents: 0
                  credit_cents: 100000
                  surcharge_cents: 0
                  total_cents: 100000
                  refunded_cents: 0
                  credits_expire_at: '2027-09-30T14:05:11Z'
                  created_at: '2026-09-30T14:05:09Z'
                  succeeded_at: '2026-09-30T14:05:11Z'
                  failed_at: null
                balance_cents: 0
                status: 201
                meta:
                  request_id: f3b8c2d1-6a4e-4f7b-9c1d-2e5a8b7c4d90
                  timestamp: '2026-09-30T14:05:11Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.update permission, not an admin, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: The company's billing is not paid from credits (not_credit_billed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: A charge is already on its way (in_flight), or the total is not the one the page showed (quote_changed); nothing was charged
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Nothing is owed (no_debt), the debt is under the $0.50 smallest charge (below_minimum), or the saved payment method cannot be charged (no_profile, not_active, not_auto_debit, no_instrument, no_mandate, instrument_mode_mismatch)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '503':
          description: >-
            Payments are unavailable (purchase_unavailable). Nothing was
            charged and nothing sends the charge again: the attempt is
            recorded as a failed purchase (provider_unconfigured). Pay again
            when payments return, or the next billing run charges the debt
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
