      summary: Buy credits with the saved card or bank account
      description: >-
        Charges the company's saved card or bank account off-session and grants the credits,
        and the bonus its tier gives, once Stripe reports the money received:
        at once for a card that succeeds, else when the payment settles. The
        server prices every purchase: expected_credit_cents must equal what it
        quotes, expected_surcharge_cents the credit card fee it charges (0
        when left out), expected_payment_method_key the payment method it
        charges (not checked when left out), and terms_version the terms in
        force, or nothing is charged (409). A repeat of the same purchase_key charges once and returns the
        first purchase (200). A declined card returns the purchase as failed
        with its reason. Needs billing.update; never a Droplet token.
      tags:
      - billing
      operationId: settings_v0_create_billing_credit_purchase
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount_cents, expected_credit_cents, purchase_key, terms_version]
              properties:
                amount_cents: { type: integer, minimum: 1, description: What to pay, in cents; whole dollars within the company's purchase limits. }
                expected_credit_cents: { type: integer, minimum: 1, description: The credits the page quoted, bonus included, in cents. }
                purchase_key: { type: string, format: uuid, description: Caller-supplied UUID naming this purchase, so a retry charges once. }
                terms_version: { type: string, description: The purchase terms version shown before Buy. }
                expected_surcharge_cents: { type: integer, minimum: 0, description: "The credit card fee the page showed, in cents, charged on top of amount_cents. Left out means the page showed no fee." }
                expected_payment_method_key: { type: string, minLength: 1, description: "The payment_method.key the page showed. A new purchase is refused (409 quote_changed, details.payment_method_changed true, nothing reserved) when the saved method is another. A repeat of a purchase_key already used charges the method that purchase was reserved on. Left out means the method is not checked." }
            example:
              amount_cents: 100000
              expected_credit_cents: 110000
              purchase_key: 3f7a2c91-8e4d-4b6a-9c15-e2d8b0f47a36
              terms_version: '2026-10-02'
      responses:
        '201':
          description: The purchase was made; its status says where the payment stands
