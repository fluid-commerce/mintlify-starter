  "/api/settings/billing/instrument-setup/confirm":
    post:
      summary: Finish a setup Stripe confirmed
      description: |
        Finish the specified setup owned by the authenticated company once Stripe
        has confirmed it in the browser, without waiting for Stripe's webhook.
        The server reads the SetupIntent from Stripe with the setup's original
        mode and applies it exactly as the webhook would, so either may arrive
        first and the second changes nothing. A setup Stripe has not confirmed,
        or one that is no longer pending, is returned unchanged.
      tags: [billing]
      operationId: settings_v0_confirm_billing_instrument_setup
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_setup_id]
              properties:
                instrument_setup_id:
                  type: integer
                  minimum: 1
                  description: The setup Stripe just confirmed.
                  example: 42
            example:
              instrument_setup_id: 5823
      responses:
        '200':
          description: The setup as Stripe and Fluid now agree; it may still be pending.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingInstrumentSetupShowResponse"
              example:
                instrument_setup:
                  id: 5823
                  instrument_type: us_bank_account
                  status: usable
                  provider: stripe
                  billing_email: angela.martin@dundermifflin.com
                  authorization_version: fluid-ach-v1
                  authorization_accepted_at: '2026-09-30T14:05:11Z'
                  failure_code: null
                  created_at: '2026-09-30T14:05:11Z'
                authorization:
