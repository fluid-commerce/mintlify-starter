          type: string
          enum: [index, picker]
      - name: sorted_by
        in: query
        schema:
          type: string
        required: false
        description: Sort the result by a specific field
      - name: search_query
        in: query
        schema:
          type: string
        required: false
        description: Search query to filter companies
