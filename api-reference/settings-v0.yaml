    AvalaraAccountSlot:
      type: object
      description: One stored Avalara credential slot. The environment is the slot key; while any slots exist, exactly one is active and live tax calculation authenticates with it.
      required:
      - environment
      - username
      - password
      - company_code
      - active
      properties:
        environment:
          type: string
          description: Which AvaTax host the credentials authenticate against. Also the slot key; a company stores at most one slot per environment.
          enum:
          - sandbox
          - production
        username:
          type: string
          description: Always the obfuscation marker, never the stored username; identify a slot by its environment and company_code.
          enum:
          - '********'
          example: '********'
        password:
          type: string
          description: Always the obfuscation marker, never the stored password.
          enum:
          - '********'
        company_code:
          type:
          - string
          - 'null'
          description: AvaTax companyCode targeting one company on a multi-company Avalara account.
        active:
          type: boolean
          description: Whether this slot is the active environment. A company with slots always has exactly one active slot.
      additionalProperties: false
    AvalaraAccountsResponse:
      type: object
      required:
      - avalara_accounts
      - status
      - meta
      properties:
        avalara_accounts:
          type: array
          description: All stored Avalara credential slots ordered production first, or an empty array when none are configured.
          items:
            "$ref": "#/components/schemas/AvalaraAccountSlot"
        status:
          type: integer
          enum:
          - 200
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties: false
    AvalaraAccountResponse:
      type: object
      required:
      - avalara_account
      - status
      - meta
      properties:
        avalara_account:
          "$ref": "#/components/schemas/AvalaraAccountSlot"
        status:
          type: integer
          enum:
          - 200
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties: false
    UpdateAvalaraAccountRequest:
      type: object
      required:
      - avalara_account
      properties:
        avalara_account:
          type: object
          description: The slot named by environment is created or updated; omitted fields keep their stored values.
          required:
          - environment
          properties:
            environment:
              type: string
              description: The credential slot to create or update. A slot's environment never changes; the active environment switches only via the active flag.
              enum:
              - sandbox
              - production
            username:
              type: string
              minLength: 1
              description: Avalara account username. Required when the slot is being created; the obfuscation marker is a masked echo and keeps the stored username.
            password:
              type: string
              minLength: 1
              description: Avalara account password. Required when the slot is being created; the obfuscation marker is ignored.
            company_code:
              type:
              - string
              - 'null'
              description: AvaTax companyCode; null clears it.
            active:
              type: boolean
              description: true makes this slot the active environment and deactivates the other; the switch is allowed while "avalara" is the selected tax class, because moving from the sandbox host to the production host is how a proven integration goes live, but is refused while any country has Avalara document commits enabled, since committed documents can only be voided on the host that filed them. Selecting avalara requires some slot to be active, either environment. false is refused, because a company with slots always has exactly one active slot; deactivate a slot by activating the other environment.
          additionalProperties: false
      additionalProperties: false
