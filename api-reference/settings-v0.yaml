    patch:
      summary: Set the company's spend limits
      description: >-
        Sets some or all of the authenticated company's monthly spend limits and
        auto-reload; anything left out keeps its value, and a null limit is no
        limit. Turning auto-reload on records the merchant's consent to the
        authorization version sent; turning it off withdraws it.
      tags:
      - billing
      operationId: settings_v0_update_billing_usage_controls
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limits_enabled: { type: boolean, description: Whether the monthly spend limits are on. }
                auto_reload: { type: boolean, description: Whether a low balance reloads itself; turning it on needs reload_authorization_version. }
                reload_authorization_version: { type: string, description: The auto-reload authorization version the merchant was shown and accepts. }
                auto_reload_threshold_cents: { type: [integer, "null"], minimum: 1, description: Reload below this spendable balance, in whole dollars of cents; null is Fluid's default. }
                auto_reload_amount_cents: { type: [integer, "null"], minimum: 1, description: What one reload buys, in whole dollars of cents within the purchase limits; null is Fluid's default. }
                orders_limit_cents: { type: [integer, "null"], minimum: 1, description: Orders and checkout; notified, never stopped. }
                ai_limit_cents: { type: [integer, "null"], minimum: 1, description: Monthly ceiling on AI, in cents. }
                hosting_limit_cents: { type: [integer, "null"], minimum: 1, description: Apps, hosting and media; notified, never stopped. }
                studios_limit_cents: { type: [integer, "null"], minimum: 1, description: Monthly ceiling on Fluid Studios, in cents. }
                ai_daily_limit_cents: { type: [integer, "null"], minimum: 1, description: Daily ceiling on AI, in cents. }
                studios_daily_limit_cents: { type: [integer, "null"], minimum: 1, description: Daily ceiling on Fluid Studios, in cents. }
                auto_reload_daily_cap_cents: { type: [integer, "null"], minimum: 1, description: The most auto-reload tops up in a day; null is Fluid's default. }
                auto_reload_monthly_cap_cents: { type: [integer, "null"], minimum: 1, description: The most auto-reload tops up in a month; null is Fluid's default. }
                shown_reload_threshold_cents: { type: integer, minimum: 1, description: "The reload threshold the merchant was shown with the consent, as reload_threshold_cents reads it. Sent with a save that turns auto-reload on or renews its consent; if the threshold the save would store differs, the save is refused with 409 usage_controls_changed. A renewal renews the consent only when it sends all four shown_reload_* figures: with none, the old consent stays and the rest of the save applies; with only some, the save is refused with 422. Left out of a first turn-on, it is not checked." }
                shown_reload_amount_cents: { type: integer, minimum: 1, description: "The reload amount shown with the consent, as reload_amount_cents reads it; checked like shown_reload_threshold_cents." }
                shown_reload_daily_cap_cents: { type: integer, minimum: 1, description: "The daily reload cap shown with the consent, as reload_caps.daily_cents reads it; checked like shown_reload_threshold_cents." }
                shown_reload_monthly_cap_cents: { type: integer, minimum: 1, description: "The monthly reload cap shown with the consent, as reload_caps.monthly_cents reads it; checked like shown_reload_threshold_cents." }
            example:
              limits_enabled: true
              ai_limit_cents: 150000
              studios_limit_cents: 75000
              ai_daily_limit_cents: 10000
              auto_reload: true
              reload_authorization_version: '2026-10-02'
              auto_reload_threshold_cents: 5000
              auto_reload_amount_cents: 20000
              shown_reload_threshold_cents: 5000
              shown_reload_amount_cents: 20000
              shown_reload_daily_cap_cents: 50000
              shown_reload_monthly_cap_cents: 500000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingUsageControlsResponse"
              example:
                usage_controls:
                  limits_enabled: true
                  auto_reload: true
                  reload_caps:
                    daily_cents: 50000
                    monthly_cents: 500000
                  limits:
                    orders: null
                    ai: 150000
                    hosting: null
                    studios: 75000
                  daily_limits:
                    ai: 10000
                    studios: null
                  reload_threshold_cents: 5000
                  reload_amount_cents: 20000
                  reload_authorized: true
                  reload_authorization_current: true
                  reload_authorization:
                    version: '2026-10-02'
                    text: You authorize Fluid to charge the card or debit the bank account on file for the reload amount you set whenever your usage credits fall below your threshold, up to your daily and monthly reload limits. Each reload is a purchase of usage credits on the purchase terms. You can turn auto-reload off at any time. A declined or returned reload pauses further reloads until you change your payment method or turn auto-reload off and on again. A reload charged to a credit card carries a credit card fee of 2.9% of the reload amount, charged with it. Debit cards and prepaid cards carry no fee.
                  reload_block: null
                  reload_cap_reached: null
                status: 200
                meta:
                  request_id: f3b8c2d1-6a4e-4f7b-9c1d-2e5a8b7c4d90
                  timestamp: '2026-09-30T14:05:11Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Missing billing.update or billing.view permission, or a Droplet token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: >-
            The reload figures the save would store are not the ones it says it
            showed with the consent, or a consent to turn auto-reload on found
            it already on under the authorization in force
            (usage_controls_changed). Nothing was saved; the details carry the
            figures in force (reload_threshold_cents, reload_amount_cents,
            reload_daily_cap_cents, reload_monthly_cap_cents). Read the controls
            again: while reload_authorized is false or
            reload_authorization_current is false, show those figures and accept
            again; while auto-reload is on under the authorization in force, send
            the intended changes as an edit, without reload_authorization_version
            or the shown_reload_* figures.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: A limit was not a positive whole number of cents, the reload figures are outside the purchase limits, or auto-reload was turned on without the authorization in force (authorization_required)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
