                      - product_code: txn_fee
                        description: Transaction fee
                        quantity: '721.0'
                        unit: transaction
                        amount_cents: 21630
                        paid_with_credits: null
                  billing_email: angela.martin@dundermifflin.com
                  payment_method:
                    status: usable
                    method: auto_debit
                    bank: PNC Bank
                    mask: ••••6789
                    bank_account_id: 3187
                    instrument_type: us_bank_account
                    display:
                      bank_name: PNC Bank
                      last4: '6789'
                    key: 9f2c41d07a3b8e65c1f04d2a7b9e3c18
                  transaction_rates:
                    reset_period: monthly_calendar
                    accumulated_cents: 4829150
                    minimum_volume_cents: null
                    tiers:
                    - threshold_cents: 0
                      rate_percent: '2.9'
                      fixed_cents: 30
