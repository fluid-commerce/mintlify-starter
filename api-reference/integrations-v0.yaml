        Optionally pass `scopes` to set the installation's scopes and `role_id` to attach one of your company's roles. An unknown `role_id` returns 422.

        When the installation is created, Fluid sends the droplet's install webhook so the droplet can set itself up for your company.

        Call it with a company admin's Bearer token, or a company API or partner token, that has the `droplets.update` permission. Other callers get 401. A droplet that is already installed on your company returns 409; a droplet your company cannot install returns 404.

