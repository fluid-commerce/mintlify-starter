---
openapi: 3.1.0
info:
  title: Fluid Integrations API
  version: v0
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: droplets
  description: Create, list, and manage droplets — the apps a company publishes to the Fluid marketplace or builds for its own use.
  x-fluid-section: Droplets
- name: droplet-installations
  description: Install droplets on a company, manage those installations, and let an installed droplet redeem its one-time exchange token for its credentials.
  x-fluid-section: Droplets
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    Meta:
      type: object
      required:
      - request_id
      - timestamp
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    IndexDropletCategoriesResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_categories
      - meta
      properties:
        droplet_categories:
          type: array
          items:
            title: DropletCategory
            type: object
            required:
            - name
            - slug
            - description
            properties:
              name:
                type: string
              slug:
                type:
                - string
                - 'null'
              description:
                type:
                - string
                - 'null'
        meta:
          "$ref": "#/components/schemas/Meta"
    IndexDropletInstallationsResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_installations
      - meta
      properties:
        droplet_installations:
          type: array
          items:
            title: DropletInstallation
            type: object
            required:
            - uuid
            - id
            - droplet_uuid
            - droplet_name
            - active
            - scopes
            properties:
              uuid:
                type: string
              id:
                type: integer
              droplet_uuid:
                type: string
              droplet_name:
                type:
                - string
                - 'null'
              active:
                type: boolean
                default: true
              scopes:
                type: array
                items:
                  type: string
        meta:
          type: object
          required:
          - request_id
          - timestamp
          - pagination
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            pagination:
              "$ref": "#/components/schemas/Pagination"
    CreateDropletInstallationResponse201ApplicationJsonSchema:
      type: object
      required:
      - droplet_installation
      - meta
      properties:
        droplet_installation:
          title: DropletInstallation
          type: object
          required:
          - uuid
          - id
          - droplet_uuid
          - droplet_name
          - active
          - scopes
          - effective_scopes
          - created_at
          properties:
            uuid:
              type: string
            id:
              type: integer
            droplet_uuid:
              type: string
            droplet_name:
              type:
              - string
              - 'null'
            active:
              type: boolean
              default: true
            scopes:
              type: array
              items:
                type: string
            effective_scopes:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: date-time
        meta:
          "$ref": "#/components/schemas/Meta"
    AddUserAsAdminResponse401ApplicationJsonSchema:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    CreateDropletInstallationRequestBodyApplicationJsonSchema:
      type: object
      required:
      - droplet_uuid
      properties:
        droplet_uuid:
          type: string
        role_id:
          type:
          - integer
          - 'null'
        scopes:
          type: array
          items:
            type: string
    ShowDropletInstallationResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_installation
      - meta
      properties:
        droplet_installation:
          title: DropletInstallation
          type: object
          required:
          - uuid
          - id
          - droplet_uuid
          - droplet_name
          - active
          - scopes
          - effective_scopes
          - created_at
          - updated_at
          properties:
            uuid:
              type: string
            id:
              type: integer
            droplet_uuid:
              type: string
            droplet_name:
              type:
              - string
              - 'null'
            active:
              type: boolean
              default: true
            scopes:
              type: array
              items:
                type: string
            effective_scopes:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        meta:
          "$ref": "#/components/schemas/Meta"
    UpdateDropletInstallationResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_installation
      - meta
      properties:
        droplet_installation:
          title: DropletInstallation
          type: object
          required:
          - uuid
          - id
          - droplet_uuid
          - droplet_name
          - active
          - scopes
          - effective_scopes
          - updated_at
          properties:
            uuid:
              type: string
            id:
              type: integer
            droplet_uuid:
              type: string
            droplet_name:
              type:
              - string
              - 'null'
            active:
              type: boolean
              default: true
            scopes:
              type: array
              items:
                type: string
            effective_scopes:
              type: array
              items:
                type: string
            updated_at:
              type: string
              format: date-time
        meta:
          "$ref": "#/components/schemas/Meta"
    DestroyDropletInstallationResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_installation
      - meta
      properties:
        droplet_installation:
          title: DropletInstallation
          type: object
          required:
          - uuid
          - id
          properties:
            uuid:
              type: string
            id:
              type: integer
        meta:
          "$ref": "#/components/schemas/Meta"
    DropletFeature:
      title: Droplet::Feature
      type: object
      required:
      - name
      properties:
        name:
          type: string
        summary:
          type:
          - string
          - 'null'
        details:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        video_url:
          type:
          - string
          - 'null'
    DropletRequestFeature:
      title: Droplet::Feature
      type: object
      required:
      - name
      - summary
      - details
      properties:
        name:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        details:
          type: string
          minLength: 1
        image_url:
          type: string
          minLength: 1
        video_url:
          type: string
          minLength: 1
    DropletMarketplacePage:
      title: Droplet::MarketplacePage
      type:
      - object
      - 'null'
      required:
      - title
      properties:
        title:
          type: string
        logo_url:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
    DropletRequestMarketplacePage:
      title: Droplet::MarketplacePage
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
        logo_url:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
    DropletDetailsPage:
      title: Droplet::DetailsPage
      type:
      - object
      - 'null'
      required:
      - title
      properties:
        title:
          type: string
        logo_url:
          type:
          - string
          - 'null'
        summary:
          type:
          - string
          - 'null'
        features:
          type:
          - array
          - 'null'
          items:
            "$ref": "#/components/schemas/DropletFeature"
    DropletRequestDetailsPage:
      title: Droplet::DetailsPage
      type: object
      required:
      - title
      properties:
        title:
          type: string
          minLength: 1
        logo_url:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        features:
          type: array
          items:
            "$ref": "#/components/schemas/DropletRequestFeature"
    DropletSettings:
      title: Droplet::Settings
      type:
      - object
      - 'null'
      properties:
        marketplace_page:
          "$ref": "#/components/schemas/DropletMarketplacePage"
        details_page:
          "$ref": "#/components/schemas/DropletDetailsPage"
        service_operational_countries:
          items:
            type: string
            pattern: "^[A-Z]{3}$"
            description: An array of ISO3 country codes for which the droplet is operational.
              A null value indicates that the service operates everywhere. An empty
              array indicates that the service operates nowhere.
          type:
          - array
          - 'null'
    DropletSettingsRequest:
      title: Droplet::Settings
      type: object
      properties:
        marketplace_page:
          "$ref": "#/components/schemas/DropletRequestMarketplacePage"
        details_page:
          "$ref": "#/components/schemas/DropletRequestDetailsPage"
        service_operational_countries:
          type: array
          items:
            type: string
            pattern: "^[A-Z]{3}$"
    Droplet:
      title: Droplet
      type: object
      required:
      - uuid
      - name
      - categories
      - active
      - publicly_available
      - embed_url
      - requested_scopes
      - created_at
      - settings
      - app_extensions
      properties:
        uuid:
          type: string
        name:
          type: string
        categories:
          items:
            type: string
          type: array
        active:
          type: boolean
          default: false
        publicly_available:
          type: boolean
          default: false
        embed_url:
          type:
          - string
          - 'null'
        requested_scopes:
          type: array
          items:
            type: string
        egress_proxy_requested:
          type: boolean
          description: Whether the droplet's owner has asked for egress through
            Fluid's egress proxy. Returned only to root admins, company admins and
            company service tokens.
        egress_proxy_enabled:
          type: boolean
          description: Whether a Fluid root admin has granted the droplet's
            installations egress to external systems, such as Exigo, through
            Fluid's egress proxy. Returned only to root admins, company admins and
            company service tokens.
        created_at:
          type: string
          format: date-time
        settings:
          "$ref": "#/components/schemas/DropletSettings"
        app_extensions:
          type: array
          items:
            "$ref": "#/components/schemas/JsonValue"
    DropletOwnerCompany:
      title: Company
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
    DropletAccessGrant:
      title: Droplet access grant
      type: object
      required:
      - uuid_v7
      - company
      - created_at
      properties:
        uuid_v7:
          type: string
          format: uuid
        company:
          "$ref": "#/components/schemas/DropletOwnerCompany"
        created_at:
          type: string
          format: date-time
    IndexDropletAccessGrantsResponse200ApplicationJsonSchema:
      type: object
      required:
      - access_grants
      - meta
      properties:
        access_grants:
          type: array
          items:
            "$ref": "#/components/schemas/DropletAccessGrant"
        meta:
          type: object
          required:
          - request_id
          - timestamp
          - pagination
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            pagination:
              "$ref": "#/components/schemas/Pagination"
    CreateDropletAccessGrantRequestBodyApplicationJsonSchema:
      type: object
      required:
      - company_id
      properties:
        company_id:
          type: integer
          minimum: 1
    CreateDropletAccessGrantResponse201ApplicationJsonSchema:
      type: object
      required:
      - access_grant
      - meta
      properties:
        access_grant:
          "$ref": "#/components/schemas/DropletAccessGrant"
        meta:
          "$ref": "#/components/schemas/Meta"
    DropletOwner:
      allOf:
      - "$ref": "#/components/schemas/Droplet"
      - type: object
        required:
        - install_webhook_url
        - uninstall_webhook_url
        - widget_data_url
        - lifecycle_contract_version
        properties:
          install_webhook_url:
            type:
            - string
            - 'null'
          uninstall_webhook_url:
            type:
            - string
            - 'null'
          widget_data_url:
            description: Endpoint Fluid calls when a widget this droplet published
              uses the droplet@1 capability. Null until the droplet declares one.
            type:
            - string
            - 'null'
          lifecycle_contract_version:
            type: string
    DropletCreate:
      allOf:
      - "$ref": "#/components/schemas/DropletOwner"
      - type: object
        required:
        - webhook_secret
        properties:
          webhook_secret:
            type: string
    DropletUpdate:
      allOf:
      - "$ref": "#/components/schemas/DropletOwner"
      - type: object
        required:
        - updated_at
        properties:
          updated_at:
            type: string
            format: date-time
    DropletShowPublicWithOwner:
      allOf:
      - "$ref": "#/components/schemas/Droplet"
      - type: object
        required:
        - updated_at
        - owner_company
        properties:
          updated_at:
            type: string
            format: date-time
          owner_company:
            "$ref": "#/components/schemas/DropletOwnerCompany"
    DropletShowRootAdmin:
      title: Droplet as a root admin sees it
      description: Adds the raw lifecycle state, which the derived active and publicly_available
        booleans cannot express — they collapse internal with pending, and draft with
        archived.
      allOf:
      - "$ref": "#/components/schemas/DropletShowOwnerWithDetails"
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - draft
            - internal
            - pending
            - published
            - archived
            description: The droplet's raw lifecycle state. Root admins only.
    DropletShowOwnerWithDetails:
      allOf:
      - "$ref": "#/components/schemas/DropletOwner"
      - type: object
        required:
        - updated_at
        - owner_company
        properties:
          updated_at:
            type: string
            format: date-time
          owner_company:
            "$ref": "#/components/schemas/DropletOwnerCompany"
    Pagination:
      type: object
      required:
      - current_page
      - total_pages
      - total_count
      - per_page
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
    IndexDropletsResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplets
      - meta
      properties:
        droplets:
          type: array
          items:
            "$ref": "#/components/schemas/Droplet"
        meta:
          type: object
          required:
          - request_id
          - timestamp
          - pagination
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            pagination:
              "$ref": "#/components/schemas/Pagination"
    IndexAllDropletsResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplets
      - meta
      properties:
        droplets:
          type: array
          items:
            "$ref": "#/components/schemas/DropletShowRootAdmin"
        meta:
          type: object
          required:
          - request_id
          - timestamp
          - pagination
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            pagination:
              "$ref": "#/components/schemas/Pagination"
    ExchangeDropletInstallationRequestBodyApplicationJsonSchema:
      type: object
      required:
      - exchange_token
      properties:
        exchange_token:
          type: string
          description: The one-time exchange token delivered in the droplet's
            install webhook. It starts with `dex_`.
    DropletInstallationExchangeInstallation:
      title: Exchanged droplet installation
      type: object
      required:
      - droplet_installation_uuid
      - droplet_uuid
      - fluid_company_id
      - fluid_shop
      properties:
        droplet_installation_uuid:
          type: string
          description: The UUID of the installation the token was issued for.
        droplet_uuid:
          type: string
          description: The UUID of the installed droplet.
        fluid_company_id:
          type: integer
          description: The numeric ID of the company that installed the droplet.
        fluid_shop:
          type: string
          description: The company's Fluid shop hostname.
      additionalProperties: false
    DropletInstallationCredentials:
      title: Droplet installation credentials
      type: object
      required:
      - authentication_token
      - webhook_verification_token
      - issued_at
      - token_type
      properties:
        authentication_token:
          type: string
          description: The installation's Bearer token for calling the Fluid API
            on the installing company's behalf. It starts with `dit_`.
        webhook_verification_token:
          type: string
          description: The token Fluid uses to sign webhooks it sends this
            installation. It starts with `wvt_`.
        issued_at:
          type: string
          format: date-time
          description: When the credentials were handed out.
        token_type:
          type: string
          enum:
          - bearer
          description: Always `bearer`.
      additionalProperties: false
    ExchangeDropletInstallationResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet_installation
      - credentials
      - meta
      properties:
        droplet_installation:
          "$ref": "#/components/schemas/DropletInstallationExchangeInstallation"
        credentials:
          "$ref": "#/components/schemas/DropletInstallationCredentials"
        meta:
          "$ref": "#/components/schemas/Meta"
    CreateDropletResponse201ApplicationJsonSchema:
      type: object
      required:
      - droplet
      - meta
      properties:
        droplet:
          "$ref": "#/components/schemas/DropletCreate"
        meta:
          "$ref": "#/components/schemas/Meta"
    CreateDropletRequestBodyApplicationJsonSchema:
      type: object
      required:
      - droplet
      properties:
        droplet:
          type: object
          required:
          - name
          - embed_url
          properties:
            name:
              type: string
              minLength: 1
            embed_url:
              type: string
              minLength: 1
            install_webhook_url:
              type: string
              minLength: 1
            uninstall_webhook_url:
              type: string
              minLength: 1
            widget_data_url:
              type: string
              minLength: 1
            extension_zip_url:
              type: string
              minLength: 1
            settings:
              "$ref": "#/components/schemas/DropletSettingsRequest"
            requested_scopes:
              type: array
              items:
                type: string
            egress_proxy_requested:
              type: boolean
              description: Ask Fluid to let the droplet's installations connect to
                external systems, such as Exigo, through Fluid's egress proxy. Settable
                by company admins and company service tokens; false also withdraws
                the grant. Defaults to false.
            egress_proxy_enabled:
              type: boolean
              description: Grant the droplet's installations egress through Fluid's
                egress proxy. Settable by Fluid root admins only. Defaults to false.
            categories:
              type: array
              items:
                type: string
    ShowDropletResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet
      - meta
      properties:
        droplet:
          anyOf:
          - "$ref": "#/components/schemas/DropletShowPublicWithOwner"
          - "$ref": "#/components/schemas/DropletShowOwnerWithDetails"
          - "$ref": "#/components/schemas/DropletShowRootAdmin"
        meta:
          "$ref": "#/components/schemas/Meta"
    UpdateDropletResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet
      - meta
      properties:
        droplet:
          "$ref": "#/components/schemas/DropletUpdate"
        meta:
          "$ref": "#/components/schemas/Meta"
    UpdateDropletRequestBodyApplicationJsonSchema:
      type: object
      required:
      - droplet
      properties:
        droplet:
          type: object
          properties:
            active:
              type: boolean
            publicly_available:
              type: boolean
            company_id:
              type: integer
            name:
              type: string
              minLength: 1
            embed_url:
              type: string
              minLength: 1
            install_webhook_url:
              type: string
              minLength: 1
            uninstall_webhook_url:
              type: string
              minLength: 1
            widget_data_url:
              type: string
              minLength: 1
            extension_zip_url:
              type: string
              minLength: 1
            settings:
              "$ref": "#/components/schemas/DropletSettingsRequest"
            requested_scopes:
              type: array
              items:
                type: string
            egress_proxy_requested:
              type: boolean
              description: Ask Fluid to let the droplet's installations connect to
                external systems, such as Exigo, through Fluid's egress proxy. Settable
                by company admins and company service tokens; false also withdraws
                the grant. Defaults to false.
            egress_proxy_enabled:
              type: boolean
              description: Grant the droplet's installations egress through Fluid's
                egress proxy. Settable by Fluid root admins only. Defaults to false.
            categories:
              type: array
              items:
                type: string
    DestroyDropletResponse200ApplicationJsonSchema:
      type: object
      required:
      - droplet
      - meta
      properties:
        droplet:
          type: object
          required:
          - uuid
          properties:
            uuid:
              type: string
        meta:
          "$ref": "#/components/schemas/Meta"
    ShowDropletCompaniesResponse200ApplicationJsonSchema:
      type: object
      required:
      - companies
      - meta
      properties:
        companies:
          type: array
          items:
            title: Company
            type: object
            required:
            - id
            - name
            - active
            properties:
              id:
                type: integer
              name:
                type: string
              active:
                type: boolean
                default: true
        meta:
          type: object
          required:
          - request_id
          - timestamp
          - pagination
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            pagination:
              "$ref": "#/components/schemas/Pagination"
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardUnauthorizedResponse:
      description: Common legacy unauthorized response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    GitCredential:
      description: Short-lived Git clone credential for the widget repo.
      type: object
      required:
      - remote_url
      - expires_at
