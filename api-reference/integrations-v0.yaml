  "/api/droplets/all":
    get:
      summary: List every droplet on the platform
      description: |-
        List every droplet on Fluid, across all companies, in every lifecycle state. Results are sorted by owner company name, then droplet name.

        This is a Fluid root administrator endpoint: call it with a root administrator's user token. A signed-in user who is not a root administrator gets 403, including a company admin. Company API, partner, and droplet installation tokens cannot call it. It is not the list of droplets available to your company — use `GET /api/droplets` for that, or `GET /api/droplets/company_droplets` for the droplets your company owns.

        Each droplet carries its owner's webhook URLs, its owner company, and its raw lifecycle `status`, which the `active` and `publicly_available` booleans cannot fully express.

        Results are paginated with `page` and `per_page` (default 25, maximum 100).
      tags:
      - droplets
      operationId: integrations_v0_index_all_droplets
      x-fluid-audience: company
      x-fluid-lint-exempt: "Documents an existing route in a legacy unversioned spec."
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: The page number to return. Starts at 1.
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        description: The number of droplets per page. Defaults to 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: category
        in: query
        required: false
        description: Only return droplets in the droplet category with this slug.
        schema:
          type: string
      - name: publicly_available
        in: query
        required: false
        description: Pass `true` for published droplets only, or `false` for every droplet that is not published.
        schema:
          type: boolean
      - name: search
        in: query
        required: false
        description: Only return droplets whose name contains this text, ignoring case.
        schema:
          type: string
      responses:
        '200':
          description: Every droplet on the platform.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IndexAllDropletsResponse200ApplicationJsonSchema"
              example:
                droplets:
                - uuid: 4f2a9c1e-7b3d-4e8a-9f61-2c5d8b0e3a17
