  "/api/droplets/{uuid}":
    get:
      summary: shows a droplet
      description: |-
        Retrieve a droplet by its `uuid`. What you see depends on who you are:

        - Any company with the `droplets.view` permission can view a droplet it can see — a published droplet, one it owns, or one it was granted access to — along with its `owner_company`.
        - The owner company also gets its webhook URLs, `widget_data_url`, and `lifecycle_contract_version`.
        - A Fluid root administrator can view any droplet, and also gets its raw lifecycle `status`.

        A droplet you cannot see returns 404.
      tags:
      - droplets
      operationId: integrations_v0_show_droplet
      security:
      - bearer_auth: []
