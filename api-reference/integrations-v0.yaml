  "/api/droplet_installations/exchange":
    post:
      summary: Exchange an install token for installation credentials
      description: |-
        Redeem the one-time exchange token that Fluid sends in a droplet's install webhook for the installation's permanent credentials: its Bearer `authentication_token` and its `webhook_verification_token`.

        This endpoint takes no `Authorization` header — the exchange token is the credential. Call it from your droplet's backend as soon as the install webhook arrives.

        - An exchange token redeems once, and expires 10 minutes after it is issued.
        - A token that has already been redeemed, or has expired, returns 410. Fluid does not issue a replacement through this endpoint.
        - An unknown token returns 404. So does a token whose installation is no longer active, or whose droplet can no longer be installed (for example, an archived droplet). Those cases do not use up the token.
      tags:
      - droplet-installations
      operationId: integrations_v0_exchange_droplet_installation_token
      x-fluid-audience: public
      x-fluid-lint-exempt: "Documents an existing route in a legacy unversioned spec."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ExchangeDropletInstallationRequestBodyApplicationJsonSchema"
            example:
              exchange_token: dex_q7Xv2mR9kLp4TzW8nB3cYh6JfD1sAe5GuN0oKiVbQwE
      responses:
        '200':
          description: The token was redeemed. Store both credentials; this is the only time they are returned.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExchangeDropletInstallationResponse200ApplicationJsonSchema"
              example:
                droplet_installation:
                  droplet_installation_uuid: 9c3e7a41-5b2d-4f8e-a0c6-1d7b4e92f358
                  droplet_uuid: 4f2a9c1e-7b3d-4e8a-9f61-2c5d8b0e3a17
                  fluid_company_id: 1042
                  fluid_shop: northwind.fluid.app
                credentials:
                  authentication_token: dit_Hk4mZp8Qx2Wv6Tn9Rb3Lc7Yf1Sd5Ga0J
                  webhook_verification_token: wvt_Nq2Xe7Kr5Ub9Pm3Vh8Jt1Ws6Cz4Fy0D
                  issued_at: '2026-09-30T14:05:12Z'
                  token_type: bearer
                meta:
                  request_id: 3b1f6c2e-8d4a-4e7b-9f05-a2c1d6e8b347
                  timestamp: '2026-09-30T14:05:12Z'
        '404':
          description: The token is unknown, or its installation is inactive or its droplet can no longer be installed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error_message: not found
                errors:
                  exchange_token:
                  - invalid or not found
                meta:
                  request_id: 3b1f6c2e-8d4a-4e7b-9f05-a2c1d6e8b347
                  timestamp: '2026-09-30T14:05:12Z'
        '410':
          description: The token has already been redeemed, or has expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error_message: gone
                errors:
                  exchange_token:
                  - expired or already used
                meta:
                  request_id: 3b1f6c2e-8d4a-4e7b-9f05-a2c1d6e8b347
                  timestamp: '2026-09-30T14:05:12Z'
        '422':
          description: The request body has no `exchange_token`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error_message: Invalid parameters
                errors:
                  exchange_token:
                  - is missing
                meta:
                  request_id: 3b1f6c2e-8d4a-4e7b-9f05-a2c1d6e8b347
                  timestamp: '2026-09-30T14:05:12Z'
