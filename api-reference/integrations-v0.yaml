  "/api/droplet_installations":
    get:
      summary: List droplet installations
      description: |-
        List the droplets installed on your company, newest first. Uninstalled installations are left out; installations that are still being uninstalled appear with `active: false`.

        Call it with a company admin's Bearer token, or a company API or partner token, that has the `droplets.view` permission. Other callers get 401.

        Results are paginated with `page` and `per_page` (default 10, maximum 100). Pass `category` with a droplet category slug to only return installations of droplets in that category.
