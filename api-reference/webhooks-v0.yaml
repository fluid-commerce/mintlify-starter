  "/api/company/webhooks":
    get:
      summary: List webhooks
      description: |
        Lists the company's webhook subscriptions, paginated. Read-only. The optional
        `query` object narrows results by `active`, `resource`, or free-text
        `search_query`, and pages with `page`/`per_page` (max 100). Requires a company
        Bearer token (`401` otherwise).
      tags:
      - webhooks
      operationId: webhooks_v0_index_webhooks
      security:
      - bearer_auth: []
      parameters:
      - name: query
        in: query
        description: |
          Optional filter and pagination object. `page` (1-based) and `per_page`
          (max 100) page the results; `active` filters by enabled state, `resource` by
          subscribed resource, and `search_query` is a free-text match. All fields are
          optional.
        schema:
          type: object
          properties:
            page:
              type: integer
              exclusiveMinimum: 0
            per_page:
              type: integer
              exclusiveMinimum: 0
              maximum: 100
            active:
              type: boolean
            resource:
              type: string
            search_query:
              type: string
          required: []
      responses:
        '200':
          description: Returns paginated webhooks
          content:
            application/json:
              schema:
                type: object
                required:
                - webhooks
                properties:
                  webhooks:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WebhookSummary"
                  meta:
                    "$ref": "#/components/schemas/PaginatedMeta"
              example:
                webhooks:
                - id: 48213
                  company_id: 1405
                  droplet_installation_uuid: null
                  url: https://hooks.dundermifflin.com/fluid/orders
                  active: true
                  resource: order
