                  created_at: '2026-09-14T15:22:08.412Z'
                  updated_at: '2026-09-14T15:22:08.412Z'
                meta:
                  request_id: 8f3c2b71-5d4e-4a9b-b6f0-1e7a9c3d2f58
                  timestamp: '2026-09-30T14:05:12Z'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - webhook
              properties:
                webhook:
                  type: object
                  required:
