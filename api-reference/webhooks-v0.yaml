      summary: Delete a callback registration
      description: |
        Deletes a callback registration by its `uuid`; Fluid stops calling its `url`.
        Returns `200` echoing the deleted registration's `uuid`, or `404` when the uuid
        is unknown. Requires a company Bearer token (`401` otherwise).

