    put:
      summary: Update a callback registration
      description: |
        Updates a callback registration's `url`, `active`, and `country_codes`;
        `definition_name` is fixed at creation. Returns `200` with the updated
        registration, `404` when the uuid is unknown, and `422` when the body fails
        validation. Requires a company Bearer token (`401` otherwise).

        A registration a droplet registered is managed by that droplet while its
        installation is active: a company token gets `403`, because repointing or
        disabling it would silently break the droplet. The owning droplet's own token
        may still update it. Once that installation is uninstalled no droplet can
        reach the registration, so a company token may update it again.
