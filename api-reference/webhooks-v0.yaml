            schema:
              type: object
              properties:
                callback_registration:
                  type: object
                  properties:
                    url:
                      type: string
                    active:
                      type: boolean
                    country_codes:
                      type: array
                      description: ISO country codes the callback applies to.
                      items:
                        type: string
            example:
