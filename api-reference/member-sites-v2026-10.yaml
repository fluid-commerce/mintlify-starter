    delete:
      summary: Delete a site
      description: |
        Works for static V1 sites as well as older Liquid sites. A deleted V1 site stops being served. Its recorded site and bundle state is retained for the deletion recovery window; this operation is not a database turn-off or a database rollback. See [The member site database](https://docs.fluid.app/member-sites-v1/database) for V1 database behavior.

        Deletes the site and its pages.
