              schema:
                "$ref": "#/components/schemas/SitePageEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-7a01-7b8c-9d0e-1f2a3b4c5d02'
                  slug: about
                  title: About Riley
                  position: 0
                  published: true
                  layout_name:
