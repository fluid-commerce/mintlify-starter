                    short_sha: b2c3d4e
                    message: 'Member: Publish site · 2026-10-30 12:00:00 (0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d01)'
                    committed_at: '2026-10-30T12:00:00Z'
                    current: true
