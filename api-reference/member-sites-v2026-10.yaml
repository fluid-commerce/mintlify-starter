---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Sites
  description: |
    The authenticated member's own sites: list, create, read, change, delete, publish and copy, with the files and pages that make up each site. The credential alone determines the member and company; a site and a page are identified by their public ids, never by a numeric id. A member can read and change only the sites they own. Any other id, and any id of a site in another company, returns 404.

    These operations take a bearer only, the site menu, the site removals and the share-target search included. On the same-origin cookie mount, a request with a valid member session is refused with `403`, with or without an `X-Fluid-Member-Site` header, because a script on the company's storefront shares that origin and would otherwise act as the visiting member, so no cookie path to them can be kept from it; a request with a missing or unusable session is refused with `401` first, as on every cookie-mount route. A page that draws the account menu holds the member's bearer and sends it itself.

    Every operation returns 404 while member sites are not enabled for the member's company (the `MEMBER_SITES` company feature). A credential that is refused is still refused with 401 or 403 first, so a refused credential never learns whether the feature is enabled.

    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation refuses a credential for it with `403` and the standard error
    envelope, before the operation runs.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: sites
  x-fluid-section: Members
  description: The signed-in member's own sites, with publishing, copying and optimistic locking.
- name: site-files
  x-fluid-section: Members
  description: The files of one of the member's sites (layouts, sections, snippets, assets, page content, settings and menus), addressed by theme-style path.
- name: site-shares
  x-fluid-section: Members
  description: Who one of the member's sites is shared with, a named member, the member's downline or a segment of the company's members, each with a view or copy permission.
- name: site-pages
  x-fluid-section: Members
  description: The pages of one of the member's sites, each with the template that holds its content.
- name: site-menu
  x-fluid-section: Members
  description: The member's account menu, grouped into the company's sites, the sites they built, the sites shared with them and the sites they removed.
- name: site-removals
  x-fluid-section: Members
  description: Taking a site out of the member's own account menu, and putting it back. A removal changes nothing for the site's owner or for anyone else.
- name: site-share-targets
  x-fluid-section: Members
  description: Whom the member may share a site with, inside the reach their company's messaging policy gives them.
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, an opaque member token, or a verified One Auth identity
        access token. The credential alone identifies the member and company.
        Member session and portal JWTs are read-only and are refused with 403
        on every write.
  headers:
    ETag:
      description: Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it is unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: "max-age=0, private"
    RateLimitLimit:
      description: Searches allowed per minute for this credential.
      schema:
        type: string
        example: '30'
    RateLimitRemaining:
      description: Searches left in the current minute; always 0 on a refused request.
      schema:
        type: string
        example: '0'
    RateLimitReset:
      description: When the current minute ends and the credential's search budget is restored, as a UTC timestamp.
      schema:
        type: string
        example: 2026-09-30 18:25:00 UTC
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          description: The error message and field-keyed details.
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Machine-readable details, keyed by field where a field is at fault.
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    RateLimitError:
      type: object
      description: >-
        The rate limiter's refusal. It is sent before the request reaches the API, so it has no status, error
        or meta envelope.
      properties:
        error:
          type: string
          description: Always `Rate limit exceeded`.
          example: Rate limit exceeded
        message:
          type: string
          description: Human-readable explanation.
          example: Too many requests. Please wait before trying again.
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the credential's search budget is restored.
          example: 42
      required:
      - error
      - message
      - retry_after
    Site:
      type: object
      description: One of the member's sites.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public site id. It never changes, including when the handle changes.
        handle:
          type: string
          description: The site's URL segment, unique in the company without regard to letter case.
        name:
          type: string
          description: Display name.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may open the site once it is published.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: Whether the site is a draft, published, or taken down by a company admin. The owner cannot publish a site that was taken down.
        owner_kind:
          type: string
          enum:
          - company
          - member
          description: Who owns the site. The sites this API returns are owned by the member.
        copied_from_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Public id of the site this one was copied from, or null for a site that was not copied. It becomes null when the original is deleted. A member who can no longer open the original keeps the id, which names no content.
        layout_name:
          type:
          - string
          - 'null'
          description: The default layout for the site's pages, or null to use the site's own `site` layout.
        settings:
          type: object
          additionalProperties: true
          description: Design tokens such as colors and fonts, read as `settings` in the site's templates.
        content_version:
          type: string
          format: uuid
          description: Replaced on every publish.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Optimistic locking version. Send it back as `lock_version` when changing the site, to refuse the change if the site changed since it was read. It also changes when a page of the site is added, changed or removed, and when `config/menus.json` is written, so read the site again before a versioned change.
        created_at:
          type: string
          format: date-time
          description: When the site was created.
        updated_at:
          type: string
          format: date-time
          description: When the site last changed.
      required:
      - id
      - handle
      - name
      - visibility
      - status
      - owner_kind
      - copied_from_id
      - layout_name
      - settings
      - content_version
      - lock_version
      - created_at
      - updated_at
    SiteCreate:
      type: object
      description: A new site. Fields a member cannot set, such as `required` and `position`, are refused as unknown fields.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
          description: Display name.
        handle:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Lowercase letters and digits separated by single hyphens, not reserved and not used by another site in the company. Omit it to have one proposed from the name.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may open the site once it is published. Defaults to private.
        layout_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The default layout for the site's pages. Null or omitted uses the site's own `site` layout.
        settings:
          type: object
          additionalProperties: true
          description: Design tokens such as colors and fonts.
      required:
      - name
    SiteUpdate:
      type: object
      description: Changes to a site. Send at least one field besides `lock_version`. Fields a member cannot set, such as `required` and `position`, are refused as unknown fields.
      additionalProperties: false
      anyOf:
      - required:
        - name
      - required:
        - handle
      - required:
        - visibility
      - required:
        - layout_name
      - required:
        - settings
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
          description: Display name.
        handle:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Lowercase letters and digits separated by single hyphens, not reserved and not used by another site in the company. The site keeps its public id.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may open the site once it is published.
        layout_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The default layout for the site's pages. Null uses the site's own `site` layout.
        settings:
          type: object
          additionalProperties: true
          description: Design tokens such as colors and fonts. Replaces the whole object.
        lock_version:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The `lock_version` the caller last read. The change is refused with 409 if the site changed since, including by a change to one of its pages or menus.
    SiteCopy:
      type: object
      description: Optional choices for a copy. Any other field, such as `visibility`, is refused as an unknown field.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
          description: Display name of the copy. Omit it to use "Copy of" followed by the original's name.
        handle:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Lowercase letters and digits separated by single hyphens, not reserved and not used by another site in the company. Omit it to have one proposed from the name.
    SiteEnvelope:
      type: object
      description: One site.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/Site"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SitesEnvelope:
      type: object
      description: All of the member's sites.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The member's sites, newest first.
          items:
            "$ref": "#/components/schemas/Site"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteFile:
      type: object
      description: One file of a site.
      additionalProperties: false
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        content:
          type: string
          description: The file's content. `config/settings.json`, `config/menus.json` and `config/pages.json` hold JSON documents.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Send it back as `lock_version` when writing the settings. It also changes when a page of the site is added, changed or removed, and when `config/menus.json` is written, so read the settings again before a versioned write. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: >-
            The version of the file, to send back as `version` when writing it (the request body) or removing it (the query parameter), so the change is refused with 409 if the file changed since. For an asset it is a digest of the content. For a layout, section, snippet or page file it is a digest of the draft content and of the published copy, so a publish changes it too: read the files again after publishing. For `config/menus.json` and `config/pages.json` it is a digest of the document. For `config/settings.json` it is the `lock_version` as a string, which also changes when a page is added, changed or removed and when `config/menus.json` is written.
            Treat it as opaque.
      required:
      - path
      - content
      - lock_version
      - version
    SiteFileWrite:
      type: object
      description: The content of a file. The path is in the URL.
      additionalProperties: false
      properties:
        content:
          type: string
          pattern: '^[^\u0000]*$'
          description: The whole new content of the file. An asset must not be empty. `config/settings.json` takes a JSON object, and `config/menus.json` a JSON document of menus, and `config/pages.json` a JSON document of the site's default layout and page settings.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The `lock_version` of `config/settings.json` the caller last read. The write is refused with 409 if the settings changed since. Ignored for every other file. Send either this or `version`, not both.
        version:
          type: string
          maxLength: 255
          pattern: '^[^\u0000]*$'
          description: >-
            The `version` of the file the caller last read. The write is refused with 409 if the file has changed or been removed since, and nothing is written. For `config/settings.json` it is the `lock_version` as a string, and for `config/menus.json` and `config/pages.json` the digest of the document.
            Without `version` or `must_not_exist`, the write replaces whatever is at the path. Cannot be sent with `must_not_exist` or `lock_version`.
        must_not_exist:
          type: boolean
          description: Send `true` to create the file only if the path holds none. The write is refused with 409 if a file is already there, so a file another writer created since the caller listed the files is not replaced. `config/settings.json`, `config/menus.json` and `config/pages.json` always exist, so it is always refused for them. Cannot be sent with `version`.
      required:
      - content
    SiteFileEnvelope:
      type: object
      description: One site file.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteFile"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteFileEntry:
      type: object
      description: The metadata of one file of a site, without its content. Read the file with `GET /sites/{site_id}/files/{path}`.
      additionalProperties: false
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        kind:
          type: string
          enum:
          - layout
          - section
          - snippet
          - page
          - asset
          - settings
          - menus
          - pages
          description: What the file is.
        content_type:
          type: string
          description: The content type of the file, such as `text/x-liquid` for a layout, section, snippet or page and `text/css` for a stylesheet. `config/settings.json`, `config/menus.json` and `config/pages.json` are `application/json`.
        byte_size:
          type: integer
          minimum: 0
          description: The size in bytes of the content that reading the file returns.
        lock_version:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: The version of the site's settings, for `config/settings.json` only. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: The version of the file, to send back as `version` when writing or removing it. See the `version` of a read file.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the file last changed. Null for `config/menus.json` and `config/pages.json`, which have no time of their own.
      required:
      - path
      - kind
      - content_type
      - byte_size
      - lock_version
      - version
      - updated_at
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    SiteFileEntriesEnvelope:
      type: object
      description: One page of the files of a site, as metadata.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The files of the page, sorted by path.
          items:
            "$ref": "#/components/schemas/SiteFileEntry"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SiteShare:
      type: object
      description: One audience a site is shared with. It never carries an email address.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the share.
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: Who the site is shared with. `member` names one member, `downline` is the downline of the member who shared it, and `segment` is the company's members of a member type, in a country, both or neither (every member).
        member:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member a `member` share names. Null for every other kind.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member.
            name:
              type:
              - string
              - 'null'
              description: The member's name, or null when they have none.
          required:
          - id
          - name
        member_type:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member type a `segment` share names. Null when it names none, and for every other kind.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member type.
            name:
              type: string
              description: Name of the member type.
          required:
          - id
          - name
        country:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The country a `segment` share names. Null when it names none, and for every other kind.
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2 code of the country.
            name:
              type: string
              description: Name of the country.
          required:
          - code
          - name
        label:
          type: string
          description: The audience in words. A member share is the member's name, or "A member" when they have none; a downline share is "Downline of" the member who shared it; a segment share is "Customer in United States", "Customer", "Members in United States" or "All members".
        permission:
          type: string
          enum:
          - view
          - copy
          description: What the audience may do with the site. `view` opens it; `copy` also lets them copy it into a site of their own.
        created_at:
          type: string
          format: date-time
          description: When the site was shared with the audience.
      required:
      - id
      - audience_kind
      - member
      - member_type
      - country
      - label
      - permission
      - created_at
    SiteShareCreate:
      type: object
      description: Share a site with one audience. Each audience kind takes its own targets, and sending a target the kind does not take is refused with 422.
      additionalProperties: false
      properties:
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: Who to share with. A `member` share needs `member_id` and takes no other target. A `downline` share takes none. A `segment` share takes `member_type_id`, `country_code`, both or neither, and neither shares with every member the company's messaging policy lets you reach.
        member_id:
          type: string
          format: uuid
          description: Id of the member to share with. A member of another company is refused with 422.
        member_type_id:
          type: string
          format: uuid
          description: Id of the member type of a segment.
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 code of the country of a segment, one of the countries the company sells in.
        permission:
          type: string
          enum:
          - view
          - copy
          default: view
          description: What the audience may do with the site. Ignored for an audience that is already shared; change it with `PATCH`.
      required:
      - audience_kind
    SiteShareUpdate:
      type: object
      description: The change to a share. Only the permission changes; to change who a share names, delete it and add another.
      additionalProperties: false
      properties:
        permission:
          type: string
          enum:
          - view
          - copy
          description: What the audience may do with the site.
      required:
      - permission
    SiteShareEnvelope:
      type: object
      description: One share.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteShare"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteSharesEnvelope:
      type: object
      description: One page of the shares of a site.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The shares of the page, oldest first.
          items:
            "$ref": "#/components/schemas/SiteShare"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SitePage:
      type: object
      description: One page of a site. Its content is the site file `pages/<slug>.liquid`, not part of the page.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public page id. It never changes, including when the slug changes.
        slug:
          type: string
          description: The page's URL segment, unique in the site, or `/` for the home page.
        title:
          type: string
          description: Display title.
        position:
          type: integer
          description: Order of the page among the site's pages.
        published:
          type: boolean
          description: Whether the page is shown once the site is published.
        layout_name:
          type:
          - string
          - 'null'
          description: The layout this page uses, or null to use the site's default.
        menu:
          type:
          - string
          - 'null'
          description: The slug of the site's menu assigned to the page, or null for none. Menus are defined in `config/menus.json`.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Optimistic locking version. Send it back as `lock_version` when changing the page (the request body) or removing it (the query parameter), to refuse the change if the page changed since it was read. It also changes when the page's content is written, through the page or through its file `pages/<slug>.liquid`, and when the page's content is published, by publishing the site or its file.
        created_at:
          type: string
          format: date-time
          description: When the page was created.
        updated_at:
          type: string
          format: date-time
          description: When the page last changed.
      required:
      - id
      - slug
      - title
      - position
      - published
      - layout_name
      - menu
      - lock_version
      - created_at
      - updated_at
    SitePageCreate:
      type: object
      description: A new page. Fields a member cannot set are refused as unknown fields.
      additionalProperties: false
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
          description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. `index` is reserved for the home page.
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
          description: Display title.
        position:
          type: integer
          description: Order of the page among the site's pages. Defaults to 0.
        published:
          type: boolean
          description: Whether the page is shown once the site is published. Defaults to false.
        layout_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The layout this page uses. Null or omitted uses the site's default.
        menu:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The slug of one of the site's own menus. A menu of another site is refused. Null or omitted assigns none.
        content:
          type: string
          pattern: '^[^\u0000]*$'
          description: The page's content, kept in the site file `pages/<slug>.liquid`. Empty by default.
      required:
      - slug
      - title
    SitePageUpdate:
      type: object
      description: Changes to a page. Send at least one field besides `lock_version`. Fields a member cannot set are refused as unknown fields.
      additionalProperties: false
      anyOf:
      - required:
        - slug
      - required:
        - title
      - required:
        - position
      - required:
        - published
      - required:
        - layout_name
      - required:
        - menu
      - required:
        - content
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
          description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. The page keeps its public id, and its content moves with it.
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
          description: Display title.
        position:
          type: integer
          description: Order of the page among the site's pages.
        published:
          type: boolean
          description: Whether the page is shown once the site is published.
        layout_name:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The layout this page uses. Null uses the site's default.
        menu:
          type:
          - string
          - 'null'
          maxLength: 255
          description: The slug of one of the site's own menus. A menu of another site is refused. Null removes the page's menu.
        content:
          type: string
          pattern: '^[^\u0000]*$'
          description: The page's new content. Refused with 403 for a page that uses a template the site does not own.
        lock_version:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: The `lock_version` the caller last read. The change is refused with 409 if the page changed since.
    SitePageEnvelope:
      type: object
      description: One page.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SitePage"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SitePagesEnvelope:
      type: object
      description: All of a site's pages.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The site's pages in order, by position.
          items:
            "$ref": "#/components/schemas/SitePage"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteMenuEntry:
      type: object
      description: One site in the member's account menu.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public id of the site.
        handle:
          type: string
          description: The site's URL segment.
        name:
          type: string
          description: Display name.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: Whether the site is a draft or published. Only the member's own sites can be drafts.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may open the site once it is published.
        owner_kind:
          type: string
          enum:
          - company
          - member
          description: Who owns the site.
        owner_name:
          type:
          - string
          - 'null'
          description: The name to show for the owner. The company's name for a company site, otherwise the owning member's name. It is null for a member who has no name.
        removable:
          type: boolean
          description: Whether the member may remove the site from their menu. A required company site and the member's own site cannot be removed.
        removal_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the member's removal of the site, to restore it with `DELETE /site-removals/{id}`. Null unless the site is in `removed_sites`.
      required:
      - id
      - handle
      - name
      - status
      - visibility
      - owner_kind
      - owner_name
      - removable
      - removal_id
    SiteMenu:
      type: object
      description: The member's account menu, read when the request was made.
      additionalProperties: false
      properties:
        company_sites:
          type: array
          description: Published company sites the member is shared, in the company's order. A required site is always here, whatever the member removed.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        own_sites:
          type: array
          description: The member's own sites, drafts included, oldest first. A site an admin took down is not listed.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        shared_sites:
          type: array
          description: Published sites other members own that are shared with the member and that they have not removed. At most the newest 100, oldest first; `shared_sites_omitted` counts the rest.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        removed_sites:
          type: array
          description: Sites the member removed from their menu that are still shared with them, oldest first. Each carries its `removal_id`.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        landing_site_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the site `/accounts` opens, which is also the id of one of the entries above. The first company site the member has not removed, else the first company site, else their newest own site. Null when there is none.
        shared_sites_omitted:
          type: integer
          minimum: 0
          description: How many shared sites are not listed in `shared_sites` because of its limit.
      required:
      - company_sites
      - own_sites
      - shared_sites
      - removed_sites
      - landing_site_id
      - shared_sites_omitted
    SiteMenuEnvelope:
      type: object
      description: The member's account menu.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteMenu"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteRemoval:
      type: object
      description: A member's removal of one site from their menu.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the removal. Send it to `DELETE /site-removals/{id}` to restore the site.
        site_id:
          type: string
          format: uuid
          description: Public id of the site that was removed from the menu.
        created_at:
          type: string
          format: date-time
          description: When the site was removed.
      required:
      - id
      - site_id
      - created_at
    SiteRemovalCreate:
      type: object
      description: The site to remove from the member's menu. Any other field is refused as an unknown field.
      additionalProperties: false
      properties:
        site_id:
          type: string
          format: uuid
          description: Public id of the site, as listed in the member's menu.
      required:
      - site_id
    SiteRemovalEnvelope:
      type: object
      description: One removal.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteRemoval"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteShareTargetMember:
      type: object
      description: A member the caller may share a site with by name.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the member, to name them in a `member` share.
        name:
          type:
          - string
          - 'null'
          description: The name to show. Null for a member who has no name.
        email:
          type:
          - string
          - 'null'
          description: The member's email address. Null unless `emails_visible` is true.
      required:
      - id
      - name
      - email
    SiteShareTargetMemberType:
      type: object
      description: A member type of the company, which a `segment` share may name.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the member type.
        name:
          type: string
          description: Display name.
      required:
      - id
      - name
    SiteShareTargetCountry:
      type: object
      description: A country the company sells in, which a `segment` share may name.
      additionalProperties: false
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        name:
          type: string
          description: Display name.
      required:
      - code
      - name
    SiteShareTargets:
      type: object
      description: Whom the member may share a site with.
      additionalProperties: false
      properties:
        members:
          type: array
          description: Members matching `q`, by name, or by email address where `emails_visible` is true, sorted by name. At most 20, and never the caller or a member outside their messaging scope. Empty when `member` is not in `allowed`, or when `q` has no part of 3 characters.
          items:
            "$ref": "#/components/schemas/SiteShareTargetMember"
        member_types:
          type: array
          description: The company's active member types. Empty unless `segment` is in `allowed`.
          items:
            "$ref": "#/components/schemas/SiteShareTargetMemberType"
        countries:
          type: array
          description: The countries the company sells in. Empty unless `segment` is in `allowed`.
          items:
            "$ref": "#/components/schemas/SiteShareTargetCountry"
        downline_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: How many members a `downline` share by the caller reaches, at most 1000. These are the kept members below the caller on the enrollment tree, and under `team_graph` only those in the caller's Team Graph, which excludes members without a legacy id. Null unless `downline` is in `allowed`.
        downline_count_capped:
          type: boolean
          description: Whether the downline is larger than `downline_count`, which is then 1000 ("1,000+").
        allowed:
          type: array
          description: The audience kinds the caller may share with. All three under `all_members`, `member` and `downline` under `team_graph`, none under `no_direct_messages`.
          items:
            type: string
            enum:
            - member
            - downline
            - segment
        emails_visible:
          type: boolean
          description: Whether the messaging policy shows members' email addresses. When false every `email` is null and a search does not match addresses.
      required:
      - members
      - member_types
      - countries
      - downline_count
      - downline_count_capped
      - allowed
      - emails_visible
    SiteShareTargetsEnvelope:
      type: object
      description: Whom the member may share a site with.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteShareTargets"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
  responses:
    Unauthorized:
      description: Missing or unusable member credential.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    ReadOnlyCredential:
      description: The valid member credential is read-only (a member or portal JWT), or belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    SandboxTwin:
      description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    SandboxTwinOrCookieMount:
      description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted; or the request is on the cookie mount, which this operation never serves, with or without the `X-Fluid-Member-Site` header.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    WriteRefused:
      description: The valid member credential is read-only (a member or portal JWT); the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves site removals.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: No site of the member's has this id, the site has no such file or page, or member sites are not enabled for the member's company.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The site, its settings, the page or the file changed since it was read, or a file to be created already exists. Read it again and retry.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
  parameters:
    SiteId:
      name: id
      in: path
      required: true
      description: Public id of one of the member's sites.
      schema:
        type: string
        format: uuid
    SiteIdPath:
      name: site_id
      in: path
      required: true
      description: Public id of one of the member's sites.
      schema:
        type: string
        format: uuid
    FilePath:
      name: path
      in: path
      required: true
      description: 'The theme-style path of the file, with its slash: `layouts/<name>.liquid`, `sections/<name>.liquid`, `snippets/<name>.liquid`, `pages/<slug>.liquid` (`pages/index.liquid` for the home page), `assets/<file>` (a css, js, json, txt or html file), `config/settings.json`, `config/menus.json` or `config/pages.json`. Names use lowercase letters, digits, hyphens and underscores, with no subfolders. Any other path is refused with 422.'
      schema:
        type: string
        pattern: '^.+$'
    ShareId:
      name: id
      in: path
      required: true
      description: Id of one of the site's shares.
      schema:
        type: string
        format: uuid
    PageId:
      name: page_id
      in: path
      required: true
      description: Public id of one of the site's pages.
      schema:
        type: string
        format: uuid
    RemovalId:
      name: id
      in: path
      required: true
      description: Id of one of the member's removals, from `removal_id` in the menu or `id` in a removal.
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response.
      schema:
        type: string
    ShareTargetQuery:
      name: q
      in: query
      required: false
      description: What a member's name starts with, or their email address where the company's policy shows it. Leading and trailing spaces are ignored. Blank lists the first members the caller may share with. Otherwise it needs 3 to 200 characters and is refused with 422 outside that range. Searching also needs the first word or the rest of the query to have 3 characters; a query where neither does matches no members, and the other targets are still returned.
      schema:
        type: string
        maxLength: 200
    FileVersionQuery:
      name: version
      in: query
      required: false
      description: The `version` of the file the caller last read. The file is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the file is removed as it is.
      schema:
        type: string
        maxLength: 255
    PageLockVersionQuery:
      name: lock_version
      in: query
      required: false
      description: The `lock_version` of the page the caller last read. The page is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the page is removed as it is.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
paths:
  "/api/member/v2026-10/sites":
    get:
      summary: List the member's sites
      description: Every site the member owns, newest first. A member owns at most 25 sites, so the list is not paged. The list is not cached (`max-age=0`) and can be revalidated with an ETag.
      operationId: member_sites_index
      tags:
      - sites
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The member's sites.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SitesEnvelope"
              example:
                status: 200
                data:
                - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  lock_version: 0
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/SandboxTwin"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      summary: Add a site
      description: Adds a site owned by the member, as a draft. Without a handle one is proposed from the name, and a number is added when it is taken. A member can own at most 25 sites.
      operationId: member_sites_create
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteCreate"
            example:
              name: Riley's Shop
              visibility: private
              settings:
                primary_color: "#112233"
      responses:
        '201':
          description: The new site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  lock_version: 0
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          description: A missing or blank name, a handle that is malformed, reserved or taken, a field a member cannot set, an unknown field, or the member already owns 25 sites.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{id}":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    get:
      summary: Show a site
      description: One of the member's sites. Another member's site, a missing one and a malformed id all return 404. Privately cacheable with revalidation on every read.
      operationId: member_sites_show
      tags:
      - sites
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The site.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  lock_version: 0
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/SandboxTwin"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      summary: Change a site
      description: Changes the supplied fields. Send the `lock_version` you last read to refuse the change if the site changed since; without it the change is applied to the current site. A handle change keeps the site's public id.
      operationId: member_sites_update
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteUpdate"
            example:
              name: Riley's Fall Shop
              lock_version: 0
      responses:
        '200':
          description: The changed site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Fall Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  lock_version: 1
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:05:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: An empty body, a blank name, a handle that is malformed, reserved or taken, an invalid visibility, a field a member cannot set, or an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      summary: Delete a site
      description: Deletes the site and its pages.
      operationId: member_sites_destroy
      tags:
      - sites
      x-fluid-audience: member
      responses:
        '204':
          description: The site was deleted.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
  "/api/member/v2026-10/sites/{id}/publish":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    post:
      summary: Publish a site
      description: Marks the site published and replaces its `content_version`. Publishing a site that is already published publishes its current content again. The request has no body.
      operationId: member_sites_publish
      tags:
      - sites
      x-fluid-audience: member
      responses:
        '200':
          description: The published site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 200
                data:
