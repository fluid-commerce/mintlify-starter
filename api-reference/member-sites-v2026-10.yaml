    SiteSignInHandoff:
      type: object
      description: A single-use handoff that signs the member in on their company's storefront.
      additionalProperties: false
      properties:
        handoff:
          type: string
          description: The handoff. Treat it as a secret, never put it in a URL, and redeem it once by POSTing it with the continuity secret to `redeem_url`.
        redeem_url:
          type: string
          format: uri
          description: "Where to redeem it, `https://<the company's canonical member host>/auth/redeem`: a POST from the app's own process (not a page, not an HTML form) with a form-encoded body carrying `handoff` and `continuity` and the header `X-Fluid-Sign-In-Handoff: 1`. It answers `204` with the member's storefront session cookie, for the token's identity session and lasting at most 12 hours, or `401` with none for an expired, used, wrong-secret or other-host handoff, credentials in the query string, or a request a browser marks as a page's (`Sec-Fetch-Site` other than `none`). Signing out of that session on the storefront ends the identity session, as any identity sign-out does."
        site_url:
          type: string
          format: uri
          description: The site on that host, to open once the handoff is redeemed.
        expires_at:
          type: string
          format: date-time
          description: When the handoff expires, about a minute after it was made, in ISO 8601.
      required:
      - handoff
      - redeem_url
      - site_url
      - expires_at
    SiteSignInHandoffEnvelope:
      type: object
