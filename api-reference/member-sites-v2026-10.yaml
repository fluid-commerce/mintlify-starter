  "/api/member/v2026-10/sites/{site_id}/deployments":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List a site's deployments
      description: |
        The deployments of one of the member's sites, newest first: each bundle that was published, with who published it, how many files it holds, their total size, whether the site serves it now (`current`) and whether a rollback can still reach it (`retained`). An upload that was never published is not a deployment; the bundle list shows those. Roll back with the bundle's `current` operation and the deployment's `bundle_id`. The list is paged by cursor; follow `meta.pagination.next_cursor` until it is null. It is not cached (`max-age=0`) and can be revalidated with an ETag.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_deployments_index
      tags:
      - site-hosting
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`, valid only for the same site.
          A malformed, tampered or expired cursor returns 400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of the site's deployments.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteDeploymentsEnvelope"
              example:
                status: 200
                data:
                - id: 0199537f-0000-7000-8000-000000000005
                  bundle_id: 0199537f-0000-7000-8000-000000000005
                  published_at: '2026-11-05T10:02:00.000Z'
                  published_by: Riley Kim
                  file_count: 12
                  total_bytes: 482113
                  current: true
                  retained: true
                  url: https://shop.example.com/sites/rileys-shop
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:05:00Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never serves a site's deployments.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '422':
          description: A `page[limit]` that is not an integer from 1 to 100, or a parameter this operation does not take.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/logs":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: Read a site's log
      description: |
        The log of one of the member's sites, oldest first: the lines after `since`, at most `limit` of them, plus any more at the same moment as the last one, so reading on from its `at` skips none. To follow the log (`fluid sites logs --tail`), ask again with the last line's `at` as `since`. Only publishing writes lines today: each upload's start, its publish and who published it, and an upload that failed or expired. An ending is dated when it settled; an expired upload has its line once the expiry cleanup marks it failed. A rollback gives a `Rolled back to <bundle id>` line (the latest rollback to each bundle). A failed or expired upload is cleared when the next upload starts. `function` lines start when server functions run, and `gateway` lines when the sites gateway records them per site; the traffic operation counts the gateway's errors meanwhile. Never stored (`no-store`).

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_logs_index
      tags:
      - site-hosting
      x-fluid-audience: member
      parameters:
      - name: since
        in: query
        required: false
        description: An ISO 8601 time; only lines after it are answered. Defaults to 7 days ago.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: The most lines to answer, the oldest first. Defaults to 100, at most 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      responses:
        '200':
          description: The site's log lines.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteLogsEnvelope"
              example:
                status: 200
                data:
                - at: '2026-11-05T10:00:00.000000Z'
                  level: info
                  source: publish
                  message: Upload 0199537f-0000-7000-8000-000000000005 started with 12 files
                - at: '2026-11-05T10:02:00.000000Z'
                  level: info
                  source: publish
                  message: Published 0199537f-0000-7000-8000-000000000005 by Riley Kim
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:05:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never serves a site's log.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '422':
          description: A `since` that is not a time, a `limit` that is not an integer from 1 to 500, or a parameter this operation does not take.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
