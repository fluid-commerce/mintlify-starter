        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: The query holds a parameter this operation does not take, or a `lock_version` that is not an integer from 0 to 2147483647.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/site-menu":
    get:
      summary: Show the member's account menu
      description: |
        The sites in the member's account menu, in four groups: the company's sites, the sites they built, the sites shared with them and the sites they removed. The menu is read when the request is made, so a removal or a restored site shows in the next read. A site no share reaches the member for is in none of the groups, public or not. The menu is not cached (`max-age=0`) and can be revalidated with an ETag.

        A bearer only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, because a script on the company's storefront shares that origin and would otherwise read the names, handles and owners of the member's sites. A portal JWT can read. A member JWT, the credential of email links, is refused with `403`.
      operationId: member_site_menu_show
      tags:
      - site-menu
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The member's menu.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteMenuEnvelope"
              example:
                status: 200
                data:
                  company_sites:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d01'
                    handle: acme-launch
                    name: Acme Launch
                    status: published
                    visibility: public
                    owner_kind: company
                    owner_name: Acme
                    removable: false
                    removal_id:
                  own_sites:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d02'
                    handle: my-shop
                    name: My Shop
                    status: draft
                    visibility: private
                    owner_kind: member
                    owner_name: Sam Lee
                    removable: false
                    removal_id:
                  shared_sites:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                    handle: rileys-shop
                    name: Riley's Shop
                    status: published
                    visibility: private
                    owner_kind: member
                    owner_name: Riley Kim
                    removable: true
                    removal_id:
                  removed_sites:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d03'
                    handle: team-hub
                    name: Team Hub
                    status: published
                    visibility: private
                    owner_kind: member
                    owner_name: Jo Park
                    removable: true
                    removal_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d90'
                  landing_site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d01'
                  shared_sites_omitted: 0
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The menu is unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is an email-link credential, which cannot read the menu; the request came from a sandbox twin; or the request is on the cookie mount, which never serves the menu.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: Member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/site-removals":
    post:
      summary: Remove a site from the member's menu
      description: |
        Takes a site out of the member's own menu, which moves it to `removed_sites`. A removal changes nothing for the site's owner, for anyone else it is shared with or for who may open the site by its address, and it stays when the site is unshared and shared again. Removing a site that is already removed answers `200` with the existing removal.

        A required company site and the member's own site cannot be removed: both are `422`. A site the member cannot open, a site that is not in their menu and a site that does not exist are the same `404`, so the request cannot be used to discover sites. The menu lists at most 100 shared sites, so a site beyond them cannot be removed until a newer one is removed or unshared.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member or portal JWT.
      operationId: member_site_removals_create
      tags:
      - site-removals
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteRemovalCreate"
            example:
              site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
      responses:
        '200':
          description: The site was already removed. The existing removal.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteRemovalEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d90'
                  site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  created_at: '2026-09-30T15:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '201':
          description: The site was removed from the menu.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteRemovalEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d90'
                  site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  created_at: '2026-09-30T15:08:21.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '400':
          description: The body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/WriteRefused"
        '404':
          description: The site is not in the member's menu (it is missing, a draft, or no share reaches the member), or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: Another request removed and restored the site while this one was written. Send it again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The site is a required company site or the member's own site (the field error is on `site_id`), or `site_id` is missing, is not a site id, or the body holds an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/site-removals/{id}":
    parameters:
    - "$ref": "#/components/parameters/RemovalId"
    delete:
      summary: Restore a removed site
      description: |
        Deletes the member's removal, which puts the site back in the group the menu gives it. Another member's removal, a removal that no longer exists and a malformed id are the same `404`.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member or portal JWT.
      operationId: member_site_removals_destroy
      tags:
      - site-removals
      x-fluid-audience: member
      responses:
        '204':
          description: The site was restored to the menu.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/WriteRefused"
        '404':
          description: No removal of the member's has this id, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/site-share-targets":
    get:
      summary: Search the share targets
      description: |
        Whom the member may share a site with: the members matching `q`, the member types and countries a segment may name, how many members are below them, and which audiences their company's messaging policy allows. A member the caller could not message is never listed, and under `no_direct_messages` nothing is. The search is not paged; it returns at most 20 members. It is not cached (`max-age=0`) and can be revalidated with an ETag. A credential may make 30 requests a minute to this route and to the messaging recipient search together; more are refused with `429`.

        Bearer only. A request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header. A member session JWT, the kind order and subscription email links carry, is also refused with `403`: the results are other members' names and emails.
      operationId: member_site_share_targets_index
      tags:
      - site-share-targets
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/ShareTargetQuery"
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The share targets.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteShareTargetsEnvelope"
              example:
                status: 200
                data:
                  members:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e01'
                    name: Nathan Rivera
                    email: nathan@example.com
                  member_types:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e11'
                    name: Preferred Customer
                  countries:
                  - code: CA
                    name: Canada
                  - code: US
                    name: United States
                  downline_count: 42
                  downline_count_capped: false
                  allowed:
                  - member
                  - downline
                  - segment
                  emails_visible: true
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The targets are unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is a member session JWT, the kind order and subscription email links carry, which cannot search the share targets; the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which this operation never serves, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: Member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A `q` that is not blank and has fewer than 3 or more than 200 characters, or an unknown parameter such as `page` or `limit`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: >-
            The credential made more than 30 searches in a minute, counting the messaging recipient search too.
            Wait `retry_after` seconds before searching again. Unlike other responses it carries no Cache-Control header.
          headers:
            X-RateLimit-Limit:
              "$ref": "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RateLimitError"
              example:
                error: Rate limit exceeded
                message: Too many requests. Please wait before trying again.
                retry_after: 42
