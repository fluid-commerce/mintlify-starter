        Filters are query keys of the form `filter[<column>][<operator>]=<value>`, ANDed, at most 50. They are described here and not declared, because OpenAPI has no query parameter for two levels of brackets. The operators are `eq`, `neq`, `lt`, `lte`, `gt`, `gte`, `in` and `is_null`. `in` takes its values as repeated `filter[<column>][in][]=<value>` entries or as one comma-separated list, one to 100 values, and a value that holds a comma goes in the repeated form. `is_null` takes `true` or `false`. Every other operator takes one string, which the database reads as the column's type. A filter on a column that is not in the table is 422. The shell passes at most 2,048 characters of query string, so a longer filter is sent with a bearer.

