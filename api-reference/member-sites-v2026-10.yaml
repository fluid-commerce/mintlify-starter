    get:
      summary: Show a site
      description: |
        Works for static V1 sites as well as older Liquid sites. This returns the site's management details. `layout_name`, `settings` and `content_version` describe the older Liquid authoring tree; they are not the current V1 bundle or its manifest. While the sites gateway is on, `access` is the current bundle's declaration; it is never a grant response. Use [List a site's bundles](https://docs.fluid.app/api-reference/site-bundles/list-a-sites-bundles) to identify the current V1 build, and the returned `share_url` to share a served site.

        One of the member's sites. Another member's site, a missing one and a malformed id all return 404. Privately cacheable with revalidation on every read.
      operationId: member_sites_show
      tags:
      - sites
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The site.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  access:
                    declared: false
                    uses: []
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  share_url:
                  url: https://shop.example.com/sites/rileys-shop
                  company_lock: none
                  taken_down_reason: null
                  lock_version: 0
