    SiteRestore:
      type: object
      description: The version to restore. Any other field is refused as an unknown field.
      additionalProperties: false
      properties:
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{7,40}$'
          description: The sha of the version, 7 to 40 hex characters, from `sha` in the versions listing.
      required:
      - sha
    SiteRestoredEnvelope:
      type: object
      description: What a restore did.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: object
          description: The restored version and how many files it wrote and removed.
          additionalProperties: false
          properties:
            sha:
              type: string
              description: The sha of the version restored.
            files_written:
              type: integer
              minimum: 0
              description: The number of files in the version, including files the site does not manage such as `README.md`.
            files_removed:
              type: integer
              minimum: 0
              description: The number of the site's files the version did not have, which the restore removed.
          required:
          - sha
          - files_written
          - files_removed
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteFile:
      type: object
      description: One file of a site.
      additionalProperties: false
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        content:
          type: string
          description: The file's content. `config/settings.json`, `config/menus.json`, `config/pages.json` and `config/access.json` hold JSON documents.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Send it back as `lock_version` when writing the settings. It also changes when a page of the site is added, changed or removed, and when `config/menus.json` is written, so read the settings again before a versioned write. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: >-
            The version of the file, to send back as `version` when writing it (the request body) or removing it (the query parameter), so the change is refused with 409 if the file changed since. For an asset it is a digest of the content. For a layout, section, snippet or page file it is a digest of the draft content and of the published copy, so a publish changes it too: read the files again after publishing. For `config/menus.json`, `config/pages.json` and `config/access.json` it is a digest of the document. For `config/settings.json` it is the `lock_version` as a string, which also changes when a page is added, changed or removed and when `config/menus.json` is written.
            Treat it as opaque.
      required:
      - path
      - content
      - lock_version
      - version
    SiteFileWrite:
      type: object
      description: The content of a file. The path is in the URL.
      additionalProperties: false
      properties:
        content:
          type: string
          pattern: '^[^\u0000]*$'
          description: The whole new content of the file. An asset must not be empty. `config/settings.json` takes a JSON object, and `config/menus.json` a JSON document of menus (an item may carry `translations`, an object from a language's iso code to the item's title in that language; `title` is the title in the default language), `config/pages.json` a JSON document of the site's default layout and page settings, and `config/access.json` a JSON object whose `uses` key lists what the site uses, which is refused with 422 when it is not valid.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The `lock_version` of `config/settings.json` the caller last read. The write is refused with 409 if the settings changed since. Ignored for every other file. Send either this or `version`, not both.
        version:
          type: string
          maxLength: 255
          pattern: '^[^\u0000]*$'
          description: >-
            The `version` of the file the caller last read. The write is refused with 409 if the file has changed or been removed since, and nothing is written. For `config/settings.json` it is the `lock_version` as a string, and for `config/menus.json`, `config/pages.json` and `config/access.json` the digest of the document.
            Without `version` or `must_not_exist`, the write replaces whatever is at the path, except `config/menus.json` while the site's menus hold a translated item title: then the write is refused with 409, so a caller that never read the translations cannot remove them. Cannot be sent with `must_not_exist` or `lock_version`.
        must_not_exist:
          type: boolean
          description: Send `true` to create the file only if the path holds none. The write is refused with 409 if a file is already there, so a file another writer created since the caller listed the files is not replaced. `config/settings.json`, `config/menus.json` and `config/pages.json` always exist, so it is always refused for them. `config/access.json` exists only once it is written, so it is refused for it only when the site already has one. Cannot be sent with `version`.
      required:
      - content
    SiteFileEnvelope:
      type: object
      description: One site file.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteFile"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteFileEntry:
      type: object
      description: The metadata of one file of a site, without its content. Read the file with `GET /sites/{site_id}/files/{path}`.
      additionalProperties: false
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        kind:
          type: string
          enum:
          - layout
          - section
          - snippet
          - page
          - asset
          - settings
          - menus
          - pages
          - access
          description: What the file is.
        content_type:
          type: string
          description: The content type of the file, such as `text/x-liquid` for a layout, section, snippet or page and `text/css` for a stylesheet. `config/settings.json`, `config/menus.json`, `config/pages.json` and `config/access.json` are `application/json`.
        byte_size:
          type: integer
          minimum: 0
          description: The size in bytes of the content that reading the file returns.
        lock_version:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: The version of the site's settings, for `config/settings.json` only. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: The version of the file, to send back as `version` when writing or removing it. See the `version` of a read file.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the file last changed. Null for `config/menus.json`, `config/pages.json` and `config/access.json`, which have no time of their own.
      required:
      - path
      - kind
      - content_type
      - byte_size
      - lock_version
      - version
      - updated_at
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    SiteFileEntriesEnvelope:
      type: object
      description: One page of the files of a site, as metadata.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The files of the page, sorted by path.
          items:
            "$ref": "#/components/schemas/SiteFileEntry"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SiteShare:
      type: object
      description: One audience a site is shared with. It never carries an email address.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the share.
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: Who the site is shared with. `member` names one member, `downline` is the downline of the member who shared it, and `segment` is the company's members of a member type, in a country, both or neither (every member).
        member:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member a `member` share names. Null for every other kind.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member.
            name:
              type:
              - string
              - 'null'
              description: The member's name, or null when they have none.
          required:
          - id
          - name
        member_type:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member type a `segment` share names. Null when it names none, and for every other kind.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member type.
            name:
              type: string
              description: Name of the member type.
          required:
          - id
          - name
        country:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The country a `segment` share names. Null when it names none, and for every other kind.
          properties:
            code:
              type: string
              description: ISO 3166-1 alpha-2 code of the country.
            name:
              type: string
              description: Name of the country.
          required:
          - code
          - name
        label:
          type: string
          description: The audience in words. A member share is the member's name, or "A member" when they have none; a downline share is "Downline of" the member who shared it; a segment share is "Customer in United States", "Customer", "Members in United States" or "All members".
        permission:
          type: string
          enum:
          - view
          - copy
          description: What the audience may do with the site. `view` opens it; `copy` also lets them copy it into a site of their own.
        created_at:
          type: string
          format: date-time
          description: When the site was shared with the audience.
      required:
      - id
      - audience_kind
      - member
      - member_type
      - country
      - label
      - permission
      - created_at
    SiteShareCreate:
      type: object
      description: Share a site with one audience. Each audience kind takes its own targets, and sending a target the kind does not take is refused with 422.
      additionalProperties: false
      properties:
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: Who to share with. A `member` share needs `member_id` and takes no other target. A `downline` share takes none. A `segment` share takes `member_type_id`, `country_code`, both or neither, and neither shares with every member the company's messaging policy lets you reach.
        member_id:
          type: string
          format: uuid
          description: Id of the member to share with. A member of another company is refused with 422.
        member_type_id:
          type: string
          format: uuid
          description: Id of the member type of a segment.
        country_code:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 code of the country of a segment, one of the countries the company sells in.
        permission:
          type: string
          enum:
          - view
          - copy
          default: view
          description: What the audience may do with the site. Ignored for an audience that is already shared; change it with `PATCH`.
      required:
      - audience_kind
    SiteShareUpdate:
      type: object
      description: The change to a share. Only the permission changes; to change who a share names, delete it and add another.
      additionalProperties: false
      properties:
        permission:
          type: string
          enum:
          - view
          - copy
          description: What the audience may do with the site.
      required:
      - permission
    SiteShareEnvelope:
      type: object
      description: One share.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteShare"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteSharesEnvelope:
      type: object
      description: One page of the shares of a site.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The shares of the page, oldest first.
          items:
            "$ref": "#/components/schemas/SiteShare"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SiteAccessRequest:
      type: object
      description: One member's request to see one of the member's private sites. It is the owner who sees it, so it carries the requester's account email address.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the request.
        state:
          type: string
          enum:
          - pending
          - approved
          - declined
          description: Where the request stands. A list holds `pending` requests only; approving answers `approved` and declining answers `declined`.
        message:
          type:
          - string
          - 'null'
          description: What the requester wrote, at most 500 characters, or null when they wrote nothing. It is the requester's text, not Fluid's; show it as plain text.
        requester:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member who asked, or null when they have left the company since. A request of a member who left is not listed, but approving or declining it again by its id still answers it.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member.
            name:
              type:
              - string
              - 'null'
              description: The member's name, or null when none is set.
            email:
              type: string
              description: The member's account email address.
          required:
          - id
          - name
          - email
        created_at:
          type: string
          format: date-time
          description: When the request was made, to the microsecond, in UTC.
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the owner decided the request, or null while it is pending.
      required:
      - id
      - state
      - message
      - requester
      - created_at
      - closed_at
    SiteAccessRequestEnvelope:
      type: object
      description: One access request.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteAccessRequest"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteAccessRequestsEnvelope:
      type: object
      description: One page of the pending access requests of a site.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The pending requests of the page, newest first.
          items:
            "$ref": "#/components/schemas/SiteAccessRequest"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SentSiteInvitation:
      type: object
      description: One invitation to one of the member's sites, as its owner sees it. It carries the invitee's email address only when the company's messaging policy shows members' emails, as the share picker does.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the invitation.
        state:
          type: string
          enum:
          - pending
          description: Where the invitation stands. The owner's routes answer only `pending` invitations; the list leaves out ones past `expires_at`.
        role:
          type: string
          enum:
          - view
          - edit
          description: What was offered.
        invitee:
          type: object
          additionalProperties: false
          description: The member invited.
          properties:
            id:
              type: string
              format: uuid
              description: Id of the member.
            name:
              type:
              - string
              - 'null'
              description: The member's name, or null when none is set.
            email:
              type:
              - string
              - 'null'
              description: The member's email address, or null unless the company's messaging policy shows members' emails (the share picker's `emails_visible`).
          required:
          - id
          - name
          - email
        sent_at:
          type: string
          format: date-time
          description: When the invitation was last sent, in UTC.
        expires_at:
          type: string
          format: date-time
          description: When it stops being answerable, 7 days after `sent_at`.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it was accepted, declined, revoked or superseded; null while pending.
        created_at:
          type: string
          format: date-time
          description: When the member was first invited to the site.
      required:
      - id
      - state
      - role
      - invitee
      - sent_at
      - expires_at
      - decided_at
      - created_at
    SentSiteInvitationEnvelope:
      type: object
      description: One invitation to one of the member's sites.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SentSiteInvitation"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SentSiteInvitationsEnvelope:
      type: object
      description: One page of the pending invitations to one of the member's sites.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The pending invitations of the page, newest sent first.
          items:
            "$ref": "#/components/schemas/SentSiteInvitation"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
      required:
      - status
      - data
      - meta
    SiteInvitationCreate:
      type: object
      description: The member to invite and the role offered. Any other field is refused as an unknown field.
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
          description: Id of a member of the company.
        role:
          type: string
          enum:
          - view
          description: "`view` opens the site. `edit` is not offered yet: it is refused with `422`, and the error's `details.role` says so."
      required:
      - member_id
      - role
    SiteInvitation:
      type: object
      description: One invitation to a site, as the member it invites sees it. Accepting it shares the site with the member; the invitation itself grants nothing.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Id of the invitation.
        state:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - revoked
          - superseded
          description: Where the invitation stands, as stored. A list holds `pending` invitations that may still be answered; one past `expires_at` is not listed, and answering it is refused with `expired`. `revoked` means the site's owner withdrew it, and `superseded` that it can no longer be honored.
        role:
          type: string
          enum:
          - view
          - edit
          description: What the owner offered. `view` opens the site; `edit` also lets the member work on it with the owner in Mist.
        site:
          type: object
          additionalProperties: false
          description: The site, with the fields and id of its site-menu entry, so the entry it becomes once accepted can be found by `id`.
          properties:
            id:
              type: string
              format: uuid
              description: Public id of the site, the same id as its site-menu entry.
            handle:
              type: string
              description: The site's URL segment.
            name:
              type: string
              description: Display name.
            status:
              type: string
              enum:
              - draft
              - published
              - archived
              - taken_down
              description: The site's status as the member's site menu shows it, so `published` means live now. A site published or scheduled but not live yet reads `draft`, and one an admin took down reads `taken_down`. A site that is not published opens for nobody but its owner, so once accepted it joins the member's menu only when it reads `published`.
            visibility:
              type: string
              enum:
              - private
              - public
              description: Who may open the site once it is published.
            share_url:
              type:
              - string
              - 'null'
              format: uri
              description: The link to share the site with the caller's credit, as a site-menu entry's `share_url`. Null while the company is not on the sites gateway, and for a site the gateway cannot serve yet.
          required:
          - id
          - handle
          - name
          - status
          - visibility
          - share_url
        invited_by:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: The member who sent the invitation, or null once that member is deleted, when accepting it answers `422` superseded.
          properties:
            display_name:
              type: string
              description: The sender's full name, or an empty string when none is set.
            avatar_url:
              type:
              - string
              - 'null'
              format: uri
              description: The sender's picture, or null when they have none.
          required:
          - display_name
          - avatar_url
        sent_at:
          type: string
          format: date-time
          description: When the invitation was last sent, to the microsecond, in UTC. Sending again moves it; show the invitation's age from this, not from `created_at`.
        expires_at:
          type: string
          format: date-time
          description: When the invitation stops being answerable, 7 days after `sent_at`.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the member accepted or declined it, the owner withdrew it, or it was superseded; null while it is pending.
        created_at:
          type: string
          format: date-time
          description: When the owner first invited the member to the site.
        share_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the share an accept added or found, or null.
      required:
      - id
      - state
      - role
      - site
      - invited_by
      - sent_at
      - expires_at
      - decided_at
      - created_at
      - share_id
    SiteInvitationEnvelope:
      type: object
      description: One site invitation.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteInvitation"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteInvitationsEnvelope:
      type: object
      description: One page of the member's pending site invitations.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
