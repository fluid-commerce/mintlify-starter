          maxItems: 100
          description: One to 100 rows, each an object whose keys are column names. All rows carry the same columns. An object or array value is stored as JSON text, which suits `json` and `jsonb` columns.
          items:
            "$ref": "#/components/schemas/SiteDatabaseRow"
      required:
      - rows
    SiteDatabaseRowsCreatedEnvelope:
      type: object
      description: The rows that were inserted.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The inserted rows, with the columns the database filled in.
          items:
            "$ref": "#/components/schemas/SiteDatabaseRow"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteDatabaseRowUpdate:
      type: object
      description: The values to write to one row.
      additionalProperties: false
      properties:
        values:
          "$ref": "#/components/schemas/SiteDatabaseRow"
      required:
      - values
    SiteDatabaseRowEnvelope:
      type: object
      description: One row.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteDatabaseRow"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteDataTable:
      type: object
      description: One table of a V1 site's database, as the site's current bundle declares it.
      additionalProperties: false
      required:
      - name
      - columns
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          description: The table's name.
        columns:
          type: array
          description: The columns the schema declares, then the four system columns (`id`, `created_by`, `created_at`, `updated_at`).
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - type
            properties:
              name:
                type: string
                description: The column's name.
              type:
                type: string
                enum:
                - text
                - integer
                - number
                - boolean
                - date
                - timestamp
                - uuid
                - json
                description: The column's type.
    SiteDataTablesResponse:
      type: object
      description: The tables of a V1 site's database.
      additionalProperties: false
      required:
      - tables
      - status
      - meta
      properties:
        tables:
          type: array
          description: The tables the schema declares, in its order.
          items:
            "$ref": "#/components/schemas/SiteDataTable"
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    SiteDataRowsResponse:
      type: object
      description: A page of one table's rows, newest first.
      additionalProperties: false
      required:
      - rows
      - status
      - meta
      properties:
        rows:
          type: array
          description: The rows on this page. Each is an object of the table's columns and its four system columns, with the values the sites gateway answers (`integer` above 2^53 as a string, `json` as JSON).
          items:
            type: object
            additionalProperties: true
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                type: object
                additionalProperties: false
                required:
                - limit
                - offset
                - count
                properties:
                  limit:
                    type: integer
                    description: The rows asked for per page.
                  offset:
                    type: integer
                    description: The rows skipped.
                  count:
                    type: integer
                    minimum: 0
                    description: The rows the table holds.
  responses:
    Unauthorized:
      description: Missing or unusable member credential.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    ReadOnlyCredential:
      description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only), or belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    SandboxTwin:
      description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    SandboxTwinOrCookieMount:
      description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted; or the request is on the cookie mount, which this operation never serves, with or without the `X-Fluid-Member-Site` header.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    WriteRefused:
      description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only); the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves site removals.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    BundleRefused:
      description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only); the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves a site's bundles, with or without the `X-Fluid-Member-Site` header.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    BundleConflict:
      description: The site already has 5 uploads in progress (`details.error` is `uploads_in_progress`), so nothing was saved and the gateway was not asked; finish one or wait for one to expire, 60 minutes after it started. Or the bundle was gone when the gateway answered, because its site was deleted (`superseded`), and no upload URLs are returned.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
          examples:
            uploads-in-progress:
              summary: The site's fifth upload is still in progress
              value:
                status: 409
                error:
                  message: This site already has 5 uploads in progress; finish or wait for one to expire
                  details:
                    error: uploads_in_progress
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
            superseded:
              summary: The bundle was gone when the gateway answered
              value:
                status: 409
                error:
                  message: This upload is gone, so it cannot be published
                  details:
                    error: superseded
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
    BundleNotFound:
      description: No site of the member's has this id, the member may not change it, or the sites gateway is not released to the member's company. One answer for each, so it never says whether a site exists.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: No site of the member's has this id, the site has no such file or page, or member sites are not enabled for the member's company.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    PreviewNotFound:
      description: The same empty answer, typed `text/plain`, for every reason. No site of the member's has this id, the member does not own it, the site has no such page or file, or member sites are not enabled for the member's company. It never says which.
      headers:
        Content-Security-Policy:
          "$ref": "#/components/headers/PreviewContentSecurityPolicy"
        Cache-Control:
          "$ref": "#/components/headers/PreviewCacheControl"
        X-Robots-Tag:
          "$ref": "#/components/headers/PreviewRobotsTag"
        Referrer-Policy:
          "$ref": "#/components/headers/PreviewReferrerPolicy"
    Conflict:
      description: The site, its settings, the page or the file changed since it was read, or a file to be created already exists. Read it again and retry.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseRefused:
      description: 'The credential is a member session JWT, the kind order and subscription email links carry, which no database operation accepts; the credential is a portal JWT minted read-only and the request writes; the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount and is refused. A cookie-mount request is refused when it carries no `X-Fluid-Member-Site` label, a malformed one or one that names another site than the path''s; when the labelled site is not published, is not the session member''s own or has not declared the scope the request needs, which `details.scope` names (`database: read` for a read and `database: write` for a write); and always for the SQL statement operation.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseNotFound:
      description: No site of the member's has this id, the site has no database, a draft or taken-down site is named by an operation that reaches the backend, or member sites are not enabled for the member's company.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseUnavailable:
      description: The site's database is not live, so nothing was sent to it (`details.error` is `database_unavailable`, with the hosting's `details.state` and a `details.next_step`. While the state is `provisioning`, or `live` with no address yet, wait and check `GET` on the database's path until it is `live` and `available`, because asking again would answer 409; a database that never finishes is abandoned by turning it off with `DELETE` on that path. In any other state ask for the database again with `POST` on that path, which replaces it, or turn it off with `DELETE`), or the backend refused an insert, update or statement because of a unique or foreign-key violation (`details.error` is `conflict`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseBadRequest:
      description: The request body is not valid JSON (`details.error` is `invalid_json`), or the cursor is not one the database issued for this query (`details.error` is `invalid_cursor`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnableRefused:
      description: 'The credential is a member session JWT, the kind order and subscription email links carry, or a portal JWT minted read-only, neither of which may turn a database on; the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves this operation, with or without the `X-Fluid-Member-Site` header, whatever the site declares.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnableConflict:
      description: The site already has a database whose hosting is `provisioning` or `live`, or a request to turn it on is already running (`details.error` is `exists`, with `details.reason`). Nothing was created and no vendor was called.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnableRefusedInput:
      description: 'The site cannot have a database (`details.error` is `not_eligible` and `details.reason` is `branch` or `taken_down`; a company''s own site is 404 because only a member''s own site is found); the company already has the most databases it may hold (`details.error` is `backend_limit_reached`, with the `details.limit`); or the request carries a body field or query key, which this operation does not take, with `details` keyed by field. Nothing was created and no vendor was called.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseDisableRefused:
      description: 'The credential is a member session JWT, the kind order and subscription email links carry, or a portal JWT minted read-only, neither of which may turn a database off; the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves this operation, with or without the `X-Fluid-Member-Site` header, whatever the site declares.'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseDisableConflict:
      description: The turn-off waited for a lock that a step of creating the database, or another change to the site, held, and gave up (`details.error` is `database_busy`). The site and its database are unchanged, so the request may be sent again.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseDisableInvalidInput:
      description: The request carries a body field or query key, which this operation does not take, with `details` keyed by field. Nothing was changed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnablePaymentRequired:
      description: The company cannot pay for a database now, and a member who owns the site learns no more than that. `details.error` is `credits_exhausted` (no hosting credits left) or `billing_unresolved` (the company's billing needs attention), with `details.category` `hosting` and a fixed `message`. The company's billing tier, standing, episode and condition ids, eligibility date and billing path are never returned; an admin who may view billing reads them in the billing standing. No vendor was called.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnableBadGateway:
      description: A step of creating the database failed (`details.error` is `provisioning_failed`, with the `details.step` and whether it was `rolled_back`). Nothing a vendor said is returned. The site holds no database, so the owner may ask again.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseEnableUnavailable:
      description: No approved database template can be used now (`details.error` is `template_unavailable`), or billing could not record the decision (`details.error` is `admission_unavailable`). Nothing was created and no vendor was called.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseTooLarge:
      description: The request body is over 64 KiB. It was not read and nothing was sent.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseInvalid:
      description: A parameter is refused before anything is sent, with `details` keyed by field (a key the operation does not take, including `operation`, `member`, `company`, `site` and `url`; a table or column that is not an identifier; a filter operator outside the list; `page[limit]` outside 1 to 100; more than 100 rows; an empty statement or `values`); or the backend refused the operation with its own reason in `message` (`constraint_violation`, `invalid_params`, `invalid_statement`, `statement_timeout`, `row_too_large`), with the backend's answer in `details.backend_response`.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseRateLimited:
      description: More than 60 calls in a minute for this company, member and site. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          description: Always 60, the seconds to wait.
          schema:
            type: string
            example: '60'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseBadGateway:
      description: The site's backend could not be reached, did not answer within the time allowed, answered with more than 256 KiB or with something other than a JSON object, refused Fluid's signature (`details.error` is `backend_refused` with `details.upstream_status`), or answered with an error this API does not map (`details.backend_response` holds its answer, bounded to 4 KiB).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
    DatabaseServiceUnavailable:
      description: The per-minute counter could not be read, so the call was refused (`details.error` is `unavailable`).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorEnvelope"
  parameters:
    SiteId:
      name: id
      in: path
      required: true
      description: Public id of one of the member's sites.
      schema:
        type: string
        format: uuid
    SiteIdPath:
      name: site_id
      in: path
      required: true
      description: Public id of one of the member's sites.
      schema:
        type: string
        format: uuid
    BundleIdPath:
      name: bundle_id
      in: path
      required: true
      description: The bundle's id, as the start of its upload answered it.
      schema:
        type: string
        format: uuid
    PreviewSlug:
      name: slug
      in: path
      required: true
      description: The slug of the page, lowercase letters and digits joined by hyphens, such as `about`. The home page has no slug in the path; see the operation without one.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    PreviewAssetPath:
      name: path
      in: path
      required: true
      description: 'The theme-style path of a text asset, with its slash: `assets/<file>`, a css, js, json, txt or html file such as `assets/site.css`. Any other path is the same empty 404.'
      schema:
        type: string
        pattern: '^.+$'
    EnvVarName:
      name: name
      in: path
      required: true
      description: 'The variable''s name: a capital letter, then up to 63 capital letters, digits and underscores, not starting with `FLUID_`.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]+$'
    BranchSlug:
      name: slug
      in: path
      required: true
      description: Slug of one of the site's branches.
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    VersionLimit:
      name: limit
      in: query
      required: false
      description: How many versions to list, newest first. 25 when omitted, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    FilePath:
      name: path
      in: path
      required: true
      description: 'The theme-style path of the file, with its slash: `layouts/<name>.liquid`, `sections/<name>.liquid`, `snippets/<name>.liquid`, `pages/<slug>.liquid` (`pages/index.liquid` for the home page), `assets/<file>` (a css, js, json, txt or html file), `config/settings.json`, `config/menus.json`, `config/pages.json` or `config/access.json`. Names use lowercase letters, digits, hyphens and underscores, with no subfolders. Any other path is refused with 422.'
      schema:
        type: string
        pattern: '^.+$'
    AccessRequestId:
      name: id
      in: path
      required: true
      description: Id of one of the site's access requests.
      schema:
        type: string
        format: uuid
    SiteInvitationId:
      name: id
      in: path
      required: true
      description: Id of one of the member's site invitations.
      schema:
        type: string
        format: uuid
    ShareId:
      name: id
      in: path
      required: true
      description: Id of one of the site's shares.
      schema:
        type: string
        format: uuid
    PageId:
      name: page_id
      in: path
      required: true
      description: Public id of one of the site's pages.
      schema:
        type: string
        format: uuid
    RemovalId:
      name: id
      in: path
      required: true
      description: Id of one of the member's removals, from `removal_id` in the menu or `id` in a removal.
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from a previous response.
      schema:
        type: string
    ShareTargetQuery:
      name: q
      in: query
      required: false
      description: What a member's name starts with, or their email address where the company's policy shows it. Leading and trailing spaces are ignored. Blank lists the first members the caller may share with. Otherwise it needs 3 to 200 characters and is refused with 422 outside that range. Searching also needs the first word or the rest of the query to have 3 characters; a query where neither does matches no members, and the other targets are still returned.
      schema:
        type: string
        maxLength: 200
    FileVersionQuery:
      name: version
      in: query
      required: false
      description: The `version` of the file the caller last read. The file is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the file is removed as it is.
      schema:
        type: string
        maxLength: 255
    PageLockVersionQuery:
      name: lock_version
      in: query
      required: false
      description: The `lock_version` of the page the caller last read. The page is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the page is removed as it is.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
    DatabaseTable:
      name: table
      in: path
      required: true
      description: The name of a table of the site's database, letters, digits and underscores, starting with a letter or underscore, at most 63 characters. A table that is not in the database's `public` schema is 404.
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'
    DatabaseRowId:
      name: id
      in: path
      required: true
      description: The value of the table's single-column primary key. A table with no single-column primary key answers 422.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    DatabaseRowsSort:
      name: sort
      in: query
      required: false
      description: The columns to order by, comma separated, at most 10, each with an optional leading `-` for descending, such as `-created_at,name`. The order always ends with the table's primary key, so equal values page stably.
      schema:
        type: string
        maxLength: 700
    DatabaseRowsPageLimit:
      name: page[limit]
      in: query
      required: false
      description: How many rows to list, 25 when omitted, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    DatabaseRowsPageCursor:
      name: page[cursor]
      in: query
      required: false
      description: The `meta.pagination.next_cursor` of the previous page. It is tied to the table, filters and sort it was issued for.
      schema:
        type: string
        maxLength: 2048
paths:
  "/api/member/v2026-10/sites":
    get:
      summary: List the member's sites
      description: |
        Works for static V1 sites as well as older Liquid sites. This is a management list, not a list of the member's published bundles. The presence of `status: published` alone does not mean the gateway serves a site; use the returned `share_url` for a share button, and do not construct a link when it is null. See [List a site's bundles](https://docs.fluid.app/api-reference/site-bundles/list-a-sites-bundles) for V1 upload and publication history.

        Every site the member owns, newest first, except a branch, which is found through its site's branches and by its own id. A member owns at most 25 sites, so the list is not paged. The list is not cached (`max-age=0`) and can be revalidated with an ETag.
      operationId: member_sites_index
      tags:
      - sites
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The member's sites.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SitesEnvelope"
              example:
                status: 200
                data:
                - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  access:
                    declared: false
                    uses: []
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  share_url:
                  url: https://shop.example.com/sites/rileys-shop
                  company_lock: none
                  taken_down_reason: null
                  lock_version: 0
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/SandboxTwin"
        '404':
          "$ref": "#/components/responses/NotFound"
    post:
      summary: Add a site
      description: |
        Creates the site record for either approach. For static V1 content, follow creation with [Start a bundle upload](https://docs.fluid.app/api-reference/site-bundles/start-a-bundle-upload), upload the returned blobs, then [Publish a bundle](https://docs.fluid.app/api-reference/site-bundles/publish-a-bundle). Creating the site does not upload or publish its build.

        Adds a site owned by the member, as a draft. Without a handle one is proposed from the name, and a number is added when it is taken. A member can own at most 25 sites.
      operationId: member_sites_create
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteCreate"
            example:
              name: Riley's Shop
              visibility: private
              settings:
                primary_color: "#112233"
      responses:
        '201':
          description: The new site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  access:
                    declared: false
                    uses: []
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  share_url:
                  url: https://shop.example.com/sites/rileys-shop
                  company_lock: none
                  taken_down_reason: null
                  lock_version: 0
                  created_at: '2026-09-01T10:00:00.000000Z'
                  updated_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
