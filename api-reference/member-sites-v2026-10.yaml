    post:
      summary: Branch a site
      description: |
        For an older Liquid site, makes a branch of one of the member's published sites: a second site, owned as the parent is, cloned from the parent's published layouts, sections, snippets, pages, settings, text assets and menus, and published at once, so its `frame_path` renders what the parent renders. Nothing the parent holds in draft is copied, and the parent is never changed. The branch is private and cannot be shared or made public, only its owner and company admins can open it, and it is left out of the site list and the account menu. It has no Git repository. It counts toward the member's 25-site limit.

        Edit the branch with the files and pages operations and publish it with the publish operation, using `site_id` as the site id. A site has one branch at a time; delete it to make another. A draft site, a taken-down site and a branch cannot be branched, and a site holding a binary asset cannot be branched. The body is optional.

        For a gateway-served V1 parent, prepares an independent copy of its current bundle. The branch starts as a private draft while its files and, when present, database rows are copied in the background. It is published automatically through the normal bundle publisher only after both are ready. Read the branch's status to see when it is published. A database schema change on the parent during copying can prevent publication of the captured bundle; the branch remains unserved and its failed bundle is visible through the bundle list. Editing a V1 branch uses its app files and bundle operations, rather than the older Liquid file operations.

      operationId: member_site_branches_create
      tags:
      - site-branches
      x-fluid-audience: member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteBranchCreate"
            example:
              slug: staging
      responses:
        '201':
          description: The new private branch. A V1 branch starts as draft until its background copies finish. A failed database provisioning attempt keeps the accepted draft for automatic retry; publication waits until its database is ready.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteBranchEnvelope"
              example:
                status: 201
                data:
                  slug: staging
                  site_id: '0192f4e5-8b01-7b8c-9d0e-1f2a3b4c5d01'
                  parent_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop-staging
                  status: published
                  frame_path: "/accounts/_frame/0192f4e5-8b01-7b8c-9d0e-1f2a3b4c5d01"
                  shell_path: "/sites/rileys-shop-staging"
                  url: https://shop.example.com/sites/rileys-shop-staging
                  parent_changed: false
                  created_at: '2026-09-03T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: The site already has a branch, or the slug is taken, or the site was being changed and the branch was not made. Delete the branch, or read the site again and retry.
          content:
