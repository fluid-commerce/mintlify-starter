  "/api/member/v2026-10/sites/{site_id}/access-requests/{id}/approve":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    - "$ref": "#/components/parameters/AccessRequestId"
    post:
      summary: Approve an access request
      description: |
        Shares the site with the requester: adds a `view` share for them, closes the request as `approved`, and emails the requester once it commits. Access comes from the share alone; the request grants nothing. Approving an approved request writes and sends nothing and returns the same request with `200`.

        The request is checked again when it is approved. If the site is no longer published and private, the requester has left the company, or the company's messaging policy no longer lets the owner share with them, the request is closed as superseded, no share is written, and the answer is `422` with the reason in `error.details.reason`: `site_not_published`, `site_not_private`, `requester_left`, `outside_messaging_scope` or `not_owner`. Approving it again answers the same.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT, or a portal JWT minted read-only. It answers `404` until access requests are enabled for the member's company.
      operationId: member_site_access_requests_approve
      tags:
      - site-access-requests
      x-fluid-audience: member
      responses:
        '200':
          description: The approved request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteAccessRequestEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-9c01-7b8c-9d0e-1f2a3b4c5d01'
                  state: approved
                  message: I'd love to see the launch plan.
                  requester:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d11'
                    name: Nathan Cho
                    email: nathan@example.com
                  created_at: '2026-11-07T16:05:00.000000Z'
                  closed_at: '2026-11-09T15:08:21.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-09T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          description: No site of the member's has this id, the site has no such request, or member sites or access requests are not enabled for the member's company. The request was declined or has expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: Another change to the request happened at the same moment and nothing was decided. Send the request again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The request can no longer be granted and is now closed as superseded; `error.details.reason` says why.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
