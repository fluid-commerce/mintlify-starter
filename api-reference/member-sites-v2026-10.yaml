        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      summary: Change a site
      description: |
        Use this operation for management changes such as the name and visibility of a static V1 site. Older Liquid authoring fields such as `settings` and `layout_name` do not change a V1 build. Publish changed V1 files or declarations through [Publish a bundle](https://docs.fluid.app/api-reference/site-bundles/publish-a-bundle).

        Changes the supplied fields. Send the `lock_version` you last read to refuse the change if the site changed since; without it the change is applied to the current site. A handle change keeps the site's public id.
      operationId: member_sites_update
      tags:
