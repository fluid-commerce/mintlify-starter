        '403':
          description: The credential is a member JWT, or the request is on the cookie mount, which never serves invitations.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A parameter this operation does not take, such as `page[limit]`, because the page size is fixed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      summary: Invite a member to a site
      description: |
        Invites a member of the company to one of the member's sites, offering `view`; `edit` is not offered yet and is refused with `422`. The invitation grants nothing until the invitee accepts it, which adds a member share; it can be answered for 7 days. A site has one invitation per member: inviting a member who already has one, whatever became of it, sends it again with this role and a new expiry, and answers `200` with it. The first invitation answers `201`.

        The member must be a member of the company and not the caller, and the company's messaging policy must let the caller reach them (`403` `outside_messaging_scope` otherwise). A member the site is already shared with by a member share answers `422` `already_shared`. A branch takes no invitations.

        A bearer only, as sharing is: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT. It answers `404` while member sites are not enabled for the member's company. A portal JWT minted read-only is refused with `403`.
      operationId: member_site_invitations_sent_create
      tags:
      - site-invitations
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteInvitationCreate"
            example:
              member_id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d12'
              role: view
      responses:
        '200':
          description: The member's invitation, sent again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SentSiteInvitationEnvelope"
              example:
                status: 200
                data:
                  id: '0193a1b2-4c5d-7e6f-8a9b-0c1d2e3f4a5b'
                  state: pending
                  role: view
                  invitee:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d12'
                    name: Casey Brooks
                    email: casey@example.com
                  sent_at: '2026-11-10T22:00:00.000000Z'
                  expires_at: '2026-11-17T22:00:00.000000Z'
                  decided_at:
                  created_at: '2026-11-10T22:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T22:05:00Z'
        '201':
          description: The new invitation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SentSiteInvitationEnvelope"
              example:
                status: 201
                data:
                  id: '0193a1b2-4c5d-7e6f-8a9b-0c1d2e3f4a5b'
                  state: pending
                  role: view
                  invitee:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d12'
                    name: Casey Brooks
                    email: casey@example.com
                  sent_at: '2026-11-10T22:00:00.000000Z'
                  expires_at: '2026-11-17T22:00:00.000000Z'
                  decided_at:
                  created_at: '2026-11-10T22:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T22:05:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is a member JWT or read-only, the request is on the cookie mount, or the company's messaging policy does not let the caller reach the member (`error.details.error` is `outside_messaging_scope`).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the site is a branch, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The body is invalid, the member is not a member of the company or is the caller, or the site is already shared with them (`error.details.error` is `already_shared`).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/invitations/{id}":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    - "$ref": "#/components/parameters/SiteInvitationId"
    delete:
      summary: Revoke a site invitation
      description: |
        Withdraws an invitation, so it can no longer be accepted. Revoking a revoked or superseded invitation answers `204` too. An accepted invitation whose share still stands is not revoked (`409`): remove the share instead. Once that share is gone, the accepted invitation can be revoked (`204`). Inviting the member again later sends the same invitation anew.

        A bearer only, as sharing is: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT. It answers `404` while member sites are not enabled for the member's company. A portal JWT minted read-only is refused with `403`.
      operationId: member_site_invitations_sent_destroy
      tags:
