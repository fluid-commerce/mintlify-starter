  "/api/member/v2026-10/sites/{site_id}/invitations":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List a site's invitations
      description: |
        The pending invitations to one of the member's sites, newest sent first, each with who is invited (name, and email address when the company's messaging policy shows members' emails), the role offered and when it expires. Invitations past their expiry, answered or revoked are not listed, and neither are invitations of members who have left the company. The list is paged by cursor, 25 to a page; follow `meta.pagination.next_cursor` until it is null. It is not cached (`max-age=0`) and can be revalidated with an ETag.

        A bearer only, as sharing is: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT. It answers `404` while member sites are not enabled for the member's company. A portal JWT minted read-only can read.
      operationId: member_site_invitations_sent_index
      tags:
      - site-invitations
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`, valid only for the same site.
          A cursor this list did not issue starts the list again from its first page.
        schema:
          type: string
      responses:
        '200':
          description: A page of the site's pending invitations.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SentSiteInvitationsEnvelope"
              example:
                status: 200
                data:
                - id: '0193a1b2-4c5d-7e6f-8a9b-0c1d2e3f4a5b'
                  state: pending
                  role: view
                  invitee:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d12'
                    name: Casey Brooks
                    email: casey@example.com
                  sent_at: '2026-11-10T22:00:00.000000Z'
                  expires_at: '2026-11-17T22:00:00.000000Z'
                  decided_at:
                  created_at: '2026-11-10T22:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T22:05:00Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
