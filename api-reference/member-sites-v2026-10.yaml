          application/json:
            schema:
              "$ref": "#/components/schemas/SiteUpdate"
            example:
              name: Riley's Fall Shop
              lock_version: 0
      responses:
        '200':
          description: The changed site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  handle: rileys-shop
                  name: Riley's Fall Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id:
                  access:
                    declared: false
                    uses: []
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d68'
                  share_url:
                  url: https://shop.example.com/sites/rileys-shop
