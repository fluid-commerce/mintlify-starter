          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      summary: Share a site
      description: |
        Shares one of the member's sites with an audience: one member, the member's downline, or a segment of the company's members by member type and country. Sharing an audience that is already shared writes nothing and returns the share that exists, with `200` instead of `201`; its permission is not changed, so change it with `PATCH`.

        Sharing is checked against the company's messaging policy when it is made: a member, or an audience, outside the audiences the policy lets the member reach is refused with `403` and its reason. Sharing with oneself, with a member of another company, with an unknown member type or country, or with a target the audience kind does not take is refused with `422`. A request that loses a race with another change to the site's shares, and finds no share for the audience afterwards, is refused with `409`: send it again.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT, or a portal JWT minted read-only.
