  "/api/member/v2026-10/site-pins":
    post:
      summary: Pin a site to the member's menu
      description: |
        Pins a site to the member's own menu, after their other pins. A pin changes nothing for the site's owner, for anyone else it is shared with or for who may open the site by its address. Pinning a site that is already pinned answers `200` with the existing pin, even when the member has reached the limit of 50 pins and even when the member has since lost access to the site or removed it from their menu, so a retry of a request keeps its answer. A pin of a site the member can no longer open stays stored, counts toward the limit and shows in no menu until the site can be opened again.

        A site the member cannot open, a site that is not in their menu and a site that does not exist are the same `404`, so the request cannot be used to discover sites. To make a new pin, a site the member removed from their menu and a member who has 50 pins already are `422`. The member's own drafts can be pinned.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT, or a portal JWT minted read-only.
