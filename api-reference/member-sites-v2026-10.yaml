                  timestamp: '2026-11-05T10:05:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never serves a site's traffic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '422':
          description: A `period` other than `24h`, `7d` or `30d`, or a parameter this operation does not take.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: The traffic counts cannot be read right now (`details.error` is `traffic_unavailable`); try again shortly.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
