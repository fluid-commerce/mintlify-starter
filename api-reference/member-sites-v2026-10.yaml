                  syncing: false
                  sync_failing: false
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/SandboxTwinOrCookieMount"
        '404':
          "$ref": "#/components/responses/NotFound"
