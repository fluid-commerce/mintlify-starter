                  created_at: '2026-11-05T10:00:00.000Z'
                  updated_at: '2026-11-05T10:00:00.000Z'
                status: 200
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:05:00Z'
                  pagination:
                    limit: 25
                    offset: 0
                    count: 1
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The request is on the cookie mount, which never serves a site's data, with or without the `X-Fluid-Member-Site` header; the credential is a member session JWT; or it belongs to a sandbox test company that cannot be reached now.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the member does not own it, the site has no active database or no schema, the schema has no such table, or the sites gateway is not released to the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A `limit` outside 1 to 100, an `offset` outside 0 to 1,000,000, another query key, or a request the sites gateway refused as `validation`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The sites gateway could not complete the call, because it was unreachable or refused, or answered with something unexpected, or Rails has no secret for it. `details.error` names which, and nothing the gateway said is passed on.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '504':
          description: The sites gateway did not answer in time.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/database":
