          description: The valid member credential is read-only (a member or portal JWT) or belongs to a sandbox test company that cannot be reached now, or `content` was sent for a page that uses a template the site does not own, such as a theme's, which is never written here.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: An empty body, a blank title, a malformed, reserved or taken slug, a menu that is not one of the site's, a field a member cannot set, or an unknown field.
