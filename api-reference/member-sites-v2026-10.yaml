                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '402':
          "$ref": "#/components/responses/DatabaseEnablePaymentRequired"
        '403':
          "$ref": "#/components/responses/DatabaseEnableRefused"
        '404':
          "$ref": "#/components/responses/DatabaseNotFound"
        '409':
          "$ref": "#/components/responses/DatabaseEnableConflict"
        '422':
          "$ref": "#/components/responses/DatabaseEnableRefusedInput"
        '502':
          "$ref": "#/components/responses/DatabaseEnableBadGateway"
        '503':
          "$ref": "#/components/responses/DatabaseEnableUnavailable"
    delete:
      summary: Turn off a site's database
      description: |
        Older per-site backend; rollout paused. This operation does not read or manage the static V1 database. For V1, create tables by publishing `db/schema.json` and query them from site code with `fluid.db`. See [The member site database](https://docs.fluid.app/member-sites-v1/database). The older backend contract follows; do not use it for a V1 site's Database tab.

        Turns off the database of one of the member's own sites, whatever state its hosting is in: running, still being created with nothing left to finish it, failed, already being removed, or discarded. The hosting is handed to Fluid's teardown, which removes its hosting resources later, and its billing stops from now. The site's link to it is removed in the same step, so `GET` of this path answers 404 afterwards and the owner may turn the database on again, which creates a new one with a new signing secret. It answers 202 with the state the hosting has once it is released: `pending_destroy` for a hosting that was running, or `archived` or `discarded` for one that was already gone. A site with no database, including one this operation just turned off, a company's own site, another member's site and a missing site are 404. If a step of creating the database holds the hosting, the request waits for it, and answers 409 `database_busy` with nothing changed when the wait is too long. The request takes no body and no query key. A bearer that can write only: the cookie mount answers 403 whether or not the request carries `X-Fluid-Member-Site`, so a page's script cannot remove its own database. Every response is `private, no-store`.
      operationId: member_site_database_destroy
      tags:
      - site-database
      x-fluid-audience: member
