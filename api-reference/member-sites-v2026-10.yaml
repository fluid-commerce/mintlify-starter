              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{id}/restore":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    post:
      summary: Restore a site to a version
      description: |
        Refused. A site's source is its Git repository, which the builder pushes, so Fluid cannot put a site back to a version of its history. To publish an earlier version, check out its commit, build it and publish the bundle, or make an earlier bundle current with [Make an earlier bundle current](https://docs.fluid.app/api-reference/site-bundles/make-an-earlier-bundle-current-roll-back).

        A request for a site of the member's with a well-formed sha answers 409 `not_restorable` and changes nothing. The response is never cached (`Cache-Control: private, no-store`).
