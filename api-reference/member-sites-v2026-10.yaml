                  handle: fall-shop
                  name: Riley's Fall Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  layout_name:
