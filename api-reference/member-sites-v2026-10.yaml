    SiteBranch:
      type: object
      description: |
        The branch of a site: a second site, cloned from the published content of its parent and published at once, so it renders what the parent renders. It is private, owned as the parent is, and has no shares. Only its owner and company admins can open it, in the frame at `frame_path`. Edit and publish it through the files, pages and publish operations, with `site_id` as the site id; the parent never changes. A branch is left out of the site list and the account menu.
      additionalProperties: false
      properties:
        slug:
          type: string
          description: The branch's slug, unique among the branches of its parent. Use it to read and delete the branch.
        site_id:
          type: string
          format: uuid
          description: Public id of the branch's own site. The files, pages, publish and delete operations of a site take it.
        parent_id:
          type: string
          format: uuid
          description: Public id of the site the branch was made from.
        handle:
          type: string
          description: The branch site's handle, proposed from its name, `<parent name> (<slug>)`.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: The branch site's status. A Liquid branch is published when it is made. A V1 branch remains draft until its files and database copy are ready, then is published automatically. It is taken down when its parent is.
        frame_path:
          type: string
          description: The path of the branch's home page in its frame, on the company's host. It renders for the branch's owner and for company admins, and any other signed-in member gets 404.
        shell_path:
          type: string
          description: The path of the branch's home page in the member's site shell.
        url:
          type:
          - string
          - 'null'
          format: uri
          description: The branch site's absolute public address, `https://<storefront>/sites/<branch handle>`. A branch is private, so it opens only for its owner and company admins. Null when the company's storefront serves no member sites.
        parent_changed:
          type: boolean
          description: Whether the parent's published content is no longer what the branch started from. False when the branch is made, true once the parent publishes a change.
        created_at:
          type: string
          format: date-time
          description: When the branch was made.
      required:
      - slug
      - site_id
      - parent_id
      - handle
      - status
      - frame_path
      - shell_path
      - url
      - parent_changed
      - created_at
    SiteBranchCreate:
      type: object
