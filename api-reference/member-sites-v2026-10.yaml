  "/api/member/v2026-10/site-invitations":
    get:
      summary: List the member's site invitations
      description: |
        The member's pending invitations to sites, newest sent first, each with the site, who sent it, the role offered and when it expires. Invitations past their expiry, and ones already answered or withdrawn, are not listed. `meta.total_count` counts every pending invitation, so a count needs only the first page. The list is paged by cursor, 25 to a page; follow `meta.pagination.next_cursor` until it is null to read every invitation. It is not cached (`max-age=0`) and can be revalidated with an ETag.

        A bearer only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header (the Passport reads the list through its own cookie route). A member JWT, which travels in order and subscription email links, is refused with `403` too. It answers `404` while member sites are not enabled for the member's company.
      operationId: member_site_invitations_index
      tags:
      - site-invitations
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`.
          A cursor this list did not issue starts the list again from its first page.
        schema:
          type: string
      responses:
        '200':
          description: A page of the member's pending invitations.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteInvitationsEnvelope"
              example:
                status: 200
                data:
                - id: '0193a1b2-4c5d-7e6f-8a9b-0c1d2e3f4a5b'
                  state: pending
                  role: view
                  site:
                    id: '0192f0aa-1b2c-7d3e-8f4a-5b6c7d8e9f01'
                    handle: riley-shop
                    name: Riley's Shop
                    status: published
                    visibility: private
                    share_url: https://shop.example.com/casey-brooks/sites/riley-shop
                  invited_by:
                    display_name: Riley Park
                    avatar_url: https://cdn.example.com/avatars/riley.png
                  sent_at: '2026-11-10T22:00:00.000000Z'
                  expires_at: '2026-11-17T22:00:00.000000Z'
                  decided_at:
                  created_at: '2026-11-10T22:00:00.000000Z'
                  share_id:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T22:05:00Z'
                  pagination:
                    next_cursor:
                  total_count: 1
        '304':
          description: The representation is unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, it is a member JWT (the credential of email links, which never reads invitations), or the request is on the cookie mount, which never serves invitations.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: Member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A parameter this operation does not take, such as `page[limit]`, because the page size is fixed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/site-invitations/{id}/accept":
    parameters:
    - "$ref": "#/components/parameters/SiteInvitationId"
    post:
      summary: Accept a site invitation
      description: |
        Shares the site with the member: adds a `view` share for them, as the member who sent the invitation, and closes the invitation as `accepted`. Access comes from the share alone. Accepting an accepted invitation writes nothing and returns the same invitation with `200` while its share stands; once the owner has removed the share it answers `422` `revoked`.

        The invitation is checked again when it is accepted. If its sender no longer owns the site, or the company's messaging policy no longer lets them share with the member, it is closed as superseded, no share is written, and the answer is `422` with `error.details.error` `superseded` and the reason in `error.details.reason`: `not_owner`, `outside_messaging_scope` or `site_unavailable` (the share could not be written for the site as it is now). Past `expires_at` it answers `422` `expired`, whether or not it was declined, and after the owner withdrew it `422` `revoked`. Declined before its expiry it answers `409` with `error.details.error` `declined`: undo the decline first, since sending it again answers the same. A change to the invitation or its site at the same moment answers `409` with `error.details.error` `conflict` and nothing written; send the request again.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT, or a portal JWT minted read-only. It answers `404` while member sites are not enabled for the member's company.
      operationId: member_site_invitations_accept
      tags:
      - site-invitations
      x-fluid-audience: member
      responses:
        '200':
          description: The accepted invitation, with the id of its share.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteInvitationEnvelope"
              example:
                status: 200
                data:
                  id: '0193a1b2-4c5d-7e6f-8a9b-0c1d2e3f4a5b'
                  state: accepted
                  role: view
                  site:
                    id: '0192f0aa-1b2c-7d3e-8f4a-5b6c7d8e9f01'
                    handle: riley-shop
                    name: Riley's Shop
                    status: published
                    visibility: private
                    share_url: https://shop.example.com/casey-brooks/sites/riley-shop
                  invited_by:
                    display_name: Riley Park
                    avatar_url: https://cdn.example.com/avatars/riley.png
                  sent_at: '2026-11-10T22:00:00.000000Z'
                  expires_at: '2026-11-17T22:00:00.000000Z'
                  decided_at: '2026-11-10T22:05:00.000000Z'
                  created_at: '2026-11-10T22:00:00.000000Z'
                  share_id: '0193a1b2-9f00-7e6f-8a9b-0c1d2e3f4a5c'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T22:05:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          description: The member has no invitation with this id, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: The invitation's state cannot take this answer (`error.details.error` is `conflict`), or another change to it happened at the same moment and nothing was answered; send the request again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The invitation has expired, was withdrawn or was superseded; `error.details.error` says which, and for `superseded` `error.details.reason` says why.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
