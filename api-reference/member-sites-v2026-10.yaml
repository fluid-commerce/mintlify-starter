      tags:
      - site-removals
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteRemovalCreate"
            example:
              site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
      responses:
        '200':
          description: The site was already removed. The existing removal.
          content:
