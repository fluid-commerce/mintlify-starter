    SiteDatabaseLimits:
      type: object
      description: The bounds of a site's database routes.
      additionalProperties: false
      properties:
        request_body_bytes:
          type: integer
          description: The largest request body accepted, 64 KiB. A larger one is refused with 413.
          example: 65536
        response_body_bytes:
          type: integer
          description: The largest answer read from the site's backend, 256 KiB. A longer one is abandoned and answered with 502.
          example: 262144
        calls_per_minute:
          type: integer
          description: Calls allowed per minute for one company, member and site. More are refused with 429.
          example: 60
        rows_per_page_default:
          type: integer
          description: Rows in a page of a table when `page[limit]` is not sent.
          example: 25
        rows_per_page_max:
          type: integer
          description: The most rows `page[limit]` may ask for.
          example: 100
        rows_per_insert_max:
          type: integer
          description: The most rows one insert may carry.
          example: 100
        rows_returned_by_sql_max:
          type: integer
          description: The most rows a SQL statement returns, with `truncated` true beyond.
          example: 100
        statement_timeout_seconds:
          type: integer
          description: How long any operation may run in the database before it is stopped.
          example: 3
      required:
      - request_body_bytes
      - response_body_bytes
      - calls_per_minute
      - rows_per_page_default
      - rows_per_page_max
      - rows_per_insert_max
      - rows_returned_by_sql_max
      - statement_timeout_seconds
    SiteDatabaseStatus:
      type: object
      description: The state and limits of a site's database. It holds no storage figure, no address, no secret and no vendor id.
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - provisioning
          - live
          - failed
          - pending_destroy
          - archived
          - discarded
          description: The state of the database's hosting. Only `live` answers calls. While it is `provisioning`, check this state again until it is `live`. In `failed`, `pending_destroy`, `archived` or `discarded`, the owner asks for the database again with `POST` on this path, which replaces it.
          example: live
        available:
          type: boolean
          description: Whether the database answers calls now, which is true only for a live hosting that has an address. It is not true for a draft site, whose database routes answer 404 until the site is published.
          example: true
        limits:
          "$ref": "#/components/schemas/SiteDatabaseLimits"
      required:
      - state
      - available
      - limits
    SiteDatabaseStatusEnvelope:
      type: object
      description: The state and limits of a site's database.
