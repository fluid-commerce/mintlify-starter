  "/api/member/v2026-10/sites/{id}/copy":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    post:
      summary: Copy a site
      description: |
        Copies the published content of a site into a new draft site the member owns. The copy holds the site's published layouts, sections and snippets, its published pages, its published settings, its text assets and its menus. It never holds a draft above a published file, a file that was never published, or a page that is not published. A menu item that links to a page that was not copied is left out with the items below it. The copy is always private, is not published, and is not required; it counts toward the 25-site limit. The original is not changed, and the copy shares no rows with it: the content of each is independent, so changing either one never changes the other, and deleting either one never deletes the other. The new site's `copied_from_id` is the original's id; deleting the original sets the copy's `copied_from_id` to null and keeps the copy.

        A member can copy a site they own, and a published site that a share with `copy` permission opens to them; when several shares match, the highest permission counts. A member who can open the site, such as a published public site with no share for them or one shared with them to view, but may not copy it gets 403. A site the member cannot open, such as another member's draft, a draft or taken-down site shared with them, a private site no share matches, a site in another company and an unknown id, returns 404, whatever the body holds. A member who owns a site an admin took down gets 422. The body is optional.
      operationId: member_sites_copy
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteCopy"
            example:
              name: Riley's Fall Shop
              handle: fall-shop
      responses:
        '201':
          description: The new site, a draft owned by the member.
