      x-fluid-audience: member
      responses:
        '204':
          description: The invitation is revoked.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is a member JWT or read-only, or the request is on the cookie mount, which never serves invitations.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the site has no such invitation, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: The invitation was accepted and its share still stands.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/bundles":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List a site's bundles
      description: |
        The bundles of one of the member's sites, newest first, in every state: an upload in progress, a failed one, and each published one, with the one the site serves marked `current`. A bundle is its id, state, times and the SHA-256 of its manifest, never the manifest. Roll back to an earlier published bundle with its `current` route. The list is paged by cursor; follow `meta.pagination.next_cursor` until it is null to read every bundle. It is not cached (`max-age=0`) and can be revalidated with an ETag.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_bundles_index
      tags:
      - site-bundles
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`, valid only for the same site.
          A malformed, tampered or expired cursor returns 400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of the site's bundles.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteBundlesEnvelope"
              example:
                status: 200
                data:
                - id: 0199537f-0000-7000-8000-000000000005
                  state: published
                  current: true
                  createdAt: '2026-11-05T10:00:00.000Z'
                  publishedAt: '2026-11-05T10:02:00.000Z'
                  manifestSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                - id: 0199537f-0000-7000-8000-000000000004
                  state: published
                  current: false
                  createdAt: '2026-11-04T10:00:00.000Z'
                  publishedAt: '2026-11-04T10:02:00.000Z'
                  manifestSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:05:00Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never serves a site's bundles, with or without the `X-Fluid-Member-Site` header. A read-only credential (a member JWT, or a portal JWT minted read-only) can list.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '422':
          description: A `page[limit]` that is not an integer from 1 to 100, or a parameter this operation does not take.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      summary: Start a bundle upload
      description: |
        Starts publishing one of the member's sites as a built static bundle. Rails assigns the bundle id, checks the files against the limits and the content-type allowlist (each route against the files), the access declaration, `schema` and `meta`, records the bundle as uploading for 60 minutes, and asks the sites gateway for signed PUT URLs for the blobs the site does not store yet. Upload each blob to its URL, then publish the bundle. Nothing is served until it is published, and the site's current version keeps serving. A site may have 5 uploads in progress at once, each lasting 60 minutes, so an older upload on another device keeps working; a start finds failed and expired uploads deleted, and a sixth is refused with `409` until one finishes or expires. Published bundles are kept and do not count.

        Bearer only: a request on the cookie mount is refused with `403`, so a site's own code cannot publish. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change. A gateway that cannot prepare the uploads is a `502`; the bundle is then failed, and starting again makes a new one. A `409` also answers a site already at its 5 uploads in progress.
      operationId: member_sites_bundles_create
      tags:
      - site-bundles
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteBundleStart"
            example:
              files:
                "/index.html":
                  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  crc32c: N67uMw==
                  size: 1832
                  contentType: text/html; charset=utf-8
                "/assets/app-3f2a9c.js":
                  sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  crc32c: n03x6A==
                  size: 48211
                  contentType: text/javascript; charset=utf-8
                  immutable: true
      responses:
        '201':
          description: The bundle, and the uploads it still needs.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteBundleStartedEnvelope"
              example:
                status: 201
                data:
                  bundle: 0199537f-0000-7000-8000-000000000004
                  uploads:
                  - sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                    crc32c: n03x6A==
                    url: https://storage.googleapis.com/fluid-production-member-sites/sites/0199537f-0000-7000-8000-000000000001/blobs/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Expires=3600&X-Goog-Signature=5f1e
                    headers:
                      x-goog-content-length-range: 48211,48211
                      x-goog-if-generation-match: '0'
                      x-goog-hash: crc32c=n03x6A==
                  expiresAt: '2026-11-05T11:00:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/BundleRefused"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '409':
          "$ref": "#/components/responses/BundleConflict"
        '422':
          description: The request fails its contract, and nothing was started. `details.error` names the problem and `details.path` the value that has it. `reserved_path` is a path under `/_fluid/`, `invalid_path` a path that is not absolute and normalised, `content_type_not_allowed` and `content_type_mismatch` a file outside the allowlist or with the wrong type, `unknown_file` a route, or the default `/index.html` route of a request with no `routes`, to a file the request lacks, `invalid_shape` or `out_of_range` under `functions` an entry that breaks its contract, `unknown_field`, `unknown_family`, `session_not_declarable` and `repeated_entry` an entry of the `access` declaration that is not a member field or scope the site may declare, names the `session` family, or is listed twice, `inconsistent` two paths of one `sha256` that declare different `crc32c` values, `out_of_range` a limit exceeded (2,000 files, 25 MiB a file, 250 MiB a bundle), and `invalid_shape` or `invalid_format` a field of the wrong kind or form, including a `schema` or `meta` that breaks its contract (`details.path` starts at `schema` or `meta`).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The sites gateway could not prepare the uploads, because it was unreachable, timed out or answered with something unexpected. `details.error` names which. The bundle is failed; start again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/sign-in-handoffs":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    post:
      summary: Get a sign-in handoff for a site
      description: |
        A single-use handoff that signs the member in on their company's storefront, for an app that holds the member's identity access token and opens one of the company's member sites in a browser session of its own, such as Mist's site preview. The app sends a random `continuity` secret it keeps, redeems the handoff once at `redeem_url` (see that field), then opens `site_url`. The handoff expires about a minute after it is made and is never put in a URL. The response is never cached (`Cache-Control: private, no-store`).

        Only for a company that signs in through the identity service, with a person's identity access token (a rep or an admin) for this member; anything else answers `403` `identity_session_required`. Bearer only: the cookie mount is refused with `403`. It answers `404` while member sites or the member storefront are off for the member's company, and for a site the member may not view.
      operationId: member_sites_sign_in_handoff_create
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteSignInHandoffCreate"
            example:
              continuity: 4b3f0d0e8b2a4c5f9e1d7a6b3c2f1e0d9a8b7c6d5e4f3a2b
      responses:
        '201':
          description: The handoff.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteSignInHandoffEnvelope"
              example:
                status: 201
                data:
                  handoff: 9pQe3LkZ2bW7xR4tYc8vN1mH
                  redeem_url: https://shop.example.com/auth/redeem
                  site_url: https://shop.example.com/sites/align-picks
                  expires_at: '2026-11-10T10:01:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The company does not sign in through the identity service, or the bearer is not a person's identity access token with a session (`details.error` is `identity_session_required`); the storefront refuses the member (`unauthorized`), or the token's identity session is past its bound (`expired`); the credential is the shopper JWT that email links carry, or is otherwise read-only; or the request is on the cookie mount, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's company has this id, the member may not view it, or member sites or the member storefront are off for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The body is not a continuity secret of 32 to 128 characters, carries another field, or the handoff could not be saved.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/git-credential":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    post:
      summary: Get a Git credential for a site's source
      description: |
        A short-lived credential for the GitHub repository one of the member's sites keeps its source in, so a builder such as the Fluid CLI can clone, pull and push it with plain git. `remote_url` is an HTTPS remote that carries a token limited to that one repository, with read and write access to its contents; it expires at `expires_at`, about an hour later, so ask again for each command rather than storing it. `repo` is the repository's `owner/name`, and `branch` is the git branch the site's source is on: `main`, or for a branch of a site its slug, on its parent's repository. To publish an earlier version of a site, check out its commit, build it and publish the bundle. The response is never cached (`Cache-Control: private, no-store`).

        A site with no repository yet has one made from the static site template, and the request answers `409` `repo_not_ready` until GitHub has made it; ask again shortly. When the repository could not be made (no GitHub organization has room for it, or GitHub refused to create it), the request answers `503` `repo_unavailable` instead: stop asking and publish again later. Each request asks for the repository again without waiting for GitHub, so a later one succeeds once it can be made. The first bundle upload of a site makes its repository too.

        Bearer only: a request on the cookie mount is refused with `403`, so a site's own code never gets a token for its source. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_git_credential_create
      tags:
      - site-bundles
      x-fluid-audience: member
      responses:
        '200':
          description: The credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteGitCredentialEnvelope"
              example:
                status: 200
                data:
                  remote_url: https://x-access-token:ghs_example@github.com/Fluid-WeCommerce/site-42.git
                  expires_at: '2026-11-10T11:00:00Z'
                  repo: Fluid-WeCommerce/site-42
                  branch: main
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only); the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which never serves a site's credential, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's company has this id, the member may not change it, or the sites gateway is not released to the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: The site's repository is not usable. `details.error` is `repo_not_ready` while it is being made (ask again shortly) or `repo_disconnected` when it was disconnected for good.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The site, or the parent of a branch, was taken down (`details.error` is `site_taken_down`).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: GitHub could not issue the credential (`details.error` is `github_unavailable`). Ask again later.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: The site's repository could not be made (`details.error` is `repo_unavailable`), because no GitHub organization has room for it or GitHub refused to create it. The request asked for it again; publish again later rather than retrying at once.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/bundles/{bundle_id}/publish":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    - "$ref": "#/components/parameters/BundleIdPath"
    post:
      summary: Publish a bundle
      description: |
        Makes an uploaded bundle the site's current version. It runs inside this one request: Rails asks the sites gateway to verify every blob, checks the manifest, has the gateway plan the manifest's database `schema`, asks the gateway to write the manifest, has the gateway apply the schema, and then, in one transaction, gives the site its frame label if it has none, marks the bundle published and points the site at it. A site's `visibility` never changes, so a new site stays private until its owner makes it public. A site with no `schema` skips the schema step. The gateway plans the change from the schema the site's database holds, which its placement records, to the new one (C-L34): a change that drops, renames or retypes a table or column, or makes a column required, applies only when a migration of the schema names it and `confirmMigrations` holds that migration's id. Without the ids the publish is refused with `422` (`destructive_change_unconfirmed`, `details.unconfirmed` lists the ids) and applies nothing; the bundle stays uploading, so the same publish sent again with the ids needs no new upload. The manifest is written before the schema is applied, so a manifest the gateway cannot write changes nothing, and the manifest of a bundle that is not the current one is never served. The schema is applied before the pointer switches, and a failed apply leaves the old bundle current. Once the schema is applied the placement records it, and a later failure of the publish (the site was taken down, say) leaves the bundle uploading: sending the same publish again is planned from that schema, applies nothing more, and goes on, and a publish of a different schema is planned from it too. A schema is at most 1 MiB as UTF-8 JSON, migrations included, and no JSON value in it nests deeper than 1,000 levels (each array or object counts, an empty innermost one included).

        A failed step marks the bundle failed and publishes nothing, and the current version keeps serving; start a new bundle to try again. A step that runs out of time (the whole publish has 27 seconds) is a `504` with `publish_timeout`: the bundle stays uploading, the current version keeps serving, and sending the same publish again is safe and finishes what was started. Sending a publish again after it finished, because its answer was lost, is also safe: a bundle that is published and is the site's current version answers the same `200`, with no gateway call and no change.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, for a site the member may not change, and for a bundle that is not the site's.
      operationId: member_sites_bundles_publish
      tags:
      - site-bundles
      x-fluid-audience: member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteBundlePublish"
            example:
              confirmMigrations:
              - 2026-11-05-drop-notes
      responses:
        '200':
          description: The bundle is the site's current version. A publish repeated after it finished answers the same.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteBundleCurrentEnvelope"
              example:
                status: 200
                data:
                  bundle:
                    id: 0199537f-0000-7000-8000-000000000004
                    manifestSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                  url: https://shop.example.com/sites/rileys-shop
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/BundleRefused"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '409':
          description: The bundle can no longer be published and nothing changed. `details.error` is `superseded` (a newer start deleted it, or another publish of the site changed its database after this one planned its schema change or before it switched; the bundle stays uploading, so send the same publish again and it is planned anew), `schema_change_pending` (another upload's change to the site's database may have run and is not recorded yet; `details.pendingBundle` is that upload's id, and the message says to send it again to finish it, after which this publish can be sent again; nothing was applied and the bundle stays uploading), `copy_in_progress` (the copied bundle's background file transfer or the branch's database copy has not completed; it stays uploading and the same publish may be retried), `not_uploading` (it failed, or is published and no longer the site's current version, as after a rollback), or `frame_label_taken` (another site took the frame label at the same moment; send the publish again).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 409
                error:
                  message: A newer start replaced this upload
                  details:
                    error: superseded
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
        '422':
          description: Nothing was published. `details.error` is `blobs_not_verified` (a blob is missing or differs from the one pinned; `details.problems` lists each with its `path`, `sha256` and `problem`), `functions_not_available` (the bundle has server functions and this Fluid environment does not run functions yet; the bundle stays uploading, so the same publish can be sent again once it does), a contract code for a manifest that fails its checks (as the start names them, with `details.path`), `no_database` (the manifest has a `schema` and the site's database was destroyed; a site with none gets one on its first schema publish), `destructive_change_unconfirmed` (C-L34; a migration that drops, renames or retypes a table or column, or makes a column required, is not in `confirmMigrations`; `details.unconfirmed` lists the ids, and the bundle stays uploading so the publish can be sent again with them confirmed), `validation` (C-L34; the schema is over 1 MiB as compact UTF-8 JSON, with `details.bytes` and `details.limit`, or nests deeper than 1,000 levels, with `details.limit` 1000, and `details.cause` says which; or the gateway cannot plan the change, such as a drop no migration names, and `details.cause` holds its reasons, with the `table` and `column`) or `unique_violation` (rows break a unique set the schema adds), `expired` (the upload expired, unless a publish of this bundle already applied its schema to the site's database, in which case it is published when the publish is sent again), `taken_down` (a company admin took the site down, and a publish never lifts that), or, for the body, `invalid_shape` (a key other than `confirmMigrations`, with `details.path` naming it; or a `confirmMigrations` that is not a list, null included, or holds a non-string) and `out_of_range` (an id of fewer than 1 or more than 100 characters, with `details.path` naming its place). The body is checked before anything else, so a bad body changes nothing. All but `taken_down`, `destructive_change_unconfirmed` and the body errors also mark the bundle failed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The sites gateway could not complete a step, because it was unreachable or refused, or answered with something unexpected. `details.error` names which. The bundle is failed; start again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '504':
          description: "`publish_timeout`. The publish ran out of time. The bundle is still uploading and the current version keeps serving. Send the same publish again."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 504
                error:
                  message: The publish ran out of time; send it again
                  details:
                    error: publish_timeout
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
  "/api/member/v2026-10/sites/{site_id}/bundles/{bundle_id}/current":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    - "$ref": "#/components/parameters/BundleIdPath"
    post:
      summary: Make an earlier bundle current (roll back)
      description: |
        Points the site back at a bundle that was published before, so its files are served again. Nothing is uploaded and the sites gateway is not asked: the bundle's blobs and manifest are stored already. A bundle that was published after the current one can be made current the same way, which rolls forward again. The site's `status`, `visibility` and frame label do not change.

        Making the site's current bundle current again is safe: it answers the same `200`, with no change, so a request whose answer was lost can be sent again. A bundle that is uploading or failed was never published and is refused with `422` (`not_published`). A published bundle that is older than the site's 25 newest published versions and is not its current one is refused with `422` (`not_retained`), because the daily clean-up deletes the files of older versions. A bundle whose manifest has a database `schema` is refused with `422` (`no_database`), because restoring a site's database is not available yet. A site a company admin took down is refused with `422` (`taken_down`): a rollback never lifts a take-down.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, for a site the member may not change, and for a bundle that is not the site's.
      operationId: member_sites_bundles_make_current
      tags:
      - site-bundles
      x-fluid-audience: member
      responses:
        '200':
          description: The bundle is the site's current version. Making the current bundle current again answers the same.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteBundleCurrentEnvelope"
              example:
                status: 200
                data:
                  bundle:
                    id: 0199537f-0000-7000-8000-000000000004
                    manifestSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                  url: https://shop.example.com/sites/rileys-shop
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/BundleRefused"
        '404':
          "$ref": "#/components/responses/BundleNotFound"
        '422':
          description: Nothing changed. `details.error` is `not_published` (the bundle is uploading or failed), `not_retained` (the bundle is older than the site's 25 newest published versions and is not its current one), `no_database` (the manifest has a `schema`, which cannot be restored yet) or `taken_down` (a company admin took the site down).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 422
                error:
                  message: Only a published bundle can be made current
                  details:
                    error: not_published
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-05T10:00:00Z'
  "/api/member/v2026-10/sites/{site_id}/env-vars":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List a site's environment variables
      description: |
        The environment variables of one of the member's sites, by name. The site's server functions receive every one of them in `ctx.secrets`. A secret's `value` is null; its value is never read back. The list is not cached (`max-age=0`) and can be revalidated with an ETag.

        Bearer only: a request on the cookie mount is refused with `403`, so a site's own page code can never read them. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_env_vars_index
      tags:
      - site-env-vars
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The site's variables.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvVarsEnvelope"
              example:
                status: 200
                data:
                - name: SHEET_ID
                  secret: false
                  value: 1AbCdEf
                  created_at: '2026-11-10T09:00:00.000Z'
                  updated_at: '2026-11-10T09:00:00.000Z'
                - name: STRIPE_KEY
                  secret: true
                  value:
                  created_at: '2026-11-10T09:00:00.000Z'
                  updated_at: '2026-11-10T09:00:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T09:05:00Z'
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never serves a site's environment variables, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/member/v2026-10/sites/{site_id}/env-vars/{name}":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    - "$ref": "#/components/parameters/EnvVarName"
    put:
      summary: Set a site's environment variable
      description: |
        Adds the variable the path names to one of the member's sites, or replaces its value and secrecy. Mark API keys and passwords `secret`: the value is stored encrypted and never read back, so the answer's `value` is null. A site holds at most 64 variables, and a value is 1 to 5,120 bytes. When a published version of the site has server functions, the change is passed to them at once.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until the sites gateway is released to the member's company, and for a site the member may not change.
      operationId: member_sites_env_vars_update
      tags:
      - site-env-vars
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteEnvVarWrite"
            example:
              value: sk_live_51H
              secret: true
      responses:
        '200':
          description: The variable was replaced.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvVarEnvelope"
              example:
                status: 200
                data:
                  name: STRIPE_KEY
                  secret: true
                  value:
                  created_at: '2026-11-10T09:00:00.000Z'
                  updated_at: '2026-11-10T09:10:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T09:10:00Z'
        '201':
          description: The variable was added.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvVarEnvelope"
              example:
                status: 201
                data:
                  name: STRIPE_KEY
                  secret: true
                  value:
                  created_at: '2026-11-10T09:00:00.000Z'
                  updated_at: '2026-11-10T09:00:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T09:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: The site already holds 64 variables (`details.error` is `env_var_limit`), the variable changed while it was being set, or another change of the site's variables is still reaching its functions (`details.error` is `busy`). Remove a variable, or retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The name breaks the pattern, the value is empty or longer than 5,120 bytes, `secret` is not a boolean, or the body holds another field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The variable was saved, but the sites gateway could not pass the change to the site's deployed functions. `details.error` names the gateway's failure. Send the same request again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      summary: Remove a site's environment variable
      description: Removes the variable the path names from one of the member's sites. When a published version of the site has server functions, they stop receiving it at once. Bearer only.
      operationId: member_sites_env_vars_destroy
      tags:
      - site-env-vars
      x-fluid-audience: member
      responses:
        '204':
          description: The variable was removed.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          description: The site, or the variable, is not found, or the member may not change the site.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: Another change of the site's variables is still reaching its functions (`details.error` is `busy`). Retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The variable was removed, but the sites gateway could not pass the change to the site's deployed functions. `details.error` names the gateway's failure. Send the same request again, which passes the removal again and then answers 404.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/updates":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List the updates posted on a site
      description: |
        The newest 50 updates posted on one of the member's sites, newest first, each with who posted it and how many members it reached. Not paged.

        Bearer only: a request on the cookie mount is refused with `403`. It answers `404` until member sites are enabled for the member's company, and for a site the member does not own.
      operationId: member_sites_updates_index
      tags:
      - site-updates
      x-fluid-audience: member
      responses:
        '200':
          description: The site's updates.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SentSiteUpdatesEnvelope"
              example:
                status: 200
                data:
                - id: '0192f4e5-9c01-7b8c-9d0e-1f2a3b4c5d90'
                  site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  text: New bundles are in the shop
                  push: false
                  created_at: '2026-11-10T09:00:00.000Z'
                  by: Riley Park
                  by_avatar_url:
                  reached: 38
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T09:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is a shopper's email-link credential, or belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never lists a site's updates.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the site belongs to the company or to another member, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      summary: Post an update on a site
      description: |
        Posts a short line on one of the member's sites. Every member whose menu lists the site gets it on their bell, and the poster's `push` flag is kept with it. The line is trimmed, then must be 1 to 240 characters. With `push`, each member it reaches also gets a push. A site takes at most 10 updates an hour.

        Bearer only: a request on the cookie mount is refused with `403`, so a site's own page code can never post to the members who read it. It answers `404` until member sites are enabled for the member's company, and for a site the member does not own.
      operationId: member_sites_updates_create
      tags:
      - site-updates
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SitePostedUpdateWrite"
            example:
              text: New bundles are in the shop
              push: false
      responses:
        '201':
          description: The update was posted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SitePostedUpdateEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-9c01-7b8c-9d0e-1f2a3b4c5d90'
                  site_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  text: New bundles are in the shop
                  push: false
                  created_at: '2026-11-10T09:00:00.000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-11-10T09:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is read-only or a shopper's email-link credential, or belongs to a sandbox test company that cannot be reached now, or the request is on the cookie mount, which never posts an update, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the site belongs to the company or to another member, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: >-
            This request posted nothing. Either the line is the same, once trimmed, as the site's latest update from the last 10 minutes, whoever posted it: `error.details.reason` is `["duplicate_update"]` and `error.details.site_update_id` names that update, which may be this poster's own earlier request whose answer was lost. If that update has reached no one yet, its delivery is queued again. Or another update on the site was being posted and held it for more than 5 seconds; try again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: >-
            The `text` is missing, blank, or longer than 240 characters once trimmed, `push` is not a boolean, or the body holds another field. Also 422 when nobody but the poster could get the update because of the site's own state (a draft, a suspended, locked or turned-off site, or a site with no share and no other owner to tell): `error.details.reason` is `["site_not_visible"]` and the message is "Nobody else can see this site yet. Publish or share it first." A site others can see whose shares happen to match no one is still posted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: >-
            The site has had 10 updates in the last hour, counted per site whoever posted them, and nothing was posted: `error.details.reason` is `["too_many_updates"]`, and `error.details.retry_after_seconds` and the `Retry-After` header give the seconds until the oldest of them is an hour old.
          headers:
            Retry-After:
              description: The seconds until the site takes another update.
              schema:
                type: string
                example: '1800'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
