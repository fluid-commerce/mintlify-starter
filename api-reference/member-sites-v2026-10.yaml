          - 24h
          - 7d
          - 30d
          default: 24h
      responses:
        '200':
          description: The site's traffic.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteTrafficEnvelope"
              example:
                status: 200
                data:
                  period: 7d
