        The home page of the member's own site, rendered from the draft copy of the site's files and settings, with every page of the site listed in its navigation whether it is published or not. It is the one renderer that serves the site's published pages, so the preview shows what the site will serve once published; a layout, section, snippet or setting that was never published renders its draft, and the response never falls back to the published page. The site may be a draft or published.

