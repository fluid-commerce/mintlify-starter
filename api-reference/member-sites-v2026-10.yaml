  "/api/member/v2026-10/sites/{id}/copy":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    post:
      summary: Copy a site
      description: |
        For a gateway-served V1 source with a current bundle, creates an independent prepared bundle in a new draft site the member owns. The bundle holds that snapshot's files, routes, access declaration, page metadata and database schema. Blob transfer is asynchronous and does not hold the request open. The copy remains a private draft. List its bundles and publish the prepared bundle explicitly after transfer completes; an early publish answers 409 `copy_in_progress` and keeps the bundle uploading. The source's database rows are never copied. When the copied bundle declares a database schema, the first publish creates an empty database from it. The prepared draft is retained until the copy's first bundle becomes current. A terminal transfer failure leaves the bundle failed and the site unserved; a temporary gateway failure is retried in the background. Once transferred, the copy is independent of the source, including source deletion.

        The copy is always private, is not published, and is not required; it counts toward the 25-site limit. The original is not changed, and the copy shares no rows with it: the content of each is independent, so changing either one never changes the other, and deleting either one never deletes the other. The new site's `copied_from_id` is the original's id; deleting the original sets the copy's `copied_from_id` to null and keeps the copy.

        A member can copy a site they own, and a published site that a share with `copy` permission opens to them; when several shares match, the highest permission counts. A member who can open the site, such as a published public site with no share for them or one shared with them to view, but may not copy it gets 403. A site the member cannot open, such as another member's draft, a draft or taken-down site shared with them, a private site no share matches, a site in another company and an unknown id, returns 404, whatever the body holds. A member who owns a site an admin took down gets 422. The body is optional.

        **Older Liquid compatibility.** For an older Liquid site, copies only the published layouts, sections, snippets, pages, settings, text assets and menus. Its published access declaration becomes a draft of the copy and is not published until the copy is. Draft revisions, never-published files and unpublished pages are excluded. A menu item linking to a page that was not copied is omitted with its descendants.

      operationId: member_sites_copy
      tags:
      - sites
      x-fluid-audience: member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteCopy"
            example:
              name: Riley's Fall Shop
              handle: fall-shop
      responses:
        '201':
          description: The new site, a draft owned by the member.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e01'
                  handle: fall-shop
                  name: Riley's Fall Shop
                  visibility: private
                  status: draft
                  owner_kind: member
                  copied_from_id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  access:
                    declared: false
                    uses: []
                  layout_name:
                  settings:
                    primary_color: "#112233"
                  content_version: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e02'
                  share_url:
                  url: https://shop.example.com/sites/fall-shop
                  company_lock: none
                  taken_down_reason: null
                  lock_version: 0
                  created_at: '2026-09-02T10:00:00.000000Z'
                  updated_at: '2026-09-02T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only), it belongs to a sandbox test company that cannot be reached now, or the member may open the site but may not copy it.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: The member already owns 25 sites, the site was taken down, the site holds a file that cannot be copied (such as a binary asset), the site holds more pages than a site may, a name or handle is malformed, reserved or taken, or the body holds an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{id}/versions":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    get:
      summary: List a site's versions
      description: |
        Older Liquid Git history only, not V1 bundle history. For the published versions of a static V1 site, use [List a site's bundles](https://docs.fluid.app/api-reference/site-bundles/list-a-sites-bundles). A V1 bundle publish does not create a Git-history version for this operation.

        The versions of one of the member's sites, newest first. A site whose source is in its repository lists the commits pushed to it; an older site lists each publish that was saved to its history. Listing changes nothing. A site that was never published has no history yet and answers 409. The response is never cached (`Cache-Control: private, no-store`).
