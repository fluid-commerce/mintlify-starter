          maxLength: 60000
          description: Exactly one statement of a schema form, such as `CREATE TABLE`, `CREATE INDEX`, `ALTER TABLE` with one action, `DROP TABLE`, `DROP INDEX` or `COMMENT ON`. Rails does not read it. The site's backend refuses, with 422, any statement that could read or copy rows (`SELECT`, `INSERT`, `UPDATE`, `DELETE`, `CREATE TABLE ... AS`, `COPY`, `WITH`, `USING` and the rest), a second command, a comment, dollar quoting, and a view, function, trigger, extension, role, schema or sequence. It checks for these words anywhere in the text, so a default or comment that holds one is refused too.
