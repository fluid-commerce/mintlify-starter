      tags:
      - site-shares
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteShareCreate"
            example:
              audience_kind: member
              member_id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d11'
              permission: view
      responses:
        '200':
          description: The audience was already shared, so this is the share that exists, unchanged.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteShareEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-8a01-7b8c-9d0e-1f2a3b4c5d01'
                  audience_kind: member
                  member:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d11'
                    name: Nathan Cho
                  member_type:
                  country:
                  label: Nathan Cho
                  permission: view
                  created_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '201':
          description: The new share.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteShareEnvelope"
              example:
                status: 201
                data:
                  id: '0192f4e5-8a01-7b8c-9d0e-1f2a3b4c5d04'
                  audience_kind: segment
                  member:
                  member_type:
                    id: '0192f4e5-2b01-7b8c-9d0e-1f2a3b4c5d21'
                    name: Customer
                  country:
                  label: Customer
                  permission: view
                  created_at: '2026-09-30T15:08:21.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only, and a member JWT is refused on every verb) or belongs to a sandbox test company that cannot be reached now; the request is on the cookie mount, which never serves sharing; or the company's messaging policy does not let the member share with this audience. A policy refusal names its reason in `error.details.error` as `outside_messaging_scope`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 403
                error:
                  message: Your company's messaging policy does not let you share with this audience
                  details:
                    error: outside_messaging_scope
                    audience_kind:
                    - member
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '404':
          description: No site of the member's has this id, the site has no such share, or member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: Another request changed the site's shares at the same moment and the share could not be written; no share exists for the audience. Send the request again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 409
                error:
                  message: The site is being changed, try again
                  details: {}
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '422':
          description: A missing or unknown audience kind or permission, a target the audience kind does not take or lacks, a member, member type or country the company does not hold, a share with oneself, or an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
