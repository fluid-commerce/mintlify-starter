        Only the site's owner is served, the same policy as the database export, which downloads these same rows. Bearer only: a request on the cookie mount is refused with `403`, tagged with `X-Fluid-Member-Site` or not, and so is a member session JWT. It answers `404` until the sites gateway is released to the member's company, for a site the member does not own, for a site of another company, for a site with no active database or no published schema, and for a table the schema does not have.
