        Creates the database of one of the member's own sites, on the company's hosting account and credits, and answers 202 with the state `GET` of this path renders: `provisioning` until the first deploy finishes, then `live`. The operation routes answer 409 `database_unavailable` until it is `live`. A site whose database cannot serve (its hosting failed, was removed or deleted) gets a new one, and the answer is the same 202. A site whose database is `provisioning` or `live` is 409. A company holds at most 20 databases, a company's own site, another member's site and a missing site are 404, and a branch and a taken-down site are 422. The request takes no body and no query key. A bearer that can write only: the cookie mount answers 403 whether or not the request carries `X-Fluid-Member-Site`, so a page's script cannot spend the company's credits. The response never holds the signing secret, the database's address or a vendor id. Every response is `private, no-store`.
