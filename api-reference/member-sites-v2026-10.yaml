  "/api/member/v2026-10/site-share-targets":
    get:
      summary: Search the share targets
      description: |
        Whom the member may share a site with: the members matching `q`, the member types and countries a segment may name, how many members are below them, and which audiences their company's messaging policy allows. A member the caller could not message is never listed, and under `no_direct_messages` nothing is. The search is not paged; it returns at most 20 members. It is not cached (`max-age=0`) and can be revalidated with an ETag. A credential may make 30 requests a minute to this route and to the messaging recipient search together; more are refused with `429`.

        Bearer only. A request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header. A member session JWT, the kind order and subscription email links carry, is also refused with `403`: the results are other members' names and emails.
      operationId: member_site_share_targets_index
      tags:
      - site-share-targets
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/ShareTargetQuery"
      - "$ref": "#/components/parameters/IfNoneMatch"
      responses:
        '200':
          description: The share targets.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteShareTargetsEnvelope"
              example:
                status: 200
                data:
                  members:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e01'
                    name: Nathan Rivera
                    email: nathan@example.com
                  member_types:
                  - id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5e11'
                    name: Preferred Customer
                  countries:
                  - code: CA
                    name: Canada
                  - code: US
                    name: United States
                  downline_count: 42
                  downline_count_capped: false
                  allowed:
                  - member
                  - downline
                  - segment
                  emails_visible: true
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The targets are unchanged; authentication is checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The credential is a member session JWT, the kind order and subscription email links carry, which cannot search the share targets; the credential belongs to a sandbox test company that cannot be reached now; or the request is on the cookie mount, which this operation never serves, with or without the `X-Fluid-Member-Site` header.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: Member sites are not enabled for the member's company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A `q` that is not blank and has fewer than 3 or more than 200 characters, or an unknown parameter such as `page` or `limit`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '429':
          description: >-
            The credential made more than 30 searches in a minute, counting the messaging recipient search too.
            Wait `retry_after` seconds before searching again. Unlike other responses it carries no Cache-Control header.
          headers:
            X-RateLimit-Limit:
              "$ref": "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimitRemaining"
            X-RateLimit-Reset:
              "$ref": "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RateLimitError"
              example:
                error: Rate limit exceeded
                message: Too many requests. Please wait before trying again.
                retry_after: 42
  "/api/member/v2026-10/sites/{site_id}/database-export":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: Download a site's database
      description: |
        Static V1 database export. Unlike the older backend operations in this group, this downloads the database declared by a published V1 bundle. It does not use the older backend's on/off, raw SQL or row routes.

        Downloads every table and row of one of the member's sites' databases as a file, from the sites gateway, which reads the database as the request is served. The answer is NDJSON, the contract's `DumpV1`: a first line with the format, its version and the schema (`{"format":"fluid-site-db","version":1,"schema":{...}}`), then one line for each row (`{"table":"notes","row":{...}}`). The same bytes import into any driver. It is sent as it is read, so it begins at once and no copy is held, however large the database is; the `Content-Disposition` header names the file `site-database-<site id>.ndjson`. It is not cached.

        A failure before the first byte is a normal error answer (`502`, or `504` when the gateway did not begin in time). A failure after it cannot change the status, which is already `200`, so the dump ends with one more line, `{"error":"export_interrupted"}`, which is neither a header nor a row and has no newline after it. A dump is whole only when the response ends cleanly and every line, the last included, is a header or a row and ends with a newline. A connection that is cut gives an HTTP error (a missing final chunk) or a last line without its newline. Download again.

        Bearer only: a request on the cookie mount is refused with `403`, tagged with `X-Fluid-Member-Site` or not, because a dump is every row, and a site's own code would hold it. A member session JWT, the kind order and subscription email links carry, is refused with `403`. It answers `404` until the sites gateway is released to the member's company, for a site the member does not own, and for a site with no active database.
      operationId: member_sites_database_export_show
      tags:
      - site-database
      x-fluid-audience: member
      responses:
        '200':
          description: The database as a `DumpV1` file, streamed.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name `site-database-<site id>.ndjson`.'
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 'NDJSON. The first line is the header, `format`, `version` and `schema`; each other line is a row, `table` and `row`. A last line `{"error":"export_interrupted"}` with no newline after it means the dump failed after it began and is not whole.'
              example: |
                {"format":"fluid-site-db","version":1,"schema":{"tables":{}}}
                {"table":"notes","row":{"id":"1","body":"first"}}
                {"table":"notes","row":{"id":"2","body":"second"}}
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          description: The request is on the cookie mount, which never serves a database export, with or without the `X-Fluid-Member-Site` header; the credential is a member session JWT; or it belongs to a sandbox test company that cannot be reached now.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No site of the member's has this id, the member does not own it, the site has no active database, or the sites gateway is not released to the member's company. One answer for each, so it never says whether a site exists.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '502':
          description: The sites gateway could not begin the export, because it was unreachable, refused the call or answered with something unexpected, or Rails has no secret for it. `details.error` names which, and nothing the gateway said is passed on. Nothing was sent; ask again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '504':
          description: The sites gateway did not begin to answer within 25 seconds. Nothing was sent; ask again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/data":
    parameters:
