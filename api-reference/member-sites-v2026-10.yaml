        A site the member cannot open, a site that is not in their menu and a site that does not exist are the same `404`, so the request cannot be used to discover sites. A site the member removed from their menu, a site that is not published and, while the sites gateway is on for the company, a published site it does not serve are `422`.

        A bearer with write access only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header, and so is a member JWT, or a portal JWT minted read-only.
