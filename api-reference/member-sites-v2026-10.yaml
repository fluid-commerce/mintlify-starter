      type: object
      description: What a statement did.
      additionalProperties: false
      properties:
        command:
          type: string
          description: The command tag, such as `CREATE TABLE`.
        row_count:
          type: integer
          description: The number of rows the statement touched.
        rows:
          type: array
          description: At most 100 rows the statement returned.
          items:
            type: object
            additionalProperties: true
        truncated:
          type: boolean
          description: Whether more rows were returned than `rows` holds.
      required:
      - command
      - row_count
      - rows
      - truncated
    SiteDatabaseSqlResultEnvelope:
      type: object
      description: What a statement did.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          "$ref": "#/components/schemas/SiteDatabaseSqlResult"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SiteDatabaseRow:
      type: object
      description: One row, an object of column name to value. A value is a string, number, boolean, null, object or array, as the column's type reads.
      additionalProperties: true
    SiteDatabaseRowsEnvelope:
      type: object
      description: One page of a table's rows.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        data:
          type: array
          description: The rows of the page. A page ends at `page[limit]` rows, or before 192 KiB of rows, whichever comes first.
          items:
            "$ref": "#/components/schemas/SiteDatabaseRow"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
