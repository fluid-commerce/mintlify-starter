        A bearer only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header. A member JWT, which travels in order and subscription email links, is refused with `403` too, so a forwarded email never lists who asked to see a site. A portal JWT can read. It answers `404` until access requests are enabled for the member's company.
