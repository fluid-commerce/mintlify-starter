  "/api/member/v2026-10/sites/{id}/publish":
    parameters:
    - "$ref": "#/components/parameters/SiteId"
    post:
      summary: Publish a site
      description: |
        Older Liquid publishing only. This operation publishes the site's Liquid authoring tree; it does not upload or switch a static V1 bundle. For V1, use [Start a bundle upload](https://docs.fluid.app/api-reference/site-bundles/start-a-bundle-upload), upload the returned blobs, then [Publish a bundle](https://docs.fluid.app/api-reference/site-bundles/publish-a-bundle).

        Marks the site published and replaces its `content_version`. Publishing a site that is already published publishes its current content again. It publishes the draft access declaration (`config/access.json`) together with the settings; a site with no draft declaration publishes none, which removes the one it had published. The request has no body.
      operationId: member_sites_publish
      tags:
