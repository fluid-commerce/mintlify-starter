    put:
      summary: Write a site file
      description: Creates the file, or replaces its content. Send the `version` of the file you read to refuse the write with 409 if the file changed or was removed since, or `must_not_exist` to create a file only if the path is free; without either the write replaces whatever is there, so the last write wins, except that a write of `config/menus.json` without `version` is refused with 409 while the site's menus hold a translated item title. The check and the write are one step, so a write that loses a race changes nothing. A page's file must already exist; add the page first. Writing `config/menus.json` replaces all of the site's menus, writing `config/pages.json` adds, changes and removes pages to match it and sets the site's default layout (a page added this way starts with an empty file), writing `config/settings.json` replaces its settings, and writing `config/access.json` replaces the site's draft access declaration, the list of the member fields and scopes the site uses. The declaration is a draft until the site is published, and publishing the site publishes it together with the settings. A published declaration grants no access yet. Layouts, sections, snippets and pages are saved as drafts until the site is published. Assets must be css, js, json, txt or html text files.
      operationId: member_site_files_update
      tags:
      - site-files
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SiteFileWrite"
            example:
              content: '{{ content_for_layout }}'
      responses:
        '200':
          description: The saved file, whether it was created or replaced.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SiteFileEnvelope"
              example:
                status: 200
                data:
                  path: layouts/site.liquid
                  content: '{{ content_for_layout }}'
                  lock_version:
                  version: 4c4127c0f28a648e32ccb71b3b6d1c7cf4c8c8cf8d4459c25a14dfab782049de
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: A missing or invalid body, `version` sent with `must_not_exist` or `lock_version`, a path that is none of the supported ones, an asset that is not a text file or is empty, settings that are not a JSON object, menus that are not a valid document, a template that is invalid, or a layout, section, snippet or page whose Liquid uses a tag or filter a member site cannot use; the message names each one with its line.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      summary: Remove a site file
      description: Removes a layout, section, snippet or asset. Send the `version` of the file you read to refuse the removal with 409 if the file changed since; without it the file is removed as it is. A file that does not exist is 404 whatever the version. A page is removed with the pages API, and the settings and menus cannot be removed (write an empty menus document to clear the menus). Removing `config/access.json` clears the draft access declaration, and the site then has no such file until one is written. The published declaration stays as it was until the site is published.
      operationId: member_site_files_destroy
      tags:
      - site-files
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/FileVersionQuery"
      responses:
        '204':
          description: The file was removed.
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/ReadOnlyCredential"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          description: The path is none of the supported ones, or is a page, the settings, the menus or the page settings, which cannot be removed here, or the query holds a parameter this operation does not take.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/sites/{site_id}/shares":
    parameters:
    - "$ref": "#/components/parameters/SiteIdPath"
    get:
      summary: List a site's shares
      description: |
        The audiences one of the member's sites is shared with, oldest first, each with its permission and a label that names it. A share names a member by id and name, never by email address. The list is paged by cursor; follow `meta.pagination.next_cursor` until it is null to read every share. It is not cached (`max-age=0`) and can be revalidated with an ETag.

        A bearer only: a request on the cookie mount is refused with `403`, with or without an `X-Fluid-Member-Site` header. A member JWT, which travels in order and subscription email links, is refused with `403` too, so a forwarded email never lists who a site is shared with. A portal JWT can read.
      operationId: member_site_shares_index
      tags:
      - site-shares
      x-fluid-audience: member
      parameters:
      - "$ref": "#/components/parameters/IfNoneMatch"
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`, valid only for the same site.
          A malformed, tampered or expired cursor returns 400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of the site's shares.
          headers:
