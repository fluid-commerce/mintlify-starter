    SiteMenuEntry:
      type: object
      description: One site in the member's account menu.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public id of the site.
        handle:
          type: string
          description: The site's URL segment.
        name:
          type: string
          description: Display name.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: Whether the site is a draft or published. Only the member's own sites can be drafts. While the sites gateway is on for the company, a published site it cannot serve yet, with no frame label or current bundle, is a draft.
        company_lock:
          type: string
          enum:
          - none
          - made_private
          - taken_down
          description: Whether a company admin has locked or taken down the site. Only the member's own sites can be `made_private` here; another member's locked site leaves the menu. A locked site does not open for the member, so the menu should show it as locked rather than link to it.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may open the site once it is published.
        owner_kind:
          type: string
          enum:
          - company
          - member
          description: Who owns the site.
        owner_name:
          type:
          - string
          - 'null'
          description: The name to show for the owner. The company's name for a company site, otherwise the owning member's name. It is null for a member who has no name.
        removable:
          type: boolean
          description: Whether the member may remove the site from their menu. A required company site and the member's own site cannot be removed.
        removal_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the member's removal of the site, to restore it with `DELETE /site-removals/{id}`. Null unless the site is in `removed_sites`.
        pinned:
          type: boolean
          description: Whether the member pinned this listed site. Always false in removed_sites.
        pinned_for_everyone:
          type: boolean
          description: Whether the company featured this listed site. Always false in removed_sites; featuring never grants access.
        role:
          type: string
          enum:
          - view
          - edit
          description: What the member may do with the site. `edit` for a site they may edit, today their own sites; `view` for every other, including a site shared with them, until shares can grant editing.
        access:
          "$ref": "#/components/schemas/SiteAccess"
        share_url:
          type:
          - string
          - 'null'
          format: uri
          description: The link to share the site, on the company's storefront, with the caller's username as its credit so a visit through it credits them, for example `https://shop.example.com/riley-kim/sites/riley-shop`. A caller whose username cannot be a storefront credit gets the `https://<storefront>/home/sites/<handle>` link, whose `home` credit credits the site's owner. Null while the company is not on the sites gateway, and for a site the gateway cannot serve yet, such as a draft, a taken-down site, or one not yet published under the gateway; show a share button only when it is set, and build no link of your own.
      required:
      - pinned
      - pinned_for_everyone
      - role
      - id
      - handle
      - name
      - status
      - company_lock
      - visibility
      - owner_kind
      - owner_name
      - removable
      - removal_id
      - access
      - share_url
    SiteMenu:
      type: object
      description: The member's account menu, read when the request was made.
      additionalProperties: false
      properties:
        company_sites:
          type: array
          description: Published company sites the member is shared, in the company's order. A required site is always here, whatever the member removed. While the sites gateway is on for the company, only sites it serves are listed.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        own_sites:
          type: array
          description: The member's own sites, drafts included, oldest first. A site an admin took down is not listed.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        shared_sites:
          type: array
          description: Published sites other members own that are shared with the member and that they have not removed. The newest 100 plus any older pinned, featured or home sites, oldest first; `shared_sites_omitted` counts only those left out. Branches are never listed.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        removed_sites:
          type: array
          description: Sites the member removed from their menu that are still shared with them, oldest first. Each carries its `removal_id`.
          items:
            "$ref": "#/components/schemas/SiteMenuEntry"
        landing_site_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Id of the site `/sites` opens, which is also the id of one of the entries above. The home when home_site_id is set, else the first company site the member has not removed, else the first company site, else their newest own site. The shell checks which candidate it can serve. Null when there is none.
        pin_order:
          type: array
          description: Public ids of listed pins in the member's order, by stored position then pin id. Excludes removed or inaccessible sites.
          uniqueItems: true
          items:
            type: string
            format: uuid
        company_pin_order:
          type: array
          description: Public ids of listed featured sites in the company's order, by stored position then feature id. Excludes removed or inaccessible sites.
          uniqueItems: true
          items:
            type: string
            format: uuid
        home_site_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Public id of the member's chosen home when listed and published (served by the sites gateway while that is on). Otherwise null; the stored choice is retained.
        shared_sites_omitted:
          type: integer
          minimum: 0
          description: How many shared sites are not listed in `shared_sites` because of its limit.
        unread_updates:
          type: object
          description: The member's unread site updates on each listed site (company, own and shared, not removed), keyed by the site's public id, for the red count on the site. A site with none is absent. Opening the site clears its count (`POST /notifications/sites/{site_id}/read`).
          additionalProperties:
            type: integer
            minimum: 1
          example:
            '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d01': 2
      required:
      - company_sites
      - own_sites
      - shared_sites
      - removed_sites
      - landing_site_id
      - shared_sites_omitted
      - pin_order
      - company_pin_order
      - home_site_id
      - unread_updates
