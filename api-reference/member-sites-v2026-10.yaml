                  audience_kind: member
                  member:
                    id: '0192f4e5-1a01-7b8c-9d0e-1f2a3b4c5d11'
                    name: Nathan Cho
                  member_type:
                  country:
                  label: Nathan Cho
                  permission: view
                  created_at: '2026-09-01T10:00:00.000000Z'
                - id: '0192f4e5-8a01-7b8c-9d0e-1f2a3b4c5d02'
                  audience_kind: downline
                  member:
                  member_type:
                  country:
                  label: Downline of Riley Kim
                  permission: copy
                  created_at: '2026-09-01T10:05:00.000000Z'
                - id: '0192f4e5-8a01-7b8c-9d0e-1f2a3b4c5d03'
                  audience_kind: segment
                  member:
                  member_type:
                    id: '0192f4e5-2b01-7b8c-9d0e-1f2a3b4c5d21'
