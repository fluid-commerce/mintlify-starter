      additionalProperties: false
      properties:
        continuity:
          type: string
          minLength: 32
          maxLength: 128
          description: A random secret the app generates for this handoff and keeps. Only its digest is stored; the app sends it again in the redeem's body. Treat it as a secret.
      required:
