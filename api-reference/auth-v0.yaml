  /api/authentication/resend_mfa:
    post:
      summary: Resend MFA code via email
      description: Destroy the previous MFA record and create a new one, sending a fresh verification code. Resending is idempotent; a retry of a uuid that a resend already replaced answers with that replacement (same uuid and expiry) at any time within the code lifetime, sends nothing, and is not held by the 30-second wait. A record whose code was already redeemed is resent like a live one. Any other unknown uuid, or a record issued more than 90 minutes ago, is answered with a new uuid in the same shape as a live record, and nothing is sent; a client whose code never arrives should start again from the address. Otherwise the 30-second wait between sends applies to every uuid issued by a send or resend endpoint, saved or not.
      tags:
        - authentication
      operationId: auth_v0_resend_mfa
      parameters:
        - name: uuid
          in: query
          required: true
          description: Current MFA uuid
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaCreatedResponse'
        '422':
          description: The request is malformed, the previous code was sent less than 30 seconds ago, the code could not be resent, or the challenge belongs to a checkout cart and "cannot be resent from this endpoint" (resend it through the cart magic-link endpoint).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/authentication/send_mfa:
    post:
      summary: Send MFA passcode
      description: Send a multi-factor authentication passcode via email. Returns a generic success response even for unknown emails to prevent email enumeration. A person whose company signs in through the identity service is emailed a link that starts that sign-in instead of a passcode; the response is the same.
      tags:
        - authentication
      operationId: auth_v0_send_mfa
      parameters:
        - name: email
          in: query
          required: true
          description: Email address of the user
          schema:
            type: string
            format: email
        - name: fluid_shop
          in: query
          required: false
          description: 'Shop name, eg: company.fluid.app'
          schema:
            type: string
        - name: redirect_url
          in: query
          required: false
          description: The page the sign-in started from. When the person is emailed an identity sign-in link instead of a passcode, the link returns them there, provided its origin is one of the platform's app callbacks; any other value is ignored.
          schema:
            type: string
        - name: identity_hint_supported
          in: query
          required: false
          description: Set to `true` by a client that hands an identity-routed person to the identity service itself. Only then can the answer carry `sign_in_path` and no link be emailed.
          schema:
            type: string
            enum:
              - 'true'
        - name: shopper_hand_back_supported
          in: query
          required: false
          description: Set to `true` by a client that hands a shopper of an identity-routed company to that company's checkout itself. Needs `fluid_shop` naming the company and its identity email step on.
          schema:
            type: string
            enum:
              - 'true'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaCreatedResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
