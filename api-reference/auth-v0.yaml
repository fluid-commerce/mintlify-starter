          required: false
          description: Set to `true` by a client that hands an identity-routed person to the identity service itself. Only then can the answer carry `sign_in_path` and no link be emailed.
          schema:
            type: string
            enum:
              - 'true'
        - name: shopper_hand_back_supported
          in: query
          required: false
          description: Set to `true` by a client that hands a shopper of an identity-routed company to that company's checkout itself. Needs `fluid_shop` naming the company and its identity email step on.
          schema:
            type: string
            enum:
              - 'true'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaCreatedResponse'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/social_auth/apple:
    get:
      operationId: auth_v0_social_auth_apple
      summary: Redirect to Apple OAuth
      description: |-
        Generate an Apple OAuth URL for redirect-based authentication.

        `fluid_shop` must be supplied in practice — this operation returns `422`
        without it — even though it is declared as an optional parameter, because
        the requirement is enforced by the action rather than by parameter
        validation. Treat it as mandatory when calling.

        It is placed in the OAuth `state` (alongside a server-issued nonce, cached
        for replay rejection) so the callback can resolve the company. Apple returns
        to a bare redirect URI, so without it the shop is lost and white-label
        customers are locked out.

        The response mode is fixed server-side to `form_post` (Apple POSTs
        directly to the callback rather than redirecting), so it is not a request
        parameter.
      tags:
        - social-auth
      parameters:
        - name: fluid_shop
          in: query
          required: false
          description: Company subdomain the sign-in belongs to, carried through the OAuth round-trip in `state`. Omitting it returns `422` — Apple sign-in cannot resolve a company without it.
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthUrl'
        '422':
          description: fluid_shop was omitted or blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/social_auth/callback:
    post:
      operationId: auth_v0_social_auth_callback
      summary: Social auth callback
      description: Handle the OAuth callback from a social auth provider. Finds or creates the user and initiates MFA.
      tags:
        - social-auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - multi_factor_authentication
                  - auth_type
                properties:
                  multi_factor_authentication:
                    type: object
                    required:
                      - uuid
                      - verification_channel
                      - authenticated
                    properties:
                      uuid:
                        type: string
                        description: MFA identifier (mfa_ prefixed)
                      verification_code:
                        type:
                          - string
                          - 'null'
                      verification_channel:
                        type: string
                      authenticated:
                        type: boolean
                      verification_code_expires_at:
                        type: string
                        format: date-time
                  auth_type:
                    type: string
                    enum:
                      - user
                      - customer
                      - rep
                  user:
                    $ref: '#/components/schemas/SocialAuthAccount'
                  customer:
                    $ref: '#/components/schemas/SocialAuthAccount'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: The authenticated email is not associated with any account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing provider or code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - code
              properties:
                provider:
                  type: string
                  enum:
                    - google
                    - facebook
                    - apple
                code:
                  type: string
                  description: OAuth authorization code returned by the provider.
                state:
                  type: string
                  description: Server-issued, one-time OAuth state (validated and consumed for Google/Apple).
                fluid_shop:
                  type: string
                  description: Shop context for the login; falls back to the verified state or the request domain.
                user:
                  type: string
                  description: JSON string of user data Apple posts on first authorization.
                id_token:
                  type: string
                  description: Apple ID token; decoded to extract the sub claim.
            examples:
              google_callback:
                summary: Exchange a Google authorization code returned to the callback
                value:
                  provider: google
                  code: 4/0AWtgzh4kK9m2Qw
                  state: 3f2a9c7e1b
                  fluid_shop: myco.fluid.app
              apple_first_authorization:
                summary: Apple callback on first authorization (posts user + id_token)
                value:
                  provider: apple
                  code: c1d2e3f4a5b6
                  state: 8b7a6c5d4e
                  id_token: eyJraWQiOiJmaDZCcyJ9.eyJzdWIiOiIwMDEyMzQuYWJjZCJ9.Ab12Cd
                  user: '{"name":{"firstName":"Ada","lastName":"Lovelace"},"email":"ada@example.com"}'
      security: []
  /api/social_auth/facebook:
    get:
      operationId: auth_v0_social_auth_facebook
      summary: Redirect to Facebook OAuth
      description: Generate a Facebook OAuth URL for redirect-based authentication.
      tags:
        - social-auth
      responses:
        '200':
          description: Facebook OAuth URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthUrl'
      security: []
  /api/social_auth/google:
    get:
      operationId: auth_v0_social_auth_google
      summary: Redirect to Google OAuth
      description: |-
        Generate a Google OAuth URL for redirect-based authentication.

        `fluid_shop` is optional. When supplied it is placed in the OAuth `state`
        (alongside a server-issued nonce, cached for replay rejection) so the
        callback can resolve the company; Google returns to a bare redirect URI, so
        omitting it makes the callback fall back to the default shop.
      tags:
        - social-auth
      parameters:
        - name: fluid_shop
          in: query
          required: false
          description: Company subdomain the sign-in belongs to. When present it is carried through the OAuth round-trip in `state`.
          schema:
            type: string
      responses:
        '200':
          description: Google OAuth URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthUrl'
      security: []
  /api/social_auth/providers:
    get:
      operationId: auth_v0_social_auth_providers
      summary: List social auth providers
      description: Return available social auth providers with their OAuth URLs for a given shop.
      tags:
        - social-auth
      parameters:
        - name: fluid_shop
          in: query
          required: true
          description: Fluid shop name whose enabled social-auth providers and per-shop OAuth URLs should be returned.
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - providers
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - display_name
                        - auth_url
                        - callback_url
                        - color
                      properties:
                        name:
                          type: string
                        display_name:
                          type: string
                        auth_url:
                          type: string
                          format: uri
                        callback_url:
                          type: string
                          format: uri
                        color:
                          type: string
                          description: Hex color code for the provider button
      security: []
  /api/switch_role:
    post:
      operationId: auth_v0_switch_role
      summary: Switch user role
      description: Switch the current admin user to act as a different role (admin or rep).
      tags:
        - switch-role
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - jwt
                properties:
                  jwt:
                    type: string
        '400':
          description: Missing user_role, an unsupported value, or the caller is not an admin. The body is a bare JSON string describing the failure.
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Authenticated principal lacks the users:update permission (e.g. a company/service token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_role
              properties:
                user_role:
                  type: string
                  enum:
                    - admin
                    - rep
            examples:
              switch_to_rep:
                summary: Act as a rep
                value:
                  user_role: rep
              switch_to_admin:
                summary: Return to acting as an admin
                value:
                  user_role: admin
      security:
        - bearer_auth: []
  /api/user_companies/customer_token_exchange:
    put:
      summary: Exchange user company token for customer JWT
      description: |
        Exchange a user-company token for a customer-scoped JWT, creating a customer
        record if one does not yet exist. The token is supplied in the request body,
        so no bearer header is required. Returns `401` when the user-company token is
        blank or does not match a user company, and `400` when the customer record
        cannot be created or linked (an invalid email under `errors.email`, or a
        member that already has another customer under `errors.member_id`).
      tags:
        - token-exchange
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - jwt
                properties:
                  jwt:
                    type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: The customer record could not be created or linked (invalid email, or the member already has another customer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: The user-company token is blank or does not match a user company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_company_token
              properties:
                user_company_token:
                  type: string
            example:
              user_company_token: uc_2b9f4a7c1d6e8f03a1b2c3d4e5f6
      operationId: auth_v0_customer_token_exchange
      security: []
  /api/user_companies/jwt_exchange:
    put:
      summary: Exchange JWT for user company token
      description: |
        Exchange a JWT for a long-lived user-company token (the inverse of
        `token_exchange`). The JWT is supplied in the request body, so no bearer
        header is required. Returns `401` when the JWT is invalid or has been rejected
        by a lock/flush.

        A JWT minted from an admin-revealed login code is restricted to one company
        and is never exchanged for the long-lived token. When the company allows
        revealed-code mobile sessions and the member is a rep or company admin, the
        response instead carries a JWT restricted to that company in
        `user_company_token`, with `restricted: true`. It expires within two hours,
        is not extended by refreshes, and authenticates only the mobile app's read
        actions. Otherwise the restricted JWT is refused with `401`, and its
        `error_message` says why.
      tags:
        - token-exchange
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - user_company_token
                properties:
                  user_company_token:
                    description: The long-lived user-company token, or, when `restricted` is true, a JWT restricted to one company that expires within two hours. Send either as the bearer credential.
                    type: string
                  restricted:
                    description: Present and true when `user_company_token` is a revealed-code session restricted to one company.
                    type: boolean
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: The JWT is invalid, rejected by a lock/flush, or restricted to one company by a revealed login code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jwt
              properties:
                jwt:
                  type: string
            example:
              jwt: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2NvbXBhbnlfaWQiOjkwMjEwfQ.s5x8Kk3mQ0Yb2n
      operationId: auth_v0_jwt_exchange
      security: []
  /api/user_companies/jwt_refresh:
    put:
      summary: Refresh JWT token
      description: |
        Refresh an existing JWT and return a new one with extended validity. The
        current JWT is supplied in the request body, so no bearer header is required.
        Returns `401` when that JWT is invalid or has been rejected by a lock/flush.
      tags:
        - token-exchange
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - jwt
                properties:
                  jwt:
                    type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: The JWT is invalid or has been rejected by a lock/flush.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jwt
              properties:
                jwt:
                  type: string
            example:
              jwt: eyJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2NvbXBhbnlfaWQiOjkwMjEwfQ.s5x8Kk3mQ0Yb2n
      operationId: auth_v0_jwt_refresh
      security: []
  /api/user_companies/token_exchange:
    put:
      summary: Exchange user company token for JWT
      description: |
        Exchange a user-company token for a bearer JWT (the inverse of
        `jwt_exchange`). The token is supplied in the request body, so no bearer
        header is required. Returns `401` when the user-company token is blank or does
        not match a user company.
      tags:
        - token-exchange
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - jwt
                properties:
                  jwt:
                    type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: The user-company token is blank or does not match a user company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_company_token
              properties:
                user_company_token:
                  type: string
            example:
              user_company_token: uc_2b9f4a7c1d6e8f03a1b2c3d4e5f6
      operationId: auth_v0_token_exchange
      security: []
