openapi: 3.1.0
info:
  title: Fluid Auth API
  version: v0
  description: |
    Authentication, MFA, social auth, impersonation, and token exchange endpoints.

    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation in this API that resolves the company from the request's
    credential refuses a credential for it with `403` and the body
    `{"error": "<message>"}`, before the operation runs. The refusal is
    documented here once rather than on each operation.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.fluid.app
tags:
  - name: auth-token
    description: Short-lived auth-token minting for the current user company.
  - name: authentication
    description: Email MFA login, company switching, JWT-based "me" lookups, and public company branding.
  - name: confirm-visitor
    description: Visitor token confirmation.
  - name: member-handoffs
    description: Single-use handoffs that carry a signed-in member session to an account-management link.
    x-fluid-section: Members
  - name: multi-factor-authentications
    description: MFA record creation and verification-code checks.
  - name: single-sign-ons
    description: SSO-flow aliases of the authentication MFA and lookup endpoints.
  - name: social-auth
    description: Google, Facebook, and Apple OAuth URLs and callback handling.
  - name: switch-role
    description: Switch the current admin user between admin and rep roles.
  - name: token-exchange
    description: Exchange and refresh JWTs and user-company tokens.
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication (JWT or user-company token)
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          description: |
            Opaque per-request identifier echoed on the response; `null` when the
            request was not assigned one. Quote it when reporting an issue so support
            can correlate server-side logs.
          type:
            - string
            - 'null'
        timestamp:
          description: Server time the response was generated, as an ISO 8601 date-time.
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error_message
        - errors
        - meta
      properties:
        error_message:
          description: Human-readable summary of what went wrong, safe to surface to the caller.
          type: string
        errors:
          description: Structured per-field or per-issue detail behind `error_message`; shape varies (see `ErrorBag`) and is `null` when no structured detail is available.
          $ref: '#/components/schemas/ErrorBag'
        meta:
          description: Response metadata (request id and generation timestamp).
          $ref: '#/components/schemas/Meta'
    UnauthorizedResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          description: |
            Reason the request was rejected as unauthenticated. `401` bodies are this
            bare `{ "message": "..." }` object rather than the wrapped `ErrorResponse`
            envelope used by `404`/`422`.
          type: string
    MfaCreatedResponse:
      description: MFA record created — returned by send_mfa, resend_mfa, and multi_factor_authentications create
      type: object
      additionalProperties: false
      required:
        - multi_factor_authentication
      properties:
        multi_factor_authentication:
          description: The MFA record that was created and to which the verification code was sent.
          $ref: '#/components/schemas/MfaCreatedObject'
        meta:
          description: Response metadata (request id and generation timestamp).
          $ref: '#/components/schemas/Meta'
        sign_in_path:
          description: Present only on the `send_mfa` answer, and only as `identity`, when the request sent `identity_hint_supported=true` and the address belongs to a person who signs in through the identity service, and no code or link was sent. The client hands the person back to the calling app instead of asking for a code. Absent otherwise.
          type: string
          enum:
            - identity
        sign_in_kind:
          description: Present with `sign_in_path` only when the request also sent `shopper_hand_back_supported=true` and the company's identity email step is on (`identity_email_step`). Every address that is not a staff address gets this same answer, so it does not say whether the address belongs to a shopper. The client hands the person to the company's checkout, where the identity service's shopper sign-in sends the code. Absent for staff and otherwise.
          type: string
          enum:
            - shopper
    TokenSignInPath:
      description: How the token's holder signs in. `identity` means the legacy sign-in would no longer issue this token, because the token's company signs in through the identity service or its holder is Fluid staff while the Fluid company does; a client must not forward it and hands the person back to the calling app instead. `legacy` means the token may be used as before.
      type: string
      enum:
        - legacy
        - identity
    IdentitySignInCompanyUuid:
      description: The uuid_v7 of the company whose identity sign-in the person is handed back for, which the identity service names it by (`org`), when `sign_in_path` is `identity`. `null` on the `legacy` path, and when the answer is about several companies and the sign-in named none of them. The client carries it into the hand-back so the calling app can start a sign-in for this company.
      type:
        - string
        - 'null'
      format: uuid
    TokenCompanyUuid:
      description: The uuid_v7 of the token's own company when `sign_in_path` is `identity`, `null` on the `legacy` path. Unlike `company_uuid`, it is never the Fluid company named for a root admin's token on another company.
      type:
        - string
        - 'null'
      format: uuid
    MfaCreatedObject:
      type: object
      additionalProperties: false
      required:
        - uuid
        - authenticated
        - verification_channel
        - verification_code_expires_at
      properties:
        uuid:
          description: |
            Identifier of the MFA record (`mfa_`-prefixed). Pass it back as the `uuid`
            when confirming or resending the code.
          type: string
        authenticated:
          description: |
            Whether this MFA record has been satisfied. `false` on creation — it flips
            to `true` only after the correct verification code is submitted.
          type: boolean
        verification_channel:
          description: Channel the verification code was delivered over.
          type: string
          enum:
            - email
            - sms
        verification_code_expires_at:
          description: |
            ISO 8601 time after which the verification code is no longer valid;
            confirming past this point returns `410`. Always present: the blueprint's
            :create view emits it unconditionally and every creation path sets it
            (MfaHandler#create_mfa_record / SendMfaAction).
          type: string
          format: date-time
    SocialAuthUrl:
      description: OAuth provider URL for redirect-based authentication
      type: object
      additionalProperties: false
      required:
        - provider
        - auth_url
        - redirect_uri
      properties:
        provider:
          description: Provider key this URL belongs to (e.g. `google`, `facebook`, `apple`).
          type: string
        auth_url:
          description: Fully-formed provider authorization URL to redirect the user to; carries the server-issued OAuth `state`.
          type: string
          format: uri
        redirect_uri:
          description: Callback URI the provider returns to after the user authorizes; must match the value registered with the provider.
          type: string
          format: uri
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyPublicDetails:
      description: Public company branding for login and SSO pages (no auth required). When the shop name doesn't match a company, the lookup falls back to the requesting domain's company, then the Fluid default company, so a company object is always returned on success.
      type: object
      additionalProperties: false
      required:
        - company
      properties:
        company:
          description: Public branding details for the resolved company.
          type: object
          required:
            - name
            - logo_url
            - color
            - fluid_shop
            - primary_domain_hostname
            - support_email
            - sign_in_path
            - uuid
            - identity_email_step
          properties:
            name:
              description: Display name of the company, or `null` for a legacy company row without one.
              type:
                - string
                - 'null'
            logo_url:
              description: URL of the company logo for login/SSO branding, or `null` when none is set.
              type:
                - string
                - 'null'
            color:
              type: string
              description: Brand color rendered as a "#"-prefixed hex string.
            fluid_shop:
              description: Fluid shop identifier for the company (its `*.fluid.app` shop name, e.g. `myco.fluid.app`).
              type: string
            primary_domain_hostname:
              description: Company's primary custom domain hostname, falling back to the `*.fluid.app` shop domain when no custom domain is configured.
              type: string
            support_email:
              description: Public support contact address for the company, or `null` when none is set.
              type:
                - string
                - 'null'
            sign_in_path:
              description: 'How this company''s people sign in. `legacy` is the one-time-code form served today. `identity` sends the person back to the calling app to start the identity service''s authorize flow, which signs them in through WorkOS AuthKit. Only a company the request names can answer `identity`: the fallback company returned for a shop that matches nothing, and the Fluid platform company that a bare sign-in asks for, always answer `legacy`, and the email step decides instead. Set by Fluid staff per company; a change reaches this response within the one-minute cache lifetime.'
              type: string
              enum:
                - legacy
                - identity
            uuid:
              description: The company's uuid_v7, which the identity service names it by (`org`), whatever its `sign_in_path`; `null` when the request names no company or names the Fluid platform company. fluid-login carries it into the hand-back so the calling app can start a sign-in for this company.
              type:
                - string
                - 'null'
              format: uuid
            identity_email_step:
              description: '`true` only when `sign_in_path` is `identity` and the company''s identity email step is on. The client then shows the email step first instead of handing back on load, because the answer to the email decides between the staff and the shopper sign-in. `false` otherwise.'
              type: boolean
        meta:
          description: Response metadata (request id and generation timestamp).
          $ref: '#/components/schemas/Meta'
    UserProfile:
      description: Authenticated user profile
      type: object
      additionalProperties: false
      required:
        - id
        - first_name
        - last_name
        - email
        - avatar_url
        - root_admin
      properties:
        id:
          description: Numeric identifier of the user the supplied JWT resolved to; `null` when it cannot be resolved.
          type:
            - integer
            - 'null'
        first_name:
          description: User's given name, or `null` when not set.
          type:
            - string
            - 'null'
        last_name:
          description: User's family name, or `null` when not set.
          type:
            - string
            - 'null'
        email:
          description: User's email address.
          type: string
        avatar_url:
          description: URL of the user's avatar image, or `null` when none is set.
          type:
            - string
            - 'null'
        root_admin:
          description: '`true` when the user is a Fluid root admin (able to impersonate companies); `null` when unknown.'
          type:
            - boolean
            - 'null'
    UserCompanyProfile:
      description: User-company relationship details
      type: object
      additionalProperties: false
      required:
        - id
        - company_id
        - company_name
        - roles
        - user_type
        - logo_url
        - icon_url
        - fluid_shop
        - company_colors
      properties:
        id:
          description: Identifier of the user-company membership record (the join between the user and the company), not the user or company id.
          type: integer
        company_id:
          description: Numeric identifier of the company this membership belongs to.
          type: integer
        company_name:
          description: Display name of the company.
          type: string
        roles:
          description: Roles the user holds within this company (e.g. `admin`, `rep`), which govern what the JWT can do.
          type: array
          items:
            type: string
        user_type:
          description: Kind of principal this membership represents within the company (e.g. `user`, `customer`).
          type: string
        logo_url:
          description: URL of the company logo, or `null` when none is set.
          type:
            - string
            - 'null'
        icon_url:
          description: URL of the company's square icon/favicon, or `null` when none is set.
          type:
            - string
            - 'null'
        fluid_shop:
          description: Fluid shop identifier for the company (its `*.fluid.app` shop name).
          type: string
        company_colors:
          description: Company brand colors used to theme login and portal surfaces.
          type: object
          required:
            - primary_color
            - secondary_color
          properties:
            primary_color:
              description: Primary brand color as a "#"-prefixed hex string, or `null` when unset.
              type:
                - string
                - 'null'
            secondary_color:
              description: Secondary brand color as a "#"-prefixed hex string, or `null` when unset.
              type:
                - string
                - 'null'
    ConfirmMfaCompany:
      description: Company returned after successful MFA confirmation
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - jwt
      properties:
        id:
          description: Numeric identifier of the company this entry authenticates the user into.
          type: integer
        name:
          description: Display name of the company, or `null` for a legacy company row without one.
          type:
            - string
            - 'null'
        shop_name:
          description: Fluid shop identifier for the company (its `*.fluid.app` shop name).
          type: string
        logo_url:
          description: URL of the company logo, or `null` when none is set.
          type:
            - string
            - 'null'
        primary_domain_hostname:
          description: Company's primary custom domain hostname, falling back to the shop domain when no custom domain is configured.
          type: string
        jwt:
          description: |
            Bearer JWT scoped to this company. Send it as `Authorization: Bearer
            <jwt>` on subsequent requests, or exchange it for a user-company token via
            `PUT /api/user_companies/jwt_exchange`.
          type: string
        auth_type:
          description: Per-company auth context for this entry's jwt — "rep" (admin/rep surface) or "customer" (checkout/customer portal). Lets the client route each company to the correct destination instead of relying on the single top-level auth_type, which is ambiguous for a user who is a rep in one company and a customer in another.
          type:
            - string
            - 'null'
          enum:
            - rep
            - customer
            - null
        admin:
          description: Whether this entry's membership holds an admin role (or the user is a root admin). Present only while the portal-landing-after-sign-in flag is on for the company; when present, only `true` may send the person to the admin app.
          type: boolean
        portal_url:
          description: The company's member Portal URL, or `null` when it has no subdomain. Present only while the portal-landing-after-sign-in flag is on for the company.
          type:
            - string
            - 'null'
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata, or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
        - type: array
          items:
            $ref: '#/components/schemas/JsonValue'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
    ErrorValue:
      description: A validation or API error value.
      anyOf:
        - type: string
        - type: array
          items:
            type: string
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error message, or null when no structured error details are available.
      anyOf:
        - type: string
        - type: array
          items:
            $ref: '#/components/schemas/ErrorValue'
        - type: object
          additionalProperties:
            $ref: '#/components/schemas/ErrorValue'
        - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
        - type: string
        - $ref: '#/components/schemas/ErrorBag'
        - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          description: Single human-readable error string; the form some legacy controllers (and `401` responses) return.
          type: string
        error:
          description: Alternative single-error field (string or structured); present on some legacy controller paths instead of `message`.
          $ref: '#/components/schemas/ErrorMessage'
        error_message:
          description: Human-readable summary, mirroring the `error_message` of the newer `ErrorResponse` envelope.
          $ref: '#/components/schemas/ErrorMessage'
        errors:
          description: Structured per-field or per-issue error detail; shape varies (see `ErrorBag`).
          $ref: '#/components/schemas/ErrorBag'
        meta:
          description: Response metadata (request id and generation timestamp).
          $ref: '#/components/schemas/Meta'
      additionalProperties:
        $ref: '#/components/schemas/JsonValue'
    ConfirmMfaResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - auth_type
        - companies
        - sign_in_path
        - company_uuid
      properties:
        authenticated:
          description: '`true` once the submitted verification code matched, meaning the JWTs in `companies` are usable.'
          type: boolean
        sign_in_path:
          description: 'How this person signs in. `legacy` means use the JWTs in `companies`. `identity` means the person signs in through the identity service: `companies` is empty, and the client hands the person back to the calling app to start the identity service''s authorize flow. It is `identity` when every company the code would have covered signs in through the identity service, or when the person is Fluid staff and the Fluid company does.'
          type: string
          enum:
            - legacy
            - identity
        company_uuid:
          $ref: '#/components/schemas/IdentitySignInCompanyUuid'
        auth_type:
          description: |
            Top-level principal kind resolved by this login. Prefer the per-entry
            `companies[].auth_type` when routing, since a user can be a rep in one
            company and a customer in another.
          type: string
          enum:
            - user
            - customer
            - rep
        companies:
          description: |
            One entry per company the authenticated principal belongs to, each with
            its own bearer JWT. A single-company user gets a one-element array.
            A company that signs in through the identity service has no entry:
            its JWT is never issued here.
          type: array
          items:
            $ref: '#/components/schemas/ConfirmMfaCompany'
        meta:
          description: Response metadata (request id and generation timestamp).
          $ref: '#/components/schemas/Meta'
    SocialAuthAccount:
      description: The user or customer resolved from a social-auth callback.
      type: object
      additionalProperties: false
      required:
        - id
        - email
        - first_name
        - last_name
      properties:
        id:
          description: Numeric identifier of the resolved account.
          type: integer
        email:
          description: Email address the provider authenticated, or `null` for a customer account with no email on file.
          type:
            - string
            - 'null'
        first_name:
          description: Account's given name, or `null` when not set.
          type:
            - string
            - 'null'
        last_name:
          description: Account's family name, or `null` when not set.
          type:
            - string
            - 'null'
paths:
  /api/auth_token:
    post:
      operationId: auth_v0_auth_token_create
      summary: Create auth token
      description: Generate a short-lived authentication token for the current user company.
      tags:
        - auth-token
      responses:
        '200':
          description: Auth token as a bare JSON string, or JSON null when generation fails.
          content:
            application/json:
              schema:
                type:
                  - string
                  - 'null'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: Authenticated principal lacks the users:update permission (e.g. a company/service token with no user principal).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
      security:
        - bearer_auth: []
  /api/identity/legacy_handoff:
    post:
      operationId: auth_v0_identity_legacy_handoff_create
      summary: Hand an identity session a legacy session for a company
      description: |
        Gives a person signed in through the identity service a legacy session for
        a company that is not on the identity sign-in, with no second prompt. Only
        the caller's own active, unlocked membership in the target company is used.
        A company on the identity sign-in, an inactive company, a sandbox twin, a
        missing membership and a root admin with no membership all return the same
        404. Legacy sessions, client and company tokens, tokens that carry an actor
        and restricted sessions are refused.
      tags:
        - authentication
      x-fluid-audience: member
      x-fluid-lint-exempt: Path is the fixed contract the identity-session clients call; it lives in the unversioned auth-v0 spec beside the legacy company switch it falls back to.
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              company_uuid: 0192f5a0-7c1e-7b3a-9d4e-5f6a7b8c9d0e
            schema:
              type: object
              additionalProperties: false
              description: Give exactly one of `company_id` or `company_uuid`; both or neither is a 422.
              properties:
                company_id:
                  type: integer
                  description: The company to receive a legacy session for.
                company_uuid:
                  type: string
                  format: uuid
                  description: The same company named by its uuid_v7, which is what the identity service knows it by.
              oneOf:
                - required:
                    - company_id
                - required:
                    - company_uuid
      responses:
        '200':
          description: Legacy session issued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - jwt
                  - company
                properties:
                  jwt:
                    type: string
                    description: The legacy session JWT for the caller's membership.
                  meta:
                    $ref: '#/components/schemas/Meta'
                  company:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - name
                      - fluid_shop
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      fluid_shop:
                        type: string
              example:
                jwt: eyJhbGciOiJIUzI1NiJ9.e30.signature
                company:
                  id: 42
                  name: Primex
                  fluid_shop: primex
        '401':
          description: Not an identity person session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: A restricted session or a token the endpoint may not reach.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: The company is not available for a legacy session, or the caller has no active membership in it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Not exactly one of company_id or company_uuid, or the value is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/member_handoffs:
    post:
      operationId: auth_v0_member_handoffs_create
      summary: Create a member session handoff
      description: |
        Issues a single-use, 60 second handoff for the caller's current session so
        an account-management link can open without carrying the session. The
        member, company and session kind come only from the bearer session;
        request parameters are ignored. Identity-service tokens, impersonation,
        read-only and role-narrowed sessions are refused.
      tags:
        - member-handoffs
      x-fluid-audience: member
      x-fluid-lint-exempt: Path is the fixed cross-app handoff contract shared with the mobile and checkout clients; it lives in the unversioned auth-v0 spec beside the sibling redeem_handoff and cannot be renamed.
      security:
        - bearer_auth: []
      responses:
        '200':
          description: Handoff issued. Never cacheable (no-store).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - handoff
                  - expires_in
                properties:
                  handoff:
                    type: string
                    description: Opaque single-use value to place in the link.
                  expires_in:
                    type: integer
                    description: Seconds until the handoff expires.
              example:
                handoff: 4mQ2c8Zr1xWvB7nTqLk0pYdE5sHaUo9JgFiN3tXeVwA
                expires_in: 60
        '401':
          description: The bearer session cannot be handed off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          description: The caller's company signs in through the identity service and Rails no longer issues legacy sessions for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '503':
          description: The handoff store is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/member_handoffs/redeem:
    post:
      operationId: auth_v0_member_handoffs_redeem
      summary: Redeem a member session handoff
      description: |
        Exchanges a single-use handoff for a session of the kind it was issued for.
        The session is returned only in the `X-Member-Token` response header,
        never in the body. Unknown, expired, replayed or mismatched handoffs all
        return the same 422.
      tags:
        - member-handoffs
      x-fluid-audience: public
      x-fluid-lint-exempt: Path is the fixed cross-app handoff contract shared with the mobile and checkout clients; it lives in the unversioned auth-v0 spec beside the sibling redeem_handoff and cannot be renamed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              handoff: 4mQ2c8Zr1xWvB7nTqLk0pYdE5sHaUo9JgFiN3tXeVwA
              fluid_shop: primex
            schema:
              type: object
              required:
                - handoff
              properties:
                handoff:
                  type: string
                  description: The opaque value from the link.
                fluid_shop:
                  type: string
