        Needs `member_site_data.view`, the permission to read what members wrote, `application_themes.view`, the permission of the site detail page, and a signed-in admin. An admin who edits themes but was never given `member_site_data.view` is refused with 403; a company grants it to the roles that moderate. A site of any owner in the company is served, a member's included, because a company admin oversees a member's site: reading and deleting what its members wrote is the moderation the member sites contract provides. It answers 404 for every caller that passes those checks when the site has no active database or no published schema, and until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
