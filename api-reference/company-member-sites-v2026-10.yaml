  /api/company/v2026-10/member-sites/{id}/restore:
    post:
      operationId: companyMemberSitesRestore
      x-fluid-audience: company
      summary: Restore a site to a version
      description: Puts any site of the company, a company site or a member's, back to a version from its history, as the signed-in admin, whom the restore's version names. The site's files, pages, menus and settings become the version's, and it is published; unpublished drafts are replaced. Its name, handle, visibility, status and shares do not change, so a site that was taken down stays taken down. The restore is saved as a new version, so it can be undone by restoring the version before it. Either the whole version is restored or nothing changes. A restore waits for the site's latest change to be saved to its history first; until it is, it answers 409 `sync_pending` and the save is started, so retry shortly. Needs `application_themes.update` and a signed-in admin.
      tags:
      - member-sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteRestoreBody'
            example:
              sha: a1b2c3d
      responses:
        '200':
          description: The site now equals the version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteRestoredResponse'
              example:
                restored:
                  sha: a1b2c3d
                  files_written: 12
                  files_removed: 2
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-30T14:05:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks `application_themes.update`, or has no signed-in admin, such as a company API token or a droplet token.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site's history holds no version with this sha, or member sites are not enabled for the company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site's history cannot be used right now. `error.details.error` is `not_provisioned` (no history yet), `not_connected`, `sync_pending` (the latest change is still being saved; retry shortly), `sync_failing` (saving the latest change failed), `not_restorable` (a member's site whose owner was removed) or `conflict` (the site is being changed; retry).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The sha is malformed, the body holds an unknown field, the commit is not a site version (such as the history's first commit), or a file of the version could not be written, which `error.details.path` names. Nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The version could not be read from the site's history. Nothing changed; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
