                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site has no active database or no schema, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/data/{table}:
    get:
      operationId: companyMemberSiteDataRows
      x-fluid-audience: company
      summary: Read the rows of a table of a site's database
      description: |
        A page of one table's rows, newest first, with the table's row count. The sites gateway reads them as the admin, with no table rule applied. Every call is logged with the admin, the site and the table, before the gateway is asked.

