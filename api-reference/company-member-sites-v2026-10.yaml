        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteHomeUpdateBody:
      type: object
      description: The site to make home. Any other field is refused as an unknown field.
      additionalProperties: false
      required:
      - member_site_home
      properties:
        member_site_home:
          type: object
          additionalProperties: false
          required:
          - site_id
          properties:
            site_id:
              type: string
              format: uuid
              description: The id of a company-owned site of the company, as the site list gives it.
    ErrorResponse:
      type: object
      description: A refusal in the standard envelope.
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: What went wrong.
            details:
              type: object
              additionalProperties: true
              description: The fields that were refused, with why.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    AuthorizationError:
      type: object
      description: The body an authentication or permission refusal answers with.
      additionalProperties: true
  parameters:
    ApiKeyId:
      name: key_id
      in: path
      required: true
