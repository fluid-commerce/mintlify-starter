        Replaces the scopes the company's rep sites may use on a visitor's data, the caps on its sites' databases, or both. A part the body leaves out stays as it is. A narrower list holds from the sites gateway's next decision: the gateway drops every answer it holds for the company, so a page that is already open is refused the next call that needs a scope the list no longer holds. A changed cap holds from the next decision in the same way, for every site of the company. Each change is logged with the admin who made it. Sending what the company holds changes nothing.

        `databaseLimits` replaces all three caps: one that is null or left out goes back to its default. A cap must be a positive integer.

        Needs `application_themes.update` and a signed-in admin. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
