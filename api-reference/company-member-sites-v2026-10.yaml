      responses:
        '200':
          description: The site's branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBranchesResponse'
              example:
                branches:
                - slug: staging
                  site_id: 019a4e5f-7081-7c92-8da3-b4c5d6e7f80a
                  parent_id: 019a2b3c-4d5e-7f6a-8b7c-9d0e1f2a3b4c
                  handle: primex-launch-staging
                  status: published
                  frame_path: "/accounts/_frame/019a4e5f-7081-7c92-8da3-b4c5d6e7f80a"
                  shell_path: "/sites/primex-launch-staging"
                  url: https://shop.example.com/sites/primex-launch-staging
                  parent_changed: false
                  created_at: '2026-10-16T10:00:00Z'
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-23T14:05:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, or is a droplet installation token or an OAuth client token, which are refused on every branch route whatever their scopes once member sites are enabled. While they are not, a token with the scope the route needs gets 404 instead.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: companyMemberSiteBranchesCreate
      x-fluid-audience: company
      summary: Branch a site
      description: |
        For an older Liquid site, makes a branch of a published site: a second site, owned as its parent is, cloned from the parent's published layouts, sections, snippets, pages, settings, text assets and menus, and published at once, so its `frame_path` renders what the parent renders. Nothing the parent holds in draft is copied, and the parent is never changed. The branch is private and cannot be shared or made public, and it is left out of the site list. It has no Git repository.

        A member's site is branched by a company admin who holds a kept admin row as its owner would: the branch is the owner's, counts against the owner's site limit, and records the admin as its creator. It is refused with 404 to a root admin who holds none, when its owner was discarded and while the site is locked. A draft site, a taken-down site and a branch cannot be branched, and a site holding a binary asset cannot be branched. A site has one branch at a time. Needs `application_themes.update` and a signed-in admin. The body is optional.

        For a gateway-served V1 parent, the branch starts as a private draft with an independent prepared bundle. Its files and database rows are copied in the background. The normal bundle publisher makes it current only after both copies are ready. Until then the branch's status is draft. If the parent's schema advances incompatibly during copying, the captured bundle is refused and remains unserved; inspect its failed bundle before rebuilding. V1 branches are edited and published through app bundles rather than older Liquid files.
      tags:
      - member-site-branches
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteBranchCreateBody'
            example:
              branch:
                slug: staging
      responses:
        '201':
          description: The new private branch. A Liquid branch is published immediately; a V1 branch remains draft until its files and database are ready. A failed database provisioning attempt keeps the accepted draft for automatic retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBranchResponse'
              example:
                branch:
                  slug: staging
                  site_id: 019a4e5f-7081-7c92-8da3-b4c5d6e7f80a
                  parent_id: 019a2b3c-4d5e-7f6a-8b7c-9d0e1f2a3b4c
                  handle: primex-launch-staging
                  status: published
                  frame_path: "/accounts/_frame/019a4e5f-7081-7c92-8da3-b4c5d6e7f80a"
                  shell_path: "/sites/primex-launch-staging"
                  url: https://shop.example.com/sites/primex-launch-staging
                  parent_changed: false
                  created_at: '2026-10-16T10:00:00Z'
                status: 201
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-23T14:05:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused on every branch route whatever their scopes once member sites are enabled. While they are not, a token with the scope the route needs gets 404 instead.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, or member sites are not enabled for this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site already has a branch, or the slug is taken, or the site was being changed and the branch was not made. Read the site again and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The site is a draft, was taken down, or is a branch; the site holds a file that cannot be copied (such as a binary asset) or more pages than a site may; the slug is malformed; or the body holds an unknown field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/bundles:
    get:
      operationId: companyMemberSiteBundlesList
      x-fluid-audience: company
      summary: List a company site's bundles
      description: |
        The bundles of one company site, newest first, in every state: an upload in progress, a failed one, and each published one, with the one the site serves marked `current`. A bundle is its id, state, times and the SHA-256 of its manifest, never the manifest. Roll back to an earlier published bundle with its `current` route.

        Needs `application_themes.view` and a signed-in admin, because the list is read as the admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-bundles
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: page[cursor]
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from `meta.pagination.next_cursor` or `prev_cursor`. Do not construct or decode it.
      - name: page[limit]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Bundles per page. Default 25, maximum 100.
      responses:
        '200':
          description: A page of bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBundlesResponse'
              example:
                member_site_bundles:
                - id: 0199537f-0000-7000-8000-000000000005
                  state: published
                  current: true
                  createdAt: '2026-11-05T10:00:00.000Z'
