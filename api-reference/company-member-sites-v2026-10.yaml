  /api/company/v2026-10/member-sites/{id}/copy:
    post:
      operationId: companyMemberSitesCopy
      x-fluid-audience: company
      summary: Copy a member site
      description: |
        For a gateway-served V1 source with a current bundle, creates a draft company site with an independent prepared bundle holding the current snapshot's files and declarations. Blob transfer runs in the background. The new company site stays a private draft; list its bundles and explicitly publish the prepared bundle after transfer completes. Publishing too early answers 409 `copy_in_progress` without failing the upload. The current bundle's schema is carried when declared; source database rows are not copied. When the copied bundle declares a database schema, the first publish creates an empty database from it. The prepared draft is retained until its first bundle becomes current; terminal transfer failures leave a failed bundle and no serving site, and temporary gateway failures retry in the background.

        The signed-in admin creates the copy. It is private, has no owner member, is not required, and is not taken down. Its position is one past the highest position of the company's own sites, as for a new company site created without one. The original is not changed, and the copy shares no rows with it. A company admin has no limit on the number of sites. Needs `application_themes.update` and a signed-in admin. The body is optional.

        **Older Liquid compatibility.** For an older Liquid site in any status, copies only its published layouts, sections, snippets, pages, settings, text assets and menus. Its published access declaration becomes a draft of the copy and is not published until the copy is. Draft revisions, never-published files and unpublished pages are excluded. A menu item linking to a page that was not copied is omitted with its descendants.
      tags:
      - member-sites
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the site to copy.
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteCopyBody'
            example:
              member_site:
                name: Riley's Shop for the fall
                handle: fall-shop
      responses:
