paths:
  /api/company/v2026-10/project-launch-recommendations:
    post:
      operationId: companyProjectLaunchRecommendationCreate
      x-fluid-audience: company
      summary: Recommend a site or an app for a new project
      description: |
        Says whether a new project should launch as a **site** or an **app**, by the one rule Fluid's MCP tools, CLI and docs share. A project is a site (static files on the sites gateway, with optional light functions and a database) unless it needs a custom domain, server rendering or heavy server code; any of those makes it an app (a Mist app). A site that outgrows these limits can be converted into an app later.

        Pass what the user is building as `description`, and any need you already know in `needs`. A need you leave out is read from plain phrases in the description, such as "its own domain" or "server-side rendering"; a need you set to `false` is not. It reads and changes nothing.

        Needs `application_themes.view`. A droplet installation token is refused with 403.
      tags:
      - member-site-conversion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectLaunchRecommendationRequest'
            example:
              description: An event page for our spring launch, on launch.example.com
              needs:
                custom_domain: true
      responses:
        '200':
          description: The recommendation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectLaunchRecommendation'
              example:
                kind: app
                reasons:
                - code: custom_domain
                  message: It needs its own domain. Sites live at a Fluid address, and apps can have a custom domain
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-10T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission or is a droplet installation token.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Member sites are not enabled for this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The body has a field that is not listed, or a need that is not a Boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites:
    get:
      operationId: companyMemberSitesList
      x-fluid-audience: company
      summary: List member sites
      description: Every site in the company, company-owned and member-owned, newest first unless `sort` says otherwise, except a branch, which is found through its site's branches and by its own id. `q` searches the sites and keeps the filters and the sort order. Needs `application_themes.view`, or a droplet token with the `website` scope.
      tags:
      - member-sites
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        example: launch
        description: Search text. Matches part of a word in the site's name, handle, description, owner's name and metafield values, in every language the site has. The results keep the filters and the `sort` order.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - -name
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - position
          - -position
          default: -created_at
        example: name
        description: Sort key; prefix `-` for descending. Default `-created_at`, newest first. `position` lists company sites first, in the order members' menus list them, then members' own sites, which are all at position 0. Sites that tie are ordered by id, in the sort's direction. A cursor works only with the sort it was issued for.
      - name: page[cursor]
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from `meta.pagination.next_cursor` or `prev_cursor`. Do not construct or decode it.
      - name: page[limit]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Sites per page. Default 25, maximum 100.
      - name: filter[owner_kind]
        in: query
        required: false
        schema:
          type: string
          enum:
          - company
          - member
        example: member
        description: Only sites owned by the company, or only sites owned by members.
      - name: filter[visibility]
        in: query
        required: false
        schema:
          type: string
          enum:
          - private
          - public
        example: public
        description: Only private sites, or only public sites.
      - name: filter[status]
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - taken_down
        example: published
        description: Only sites with this status.
      - name: filter[company_lock]
        in: query
        required: false
        schema:
          type: string
          enum:
          - none
          - made_private
          - taken_down
        example: made_private
        description: Only sites whose `company_lock` is this value. A taken-down site reads `taken_down` whether or not it is locked.
      - name: filter[created_by]
        in: query
        required: false
        schema:
          type: string
          enum:
          - me
        example: me
        description: Only the company sites the caller created, those whose `created_by_me` is true. None for a caller with no user.
