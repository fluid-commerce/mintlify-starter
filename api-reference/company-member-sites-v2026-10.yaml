  /api/company/v2026-10/member-sites/{id}/database-export:
    get:
      operationId: companyMemberSiteDatabaseExportShow
      x-fluid-audience: company
      summary: Download a site's database
      description: |
        Downloads every table and row of one site's database as a file, from the sites gateway, which reads the database as the request is served. It serves any site of the company, a member's included. The answer is NDJSON, the contract's `DumpV1`: a first line with the format, its version and the schema (`{"format":"fluid-site-db","version":1,"schema":{...}}`), then one line for each row (`{"table":"notes","row":{...}}`). The same bytes import into any driver. It is sent as it is read, so it begins at once and no copy is held, however large the database is; the `Content-Disposition` header names the file `site-database-<site id>.ndjson`. It is not cached.

        A failure before the first byte is a normal error answer (502, or 504 when the gateway did not begin in time). A failure after it cannot change the status, which is already 200, so the dump ends with one more line, `{"error":"export_interrupted"}`, which is neither a header nor a row and has no newline after it. A dump is whole only when the response ends cleanly and every line, the last included, is a header or a row and ends with a newline. A connection that is cut gives an HTTP error (a missing final chunk) or a last line without its newline. Download again.

        Needs `member_site_data.view`, the permission to read what members wrote, because a dump holds every row of the site, whoever wrote it, `application_themes.view`, the permission of the site detail page, and a signed-in admin. An admin who edits themes but was never given `member_site_data.view` is refused with 403; a company grants it to the roles that moderate. A droplet installation token and an OAuth client token are refused with 403. It answers 404 for every caller that passes those checks until the sites gateway is released to the company, and for a site with no active database.
      tags:
      - member-site-database
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: The database as a `DumpV1` file, streamed.
          headers:
            Content-Disposition:
              description: '`attachment` with the file name `site-database-<site id>.ndjson`.'
              schema:
                type: string
            Cache-Control:
              description: Always `private, no-store`.
              schema:
                type: string
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 'NDJSON. The first line is the header, `format`, `version` and `schema`; each other line is a row, `table` and `row`. A last line `{"error":"export_interrupted"}` with no newline after it means the dump failed after it began and is not whole.'
              example: |
                {"format":"fluid-site-db","version":1,"schema":{"tables":{}}}
                {"table":"notes","row":{"id":"1","body":"first"}}
                {"table":"notes","row":{"id":"2","body":"second"}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site has no active database, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The sites gateway could not begin the export, because it was unreachable, refused the call or answered with something unexpected, or Rails has no secret for it. `details.error` names which, and nothing the gateway said is passed on. Nothing was sent; ask again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: The sites gateway did not begin to answer within 25 seconds. Nothing was sent; ask again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/conversion:
    post:
      operationId: companyMemberSiteConversionCreate
      x-fluid-audience: company
      summary: Convert a company site into a Mist app
      description: |
        Starts turning one public company site into a Mist app, for a project that has outgrown sites: it needs its own domain, server rendering or heavier server code. The answer is `202` with the queued conversion; the app is built in the background and its first deployment follows, usually within a few minutes. The site is archived and its address redirected only once that deployment is ready. Read its progress with `GET` on the same path.

        The app starts from the site's code: its own source repository when it has one, otherwise the files of its current bundle, which become the whole of the app's repository and are served as a static project. Once the app is built the site is archived (not deleted), and `/sites/<handle>` sends visitors to the app's address at the same path.

        Only a public company site converts, because an app has no Fluid sign-in to keep a private or members-only site closed. What is refused, with `details.reason`: a member's site (`not_company_site`, 403); a branch (`branch`), a taken-down site (`taken_down`), an archived site (`archived`), a site that is private, made private by the company or declares visitor data (`not_public`), a site not published through the sites gateway (`not_published`), a site with a database (`has_database`: its rows can't be moved into an app yet; download them with the database export) and no usable Mist template (`template_unavailable`), all 422; a site being converted (`conversion_in_progress`) or already converted (`already_converted`), 409; and a company with no credits for a new app (`credits_exhausted`), 402. Nothing is created for a refusal. Env vars are not carried yet: sites have none until they are added.

        Needs `application_themes.update`, `mist.create` and `mist.code`, because the app is built from the site's code, and a signed-in admin. A site converted from its bundle is served as built files and never built again: its files go under `public/`, and Fluid's own `vercel.json` turns off install and build, so no script from the bundle runs. A droplet installation token and an OAuth client token are refused with 403. It answers 404 for every caller that passes those checks until the sites gateway is released to the company.
      tags:
      - member-site-conversion
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '202':
          description: The conversion is queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAppConversionResponse'
              example:
                conversion:
                  id: 019a6f00-0000-7000-8000-000000000001
                  state: queued
                  mist_id: null
                  source: null
                  redirect_url: null
                  error: null
                  created_at: '2026-11-10T10:00:00.000Z'
                  finished_at: null
                status: 202
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-10T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: The company has no credits left for a new Mist app (`credits_exhausted`). Add credits, then convert again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The caller lacks a permission or a signed-in admin, is a droplet installation token or an OAuth client token, or the site is a member's (`not_company_site`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site is being converted (`conversion_in_progress`) or was already converted (`already_converted`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The site can't be converted. `details.reason` says why, and the message says it in plain words.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Only a public site can become an app. An app can't keep a private or members-only site closed to the public, so make the site public first, or keep it as a site
                  details:
                    reason: not_public
                status: 422
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-10T10:00:00Z'
    get:
      operationId: companyMemberSiteConversionShow
      x-fluid-audience: company
      summary: Read a site's conversion into a Mist app
      description: |
        The site's latest conversion: `queued`, `running`, `deploying`, `publishing`, `failing`, `succeeded` with the app's id and address, or `failed` with the reason. Poll it after a start until it is `succeeded` or `failed`.

        Needs `application_themes.view`, `mist.view` and a signed-in admin. A droplet installation token and an OAuth client token are refused with 403. A member's site is refused with 403. It answers 404 when the site was never converted, and for every caller that passes those checks until the sites gateway is released to the company.
