          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/logs:
    get:
      operationId: companyMemberSiteLogsList
      x-fluid-audience: company
      summary: Read a company site's log
      description: |
        The log of one company site, oldest first: the lines after `since`, at most `limit` of them, plus any more at the same moment as the last one, so reading on from its `at` skips none. To follow the log, ask again with the last line's `at` as `since`. Publishing writes a line for each upload's start, its publish and who published it (named only to a caller with `company_admins.view`), and an upload that failed or expired. An ending is dated when it settled; an expired upload has its line once the expiry cleanup marks it failed. A rollback gives a `Rolled back to <bundle id>` line (the latest rollback to each bundle). A failed or expired upload is cleared when the next upload starts. Each call of the site's server functions is a `function` line (`error` for a timeout or a server error, `warn` for a refusal such as the rate limit, which writes one line a minute), and what a function printed while it ran comes before its call's line, for a caller with `application_themes.update` and `member_site_data.view` only; the gateway writes them within about a second, so a line can arrive just after a later line of another source. `gateway` lines start when the sites gateway records them per site. Never stored (`no-store`).

        Needs `application_themes.view` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-hosting
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: since
        in: query
        required: false
        description: An ISO 8601 time; only lines after it are answered. Defaults to 7 days ago.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: The most lines to answer, the oldest first. Defaults to 100, at most 500.
        schema:
          type: integer
          minimum: 1
          maximum: 500
      responses:
        '200':
          description: The site's log lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteLogsResponse'
              example:
                logs:
                - at: '2026-11-05T10:00:00.000000Z'
                  level: info
                  source: publish
                  message: Upload 0199537f-0000-7000-8000-000000000005 started with 12 files
                - at: '2026-11-05T10:02:00.000000Z'
                  level: info
                  source: publish
                  message: Published 0199537f-0000-7000-8000-000000000005 by Pat Admin
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A `since` that is not a time, or a `limit` that is not an integer from 1 to 500.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
