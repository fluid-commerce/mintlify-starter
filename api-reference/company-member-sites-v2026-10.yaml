          description: The site's branches.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteBranchCreateBody:
      type: object
      description: Optional choices for a branch. The whole body may be omitted.
      additionalProperties: false
      properties:
        branch:
          type: object
          additionalProperties: false
          description: The choices for the branch.
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 40
              pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
              description: Lowercase letters and digits separated by single hyphens. Omit it to name the branch `staging`.
    MemberSiteVersion:
      type: object
      description: One version of a site, a commit of its Git history. Who made it is in its message, which names an admin by name and a member by their public id. A droplet reading a sandbox test company gets `Admin` in place of an admin's name.
      additionalProperties: false
      required:
      - sha
      - short_sha
      - message
      - committed_at
      - current
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
          description: The commit's sha.
        short_sha:
          type: string
          description: The first seven characters of the sha, for display.
        message:
          type: string
          description: The commit's message.
        committed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the commit was made.
        current:
          type: boolean
          description: Whether this is the version the site's history was last synced to.
    MemberSiteVersionsResponse:
      type: object
      description: A site's versions, newest first, and the state of its history.
      required:
      - versions
      - current_sha
      - syncing
      - sync_failing
      - status
      - meta
      properties:
        versions:
          type: array
          description: The site's versions, newest first.
          items:
            $ref: '#/components/schemas/MemberSiteVersion'
        current_sha:
          type:
          - string
          - 'null'
          description: The sha the site's history was last synced to, or null before its first push.
        syncing:
          type: boolean
          description: Whether a change to the site is being saved to its history now.
        sync_failing:
          type: boolean
          description: Whether the last attempt to save a change to the site's history failed. The listing still answers.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteRestoreBody:
      type: object
      description: The version to restore. Any other field is refused.
      additionalProperties: false
      required:
      - sha
      properties:
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{7,40}$'
          description: The sha of the version, 7 to 40 hex characters, from `sha` in the versions listing.
    MemberSiteRestoredResponse:
      type: object
      description: What a restore did.
      required:
      - restored
      - status
      - meta
      properties:
        restored:
          type: object
          additionalProperties: false
          required:
          - sha
          - files_written
          - files_removed
          properties:
            sha:
              type: string
              description: The sha of the version restored.
            files_written:
              type: integer
              minimum: 0
              description: The number of files in the version, including files the site does not manage such as `README.md`.
            files_removed:
              type: integer
              minimum: 0
              description: The number of the site's files the version did not have, which the restore removed.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFeature:
