        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitePostedUpdateBody:
      type: object
      description: The line to post on a site and whether it should go out as a push too, unwrapped. Any other field is refused.
      additionalProperties: false
      required:
      - text
      properties:
