        '404':
          description: No such site in this company, the site is a member's, whose bundles its owner publishes, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site already has 5 uploads in progress (`details.error` is `uploads_in_progress`), so nothing was saved and the gateway was not asked; finish one or wait for one to expire, 60 minutes after it started. Or the bundle was gone when the gateway answered, because its site was deleted (`superseded`), and no upload URLs are returned.
