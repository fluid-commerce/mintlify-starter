          description: The new site, a draft company site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteResponse'
              example:
                member_site:
                  id: 019a2d5e-6f7a-7b8c-9d0e-1f2a3b4c5d6e
                  handle: fall-shop
                  name: Riley's Shop for the fall
