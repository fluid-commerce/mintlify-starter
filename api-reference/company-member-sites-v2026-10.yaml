          description: What the user is building, in their words.
        needs:
          type: object
          additionalProperties: false
          description: The needs the caller knows, each a Boolean.
          properties:
            custom_domain:
              type: boolean
              description: The project must answer at its own domain.
            server_rendering:
              type: boolean
              description: The project renders pages on the server (SSR).
            heavy_functions:
              type: boolean
              description: The project runs long or heavy server code.
    ProjectLaunchRecommendation:
      type: object
