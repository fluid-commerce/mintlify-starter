  /api/company/v2026-10/member-sites/{id}/copy:
    post:
      operationId: companyMemberSitesCopy
      x-fluid-audience: company
      summary: Copy a member site
      description: |
        Copies the published content of a site, in any status, into a new draft company site created by the signed-in admin. The copy holds the site's published layouts, sections and snippets, its published pages, its published settings, its text assets and its menus; it never holds a draft above a published file, a file that was never published, or a page that is not published. The site's published access declaration is copied as a draft of the copy, so it is not published until the copy is. A menu item that links to a page that was not copied is left out with the items below it. The copy is private, has no owner member, is not required, and is not taken down. The original is not changed, and the copy shares no rows with it. A company admin has no limit on the number of sites. Needs `application_themes.update` and a signed-in admin. The body is optional.
      tags:
      - member-sites
      parameters:
      - name: id
        in: path
        required: true
        description: The id of the site to copy.
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteCopyBody'
            example:
              member_site:
                name: Riley's Shop for the fall
                handle: fall-shop
      responses:
