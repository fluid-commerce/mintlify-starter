---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Member Sites
  description: |
    How company admins oversee member sites: every site in the company, whether
    the company or one of its members owns it. Admins create and change
    company sites, take any site down so its owner cannot publish it again,
    delete any site with its pages, and copy any site into a new company site.
    An admin also builds a company site as a member builds their own: its files
    and pages are written, and the site is published, through the routes below.
    The routes for a site's files, pages, publishing and changes serve company
    sites only: for a member's site every one of them, reads included for files
    and pages, is refused with 403, because they belong to its owner.
    An admin oversees a member's site through the site routes: list, read, take
    down, delete and copy. Changing a member's site is refused with 403 as well.

    An admin also sees and manages who a site is shared with. The shares of any
    site in the company are listed and deleted here, and the shares of a company
    site are created and changed. Sharing a member's site is the member's to do,
    and is refused with 404, as a site an admin may not manage; sharing with a
    member's downline is refused with 422. A
    share names its audience by name and never by email address. No route lists
    the sites members removed from their own menus.

    A site is addressed by its `id`, which is its `uuid_v7`. The owner of a
    member site is summarized by the member's id and display name; no contact
    details are returned.

    A signed-in admin needs the `application_themes.view` permission to read
    and `application_themes.update` to write, the permissions the theme
    endpoints use. A droplet installation token reads with the `website`
    scope, which droplet authentication grants for the theme permissions;
    on a sandbox twin it gets the owner's display name as null. Every route
    also needs the `MEMBER_SITES` company flag, and a company without it gets
    404 on every route. Writes act as the signed-in admin, so a credential
    with no user, such as a company API token or a droplet token, can read
    sites and the pages of a company site, but not write; a company API token
    can also read the shares of a site, which a droplet token never can: a share
    names members, so every share route answers a droplet token, and an OAuth
    client token whatever its scopes, with 403. Files, which hold a
    site's code, are read through the signed-in admin too: such a credential
    gets 403 on them.
  version: 2026-10
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: member-sites
  description: Member sites in your company, for admins to oversee.
  x-fluid-section: Members
- name: member-site-files
  description: 'The files of a site: layouts, sections, snippets, assets, page content, settings and menus.'
  x-fluid-section: Members
- name: member-site-pages
  description: The pages of a site.
  x-fluid-section: Members
- name: member-site-shares
  description: Who a site is shared with.
  x-fluid-section: Members
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: A company admin credential for your company, or a droplet installation token with the `website` scope for reads, except on the share routes, which refuse a droplet token.
  schemas:
    Meta:
      type: object
      description: Response metadata included on every response body.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
    Pagination:
      type: object
      description: Cursor paging for a list.
      required:
      - cursor
      - limit
      - prev_cursor
      - next_cursor
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: The cursor of this page.
        limit:
          type: integer
          description: Records per page.
        prev_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the previous page, or null on the first.
        next_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the next page, or null on the last.
    ListMeta:
      type: object
      description: Response metadata of a list.
      required:
      - request_uuid
      - timestamp
      - pagination
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
        pagination:
          $ref: '#/components/schemas/Pagination'
    OwnerMember:
      type: object
      description: The member who owns a member site.
      required:
      - id
      - display_name
      properties:
        id:
          type: string
          format: uuid
          description: The member's id.
        display_name:
          type:
          - string
          - 'null'
          description: The member's name.
    MemberSite:
      type: object
      description: A site owned by the company or by one of its members.
      required:
      - id
      - handle
      - name
      - owner_kind
      - owner_member
      - copied_from_id
      - visibility
      - status
      - taken_down_at
      - required
      - position
      - layout_name
      - settings
      - content_version
      - lock_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The site's id (its `uuid_v7`).
        handle:
          type: string
          description: The URL segment after `/accounts/`. Lowercase letters, digits and single hyphens, at most 40 characters.
        name:
          type: string
          description: The site's name.
        owner_kind:
          type: string
          enum:
          - company
          - member
          description: Whether the company or a member owns the site.
        owner_member:
          oneOf:
          - $ref: '#/components/schemas/OwnerMember'
          - type: 'null'
          description: The owning member; null on a company site.
        copied_from_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The id of the site this one was copied from, or null for a site that was not copied. It becomes null when the original is deleted.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may see the published site.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: Whether the owner has published the site, or an admin took it down.
        taken_down_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an admin took the site down, or null.
        required:
          type: boolean
          description: Whether members must have this site. Only a company site can be required.
        position:
          type: integer
          description: Where the site sits among the company's sites.
        layout_name:
          type:
          - string
          - 'null'
          description: The layout the site renders with.
        settings:
          type: object
          additionalProperties: true
          description: The site's own settings.
        content_version:
          type: string
          format: uuid
          description: Changes each time the site is published; keys the public page cache.
        lock_version:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Send it back on a change to refuse the change if the site changed since you read it.
        created_at:
          type: string
          format: date-time
          description: When the site was created.
        updated_at:
          type: string
          format: date-time
          description: When the site last changed.
    MemberSiteResponse:
      type: object
      description: One site.
      required:
      - member_site
      - status
      - meta
      properties:
        member_site:
          $ref: '#/components/schemas/MemberSite'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitesResponse:
      type: object
      description: A page of sites.
      required:
      - member_sites
      - status
      - meta
      properties:
        member_sites:
          type: array
          items:
            $ref: '#/components/schemas/MemberSite'
          description: The sites on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/ListMeta'
    MemberSiteCreateBody:
      type: object
      description: The new company site.
      required:
      - member_site
      additionalProperties: false
      properties:
        member_site:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              type: string
              description: The site's name.
            handle:
              type:
              - string
              - 'null'
              description: The handle. Proposed from the name when blank.
            visibility:
              type: string
              enum:
              - private
              - public
              description: Defaults to `private`.
            layout_name:
              type:
              - string
              - 'null'
              description: The layout the site renders with.
            settings:
              type: object
              additionalProperties: true
              description: The site's own settings.
            required:
              type: boolean
              description: Whether members must have this site.
            position:
              type: integer
              description: Where the site sits among the company's sites.
    MemberSiteUpdateBody:
      type: object
      description: The changes. An absent field keeps its value.
      required:
      - member_site
      additionalProperties: false
      properties:
        member_site:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: The site's name.
            handle:
              type: string
              description: The handle. Changing it keeps the site's `id`.
            visibility:
              type: string
              enum:
              - private
              - public
              description: Who may see the published site.
            layout_name:
              type:
              - string
              - 'null'
              description: The layout the site renders with.
            settings:
              type: object
              additionalProperties: true
              description: The site's own settings.
            required:
              type: boolean
              description: Whether members must have this site. Only a company site can be required.
            position:
              type: integer
              description: Where the site sits among the company's sites. Only a company site can be moved.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` you last read. The change is refused with 409 if the site changed since.
    MemberSiteCopyBody:
      type: object
      description: Optional choices for a copy. The whole body may be omitted.
      additionalProperties: false
      properties:
        member_site:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: The copy's name. Defaults to "Copy of" followed by the original's name.
            handle:
              type: string
              description: The copy's handle. Proposed from the name when omitted.
    FilesPagination:
      type: object
      description: Cursor paging for a list of files.
      required:
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
    FilesMeta:
      type: object
      description: Response metadata of a list of files.
      required:
      - request_uuid
      - timestamp
      - pagination
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
        pagination:
          $ref: '#/components/schemas/FilesPagination'
    MemberSiteFile:
      type: object
      description: One file of a site.
      additionalProperties: false
      required:
      - path
      - content
      - lock_version
      - version
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        content:
          type: string
          description: The file's content. `config/settings.json`, `config/menus.json` and `config/pages.json` hold JSON documents.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Send it back as `lock_version` when writing the settings. It also changes when a page of the site is added, changed or removed, and when `config/menus.json` is written, so read the settings again before a versioned write. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: >-
            The version of the file, to send back as `version` when writing it (the request body) or removing it (the query parameter), so the change is refused with 409 if the file changed since. For an asset it is a digest of the content. For a layout, section, snippet or page file it is a digest of the draft content and of the published copy, so a publish changes it too: read the files again after publishing. For `config/menus.json` and `config/pages.json` it is a digest of the document. For `config/settings.json` it is the `lock_version` as a string, which also changes when a page is added, changed or removed and when `config/menus.json` is written.
            Treat it as opaque.
    MemberSiteFileEntry:
      type: object
      description: The metadata of one file of a site, without its content. Read the file with `GET /member-sites/{id}/files/{path}`.
      additionalProperties: false
      required:
      - path
      - kind
      - content_type
      - byte_size
      - lock_version
      - version
      - updated_at
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        kind:
          type: string
          enum:
          - layout
          - section
          - snippet
          - page
          - asset
          - settings
          - menus
          - pages
          description: What the file is.
        content_type:
          type: string
          description: The content type of the file, such as `text/x-liquid` for a layout, section, snippet or page and `text/css` for a stylesheet. `config/settings.json`, `config/menus.json` and `config/pages.json` are `application/json`.
        byte_size:
          type: integer
          minimum: 0
          description: The size in bytes of the content that reading the file returns.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: The version of the file, to send back as `version` when writing or removing it. See the `version` of a read file.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the file last changed. Null for `config/menus.json` and `config/pages.json`, which have no time of their own.
    MemberSiteFileResponse:
      type: object
      description: One site file.
      required:
      - member_site_file
      - status
      - meta
      properties:
        member_site_file:
          $ref: '#/components/schemas/MemberSiteFile'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFilesResponse:
      type: object
      description: One page of the files of a site, as metadata, sorted by path.
      required:
      - member_site_files
      - status
      - meta
      properties:
        member_site_files:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteFileEntry'
          description: The files on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/FilesMeta'
    MemberSiteFileWriteBody:
      type: object
      description: The content of a file. The path is in the URL.
      required:
      - member_site_file
      additionalProperties: false
      properties:
        member_site_file:
          type: object
          required:
          - content
          additionalProperties: false
          properties:
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The whole new content of the file. An asset must not be empty. `config/settings.json` takes a JSON object, and `config/menus.json` a JSON document of menus, and `config/pages.json` a JSON document of the site's default layout and page settings.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` of `config/settings.json` the caller last read. The write is refused with 409 if the settings changed since. Ignored for every other file. Send either this or `version`, not both.
            version:
              type: string
              maxLength: 255
              pattern: '^[^\u0000]*$'
              description: >-
                The `version` of the file the caller last read. The write is refused with 409 if the file has changed or been removed since, and nothing is written. For `config/settings.json` it is the `lock_version` as a string, and for `config/menus.json` and `config/pages.json` the digest of the document.
                Without `version` or `must_not_exist`, the write replaces whatever is at the path. Cannot be sent with `must_not_exist` or `lock_version`.
            must_not_exist:
              type: boolean
              description: Send `true` to create the file only if the path holds none. The write is refused with 409 if a file is already there, so a file another writer created since the caller listed the files is not replaced. `config/settings.json`, `config/menus.json` and `config/pages.json` always exist, so it is always refused for them. Cannot be sent with `version`.
    MemberSitePage:
      type: object
      description: One page of a site. Its content is the site file `pages/<slug>.liquid`, not part of the page.
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - position
      - published
      - layout_name
      - menu
      - lock_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The page's id. It never changes, including when the slug changes.
        slug:
          type: string
          description: The page's URL segment, unique in the site, or `/` for the home page.
        title:
          type: string
          description: Display title.
        position:
          type: integer
          description: Order of the page among the site's pages.
        published:
          type: boolean
          description: Whether the page is shown once the site is published.
        layout_name:
          type:
          - string
          - 'null'
          description: The layout this page uses, or null to use the site's default.
        menu:
          type:
          - string
          - 'null'
          description: The slug of the site's menu assigned to the page, or null for none. Menus are defined in `config/menus.json`.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Send it back as `lock_version` when changing the page (the request body) or removing it (the query parameter), to refuse the change if the page changed since it was read. It also changes when the page's content is written, through the page or through its file `pages/<slug>.liquid`, and when the page's content is published, by publishing the site or its file.
        created_at:
          type: string
          format: date-time
          description: When the page was created.
        updated_at:
          type: string
          format: date-time
          description: When the page last changed.
    MemberSitePageResponse:
      type: object
      description: One page of a site.
      required:
      - member_site_page
      - status
      - meta
      properties:
        member_site_page:
          $ref: '#/components/schemas/MemberSitePage'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitePagesResponse:
      type: object
      description: All of a site's pages, in order by position. A site holds at most 50 pages, so the list is not paged.
      required:
      - member_site_pages
      - status
      - meta
      properties:
        member_site_pages:
          type: array
          items:
            $ref: '#/components/schemas/MemberSitePage'
          description: The site's pages.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitePageCreateBody:
      type: object
      description: The new page.
      required:
      - member_site_page
      additionalProperties: false
      properties:
        member_site_page:
          type: object
          required:
          - slug
          - title
          additionalProperties: false
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
              description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. `index` is reserved for the home page.
            title:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
              description: Display title.
            position:
              type: integer
              description: Order of the page among the site's pages. Defaults to 0.
            published:
              type: boolean
              description: Whether the page is shown once the site is published. Defaults to false.
            layout_name:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The layout this page uses. Null or omitted uses the site's default.
            menu:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The slug of one of the site's own menus. A menu of another site is refused. Null or omitted assigns none.
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The page's content, kept in the site file `pages/<slug>.liquid`. Empty by default.
    MemberSitePageUpdateBody:
      type: object
      description: Changes to a page. Send at least one field besides `lock_version`.
      required:
      - member_site_page
      additionalProperties: false
      properties:
        member_site_page:
          type: object
          additionalProperties: false
          anyOf:
          - required:
            - slug
          - required:
            - title
          - required:
            - position
          - required:
            - published
          - required:
            - layout_name
          - required:
            - menu
          - required:
            - content
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
              description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. The page keeps its id, and its content moves with it.
            title:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
              description: Display title.
            position:
              type: integer
              description: Order of the page among the site's pages.
            published:
              type: boolean
              description: Whether the page is shown once the site is published.
            layout_name:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The layout this page uses. Null uses the site's default.
            menu:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The slug of one of the site's own menus. A menu of another site is refused. Null removes the page's menu.
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The page's new content. Refused with 403 for a page that uses a template the site does not own.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` you last read. The change is refused with 409 if the page changed since.
    ShareMember:
      type: object
      description: The member a share names. No contact details are returned.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The member's id.
        name:
          type:
          - string
          - 'null'
          description: The member's name. Null for a droplet, OAuth bearer or identity client token reading a sandbox twin.
    ShareMemberType:
      type: object
      description: The member type a segment share names.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The member type's id.
        name:
          type: string
          description: The member type's name.
    ShareCountry:
      type: object
      description: The country a segment share names.
      required:
      - code
      - name
      properties:
        code:
          type: string
          description: The country's ISO 3166-1 alpha-2 code.
        name:
          type: string
          description: The country's name.
    MemberSiteShare:
      type: object
      description: One audience a site is shared with, and what it may do with the site.
      required:
      - id
      - audience_kind
      - member
      - member_type
      - country
      - label
      - permission
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The share's id.
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: '`member` names one member, `downline` the downline of the member who shared the site, and `segment` the members of a member type, a country, both or, with neither, every member.'
        member:
          oneOf:
          - $ref: '#/components/schemas/ShareMember'
          - type: 'null'
          description: The member a `member` share names; null for the other kinds, and for a member who has since been deleted.
        member_type:
          oneOf:
          - $ref: '#/components/schemas/ShareMemberType'
          - type: 'null'
          description: The member type a `segment` share names, or null for any type.
        country:
          oneOf:
          - $ref: '#/components/schemas/ShareCountry'
          - type: 'null'
          description: The country a `segment` share names, or null for any country.
        label:
          type: string
          description: Who the share opens the site to, in words, such as a member's name, `Downline of Riley Kim`, `Customer in United States` or `All members`.
        permission:
          type: string
          enum:
          - view
          - copy
          description: '`view` opens the site; `copy` lets the member copy it too.'
        created_at:
          type: string
          format: date-time
          description: When the share was made.
    MemberSiteShareResponse:
      type: object
      description: One share.
      required:
      - member_site_share
      - status
