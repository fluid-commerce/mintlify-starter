                  feature_position: 0
                  layout_name: null
                  settings: {}
                  content_version: 019a2b3c-5e6f-7a7b-8c9d-0e1f2a3b4c5d
                  share_url: https://shop.example.com/home/sites/primex-launch
                  site_url: https://shop.example.com/sites/primex-launch
                  url: https://shop.example.com/sites/primex-launch
                  lock_version: 2
                  created_at: '2026-10-12T10:20:33Z'
                  updated_at: '2026-10-13T09:00:00Z'
