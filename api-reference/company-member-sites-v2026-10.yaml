        retained:
          type: boolean
          description: Whether the deployment's files are still kept, so a rollback can reach it. The 25 newest deployments and the current one are kept.
        url:
          type:
          - string
          - 'null'
          format: uri
          description: The site's public address, where its current deployment is served. Null when the company's storefront serves no member sites.
      required:
      - id
      - bundle_id
      - published_at
      - published_by
      - file_count
      - total_bytes
      - function_names
      - current
      - retained
      - url
    MemberSiteLogLine:
      type: object
      description: One line of a site's log.
      additionalProperties: false
      properties:
        at:
          type: string
          format: date-time
          description: When it happened, to the millisecond. Read on from the last line's `at` as the next `since`.
        level:
          type: string
          enum:
          - info
          - warn
          - error
          description: How serious it is.
        source:
          type: string
          enum:
          - publish
          - build
          - function
          - gateway
          description: "What wrote it. `publish` lines come from the site's bundles and `build` lines from its builds on Fluid (queued, what the build printed, and how it ended). `function` lines are the calls of the site's server functions, one each, as the sites gateway ran them: the function, the status, the time it took, who called (`page`, `public`, `key` or `schedule`) and the request id, never a body or the viewer; they are kept 7 days, the newest 1,000. Before a call's line come the lines the function printed while it ran (its console output and an uncaught error, `<function> (request <id>): <text>`, with the site's exact secret values blanked), at most 50 a call; they hold whatever the function printed, so they are read only for a caller with `application_themes.update` and `member_site_data.view`. `gateway` lines start when the sites gateway records them per site."
        message:
          type: string
          description: The line, in plain words.
      required:
      - at
      - level
      - source
      - message
    MemberSiteTraffic:
      type: object
      description: A site's traffic over a period, counted by the sites gateway.
      additionalProperties: false
      properties:
        period:
          type: string
          enum:
          - 24h
          - 7d
          - 30d
          description: The period, as whole hours up to and including the current one.
        visits:
          type: integer
          minimum: 0
          description: Pages visitors opened. A file a page loads, such as an image or a script, is not a visit.
        unique_visitors:
          type: integer
          minimum: 0
          description: An estimate of the distinct visitors, within about 1%. A visitor is a device and browser, not a person.
        top_pages:
          type: array
          description: "The most visited pages, most visited first, at most 10. A page is named as the bundle names it: a file's path, a directory with an index, a `path` route, or a `prefix` route as `<prefix>/*`, so the rest of a visitor's path, which can carry a token, is never reported."
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              visits:
                type: integer
                minimum: 0
            required:
            - path
            - visits
        referrers:
          type: array
          description: The sites visitors came from, by host, most first, at most 10. A visit with no referrer is not listed, and the storefront's site page opens a site with none, so most visits have none. Past 100 hosts in an hour, and for a host longer than 100 characters, visits count under the host `other`.
          items:
            type: object
            additionalProperties: false
            properties:
              host:
                type: string
              visits:
                type: integer
                minimum: 0
            required:
            - host
            - visits
        errors:
          type: object
          description: The site's requests answered with a client error (4xx, such as a missing file) or a server error (5xx).
          additionalProperties: false
          properties:
            4xx:
              type: integer
              minimum: 0
            5xx:
              type: integer
              minimum: 0
          required:
          - 4xx
          - 5xx
        series:
          type: array
          description: "The period charted oldest first: one point per hour for `24h`, and one per UTC day for `7d` and `30d`. A day's point counts only the period's hours, so the first and last days are partial. A point's unique visitors are estimated over its own hours, so the points need not add up to the period's."
          items:
            type: object
            additionalProperties: false
            properties:
              at:
                type: string
                format: date-time
                description: The start of the point's hour or UTC day.
              visits:
                type: integer
                minimum: 0
              unique_visitors:
                type: integer
                minimum: 0
            required:
            - at
            - visits
            - unique_visitors
        functions:
          $ref: '#/components/schemas/MemberSiteFunctionUsage'
      required:
      - period
      - visits
      - unique_visitors
      - top_pages
      - referrers
      - errors
      - series
      - functions
    MemberSiteFunctionCounts:
      type: object
      description: What a site's server functions did over a period, as the sites gateway counted it.
      additionalProperties: false
      properties:
        calls:
          type: integer
          minimum: 0
          description: "Calls the function runtime was asked to run. A call refused for the site's calls a minute is not one."
        errors:
          type: integer
          minimum: 0
          description: "Calls answered with a server error (5xx): the function's own, a function that threw (`fn_failed`), or one not deployed (`fn_not_deployed`). A timeout is not also an error."
        timeouts:
          type: integer
          minimum: 0
          description: "Calls stopped at the function's `timeoutMs` (`fn_timeout`)."
        rate_limited:
          type: integer
          minimum: 0
          description: "Calls refused because the site passed 600 calls a minute (`rate_limited`)."
        wall_ms:
          type: integer
          minimum: 0
          description: "The calls' wall time, summed, in milliseconds: from the call to the end of its answer."
        egress_bytes:
          type: integer
          minimum: 0
          description: "The bytes of the calls' answers, summed."
      required:
      - calls
      - errors
      - timeouts
      - rate_limited
      - wall_ms
      - egress_bytes
    MemberSiteFunctionUsage:
      type: object
      description: "A site's server function calls over the period, counted by the sites gateway as it runs them. Zero until the site's functions run. CPU time is not counted."
      additionalProperties: false
      properties:
        calls:
          type: integer
          minimum: 0
          description: "Calls the function runtime was asked to run. A call refused for the site's calls a minute is not one."
        errors:
          type: integer
          minimum: 0
          description: "Calls answered with a server error (5xx): the function's own, a function that threw (`fn_failed`), or one not deployed (`fn_not_deployed`). A timeout is not also an error."
        timeouts:
          type: integer
          minimum: 0
          description: "Calls stopped at the function's `timeoutMs` (`fn_timeout`)."
        rate_limited:
          type: integer
          minimum: 0
          description: "Calls refused because the site passed 600 calls a minute (`rate_limited`)."
        wall_ms:
          type: integer
          minimum: 0
          description: "The calls' wall time, summed, in milliseconds: from the call to the end of its answer."
        egress_bytes:
          type: integer
          minimum: 0
          description: "The bytes of the calls' answers, summed."
        by_function:
          type: array
          description: Each function called in the period, the most called (calls plus rate_limited) first, at most 20.
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: The function's name.
              calls:
                type: integer
                minimum: 0
                description: "Calls the function runtime was asked to run. A call refused for the site's calls a minute is not one."
              errors:
                type: integer
                minimum: 0
                description: "Calls answered with a server error (5xx): the function's own, a function that threw (`fn_failed`), or one not deployed (`fn_not_deployed`). A timeout is not also an error."
              timeouts:
                type: integer
                minimum: 0
                description: "Calls stopped at the function's `timeoutMs` (`fn_timeout`)."
              rate_limited:
                type: integer
                minimum: 0
                description: "Calls refused because the site passed 600 calls a minute (`rate_limited`)."
              wall_ms:
                type: integer
                minimum: 0
                description: "The calls' wall time, summed, in milliseconds: from the call to the end of its answer."
              egress_bytes:
                type: integer
                minimum: 0
                description: "The bytes of the calls' answers, summed."
            required:
            - name
            - calls
            - errors
            - timeouts
            - rate_limited
            - wall_ms
            - egress_bytes
        by_caller:
          type: object
          description: "The calls by who made them: `page` (the site's own page, with or without a signed-in viewer), `public` (no page token), `key` (a site API key) and `schedule` (the function's cron schedule)."
          additionalProperties: false
          properties:
            page:
              $ref: '#/components/schemas/MemberSiteFunctionCounts'
            public:
              $ref: '#/components/schemas/MemberSiteFunctionCounts'
            key:
              $ref: '#/components/schemas/MemberSiteFunctionCounts'
            schedule:
              $ref: '#/components/schemas/MemberSiteFunctionCounts'
          required:
          - page
          - public
          - key
          - schedule
      required:
      - calls
      - errors
      - timeouts
      - rate_limited
      - wall_ms
      - egress_bytes
      - by_function
      - by_caller
    MemberSiteDeploymentsResponse:
      type: object
      description: A page of a site's deployments, newest first.
      required:
      - deployments
      - status
      - meta
      properties:
        deployments:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteDeployment'
          description: The deployments on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/ListMeta'
    MemberSiteLogsResponse:
      type: object
      description: The lines of a site's log, oldest first.
      additionalProperties: false
      required:
      - logs
      - status
      - meta
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteLogLine'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteTrafficResponse:
      type: object
      description: A site's traffic.
      additionalProperties: false
      required:
      - traffic
      - status
      - meta
      properties:
        traffic:
          $ref: '#/components/schemas/MemberSiteTraffic'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteDataTable:
      type: object
      description: One table of a site's database, as the site's current bundle declares it.
      additionalProperties: false
      required:
      - name
      - columns
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          description: The table's name.
        columns:
          type: array
          description: The columns the schema declares, then the four system columns (`id`, `created_by`, `created_at`, `updated_at`).
          items:
            type: object
            additionalProperties: false
            required:
            - name
            - type
            properties:
              name:
                type: string
                description: The column's name.
              type:
                type: string
                enum:
                - text
                - integer
                - number
                - boolean
                - date
                - timestamp
                - uuid
                - json
                description: The column's type.
    MemberSiteDataTablesResponse:
      type: object
      description: The tables of a site's database.
      additionalProperties: false
      required:
      - tables
      - status
      - meta
      properties:
        tables:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteDataTable'
          description: The tables the schema declares.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteDataRowsResponse:
      type: object
      description: A page of one table's rows, newest first.
      additionalProperties: false
      required:
      - rows
      - status
      - meta
      properties:
        rows:
          type: array
          description: The rows on this page. Each is an object of the table's columns and its four system columns, with the values the sites gateway answers (`integer` above 2^53 as a string, `json` as JSON).
          items:
            type: object
            additionalProperties: true
        status:
          type: integer
          description: The HTTP status.
        meta:
          type: object
          additionalProperties: false
          required:
          - request_uuid
          - timestamp
          - pagination
          properties:
            request_uuid:
              type:
              - string
              - 'null'
              description: Request correlation identifier.
            timestamp:
              type: string
              format: date-time
              description: When the response was built.
            pagination:
              type: object
              additionalProperties: false
              required:
              - limit
              - offset
              - count
              properties:
                limit:
                  type: integer
                  description: The rows asked for per page.
                offset:
                  type: integer
                  description: The rows skipped.
                count:
                  type: integer
                  minimum: 0
                  description: The rows the table holds.
    MemberSiteDataDeleted:
      type: object
      description: The rows a delete removed.
      additionalProperties: false
      required:
      - deleted
      - status
      - meta
      properties:
        deleted:
          type: array
          items:
            type: string
          description: The ids of the rows the table had and the call deleted. An id with no row is not listed.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteBranchResponse:
      type: object
      description: One branch.
      required:
      - branch
      - status
      - meta
      properties:
        branch:
          $ref: '#/components/schemas/MemberSiteBranch'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteEnvVar:
      type: object
      description: One environment variable of a site. The site's server functions receive every variable, secret or not, by name in `ctx.secrets`. A secret's value is stored encrypted and never read back, so it is null here.
      additionalProperties: false
      required:
      - name
      - secret
      - value
      - created_at
      - updated_at
      properties:
        name:
          type: string
          pattern: '^(?!FLUID_)[A-Z][A-Z0-9_]{0,63}$'
          description: The variable's name, unique on the site.
        secret:
          type: boolean
          description: Whether the value is secret. A secret's value is never returned.
        value:
          type:
          - string
          - 'null'
          description: The value, or null when the variable is secret.
        created_at:
          type: string
          format: date-time
          description: When the variable was first set.
        updated_at:
          type: string
          format: date-time
          description: When the variable was last set.
    MemberSiteApiKey:
      type: object
      description: One live API key of a site. Its secret is never here; the answer that added it carried it once.
      additionalProperties: false
      required:
      - id
      - name
      - prefix
      - last_used_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The key's id, which a function sees as `ctx.caller.keyId`.
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: The name the key is known by, which a function sees as `ctx.caller.keyName`.
        prefix:
          type: string
          pattern: '^fsk_[A-Za-z0-9_-]{8}$'
          description: The first 12 characters of the secret, to recognise it by.
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a call last carried the key, to the hour, or null when none has.
        created_at:
          type: string
          format: date-time
          description: When the key was added.
    MemberSiteApiKeysResponse:
      type: object
      description: A site's live API keys, oldest first.
      required:
      - api_keys
      - status
      - meta
      properties:
        api_keys:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteApiKey'
          description: The site's live keys. A site has at most 20, so the list is not paged.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteApiKeyCreatedResponse:
      type: object
      description: The key just added, with its secret.
      required:
      - api_key
      - status
      - meta
      properties:
        api_key:
          type: object
          description: The key, and its secret, which is never shown again.
          additionalProperties: false
          required:
          - id
          - name
          - prefix
          - last_used_at
          - created_at
          - secret
          properties:
            id:
              type: string
              format: uuid
              description: The key's id.
            name:
              type: string
              description: The key's name.
            prefix:
              type: string
              description: The first 12 characters of the secret.
            last_used_at:
              type: 'null'
              description: Always null for a new key.
            created_at:
              type: string
              format: date-time
              description: When the key was added.
            secret:
              type: string
              pattern: '^fsk_[A-Za-z0-9_-]{43}$'
              description: 'The key. Store it now; it cannot be read back. Send it as `Authorization: Bearer <secret>`.'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteApiKeyBody:
      type: object
      description: The new key's name, unwrapped. Any other field is refused.
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          description: The name, 1 to 64 characters after trimming.
    MemberSiteEnvVarsResponse:
      type: object
      description: A site's environment variables, by name.
      required:
      - env_vars
      - status
      - meta
      properties:
        env_vars:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteEnvVar'
          description: The site's variables. A site has at most 64, so the list is not paged.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteEnvVarResponse:
      type: object
      description: One environment variable.
      required:
      - env_var
      - status
      - meta
      properties:
        env_var:
          $ref: '#/components/schemas/MemberSiteEnvVar'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteEnvVarBody:
      type: object
      description: The value of a variable and whether it is secret, unwrapped. Any other field is refused.
      additionalProperties: false
      required:
      - value
      - secret
      properties:
        value:
          type: string
          minLength: 1
          description: The value, 1 to 5,120 bytes of text.
        secret:
          type: boolean
          description: Whether the value is secret. Set true for API keys and passwords; the value is then never read back.
    MemberSitePostedUpdate:
