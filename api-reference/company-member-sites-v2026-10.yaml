        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationError'
        '403':
          description: The caller lacks the permission, or has no signed-in admin.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
