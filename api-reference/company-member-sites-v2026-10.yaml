                  access:
                    declared: false
                    uses: []
                  visibility: private
                  status: draft
                  taken_down_at: null
                  required: false
                  position: 0
                  featured: false
                  feature_position: null
                  layout_name: null
                  settings: {}
                  content_version: 019a2d5e-7a8b-7c9d-8e0f-2a3b4c5d6e7f
