    get:
      operationId: companyMemberSitesVersions
      x-fluid-audience: company
      summary: List a site's versions
      description: The versions of any site of the company, a company site or a member's, newest first. Each publish of the site, and each restore, is saved to its history as a version. Listing changes nothing. A site that was never published has no history yet and answers 409. Needs `application_themes.view`. A company API token can list; a droplet token needs the `website` scope and an installation role that grants `application_themes.view`. For a droplet reading a sandbox test company, a message's admin name is replaced with `Admin`.
      tags:
      - member-sites
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/VersionLimit'
      responses:
        '200':
          description: The site's versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteVersionsResponse'
              example:
                versions:
                - sha: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1
                  short_sha: b2c3d4e
                  message: 'Patrick Owner: Publish site · 2026-10-30 12:00:00'
                  committed_at: '2026-10-30T12:00:00Z'
                  current: true
                current_sha: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1
                syncing: false
                sync_failing: false
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-30T14:05:12Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The site has no history yet, or its history is not connected yet. `error.details.error` is `not_provisioned` or `not_connected`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The limit is not an integer from 1 to 100, or the query holds an unknown parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
