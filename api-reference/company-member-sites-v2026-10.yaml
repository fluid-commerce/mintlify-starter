  /api/company/v2026-10/member-sites/{id}/branches:
    get:
      operationId: companyMemberSiteBranchesList
      x-fluid-audience: company
      summary: List a site's branches
      description: The branches of one site, company-owned or member-owned, oldest first. A site has at most one branch, so the list is not paged. A credential with no user, such as a company API token, can read. Needs `application_themes.view`. Once member sites are enabled, a droplet installation token and an OAuth client token are refused with 403 whatever their scopes; while they are not, one with the scope the route needs gets 404 first.
      tags:
      - member-site-branches
