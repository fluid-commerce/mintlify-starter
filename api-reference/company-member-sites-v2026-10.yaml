  /api/company/v2026-10/member-sites/{id}/data/{table}:
    get:
      operationId: companyMemberSiteDataRows
      x-fluid-audience: company
      summary: Read the rows of a table of a site's database
      description: |
        A page of one table's rows, newest first, with the table's row count. The sites gateway reads them as the admin, with no table rule applied. Every call is logged with the admin, the site and the table, before the gateway is asked.

        Needs `member_site_data.view`, the permission to read what members wrote, `application_themes.view`, the permission of the site detail page, and a signed-in admin. An admin who edits themes but was never given `member_site_data.view` is refused with 403; a company grants it to the roles that moderate. A site of any owner in the company is served, a member's included, because a company admin oversees a member's site: reading and deleting what its members wrote is the moderation the member sites contract provides. It answers 404 for every caller that passes those checks when the site has no active database, when its schema has no such table, and until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-data
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: table
        in: path
        required: true
        description: The table's name, as the tables route lists it.
        schema:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Rows per page. Default 25, maximum 100.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
        example: 0
        description: Rows to skip. Default 0.
      responses:
        '200':
          description: A page of rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteDataRowsResponse'
              example:
                rows:
                - id: 0199537f-0000-7000-8000-0000000000a1
                  title: Hello
                  created_by: '42'
                  created_at: '2026-11-05T10:00:00.000Z'
                  updated_at: '2026-11-05T10:00:00.000Z'
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:05:00Z'
                  pagination:
                    limit: 25
                    offset: 0
                    count: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site has no active database, the schema has no such table, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A `limit` outside 1 to 100, an `offset` outside 0 to 1,000,000, another query key, or a request the sites gateway refused as `validation`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The sites gateway could not complete the call, because it was unreachable or refused, or answered with something unexpected. `details.error` names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: The sites gateway did not answer in time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: companyMemberSiteDataDelete
      x-fluid-audience: company
      summary: Delete rows of a table of a site's database
      description: |
        Deletes the rows the `ids[]` query parameters name, as the admin, with no table rule applied. The answer lists the ids of the rows the table had and the call removed; an id with no row is left out, so sending the same delete again is safe. Rows are never inserted or changed through this API. Every call is logged with the admin, the site, the table and the ids, before the gateway is asked.

        Needs `member_site_data.delete`, the permission to delete what members wrote, `application_themes.view`, the permission of the site detail page, and a signed-in admin. An admin who edits themes but was never given `member_site_data.delete` is refused with 403, and reading rows does not allow deleting them. A site of any owner in the company is served, a member's included, because a company admin oversees a member's site: reading and deleting what its members wrote is the moderation the member sites contract provides. It answers 404 for every caller that passes those checks when the site has no active database, when its schema has no such table, and until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
