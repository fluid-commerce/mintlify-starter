                    display_name: Riley Rep
                  copied_from_id: null
                  access:
                    declared: false
                    uses: []
                  visibility: private
                  status: draft
                  taken_down_at: null
                  company_lock: none
                  made_private_at: null
                  made_private_by_user_id: null
                  required: false
                  position: 0
                  featured: false
                  feature_position: null
                  layout_name: null
                  settings: {}
                  content_version: 019a2c4d-6f7a-7b8c-9d0e-1f2a3b4c5d6e
                  share_url: https://shop.example.com/sites/riley-shop
