    post:
      operationId: companyMemberSiteBundlesCreate
      x-fluid-audience: company
      summary: Start a bundle upload for a company site
      description: |
        Starts publishing a company site as a built static bundle. Rails assigns the bundle id, checks the files against the limits and the content-type allowlist (each route against the files), the access declaration, `schema` and `meta`, records the bundle as uploading for 60 minutes, and asks the sites gateway for signed PUT URLs for the blobs the site does not store yet. Upload each blob to its URL, then publish the bundle. Nothing is served until it is published, and the site's current version keeps serving. A site may have 5 uploads in progress at once, each lasting 60 minutes, so an older upload on another device keeps working; a start finds failed and expired uploads deleted, and a sixth is refused with 409 until one finishes or expires. Published bundles are kept and do not count.

        Needs `application_themes.update` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403. A gateway that cannot prepare the uploads is a 502; the bundle is then failed, and starting again makes a new one. A 409 also answers a site already at its 5 uploads in progress.
      tags:
      - member-site-bundles
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteBundleStartBody'
            example:
              files:
                "/index.html":
                  sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  crc32c: N67uMw==
                  size: 1832
                  contentType: text/html; charset=utf-8
                "/assets/app-3f2a9c.js":
                  sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  crc32c: n03x6A==
                  size: 48211
                  contentType: text/javascript; charset=utf-8
                  immutable: true
      responses:
        '201':
          description: The bundle, and the uploads it still needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBundleStarted'
              example:
                bundle: 0199537f-0000-7000-8000-000000000004
                uploads:
                - sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  crc32c: n03x6A==
                  url: https://storage.googleapis.com/fluid-production-member-sites/sites/0199537f-0000-7000-8000-000000000001/blobs/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Expires=3600&X-Goog-Signature=5f1e
                  headers:
                    x-goog-content-length-range: 48211,48211
                    x-goog-if-generation-match: '0'
                    x-goog-hash: crc32c=n03x6A==
                expiresAt: '2026-11-05T11:00:00.000Z'
                status: 201
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site already has 5 uploads in progress (`details.error` is `uploads_in_progress`), so nothing was saved and the gateway was not asked; finish one or wait for one to expire, 60 minutes after it started. Or the bundle was gone when the gateway answered, because its site was deleted (`superseded`), and no upload URLs are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                uploads-in-progress:
                  summary: The site's fifth upload is still in progress
                  value:
                    error:
                      message: This site already has 5 uploads in progress; finish or wait for one to expire
                      details:
                        error: uploads_in_progress
                    status: 409
                    meta:
                      request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                      timestamp: '2026-11-05T10:00:00Z'
                superseded:
                  summary: The bundle was gone when the gateway answered
                  value:
                    error:
                      message: This upload is gone, so it cannot be published
                      details:
                        error: superseded
                    status: 409
                    meta:
                      request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                      timestamp: '2026-11-05T10:00:00Z'
        '422':
          description: The request fails its contract, and nothing was started. `details.error` names the problem and `details.path` the value that has it. `reserved_path` is a path under `/_fluid/`, `invalid_path` a path that is not absolute and normalised, `content_type_not_allowed` and `content_type_mismatch` a file outside the allowlist or with the wrong type, `unknown_file` a route, or the default `/index.html` route of a request with no `routes`, to a file the request lacks, `invalid_shape` or `out_of_range` under `functions` an entry that breaks its contract, `unknown_field`, `unknown_family`, `session_not_declarable` and `repeated_entry` an entry of the `access` declaration that is not a member field or scope the site may declare, names the `session` family, or is listed twice, `inconsistent` two paths of one `sha256` that declare different `crc32c` values, `out_of_range` a limit exceeded (2,000 files, 25 MiB a file, 250 MiB a bundle), and `invalid_shape` or `invalid_format` a field of the wrong kind or form, including a `schema` or `meta` that breaks its contract (`details.path` starts at `schema` or `meta`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The sites gateway could not prepare the uploads, because it was unreachable, timed out or answered with something unexpected. `details.error` names which. The bundle is failed; start again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/git-credential:
    post:
      operationId: companyMemberSiteGitCredentialCreate
      x-fluid-audience: company
      summary: Get a Git credential for a company site's source
      description: |
        A short-lived credential for the GitHub repository a company site keeps its source in, so a builder such as the Fluid CLI can clone, pull and push it with plain git. `remote_url` is an HTTPS remote that carries a token limited to that one repository, with read and write access to its contents; it expires at `expires_at`, about an hour later, so ask again for each command rather than storing it. `repo` is the repository's `owner/name`, and `branch` is the git branch the site's source is on: `main`, or for a branch of a site its slug, on its parent's repository. To publish an earlier version of a site, check out its commit, build it and publish the bundle. The response is never cached (`Cache-Control: private, no-store`).

        A site with no repository yet has one made from the static site template, and the request answers 409 `repo_not_ready` until GitHub has made it; ask again shortly. When the repository could not be made (no GitHub organization has room for it, or GitHub refused to create it), the request answers 503 `repo_unavailable` instead: stop asking and publish again later. Each request asks for the repository again without waiting for GitHub, so a later one succeeds once it can be made. The first bundle upload of a site makes its repository too.

        Needs `application_themes.update` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-bundles
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: The credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteGitCredentialResponse'
              example:
                git_credential:
                  remote_url: https://x-access-token:ghs_example@github.com/Fluid-WeCommerce/site-42.git
                  expires_at: '2026-11-10T11:00:00Z'
                  repo: Fluid-WeCommerce/site-42
                  branch: main
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-10T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The site's repository is not usable. `details.error` is `repo_not_ready` while it is being made (ask again shortly) or `repo_disconnected` when it was disconnected for good.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The site, or the parent of a branch, was taken down (`details.error` is `site_taken_down`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub could not issue the credential (`details.error` is `github_unavailable`). Ask again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The site's repository could not be made (`details.error` is `repo_unavailable`), because no GitHub organization has room for it or GitHub refused to create it. The request asked for it again; publish again later rather than retrying at once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/member-sites/{id}/bundles/{bundle_id}/publish:
    post:
      operationId: companyMemberSiteBundlesPublish
      x-fluid-audience: company
      summary: Publish a company site's bundle
      description: |
        Makes an uploaded bundle the company site's current version. It runs inside this one request: Rails asks the sites gateway to verify every blob, checks the manifest, has the gateway plan the manifest's database `schema`, asks the gateway to write the manifest, has the gateway apply the schema, and then, in one transaction, gives the site its frame label if it has none, marks the bundle published and points the site at it. A site's `visibility` never changes. A site with no `schema` skips the schema step. The gateway plans the change from the schema the site's database holds, which its placement records, to the new one (C-L34): a change that drops, renames or retypes a table or column, or makes a column required, applies only when a migration of the schema names it and `confirmMigrations` holds that migration's id. Without the ids the publish is refused with `422` (`destructive_change_unconfirmed`, `details.unconfirmed` lists the ids) and applies nothing; the bundle stays uploading, so the same publish sent again with the ids needs no new upload. The manifest is written before the schema is applied, so a manifest the gateway cannot write changes nothing, and the manifest of a bundle that is not the current one is never served. The schema is applied before the pointer switches, and a failed apply leaves the old bundle current. Once the schema is applied the placement records it, and a later failure of the publish (the site was taken down, say) leaves the bundle uploading: sending the same publish again is planned from that schema, applies nothing more, and goes on, and a publish of a different schema is planned from it too. A schema is at most 1 MiB as UTF-8 JSON, migrations included, and no JSON value in it nests deeper than 1,000 levels (each array or object counts, an empty innermost one included).

        A failed step marks the bundle failed and publishes nothing, and the current version keeps serving; start a new bundle to try again. A step that runs out of time (the whole publish has 27 seconds) is a `504` with `publish_timeout`: the bundle stays uploading, the current version keeps serving, and sending the same publish again is safe and finishes what was started. Sending a publish again after it finished, because its answer was lost, is also safe: a bundle that is published and is the site's current version answers the same `200`, with no gateway call and no change.

        Needs `application_themes.update` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company, and for a bundle that is not the site's. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-bundles
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: bundle_id
        in: path
        required: true
        description: The bundle's id, as the start of its upload answered it.
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteBundlePublishBody'
            example:
              confirmMigrations:
              - 2026-11-05-drop-notes
      responses:
        '200':
          description: The bundle is the site's current version. A publish repeated after it finished answers the same.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBundleCurrent'
              example:
                bundle:
                  id: 0199537f-0000-7000-8000-000000000004
                  manifestSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                url: https://shop.example.com/sites/primex-launch
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, the bundle is not the site's, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The bundle can no longer be published and nothing changed. `details.error` is `superseded` (a newer start deleted it, or another publish of the site changed its database after this one planned its schema change or before it switched; the bundle stays uploading, so send the same publish again and it is planned anew), `schema_change_pending` (another upload's change to the site's database may have run and is not recorded yet; `details.pendingBundle` is that upload's id, and the message says to send it again to finish it, after which this publish can be sent again; nothing was applied and the bundle stays uploading), `copy_in_progress` (the copied bundle's background file transfer or the branch's database copy has not completed; it stays uploading and the same publish may be retried), `not_uploading` (it failed, or is published and no longer the site's current version, as after a rollback), or `frame_label_taken` (another site took the frame label at the same moment; send the publish again).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: A newer start replaced this upload
                  details:
                    error: superseded
                status: 409
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
        '422':
          description: Nothing was published. `details.error` is `blobs_not_verified` (a blob is missing or differs from the one pinned; `details.problems` lists each with its `path`, `sha256` and `problem`), `functions_not_available` (the bundle has server functions and this Fluid environment does not run functions yet; the bundle stays uploading, so the same publish can be sent again once it does), a contract code for a manifest that fails its checks (as the start names them, with `details.path`), `no_database` (the manifest has a `schema` and the site's database was destroyed; a site with none gets one on its first schema publish), `destructive_change_unconfirmed` (C-L34; a migration that drops, renames or retypes a table or column, or makes a column required, is not in `confirmMigrations`; `details.unconfirmed` lists the ids, and the bundle stays uploading so the publish can be sent again with them confirmed), `validation` (C-L34; the schema is over 1 MiB as compact UTF-8 JSON, with `details.bytes` and `details.limit`, or nests deeper than 1,000 levels, with `details.limit` 1000, and `details.cause` says which; or the gateway cannot plan the change, such as a drop no migration names, and `details.cause` holds its reasons, with the `table` and `column`) or `unique_violation` (rows break a unique set the schema adds), `expired` (the upload expired, unless a publish of this bundle already applied its schema to the site's database, in which case it is published when the publish is sent again), `taken_down` (a company admin took the site down, and a publish never lifts that), or, for the body, `invalid_shape` (a key other than `confirmMigrations`, with `details.path` naming it; or a `confirmMigrations` that is not a list, null included, or holds a non-string) and `out_of_range` (an id of fewer than 1 or more than 100 characters, with `details.path` naming its place). The body is checked before anything else, so a bad body changes nothing. All but `taken_down`, `destructive_change_unconfirmed` and the body errors also mark the bundle failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The sites gateway could not complete a step, because it was unreachable or refused, or answered with something unexpected. `details.error` names which. The bundle is failed; start again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: "`publish_timeout`. The publish ran out of time. The bundle is still uploading and the current version keeps serving. Send the same publish again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: The publish ran out of time; send it again
                  details:
                    error: publish_timeout
                status: 504
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
  /api/company/v2026-10/member-sites/{id}/bundles/{bundle_id}/current:
    post:
      operationId: companyMemberSiteBundlesMakeCurrent
      x-fluid-audience: company
      summary: Make an earlier bundle of a company site current (roll back)
      description: |
        Points the company site back at a bundle that was published before, so its files are served again. Nothing is uploaded and the sites gateway is not asked: the bundle's blobs and manifest are stored already. A bundle that was published after the current one can be made current the same way, which rolls forward again. The site's `status`, `visibility` and frame label do not change.

        Making the site's current bundle current again is safe: it answers the same `200`, with no change, so a request whose answer was lost can be sent again. A bundle that is uploading or failed was never published and is refused with `422` (`not_published`). A published bundle that is older than the site's 25 newest published versions and is not its current one is refused with `422` (`not_retained`), because the daily clean-up deletes the files of older versions. A bundle whose manifest has a database `schema` is refused with `422` (`no_database`), because restoring a site's database is not available yet. A site that was taken down is refused with `422` (`taken_down`): a rollback never lifts a take-down.

        Needs `application_themes.update` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company, and for a bundle that is not the site's. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-bundles
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: bundle_id
        in: path
        required: true
        description: The bundle's id, as the start of its upload answered it.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The bundle is the site's current version. Making the current bundle current again answers the same.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteBundleCurrent'
              example:
                bundle:
                  id: 0199537f-0000-7000-8000-000000000004
                  manifestSha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                url: https://shop.example.com/sites/primex-launch
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token, which are refused whatever their scopes once member sites are enabled.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, the bundle is not the site's, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Nothing changed. `details.error` is `not_published` (the bundle is uploading or failed), `not_retained` (the bundle is older than the site's 25 newest published versions and is not its current one), `no_database` (the manifest has a `schema`, which cannot be restored yet) or `taken_down` (the site was taken down).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Only a published bundle can be made current
                  details:
                    error: not_published
                status: 422
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:00:00Z'
  /api/company/v2026-10/member-sites/{id}/builds:
    post:
      operationId: companyMemberSiteBuildsCreate
      x-fluid-audience: company
      summary: Build a company site on Fluid
      description: |
        Builds a company site from its source on Fluid, so no Node is needed on the caller's machine, and publishes the result. Send the project's source files inline (`files`) or a ref of the site's own repo (`ref`). Fluid queues the build and answers 202 at once; an isolated box then finds the framework (Vite, Astro, Next.js static export and the others `fluid deploy` knows, or plain HTML), installs with the project's package manager (npm, pnpm or Yarn; Bun projects install with npm), runs its `build` script and publishes the output as a bundle through the same checks as the bundles routes. Read the build until it is `succeeded`, with the site's `url`, or `failed`, with why and its log.

        A box may reach only the npm and Yarn registries, Fluid's API and the storage host uploads go to, and runs for at most 15 minutes. A site has one build going at a time and a company three.

        Needs `application_themes.update` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403. Where builds are not set up yet the answer is 422 with `details.error` `builds_not_configured`: build locally and start a bundle instead.
      tags:
      - member-site-builds
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSiteBuildCreateBody'
            example:
              files:
                package.json:
                  content: '{"scripts":{"build":"vite build"},"devDependencies":{"vite":"^6.0.0"}}'
                index.html:
                  content: <div id="app"></div><script type="module" src="/src/main.ts"></script>
