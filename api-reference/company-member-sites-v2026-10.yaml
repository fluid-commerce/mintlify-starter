            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: companyMemberSitePostedUpdateCreate
      x-fluid-audience: company
      summary: Post an update on a site
      description: |
        Posts a short line on a company site or on a member's site. Every member whose menu lists the site gets it on their bell, and the poster's `push` flag is kept with it. The line is trimmed, then must be 1 to 240 characters. With `push`, each member it reaches also gets a push. A site takes at most 10 updates an hour.

        Needs `application_themes.update` and a signed-in admin. A site of any owner in the company is served, a member's included, because a company admin oversees a member's site. It answers 404 until member sites are enabled for the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-updates
      parameters:
      - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSitePostedUpdateBody'
            example:
              text: New bundles are in the shop
              push: false
      responses:
        '201':
          description: The update was posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSitePostedUpdateResponse'
              example:
                site_update:
                  id: 0192f4e5-9c01-7b8c-9d0e-1f2a3b4c5d90
                  site_id: 0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67
                  text: New bundles are in the shop
                  push: false
                  created_at: '2026-11-10T09:00:00.000Z'
                status: 201
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-10T09:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The signed-in user is not a company admin (a rep, say), the caller lacks the permission, there is no signed-in admin, or it is a droplet installation token or an OAuth client token, which are refused whatever their scopes.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, or member sites are not enabled for this company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            This request posted nothing. Either the line is the same, once trimmed, as the site's latest update from the last 10 minutes, whoever posted it: `error.details.reason` is `["duplicate_update"]` and `error.details.site_update_id` names that update, which may be this poster's own earlier request whose answer was lost. If that update has reached no one yet, its delivery is queued again. Or another update on the site was being posted and held it for more than 5 seconds; try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The `text` is missing, blank, or longer than 240 characters once trimmed, `push` is not a boolean, or the body holds another field. Also 422 when nobody but the poster could get the update because of the site's own state (a draft, a suspended, locked or turned-off site, or a site with no share and no other owner to tell): `error.details.reason` is `["site_not_visible"]` and the message is "Nobody else can see this site yet. Publish or share it first." A site others can see whose shares happen to match no one is still posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            The site has had 10 updates in the last hour, counted per site whoever posted them, and nothing was posted: `error.details.reason` is `["too_many_updates"]`, and `error.details.retry_after_seconds` and the `Retry-After` header give the seconds until the oldest of them is an hour old.
