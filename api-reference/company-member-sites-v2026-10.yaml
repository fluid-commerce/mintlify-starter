      description: Creates the file, or replaces its content, on a company site. Send the `version` of the file you read to refuse the write with 409 if the file changed or was removed since, or `must_not_exist` to create a file only if the path is free; without either the write replaces whatever is there, so the last write wins, except that a write of `config/menus.json` without `version` is refused with 409 while the site's menus hold a translated item title. The check and the write are one step, so a write that loses a race changes nothing. A page's file must already exist; add the page first. Writing `config/menus.json` replaces all of the site's menus, writing `config/pages.json` adds, changes and removes pages to match it and sets the site's default layout (a page added this way starts with an empty file), and writing `config/settings.json` replaces its settings. Writing `config/access.json` sets the site's draft access declaration and is refused with 422 when the declaration is not valid. Layouts, sections, snippets and pages are saved as drafts until the site is published. Assets must be css, js, json, txt or html text files. A member's site is refused with 403. Needs `application_themes.update` and a signed-in admin.
