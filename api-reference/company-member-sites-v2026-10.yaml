  /api/company/v2026-10/member-sites/{id}/deployments:
    get:
      operationId: companyMemberSiteDeploymentsList
      x-fluid-audience: company
      summary: List a site's deployments
      description: |
        The deployments of one site, newest first: each bundle that was published, with who published it, how many files it holds, their total size, whether the site serves it now (`current`) and whether a rollback can still reach it (`retained`). An upload that was never published is not a deployment; the bundle list shows those. Roll back with the bundle's `current` operation and the deployment's `bundle_id`.

        Needs `application_themes.view` and a signed-in admin. A member's site is served to a company admin who holds a kept admin row, and refused with 404 to a root admin who holds none and when its owner was discarded, as on the bundle list. It answers 404 for every caller that passes those checks until the sites gateway is released to the company. A droplet installation token and an OAuth client token are refused with 403.
      tags:
      - member-site-hosting
      parameters:
      - $ref: '#/components/parameters/SiteId'
      - name: page[cursor]
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from `meta.pagination.next_cursor` or `prev_cursor`. Do not construct or decode it.
      - name: page[limit]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Deployments per page. Default 25, maximum 100.
      responses:
        '200':
          description: A page of deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSiteDeploymentsResponse'
              example:
                deployments:
                - id: 0199537f-0000-7000-8000-000000000005
                  bundle_id: 0199537f-0000-7000-8000-000000000005
                  published_at: '2026-11-05T10:02:00.000Z'
                  published_by: Pat Admin
                  file_count: 12
                  total_bytes: 482113
                  function_names:
                  - rsvp
                  current: true
                  retained: true
                  url: https://shop.example.com/sites/primex-launch
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-11-05T10:05:00Z'
                  pagination:
                    cursor: null
                    limit: 25
                    prev_cursor: null
                    next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller lacks the permission, has no signed-in admin, or is a droplet installation token or an OAuth client token.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthorizationError'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such site in this company, the site is a member's and the caller is a root admin with no kept admin row or its owner was discarded, or the sites gateway is not released to this company.
          content:
            application/json:
              schema:
