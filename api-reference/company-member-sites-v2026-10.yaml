      schema:
        type: string
    EnvVarName:
      name: name
      in: path
      required: true
      description: 'The variable''s name: a capital letter, then up to 63 capital letters, digits and underscores, not starting with `FLUID_`.'
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]+$'
    ShareId:
      name: share_id
      in: path
      required: true
