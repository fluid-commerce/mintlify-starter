        reasons:
          type: array
          description: Why, one entry for each need found, or why a site fits.
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - message
            properties:
              code:
                type: string
                description: '`custom_domain`, `server_rendering` or `heavy_functions` for an app; `static_site` or `converts_later` for a site.'
              message:
                type: string
                description: The reason in plain words.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteBundleCurrent:
      type: object
      description: The site's current version after a publish, and its public address.
      additionalProperties: false
      required:
      - bundle
      - url
      - status
      - meta
      properties:
        bundle:
          type: object
          additionalProperties: false
          required:
          - id
          - manifestSha256
          properties:
            id:
              type: string
              format: uuid
              description: The bundle's id.
            manifestSha256:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: The SHA-256 of the manifest the gateway wrote, which an access decision names.
        url:
          type:
          - string
          - 'null'
          format: uri
          description: The site's absolute public address, `https://<storefront>/sites/<handle>`, where the bundle is now served; print it after a deploy. Null when the company's storefront serves no member sites.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteDeployment:
      type: object
      description: One deployment of a site, a bundle that was published. Rolling back to it is the bundle's `current` operation, with `bundle_id`.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The deployment's id, the same as its `bundle_id`.
        bundle_id:
          type: string
          format: uuid
          description: The id of the published bundle, which the bundle operations take.
        published_at:
          type: string
          format: date-time
          description: When the bundle was published.
        published_by:
          type:
          - string
          - 'null'
          description: The name of the admin who published it. Null when that account is gone or has no name, and for a caller without `company_admins.view`.
        file_count:
          type: integer
          minimum: 0
          description: How many files the bundle holds.
        total_bytes:
          type: integer
          minimum: 0
          description: The size of the bundle's files together, in bytes.
        function_names:
          type: array
          items:
            type: string
