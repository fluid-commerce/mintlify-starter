---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Member Sites
  description: |
    How company admins oversee member sites: every site in the company, whether
    the company or one of its members owns it. Admins create and change
    company sites, take any site down so its owner cannot publish it again,
    delete any site with its pages, and copy any site into a new company site.
    An admin also builds a company site as a member builds their own: its files
    and pages are written, and the site is published, through the routes below.
    The routes for a site's files, pages, publishing and changes serve company
    sites only: for a member's site every one of them, reads included for files
    and pages, is refused with 403, because they belong to its owner.
    An admin oversees a member's site through the site routes: list, read, take
    down, delete and copy. Changing a member's site is refused with 403 as well.

    An admin also sees and manages who a site is shared with. The shares of any
    site in the company are listed and deleted here, and the shares of a company
    site are created and changed. Sharing a member's site is the member's to do,
    and is refused with 404, as a site an admin may not manage; sharing with a
    member's downline is refused with 422. A
    share names its audience by name and never by email address. No route lists
    the sites members removed from their own menus.

    An admin also features sites. A featured site is listed first, in the
    company's order, in the menu of every member it is shared with; featuring a
    site shares it with no one, and writes nothing to the site, so a member's
    site keeps its version and its history. A draft, a taken-down site, a
    discarded owner's site and a branch are not featured. A company features at
    most 20 sites. A signed-in admin is needed to feature, unfeature or order
    them, and a credential with no user can list them.

    A site is addressed by its `id`, which is its `uuid_v7`. The owner of a
    member site is summarized by the member's id and display name; no contact
    details are returned.

    A signed-in admin needs the `application_themes.view` permission to read
    and `application_themes.update` to write, the permissions the theme
    endpoints use. A droplet installation token reads with the `website`
    scope, which droplet authentication grants for the theme permissions;
    on a sandbox twin it gets the owner's display name as null. Every route
    also needs the `MEMBER_SITES` company flag, and a company without it gets
    404 on every route. Writes act as the signed-in admin, so a credential
    with no user, such as a company API token or a droplet token, can read
    sites and the pages of a company site, but not write; a company API token
    can also read the shares of a site, which a droplet token never can: a share
    names members, so every share route answers a droplet token, and an OAuth
    client token whatever its scopes, with 403. Files, which hold a
    site's code, are read through the signed-in admin too: such a credential
    gets 403 on them.

    An admin also sees and manages a site's branch: a private copy of a
    published site, made to try a change, that only its owner and company
    admins can open. The branch of any site in the company is listed, read and
    deleted here, and the branch of a company site is created. Branching a
    member's site is the member's to do, and is refused with 404, as a site an
    admin may not edit. A branch is a site of its own, left out of the site
    list, whose files, pages and publishing are served here for a company
    site's branch only. A credential with no user, such as a company API token,
    can read branches but not write them. Once member sites are enabled for
    the company, every branch route answers a droplet token, and an OAuth
    client token whatever its scopes, with 403. While they are not enabled the
    route answers 404 first to a droplet token with the `website` scope and to
    an OAuth client token with the scopes the route needs, as it does to every
    other credential; a token without those scopes is refused with 403 either
    way.

    The preview routes show a company site's draft to the admin who builds it,
    through the same renderer that serves the site's published pages. They answer
    with a page's HTML or a file's text, not the JSON envelope, and need a
    signed-in admin with `application_themes.view`. Every response of theirs, a
    refusal included, carries the frame's sandbox policy and is `private,
    no-store` and `noindex`. An Identity client token is refused with 403 on
    them, whatever its scopes. A member's site is the same empty 404 as a
    missing one, because an admin never sees a member's draft or files.
  version: 2026-10
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: member-sites
  description: Member sites in your company, for admins to oversee.
  x-fluid-section: Members
- name: member-site-files
  description: 'The files of a site: layouts, sections, snippets, assets, page content, settings and menus.'
  x-fluid-section: Members
- name: member-site-pages
  description: The pages of a site.
  x-fluid-section: Members
- name: member-site-shares
  description: Who a site is shared with.
  x-fluid-section: Members
- name: member-site-branches
  description: The branch of a site, a private copy made to try a change.
  x-fluid-section: Members
- name: member-site-features
  description: The sites the company features, so the members they are shared with see them first.
  x-fluid-section: Members
- name: member-site-preview
  description: The draft of a company site, rendered as it will be served once published, for its builder's own tools.
  x-fluid-section: Members
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: A company admin credential for your company, or a droplet installation token with the `website` scope for reads, except on the share routes, which refuse a droplet token.
  headers:
    PreviewContentSecurityPolicy:
      description: The frame's sandbox policy, `frame-ancestors 'self'; sandbox allow-scripts allow-forms`. It never allows the same origin, so the document has an opaque origin wherever it is shown. Sent on every preview response, a refusal included.
      schema:
        type: string
        example: "frame-ancestors 'self'; sandbox allow-scripts allow-forms"
    PreviewCacheControl:
      description: Always `private, no-store`. A draft is read by its builder only, so no cache keeps or replays it. Sent on every preview response, a refusal included.
      schema:
        type: string
        example: "private, no-store"
    PreviewRobotsTag:
      description: Always `noindex`. Sent on every preview response, a refusal included.
      schema:
        type: string
        example: noindex
    PreviewReferrerPolicy:
      description: Always `no-referrer`. Sent on every preview response, a refusal included.
      schema:
        type: string
        example: no-referrer
    ContentTypeOptions:
      description: Always `nosniff` on a file, so a browser never reads it as another type.
      schema:
        type: string
        example: nosniff
  schemas:
    Meta:
      type: object
      description: Response metadata included on every response body.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
    Pagination:
      type: object
      description: Cursor paging for a list.
      required:
      - cursor
      - limit
      - prev_cursor
      - next_cursor
      properties:
        cursor:
          type:
          - string
          - 'null'
          description: The cursor of this page.
        limit:
          type: integer
          description: Records per page.
        prev_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the previous page, or null on the first.
        next_cursor:
          type:
          - string
          - 'null'
          description: The cursor of the next page, or null on the last.
    ListMeta:
      type: object
      description: Response metadata of a list.
      required:
      - request_uuid
      - timestamp
      - pagination
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
        pagination:
          $ref: '#/components/schemas/Pagination'
    OwnerMember:
      type: object
      description: The member who owns a member site.
      required:
      - id
      - display_name
      properties:
        id:
          type: string
          format: uuid
          description: The member's id.
        display_name:
          type:
          - string
          - 'null'
          description: The member's name.
    MemberSite:
      type: object
      description: A site owned by the company or by one of its members.
      required:
      - id
      - handle
      - name
      - owner_kind
      - owner_member
      - copied_from_id
      - visibility
      - status
      - taken_down_at
      - required
      - position
      - layout_name
      - settings
      - content_version
      - lock_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The site's id (its `uuid_v7`).
        handle:
          type: string
          description: The URL segment after `/accounts/`. Lowercase letters, digits and single hyphens, at most 40 characters.
        name:
          type: string
          description: The site's name.
        owner_kind:
          type: string
          enum:
          - company
          - member
          description: Whether the company or a member owns the site.
        owner_member:
          oneOf:
          - $ref: '#/components/schemas/OwnerMember'
          - type: 'null'
          description: The owning member; null on a company site.
        copied_from_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The id of the site this one was copied from, or null for a site that was not copied. It becomes null when the original is deleted.
        access:
          "$ref": "#/components/schemas/MemberSiteAccess"
          description: What the site's published access declaration says. Absent for a droplet whose attached role lacks `application_themes.view`.
        visibility:
          type: string
          enum:
          - private
          - public
          description: Who may see the published site.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: Whether the owner has published the site, or an admin took it down.
        taken_down_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When an admin took the site down, or null.
        required:
          type: boolean
          description: Whether members must have this site. Only a company site can be required.
        position:
          type: integer
          description: Where the site sits among the company's sites.
        featured:
          type: boolean
          description: Whether the company features the site, so the members it is shared with see it first. Absent for a droplet whose attached role lacks `application_themes.view`.
        feature_position:
          type:
          - integer
          - 'null'
          description: Where the site sits among the company's featured sites, from 0, or null when it is not featured. Absent for a droplet whose attached role lacks `application_themes.view`.
        layout_name:
          type:
          - string
          - 'null'
          description: The layout the site renders with.
        settings:
          type: object
          additionalProperties: true
          description: The site's own settings.
        content_version:
          type: string
          format: uuid
          description: Changes each time the site is published; keys the public page cache.
        lock_version:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Send it back on a change to refuse the change if the site changed since you read it.
        created_at:
          type: string
          format: date-time
          description: When the site was created.
        updated_at:
          type: string
          format: date-time
          description: When the site last changed.
    MemberSiteAccess:
      type: object
      description: What the site's published access declaration (`config/access.json`) says it uses of the viewer's data and what it does as the viewer. It is the declaration the site last published, never the draft. A site that has published none answers `declared` false.
      additionalProperties: false
      required:
      - declared
      - uses
      properties:
        declared:
          type: boolean
          description: Whether the site has published a declaration.
        uses:
          type: array
          description: 'The declared entries, sorted, member fields first and then scopes. A member field is `member.<name>`, such as `member.email`, and a scope is `<family>: read` or `<family>: write`, such as `orders: read`. Empty when `declared` is false, and when the site declares nothing.'
          items:
            type: string
    MemberSiteResponse:
      type: object
      description: One site.
      required:
      - member_site
      - status
      - meta
      properties:
        member_site:
          $ref: '#/components/schemas/MemberSite'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitesResponse:
      type: object
      description: A page of sites.
      required:
      - member_sites
      - status
      - meta
      properties:
        member_sites:
          type: array
          items:
            $ref: '#/components/schemas/MemberSite'
          description: The sites on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/ListMeta'
    MemberSiteCreateBody:
      type: object
      description: The new company site.
      required:
      - member_site
      additionalProperties: false
      properties:
        member_site:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              type: string
              description: The site's name.
            handle:
              type:
              - string
              - 'null'
              description: The handle. Proposed from the name when blank.
            visibility:
              type: string
              enum:
              - private
              - public
              description: Defaults to `private`.
            layout_name:
              type:
              - string
              - 'null'
              description: The layout the site renders with.
            settings:
              type: object
              additionalProperties: true
              description: The site's own settings.
            required:
              type: boolean
              description: Whether members must have this site.
            position:
              type: integer
              description: Where the site sits among the company's sites.
    MemberSiteUpdateBody:
      type: object
      description: The changes. An absent field keeps its value.
      required:
      - member_site
      additionalProperties: false
      properties:
        member_site:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: The site's name.
            handle:
              type: string
              description: The handle. Changing it keeps the site's `id`.
            visibility:
              type: string
              enum:
              - private
              - public
              description: Who may see the published site.
            layout_name:
              type:
              - string
              - 'null'
              description: The layout the site renders with.
            settings:
              type: object
              additionalProperties: true
              description: The site's own settings.
            required:
              type: boolean
              description: Whether members must have this site. Only a company site can be required.
            position:
              type: integer
              description: Where the site sits among the company's sites. Only a company site can be moved.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` you last read. The change is refused with 409 if the site changed since.
    MemberSiteCopyBody:
      type: object
      description: Optional choices for a copy. The whole body may be omitted.
      additionalProperties: false
      properties:
        member_site:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: The copy's name. Defaults to "Copy of" followed by the original's name.
            handle:
              type: string
              description: The copy's handle. Proposed from the name when omitted.
    FilesPagination:
      type: object
      description: Cursor paging for a list of files.
      required:
      - next_cursor
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
    FilesMeta:
      type: object
      description: Response metadata of a list of files.
      required:
      - request_uuid
      - timestamp
      - pagination
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
        pagination:
          $ref: '#/components/schemas/FilesPagination'
    MemberSiteFile:
      type: object
      description: One file of a site.
      additionalProperties: false
      required:
      - path
      - content
      - lock_version
      - version
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        content:
          type: string
          description: The file's content. `config/settings.json`, `config/menus.json`, `config/pages.json` and `config/access.json` hold JSON documents.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Send it back as `lock_version` when writing the settings. It also changes when a page of the site is added, changed or removed, and when `config/menus.json` is written, so read the settings again before a versioned write. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: >-
            The version of the file, to send back as `version` when writing it (the request body) or removing it (the query parameter), so the change is refused with 409 if the file changed since. For an asset it is a digest of the content. For a layout, section, snippet or page file it is a digest of the draft content and of the published copy, so a publish changes it too: read the files again after publishing. For `config/menus.json`, `config/pages.json` and `config/access.json` it is a digest of the document. For `config/settings.json` it is the `lock_version` as a string, which also changes when a page is added, changed or removed and when `config/menus.json` is written.
            Treat it as opaque.
    MemberSiteFileEntry:
      type: object
      description: The metadata of one file of a site, without its content. Read the file with `GET /member-sites/{id}/files/{path}`.
      additionalProperties: false
      required:
      - path
      - kind
      - content_type
      - byte_size
      - lock_version
      - version
      - updated_at
      properties:
        path:
          type: string
          description: The theme-style path of the file, such as `layouts/site.liquid`.
        kind:
          type: string
          enum:
          - layout
          - section
          - snippet
          - page
          - asset
          - settings
          - menus
          - pages
          - access
          description: What the file is.
        content_type:
          type: string
          description: The content type of the file, such as `text/x-liquid` for a layout, section, snippet or page and `text/css` for a stylesheet. `config/settings.json`, `config/menus.json`, `config/pages.json` and `config/access.json` are `application/json`.
        byte_size:
          type: integer
          minimum: 0
          description: The size in bytes of the content that reading the file returns.
        lock_version:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 2147483647
          description: The version of the site's settings, for `config/settings.json` only. Null for every other file; they are versioned by `version`.
        version:
          type: string
          description: The version of the file, to send back as `version` when writing or removing it. See the `version` of a read file.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the file last changed. Null for `config/menus.json`, `config/pages.json` and `config/access.json`, which have no time of their own.
    MemberSiteFileResponse:
      type: object
      description: One site file.
      required:
      - member_site_file
      - status
      - meta
      properties:
        member_site_file:
          $ref: '#/components/schemas/MemberSiteFile'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFilesResponse:
      type: object
      description: One page of the files of a site, as metadata, sorted by path.
      required:
      - member_site_files
      - status
      - meta
      properties:
        member_site_files:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteFileEntry'
          description: The files on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/FilesMeta'
    MemberSiteFileWriteBody:
      type: object
      description: The content of a file. The path is in the URL.
      required:
      - member_site_file
      additionalProperties: false
      properties:
        member_site_file:
          type: object
          required:
          - content
          additionalProperties: false
          properties:
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The whole new content of the file. An asset must not be empty. `config/settings.json` takes a JSON object, and `config/menus.json` a JSON document of menus, `config/pages.json` a JSON document of the site's default layout and page settings, and `config/access.json` a JSON object whose `uses` key lists what the site uses, which is refused with 422 when it is not valid.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` of `config/settings.json` the caller last read. The write is refused with 409 if the settings changed since. Ignored for every other file. Send either this or `version`, not both.
            version:
              type: string
              maxLength: 255
              pattern: '^[^\u0000]*$'
              description: >-
                The `version` of the file the caller last read. The write is refused with 409 if the file has changed or been removed since, and nothing is written. For `config/settings.json` it is the `lock_version` as a string, and for `config/menus.json`, `config/pages.json` and `config/access.json` the digest of the document.
                Without `version` or `must_not_exist`, the write replaces whatever is at the path. Cannot be sent with `must_not_exist` or `lock_version`.
            must_not_exist:
              type: boolean
              description: Send `true` to create the file only if the path holds none. The write is refused with 409 if a file is already there, so a file another writer created since the caller listed the files is not replaced. `config/settings.json`, `config/menus.json` and `config/pages.json` always exist, so it is always refused for them. `config/access.json` exists only once it is written, so it is refused for it only when the site already has one. Cannot be sent with `version`.
    MemberSitePage:
      type: object
      description: One page of a site. Its content is the site file `pages/<slug>.liquid`, not part of the page.
      additionalProperties: false
      required:
      - id
      - slug
      - title
      - position
      - published
      - layout_name
      - menu
      - lock_version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: The page's id. It never changes, including when the slug changes.
        slug:
          type: string
          description: The page's URL segment, unique in the site, or `/` for the home page.
        title:
          type: string
          description: Display title.
        position:
          type: integer
          description: Order of the page among the site's pages.
        published:
          type: boolean
          description: Whether the page is shown once the site is published.
        layout_name:
          type:
          - string
          - 'null'
          description: The layout this page uses, or null to use the site's default.
        menu:
          type:
          - string
          - 'null'
          description: The slug of the site's menu assigned to the page, or null for none. Menus are defined in `config/menus.json`.
        lock_version:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Send it back as `lock_version` when changing the page (the request body) or removing it (the query parameter), to refuse the change if the page changed since it was read. It also changes when the page's content is written, through the page or through its file `pages/<slug>.liquid`, and when the page's content is published, by publishing the site or its file.
        created_at:
          type: string
          format: date-time
          description: When the page was created.
        updated_at:
          type: string
          format: date-time
          description: When the page last changed.
    MemberSitePageResponse:
      type: object
      description: One page of a site.
      required:
      - member_site_page
      - status
      - meta
      properties:
        member_site_page:
          $ref: '#/components/schemas/MemberSitePage'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitePagesResponse:
      type: object
      description: All of a site's pages, in order by position. A site holds at most 50 pages, so the list is not paged.
      required:
      - member_site_pages
      - status
      - meta
      properties:
        member_site_pages:
          type: array
          items:
            $ref: '#/components/schemas/MemberSitePage'
          description: The site's pages.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSitePageCreateBody:
      type: object
      description: The new page.
      required:
      - member_site_page
      additionalProperties: false
      properties:
        member_site_page:
          type: object
          required:
          - slug
          - title
          additionalProperties: false
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
              description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. `index` is reserved for the home page.
            title:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
              description: Display title.
            position:
              type: integer
              description: Order of the page among the site's pages. Defaults to 0.
            published:
              type: boolean
              description: Whether the page is shown once the site is published. Defaults to false.
            layout_name:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The layout this page uses. Null or omitted uses the site's default.
            menu:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The slug of one of the site's own menus. A menu of another site is refused. Null or omitted assigns none.
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The page's content, kept in the site file `pages/<slug>.liquid`. Empty by default.
    MemberSitePageUpdateBody:
      type: object
      description: Changes to a page. Send at least one field besides `lock_version`.
      required:
      - member_site_page
      additionalProperties: false
      properties:
        member_site_page:
          type: object
          additionalProperties: false
          anyOf:
          - required:
            - slug
          - required:
            - title
          - required:
            - position
          - required:
            - published
          - required:
            - layout_name
          - required:
            - menu
          - required:
            - content
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^(/|[a-z0-9]+(-[a-z0-9]+)*)$'
              description: Lowercase letters and digits separated by single hyphens, unique in the site, or `/` for the home page. The page keeps its id, and its content moves with it.
            title:
              type: string
              minLength: 1
              maxLength: 255
              pattern: '^[^\u0000]*[^\s\u0000][^\u0000]*$'
              description: Display title.
            position:
              type: integer
              description: Order of the page among the site's pages.
            published:
              type: boolean
              description: Whether the page is shown once the site is published.
            layout_name:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The layout this page uses. Null uses the site's default.
            menu:
              type:
              - string
              - 'null'
              maxLength: 255
              description: The slug of one of the site's own menus. A menu of another site is refused. Null removes the page's menu.
            content:
              type: string
              pattern: '^[^\u0000]*$'
              description: The page's new content. Refused with 403 for a page that uses a template the site does not own.
            lock_version:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: The `lock_version` you last read. The change is refused with 409 if the page changed since.
    ShareMember:
      type: object
      description: The member a share names. No contact details are returned.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The member's id.
        name:
          type:
          - string
          - 'null'
          description: The member's name. Null for a droplet, OAuth bearer or identity client token reading a sandbox twin.
    ShareMemberType:
      type: object
      description: The member type a segment share names.
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
          description: The member type's id.
        name:
          type: string
          description: The member type's name.
    ShareCountry:
      type: object
      description: The country a segment share names.
      required:
      - code
      - name
      properties:
        code:
          type: string
          description: The country's ISO 3166-1 alpha-2 code.
        name:
          type: string
          description: The country's name.
    MemberSiteShare:
      type: object
      description: One audience a site is shared with, and what it may do with the site.
      required:
      - id
      - audience_kind
      - member
      - member_type
      - country
      - label
      - permission
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The share's id.
        audience_kind:
          type: string
          enum:
          - member
          - downline
          - segment
          description: '`member` names one member, `downline` the downline of the member who shared the site, and `segment` the members of a member type, a country, both or, with neither, every member.'
        member:
          oneOf:
          - $ref: '#/components/schemas/ShareMember'
          - type: 'null'
          description: The member a `member` share names; null for the other kinds, and for a member who has since been deleted.
        member_type:
          oneOf:
          - $ref: '#/components/schemas/ShareMemberType'
          - type: 'null'
          description: The member type a `segment` share names, or null for any type.
        country:
          oneOf:
          - $ref: '#/components/schemas/ShareCountry'
          - type: 'null'
          description: The country a `segment` share names, or null for any country.
        label:
          type: string
          description: Who the share opens the site to, in words, such as a member's name, `Downline of Riley Kim`, `Customer in United States` or `All members`.
        permission:
          type: string
          enum:
          - view
          - copy
          description: '`view` opens the site; `copy` lets the member copy it too.'
        created_at:
          type: string
          format: date-time
          description: When the share was made.
    MemberSiteShareResponse:
      type: object
      description: One share.
      required:
      - member_site_share
      - status
      - meta
      properties:
        member_site_share:
          $ref: '#/components/schemas/MemberSiteShare'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteSharesResponse:
      type: object
      description: A page of shares, oldest first.
      required:
      - member_site_shares
      - status
      - meta
      properties:
        member_site_shares:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteShare'
          description: The shares on this page.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/ListMeta'
    MemberSiteShareCreateBody:
      type: object
      description: The audience to share a company site with.
      required:
      - member_site_share
      additionalProperties: false
      properties:
        member_site_share:
          type: object
          required:
          - audience_kind
          additionalProperties: false
          properties:
            audience_kind:
              type: string
              enum:
              - member
              - downline
              - segment
              description: The kind of audience. An admin writes `member` and `segment` shares; a `downline` share is refused with 422.
            member_id:
              type: string
              maxLength: 64
              description: The id of the member a `member` share names. Required for a `member` share and refused for the other kinds.
            member_type_id:
              type: string
              maxLength: 64
              description: The id of the member type a `segment` share names. Omit it for any type.
            country_code:
              type: string
              minLength: 2
              maxLength: 2
              description: The ISO 3166-1 alpha-2 code of a country the company holds that a `segment` share names. Omit it for any country.
            permission:
              type: string
              enum:
              - view
              - copy
              description: What the share grants. Defaults to `view`. An audience that is already shared keeps its permission; change it with the update route.
    MemberSiteShareUpdateBody:
      type: object
      description: The new permission of a share.
      required:
      - member_site_share
      additionalProperties: false
      properties:
        member_site_share:
          type: object
          required:
          - permission
          additionalProperties: false
          properties:
            permission:
              type: string
              enum:
              - view
              - copy
              description: What the share grants. Nothing else about a share changes.
    MemberSiteBranch:
      type: object
      description: |
        The branch of a site: a second site, cloned from the published content of its parent and published at once, so it renders what the parent renders. It is private, owned as the parent is, and has no shares. Only its owner and company admins can open it, in the frame at `frame_path`. It is edited and published through the files, pages and publish operations with `site_id` as the site id, which serve a company site's branch only; the parent never changes.
      additionalProperties: false
      required:
      - slug
      - site_id
      - parent_id
      - handle
      - status
      - frame_path
      - shell_path
      - parent_changed
      - created_at
      properties:
        slug:
          type: string
          description: The branch's slug, unique among the branches of its parent. Use it to read and delete the branch.
        site_id:
          type: string
          format: uuid
          description: The id of the branch's own site, as the site operations take it.
        parent_id:
          type: string
          format: uuid
          description: The id of the site the branch was made from.
        handle:
          type: string
          description: The branch site's handle, proposed from its name, `<parent name> (<slug>)`.
        status:
          type: string
          enum:
          - draft
          - published
          - taken_down
          description: The branch site's status. A branch is published when it is made, and taken down when its parent is.
        frame_path:
          type: string
          description: The path of the branch's home page in its frame, on the company's host. It renders for the branch's owner and for company admins, and any other signed-in member gets 404.
        shell_path:
          type: string
          description: The path of the branch's home page in the site shell.
        parent_changed:
          type: boolean
          description: Whether the parent's published content is no longer what the branch started from. False when the branch is made, true once the parent publishes a change.
        created_at:
          type: string
          format: date-time
          description: When the branch was made.
    MemberSiteBranchResponse:
      type: object
      description: One branch.
      required:
      - branch
      - status
      - meta
      properties:
        branch:
          $ref: '#/components/schemas/MemberSiteBranch'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteBranchesResponse:
      type: object
      description: The branches of a site, oldest first.
      required:
      - branches
      - status
      - meta
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/MemberSiteBranch'
          description: The site's branches.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteBranchCreateBody:
      type: object
      description: Optional choices for a branch. The whole body may be omitted.
      additionalProperties: false
      properties:
        branch:
          type: object
          additionalProperties: false
          description: The choices for the branch.
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 40
              pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
              description: Lowercase letters and digits separated by single hyphens. Omit it to name the branch `staging`.
    MemberSiteVersion:
      type: object
      description: One version of a site, a commit of its Git history. Who made it is in its message, which names an admin by name and a member by their public id. A droplet reading a sandbox test company gets `Admin` in place of an admin's name.
      additionalProperties: false
      required:
      - sha
      - short_sha
      - message
      - committed_at
      - current
      properties:
        sha:
          type: string
          pattern: '^[0-9a-f]{7,40}$'
          description: The commit's sha; send it to restore this version.
        short_sha:
          type: string
          description: The first seven characters of the sha, for display.
        message:
          type: string
          description: The commit's message.
        committed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the commit was made.
        current:
          type: boolean
          description: Whether this is the version the site's history was last synced to.
    MemberSiteVersionsResponse:
      type: object
      description: A site's versions, newest first, and the state of its history.
      required:
      - versions
      - current_sha
      - syncing
      - sync_failing
      - status
      - meta
      properties:
        versions:
          type: array
          description: The site's versions, newest first.
          items:
            $ref: '#/components/schemas/MemberSiteVersion'
        current_sha:
          type:
          - string
          - 'null'
          description: The sha the site's history was last synced to, or null before its first push.
        syncing:
          type: boolean
          description: Whether a change to the site is being saved to its history now.
        sync_failing:
          type: boolean
          description: Whether the last attempt to save a change to the site's history failed. The listing still answers.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteRestoreBody:
      type: object
      description: The version to restore. Any other field is refused.
      additionalProperties: false
      required:
      - sha
      properties:
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{7,40}$'
          description: The sha of the version, 7 to 40 hex characters, from `sha` in the versions listing.
    MemberSiteRestoredResponse:
      type: object
      description: What a restore did.
      required:
      - restored
      - status
      - meta
      properties:
        restored:
          type: object
          additionalProperties: false
          required:
          - sha
          - files_written
          - files_removed
          properties:
            sha:
              type: string
              description: The sha of the version restored.
            files_written:
              type: integer
              minimum: 0
              description: The number of files in the version, including files the site does not manage such as `README.md`.
            files_removed:
              type: integer
              minimum: 0
              description: The number of the site's files the version did not have, which the restore removed.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFeature:
      type: object
      description: The company's feature of one site.
      required:
      - id
      - site_id
      - position
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: The feature's id.
        site_id:
          type: string
          format: uuid
          description: The featured site's id (its `uuid_v7`). Send it to `DELETE /member-site-features/{site_id}` to stop featuring the site.
        position:
          type: integer
          description: Where the site sits among the company's featured sites, from 0.
        created_at:
          type: string
          format: date-time
          description: When the site was featured.
    MemberSiteFeatureResponse:
      type: object
      description: One feature.
      required:
      - member_site_feature
      - status
      - meta
      properties:
        member_site_feature:
          $ref: '#/components/schemas/MemberSiteFeature'
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFeaturesResponse:
      type: object
      description: The featured sites, in the company's order.
      required:
      - member_sites
      - status
      - meta
      properties:
        member_sites:
          type: array
          items:
            $ref: '#/components/schemas/MemberSite'
          description: The featured sites, in the company's order. Each has `featured` true and its `feature_position`.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    MemberSiteFeatureCreateBody:
      type: object
      description: The site to feature. Any other field is refused as an unknown field.
      additionalProperties: false
      required:
      - member_site_feature
      properties:
        member_site_feature:
          type: object
          additionalProperties: false
          required:
          - site_id
          properties:
            site_id:
              type: string
              format: uuid
              description: The id of a site of the company, as the site list gives it.
    MemberSiteFeatureOrderBody:
      type: object
      description: The features to put first, in order. Any other field is refused as an unknown field.
      additionalProperties: false
      required:
      - member_site_feature_order
      properties:
        member_site_feature_order:
          type: object
          additionalProperties: false
          required:
          - site_ids
          properties:
            site_ids:
              type: array
              description: The ids of the featured sites, in the order the admin wants them. One to 20 ids, each once. An id that is not a feature is ignored, and the other features follow these in their old order.
              minItems: 1
              maxItems: 20
              uniqueItems: true
              items:
                type: string
                format: uuid
    ErrorResponse:
      type: object
      description: A refusal in the standard envelope.
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: What went wrong.
            details:
              type: object
              additionalProperties: true
              description: The fields that were refused, with why.
        status:
          type: integer
          description: The HTTP status.
        meta:
          $ref: '#/components/schemas/Meta'
    AuthorizationError:
      type: object
      description: The body an authentication or permission refusal answers with.
      additionalProperties: true
  parameters:
    ShareId:
      name: share_id
      in: path
      required: true
      description: The share's id.
      schema:
        type: string
        format: uuid
    FeatureSiteId:
      name: site_id
      in: path
      required: true
      description: The id of the site to stop featuring.
      schema:
        type: string
        format: uuid
    SiteId:
      name: id
      in: path
      required: true
      description: The site's id.
      schema:
        type: string
        format: uuid
    BranchSlug:
      name: slug
      in: path
      required: true
      description: The slug of one of the site's branches.
      schema:
        type: string
        minLength: 1
        maxLength: 40
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    FilePath:
      name: path
      in: path
      required: true
      description: 'The theme-style path of the file, with its slash: `layouts/<name>.liquid`, `sections/<name>.liquid`, `snippets/<name>.liquid`, `pages/<slug>.liquid` (`pages/index.liquid` for the home page), `assets/<file>` (a css, js, json, txt or html file), `config/settings.json`, `config/menus.json`, `config/pages.json` or `config/access.json`. Names use lowercase letters, digits, hyphens and underscores, with no subfolders. Any other path is refused with 422.'
      schema:
        type: string
        pattern: '^.+$'
    PreviewSlug:
      name: slug
      in: path
      required: true
      description: The slug of the page, lowercase letters and digits joined by hyphens, such as `about`. The home page has no slug in the path; see the operation without one.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    PreviewAssetPath:
      name: path
      in: path
      required: true
      description: 'The theme-style path of a text asset, with its slash: `assets/<file>`, a css, js, json, txt or html file such as `assets/site.css`. Any other path is the same empty 404.'
      schema:
        type: string
        pattern: '^.+$'
    VersionLimit:
      name: limit
      in: query
      required: false
      description: How many versions to list, newest first. 25 when omitted, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    PageId:
      name: page_id
      in: path
      required: true
      description: The page's id.
      schema:
        type: string
        format: uuid
    FileVersionQuery:
      name: version
      in: query
      required: false
      description: The `version` of the file the caller last read. The file is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the file is removed as it is.
      schema:
        type: string
        maxLength: 255
    PageLockVersionQuery:
      name: lock_version
      in: query
      required: false
      description: The `lock_version` of the page the caller last read. The page is removed only if it is still at that version, and the request is refused with 409 if it changed. Without it the page is removed as it is.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
  responses:
    Unauthorized:
      description: Not signed in.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizationError'
    PermissionDenied:
      description: The caller lacks the permission, or the site is a member's, whose pages an admin does not reach.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AuthorizationError'
            - $ref: '#/components/schemas/ErrorResponse'
    WriteRefused:
      description: The caller lacks the permission, has no signed-in admin, or the site is a member's, whose files, pages, publishing and changes an admin does not reach.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AuthorizationError'
            - $ref: '#/components/schemas/ErrorResponse'
    NeedsAdmin:
      description: The caller lacks the permission, has no signed-in admin, or the site is a member's, whose files an admin does not reach. A credential with no user, such as a company API token or a droplet token, cannot read files.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AuthorizationError'
            - $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such site, file, page or share in this company, or member sites are not enabled for it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreviewRefused:
      description: The caller lacks `application_themes.view`, has no signed-in admin, or holds an Identity client token. A credential with no user, such as a company API token or a droplet token, cannot read a draft.
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/PreviewContentSecurityPolicy'
        Cache-Control:
          $ref: '#/components/headers/PreviewCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PreviewRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PreviewReferrerPolicy'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/AuthorizationError'
            - $ref: '#/components/schemas/ErrorResponse'
    PreviewNotFound:
      description: The same empty answer, typed `text/plain`, for every reason. No site of the company has this id, the site is a member's, the site has no such page or file, or member sites are not enabled for the company. It never says which.
      headers:
        Content-Security-Policy:
          $ref: '#/components/headers/PreviewContentSecurityPolicy'
        Cache-Control:
          $ref: '#/components/headers/PreviewCacheControl'
        X-Robots-Tag:
          $ref: '#/components/headers/PreviewRobotsTag'
        Referrer-Policy:
          $ref: '#/components/headers/PreviewReferrerPolicy'
    Conflict:
      description: The site, its settings, the page or the file changed since you read it, a file to be created already exists, or another request is changing the site. Read it again and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
security:
- bearer_auth: []
paths:
  /api/company/v2026-10/member-sites:
    get:
      operationId: companyMemberSitesList
      x-fluid-audience: company
      summary: List member sites
      description: Every site in the company, company-owned and member-owned, newest first, except a branch, which is found through its site's branches and by its own id. Needs `application_themes.view`, or a droplet token with the `website` scope.
      tags:
      - member-sites
      parameters:
      - name: page[cursor]
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from `meta.pagination.next_cursor` or `prev_cursor`. Do not construct or decode it.
      - name: page[limit]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Sites per page. Default 25, maximum 100.
      - name: filter[owner_kind]
        in: query
        required: false
        schema:
          type: string
          enum:
          - company
          - member
        example: member
        description: Only sites owned by the company, or only sites owned by members.
      - name: filter[status]
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - published
          - taken_down
        example: published
        description: Only sites with this status.
      responses:
        '200':
          description: A page of sites.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSitesResponse'
              example:
                member_sites:
                - id: 019a2b3c-4d5e-7f6a-8b7c-9d0e1f2a3b4c
                  handle: primex-launch
                  name: Primex Launch
                  owner_kind: company
                  owner_member: null
                  copied_from_id: null
                  access:
                    declared: false
                    uses: []
                  visibility: public
                  status: published
                  taken_down_at: null
                  required: true
                  position: 1
                  featured: true
                  feature_position: 0
                  layout_name: null
                  settings: {}
                  content_version: 019a2b3c-5e6f-7a7b-8c9d-0e1f2a3b4c5d
                  lock_version: 2
                  created_at: '2026-10-12T10:20:33Z'
                  updated_at: '2026-10-13T09:00:00Z'
                - id: 019a2c4d-5e6f-7a7b-8c9d-0e1f2a3b4c5d
                  handle: riley-shop
                  name: Riley's Shop
                  owner_kind: member
                  owner_member:
                    id: 019a1111-2222-7333-8444-555566667777
                    display_name: Riley Rep
                  copied_from_id: null
                  access:
                    declared: false
                    uses: []
                  visibility: private
                  status: draft
                  taken_down_at: null
                  required: false
                  position: 0
                  featured: false
                  feature_position: null
                  layout_name: null
                  settings: {}
                  content_version: 019a2c4d-6f7a-7b8c-9d0e-1f2a3b4c5d6e
                  lock_version: 0
