  /api/company/v2026-10/member-sites/{id}/preview/pages:
    get:
      operationId: companyMemberSitePreviewHome
      x-fluid-audience: company
      summary: Preview the home page of a company site's draft
      description: The home page of a company site, rendered from the draft copy of the site's files and settings, with every page of the site listed in its navigation whether it is published or not. It is the one renderer that serves the site's published pages, so the preview shows what the site will serve once published; a layout, section, snippet or setting that was never published renders its draft, and the response never falls back to the published page. The site may be a draft or published. Assets have no draft, as they are live as written. The page links the same asset URL the site's published frame links, which the frame serves only for a published site; read an asset of a draft site with the file operation of this tag. The page holds no handshake nonce and nothing of the admin's, because it renders for no signed-in viewer. Needs `application_themes.view` and a signed-in admin. A member's site, a missing id, a page that does not exist and a company without member sites are the same empty 404. The response is `text/html`, never cached.
      tags:
      - member-site-preview
      parameters:
      - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: The draft page.
          headers:
            Content-Security-Policy:
              $ref: '#/components/headers/PreviewContentSecurityPolicy'
            Cache-Control:
              $ref: '#/components/headers/PreviewCacheControl'
            X-Robots-Tag:
              $ref: '#/components/headers/PreviewRobotsTag'
            Referrer-Policy:
              $ref: '#/components/headers/PreviewReferrerPolicy'
          content:
            text/html:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PreviewRefused'
        '404':
          $ref: '#/components/responses/PreviewNotFound'
