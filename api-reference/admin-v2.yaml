---
openapi: 3.1.0
info:
  title: Fluid Admin v2 API
  description: |
    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation in this API that resolves the company from the request's
    credential refuses a credential for it with `403` and the body
    `{"error": "<message>"}`, before the operation runs. The refusal is
    documented here once rather than on each operation.
  version: v2
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: metafield-definitions
  description: >-
    The custom fields a company adds to its products, variants, enrollment
    packs, members and other records. A definition fixes a field's namespace,
    key, type and validation rules, and whether its values can be translated.
    Create and change definitions here, then store values with the metafields
    operations.
  x-fluid-section: Settings
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    MetafieldDefinition:
      type: object
      description: A custom field a company defines for one kind of record. Metafield values reference a definition by its namespace, key and owner resource.
      required:
      - id
      - company_id
      - namespace
      - key
      - name
      - value_type
      - owner_resource
      - searchable
      - translatable
      properties:
        id:
          type: integer
          description: The definition's ID. Use it in the path of the show, update and delete operations.
          example: 4812
        company_id:
          type: integer
          description: The ID of the company that owns the definition.
          example: 1023
        namespace:
          type: string
          description: Groups related definitions. Up to 20 letters, numbers and underscores. Fixed once the definition is created.
          example: custom
        key:
          type: string
          description: Identifies the definition within its namespace and owner resource. Up to 30 letters, numbers and underscores. Fixed once the definition is created.
          example: tagline
        name:
          type: string
          description: The display name shown in the admin. Up to 100 characters.
          example: Tagline
        description:
          type:
          - string
          - 'null'
          description: Help text for people who fill in the field.
          example: A short line shown under the product title.
        value_type:
          type: string
          description: The type of value the field holds, such as `single_line_text_field`, `number_integer` or `list.url`. Fixed once the definition is created. `GET /api/v2/metafield_definitions/supported_data_types` lists every type.
          example: single_line_text_field
        validation_rules:
          type:
          - object
          - string
          - 'null'
          description: 'The rules a value must meet, keyed by rule name, for example `{"max": 80}`. Which rules a type supports is in `supported_validations`. Null when the definition has no rules. Fixed once the definition is created.'
          example:
            max: 80
        owner_resource:
          type: string
          description: The kind of record the definition's metafields attach to, as stored. A request that names `Member`, `Customer`, `Media` or `Playlist` is stored as `Company::Member`, `Company::Member`, `Medium` or `Library`. Fixed once the definition is created.
          example: Product
        pinned:
          type: boolean
          description: Whether the admin shows the field ahead of the others.
          example: false
        position:
          type: integer
          description: The sort order among the company's definitions for the same owner resource. Lower numbers come first.
          example: 5
        locked:
          type: boolean
          description: Whether the definition's metafields are protected from direct changes and deletion.
          example: false
        searchable:
          type: boolean
          description: Members only. When true, droplets and API clients can look up members by this metafield's value with `filter[metafield]` on `GET /api/v2025-06/members`.
          example: false
        translatable:
          type: boolean
          description: Whether the field's values can have per-language translations. See the `translatable` field of the create and update requests for the rules.
          example: true
        list_type:
          type: boolean
          description: True for a list type such as `list.single_line_text_field`, whose values are arrays.
          example: false
        reference_type:
          type: boolean
          description: True for a type whose values point at another record, such as `product_reference`.
          example: false
        supported_validations:
          type: array
          description: The validation rule names this value type accepts.
          items:
            type: string
          example:
            - min
            - max
            - choices
            - regex
        validation_description:
          type:
          - string
          - 'null'
          description: A plain-language description of the value type.
          example: Single line text up to 5000 characters
        category_ids:
          type: array
          description: The IDs of the categories the definition is grouped under in the admin.
          items:
            type: integer
          example: []
        metafields_count:
          type: integer
          description: How many standalone metafield records use this definition. Values stored directly on a product, variant or other record's own metafields are not counted. Returned by the list operation only.
          example: 12
        created_at:
          type: string
          format: date-time
          description: When the definition was created.
          example: '2026-11-16T16:40:58Z'
        updated_at:
          type: string
          format: date-time
          description: When the definition was last changed.
          example: '2026-11-16T16:40:58Z'
    MetafieldDefinitionCreateRequest:
      type: object
      required:
      - metafield_definition
      properties:
        metafield_definition:
          type: object
          description: The definition to create.
          required:
          - owner_resource
          - namespace
          - key
          - name
          - value_type
          properties:
            owner_resource:
              type: string
              description: The kind of record the definition is for. `Member` and `Customer` both create a `Company::Member` definition, `Media` a `Medium` definition and `Playlist` a `Library` definition. Cannot be changed later.
              enum:
              - Product
              - Variant
              - EnrollmentPack
              - Commerce::Order
              - Post
              - Medium
              - Media
              - Collection
              - Category
              - Library
              - Playlist
              - Page
              - Company::Member
              - Member
              - Customer
              example: Product
            namespace:
              type: string
              maxLength: 20
              pattern: "^[a-zA-Z0-9_]+$"
              description: Groups related definitions, for example `custom`. Up to 20 letters, numbers and underscores. Cannot be changed later.
              example: custom
            key:
              type: string
              maxLength: 30
              pattern: "^[a-zA-Z0-9_]+$"
              description: Identifies the definition within its namespace and owner resource. Up to 30 letters, numbers and underscores. The namespace, key and owner resource together must be unique in the company. Cannot be changed later.
              example: tagline
            name:
              type: string
              maxLength: 100
              description: The display name shown in the admin.
              example: Tagline
            value_type:
              type: string
              description: The type of value the field holds, for example `single_line_text_field`. Call `GET /api/v2/metafield_definitions/supported_data_types` for the full list and the validation rules each type accepts. Cannot be changed later.
              example: single_line_text_field
            description:
              type:
              - string
              - 'null'
              description: Help text for people who fill in the field.
              example: A short line shown under the product title.
            category_ids:
              type:
              - array
              - 'null'
              description: The IDs of the company's categories to group the definition under. A category the company does not own is refused with 422.
              items:
                type: integer
              example:
                - 14
                - 27
            pinned:
              type: boolean
              description: Whether the admin shows the field ahead of the others.
              example: false
            position:
              type: integer
              description: The sort order among the company's definitions for the same owner resource. When omitted or not positive, the definition goes last.
              example: 3
            validation_rules:
              type:
              - object
              - 'null'
              description: 'The rules a value must meet, keyed by rule name, for example `{"max": 80}`. The value type decides which rules are accepted; an unsupported rule is refused with 422. Cannot be changed later.'
              example:
                max: 80
            locked:
              type: boolean
              description: Whether to protect the definition's metafields from direct changes and deletion.
              example: false
            searchable:
              type: boolean
              description: Members only. Lets droplets and API clients look up members by this metafield's value. Refused with 422 unless the owner resource is `Company::Member` and the type is `json`, `single_line_text_field` or `number_integer`.
              example: false
            translatable:
              type: boolean
              description: |-
                Marks the field's values as translatable, so each can have per-language translations. Only for companies with the translatable metafields feature turned on. For any other company the value is ignored, the request still succeeds and `translatable` comes back false, so read it in the response to confirm it took effect.

                With the feature on, 422 is returned for an owner resource other than Product, Variant or EnrollmentPack, for a value type other than `single_line_text_field`, `multi_line_text_field`, `rich_text_field`, `list.single_line_text_field` or `url`, and for a definition with a `choices` rule.
              example: true
    MetafieldDefinitionUpdateRequest:
      type: object
      required:
      - metafield_definition
      properties:
        metafield_definition:
          type: object
          description: The fields to change. Fields left out stay as they are. The namespace, key, value type, owner resource and validation rules cannot be changed, and are ignored when sent.
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
              description: The display name shown in the admin.
              example: Product tagline
            description:
              type:
              - string
              - 'null'
              description: Help text for people who fill in the field. Send null to clear it.
              example: A short line shown under the product title.
            category_ids:
              type:
              - array
              - 'null'
              description: The IDs of the company's categories to group the definition under. The list replaces the current one, and an empty list clears it. Leave it out to keep the current categories. A category the company does not own is refused with 422.
              items:
                type: integer
              example:
                - 14
            pinned:
              type: boolean
              description: Whether the admin shows the field ahead of the others.
              example: true
            position:
              type: integer
              description: The sort order among the company's definitions for the same owner resource. Lower numbers come first.
              example: 1
            locked:
              type: boolean
              description: Whether to protect the definition's metafields from direct changes and deletion.
              example: false
            searchable:
              type: boolean
              description: Members only. Lets droplets and API clients look up members by this metafield's value. Refused with 422 unless the owner resource is `Company::Member` and the type is `json`, `single_line_text_field` or `number_integer`.
              example: false
            translatable:
              type: boolean
              description: |-
                Turns translations on or off for the field's values. Turning it off keeps the translations already saved, and they come back if it is turned on again. Only for companies with the translatable metafields feature turned on. For any other company the value is ignored, the request still succeeds and the stored value is returned unchanged, so read `translatable` in the response to confirm it took effect.

                With the feature on, turning it on is refused with 422 for an owner resource other than Product, Variant or EnrollmentPack, for a value type other than `single_line_text_field`, `multi_line_text_field`, `rich_text_field`, `list.single_line_text_field` or `url`, and for a definition with a `choices` rule.
              example: true
    PaginationMeta:
      type: object
      description: Response metadata for a paginated list.
      properties:
        request_id:
          type:
          - string
          - 'null'
          description: The ID of the request, for support.
        timestamp:
          type: string
          format: date-time
          description: When the response was produced.
        pagination:
          type: object
          description: Where this page sits in the full result.
          properties:
            current_page:
              type: integer
              description: The page returned.
            total_pages:
              type: integer
              description: How many pages the query has at this page size.
            total_count:
              type: integer
              description: How many definitions match the query.
            per_page:
              type: integer
              description: The page size used.
    MetafieldDefinitionResponse:
      type: object
      required:
      - metafield_definition
      - meta
      properties:
        metafield_definition:
          "$ref": "#/components/schemas/MetafieldDefinition"
        meta:
          "$ref": "#/components/schemas/Meta"
    MetafieldDefinitionListResponse:
      type: object
      required:
      - metafield_definitions
      - meta
      properties:
        metafield_definitions:
          type: array
          items:
            "$ref": "#/components/schemas/MetafieldDefinition"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    MetafieldDefinitionDeleteResponse:
      type: object
      required:
      - id
      - meta
      properties:
        id:
          type: integer
          description: The ID of the definition that was deleted.
        meta:
          "$ref": "#/components/schemas/Meta"
    MetafieldDefinitionSupportedDataTypesResponse:
      type: object
      required:
      - supported_data_types
      - meta
      properties:
        supported_data_types:
          type: array
          items:
            type: object
            required:
            - value_type
            - description
            - supported_validations
            properties:
              value_type:
                type: string
                description: The value to send as `value_type` when creating a definition.
              description:
                type: string
                description: What the type holds.
              supported_validations:
                type: array
                description: The validation rules a definition of this type accepts in `validation_rules`.
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      description: The rule name to use as a key in `validation_rules`.
                    description:
                      type:
                      - string
                      - 'null'
                      description: What the rule checks. Null for a rule with no description.
        meta:
          "$ref": "#/components/schemas/Meta"
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    PermissionDeniedResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    V2OrderErrorResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            error:
              type: string
    PostApiV2RepsResponse201ApplicationJsonSchema:
