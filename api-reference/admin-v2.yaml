  "/api/v2/orders/{id}/cancel":
    patch:
      operationId: admin_v2_orders_cancel
      summary: Cancel order
      description: Cancels an uncaptured order, optionally voiding the payment authorization
        at the gateway and restocking inventory.
      tags:
      - orders
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Cancellation reason (visible to staff only)
                restock_all_items:
                  type: boolean
                  description: Whether to restock all unfulfilled items
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - data
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Order cancelled successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/V2OrderErrorResponse"
        '422':
          description: |
            Order cannot be cancelled. Possible errors:
            - Order cannot be cancelled (captured, archived, or pending review)
            - Order cannot be cancelled, Order is already fulfilled
            - Failed to void authorization (gateway error)
            - Void not supported for non-CreditCard payments
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/V2OrderErrorResponse"
