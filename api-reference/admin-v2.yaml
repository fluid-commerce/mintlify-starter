  "/api/v2/reps/export_csv":
    post:
      operationId: admin_v2_reps_export_csv
      summary: Export reps as CSV
      tags:
      - reps
      security:
      - bearer_auth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                countries:
                  type:
                  - string
                  - 'null'
                  description: Comma-separated ISO country codes to filter by (e.g.
                    "US,CA"). Matched case-insensitively.
                member_type_slug:
                  type:
                  - string
                  - 'null'
                  description: Filter members to a single member type by its slug.
                rank_id:
                  type:
                  - integer
                  - 'null'
                  description: Filter members to those with the given rank id.
                external_id:
                  type:
                  - string
                  - 'null'
                  description: Filter members by external id.
                total_spent_min:
                  type:
                  - string
                  - 'null'
                  description: Minimum total spent (inclusive lower bound).
                total_spent_max:
                  type:
                  - string
                  - 'null'
                  description: Maximum total spent (inclusive upper bound).
                orders_count_min:
                  type:
                  - integer
                  - 'null'
                  description: Minimum number of orders (inclusive lower bound).
                orders_count_max:
                  type:
                  - integer
                  - 'null'
                  description: Maximum number of orders (inclusive upper bound).
                created_at_from:
                  type:
                  - string
                  - 'null'
                  description: Only include members created on or after this date.
                created_at_to:
                  type:
                  - string
                  - 'null'
                  description: Only include members created on or before this date.
                search_query:
                  type:
                  - string
                  - 'null'
                  description: Free-text search across member fields (name, email,
                    username, etc.).
                active:
                  type:
                  - boolean
                  - 'null'
                  description: Filter by active status. Omit to include both active
                    and inactive members.
                columns:
                  type:
                  - string
                  - 'null'
                  description: Comma-separated, ordered subset of column ids to export.
                    Valid ids - username, name, email, status, member_type, country,
                    rank, external_id, orders_count, total_spent, points, phone, created_at.
                    Omit to export every column. Columns are always emitted in the
                    canonical registry order regardless of the order requested.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Signed download URL for the generated CSV file.
                  meta:
                    "$ref": "#/components/schemas/Meta"
                additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
