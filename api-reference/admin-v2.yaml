paths:
  "/api/v2/activities":
    get:
      operationId: admin_v2_activities_list
      summary: List activities
      tags:
      - activities
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    "$ref": "#/components/schemas/JsonValue"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
  "/api/v2/admins":
    get:
      operationId: admin_v2_admins_list
      summary: List admins
      tags:
      - admins
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
    post:
      operationId: admin_v2_admins_create
      summary: Create admin
      tags:
      - admins
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PostApiV2AdminsResponse201ApplicationJsonSchema"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: The caller is not a company admin, lacks the company_admins.update permission, or asks to give admin roles with permissions it does not hold.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/v2/admins/export_csv":
    post:
      operationId: admin_v2_admins_export_csv
      summary: Export admins as CSV
      tags:
      - admins
      security:
      - bearer_auth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type:
                  - string
                  - 'null'
                  description: Inclusive lower bound on the admin's creation date,
                    formatted MM/DD/YYYY and read as the start of that day in the
                    given timezone (UTC by default).
                end_date:
                  type:
                  - string
                  - 'null'
                  description: Inclusive upper bound on the admin's creation date,
                    formatted MM/DD/YYYY and read as the end of that day in the given
                    timezone (UTC by default).
                countries:
                  type:
                  - string
                  - 'null'
                  description: Comma-separated ISO country codes to filter by (e.g.
                    "US,CA"). Matched case-insensitively; at most 250 are used. Codes
                    that match no country yield a CSV with headers only.
                timezone:
                  type:
                  - string
                  - 'null'
                  description: Timezone name (e.g. "America/New_York") the day bounds
                    are measured in. Defaults to UTC; an unknown name falls back to
                    UTC.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '403':
          description: The store is a sandbox test store and the caller is a droplet
            or OAuth token; the export carries admin names and emails.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Validation failed, or start_date or end_date is not a readable
            MM/DD/YYYY date.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
