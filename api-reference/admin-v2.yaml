  "/api/v2/orders/bulk_update":
    patch:
      operationId: admin_v2_orders_bulk_update
      summary: Bulk update orders
      description: Enqueues a status change for the given orders of the current
        company. Other keys under `order` are ignored. Setting the status to `cancelled`
        also requires `orders.delete`, and puts the units each order's lines still
        reserve back on sale. A shipped line without reservations keeps its committed
        units.
      tags:
      - orders
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order_ids
              - order
              properties:
                order_ids:
                  description: The order ids, as an array or a comma-separated
                    string.
                  oneOf:
                  - type: array
                    items:
                      type:
                      - integer
                      - string
                  - type: string
                order:
                  type: object
                  required:
                  - status
                  properties:
                    status:
                      type: string
                      enum:
                      - awaiting_payment
                      - awaiting_shipment
                      - shipped
                      - delivered
                      - archived
                      - cancelled
                      - failed_payment
                      - draft
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '403':
          description: The caller lacks orders.update, or sets the status to cancelled without orders.delete. No order changes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PermissionDeniedResponse"
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/V2OrderErrorResponse"
