                  request_id: c1c4917b-d565-4b47-b18b-ae34e9bb8cd4
                  timestamp: '2026-11-16T16:41:02Z'
    post:
      operationId: admin_v2_metafield_definitions_create
      summary: Create a metafield definition
      description: |-
        Creates a metafield definition: a custom field for one kind of record, such as a Product. The namespace, key and owner resource together must be unique in the company, and the namespace, key, value type, owner resource and validation rules cannot be changed afterwards.

        To make the field translatable, send `"translatable": true` with a Product, Variant or EnrollmentPack definition of a text, list of text or url type. The setting works only for companies with the translatable metafields feature turned on. For any other company the value is ignored and the request still returns 201, so check that `translatable` is true in the response. The `translatable` field below lists the rules.

        Requires a company admin credential with the Developer update permission.
      x-fluid-audience: company
      tags:
      - metafield-definitions
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MetafieldDefinitionCreateRequest"
            examples:
              translatable_text_field:
                summary: A translatable text field on products
                value:
                  metafield_definition:
                    owner_resource: Product
                    namespace: custom
                    key: tagline
                    name: Tagline
                    value_type: single_line_text_field
                    translatable: true
              number_field_with_rules:
                summary: A number field with a validation rule
                value:
                  metafield_definition:
                    owner_resource: Variant
                    namespace: specs
                    key: pack_size
                    name: Pack size
                    description: Units in one pack.
                    value_type: number_integer
                    validation_rules:
                      min: 1
                      max: 100
      responses:
        '201':
          description: The definition that was created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MetafieldDefinitionResponse"
              example:
                metafield_definition:
                  id: 4812
                  company_id: 1023
                  namespace: custom
                  key: tagline
                  name: Tagline
                  description:
                  value_type: single_line_text_field
                  validation_rules:
                  owner_resource: Product
                  pinned: false
                  position: 5
                  locked: false
                  searchable: false
                  translatable: true
                  list_type: false
                  reference_type: false
                  supported_validations:
                  - min
                  - max
                  - choices
                  - regex
                  validation_description: Single line text up to 5000 characters
                  category_ids: []
                  created_at: '2026-11-16T16:40:58Z'
                  updated_at: '2026-11-16T16:40:58Z'
                meta:
                  request_id: 6ebde49d-d0ae-4e72-9547-4d1e65842045
                  timestamp: '2026-11-16T16:40:58Z'
        '401':
          description: The credential is missing or invalid, or does not belong to a company admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
              example:
                message: Invalid credentials.
        '403':
          description: The credential does not hold the Developer update permission.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PermissionDeniedResponse"
              example:
                error: Not authorized.
        '422':
          description: The request is incomplete or the definition is not valid, for example a required field is missing, the namespace, key and owner resource are already taken, a validation rule is not supported by the value type, a category is not the company's, or `translatable` is true for an owner resource, value type or rule that cannot be translated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              examples:
                translatable_not_supported:
                  summary: Translatable on a type that cannot be translated
                  value:
                    error_message: Failed to create Metafield Definition
                    errors:
                      translatable:
                      - 'is only supported for these value types: single_line_text_field, multi_line_text_field, rich_text_field, list.single_line_text_field, url'
                    meta:
                      request_id: 6877ac23-778f-4af6-93d4-873024f75f9c
                      timestamp: '2026-11-16T16:40:58Z'
                missing_fields:
                  summary: Required fields missing
