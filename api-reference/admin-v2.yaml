        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/V2OrderErrorResponse"
        '422':
          description: The member id is missing, no member matches it, the order
            sponsor cannot move with update_order_sponsor, or the order could not
            be saved.
