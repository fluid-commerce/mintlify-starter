                rep:
                  type: object
                  required:
                  - email
                  properties:
                    email:
                      type: string
                      minLength: 1
                      description: Email of the rep. An existing user with this email is promoted to rep.
                    first_name:
                      type:
                      - string
                      - 'null'
                      description: First name.
                    last_name:
                      type:
                      - string
                      - 'null'
                      description: Last name.
                    phone:
                      type:
                      - string
                      - 'null'
                      description: Phone number.
                    dob:
                      type:
                      - string
                      - 'null'
                      format: date
                      description: Date of birth (YYYY-MM-DD). The date belongs to the user account, which is shared across companies, so it is saved only when this request creates the account; an existing account's date of birth is not changed.
                    active:
                      type:
                      - boolean
                      - 'null'
                      description: Whether the rep is active.
                    external_id:
                      type:
                      - string
                      - 'null'
                      description: Identifier in an external system.
                    username:
                      type:
                      - string
                      - 'null'
                      description: Username.
                    language_code:
                      type:
                      - string
                      - 'null'
                      description: ISO language code. Defaults to the company's default language.
                    country_code:
                      type:
                      - string
                      - 'null'
                      description: ISO country code. Defaults to the company's default country.
                    rank_id:
                      type:
                      - integer
                      - 'null'
                      description: ID of one of the company's ranks.
                    tax_exempt:
                      type:
                      - boolean
                      description: Whether the rep is tax exempt.
                    sales_tax_id:
                      type:
                      - string
                      description: Sales tax ID.
            example:
              rep:
                email: pam.beesly@dundermifflin.com
                first_name: Pam
                last_name: Beesly
                dob: '1979-03-25'
      responses:
