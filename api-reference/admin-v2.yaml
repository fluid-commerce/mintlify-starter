  "/api/v2/metafield_definitions":
    get:
      operationId: admin_v2_metafield_definitions_list
      summary: List metafield definitions
      description: |-
        Returns the company's metafield definitions, oldest first, with how many standalone metafield records use each one (`metafields_count`). Filter by owner resource, by pinned, or by a search on name, namespace, key and description.

        Requires a company admin credential with the Developer view permission.
      x-fluid-audience: company
      tags:
      - metafield-definitions
      security:
      - bearer_auth: []
      parameters:
      - name: owner_resource
        in: query
        required: false
        description: Return only definitions for this kind of record, for example `Product`. `Member` and `Customer` match `Company::Member` definitions.
        schema:
          type: string
          examples:
          - Product
      - name: pinned
        in: query
        required: false
        description: Return only pinned definitions when true, or only unpinned ones when false.
        schema:
          type: boolean
      - name: search_query
        in: query
        required: false
        description: Return only definitions whose name, namespace, key or description contains the text.
        schema:
          type: string
          examples:
          - tagline
      - name: page
        in: query
        required: false
        description: The page to return, starting at 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        description: How many definitions to return per page, up to 100. The default is 20.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: The page of definitions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MetafieldDefinitionListResponse"
              example:
                metafield_definitions:
                - id: 4812
                  company_id: 1023
                  namespace: custom
                  key: tagline
                  name: Tagline
                  description: A short line shown under the product title.
                  value_type: single_line_text_field
                  validation_rules:
                  owner_resource: Product
                  pinned: false
                  position: 1
                  locked: false
                  searchable: false
                  translatable: true
                  list_type: false
                  reference_type: false
                  supported_validations:
                  - min
                  - max
                  - choices
                  - regex
                  validation_description: Single line text up to 5000 characters
                  category_ids: []
                  metafields_count: 12
                  created_at: '2026-11-16T16:40:58Z'
                  updated_at: '2026-11-16T16:40:58Z'
                meta:
                  request_id: 0ddc4019-1af6-4130-b286-3155bea586b7
                  timestamp: '2026-11-16T16:41:02Z'
                  pagination:
                    current_page: 1
                    total_pages: 1
                    total_count: 1
                    per_page: 20
        '401':
          description: The credential is missing or invalid, or does not belong to a company admin.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
              example:
                message: Invalid credentials.
        '403':
          description: The credential does not hold the Developer view permission.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PermissionDeniedResponse"
              example:
                error: Not authorized.
