---
openapi: 3.1.0
info:
  title: Fluid Admin v2 API
  version: v2
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    V2OrderErrorResponse:
      type: object
      required:
      - status
      - data
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            error:
              type: string
    PostApiV2RepsResponse201ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        rep:
          title: UserCompany
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - string
              - number
              - 'null'
            active:
              type:
              - boolean
              - 'null'
              default: true
            external_id:
              type:
              - string
              - 'null'
              - number
              - integer
            username:
              type:
              - string
              - 'null'
              - number
              - integer
            first_name:
              type:
              - string
              - number
              - integer
              - 'null'
            last_name:
              type:
              - string
              - number
              - integer
              - 'null'
            created_at:
              type:
              - string
              - number
              - integer
              - 'null'
              format: date-time
            image_url:
              type:
              - string
              - 'null'
              - number
              - integer
            roles:
              type:
              - string
              - 'null'
              - number
              - integer
              default: user
            share_guid:
              type:
              - string
              - number
              - integer
              - 'null'
              pattern: "^[a-z0-9\\-_]+$"
              minLength: 2
            country_code:
              type:
              - string
              - number
              - integer
              - 'null'
            language_code:
              type:
              - string
              - number
              - integer
              - 'null'
            computed_full_name:
              type:
              - string
              - 'null'
              - number
              - integer
            computed_email:
              type:
              - string
              - 'null'
              - number
              - integer
            phone:
              type:
              - string
              - 'null'
              - number
              - integer
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    PostApiV2AdminsResponse201ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        admin:
          title: UserCompany
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - string
              - number
              - 'null'
            active:
              type:
              - boolean
              - 'null'
              default: true
            external_id:
              type:
              - string
              - number
              - integer
              - 'null'
            username:
              type:
              - string
              - number
              - integer
              - 'null'
            first_name:
              type:
              - string
              - number
              - integer
              - 'null'
            last_name:
              type:
              - string
              - number
              - integer
              - 'null'
            created_at:
              type:
              - string
              - number
              - integer
              - 'null'
              format: date-time
            image_url:
              type:
              - string
              - number
              - integer
              - 'null'
            share_guid:
              type:
              - string
              - number
              - integer
              - 'null'
              pattern: "^[a-z0-9\\-_]+$"
              minLength: 2
            country:
              type:
              - object
              - 'null'
              additionalProperties:
                "$ref": "#/components/schemas/JsonValue"
            language:
              type:
              - object
              - 'null'
              additionalProperties:
                "$ref": "#/components/schemas/JsonValue"
            roles:
              type:
              - array
              - 'null'
              items:
                "$ref": "#/components/schemas/JsonValue"
            computed_full_name:
              type:
              - string
              - number
              - integer
              - 'null'
            computed_email:
              type:
              - string
              - number
              - integer
              - 'null'
            phone:
              type:
              - string
              - number
              - integer
              - 'null'
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    AdminMobilePageResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time
          required:
          - request_id
          - timestamp
          additionalProperties: false
        mobile_page:
          type: object
          properties:
            allow_media_creation:
              type: boolean
            associated_displayables:
              type: array
              items:
                "$ref": "#/components/schemas/JsonValue"
            company_id:
              type: integer
            created_at:
              type: string
              format: date-time
            default:
              type: boolean
            id:
              type: integer
            kind:
              type: string
            mobile_page_tabs:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  json:
                    type: object
                    properties:
                      content:
                        type: array
                        items:
                          type: object
                          properties:
                            props:
                              type: object
                              properties:
                                id:
                                  type: string
                              required:
                              - id
                              additionalProperties: false
                            type:
                              type: string
                          required:
                          - props
                          - type
                          additionalProperties: false
                      root:
                        type: object
                        additionalProperties: false
                      zones:
                        type: object
                        additionalProperties: false
                    required:
                    - content
                    - root
                    - zones
                    additionalProperties: false
                  kind:
                    type: string
                  mobile_page_id:
                    type: integer
                  mobile_slug:
                    type:
                    - string
                    - 'null'
                  name:
                    type: string
                  navigational:
                    type: boolean
                  order:
                    type: integer
                required:
                - id
                - json
                - kind
                - mobile_page_id
                - mobile_slug
                - name
                - navigational
                - order
                additionalProperties: false
            name:
              type: string
            status:
              type: string
            updated_at:
              type: string
              format: date-time
          required:
          - allow_media_creation
          - associated_displayables
          - company_id
          - created_at
          - default
          - id
          - kind
          - mobile_page_tabs
          - name
          - status
          - updated_at
          additionalProperties: false
      required:
      - meta
      - mobile_page
      additionalProperties: false
