      summary: Update Sponsor order
      description: Credits the order's volume to a rep as a manual assignment.
        The order's sponsor changes only when update_order_sponsor is true.
      tags:
      - orders
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - order
              properties:
                order:
                  type: object
                  required:
                  - user_company_id
                  properties:
                    user_company_id:
                      type: integer
                      description: Legacy user company id of the member to credit
                        with the order's volume.
                    update_order_sponsor:
                      type: boolean
                      default: false
                      description: When true, also makes the credited member the
                        order's sponsor. If the sponsor cannot move (the order has
                        not finished processing, or the member is missing or from
                        another company) the request is refused with 422 and
                        nothing changes. Leave it out to change only the credit.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
