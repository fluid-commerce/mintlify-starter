      tags: [mist_code]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/NestedMistId"
      - name: limit
        in: query
        description: |
          Maximum number of deployments to return. Defaults to 20; values
          outside 1–100 are clamped to that range.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Recent deployments (newest first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployments:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Deployment"
              example:
