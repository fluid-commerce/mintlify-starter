  "/api/v202604/mists/{mist_id}/deployments":
    get:
      operationId: mist_deployments_list
      summary: List recent Vercel deployments for the Mist
      description: |
        Returns the Mist's most recent deployments, newest first, with each
        deployment's state, URL, target, and the commit it was built from.
        Deployments are created when code is pushed to the Mist's
        repository; this endpoint only reads them. Poll it after a push to
        follow the build.

        Returns `409` while the Mist is `pending_destroy`, and `422` with
        `error.details.type` of `not_provisioned` if its deployment
        project does not exist yet.

        Requires a company admin token with the `mist.code` permission.
