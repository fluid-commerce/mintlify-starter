  "/api/v202604/mists/{mist_id}/deployments/{id}":
    get:
      operationId: mist_deployments_show
      summary: Show one Vercel deployment
      description: |
        Returns one deployment by its ID, with its current state, URL,
        target, and commit. Poll it to follow a build until it reaches
        `ready`, `error`, or `canceled`. When a production deployment of a
        Mist that is still `provisioning` is `ready`, the Mist moves to
        `live`.

        Returns `404` if the deployment does not exist, and `409` while the
        Mist is `pending_destroy`.

        Requires a company admin token with the `mist.code` permission.
      x-fluid-audience: company
      tags: [mist_code]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/NestedMistId"
      - "$ref": "#/components/parameters/DeploymentId"
      responses:
        '200':
          description: The deployment
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment:
                    "$ref": "#/components/schemas/Deployment"
              example:
                deployment:
                  id: dpl_9Fq3xTnB7kLm2VwR8cYh4Jd
                  state: ready
                  url: https://dunder-mifflin-3bed85-9fq3xtnb7.vercel.app
                  commit_sha: 4e1b7c9a2d05f3e68b1c7a94d2e05b3f6a8c1d27
