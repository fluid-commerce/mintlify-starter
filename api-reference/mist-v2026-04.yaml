---
openapi: 3.1.0
info:
  title: Fluid Mist v2026-04 API
  version: v2026-04
  description: |
    Mist is Fluid's lite cloud for hosting droplets, drop zones, and app
    extensions. One API call provisions a GitHub repository, a Postgres
    database, and a deployment behind a Fluid-hosted subdomain.

    The Fluid CLI (`fluid mist ...`) is built on this API, and every
    developer-facing Mist workflow is available through it. All endpoints
    require a company admin Bearer token with the matching `mist.*`
    permission.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: mists
  description: |
    Provision, list, inspect, rename, delete, and restore Mist apps.
    Deleting a Mist starts a 15-day grace period during which it can be
    restored.
  x-fluid-section: Developers
- name: mist_env_vars
  description: |
    Read and manage the environment variables on a Mist app's deployment
    project. Variables that Mist provisions itself are listed but read-only.
  x-fluid-section: Developers
- name: mist_code
  description: |
    Read a Mist app's deployments and its runtime and build logs.
  x-fluid-section: Developers
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Accepts company admin tokens with
        the matching `mist.*` permission:
          - `mist.view` to list and show Mists
          - `mist.create` to create and rename Mists
          - `mist.destroy` to delete and restore Mists
          - `mist.code` for deployments and logs
          - `mist.env_vars` to read and manage environment variables
        Droplet installation tokens are refused.
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Business rule violation or vendor configuration error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    PaymentRequired:
      description: >-
        The operation was refused before any vendor allocation, for one of two reasons. Billing
        admission refused it: error.details carries the shared billing_unresolved details (tier,
        state, episode_id, condition_id, eligible_since, recovery_path); nothing names a bank
        account, a waiver, or an actor. Or the company's Mist hosting is paid from credits and its
        spendable balance is spent: error.details is error credits_exhausted, category hosting,
        and recovery_path. Mists already running are never stopped for credits.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        The create collides with earlier work. error.details.reason is duplicate_recent_create
        (a same-name hosting inside the duplicate-guard window), operation_in_progress (an identical
        request under this operation key was admitted and has not finished), operation_completed (an
        identical create under the client's operation key already completed; error.details.provider_reference
        names the hosting it recorded), operation_uncertain (an identical create started, its outcome is
        unknown, and a hosting it may have allocated still exists), or operation_conflict (the operation
        key already admits a different request).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: >-
        Billing admission could not be recorded, so nothing was allocated. This is not a refusal;
        error.details.reason is admission_unavailable and the create may be retried.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    BadGateway:
      description: Upstream vendor (GitHub / Neon / Vercel) error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  parameters:
    MistId:
      name: id
      in: path
      required: true
      description: UUID of the company-owned Mist app.
      schema:
        type: string
        format: uuid
    NestedMistId:
      name: mist_id
      in: path
      required: true
      description: UUID of the company-owned Mist app.
      schema:
        type: string
        format: uuid
    EnvVarKey:
      name: key
      in: path
      required: true
      description: Environment variable name, such as `STRIPE_API_KEY`.
      schema:
        type: string
        pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
    DeploymentId:
      name: id
      in: path
      required: true
      description: Deployment ID, prefixed `dpl_`, such as `dpl_9Fq3xTnB7kLm2VwR8cYh4Jd`.
      schema:
        type: string
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      properties:
        cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
        prev_cursor:
          type:
          - string
          - 'null'
        next_cursor:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        status:
          type: integer
        meta:
          "$ref": "#/components/schemas/Meta"
    Mist:
      type: object
      description: One Mist hosting — the deployed extension with its repo, database, and Vercel project.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the Mist.
        slug:
          type: string
          description: 6-char URL-safe disambiguator drawn from the random tail of the uuid
        state:
          type: string
          enum: [provisioning, live, failed, pending_destroy, archived]
        kind:
          type: string
          enum: [next_app]
        name:
          type:
          - string
          - 'null'
          description: Optional display label
        public_url:
          type:
          - string
          - 'null'
          format: uri
        provisioned_at:
          type:
          - string
          - 'null'
          format: date-time
        scheduled_destroy_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |
            ISO-8601 timestamp 15 days after
            `DELETE /api/v202604/mists/{id}` was called. Non-null only while `state == "pending_destroy"`.
            After this timestamp the Mist's repository, database, and
            deployment are permanently torn down; call
            `POST /api/v202604/mists/{mist_id}/restore` any time before
            then to cancel the deletion.
        template:
          type:
          - string
          - 'null'
          description: |
            Slug of the template this app was generated from, or null when
            it came from the install-wide starter. The repo the slug points
            at and the commit the copy received are internal.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EnvVar:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        targets:
          type: array
          items:
            type: string
            enum: [production, preview, development]
        managed_by:
          type: string
          enum: [user, mist]
          description: |
            `mist` for variables Mist provisions and rotates itself, such as
            `DATABASE_URL` and the `FLUID_*` connection variables. `user` for
            everything else. Mist-managed variables are read-only through
            this API.
        pull_to_local:
          type: boolean
          description: |
            Whether the variable belongs in a local development environment
            file. `false` for Mist-managed variables that only make sense in
            the deployed app, such as `DATABASE_URL`.
    Deployment:
      type: object
      properties:
        id:
          type: string
          description: Deployment ID, prefixed `dpl_`.
        state:
          type: string
          enum: [ready, building, error, canceled, queued]
        url:
          type:
          - string
          - 'null'
          format: uri
        commit_sha:
          type:
          - string
          - 'null'
        commit_message:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        target:
          type:
          - string
          - 'null'
          enum: [production, preview, null]
    LogEntry:
      type: object
      properties:
        timestamp:
          type:
          - string
          - 'null'
          format: date-time
        level:
          type: string
          description: stdout / stderr / build event type
        message:
          type:
          - string
          - 'null'
        source:
          type:
          - string
          - 'null'
          description: lambda / build / etc.
paths:
  "/api/v202604/mists":
    get:
      operationId: mist_list
      summary: List the current company's Mists, newest first
      description: |
        Returns the current company's Mist apps, newest first by default,
        including apps that are scheduled for deletion. Filter by `state`
        or `kind`, and page through the results with
        `page[cursor]` and `page[limit]`.

        Requires a company admin token with the `mist.view` permission.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      parameters:
      - name: filter[state]
        in: query
        description: Return only Mists in this lifecycle state.
        schema:
          type: string
          enum: [provisioning, live, failed, pending_destroy, archived]
      - name: filter[kind]
        in: query
        description: Return only Mists of this kind, such as `next_app`.
        schema:
          type: string
      - name: page[cursor]
        in: query
        description: |
          Opaque cursor from `meta.pagination.next_cursor` or
          `meta.pagination.prev_cursor` of a previous response. Omit it to
          start from the first page.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Number of Mists per page. Defaults to 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: sort
        in: query
        description: |
          Sort order by creation time. `-created_at` (the default) returns
          the newest first; `created_at` returns the oldest first.
        schema:
          type: string
          enum: [created_at, -created_at]
      responses:
        '200':
          description: List of mists
          content:
            application/json:
              schema:
                type: object
                properties:
                  mists:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Mist"
                  meta:
                    allOf:
                    - "$ref": "#/components/schemas/Meta"
                    - type: object
                      properties:
                        pagination:
                          "$ref": "#/components/schemas/PaginationMeta"
              example:
                mists:
                - id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: live
                  kind: next_app
                  name: Loyalty rewards
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at: '2026-04-14T16:22:41Z'
                  scheduled_destroy_at:
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-14T16:22:41Z'
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
                  pagination:
                    cursor:
                    limit: 25
                    prev_cursor:
                    next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0wNC0xNFQxNjoyMTo1OFoifQ
        '401':
          $ref: "#/components/responses/Unauthorized"
        '422':
          $ref: "#/components/responses/Unprocessable"
    post:
      operationId: mist_create
      summary: Provision a new Mist
      description: |
        Creates a Mist app for the current company. The request creates
        the app's GitHub repository, Postgres database, API tokens, and
        deployment project with its public domain, then returns `201` with
        `state: "provisioning"` and the final `public_url`. The first
        deployment runs in the background; the Mist moves to `live` when
        it finishes. Poll `GET /api/v202604/mists/{id}` to watch the state.

        If any provisioning step fails, the steps that already completed
        are rolled back and the response is `422` naming the failing step.

        The app is created standalone. Attaching it to the Fluid surfaces
        it plugs into, such as a droplet, a drop zone, or a mobile embed,
        happens separately after creation.

        Requires a company admin token with the `mist.create` permission.
        Creating a Mist allocates billable infrastructure, so it can be
        refused with `402` before anything is allocated: by billing
        admission, or with `credits_exhausted` when the company's Mist
        hosting is paid from credits and none are left to spend.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mist]
              properties:
                mist:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 255
                      description: Optional display label
                    kind:
                      type: string
                      enum: [next_app]
                      default: next_app
                    template:
                      type: string
                      maxLength: 100
                      description: |
                        Slug of the template to generate this app from. Only
                        templates Fluid has approved for your company are
                        accepted; a repository name is not. Omit it to use
                        the default template.

                        A template you cannot use is refused before anything
                        is allocated, as `422` with `error.details.reason` of
                        `unknown_template` (no such slug, or one restricted
                        to another company) or `template_disabled`.

                        A template that fails its checks while the app is
                        generated is refused as `422` from the provisioning
                        step, where the machine-readable code is
                        `error.details.type`, not `reason`:
                        `template_not_usable` (withdrawn between the request
                        and generation), `template_sha_drift` (the template
                        changed since it was reviewed, including during
                        generation), `template_commit_unresolved` (its
                        current version could not be read), or
                        `repo_not_owned` (a repository with the derived name
                        already exists and was not created for this app, so
                        it is refused rather than adopted).
            example:
              mist:
                name: Loyalty rewards
                kind: next_app
                template: rewards-starter
      responses:
        '201':
          description: |
            Mist created. `state` is `provisioning` until the first
            deployment finishes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mist:
                    "$ref": "#/components/schemas/Mist"
                  meta:
                    "$ref": "#/components/schemas/Meta"
              example:
                mist:
                  id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: provisioning
                  kind: next_app
                  name: Loyalty rewards
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at:
                  scheduled_destroy_at:
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-14T16:22:04Z'
                status: 201
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-14T16:22:04Z'
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '402':
          $ref: "#/components/responses/PaymentRequired"
        '409':
          $ref: "#/components/responses/Conflict"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '503':
          $ref: "#/components/responses/ServiceUnavailable"
  "/api/v202604/mists/{id}":
    get:
      operationId: mist_show
      summary: Show one Mist
      description: |
        Returns one of the current company's Mist apps, including its
        lifecycle `state`, `public_url`, and, while it is scheduled for
        deletion, the `scheduled_destroy_at` deadline for restoring it.
        Poll this endpoint after creating a Mist to see it move from
        `provisioning` to `live`. A Mist that belongs to another company
        returns `404`.

        Requires a company admin token with the `mist.view` permission.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/MistId"
      responses:
        '200':
          description: The mist
          content:
            application/json:
              schema:
                type: object
                properties:
                  mist:
                    "$ref": "#/components/schemas/Mist"
              example:
                mist:
                  id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: live
                  kind: next_app
                  name: Loyalty rewards
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at: '2026-04-14T16:22:41Z'
                  scheduled_destroy_at:
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-14T16:22:41Z'
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: mist_update
      summary: Update a Mist (rename)
      description: |
        Edits a Mist's display attributes, such as its `name`. The app's
        repository, database, and deployment are not re-provisioned.

        Attaching the app to Fluid surfaces is managed separately, not
        here.

        Returns `409` if the Mist is `pending_destroy`; restore it first
        with `POST /api/v202604/mists/{mist_id}/restore`.

        Requires a company admin token with the `mist.create` permission.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/MistId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mist]
              properties:
                mist:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 255
                    kind:
                      type: string
                      enum: [next_app]
            example:
              mist:
                name: Loyalty rewards (EU)
      responses:
        '200':
          description: Updated mist
          content:
            application/json:
              schema:
                type: object
                properties:
                  mist:
                    "$ref": "#/components/schemas/Mist"
              example:
                mist:
                  id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: live
                  kind: next_app
                  name: Loyalty rewards (EU)
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at: '2026-04-14T16:22:41Z'
                  scheduled_destroy_at:
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-21T11:03:17Z'
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-21T11:03:17Z'
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          description: Mist is pending_destroy
        '422':
          $ref: "#/components/responses/Unprocessable"
    delete:
      operationId: mist_destroy
      summary: Schedule a Mist for destruction (15-day grace)
      description: |
        Schedules the Mist for deletion 15 days out. The state changes to
        `pending_destroy` and `scheduled_destroy_at` is set. The app's
        repository, database, and deployment stay intact throughout the
        grace period, so an accidental delete can be undone without data
        loss with `POST /api/v202604/mists/{mist_id}/restore`.

        While the Mist is `pending_destroy`, you can still read and
        restore it, but its env var, domain, deployment, and log
        endpoints return `409`. When the grace period ends, the
        app's resources are permanently torn down.

        Returns `409` if the Mist is already `pending_destroy`.

        Requires a company admin token with the `mist.destroy` permission.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/MistId"
      responses:
        '202':
          description: |
            Scheduled for destruction. The response carries the mist
            with `state: "pending_destroy"` and a non-null
            `scheduled_destroy_at`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mist:
                    "$ref": "#/components/schemas/Mist"
              example:
                mist:
                  id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: pending_destroy
                  kind: next_app
                  name: Loyalty rewards
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at: '2026-04-14T16:22:41Z'
                  scheduled_destroy_at: '2026-05-06T10:30:00Z'
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-21T10:30:00Z'
                status: 202
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-21T10:30:00Z'
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          description: Mist is already pending_destroy.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v202604/mists/{mist_id}/restore":
    post:
      operationId: mist_restore
      summary: Cancel a pending teardown within the 15-day grace window
      description: |
        Cancels the deletion of a `pending_destroy` Mist. The state returns
        to `live` and `scheduled_destroy_at` is cleared.

        Returns `410 Gone` if the grace period has already ended and the
        teardown is in progress, and `422` if the Mist is not in the
        `pending_destroy` state.

        Requires a company admin token with the `mist.destroy` permission,
        the same permission that deletes a Mist.
      x-fluid-audience: company
      tags: [mists]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/NestedMistId"
      responses:
        '200':
          description: Restored — state flipped back to live.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mist:
                    "$ref": "#/components/schemas/Mist"
              example:
                mist:
                  id: 0192f4c1-7a3e-7d52-9b61-3bed85a41c07
                  slug: 3bed85
                  state: live
                  kind: next_app
                  name: Loyalty rewards
                  public_url: https://dunder-mifflin-3bed85.mist.fluid.app
                  provisioned_at: '2026-04-14T16:22:41Z'
                  scheduled_destroy_at:
                  template: rewards-starter
                  created_at: '2026-04-14T16:21:58Z'
                  updated_at: '2026-04-22T08:12:45Z'
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-22T08:12:45Z'
        '401':
          $ref: "#/components/responses/Unauthorized"
        '404':
          $ref: "#/components/responses/NotFound"
        '410':
          description: Grace period has expired; teardown is in flight.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          $ref: "#/components/responses/Unprocessable"
  "/api/v202604/mists/{mist_id}/env_vars":
    get:
      operationId: mist_env_vars_list
      summary: List env vars on the Mist's Vercel project
      description: |
        Returns every environment variable on the Mist's deployment
        project, with its value and targets. Each variable carries
        `managed_by`: `mist` for variables Mist provisions and rotates
        itself, which are read-only, and `user` for variables you manage.
        `pull_to_local` marks the variables that belong in a local
        development environment file.

