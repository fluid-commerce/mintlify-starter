  "/api/v202604/mists/{mist_id}/logs":
    get:
      operationId: mist_logs_read
      summary: Runtime + build logs from a deployment
      description: |
        Returns build and runtime log entries from `deployment_id` if
        supplied, otherwise from the Mist's most recent deployment. The
        response names the deployment it read from. To tail logs, poll
        with `since` set to the newest entry's `timestamp` from the
        previous response.

        Returns `422` with `error.details.type` of `no_deployment` when
        the Mist has no deployment yet, `404` if `deployment_id` does not
        exist, and `409` while the Mist is `pending_destroy`.

        Requires a company admin token with the `mist.code` permission.
      x-fluid-audience: company
      tags: [mist_code]
      security:
      - bearer_auth: []
      parameters:
      - "$ref": "#/components/parameters/NestedMistId"
      - name: deployment_id
        in: query
        description: |
          Deployment to read logs from, prefixed `dpl_`. Defaults to the
          Mist's most recent deployment.
        schema:
          type: string
      - name: since
        in: query
        description: ISO-8601 timestamp; only entries newer than this are returned.
        schema:
          type: string
      - name: limit
        in: query
        description: |
          Maximum number of log entries to return. Defaults to 100; values
          outside 1–1000 are clamped to that range.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  deployment_id:
                    type: string
                  logs:
                    type: array
                    items:
                      "$ref": "#/components/schemas/LogEntry"
              example:
                deployment_id: dpl_9Fq3xTnB7kLm2VwR8cYh4Jd
                logs:
                - timestamp: '2026-04-20T09:14:57Z'
                  level: stdout
                  message: 'GET /api/rewards/balance 200 in 84ms'
                  source: lambda
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '404':
          $ref: "#/components/responses/NotFound"
        '422':
          $ref: "#/components/responses/Unprocessable"
        '502':
          $ref: "#/components/responses/BadGateway"
