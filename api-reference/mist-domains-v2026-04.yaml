---
openapi: 3.1.0
info:
  title: Fluid Mist Domains v2026-04 API
  version: v2026-04
  description: |
    Manage custom domains on a provisioned Mist app. Attach a domain, add
    the DNS records the response returns at your DNS provider, then check
    the domain until it is verified.

    All endpoints require a company admin Bearer token with the
    `mist.env_vars` permission.
servers:
- url: https://api.fluid.app
tags:
- name: mist_domains
  description: List, attach, inspect, and remove a Mist project's domains.
  x-fluid-section: Developers
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: |
        Bearer token authentication. Accepts company admin tokens with the
        `mist.env_vars` permission. Droplet installation tokens are refused.
  parameters:
    MistId:
      name: mist_id
      in: path
      required: true
      description: UUID of the company-owned Mist hosting project.
      schema:
        type: string
        format: uuid
    DomainName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: Fully qualified domain name, including any subdomain.
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: [string, 'null']
        timestamp:
          type: string
          format: date-time
    DnsRecord:
      type: object
      properties:
        type:
          type: string
        domain:
          type: string
        value:
          type: string
      additionalProperties: true
    Domain:
      type: object
      required: [name, apex_name, verified, verification, misconfigured, recommended_records]
      properties:
        name:
          type: string
        apex_name:
          type: [string, 'null']
        verified:
          type: boolean
        verification:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
        misconfigured:
          type: [boolean, 'null']
        recommended_records:
          type: array
          items:
            $ref: '#/components/schemas/DnsRecord'
        created_at:
          type: [string, 'null']
    ErrorResponse:
      type: object
      required: [error, status, meta]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    AuthenticationErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: The domain request is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationErrorResponse'
    Forbidden:
      description: The actor cannot manage Mist domains.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationErrorResponse'
    NotFound:
      description: The Mist or domain was not found in this company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The Mist project is still provisioning.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: The domain is invalid or belongs to another project.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Vercel could not complete the domain request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
paths:
  "/api/v202604/mists/{mist_id}/domains":
    parameters:
    - $ref: '#/components/parameters/MistId'
    get:
      operationId: mistDomainsIndex
      x-fluid-audience: company
      summary: List attached custom domains
      description: Return the domains attached to a provisioned Mist project with their DNS state.
      tags: [mist_domains]
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Domains attached to the Mist project.
          content:
            application/json:
              schema:
                type: object
                required: [domains, status, meta]
                properties:
                  domains:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                domains:
                - name: shop.acmewellness.com
                  apex_name: acmewellness.com
                  verified: true
                  verification: []
                  misconfigured: false
                  recommended_records:
                  - type: CNAME
                    domain: shop
                    value: cname.vercel-dns.com
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/BadGateway' }
    post:
      operationId: mistDomainsCreate
      x-fluid-audience: company
      summary: Attach a custom domain
      description: Attach a domain to the Mist project and return its verification and routing records.
      tags: [mist_domains]
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
            example:
              domain:
                name: shop.acmewellness.com
      responses:
        '201':
          description: Domain attached to the Mist project.
          content:
            application/json:
              schema:
                type: object
                required: [domain, status, meta]
                properties:
                  domain:
                    $ref: '#/components/schemas/Domain'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                domain:
                  name: shop.acmewellness.com
                  apex_name: acmewellness.com
                  verified: false
                  verification:
                  - type: TXT
                    domain: _vercel.acmewellness.com
                    value: vc-domain-verify=shop.acmewellness.com,7d41c2b9e8a05f36
                  misconfigured: true
                  recommended_records:
                  - type: CNAME
                    domain: shop
                    value: cname.vercel-dns.com
                status: 201
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
  "/api/v202604/mists/{mist_id}/domains/{name}":
    parameters:
    - $ref: '#/components/parameters/MistId'
    - $ref: '#/components/parameters/DomainName'
    get:
      operationId: mistDomainsShow
      x-fluid-audience: company
      summary: Inspect a custom domain
      description: Read Vercel's current ownership verification and DNS routing state for one domain.
      tags: [mist_domains]
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Current domain verification and routing state.
          content:
            application/json:
              schema:
                type: object
                required: [domain, status, meta]
                properties:
                  domain:
                    $ref: '#/components/schemas/Domain'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                domain:
                  name: shop.acmewellness.com
                  apex_name: acmewellness.com
                  verified: true
                  verification: []
                  misconfigured: false
                  recommended_records:
                  - type: CNAME
                    domain: shop
                    value: cname.vercel-dns.com
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      operationId: mistDomainsDestroy
      x-fluid-audience: company
      summary: Detach a custom domain
      description: Detach a domain from the Mist project; an already absent domain also succeeds.
      tags: [mist_domains]
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Domain detached, including an already absent domain.
          content:
            application/json:
              schema:
                type: object
                required: [domain, status, meta]
                properties:
                  domain:
                    $ref: '#/components/schemas/Domain'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                domain:
                  name: shop.acmewellness.com
                  apex_name: acmewellness.com
                  verified: true
                  verification: []
                  misconfigured: false
                  recommended_records:
                  - type: CNAME
                    domain: shop
                    value: cname.vercel-dns.com
                status: 200
                meta:
                  request_id: 6f1c2a9e-4b7d-4e8a-9c3f-2d5b8a1e7f40
                  timestamp: '2026-04-20T09:15:02Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/BadGateway' }
