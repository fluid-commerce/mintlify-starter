  /api/company/v2026-10/messages:
    get:
      operationId: companyMessagesIndex
      summary: Search outbound message history by phone, email, contact or customer
      description: >-
        Check recent outreach before following up about an abandoned cart, purchase or subscription.
        Returns this company's company-messages API and WeBot playbook attempts, newest first by created_at and id,
        including context and delivery events. Fetch GET /api/company/v2026-10/messages/{id} for original decrypted content. Needs outbound_messages.view.
        Name at most one of to, email, phone, contact_id, customer_id or member_id; other filters combine with AND.
        Address filters match the actual destination; owner filters span the owner's channels and known addresses.
        Refused attempts were not sent, scheduled attempts are waiting, accepted means queued, and sent means
        handed to the transport. Read events.occurred_at to learn when a send or delivery happened;
        created_at only records when the attempt was requested. Email delivered means the receiving server
        accepted it; SMS delivered is carrier confirmation; push delivered means Expo reported handoff to
        APNs or FCM. None proves the person read it. Flow records sent without a delivery receipt.
        This is context for etiquette, not an atomic reservation; concurrent bots must still honor send rules.
        Legacy mailers, other SMS paths and inbound messages are not included. Older WeBot playbook messages may have content_available=false; their delivery metadata is still returned.
      tags: [outbound-messages]
      x-fluid-audience: company
      x-fluid-related:
      - GET /api/company/v2026-10/messages/{id}
      - POST /api/company/v2026-10/messages/email
      - POST /api/company/v2026-10/messages/sms
      - POST /api/company/v2026-10/messages/whatsapp
      - POST /api/company/v2026-10/messages/push
      parameters:
      - name: to
        in: query
        description: "Exact email or phone number. Email is case-insensitive; phone numbers are normalized to E.164."
        schema: {"type": "string", "maxLength": 320}
      - name: email
        in: query
        description: "Alias for to, restricted to a valid email address."
        schema: {"type": "string", "maxLength": 320}
      - name: phone
        in: query
        description: "Alias for to, restricted to a valid phone number. Numbers without a country code are interpreted as US numbers."
        schema: {"type": "string", "maxLength": 64}
      - name: contact_id
        in: query
        description: "Contact numeric id or UUIDv7 in this company. Includes earlier bare-address sends to its known addresses."
        schema: {"type": "string"}
      - name: customer_id
        in: query
        description: "Legacy numeric customer id from the customers API. Includes its member history and bare-address sends to known addresses."
        schema: {"type": "string"}
      - name: member_id
        in: query
        description: "Member UUID in this company. Includes all channels and bare-address sends to known addresses."
        schema: {"type": "string", "format": "uuid"}
      - name: channel
        in: query
        description: "Restrict to one outbound channel."
        schema: {"type": "string", "enum": ["email", "sms", "whatsapp", "push", "flow"]}
      - name: exclude_channel
        in: query
        description: "Leave one outbound channel out, such as `flow` for outside deliveries only. Must differ from `channel`."
        schema: {"type": "string", "enum": ["email", "sms", "whatsapp", "push", "flow"]}
      - name: status
        in: query
        description: "Latest recorded delivery state. accepted and scheduled do not mean sent; delivered is provider confirmation, not proof of reading."
        schema: {"type": "string", "enum": ["accepted", "scheduled", "sent", "delivered", "failed", "refused"]}
      - name: message_type
        in: query
        description: "Restrict to transactional or marketing attempts."
        schema: {"type": "string", "enum": ["transactional", "marketing"]}
      - name: query
        in: query
        description: "All normalized whole words must occur in the subject, body or template. Case-insensitive; ignores HTML markup. No substring, phrase or semantic matching. Returns 503 while historical content is still indexing."
        schema: {"type": "string", "maxLength": 500}
      - name: created_after
        in: query
        description: "Include attempts created at or after this time. This is the request time, not the delivery time."
        schema: {"type": "string", "format": "date-time"}
      - name: created_before
        in: query
        description: "Include attempts created before this time. Must be later than created_after."
        schema: {"type": "string", "format": "date-time"}
      - name: limit
        in: query
        description: "Page size, from 1 to 100; defaults to 25."
        schema: {"type": "integer", "minimum": 1, "maximum": 100}
      - name: cursor
        in: query
        description: "Opaque next_cursor from the previous page with the same filters. Malformed cursors return 422; a cursor for different filters may restart at the first page of the current query."
        schema: {"type": "string", "maxLength": 4096}
      responses:
        '200':
          description: Matching outbound attempts and the cursor for older attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistoryResponse'
              example:
                messages: []
                history_complete: true
                page: {next_cursor: null, has_more: false}
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-23T14:05:12Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: The caller lacks outbound_messages.view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: Filters are invalid or the cursor is malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Historical message text is still indexing. Retry later or omit query to read recipient history immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
