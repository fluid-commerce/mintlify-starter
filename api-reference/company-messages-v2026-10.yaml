                  conversation_id: null
                  created_at: '2026-10-23T14:05:12Z'
                  updated_at: '2026-10-23T14:05:16Z'
                  events:
                  - status: accepted
                    detail: null
                    occurred_at: '2026-10-23T14:05:12Z'
                  - status: sent
                    detail: null
                    occurred_at: '2026-10-23T14:05:13Z'
                  - status: delivered
                    detail: null
                    occurred_at: '2026-10-23T14:05:16Z'
                  send_at: null
                status: 200
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-23T14:05:12Z'
        '400':
          description: No idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: The caller lacks the channel's permission or isn't a company admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '422':
          description: 'Refused: invalid parameters (`ErrorResponse`), or a channel, recipient or content refusal (`RefusalResponse`).'
