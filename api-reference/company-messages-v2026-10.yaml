openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Messages
  version: 2026-10
  description: 'Send email, SMS, WhatsApp, push notifications and Flow messages to your members, customers and contacts, and
    see whether they were delivered.


    Every message goes out from your company''s own identities: email from your company''s sending address (Amazon SES), SMS
    from your registered number (Twilio). Fluid never falls back to a shared sender. If a channel isn''t set up yet, the request
    is refused with a clear `code` and a `setup` block saying what''s left and where to finish it.


    Name the recipient with exactly one of `to` (an address), `contact_id`, `customer_id` or `member_id`. Customers and members
    are the same people. Push, preferred and Flow take `member_id` only.


    To message someone inside Flow, use `POST /api/company/v2026-10/messages/flow`, or Flow''s own messaging API (`POST /api/v1/messaging/conversations`
    and `POST /api/v1/messaging/conversations/{id}/messages`).


    Every send, accepted or refused, is kept with its delivery events, so `GET /api/company/v2026-10/messages/{id}` shows
    what happened. Delivery outcomes also teach Fluid about the address: a delivery marks it verified, and a hard bounce,
    complaint, invalid number or unsubscribe marks it as no longer usable.


    Sign in as an admin of your company, or use a company API token, a droplet token holding the opt-in `messaging` scope,
    or a bot token (`bearer_auth`). Each channel needs its own permission: `outbound_messages.email`, `.sms`, `.whatsapp`,
    `.push` or `.flow`; reading a message needs `outbound_messages.view`. A bot''s send is a `message_customer` action
    (`GET /api/company/v2026-10/bot-action-classes`), so its owner''s mode for messaging people decides whether it waits
    for approval, and the send rules apply as to any other sender.'
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: outbound-messages
  description: Send messages to members, customers and contacts, and track delivery.
  x-fluid-section: Messaging
- name: contact-methods
  description: Every way to reach a member or contact, and a member's devices.
  x-fluid-section: Messaging
- name: flow-senders
  description: 'Who apps post Flow messages as: each app''s own sender, and the people who let an app send as them.'
  x-fluid-section: Messaging
- name: devices
  description: A person's phones and desktop apps, desktop presence, and signing a device out.
  x-fluid-section: Messaging
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: An admin session, company API token, droplet token or bot token.
  schemas:
    Meta:
      type: object
      description: Response metadata.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    LegacyError:
      description: The error body an authorization refusal answers with.
      type: object
      additionalProperties: true
    Refusal:
      type: object
      description: Why Fluid didn't send. The same shape for every channel.
      required:
      - code
      - message
      - channel
      additionalProperties: false
      properties:
        code:
          type: string
          description: 'Setup: `email_sender_not_configured`, `sms_not_registered`, `whatsapp_not_configured`, `push_no_devices`,
            `channel_disabled`. Recipient: `recipient_not_found`, `recipient_ambiguous`, `no_contact_method`, `contact_method_invalid`,
            `consent_required`, `opted_out`, `invalid_address`, `address_not_allowed`, `content_required`, `no_reachable_channel`,
            `idempotency_key_reused`, `queue_failed`, `bot_not_found`, `sender_required`. Flow sender: `bot_not_authorized`,
            `sender_not_authorized`, `send_as_not_found`, `sender_ambiguous`, `app_sender_disabled`, `app_sender_unavailable`.
            Send rules (marketing only): `quiet_hours` (with `send_at`, when you passed no_queue), `frequency_capped` (with
            `next_allowed_at`), `promotional_mail_unavailable` (marketing email until Fluid''s promotional sending path is
            ready).'
        message:
          type: string
          description: A plain-English explanation.
        channel:
          type: string
          description: 'The channel that refused: email, sms, whatsapp, push, flow or preferred.'
        message_id:
          type: string
          format: uuid
          description: The refused message Fluid kept, when it kept one.
        setup:
          type: object
          additionalProperties: true
          description: 'Present when the company has setup to finish. `status` says how far along it is (for SMS: not_started,
            brand_pending, campaign_pending, number_pending, rejected or approved_no_number), `next_step` what to do, `setup_url`
            the Admin page. For preferred, `tried` lists each channel tried and why it was skipped.'
          properties:
            status:
              type: string
            next_step:
              type: string
            setup_url:
              type: string
            tried:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - channel
                - code
                properties:
                  channel:
                    type: string
                  code:
                    type: string
        send_at:
          type: string
          format: date-time
          description: 'With quiet_hours: when the message may go.'
        next_allowed_at:
          type: string
          format: date-time
          description: 'With frequency_capped: when the next marketing message on this channel may go to this person.'
    RefusalResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          $ref: '#/components/schemas/Refusal'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    MessageEvent:
      type: object
      additionalProperties: false
      required:
      - status
      - detail
      - occurred_at
      properties:
        status:
          type: string
          enum:
          - accepted
          - scheduled
          - sent
          - delivered
          - failed
          - refused
        detail:
          type:
          - string
          - 'null'
          description: Why, for failed and refused events (for example bounced, unsubscribed, sms_not_registered).
        occurred_at:
          type: string
          format: date-time
    OutboundMessage:
      type: object
      additionalProperties: false
      description: A message sent through this API. History reads may include decrypted content for authorized viewers.
      required:
      - id
      - channel
      - message_type
      - status
      - refusal_code
      - provider
      - provider_message_id
      - recipient
      - conversation_id
      - created_at
      - updated_at
      - events
      - send_at
      properties:
        recipient_address:
          type: [string, 'null']
          description: The destination email or phone stored with the attempt. Null for member-addressed push or Flow messages and historical attempts without an address. Present on authorized history reads.
        subject:
          type: [string, 'null']
          description: Email subject or push title, with links and authentication credentials redacted. Null for messages without a subject or title. Present on authorized history reads.
        source:
          type: string
          enum: [company_messages, we_bot_outreach]
          description: Which outbound pipeline recorded the attempt. Present on history reads.
        context:
          type: object
          additionalProperties: false
          description: The bot playbook and subject when this was a playbook message. Empty for direct API sends.
          properties:
            bot_id:
              type: string
            playbook_key:
              type: string
            subject_type:
              type: string
            subject_id:
              type: string
        content_available:
          type: boolean
          description: Whether an original body snapshot exists. Older playbook messages may have metadata only; they are never re-rendered to invent historical content.
        content:
          $ref: '#/components/schemas/MessageContent'
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - email
          - sms
          - whatsapp
          - push
          - flow
        message_type:
          type: string
          enum:
          - transactional
          - marketing
        status:
          type: string
          enum:
          - accepted
          - scheduled
          - sent
          - delivered
          - failed
          - refused
          description: 'accepted: Fluid took it. sent: the provider accepted it. delivered: it reached the recipient. failed:
            it didn''t and won''t. refused: Fluid didn''t send it. `scheduled`: a marketing message held for the recipient''s
            quiet hours; it goes out at send_at.'
        refusal_code:
          type:
          - string
          - 'null'
        provider:
          type:
          - string
          - 'null'
          description: ses, twilio, expo or flow.
        provider_message_id:
          type:
          - string
          - 'null'
        recipient:
          type: object
          additionalProperties: false
          required:
          - member_id
          - contact_id
          - contact_method_id
          properties:
            member_id:
              type:
              - string
              - 'null'
            contact_id:
              type:
              - integer
              - 'null'
            contact_method_id:
              type:
              - string
              - 'null'
        conversation_id:
          type:
          - string
          - 'null'
          description: For Flow messages, the conversation it was posted in.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        events:
          type: array
          items:
            $ref: '#/components/schemas/MessageEvent'
        send_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When a scheduled message goes out.
    MessageContent:
      type: object
      additionalProperties: false
      description: Original message wording, decrypted for outbound_messages.view readers. Links and authentication credentials are redacted, including in nested push data and template parameters. The encrypted stored snapshot is unchanged. Internal sender metadata is excluded.
      properties:
        to:
          type: string
          description: The normalized recipient address used at send time, when this channel uses an address.
        subject:
          type: string
        text:
          type: string
        html:
          type: string
        reply_to:
          type: string
        title:
          type: string
        body:
          type: string
        url:
          type: string
        data:
          type: object
          additionalProperties: true
        template:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
            language:
              type: string
            params:
              type: array
              items:
                type: string
    MessageHistoryResponse:
      type: object
      required: [messages, page, history_complete, status, meta]
      properties:
        history_complete:
          type: boolean
          description: False while older WeBot attempts in this company await import. An empty or partial page must not be treated as evidence that the person has not been contacted. This covers only the outbound pipelines documented here.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OutboundMessage'
        page:
          type: object
          additionalProperties: false
          required: [next_cursor, has_more]
          properties:
            next_cursor:
              type: [string, 'null']
            has_more:
              type: boolean
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    MessageResponse:
      type: object
      required:
      - message
      - status
      - meta
      properties:
        message:
          $ref: '#/components/schemas/OutboundMessage'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    EmailBody:
      type: object
      additionalProperties: false
      required:
      - subject
      description: An email, sent from the company's own sending address.
      properties:
        to:
          type: string
          description: An email address (email) or an E.164 phone number (sms, whatsapp). Use this or one of the ids.
        contact_id:
          type: string
          description: A contact's id or uuid. Fluid uses the contact's best email or phone for the channel.
        customer_id:
          type: string
          description: A customer's id, as the customers API returns it. Customers and members are the same people.
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        subject:
          type: string
          minLength: 1
          maxLength: 998
        html:
          type: string
          description: The HTML body. Send html, text or both.
        text:
          type: string
          description: The plain-text body.
        reply_to:
          type: string
          description: An address replies go to.
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    SmsBody:
      type: object
      additionalProperties: false
      required:
      - text
      description: A text message, sent from the company's registered number.
      properties:
        to:
          type: string
          description: An email address (email) or an E.164 phone number (sms, whatsapp). Use this or one of the ids.
        contact_id:
          type: string
          description: A contact's id or uuid. Fluid uses the contact's best email or phone for the channel.
        customer_id:
          type: string
          description: A customer's id, as the customers API returns it. Customers and members are the same people.
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        text:
          type: string
          minLength: 1
          maxLength: 1600
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    WhatsappBody:
      type: object
      additionalProperties: false
      required: []
      description: 'A WhatsApp message: an approved template, or free text inside the 24-hour service window.'
      properties:
        to:
          type: string
          description: An email address (email) or an E.164 phone number (sms, whatsapp). Use this or one of the ids.
        contact_id:
          type: string
          description: A contact's id or uuid. Fluid uses the contact's best email or phone for the channel.
        customer_id:
          type: string
          description: A customer's id, as the customers API returns it. Customers and members are the same people.
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        text:
          type: string
          minLength: 1
          maxLength: 4096
          description: Free text. WhatsApp only allows it within 24 hours of the person's last message to you.
        template:
          type: object
          additionalProperties: false
          required:
          - name
          description: An approved WhatsApp template.
          properties:
            name:
              type: string
            language:
              type: string
            params:
              type: array
              items:
                type: string
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    PushBody:
      type: object
      additionalProperties: false
      required:
      - member_id
      - body
      description: A push notification to the member's signed-in phones.
      properties:
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        title:
          type: string
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 2000
        url:
          type: string
          description: Where tapping the notification takes the member in the app.
        data:
          type: object
          additionalProperties: true
          description: Extra data for the app.
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    PreferredBody:
      type: object
      additionalProperties: false
      required:
      - member_id
      - text
      description: A message on the member's preferred channel. Fluid tries their ranked contact methods first, then push,
        email and SMS, and uses the first one the company has set up and the member can receive.
      properties:
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        subject:
          type: string
          maxLength: 998
          description: Used as the email subject.
        title:
          type: string
          maxLength: 200
          description: Used as the push title.
        text:
          type: string
          minLength: 1
          maxLength: 1600
          description: The message, used on every channel.
        html:
          type: string
          description: Used as the email's HTML body.
        url:
          type: string
          description: Used as the push link.
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    FlowBody:
      type: object
      additionalProperties: false
      required:
      - member_id
      - text
      description: A Flow direct message to a member. With a person's token it comes from that person; with `bot_id`, from
        one of the company's We-Bots; with `send_as`, from a person who let your app send as them; and with an app token and
        neither, from your app's own sender, which shows your app's name and icon and an App badge.
      properties:
        member_id:
          type: string
          format: uuid
          description: A member's uuid.
        message_type:
          type: string
          enum:
          - transactional
          - marketing
          default: transactional
          description: '`marketing` needs the recipient''s marketing consent for the channel.'
        idempotency_key:
          type: string
          maxLength: 200
          description: A key you choose. Sending again with the same key answers with the first message instead of sending
            twice. You can send it as the `Idempotency-Key` header instead.
        text:
          type: string
          minLength: 1
          maxLength: 10000
        bot_id:
          type: string
          format: uuid
          description: Send as one of the company's We-Bots. Allowed for the bot's owner, its stewards, a company admin, or
            the bot's own run; anyone else gets 403 `bot_not_authorized`.
        send_as:
          type: object
          additionalProperties: false
          description: 'Send as a person: exactly one of `member_id` or `admin_id`. An app needs that person''s send delegation
            (POST /messaging/send-delegations, granted by the person themself) covering the message type, or the request is
            refused with 403 `sender_not_authorized`; Fluid never falls back to the app''s own sender. A person may only name
            themself. The message shows `sent_via` with your app''s name and icon.'
          properties:
            member_id:
              type: string
              format: uuid
              description: A member's uuid.
            admin_id:
              type: string
              description: An admin's id.
        no_queue:
          type: boolean
          default: false
          description: A marketing message asked for during the recipient's quiet hours (21:00 to 08:00 in their time zone
            by default) waits and goes out when they end. Pass true to have it refused as `quiet_hours` with `send_at` instead.
    ContactMethod:
      type: object
      additionalProperties: false
      description: One email address or phone number Fluid knows for a member or contact.
      required:
      - id
      - kind
      - value
      - source
      - sms_capable
      - whatsapp_capable
      - verified
      - verified_at
      - verified_via
      - preferred_rank
      - consent_transactional
      - consent_marketing
      - usable
      - invalidated_at
      - invalidated_reason
      - last_outcome
      - last_outcome_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - email
          - phone
        value:
          type: string
          description: 'The address: a lowercase email or an E.164 phone number.'
        source:
          type: string
          description: 'Where Fluid learned it: member_profile or contact.'
        sms_capable:
          type: boolean
        whatsapp_capable:
          type: boolean
        verified:
          type: boolean
          description: A message reached it, or its owner proved it another way.
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        verified_via:
          type:
          - string
          - 'null'
          description: delivery, profile or manual.
        preferred_rank:
          type:
          - integer
          - 'null'
          description: 1 is the owner's first choice; null means not ranked.
        consent_transactional:
          type: boolean
        consent_marketing:
          type: boolean
        usable:
          type: boolean
          description: False after a hard bounce, complaint, invalid number, unsubscribe or a manual block.
        invalidated_at:
          type:
          - string
          - 'null'
          format: date-time
        invalidated_reason:
          type:
          - string
          - 'null'
        last_outcome:
          type:
          - string
          - 'null'
          description: The latest delivery outcome, such as delivered, bounced or unsubscribed.
        last_outcome_at:
          type:
          - string
          - 'null'
          format: date-time
    Device:
      type: object
      additionalProperties: false
      description: A phone, tablet or desktop app (Mist) the person signed in on. Shown only to the person and to admins,
        never to other members or guests.
      required:
      - id
      - device_type
      - bundle_id
      - last_seen_at
      - registered_at
      - push_status
      - kind
      - app_version
      - device_name
      - os_name
      - last_active_at
      - signed_out_at
      properties:
        id:
          type: string
          format: uuid
        device_type:
          type:
          - string
          - 'null'
          description: ios, android or desktop.
        bundle_id:
          type:
          - string
          - 'null'
          description: Which app it's signed in to.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
        registered_at:
          type:
          - string
          - 'null'
          format: date-time
        push_status:
          type: string
          enum:
          - active
          - expired
          - no_token
          - desktop
          description: 'active: push can reach it. expired: not seen for a while, so its token may no longer work. desktop:
            a desktop app, which gets no phone push.'
        kind:
          type: string
          enum:
          - phone
          - desktop
          description: A desktop app has no push token.
        app_version:
          type:
          - string
          - 'null'
          description: The app's version, e.g. 1.1.0.
        device_name:
          type:
          - string
          - 'null'
          description: The machine's name, e.g. MacBook Pro.
        os_name:
          type:
          - string
          - 'null'
          description: The operating system, e.g. macOS 15.1.
        last_active_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the person last used the desktop app. While it is within two minutes, Flow message pushes to their
            phones wait two minutes and are dropped if they read the message on the desktop.
        signed_out_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the desktop app was signed out.
    ContactMethodsResponse:
      type: object
      required:
      - contact_methods
      - devices
      - messages
      - status
      - meta
      properties:
        contact_methods:
          type: array
          items:
            $ref: '#/components/schemas/ContactMethod'
        devices:
          type: array
