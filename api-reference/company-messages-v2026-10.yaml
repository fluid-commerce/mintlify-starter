    post:
      operationId: companyMessagesSendEmail
      summary: Send an email
      description: An email, sent from the company's own sending address. Needs `outbound_messages.email`.
      tags:
      - outbound-messages
      x-fluid-audience: company
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
        description: Use this or `idempotency_key` in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBody'
            example:
              member_id: 0199c2d4-8a1e-7b35-9f02-6d4e1a7c3b58
              message_type: transactional
              idempotency_key: order-104882-shipped
              subject: Your order 104882 has shipped
              html: <p>Hi Jordan, your order <strong>104882</strong> is on its way. Track it at https://shop.example.com/orders/104882.</p>
              text: Hi Jordan, your order 104882 is on its way. Track it at https://shop.example.com/orders/104882.
              reply_to: support@shop.example.com
      responses:
        '202':
          description: Accepted. Fluid kept the message and started delivering it; follow its status with GET /messages/{id}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message:
                  id: 019a1123-4b5c-7d6e-8f90-a1b2c3d4e5f6
                  channel: email
                  message_type: transactional
                  status: accepted
                  refusal_code: null
                  provider: ses
                  provider_message_id: null
                  recipient:
                    member_id: 0199c2d4-8a1e-7b35-9f02-6d4e1a7c3b58
                    contact_id: null
                    contact_method_id: 0199c2d5-1f3a-7c48-b6e1-9d2a4f7e8c13
                  conversation_id: null
                  created_at: '2026-10-23T14:05:12Z'
                  updated_at: '2026-10-23T14:05:12Z'
                  events:
                  - status: accepted
                    detail: null
                    occurred_at: '2026-10-23T14:05:12Z'
                  send_at: null
                status: 202
                meta:
                  request_uuid: 3b8f1d27-6c4e-4a91-8e5d-2f7c9a1b0e64
                  timestamp: '2026-10-23T14:05:12Z'
        '200':
          description: A repeat of an earlier request with the same idempotency key; the first message is returned and nothing
            is sent again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message:
                  id: 019a1123-4b5c-7d6e-8f90-a1b2c3d4e5f6
