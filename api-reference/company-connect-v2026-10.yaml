  /api/company/v2026-10/connect/integrations/{uuid}/provider/orders/totals:
    parameters:
    - $ref: '#/components/parameters/ConnectIntegrationUuid'
    get:
      operationId: companyConnectProviderOrdersTotals
      summary: Read provider order totals
      description: |-
        How many orders the provider (the commission engine) holds for a window and what they add up to per currency, as the integration service reads them from the provider, next to Fluid's own count for the same window under `fluid`.

        The provider dates each record by its own order date, while Fluid stamps an imported record when it reached Fluid, so the two counts can differ near the window's edges. To find the records that really differ, read the reconciliation. Amounts are integer minor units per currency, never converted.

        The window defaults to the hour ending 30 minutes ago and spans at most 31 days. A platform the integration service cannot read totals from yet answers 501 `provider_totals_unsupported`.

        Needs `droplets.view` and `orders.view`.
      tags:
      - connect
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/ProviderSince'
      - $ref: '#/components/parameters/ProviderUntil'
      responses:
        '200':
          description: The provider's and Fluid's order totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTotalsResponse'
              example:
                provider_totals:
                  entity: orders
                  since: '2026-10-24T13:00:00Z'
                  until: '2026-10-24T14:00:00Z'
                  count: 152
                  amounts:
                  - currency: USD
                    sum_cents: 1843250
                  fluid:
                    count: 149
                    linked: 147
                    amounts:
                    - currency: USD
                      sum_cents: 1801990
                  computed_at: '2026-10-24T14:31:02Z'
                status: 200
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-24T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConnectNotFound'
        '409':
          $ref: '#/components/responses/ConnectNotConnected'
        '422':
          $ref: '#/components/responses/ProviderInvalidWindow'
        '501':
          $ref: '#/components/responses/ProviderTotalsUnsupported'
        '502':
          $ref: '#/components/responses/ConnectBackendFailed'
        '503':
          $ref: '#/components/responses/ConnectUnconfigured'
