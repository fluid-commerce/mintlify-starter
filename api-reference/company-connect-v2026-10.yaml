  /api/company/v2026-10/connect/integrations/{uuid}/provider/orders/reconciliation:
    parameters:
    - $ref: '#/components/parameters/ConnectIntegrationUuid'
    get:
      operationId: companyConnectProviderOrdersReconciliation
      summary: Reconcile provider order ids
      description: |-
        Matches the provider's order ids against Fluid's `external_id`s for a window, so timing differences between the two systems never read as missing records.

        Each provider order dated in the window is looked up in Fluid by `external_id` with no time limit; those Fluid has no record of count toward `missing_in_fluid`. For an integration that exports to the provider, each order created in Fluid in the window is looked for among the provider's ids over the window widened by two hours on each side; those absent count toward `missing_in_provider`.

        The window defaults to the hour ending 30 minutes ago, spans at most 24 hours, and must end at least 30 minutes ago so records still in flight are not counted. The response carries counts; add `include=ids` to page the missing ids, 1,000 per page. A window holding more than 20,000 ids answers `truncated: true` with counts over the first 20,000.

        Needs `droplets.view` and `orders.view`.
      tags:
      - connect
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/ProviderSince'
      - $ref: '#/components/parameters/ProviderUntil'
      - $ref: '#/components/parameters/ProviderInclude'
      - $ref: '#/components/parameters/ProviderPage'
      responses:
        '200':
          description: The order reconciliation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderReconciliationResponse'
              example:
                provider_reconciliation:
                  entity: orders
                  since: '2026-10-24T13:00:00Z'
                  until: '2026-10-24T14:00:00Z'
                  provider_count: 152
                  matched: 150
                  missing_in_fluid: 2
                  missing_in_provider: 1
                  missing_in_provider_skipped: null
                  truncated: false
                  computed_at: '2026-10-24T14:31:02Z'
                  ids:
                    page: 1
                    per_page: 1000
                    missing_in_fluid:
                    - '20481733'
                    - '20481790'
                    missing_in_provider:
                    - '20481655'
                    next_page: null
                status: 200
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-24T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ConnectNotFound'
        '409':
          $ref: '#/components/responses/ConnectNotConnected'
        '422':
          $ref: '#/components/responses/ProviderInvalidWindow'
        '501':
