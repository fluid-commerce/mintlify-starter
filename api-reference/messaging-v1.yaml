  "/api/v1/messaging/conversations/all":
    get:
      summary: List all conversations by template
      tags:
      - messaging---conversations
      operationId: messaging_v1_list_all_conversations
      security:
      - bearer_auth: []
      description: |-
        Fetch several conversation lists in one request, one per template named in `templates`. Callable by a signed-in company admin or rep whose role includes the messaging view permission.

