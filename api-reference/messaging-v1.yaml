    post:
      summary: Create a conversation
      tags:
      - messaging---conversations
      operationId: messaging_v1_create_conversation
      x-fluid-audience: company
      x-fluid-lint-exempt: "Documents an existing route in the legacy unversioned messaging v1 spec; the path cannot take a dated version."
      security:
      - bearer_auth: []
      description: |-
        Create a conversation as yourself: a signed-in company admin or rep whose role includes the messaging update permission. You are always added as a participant.

        Set `conversation.type` to choose what to create:

        - `ChannelConversation`: a named channel. Only company admins can create one; a rep gets a 400. `recipients` is ignored. Members are you plus everyone matching `conversation.filter`.
        - `DirectConversation`: a one-to-one conversation with a company member or a contact.
        - `GroupConversation`: a named conversation with several participants.
        - `SmsConversation` and `EmailConversation`: a conversation with contacts over SMS or email.
        - `BotConversation`: a conversation with a bot.

        For every type except a channel, if a conversation of that type already exists with exactly the same participants, it is returned instead of a new one. A conversation stays `initiated` until its first message. Any `initiated` conversation you created with the same name is deleted first.

        Identify each participant in `recipients` by `uid`, the recipient ID of an existing company member or contact. A recipient given only by `email` or `phone` becomes one of your contacts, found or created; this applies only to direct, group, SMS, and email conversations.

        To start several conversations and send each one the same first message, send `conversations` and `message` instead of `conversation` and `recipients`. The response is then a 201 with the conversations that were created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MessagingConversationCreateRequest"
            examples:
              group:
                summary: Create a group conversation
                value:
                  conversation:
                    type: GroupConversation
                    name: Spring launch team
                    description: Planning the April product launch
                  recipients:
                  - uid: 48211
                  - uid: 48307
              channel:
                summary: Create a broadcast channel for one member type
                value:
                  conversation:
                    type: ChannelConversation
                    name: Diamond leaders
                    description: Weekly updates for Diamond-rank leaders
                    broadcasting: true
                    filter:
                      member_type_id:
                      - 12
                    auto_add_recipients: true
                  recipients: []
              batch:
                summary: Start direct conversations with two contacts and send a first message
                value:
                  conversations:
                  - conversation:
                      type: DirectConversation
                    recipients:
                    - email: maria.lopez@gmail.com
                      first_name: Maria
                      last_name: Lopez
                  - conversation:
                      type: DirectConversation
                    recipients:
                    - uid: 51930
                  message:
                    body: Thanks for your order! Let me know if you have any questions about getting started.
      responses:
        '200':
          description: The conversation was created, or an existing conversation with the same participants was found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagingConversationSummary"
              example:
                id: 90412
