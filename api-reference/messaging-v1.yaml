    MessagingConversationRecipient:
      description: A recipient in a conversation. Company members carry `status` and `last_online`; other recipients, such as contacts and bots, carry `email` and `phone` instead.
      type: object
      properties:
        avatar_background:
          type:
          - string
          - 'null'
          description: Hex color (without `#`) behind the recipient's avatar.
        avatar_url:
          type:
          - string
          - 'null'
          description: Thumbnail URL of the recipient's avatar. Null for a discarded recipient.
        blocked:
          type:
          - boolean
          - 'null'
          description: Whether you have blocked this recipient.
        conversation_messaging_enabled?:
          type:
          - boolean
          - 'null'
          description: Whether in-app messaging is enabled for this recipient in the conversation.
        country_name:
          type:
          - string
          - 'null'
          description: The recipient's country.
        discarded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the recipient was discarded, or null while active.
        email:
          type:
          - string
          - 'null'
          description: The recipient's email address. Omitted for company members.
        first_name:
          type:
          - string
          - 'null'
        id:
          type: integer
          description: The recipient ID.
        image_url:
          type:
          - string
          - 'null'
          description: Full-size avatar image URL. Null for a discarded recipient.
        last_name:
          type:
          - string
          - 'null'
        last_online:
          type:
          - string
          - 'null'
          format: date-time
          description: When the member was last online. Present only for company members.
        left_conversation_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the recipient left or was removed from the conversation, or null while still in it.
        phone:
          type:
          - string
          - 'null'
          description: The recipient's phone number. Omitted for company members.
        pro_user:
          type:
          - boolean
          - 'null'
          description: Whether the member's membership carries a paid plan.
        receivable_id:
          type: integer
          description: ID of the member, contact, or bot this recipient represents.
        receivable_type:
          type: string
          description: What the recipient represents, such as a company member, a contact, or a bot.
        status:
          type:
          - string
          - 'null'
          description: 'Presence status for company members: `online`, `away`, or `offline`. Present only for company members.'
      required:
      - avatar_background
      - avatar_url
      - blocked
      - conversation_messaging_enabled?
      - country_name
      - discarded_at
      - first_name
      - id
      - image_url
      - last_name
      - left_conversation_at
      - pro_user
      - receivable_id
      - receivable_type
      additionalProperties: false
