  "/api/v1/messaging/bots":
    get:
      summary: List bots
      tags:
      - messaging---bots
      operationId: messaging_v1_list_messaging_bots
      security:
      - bearer_auth: []
      description: |-
        List your company's bots. Callable by a company admin or rep whose role includes the messaging view permission. Company admins see every active bot, including archived ones; other callers see only unarchived response bots. Deleted bots are never listed.

        Results are paginated by page number with `page` and `per_page` (default 20). The response is a two-element array: the pagination details, then the bots in `items`.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
          default: 20
        required: false
      - name: filterrific[by_type]
        in: query
        schema:
          type: string
        required: false
        description: Filter bots by type (e.g. ResponseBot, BroadcastBot)
      responses:
        '200':
          description: A page of bots.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagingBotPage"
              example:
                - pagination:
                    current: 1
                    previous: null
                    next: null
                    per_page: 20
                    pages: 1
                    count: 2
                - items:
                  - id: 3187
                    title: Paper Order Helper
                    description: Answers questions about paper stock and delivery times
                    type: ResponseBot
                    image_url: https://cdn.fluid.app/bots/3187/paper-order-helper.png
                    avatar_background_color: 1565C0
                    avatar_emoji: null
                    archived_at: null
                    recipient:
                      id: 48176
                      discarded_at: null
                      avatar_background: null
                      first_name: Paper Order Helper
                      last_name: null
                      email: null
                      phone: null
                      blocked: false
                    conversation: null
                    conversations: []
                    webhook_external_uri: https://bots.piedpiper.com/fluid/dunder-mifflin/paper-orders
                    webhook_http_method: post
                  - id: 3204
                    title: Sales Wins
                    description: Posts closed deals from the CRM into the sales channel
                    type: BroadcastBot
                    image_url: https://cdn.fluid.app/bots/3204/sales-wins.png
                    avatar_background_color: 2E7D32
                    avatar_emoji: null
                    archived_at: null
                    recipient:
                      id: 48190
                      discarded_at: null
                      avatar_background: null
                      first_name: Sales Wins
                      last_name: null
                      email: null
                      phone: null
                      blocked: false
                    conversation: null
                    conversations:
                    - id: 90457
                      name: Scranton Sales Wins
                      description: Closed deals and shout-outs from the Scranton branch
                      avatar_url: null
                      webhook_url: https://www.fluid.app/inbounds/bots/Hq4sW2mZ8kRtY7vN3pLbX9cE/48190/Tz6KfP1dQ8wVn3JxR5sYb2Lm
                      removed_at: null
                    webhook_external_uri: null
                    webhook_http_method: null
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
    post:
      summary: Create a bot
      tags:
      - messaging---bots
      operationId: messaging_v1_create_messaging_bot
      security:
      - bearer_auth: []
      description: Create a bot. Callable by a company admin whose role includes the messaging update permission. A `ResponseBot` needs `webhook_external_uri` (and optionally `webhook_auth_token` and `webhook_http_method`) so its messages can be delivered; a `BroadcastBot` can be added to channel conversations at once with `conversation_ids`. Returns 400 with the validation errors when the bot or its webhook is invalid.
      responses:
        '201':
          description: The created bot.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagingBot"
              example:
                id: 3187
                title: Paper Order Helper
                description: Answers questions about paper stock and delivery times
                type: ResponseBot
                image_url: https://cdn.fluid.app/bots/3187/paper-order-helper.png
                avatar_background_color: 1565C0
                avatar_emoji: null
                archived_at: null
                recipient:
                  id: 48176
                  discarded_at: null
                  avatar_background: null
