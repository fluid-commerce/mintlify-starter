  "/api/v1/messaging/recipients/search":
    post:
      summary: Search recipients
      tags:
      - messaging---recipients
      operationId: messaging_v1_search_recipients_2
      security:
      - bearer_auth: []
      description: Count the active company members who match an audience filter, for example to preview how many members a filtered channel would reach. Callable by a company admin or rep whose role includes the messaging view permission. Top-level filter keys are `country_id`, `language_id`, `company_id`, `rank_id`, and `member_type_id`, each taking a single ID; nest conditions under `and` or `or` to combine them or to match any of several IDs.
      responses:
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagingRecipientSearchResponse"
              example:
                meta:
                  count: 128
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  additionalProperties:
                    "$ref": "#/components/schemas/JsonValue"
                  description: Filter criteria for searching recipients
              required:
              - filter
            example:
              filter:
                country_id: 214
                or:
                  rank_id:
                  - 7
                  - 8
  "/api/v1/messaging/recipients/{recipient_id}/block":
    put:
      summary: Block a recipient
      tags:
      - messaging---recipients
      operationId: messaging_v1_block_recipient
      security:
      - bearer_auth: []
      description: Block a recipient in your company, preventing them from messaging you. If you have a one-to-one conversation with them, it is closed. Callable by a company admin or rep whose role includes the messaging update permission. Returns 200 with no body on success, or 400 when the recipient is not in your company.
      responses:
        '200':
          description: The recipient was blocked. The response has no body.
        '400':
          description: The recipient could not be blocked. The response has no body.
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      parameters:
      - name: recipient_id
        in: path
        required: true
        schema:
          type: string
  "/api/v1/messaging/recipients/{recipient_id}/unblock":
    put:
      summary: Unblock a recipient
      tags:
      - messaging---recipients
      operationId: messaging_v1_unblock_recipient
      security:
      - bearer_auth: []
      description: Unblock a previously blocked recipient, restoring their ability to message you. If you have a one-to-one conversation with them, it is reopened. Callable by a company admin or rep whose role includes the messaging update permission. Returns 200 with no body.
      responses:
        '200':
          description: The recipient was unblocked. The response has no body.
        '400':
          description: The recipient could not be unblocked. The response has no body.
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      parameters:
      - name: recipient_id
        in: path
        required: true
        schema:
          type: string
