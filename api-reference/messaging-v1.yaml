---
openapi: 3.1.0
info:
  title: Fluid Messaging v1 API
  description: |
    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation in this API that resolves the company from the request's
    credential refuses a credential for it with `403` and the body
    `{"error": "<message>"}`, before the operation runs. The refusal is
    documented here once rather than on each operation.
  version: v1
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: messaging---conversations
  description: Create, list, update, and manage messaging conversations (direct, group, channel, SMS, email, and bot) as the signed-in company admin or rep.
  x-fluid-section: Messaging
- name: messaging---incoming-webhooks
  description: Give another system a link that posts into a group conversation or channel, as with Slack's incoming webhooks.
  x-fluid-section: Messaging
- name: messaging---messages
  description: Read, thread, and track unread state on messages in a conversation as the signed-in company admin or rep, including a message's thread replies and the threads with unread replies.
  x-fluid-section: Messaging
- name: messaging---scheduled-messages
  description: Schedule, update, cancel, and immediately deliver messages in a conversation as the signed-in company admin or rep.
  x-fluid-section: Messaging
- name: messaging---today
  description: Flow's Today feed, the company's X-style posts with likes, comments, shared storefront items and admin moderation, as the signed-in company admin or Member. Posting notifies nobody; only a post's author, and the people who commented on it, hear about likes and comments.
  x-fluid-section: Messaging
