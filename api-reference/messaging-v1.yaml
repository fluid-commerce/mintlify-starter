          - 'null'
          description: What the bot does.
        id:
          type: integer
          description: The bot ID.
        image_url:
          type:
          - string
          - 'null'
          description: URL of the bot's avatar image.
        recipient:
          anyOf:
          - "$ref": '#/components/schemas/MessagingSlimmedRecipient'
          - type: 'null'
          description: The messaging recipient that represents the bot in conversations.
        title:
          type: string
          description: The bot's display name. Unique among your company's active bots.
        type:
          type: string
          description: '`ResponseBot` (replies through a webhook in one-to-one conversations) or `BroadcastBot` (posts into channel conversations).'
        webhook_external_uri:
          type:
          - string
          - 'null'
          description: For a response bot, the URL its webhook delivers messages to; otherwise null.
        webhook_http_method:
          type:
          - string
          - 'null'
          description: For a response bot, the HTTP method its webhook uses (`post`, `put`, or `get`); otherwise null.
      required:
