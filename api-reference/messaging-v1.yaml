          - 'null'
          description: The channel avatar image URL, or null when none is set.
    MessagingMessageListItem:
      description: A message as it appears in a conversation's message list. Deleted messages
        keep their place in the list with the body replaced by a deletion notice and their
        attachments, mentions, and seen-by details emptied.
      type: object
      properties:
        id:
          type: integer
          description: The message ID.
        conversation_id:
          type: integer
          description: The conversation the message belongs to.
        body:
          type:
          - string
          - 'null'
          description: The message text, or a deletion notice when the message was deleted.
        type:
          type: string
          description: The message type, for example `DirectMessage`, `SmsMessage`, `EmailMessage`,
            or `InfoMessage`.
        status:
          type: string
          description: Delivery status.
          enum:
          - queued
          - sent
          - failed
        created_at:
          type: string
          format: date-time
        sent_at:
          type:
          - string
