    MessagingConversationSummary:
      description: A conversation as seen by the acting recipient. Per-recipient fields such as `unread`, `pinned`, and `muted` describe that recipient's view of the conversation. `recipients` lists at most six active participants; `total_recipients` is the full count.
      type: object
      properties:
        audience:
          type: string
          enum:
          - members
          - admins
          description: Who a channel is for; `admins` seats only the company's admins, now and as admins come and go.
        ticket:
          type:
          - object
          - 'null'
          description: For a Cowork ticket's or board card's channel, what it discusses; null otherwise.
            A board card has only `id`, `title` and `status`; a Cowork ticket also has the rest, which
            names people by name and avatar only.
          properties:
            id:
              type: string
            title:
              type: string
            status:
              type: string
            description:
              type:
              - string
              - 'null'
              description: The ticket's request as plain text, cut to about 280 characters; null when empty.
            kind:
              type:
              - string
              - 'null'
              enum:
              - bug
              - change
              - feature
              - design
              - support
              - null
            priority:
              type:
              - string
              - 'null'
              enum:
              - urgent
              - high
              - medium
              - low
              - null
            due_on:
              type:
              - string
              - 'null'
              format: date
            assignee:
              type:
              - object
              - 'null'
              description: Who owns the ticket; `Mist` for the agent; null for nobody.
              properties:
                name:
                  type: string
                avatar_url:
                  type:
                  - string
                  - 'null'
                kind:
                  type: string
                  enum:
                  - user
                  - agent
            agency:
              type:
              - object
              - 'null'
              description: The agency the ticket is sent to, or null.
              properties:
                name:
                  type: string
                avatar_url:
                  type:
                  - string
                  - 'null'
            created_by:
              type:
              - object
              - 'null'
              properties:
                name:
                  type: string
                avatar_url:
                  type:
                  - string
                  - 'null'
            created_at:
              type: string
              format: date-time
            last_step:
              type:
              - object
              - 'null'
              description: The ticket's latest history event as one sentence, as Cowork's history tells it;
                null when it has none to tell. An agency's staff are not told where else it was sent.
              properties:
                text:
                  type: string
                at:
                  type: string
                  format: date-time
            attachments_count:
              type: integer
              description: Files shared in the ticket's channel, its comments.
        host_company_name:
          type:
          - string
          - 'null'
          description: For a guest from another company, the name of the company hosting the conversation;
            null for the host's own people.
        purpose:
          type:
          - string
          - 'null'
          description: 'What Fluid made the conversation for: `support` for the company''s Fluid Support
            channel, `ticket` for a Cowork ticket''s channel, or null for one people created.'
        uuid_v7:
          type: string
          format: uuid
          description: The stable UUIDv7 identifier. Messaging routes accept it wherever they accept the numeric id.
        id:
          type:
          - integer
          - 'null'
        type:
          type: string
          description: The conversation type, for example `GroupConversation`.
        kind:
          type:
          - string
          - 'null'
          description: The short conversation kind (`direct`, `group`, `channel`, or `downline`), or null for SMS, email, and bot conversations.
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
          description: One of `initiated`, `open`, `archived`, or `closed`. A new conversation stays `initiated` until its first message.
        conversation_type:
          type:
          - string
          - 'null'
          description: "`internal` for conversations between company members, `external` for conversations with contacts."
        broadcasting:
          type:
          - boolean
          - 'null'
        auto_add_recipients:
          type:
          - boolean
          - 'null'
        announcing:
          type:
          - boolean
          - 'null'
        avatar_background_color:
          type:
          - string
          - 'null'
        avatar_emoji:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        pinned_messages_count:
          type:
          - integer
          - 'null'
        total_recipients:
          type:
          - integer
          - 'null'
        unread:
          type:
          - boolean
          - 'null'
        pinned:
          type:
          - boolean
          - 'null'
        muted:
          type:
          - boolean
          - 'null'
        unread_messages_count:
          type:
          - integer
          - 'null'
        unread_mentions_count:
          type:
          - integer
          - 'null'
          description: Unread messages that need you — every unread message in a direct or group conversation, only mentions in a channel. Shown as the numbered badge.
        can_delete_any_message:
          type: boolean
          description: Whether you may delete other people's messages here. True for the company's own admins in a channel; false in direct and group conversations and for guests from a company the channel is shared with.
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When anything last happened in the conversation.
        last_opened_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When you last opened it (your seat's last read time); null without a seat.
        last_replied_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When you last sent a message in it; null if you never have.
        scheduled_messages_count:
          type:
          - integer
          - 'null'
        email_enabled?:
          type:
          - boolean
          - 'null'
        sms_enabled?:
          type:
          - boolean
          - 'null'
        messaging_enabled?:
          type:
          - boolean
          - 'null'
          description: Whether the acting recipient can post in the conversation.
        draft_message:
          description: The acting recipient's unsent draft in this conversation, or null.
          type:
          - object
          - 'null'
        recipients:
          type: array
          items:
            "$ref": "#/components/schemas/MessagingConversationParticipant"
        creator:
          anyOf:
          - "$ref": "#/components/schemas/MessagingConversationCreator"
          - type: 'null'
      required:
      - id
      - type
      - kind
      - name
      - description
      - status
      - conversation_type
      - broadcasting
      - auto_add_recipients
      - announcing
      - avatar_background_color
      - avatar_emoji
      - avatar_url
      - image_url
      - created_at
      - pinned_messages_count
      - total_recipients
      - unread
      - pinned
      - muted
      - unread_messages_count
      - scheduled_messages_count
      - email_enabled?
      - sms_enabled?
      - messaging_enabled?
      - draft_message
      - recipients
      - creator
      additionalProperties: false
    MessagingConversationAttributes:
      description: The conversation to create.
      type: object
      properties:
        audience:
          type: string
          enum:
          - members
          - admins
          description: 'For a channel: `admins` seats every company admin and the creator, adds admins as they
            join and removes them as they go, and takes no filter or non-admin recipients. Defaults to `members`.
            Chosen once; an update that changes it answers 422.'
        uuid_v7:
          type: string
          format: uuid
          description: The stable UUIDv7 identifier. Messaging routes accept it wherever they accept the numeric id.
        type:
          type: string
          description: The conversation type. Required unless `kind` is set.
          enum:
          - ChannelConversation
          - DirectConversation
          - GroupConversation
          - SmsConversation
          - EmailConversation
          - BotConversation
        kind:
          type: string
          description: Alternative to `type` using the short name. Ignored when `type` is set.
          enum:
          - channel
          - direct
          - group
        name:
          type: string
          description: The conversation name. Required for a channel. A group name must be unique among your open groups, and a channel name among your open channels.
        description:
          type: string
        broadcasting:
          type: boolean
          description: For a channel, when true only admins can post; other members can only read.
        filter:
          type: object
          description: For a channel, the audience to add as members, as member attributes (such as `member_type_id` or `rank_id`) mapped to the values to match. Omit it to add only you.
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        auto_add_recipients:
          type: boolean
          description: For a channel, keep adding members who match `filter` as they join the company. Ignored unless you are a company admin.
      additionalProperties: false
    MessagingConversationRecipientReference:
      description: A participant to add. Identify an existing recipient by `uid`; otherwise the recipient is found or created from `email` or `phone`.
      type: object
      properties:
        uid:
          type:
          - integer
          - string
          description: The recipient ID of an existing company member or contact.
        email:
          type: string
          format: email
        phone:
          type: string
        first_name:
          type: string
          description: Used when a new contact is created from `email` or `phone`.
        last_name:
          type: string
          description: Used when a new contact is created from `email` or `phone`.
        id:
          type:
          - integer
          - string
          description: Accepted for compatibility and ignored. Use `uid`.
        image_url:
          type:
          - string
          - 'null'
          description: Accepted for compatibility and ignored.
      additionalProperties: false
    MessagingConversationCreateRequest:
      description: Send `conversation` (with `recipients`) to create one conversation, or `conversations` (with an optional `message`) to create several.
      type: object
      properties:
        conversation:
          "$ref": "#/components/schemas/MessagingConversationAttributes"
        recipients:
          type: array
          description: The participants to add besides you. Required for every type except a channel, where it is ignored; send an empty array for a channel.
          items:
            "$ref": "#/components/schemas/MessagingConversationRecipientReference"
        conversations:
          type: array
          description: Batch mode. Each entry creates one conversation.
          items:
            type: object
            properties:
              conversation:
                "$ref": "#/components/schemas/MessagingConversationAttributes"
              recipients:
                type: array
                items:
                  "$ref": "#/components/schemas/MessagingConversationRecipientReference"
            additionalProperties: false
        message:
          "$ref": "#/components/schemas/MessagingConversationFirstMessage"
    MessagingConversationFirstMessage:
      description: Batch mode only. A message sent from you to each conversation created from `conversations`. Ignored with `conversation`.
      type: object
      properties:
        body:
          type: string
        theme:
          type: string
        type:
          type: string
          description: The message type. Ignored for conversations between company members, which always get a direct message.
        attachments_attributes:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
              filename:
                type: string
              kind:
                type: string
              content_size:
                type:
                - integer
                - string
                description: The file size in bytes.
              content_type:
                type: string
            additionalProperties: false
      additionalProperties: false
    MessagingConversationPagination:
      description: Page-number pagination details for a page of results.
      type: object
      properties:
        current:
          type: integer
          description: The page returned.
        previous:
          type:
          - integer
          - 'null'
          description: The previous page number, or null on the first page.
        next:
          type:
          - integer
          - 'null'
          description: The next page number, or null on the last page.
        per_page:
          type: integer
          description: The page size used.
        pages:
          type: integer
          description: The total number of pages.
        count:
          type: integer
          description: The total number of matching records.
