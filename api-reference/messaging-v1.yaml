    MessagingMessageBlock:
      description: An interactive card a bot attaches to its message. A `choices` card asks one multiple-choice question; a person answers it by posting the option's label with `in_reply_to_block`, which records `answered_option_id` on the card. A card with `allow_custom` also takes a typed answer, sent as option `custom` with `custom_value`; an answered card keeps the answer's words in `answered_value` (D-423). A card naming an onboarding `purpose` carries the `action` Fluid applies when the bot's owner or a steward answers it. An `integration` card offers a connection the bot can use.
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - type
        - prompt
        - options
        properties:
          type:
            type: string
            enum:
            - choices
          prompt:
            type: string
          options:
            type: array
            minItems: 2
            maxItems: 4
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - label
              properties:
                id:
                  type: string
                label:
                  type: string
          answered_option_id:
            type:
            - string
            - 'null'
          allow_custom:
            type: boolean
            description: Whether the card takes a typed answer; show a text field with a submit button.
          custom_placeholder:
            type: string
            description: The text field's placeholder.
          answered_value:
            type: string
            description: The answer's words once the card is answered, the picked option's label or the typed text.
          purpose:
            type: string
            enum:
            - name
            - first_task
            - cadence
            - preference
            description: The onboarding touchpoint the card is (D-423, D-424).
          action:
            type: object
            additionalProperties: true
            description: What Fluid does when the bot's keeper answers the card, such as renaming the bot or granting a permission.
      - type: object
        additionalProperties: false
        required:
        - type
        - key
        - title
        - description
        - status
        properties:
          type:
            type: string
            enum:
            - integration
          key:
            type: string
          title:
            type: string
          description:
            type: string
          status:
            type: string
            enum:
            - available
            - added
    MessagingIncomingWebhook:
      description: A conversation's incoming webhook. Its link is masked to the token's last four characters; the full link is answered only when the webhook is made or regenerated (D-393).
      type: object
