paths:
  "/api/v1/messaging/conversations/{conversation_id}/messages/{message_id}/replies":
    get:
      summary: List a thread's replies
      tags:
      - messaging---messages
      operationId: messaging_v1_list_thread_replies
      x-fluid-audience: company
      x-fluid-lint-exempt: "Joins the unversioned v1 conversation messages routes the shared Flow client in Admin, Mist and the portal calls, beside the existing reply and reactions routes on a message; a dated path would split one resource family across two versions."
      security:
      - bearer_auth: []
      description: 'List the replies in the thread a message belongs to, a page at a time, each page oldest
        first. A reply''s thread is its first message''s. With no cursor the page is the newest replies; pass
        `before` (a reply''s uuid_v7 or id) for older ones and `after` for newer ones. The thread''s first
        message comes along as `parent`. Scoped to your seat like the message routes. Requires the messaging
        view permission.'
      parameters:
      - name: conversation_id
        in: path
        required: true
        description: The conversation's uuid_v7 or numeric id.
        schema:
          type: string
      - name: message_id
        in: path
        required: true
        description: The message's uuid_v7 or numeric id.
        schema:
          type: string
      - name: after
        in: query
        required: false
        description: The uuid_v7 or id of the last reply already read.
        schema:
          type: string
      - name: before
        in: query
        required: false
        description: The uuid_v7 or id of a reply; the page is the replies before it.
        schema:
          type: string
      - name: per_page
        in: query
        required: false
        description: Replies per page, 50 by default and at most 100.
        schema:
          type: integer
      responses:
        '200':
          description: A page of replies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replies:
                    type: array
                    items:
                      "$ref": '#/components/schemas/MessagingMessageListItem'
                  prev_cursor:
                    type:
                    - string
                    - 'null'
                    description: The oldest reply's uuid_v7 on this page when older replies exist; pass it as `before`.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: The newest reply's uuid_v7 on this page when newer replies exist; pass it as `after`.
                  parent_id:
                    type: integer
                    description: The thread's first message.
                  parent:
                    "$ref": '#/components/schemas/MessagingMessageListItem'
                required:
                - replies
                - prev_cursor
                - next_cursor
                - parent_id
                - parent
