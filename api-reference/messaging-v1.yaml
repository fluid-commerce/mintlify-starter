  "/api/v1/messaging/conversations/search":
    get:
      summary: Search your conversations
      tags:
      - messaging---conversations
      operationId: messaging_v1_search_conversations
      security:
      - bearer_auth: []
      description: Search every conversation you hold a seat in, in your company, including ones you archived
        or hid, so search finds what the list hides. A conversation matches when its name (for a direct or
        group conversation, the name your seat shows) contains every word of `filterrific[search_query]`, or
        when another active member matches every word by name, email, or phone. Matching is case-insensitive.
        Conversations you left are excluded, results are newest activity first, at most 50, and an empty
        query returns an empty array. Callable by a signed-in company admin or rep whose role includes the
        messaging view permission.
      parameters:
      - name: filterrific[search_query]
        in: query
        schema:
          type: string
        required: true
        description: Search query string
      responses:
        '200':
          description: The matching channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": '#/components/schemas/MessagingNominalConversation'
              example:
              - id: 90533
                name: Paper Sales Tips
                avatar_url: null
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
