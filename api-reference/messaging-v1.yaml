          type:
          - string
          - 'null'
          description: The channel name.
        avatar_url:
          type:
          - string
          - 'null'
          description: The channel avatar image URL, or null when none is set.
    MessagingMessageListItem:
      description: A message as it appears in a conversation's message list. Deleted messages
        keep their place in the list with the body replaced by a deletion notice and their
        attachments, mentions, and seen-by details emptied.
      type: object
      properties:
        reply_count:
          type: integer
          description: On a thread's first message, how many replies the thread has; 0 otherwise.
        last_reply_at:
          type:
          - string
          - 'null'
          format: date-time
          description: On a thread's first message, when its latest reply was posted.
        reply_recipients:
          type: array
          description: On a thread's first message, the up to three people who replied most recently.
          items:
            "$ref": '#/components/schemas/MessagingReducedRecipient'
        thread_unread_count:
          type: integer
          description: On a thread's first message, how many of its replies you follow and have not read.
        also_sent_to_channel:
          type: boolean
          description: On a thread reply, whether it was also posted to the conversation.
        app:
          type:
          - object
          - 'null'
          description: For a message an incoming webhook or an app's own Flow sender posted, the app it shows as; null for every other message.
          additionalProperties: false
          properties:
            name:
              type: string
            icon_url:
              type: string
              format: uri
        sent_via:
          type:
          - object
          - 'null'
          description: For a message an app sent as a person who allowed it to, the app it was sent through; null otherwise.
          additionalProperties: false
          properties:
            app_name:
              type: string
            app_icon_url:
              type: string
              format: uri
        blocks:
          type: array
          description: The bot's interactive cards on this message; empty for a person's message.
          items:
            "$ref": "#/components/schemas/MessagingMessageBlock"
        id:
          type: integer
          description: The message ID.
        uuid_v7:
          type: string
          format: uuid
          description: The stable UUIDv7 identifier. Messaging routes accept it wherever they accept the numeric id.
        conversation_id:
          type: integer
          description: The conversation the message belongs to.
        body:
          type:
          - string
          - 'null'
          description: The message text, or a deletion notice when the message was deleted.
        type:
          type: string
          description: The message type, for example `DirectMessage`, `SmsMessage`, `EmailMessage`,
            or `InfoMessage`.
        status:
          type: string
          description: Delivery status.
          enum:
          - queued
          - sent
          - failed
        created_at:
          type: string
          format: date-time
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was sent, falling back to its creation time.
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the sender last edited the message, or null.
        deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was deleted, for everyone or only for you, or null.
        pinned:
          type:
          - boolean
          - 'null'
          description: Whether the message is pinned in the conversation.
        reaction:
          type:
          - string
          - 'null'
          description: Your own emoji reaction to the message, or null.
        reaction_stats:
          description: Reaction counts keyed by emoji, or null when nobody has reacted.
          anyOf:
          - "$ref": "#/components/schemas/JsonValue"
          - type: 'null'
        metadata:
          description: Message metadata, including the `client_message_id` sent at creation.
          anyOf:
          - "$ref": "#/components/schemas/JsonValue"
          - type: 'null'
        seen_by_count:
          type: integer
          description: How many recipients have seen the message.
        emoji_only_count:
          type:
          - integer
          - 'null'
          description: The number of emoji when the body consists only of emoji.
        seen_by:
          type: array
          description: Up to 25 recipients who most recently saw the message. Always empty in
            channels.
          items:
            "$ref": "#/components/schemas/MessagingNominalRecipient"
        sender_recipient:
          description: The recipient who sent the message.
          anyOf:
          - "$ref": "#/components/schemas/MessagingReducedRecipient"
