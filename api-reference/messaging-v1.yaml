  "/api/v1/messaging/conversations/{conversation_id}/messages":
    get:
      summary: List messages
      tags:
      - messaging---messages
      operationId: messaging_v1_list_messages
      security:
      - bearer_auth: []
      description: List messages in a conversation you belong to. Callable by a company
        admin or rep whose role includes the messaging view permission. Results are page-number paginated
        with `page` and `per_page` (default 20). Pass `message_id` to jump to the page containing
        that message, and `after` / `before` to bound results by send time. Listing marks the conversation
        as read unless you pass `preview=true`. Messages deleted for everyone or only for you stay
        in the list with their body replaced by a deletion notice.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: message_id
        in: query
        schema:
          type: integer
        required: false
        description: Center pagination around this message ID
      - name: sorted_by
        in: query
        schema:
          type: string
        required: false
        description: Sort order
      - name: preview
        in: query
        schema:
          type: boolean
        required: false
        description: If true, do not mark conversation as read
      - name: after
        in: query
        schema:
          type: integer
        required: false
        description: Unix timestamp — only messages sent after this time
      - name: before
        in: query
        schema:
          type: integer
        required: false
        description: Unix timestamp — only messages sent before this time
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessagingMessageListPage"
              example:
                - pagination:
                    current: 1
                    previous: null
                    next: null
                    per_page: 20
                    pages: 1
