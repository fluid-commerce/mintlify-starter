  "/api/v1/messaging/conversations/connected_recipients":
    get:
      summary: List connected recipients
      tags:
      - messaging---conversations
      operationId: messaging_v1_list_connected_recipients
      security:
      - bearer_auth: []
      description: |-
        List the people you can start a conversation with. Callable by a signed-in company admin or rep whose role includes the messaging view permission.

        Without `kind`, returns the company's active members, sorted by first name, excluding you and anyone you have blocked or who has blocked you; pass `id` to also exclude members already in that conversation. With `kind`, returns your own contacts instead: `external` for contacts ready for a conversation, `sms` for contacts with a phone number, and `email` for contacts with an email address.

        Results are paginated by page number with `page` and `per_page` (default 20). The response is a two-element array: the pagination details, then the recipients in `items`.
