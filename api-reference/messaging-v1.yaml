---
openapi: 3.1.0
info:
  title: Fluid Messaging v1 API
  version: v1
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: messaging---conversations
  description: Create, list, update, and manage messaging conversations (direct, group, channel, SMS, email, and bot) as the signed-in company admin or rep.
  x-fluid-section: Messaging
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    NotFoundResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardUnauthorizedResponse:
      description: Common legacy unauthorized response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    MessagingBotArchivedResponse:
      description: An archived messaging bot.
      type: object
      properties:
        archived_at:
          type: string
          format: date-time
          description: When the bot was archived.
        avatar_background_color:
          type:
          - string
          - 'null'
          description: Background color shown behind the bot's avatar.
        avatar_emoji:
          type:
          - string
          - 'null'
          description: Emoji shown as the bot's avatar.
        conversation:
          anyOf:
          - "$ref": '#/components/schemas/MessagingConversation'
          - type: 'null'
          description: Your one-to-one conversation with the bot, or null when you have none.
        conversations:
          type: array
          items:
            "$ref": '#/components/schemas/BroadcastBotConversation'
          description: Conversations the bot's recipient belongs to, such as the channels a broadcast bot posts into.
        description:
          type:
          - string
          - 'null'
          description: What the bot does.
        id:
          type: integer
          description: The bot ID.
        image_url:
          type:
          - string
          - 'null'
          description: URL of the bot's avatar image.
        recipient:
          anyOf:
          - "$ref": '#/components/schemas/MessagingSlimmedRecipient'
          - type: 'null'
          description: The messaging recipient that represents the bot in conversations.
        title:
          type: string
          description: The bot's display name. Unique among your company's active bots.
        type:
          type: string
          description: '`ResponseBot` (replies through a webhook in one-to-one conversations) or `BroadcastBot` (posts into channel conversations).'
        webhook_external_uri:
          type:
          - string
          - 'null'
          description: For a response bot, the URL its webhook delivers messages to; otherwise null.
        webhook_http_method:
          type:
          - string
          - 'null'
          description: For a response bot, the HTTP method its webhook uses (`post`, `put`, or `get`); otherwise null.
      required:
      - archived_at
      - avatar_background_color
      - avatar_emoji
      - conversation
      - conversations
      - description
      - id
      - image_url
      - recipient
      - title
      - type
      - webhook_external_uri
      - webhook_http_method
      additionalProperties: false
    MessagingSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
      - success
      additionalProperties: false
    MessagingBot:
      description: A messaging bot.
      type: object
      properties:
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the bot was archived, or null while it is active.
