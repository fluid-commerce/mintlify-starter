          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation_ids:
                  type: array
                  items:
                    type: string
                  description: IDs of conversations to archive
              required:
              - conversation_ids
            example:
              conversation_ids:
              - '90412'
              - '90415'
