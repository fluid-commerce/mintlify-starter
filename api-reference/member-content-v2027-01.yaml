openapi: 3.1.0
info:
  title: Fluid Member API v2027-01 — Storefront
  description: |
    The storefront the signed-in rep may share: one list per kind of storefront content (products, media,
    playlists, posts, pages, collections, categories, enrollment packs and sites) and one search across all
    of them. The rep's own media, playlists and shares stay on v2026-10. The member and company come from the
    bearer credential alone, which is resolved exactly as v2026-10 resolves it, and only rep-eligible
    memberships may use it: other memberships receive 403, as they do from `GET /api/member/v2026-10/media`.

    **One audience rule.** Every list, the search and `POST /api/member/v2026-10/shares` decide what the rep
    may see and share by the same rule: the company's content that is active and published now, available in
    the rep's country (their own, else the company's default; content listed for no country reaches every
    country) and, where the kind has a member-type gate (media, posts and playlists by content availability;
    products, collections and enrollment packs by product availability), available to the rep's member type.
    Media are the company's share library: share media, whoever at the company uploaded them, not restricted
    and not past their deactivation time. Playlists are company playlists. Sites are the active, public sites
    of the rep's site menu that are served now. Rank never decides what a rep sees.

    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation refuses a credential for it with `403` and the standard error
    envelope, before the operation runs.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2027-01
security:
  - MemberBearer: []
servers:
  - url: https://api.fluid.app
    description: Production API server
  - url: https://api.fluid.test
    description: Local development server
tags:
  - name: storefront
    description: Storefront content the signed-in rep may share, and its search.
    x-fluid-section: Members
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or an opaque member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it
        is unchanged.
      schema:
        type: string
    CacheControl:
      description: >-
        Standard HTTP Cache-Control directive. Lists are private with max-age=0, so a client revalidates on
        every use; search responses are no-store.
      schema:
        type: string
        example: max-age=0, private
    RateLimitLimit:
      description: Searches allowed per minute for this credential.
      schema:
        type: string
        example: '30'
    RateLimitRemaining:
      description: Searches left in the current minute; always 0 on a refused request.
      schema:
        type: string
        example: '0'
    RateLimitReset:
      description: When the current minute ends and the credential's search budget is restored, as a UTC timestamp.
      schema:
        type: string
        example: 2026-09-30 18:25:00 UTC
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
        - request_uuid
        - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          description: The error message and field-keyed details.
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Field-keyed error details.
              additionalProperties: true
          required:
            - message
            - details
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - error
        - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
        - next_cursor
    PageMeta:
      description: Envelope metadata with the list's pagination state.
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
          required:
            - pagination
    StorefrontMedium:
      type: object
      description: >-
        A company medium the rep may share. The fields are those of the v2026-10 medium, without
        `size_bytes` and `status`, which only the rep's own uploads carry.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public medium id.
        kind:
          type: string
          description: What the medium is. Documents are PDFs and presentations.
          enum:
            - image
            - video
            - document
            - link
        title:
          type:
            - string
            - 'null'
          description: >-
            Title in the member's language when the medium has that translation, otherwise the medium's own
            title.
        description:
          type:
            - string
            - 'null'
          description: >-
            Plain-text description in the member's language when the medium has that translation, otherwise
            the default language's, otherwise any.
        tags:
          type: array
          description: Names of the company medium tags assigned to it.
          items:
            type: string
        url:
          type:
            - string
            - 'null'
          description: Delivery URL of the media file (or the destination of a link).
        thumbnail_url:
          type:
            - string
            - 'null'
          description: Thumbnail or image URL.
        duration:
          type:
            - integer
            - 'null'
          description: Video length in seconds, once known.
        share_url:
          type:
            - string
            - 'null'
          description: The member's untracked storefront link, crediting their username; null without a username.
        created_at:
          type: string
          format: date-time
          description: When it was created.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
      required:
        - id
        - kind
        - title
        - description
        - tags
        - url
        - thumbnail_url
        - duration
        - share_url
        - created_at
        - updated_at
    StorefrontMediaEnvelope:
      type: object
      description: A page of the media the rep may share.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's media, newest first.
          items:
            $ref: '#/components/schemas/StorefrontMedium'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    StorefrontItem:
      type: object
      description: One storefront record the rep may share.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public id of the record.
        kind:
          type: string
          description: The storefront kind the record is.
          enum:
            - products
            - playlists
            - posts
            - pages
            - collections
            - categories
            - enrollment-packs
            - sites
        title:
          type:
            - string
            - 'null'
          description: >-
            Title in the member's language when the record has that translation, otherwise its own title, then
            the default language's, then any.
        description:
          type:
            - string
            - 'null'
          description: >-
            Plain-text description in the member's language when the record has that translation, otherwise its
            own, then the default language's, then any.
        image_url:
          type:
            - string
            - 'null'
          description: The record's stored image; an enrollment pack's first image.
        url:
          type:
            - string
            - 'null'
          description: >-
            Canonical storefront URL (`/home/<kind>/<slug>`); a site's is `/home/sites/<slug>`, null while the sites
            gateway cannot serve it.
        share_url:
          type:
            - string
            - 'null'
          description: >-
            The member's untracked storefront link, crediting their username (`/<username>/<kind>/<slug>`). It is
            the address a tracked share (`POST /api/member/v2026-10/shares`) redirects to. Null without a username,
            and for a site the sites gateway cannot serve.
        created_at:
          type: string
          format: date-time
          description: When it was created.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
      required:
        - id
        - kind
        - title
        - description
        - image_url
        - url
        - share_url
        - created_at
        - updated_at
    StorefrontItemEnvelope:
      type: object
      description: A page of storefront records the rep may share.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's records, newest first.
          items:
            $ref: '#/components/schemas/StorefrontItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    SearchHit:
      type: object
      description: One ranked storefront result.
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Storefront kind of the result.
          enum:
            - products
            - media
            - playlists
            - posts
            - pages
            - collections
            - categories
            - enrollment-packs
            - sites
        id:
          type: string
          format: uuid
          description: Public id of the result.
        title:
          type:
            - string
            - 'null'
          description: Title in the member's language, as the lists show it.
        image_url:
          type:
            - string
            - 'null'
          description: Stored image, when the kind stores one.
        url:
          type:
            - string
            - 'null'
          description: Canonical storefront URL, as the lists show it.
        share_url:
          type:
            - string
            - 'null'
          description: The member's credited storefront link, as the lists show it.
        snippet:
          type:
            - string
            - 'null'
          description: Plain-text excerpt of the description in the member's language, up to 200 characters.
        price:
          type:
            - string
            - 'null'
          description: >-
            For a product, the member's price for its master variant in the company's default country, formatted
            as the storefront shows it, such as "$29.99". Null for every other kind, a bundle, a withheld price and
            a product with no price.
        score:
          type:
            - number
            - 'null'
          description: Relevance score; comparable within one response only.
      required:
        - kind
        - id
        - title
        - image_url
        - url
        - share_url
        - snippet
        - price
        - score
    SearchMeta:
      description: Envelope metadata with per-kind facets and the search cursor.
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            facets:
              type: object
              description: >-
                Number of matching results of each requested kind the rep may see, counted in the search itself.
              additionalProperties:
                type: integer
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
          required:
            - facets
            - pagination
    SearchEnvelope:
      type: object
      description: One page of search results.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: Hits, best match first.
          items:
            $ref: '#/components/schemas/SearchHit'
        meta:
          $ref: '#/components/schemas/SearchMeta'
      required:
        - status
        - data
        - meta
    RateLimitError:
      type: object
      description: >-
        The rate limiter's refusal. It is sent before the request reaches the API, so it has no status, error
        or meta envelope.
      properties:
        error:
          type: string
          description: Always `Rate limit exceeded`.
        message:
          type: string
          description: Human-readable explanation.
        retry_after:
          type: integer
          description: Seconds until the credential may search again.
      required:
        - error
        - message
        - retry_after
paths:
  /api/member/v2027-01/storefront/search:
    get:
      operationId: member_v202701_storefront_search_index
      tags:
        - storefront
      summary: Search the storefront the rep may share
      description: >-
        Searches every storefront kind the rep may share, or the kinds `filter[kind]` names, in one request,
        best match first, with the number of matches of each kind. Hits are exactly what the lists return (the
        one audience rule), each with the rep's credited share link and its title and snippet in the rep's
        language; with no `q` it browses the named kinds. Results are never stored. Collections and categories
        are found once their search documents carry their numeric id (after their reindex). An email-link
        credential is refused with 403. Each credential may search 30 times a minute.
      parameters:
        - name: q
          in: query
          description: Search text, matched within words of titles, descriptions, slugs and translations.
          schema:
            type: string
            minLength: 2
            maxLength: 200
          example: wellness
        - name: filter[kind]
          in: query
          description: >-
            Comma-separated storefront kinds to search, such as `products,media,sites`; every kind by default.
            Required without `q`.
          schema:
            type: string
            maxLength: 200
          example: products,media
        - name: page[cursor]
          in: query
          description: >-
            Opaque cursor from `meta.pagination.next_cursor`, valid for one hour with the same `q` and kinds.
          schema:
            type: string
        - name: page[limit]
          in: query
          description: Maximum number of hits returned.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
          example: 25
      responses:
        '200':
          description: A page of hits.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEnvelope'
              example:
                status: 200
                data:
                  - kind: products
                    id: 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f61
                    title: Primex Wellness Kit
                    image_url: https://ik.imagekit.io/fluid/primex/wellness-kit.jpg
                    url: https://primex.fluid.app/home/products/primex-wellness-kit
                    share_url: https://primex.fluid.app/riley-kim/products/primex-wellness-kit
                    snippet: Everything you need for a 30-day wellness reset.
                    price: $89.00
                    score: 12.4
                meta:
                  request_uuid: 0199a3f2-7a10-7c3e-8f21-4d5e6f708192
                  timestamp: '2026-09-30T18:24:05Z'
                  facets:
                    products: 1
                    sites: 0
                  pagination:
                    next_cursor: null
        '400':
          description: >-
            Malformed, tampered or expired pagination cursor, or one from before a reindex. Repeat the search
            without a cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            The membership cannot share content (a customer), the credential is an email link's, or it belongs to
            a sandbox test company that cannot be reached now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            A query parameter is not valid: `q` shorter than 2 or longer than 200 characters, an unknown kind in
            `filter[kind]`, no `q` and no kind, a `page[limit]` outside 1 to 50, or an undeclared parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: >-
            The credential has searched more than 30 times in the current minute. Wait `retry_after` seconds
            before searching again. Unlike other responses it carries no Cache-Control header.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please wait before trying again.
                retry_after: 42
        '503':
          description: Search is unavailable; retry shortly.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-fluid-audience: member
  /api/member/v2027-01/storefront/media:
    get:
      operationId: member_v202701_storefront_media_index
      tags:
        - storefront
      summary: List the company media the rep may share
      description: >-
        Returns the company's media the signed-in rep may share, newest first, by the one audience rule: active,
        published share media (not training or announcements), whoever at the company uploaded them, not
        restricted and not past their deactivation time, available in the rep's country and, while member-type
        content availability is on for the company, to the rep's member type (none when the type cannot be
        resolved). The rep's own uploads are not listed here: `GET /api/member/v2026-10/media` lists them.
        Responses are private and must be revalidated.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous response.
          schema:
            type: string
        - name: filter[kind]
          in: query
          description: Only media of this kind.
          schema:
            type: string
            enum:
              - image
              - video
              - document
              - link
          example: video
        - name: filter[q]
          in: query
          description: Only media whose title, in any language, contains this text, case-insensitively.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: wellness
        - name: page[cursor]
          in: query
          description: >-
            Opaque cursor from `meta.pagination.next_cursor`. A cursor issued for other filters restarts at the
            first page; a malformed, tampered or expired one (older than three days) returns 400.
          schema:
            type: string
        - name: page[limit]
          in: query
          description: Maximum number of items returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          example: 25
      responses:
        '200':
          description: A page of the media the rep may share.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontMediaEnvelope'
              example:
                status: 200
                data:
                  - id: 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f61
                    kind: video
                    title: Wellness kit overview
                    description: Everything in the wellness kit, in two minutes.
                    tags:
                      - wellness
                    url: https://ik.imagekit.io/fluid/companies/primex/media/wellness-kit-overview.mp4?tr=f-mp4
                    thumbnail_url: https://ik.imagekit.io/fluid/companies/primex/media/wellness-kit-overview.jpg
                    duration: 128
                    share_url: https://primex.fluid.app/riley-kim/media/wellness-kit-overview
                    created_at: '2026-09-29T15:02:11.482913Z'
                    updated_at: '2026-09-29T15:04:52.118204Z'
                meta:
                  request_uuid: 0199a3f2-7a10-7c3e-8f21-4d5e6f708193
                  timestamp: '2026-09-30T18:24:05Z'
                  pagination:
                    next_cursor: null
        '304':
          description: The representation is unchanged; authentication and access are checked before this response.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            The membership cannot share content (a customer), or the credential belongs to a sandbox test
            company that cannot be reached now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            A query parameter is not valid, such as an unknown kind, a blank or over-long `filter[q]`, a
            `page[limit]` outside 1 to 100, or an undeclared parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-fluid-audience: member
  /api/member/v2027-01/storefront/products:
    get:
      operationId: member_v202701_storefront_products_index
      tags:
        - storefront
      summary: List the products the rep may share
      description: >-
        Returns live products (active, public and published) priced in the rep's country, that the rep's member type may buy, newest first, each with the rep's credited share link and its title in the rep's
        language. This is the one audience rule `GET /api/member/v2027-01/storefront/search` and `POST
        /api/member/v2026-10/shares` apply. Responses are private and must be revalidated.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag from a previous response.
          schema:
            type: string
        - name: filter[q]
          in: query
          description: Only records whose title, in any language, contains this text, case-insensitively.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: wellness
        - name: page[cursor]
          in: query
          description: >-
            Opaque cursor from `meta.pagination.next_cursor`. A cursor issued for other filters restarts at the
            first page; a malformed, tampered or expired one (older than three days) returns 400.
          schema:
            type: string
        - name: page[limit]
          in: query
          description: Maximum number of items returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          example: 25
      responses:
        '200':
          description: A page of the products the rep may share.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontItemEnvelope'
              example:
                status: 200
                data:
                  - id: 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f61
                    kind: products
                    title: Wellness kit
                    description: null
                    image_url: null
                    url: https://primex.fluid.app/home/products/primex-wellness-kit
                    share_url: https://primex.fluid.app/riley-kim/products/primex-wellness-kit
                    created_at: '2026-09-29T15:02:11.482913Z'
                    updated_at: '2026-09-29T15:04:52.118204Z'
                meta:
                  request_uuid: 0199a3f2-7a10-7c3e-8f21-4d5e6f708193
                  timestamp: '2026-09-30T18:24:05Z'
                  pagination:
                    next_cursor: null
        '304':
          description: The representation is unchanged; authentication and access are checked before this response.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            The membership cannot share content (a customer), or the credential belongs to a sandbox
            test company that cannot be reached now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: >-
            A query parameter is not valid, such as a blank or over-long `filter[q]`, a `page[limit]` outside
            1 to 100, or an undeclared parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      x-fluid-audience: member
  /api/member/v2027-01/storefront/playlists:
    get:
      operationId: member_v202701_storefront_playlists_index
      tags:
        - storefront
      summary: List the playlists the rep may share
