      tags:
      - activities
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from a previous response.
        schema:
          type: string
      - name: filter[kind]
        in: query
        required: false
        description: Only activities of this kind.
        schema:
          type: string
          enum:
          - abandoned_cart
          - announcements
          - cart_items_added
          - comment_reply
          - direct_message
          - new_lead
          - order_placed
          - page_views
          - page_views_contact
          - tasks
          - upcoming_event
          - video
          - video_started
          - video_complete
          - video_complete_contact
          - video_contact
          - message_received
          - message_sent
          - new_cart_items_added
          - smart_link_clicked
          - review_left
          - cart_item_removed
          - comment_like
          - emoji_reaction
          - media_views
          - enrollment
          - external_order
          - imported
          - cart_abandoned
          - fantasy_point
          - other
        example: order_placed
      - name: filter[read]
        in: query
        required: false
        description: "`false` lists unread activities; `true` lists read ones."
        schema:
          type: boolean
