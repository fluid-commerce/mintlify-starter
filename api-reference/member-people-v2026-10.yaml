      responses:
        '200':
          description: The group with its updated count.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GroupEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4e5-6f7a-7b8c-9d0e-1f2a3b4c5d67'
                  name: Hot leads
                  color: "#FFE6EB"
                  contacts_count: 12
                  created_at: '2026-09-01T10:00:00.000000Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
