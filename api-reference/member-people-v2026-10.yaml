            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"

  "/api/member/v2026-10/activities":
    get:
      summary: List the member's activity feed
      description: The member's activities in this company, newest first, keyset-paginated on (occurred_at, id). Activities stored without a company are not included. Subjects and actors are resolved in one query per kind, never per row. The ETag covers the page; the list is not cached (`max-age=0`).
