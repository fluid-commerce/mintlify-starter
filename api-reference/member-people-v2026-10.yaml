  "/api/member/v2026-10/addresses/{id}/default":
    parameters:
      - name: id
        in: path
        required: true
        description: The saved address's id.
        schema:
          type: string
          format: uuid
    post:
      x-fluid-audience: member
      summary: Make a saved address the default
      description: |
        Makes the address the member's default, which checkout uses for
        shipping. A shared address can be copied before this transition; use the
        returned address id for subsequent requests. A member has one default
        address; the previous default stops
        being it. `kind: billing` is refused, because a billing address
        belongs to each payment method (`PATCH /payment-methods/{id}`).
        Requires a writable member credential.
      tags:
        - addresses
      operationId: member_addresses_default
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  enum:
                    - shipping
                    - billing
                  description: Only `shipping` is accepted; see above.
              required:
                - kind
            example:
              kind: shipping
      responses:
        "200":
          description: The address, now the default.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SavedAddressEnvelope"
              example:
                status: 200
                data:
                  id: 0192f4f0-7a8b-7c9d-8e0f-1a2b3c4d5e6f
                  name: Casey Brooks
                  address1: 1 Lakeshore Dr
                  address2: null
                  city: Chicago
                  state: IL
                  postal_code: '60601'
                  country_code: US
                  phone: '+13125550188'
                  default_shipping: true
                  created_at: '2026-09-30T15:14:09.512088Z'
                  updated_at: '2026-09-30T15:14:09.512088Z'
                meta:
                  request_uuid: 0192f520-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  timestamp: '2026-09-30T15:20:00Z'
        "400":
