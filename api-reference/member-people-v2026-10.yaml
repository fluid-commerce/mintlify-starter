  "/api/member/v2026-10/contacts/import":
    post:
      summary: Import contacts from a CSV file
      description: Accepts a CSV file of up to 2 MB and 5,000 rows, uploaded as the multipart field `file`. The header row names the columns; `first_name`, `last_name`, `email`, `phone`, `status` and `source` are read and other columns are ignored. The file must be UTF-8 text; other encodings are refused rather than converted. Rows that fail, such as a malformed email or a value over its length limit, are reported on the import. Returns at once with a pending import that a background job processes. Finished imports keep their counts and rejected-row reasons but not the uploaded rows.
      operationId: member_contacts_import
      tags:
      - contacts
      x-fluid-audience: member
      responses:
        '202':
          description: The accepted import.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactImportEnvelope"
              example:
                status: 202
                data:
                  id: '0192f4f6-7a8b-7c9d-8e0f-2a3b4c5d6e78'
                  source: csv
                  status: pending
                  total_rows: 120
                  processed_rows: 0
                  created_count: 0
                  rejected_count: 0
                  rejected_rows: []
                  created_at: '2026-09-30T15:00:00.000000Z'
                  started_at:
                  finished_at:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The valid member credential is read-only (a member or portal JWT), or the membership is neither a rep nor a company admin (a customer or preferred customer).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: No file, a file over 2 MB, text that is not valid UTF-8, a null byte, unreadable CSV, a header with none of the read columns, no rows or more than 5,000.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: The import could not be queued. It is recorded as failed and nothing is added; upload the file again.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file, UTF-8 encoded.
