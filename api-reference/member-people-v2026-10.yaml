  "/api/member/v2026-10/activities/read":
    post:
      summary: Mark activities read
      description: Marks unread activities read, either by up to 100 public ids or every activity at or before a time. Ids outside the member's feed are ignored rather than reported, so the call reveals nothing about other members. Returns the unread count afterwards, read from the maintained counter. The user's legacy activity badge is refreshed too. The call is all-or-nothing. When another request holds a selected unread activity or the counters it feeds, nothing is marked and the call returns 409, so a success never hides an unread activity that was selected and eligible. Retry the same request.
      operationId: member_activities_read
      tags:
      - activities
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityRead"
            example:
              ids:
              - '0192f4a1-2b3c-7d4e-9f5a-6b7c8d9e0f12'
      responses:
        '200':
          description: The unread count after marking.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnreadCountEnvelope"
              example:
                status: 200
                data:
                  count: 4
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The valid member credential is read-only (a member or portal JWT).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Neither or both of `ids` and `before`, more than 100 ids, a malformed id, or an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: A selected unread activity, or a counter it feeds, is locked or changed concurrently. No activity was marked read; retry the same request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: Historical unread state is awaiting background reconciliation; no changes were committed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/activities/unread":
    get:
      summary: Count unread activities
      description: The member's unread activity count in this company, read from a counter that database triggers maintain for every writer. A reconciled counter is read in one query. Historical state awaiting background reconciliation returns 503 without scanning history. Empty new scopes use a bounded existence check. Privately cacheable with revalidation on every read.
      operationId: member_activities_unread
      tags:
      - activities
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from a previous response.
        schema:
          type: string
      responses:
        '200':
          description: The unread count.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnreadCountEnvelope"
              example:
                status: 200
                data:
                  count: 5
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: Historical unread state is awaiting background reconciliation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
