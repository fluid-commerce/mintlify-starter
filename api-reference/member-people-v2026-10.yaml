      summary: List the member's contacts
      description: 'The member''s contacts in the lite shape: contacts the membership owns (its `member_id`), in this company or with no company recorded, and contacts held by the membership''s user (its `user_id`) in this company, regardless of its `member_id`. Either claim is enough, so a contact reassigned to another member of the company stays in the list of the user who still holds it. A contact moved to another company leaves the member''s contacts altogether. Last activity and unread state come from maintained counters. The ETag covers the page; the list is not cached (`max-age=0`).'
