      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ContactBulkCreate"
            example:
              contacts:
              - first_name: Jordan
                last_name: Lee
                email: jordan.lee@example.com
              - first_name: Sam
                phone: "+15555550199"
      responses:
        '202':
          description: The accepted import.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ContactImportEnvelope"
              example:
                status: 202
                data:
                  id: '0192f4f6-7a8b-7c9d-8e0f-2a3b4c5d6e78'
                  source: bulk
                  status: pending
                  total_rows: 2
                  processed_rows: 0
                  created_count: 0
                  rejected_count: 0
                  rejected_rows: []
                  created_at: '2026-09-30T15:00:00.000000Z'
                  started_at:
                  finished_at:
