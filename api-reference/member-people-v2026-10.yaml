  "/api/member/v2026-10/contacts/bulk":
    post:
      summary: Add contacts in bulk
      description: Accepts up to 1,000 contacts and returns at once with a pending import; a background job adds them through the member contact writer. Rows that fail, such as a malformed email or an email already among the member's contacts, are reported on the import. A value over its length limit or with a null byte fails the whole request with 422 before any import is created. Follow progress with GET /contacts/imports/{id}.
