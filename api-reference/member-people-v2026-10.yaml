                    name: Jordan Lee
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
                  pagination:
                    next_cursor:
        '304':
