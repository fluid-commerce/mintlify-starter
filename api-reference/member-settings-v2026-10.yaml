    post:
      operationId: member_notification_devices_create
      tags:
        - notification-devices
      summary: Register a push device
      description: >-
        Registers the device's Expo push token for the member, in their company, so push notifications
        reach it. Registering a token the member already registered returns the same device with 200,
        marks it active again and updates any details sent; it never creates a duplicate. The response never
        repeats the token. Another member
        registering the same token is unaffected: each member's registration is their own. Requires a
        writable member credential.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/NotificationDeviceRegistration"
            example:
              push_token: ExponentPushToken[xTn3kQ8vLm2Pz0aBcDeF]
              device_type: ios
              device_uid: casey-iphone-14
              bundle_id: com.fluid.fluid-crm
      responses:
        '200':
          description: The member had already registered this token; it is refreshed and active.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationDeviceEnvelope"
              example:
                status: 200
                data:
                  id: 0192f4f0-7a8b-7c9d-8e0f-1a2b3c4d5e6f
                  device_type: ios
                  device_uid: casey-iphone-14
                  bundle_id: com.fluid.fluid-crm
                  project_id: 6b1d3f2e-9c47-4a58-b0e1-2f3a4b5c6d7e
                  active: true
