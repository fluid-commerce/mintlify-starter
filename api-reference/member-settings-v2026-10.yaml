    delete:
      operationId: member_notification_devices_destroy
      tags:
        - notification-devices
      summary: Remove a push device
      description: >-
        Removes one of the member's devices so push notifications stop reaching it. The device registers
        again by sending its token. Any id that is not one of the member's own devices returns 404 and
        changes nothing. Requires a writable member credential.
      x-fluid-audience: member
      responses:
        '204':
          description: The device was removed.
        '400':
          description: Malformed JSON body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: This credential cannot make changes (a read-only member JWT).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No device of this member has this id (including malformed, foreign, other-company and already removed ids).
