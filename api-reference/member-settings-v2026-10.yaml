---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Settings
  description: |
    Includes notification preferences shared across the member user's memberships.
    The agreements that apply to the signed-in member and their acceptance.
    Every operation acts as the member the bearer credential speaks for; the
    member and their company come from the credential alone. Acceptance here
    is the same record the company's login agreement check reads; it is not a
    checkout gate, which stays a storefront concern.

    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation refuses a credential for it with `403` and the standard error
    envelope, before the operation runs.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: agreements
  description: The company agreements that apply to the member, their text, and the member's versioned
    acceptance.
  x-fluid-section: Settings
- name: notifications
  description: The member's site-update notifications, the bell on the Passport and the apps, listed newest first,
    counted and marked read.
  x-fluid-section: Settings
- name: notification-preferences
  description: Which notifications the member receives on which channel, and when not to disturb them.
  x-fluid-section: Settings
- name: notification-devices
  description: The devices the member receives push notifications on, registered by the mobile app.
  x-fluid-section: Settings
- name: features
  description: The release flags a rep's own clients read for the rep's company.
  x-fluid-section: Settings
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or a member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while
        it is unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: max-age=60, private
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    Agreement:
      type: object
      description: An agreement that applies to the member. Read it to get its current `version`.
      additionalProperties: false
      required:
      - id
      - title
      - url
      - accepted_at
      - accepted_version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: In the member's language, falling back to the company default.
        url:
          type: string
          format: uri
          description: The agreement's public page on the company site; its path uses the agreement's
            legacy numeric id, not the API `id`.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the latest agreed record, or null when no timestamp is available.
        accepted_version:
          type:
          - string
          - 'null'
          description: >-
            The latest recorded acceptance version. Null when no agreed record exists or versions were
            not yet kept. A value differing from the current `version` means the shown text or the member's
            language changed since acceptance; it does not by itself require re-accepting.
    AgreementDetail:
      type: object
      description: An agreement with its full text.
      additionalProperties: false
      required:
      - id
      - title
      - url
      - version
      - accepted_at
      - accepted_version
      - body_html
      - body_text
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: In the member's language, falling back to the company default.
        url:
          type: string
          format: uri
          description: The agreement's public page on the company site; its path uses the agreement's
            legacy numeric id, not the API `id`.
        version:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            SHA-256 of the title and text shown, computed in the member's current language. It changes
            when that text changes and when the member switches language; send it when accepting.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the latest agreed record, or null when no timestamp is available.
        accepted_version:
          type:
          - string
          - 'null'
          description: >-
            The latest recorded acceptance version. Null when no agreed record exists or versions were
            not yet kept. A value differing from the current `version` means the shown text or the member's
            language changed since acceptance; it does not by itself require re-accepting.
        body_html:
          type: string
          description: The full text as HTML, in the member's language.
        body_text:
          type: string
          description: The full text as plain text.
    AgreementsEnvelope:
      type: object
      description: A page of applicable agreements.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Agreement"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    AgreementEnvelope:
      type: object
      description: One agreement with its full text.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/AgreementDetail"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    NotificationPreferences:
      type: object
      description: The member's notification preferences.
      additionalProperties: false
      required:
        - channels
        - families
        - dnd
      properties:
        channels:
          type: object
          description: Master switches. A channel switched off delivers nothing, whatever the families say.
          additionalProperties: false
          required:
            - push
            - email
            - sms
          properties:
            push:
              type: boolean
            email:
              type: boolean
            sms:
              type: boolean
              description: SMS is a channel switch only; it has no per-family choice.
        families:
          type: object
          description: Push and email choices for each family of notifications.
          additionalProperties: false
          required:
            - activity
            - orders
            - messaging
            - general
          properties:
            activity:
              "$ref": "#/components/schemas/FamilyChoice"
            orders:
              "$ref": "#/components/schemas/FamilyChoice"
            messaging:
              "$ref": "#/components/schemas/FamilyChoice"
            general:
              "$ref": "#/components/schemas/FamilyChoice"
        dnd:
          type: object
          description: Do not disturb.
          additionalProperties: false
          required:
            - mode
            - schedule
          properties:
            mode:
              type: string
              enum:
                - 'off'
                - all
                - push
                - email
              description: Silence everything, only push, only email, or nothing.
            schedule:
              type: object
              description: >-
                Recurring quiet hours, in the user's time zone. They apply only in companies that enable
                scheduled do-not-disturb.
              additionalProperties: false
              required:
                - name
                - start_time
                - end_time
                - days
              properties:
                name:
                  type: string
                  enum:
                    - everyday
                    - weekdays
                    - weekends
                    - custom
                  description: Which days the quiet hours apply.
                start_time:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  description: When quiet hours start. With an end earlier than the start, legacy delivery suppresses the evening portion only; the following morning is not suppressed.
                end_time:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  description: When quiet hours end.
                days:
                  description: Per-day quiet hours for a `custom` schedule; null for the named schedules.
                  oneOf:
                    - type: 'null'
                    - "$ref": "#/components/schemas/CustomScheduleDays"
    FamilyChoice:
      type: object
      description: Push and email choices for one family of notifications.
      additionalProperties: false
      required:
        - push
        - email
      properties:
        push:
          type:
            - boolean
            - 'null'
          description: >-
            True or false when every notification in the family agrees; null when they differ
            (set individually in another client).
        email:
          type:
            - boolean
            - 'null'
          description: >-
            True or false when every notification in the family agrees; null when they differ
            (set individually in another client).
    CustomScheduleDays:
      type: object
      description: Per-day quiet hours for a `custom` schedule. Only the days present apply.
      additionalProperties: false
      properties:
        monday:
          "$ref": "#/components/schemas/DayRange"
        tuesday:
          "$ref": "#/components/schemas/DayRange"
        wednesday:
          "$ref": "#/components/schemas/DayRange"
        thursday:
          "$ref": "#/components/schemas/DayRange"
        friday:
          "$ref": "#/components/schemas/DayRange"
        saturday:
          "$ref": "#/components/schemas/DayRange"
        sunday:
          "$ref": "#/components/schemas/DayRange"
    DayRange:
      type: object
      description: >-
        Quiet hours on the selected day. When the end precedes the start, legacy
        delivery suppresses the evening portion only; the following morning is
        not suppressed. This preserves the existing custom-schedule behavior.
      additionalProperties: false
      required:
        - start_time
        - end_time
      properties:
        start_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time, `HH:MM`.
        end_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time, `HH:MM`.
    NotificationPreferencesUpdate:
      type: object
      description: Preferences to change; anything omitted stays as it is.
      additionalProperties: false
      minProperties: 1
      properties:
        channels:
          type: object
          additionalProperties: false
          properties:
            push:
              type: boolean
            email:
              type: boolean
            sms:
              type: boolean
        families:
          type: object
          additionalProperties: false
          description: Setting a family's channel sets it for every notification in the family.
          properties:
            activity:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            orders:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            messaging:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            general:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
        dnd:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
                - 'off'
                - all
                - push
                - email
            schedule:
              description: >-
                Replaces the whole schedule; null resets it to the default (every day, 18:00 to 09:00).
                A `custom` schedule needs `days`.
              oneOf:
                - type: 'null'
                - "$ref": "#/components/schemas/ScheduleUpdate"
    FamilyChoiceUpdate:
      type: object
      additionalProperties: false
      properties:
        push:
          type: boolean
        email:
          type: boolean
    ScheduleUpdate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          enum:
            - everyday
            - weekdays
            - weekends
            - custom
          description: Which days the quiet hours apply.
        start_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: When quiet hours start. With an end earlier than the start, legacy delivery suppresses the evening portion only; the following morning is not suppressed.
        end_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: When quiet hours end.
        days:
          description: Per-day quiet hours for a `custom` schedule.
          oneOf:
            - type: 'null'
            - "$ref": "#/components/schemas/CustomScheduleDays"
    NotificationPreferencesEnvelope:
      type: object
      description: The member's notification preferences.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/NotificationPreferences"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    Features:
      type: object
      description: >-
        The company's release flags for a rep's own clients, each true or false. A flag is a
        LaunchDarkly flag targeted by company; one that cannot be evaluated is false.
      additionalProperties: false
      required:
        - mist_reps
      properties:
        mist_reps:
          type: boolean
          description: Whether Mist shows the member its rep view (the LaunchDarkly flag `mist-reps`).
    FeaturesEnvelope:
      type: object
      description: The company's release flags for a rep's own clients.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Features"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    NotificationDevice:
      type: object
      description: >-
        A device registered for push notifications. The push token is never returned, whole or in part:
        anyone holding it can send pushes to the device. Recognise the device by `id`, which
        registration returns, and by its own `device_uid`. A member sees only their own devices.
      additionalProperties: false
      required:
        - id
        - device_type
        - device_uid
        - bundle_id
        - project_id
        - active
        - refreshed_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        device_type:
          type:
            - string
            - 'null'
          description: The platform the app reported, such as `ios` or `android`.
        device_uid:
          type:
            - string
            - 'null'
          description: The app's own identifier for the device.
        bundle_id:
          type:
            - string
            - 'null'
          description: The app's bundle or package id.
        project_id:
          type:
            - string
            - 'null'
          description: The Expo project the token belongs to.
        active:
          type: boolean
          description: >-
            Whether the device registered or re-registered recently enough to be kept. Registering the
            same token again makes it active.
        refreshed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the token was last registered.
        created_at:
          type: string
          format: date-time
    NotificationDeviceEnvelope:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/NotificationDevice"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    NotificationDevicesEnvelope:
      type: object
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/NotificationDevice"
        meta:
          allOf:
            - "$ref": "#/components/schemas/ResponseMeta"
            - type: object
              properties:
                pagination:
                  "$ref": "#/components/schemas/PaginationMeta"
              required:
                - pagination
    NotificationDeviceRegistration:
      type: object
      description: A push token to register, with what the app knows about the device.
      additionalProperties: false
      required:
        - push_token
      properties:
        push_token:
          type: string
          pattern: "\\S"
          description: The device's Expo push token. Any non-blank string, as the legacy registration accepts.
        device_type:
          type:
            - string
            - 'null'
          maxLength: 32
        device_uid:
          type:
            - string
            - 'null'
          maxLength: 255
        bundle_id:
          type:
            - string
            - 'null'
          maxLength: 255
        project_id:
          type:
            - string
            - 'null'
          maxLength: 255
    SiteUpdateNotificationSite:
      type: object
      description: The site a notification is about, when the member can still open it.
      additionalProperties: false
      required:
        - id
        - handle
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Public id of the site.
        handle:
          type: string
          description: The site's URL segment.
        name:
          type: string
          description: The site's display name.
    SiteUpdateNotification:
      type: object
      description: >-
        One row of the member's bell: a line posted on a member site. The text is stored with the
        notification, so a row outlives the update it came from.
      additionalProperties: false
      required:
        - id
        - kind
        - text
        - by
        - by_avatar_url
        - created_at
        - read_at
        - site
      properties:
        id:
          type: string
          format: uuid
          description: Public id of the notification. Send it to `POST /notifications/{id}/read`.
        kind:
          type: string
          enum:
            - site_update
          description: What the row is. Only site updates are listed.
        text:
          type: string
          maxLength: 240
          description: The line that was posted.
        by:
          type: string
          description: >-
            Who posted it, as the member sees them: the author's name in the company, else their name as
            a user, else the company's name when the update has no author.
        by_avatar_url:
          type:
            - string
            - 'null'
          description: The author's avatar image. Null when the author has none or the update has no author.
        created_at:
          type: string
          format: date-time
          description: When the notification was created.
        read_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the member first read it. Null while unread; a second mark does not change it.
        site:
          description: >-
            The site the update was posted on. Null once the member can no longer open the site, such as
            a private site that was not shared with them or was taken down; the row stays listed.
          oneOf:
            - type: 'null'
            - "$ref": "#/components/schemas/SiteUpdateNotificationSite"
    SiteUpdateNotificationsEnvelope:
      type: object
      description: A page of the member's bell, newest first.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/SiteUpdateNotification"
        meta:
          allOf:
            - "$ref": "#/components/schemas/ResponseMeta"
            - type: object
              required:
                - pagination
                - unread_count
              properties:
                pagination:
                  "$ref": "#/components/schemas/PaginationMeta"
                unread_count:
                  type: integer
                  minimum: 0
                  description: How many of the bell's rows are unread, in all, not only on this page.
    SiteUpdateNotificationUnread:
      type: object
      description: The bell's unread count, in all and per site.
      additionalProperties: false
      required:
        - count
        - by_site
      properties:
        count:
          type: integer
          minimum: 0
          description: How many of the bell's rows are unread.
        by_site:
          type: object
          description: >-
            The unread count of each site the member can open now, keyed by the site's public id. A site with
            none, or one the member can no longer open, is absent, so the counts can add up to less than `count`.
          additionalProperties:
            type: integer
            minimum: 1
    SiteUpdateNotificationUnreadEnvelope:
      type: object
      description: The bell's unread count.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/SiteUpdateNotificationUnread"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    SiteUpdateNotificationMarked:
      type: object
      description: The answer to marking one row read.
      additionalProperties: false
      required:
        - unread_count
        - notification
      properties:
        unread_count:
          type: integer
          minimum: 0
          description: How many of the bell's rows are unread after the mark.
        notification:
          "$ref": "#/components/schemas/SiteUpdateNotification"
    SiteUpdateNotificationMarkedEnvelope:
      type: object
      description: The answer to marking one row read.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/SiteUpdateNotificationMarked"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    SiteUpdateNotificationSiteMarked:
      type: object
      description: The answer to marking every row on one site read.
      additionalProperties: false
      required:
        - unread_count
        - site_id
      properties:
        unread_count:
          type: integer
          minimum: 0
          description: How many of the bell's rows are unread after the mark.
        site_id:
          type: string
          format: uuid
          description: Public id of the site whose rows were marked.
    SiteUpdateNotificationSiteMarkedEnvelope:
      type: object
      description: The answer to marking every row on one site read.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/SiteUpdateNotificationSiteMarked"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    SiteUpdateNotificationAllMarked:
      type: object
      description: The answer to marking every row read.
      additionalProperties: false
      required:
        - unread_count
      properties:
        unread_count:
          type: integer
          minimum: 0
          description: How many of the bell's rows are unread after the mark, normally 0.
    SiteUpdateNotificationAllMarkedEnvelope:
      type: object
      description: The answer to marking every row read.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/SiteUpdateNotificationAllMarked"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
paths:
  "/api/member/v2026-10/agreements":
    get:
      operationId: member_agreements_index
      tags:
      - agreements
      summary: List applicable agreements
      description: |
        The company's active agreements required at sign-in that apply to the member: unrestricted ones and
        those restricted to countries including the member's country. Each carries the member's acceptance,
        when one exists. Pending follows the sign-in check: no acceptance or any historical not-agreed
        record keeps an agreement pending, even if an older agreed record exists. Ordered oldest first.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication runs before a 304 is considered.
        schema:
          type: string
      - name: filter[pending]
        in: query
        required: false
        description: "`true` lists agreements with no acceptance or any not-agreed record; `false` lists
          the applicable agreements without either condition."
        schema:
          type: boolean
        example: true
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`. A malformed, tampered or expired cursor returns
          400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of agreements.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgreementsEnvelope"
              example:
                status: 200
                data:
                - id: '0192f6d1-2b3c-7d4e-8f50-6a7b8c9d0e1f'
                  title: Primex Privacy Policy
                  url: https://primex.fluid.app/legal-agreements/90182?locale=en
                  accepted_at:
                  accepted_version:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
