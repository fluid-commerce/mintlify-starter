                  accepted_version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  body_html: |
                    <div class="trix-content">
                      <p>We collect and process your data in accordance with applicable law.</p>
                    </div>
                  body_text: We collect and process your data in accordance with applicable law.
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '201':
