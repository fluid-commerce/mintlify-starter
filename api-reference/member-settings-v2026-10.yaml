      description: >-
        The push devices the member registered in their company, newest first. A device the member's
        user registered under another company, or before devices were company-specific, is not listed.
        Always revalidate with the ETag. Refused with 403 for the shopper JWT carried in email links.
      x-fluid-audience: member
      parameters:
        - name: page[cursor]
          in: query
          required: false
          description: Opaque cursor from `meta.pagination.next_cursor`. Malformed, tampered or expired (three days) cursors return 400.
          schema:
            type: string
        - name: page[limit]
          in: query
          required: false
          description: Page size. Defaults to 25, at most 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: If-None-Match
          in: header
          required: false
          description: A previously returned ETag. Authentication runs before a 304 is considered.
          schema:
            type: string
      responses:
        '200':
          description: One page of the member's devices.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
