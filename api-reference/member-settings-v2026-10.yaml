---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Settings
  description: |
    Includes notification preferences shared across the member user's memberships.
    The agreements that apply to the signed-in member and their acceptance.
    Every operation acts as the member the bearer credential speaks for; the
    member and their company come from the credential alone. Acceptance here
    is the same record the company's login agreement check reads; it is not a
    checkout gate, which stays a storefront concern.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: agreements
  description: The company agreements that apply to the member, their text, and the member's versioned
    acceptance.
  x-fluid-section: Settings
- name: notification-preferences
  description: Which notifications the member receives on which channel, and when not to disturb them.
  x-fluid-section: Settings
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or a member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while
        it is unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: max-age=60, private
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    Agreement:
      type: object
      description: An agreement that applies to the member. Read it to get its current `version`.
      additionalProperties: false
      required:
      - id
      - title
      - url
      - accepted_at
      - accepted_version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: In the member's language, falling back to the company default.
        url:
          type: string
          format: uri
          description: The agreement's public page on the company site; its path uses the agreement's
            legacy numeric id, not the API `id`.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the latest agreed record, or null when no timestamp is available.
        accepted_version:
          type:
          - string
          - 'null'
          description: >-
            The latest recorded acceptance version. Null when no agreed record exists or versions were
            not yet kept. A value differing from the current `version` means the shown text or the member's
            language changed since acceptance; it does not by itself require re-accepting.
    AgreementDetail:
      type: object
      description: An agreement with its full text.
      additionalProperties: false
      required:
      - id
      - title
      - url
      - version
      - accepted_at
      - accepted_version
      - body_html
      - body_text
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: In the member's language, falling back to the company default.
        url:
          type: string
          format: uri
          description: The agreement's public page on the company site; its path uses the agreement's
            legacy numeric id, not the API `id`.
        version:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            SHA-256 of the title and text shown, computed in the member's current language. It changes
            when that text changes and when the member switches language; send it when accepting.
        accepted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Timestamp of the latest agreed record, or null when no timestamp is available.
        accepted_version:
          type:
          - string
          - 'null'
          description: >-
            The latest recorded acceptance version. Null when no agreed record exists or versions were
            not yet kept. A value differing from the current `version` means the shown text or the member's
            language changed since acceptance; it does not by itself require re-accepting.
        body_html:
          type: string
          description: The full text as HTML, in the member's language.
        body_text:
          type: string
          description: The full text as plain text.
    AgreementsEnvelope:
      type: object
      description: A page of applicable agreements.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Agreement"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    AgreementEnvelope:
      type: object
      description: One agreement with its full text.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/AgreementDetail"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    NotificationPreferences:
      type: object
      description: The member's notification preferences.
      additionalProperties: false
      required:
        - channels
        - families
        - dnd
      properties:
        channels:
          type: object
          description: Master switches. A channel switched off delivers nothing, whatever the families say.
          additionalProperties: false
          required:
            - push
            - email
            - sms
          properties:
            push:
              type: boolean
            email:
              type: boolean
            sms:
              type: boolean
              description: SMS is a channel switch only; it has no per-family choice.
        families:
          type: object
          description: Push and email choices for each family of notifications.
          additionalProperties: false
          required:
            - activity
            - orders
            - messaging
            - general
          properties:
            activity:
              "$ref": "#/components/schemas/FamilyChoice"
            orders:
              "$ref": "#/components/schemas/FamilyChoice"
            messaging:
              "$ref": "#/components/schemas/FamilyChoice"
            general:
              "$ref": "#/components/schemas/FamilyChoice"
        dnd:
          type: object
          description: Do not disturb.
          additionalProperties: false
          required:
            - mode
            - schedule
          properties:
            mode:
              type: string
              enum:
                - 'off'
                - all
                - push
                - email
              description: Silence everything, only push, only email, or nothing.
            schedule:
              type: object
              description: >-
                Recurring quiet hours, in the user's time zone. They apply only in companies that enable
                scheduled do-not-disturb.
              additionalProperties: false
              required:
                - name
                - start_time
                - end_time
                - days
              properties:
                name:
                  type: string
                  enum:
                    - everyday
                    - weekdays
                    - weekends
                    - custom
                  description: Which days the quiet hours apply.
                start_time:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  description: When quiet hours start. With an end earlier than the start, legacy delivery suppresses the evening portion only; the following morning is not suppressed.
                end_time:
                  type: string
                  pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
                  description: When quiet hours end.
                days:
                  description: Per-day quiet hours for a `custom` schedule; null for the named schedules.
                  oneOf:
                    - type: 'null'
                    - "$ref": "#/components/schemas/CustomScheduleDays"
    FamilyChoice:
      type: object
      description: Push and email choices for one family of notifications.
      additionalProperties: false
      required:
        - push
        - email
      properties:
        push:
          type:
            - boolean
            - 'null'
          description: >-
            True or false when every notification in the family agrees; null when they differ
            (set individually in another client).
        email:
          type:
            - boolean
            - 'null'
          description: >-
            True or false when every notification in the family agrees; null when they differ
            (set individually in another client).
    CustomScheduleDays:
      type: object
      description: Per-day quiet hours for a `custom` schedule. Only the days present apply.
      additionalProperties: false
      properties:
        monday:
          "$ref": "#/components/schemas/DayRange"
        tuesday:
          "$ref": "#/components/schemas/DayRange"
        wednesday:
          "$ref": "#/components/schemas/DayRange"
        thursday:
          "$ref": "#/components/schemas/DayRange"
        friday:
          "$ref": "#/components/schemas/DayRange"
        saturday:
          "$ref": "#/components/schemas/DayRange"
        sunday:
          "$ref": "#/components/schemas/DayRange"
    DayRange:
      type: object
      description: >-
        Quiet hours on the selected day. When the end precedes the start, legacy
        delivery suppresses the evening portion only; the following morning is
        not suppressed. This preserves the existing custom-schedule behavior.
      additionalProperties: false
      required:
        - start_time
        - end_time
      properties:
        start_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time, `HH:MM`.
        end_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: 24-hour local time, `HH:MM`.
    NotificationPreferencesUpdate:
      type: object
      description: Preferences to change; anything omitted stays as it is.
      additionalProperties: false
      minProperties: 1
      properties:
        channels:
          type: object
          additionalProperties: false
          properties:
            push:
              type: boolean
            email:
              type: boolean
            sms:
              type: boolean
        families:
          type: object
          additionalProperties: false
          description: Setting a family's channel sets it for every notification in the family.
          properties:
            activity:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            orders:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            messaging:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
            general:
              "$ref": "#/components/schemas/FamilyChoiceUpdate"
        dnd:
          type: object
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
                - 'off'
                - all
                - push
                - email
            schedule:
              description: >-
                Replaces the whole schedule; null resets it to the default (every day, 18:00 to 09:00).
                A `custom` schedule needs `days`.
              oneOf:
                - type: 'null'
                - "$ref": "#/components/schemas/ScheduleUpdate"
    FamilyChoiceUpdate:
      type: object
      additionalProperties: false
      properties:
        push:
          type: boolean
        email:
          type: boolean
    ScheduleUpdate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          enum:
            - everyday
            - weekdays
            - weekends
            - custom
          description: Which days the quiet hours apply.
        start_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: When quiet hours start. With an end earlier than the start, legacy delivery suppresses the evening portion only; the following morning is not suppressed.
        end_time:
          type: string
          pattern: "^([01]?[0-9]|2[0-3]):[0-5][0-9]$"
          description: When quiet hours end.
        days:
          description: Per-day quiet hours for a `custom` schedule.
          oneOf:
            - type: 'null'
            - "$ref": "#/components/schemas/CustomScheduleDays"
    NotificationPreferencesEnvelope:
      type: object
      description: The member's notification preferences.
      required:
        - status
        - data
        - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/NotificationPreferences"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
paths:
  "/api/member/v2026-10/agreements":
    get:
      operationId: member_agreements_index
      tags:
      - agreements
      summary: List applicable agreements
      description: |
        The company's active agreements required at sign-in that apply to the member: unrestricted ones and
        those restricted to countries including the member's country. Each carries the member's acceptance,
        when one exists. Pending follows the sign-in check: no acceptance or any historical not-agreed
        record keeps an agreement pending, even if an older agreed record exists. Ordered oldest first.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication runs before a 304 is considered.
        schema:
          type: string
      - name: filter[pending]
        in: query
        required: false
        description: "`true` lists agreements with no acceptance or any not-agreed record; `false` lists
          the applicable agreements without either condition."
        schema:
          type: boolean
        example: true
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`. A malformed, tampered or expired cursor returns
          400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of agreements.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgreementsEnvelope"
              example:
                status: 200
                data:
                - id: '0192f6d1-2b3c-7d4e-8f50-6a7b8c9d0e1f'
                  title: Primex Privacy Policy
                  url: https://primex.fluid.app/legal-agreements/90182?locale=en
                  accepted_at:
                  accepted_version:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A query parameter is invalid or unknown.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/agreements/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of an agreement that applies to the member.
      schema:
        type: string
        format: uuid
    get:
      operationId: member_agreements_show
      tags:
      - agreements
      summary: Show an agreement
      description: The agreement's full text in the member's language, its current version and the member's
        acceptance.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication runs before a 304 is considered.
        schema:
          type: string
      responses:
        '200':
          description: The agreement.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgreementEnvelope"
              example:
                status: 200
                data:
                  id: '0192f6d1-2b3c-7d4e-8f50-6a7b8c9d0e1f'
                  title: Primex Privacy Policy
                  url: https://primex.fluid.app/legal-agreements/90182?locale=en
                  accepted_at:
                  accepted_version:
                  version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  body_html: |
                    <div class="trix-content">
                      <p>We collect and process your data in accordance with applicable law.</p>
                    </div>
                  body_text: We collect and process your data in accordance with applicable law.
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No agreement that applies to the member has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/agreements/{id}/accept":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of an agreement that applies to the member.
      schema:
        type: string
        format: uuid
    post:
      operationId: member_agreements_accept
      tags:
      - agreements
      summary: Accept an agreement
      description: |
        Record that the member accepted the text at `version`, with the request's IP address and user agent.
        The version must be the agreement's current one, so a member never accepts text they were not shown.
        Revised or previously unversioned consent creates new evidence, preserving earlier agreed records.
        Accepting the current text also completes any historical not-agreed records for this member and
        agreement, so the sign-in check clears too. Recording or completing acceptance returns 201.
        Once the current version is accepted and no not-agreed records remain, repeat acceptance returns 200 without changing evidence, even after a later legacy acceptance. The response carries the evidence for the requested version.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The version of the text the member was shown.
              additionalProperties: false
              required:
              - version
              properties:
                version:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
            example:
              version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
      responses:
        '200':
          description: This version was already accepted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgreementEnvelope"
              example:
                status: 200
                data:
                  id: '0192f6d1-2b3c-7d4e-8f50-6a7b8c9d0e1f'
                  title: Primex Privacy Policy
                  url: https://primex.fluid.app/legal-agreements/90182?locale=en
                  accepted_at: '2026-10-01T15:08:21Z'
                  accepted_version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  body_html: |
                    <div class="trix-content">
                      <p>We collect and process your data in accordance with applicable law.</p>
                    </div>
                  body_text: We collect and process your data in accordance with applicable law.
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '201':
          description: The acceptance was recorded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AgreementEnvelope"
              example:
                status: 201
                data:
                  id: '0192f6d1-2b3c-7d4e-8f50-6a7b8c9d0e1f'
                  title: Primex Privacy Policy
                  url: https://primex.fluid.app/legal-agreements/90182?locale=en
                  accepted_at: '2026-10-01T15:08:21Z'
                  accepted_version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  version: 9f2c4e7a1b3d5f60718293a4b5c6d7e8f9012a3b4c5d6e7f8091a2b3c4d5e6f7
                  body_html: |
                    <div class="trix-content">
                      <p>We collect and process your data in accordance with applicable law.</p>
                    </div>
                  body_text: We collect and process your data in accordance with applicable law.
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: This credential cannot make changes (a read-only member JWT).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No agreement that applies to the member has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: "`version` is missing, malformed or no longer the current text, or an unknown field
            was sent."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"

  "/api/member/v2026-10/notifications/preferences":
    get:
      operationId: member_notifications_preferences_show
      tags:
        - notification-preferences
      summary: Show notification preferences
      description: >-
        The member's channel switches, per-family push and email choices, and do-not-disturb settings.
        Shared by every membership of the member's user.
      x-fluid-audience: member
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: A previously returned ETag. Authentication runs before a 304 is considered.
          schema:
            type: string
      responses:
        '200':
          description: The preferences.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationPreferencesEnvelope"
              example:
                status: 200
                data:
                  channels:
                    push: true
                    email: true
                    sms: false
                  families:
                    activity:
                      push: true
                      email:
                    orders:
                      push: true
                      email: true
                    messaging:
                      push: true
                      email: false
                    general:
                      push: true
                      email: true
                  dnd:
                    mode: 'off'
                    schedule:
                      name: weekdays
                      start_time: '21:00'
                      end_time: '07:30'
                      days:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
