  "/api/payment/v2026-04/transactions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Transaction slug
    get:
      operationId: showTransaction
      summary: Get a transaction
      description: |
        Retrieves a single transaction by slug, including its action, status,
        amounts, and fee breakdown. Read-only. Only transactions created through
        this API (live or sandbox) are addressable: a slug belonging to a checkout,
        storefront, or admin transaction returns `404`, as does any slug unknown to
        the authenticated merchant.
      tags:
      - Transactions
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionDataResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/api/payment/v2026-04/transactions/{id}/capture":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Transaction slug (authorization to capture)
    post:
      operationId: captureTransaction
      summary: Capture an authorization
      description: |
        Captures funds previously held by an authorization. Send `amount_cents` for a
        partial capture; omit it to capture the full authorized amount. Creates a
        `capture` transaction linked to the authorization via `parent_transaction_id`
        and returns it with `201`; read the capture outcome from `data.status`. Pass
        an `Idempotency-Key` header to make retries safe. Returns `404` when the
        authorization is not found — including authorizations that were not created
        through this API — `409` on an in-flight duplicate key, and `422` when the
        authorization cannot be captured. On success, API-key-authenticated requests
        emit a `payment.captured` webhook.
      tags:
      - Transactions
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transaction:
                  type: object
                  additionalProperties: false
                  properties:
                    amount_cents:
                      type: integer
                      minimum: 1
                      description: Partial capture amount in the source transaction's
                        currency smallest unit (defaults to the full authorization amount)
                    metadata:
                      type: object
                      additionalProperties:
                        "$ref": "#/components/schemas/JsonValue"
            examples:
              full_capture:
                summary: Capture the full authorized amount
                value: {}
              partial_capture:
                summary: Partial capture of $10.00
                value:
                  transaction:
                    amount_cents: 1000
      responses:
        '201':
          description: Capture created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionDataResponse"
              examples:
                capture:
                  summary: Full capture of an authorization
                  value:
                    data:
                      id: fpi_01hxyzghi789
                      gateway_id: stripe-usd
                      payment_method_id: 018f2c1a-9c4b-7e6d-9f10-3b4c5d6e7f80
                      card_network: visa
                      parent_transaction_id: fpi_01hxyzabc123
                      action: capture
                      status: success
                      amount_cents: 4999
                      currency_code: USD
                      payment_source: CreditCard
                      gateway_transaction_id: ch_3PQr7s2eZvKYlo2C
                      reference_token: null
                      description: null
                      processing_fee_cents: 175
                      platform_fee_cents: 130
                      credited_amount_cents: 0
                      retain_on_success: false
                      metadata: {}
                      created_at: '2026-04-02T09:30:00Z'
                      updated_at: '2026-04-02T09:30:00Z'
                    meta:
                      request_id: 018f2c1a-8b3a-7e6d-9f10-2a3b4c5d6e7f
                      timestamp: '2026-04-02T09:30:00Z'
          headers:
            X-Idempotent-Replayed:
              description: Present and `true` when this response is a cached
                replay of an earlier request with the same Idempotency-Key.
              schema:
                type: string
                enum:
                - 'true'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/api/payment/v2026-04/transactions/{id}/void":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Transaction slug (authorization to void)
    post:
      operationId: voidTransaction
      summary: Void an authorization
      description: |
        Voids (cancels) an authorization before it is captured, releasing the held
        funds. Creates a `void` transaction linked via `parent_transaction_id` and
        returns it with `200`; read the void outcome from `data.status`. Pass an
        `Idempotency-Key` header to make retries safe. Returns `404` when the
        authorization is not found — including authorizations that were not created
        through this API — `409` on an in-flight duplicate key, and `422` when the
        authorization cannot be voided. On success, API-key-authenticated requests
        emit a `payment.voided` webhook.
      tags:
      - Transactions
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transaction:
                  type: object
                  additionalProperties: false
                  properties:
                    metadata:
                      type: object
                      additionalProperties:
                        "$ref": "#/components/schemas/JsonValue"
                      description: Arbitrary merchant key/value pairs to store with the void transaction.
            examples:
              void:
                summary: Void an authorization
                value: {}
      responses:
        '200':
          description: Void completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionDataResponse"
          headers:
            X-Idempotent-Replayed:
              description: Present and `true` when this response is a cached
                replay of an earlier request with the same Idempotency-Key.
              schema:
                type: string
                enum:
                - 'true'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/api/payment/v2026-04/transactions/{id}/credit":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: Transaction slug (transaction to refund)
    post:
      operationId: creditTransaction
      summary: Credit/refund a transaction
      description: |
        Refunds a prior transaction. Send `amount_cents` for a partial refund; omit
        it to refund the full amount. Partial refunds accumulate in the source
        transaction's `credited_amount_cents`. Creates a `refund` transaction linked
        via `parent_transaction_id` and returns it with `201`; read the refund
        outcome from `data.status`. The refundable balance is not pre-checked: an
        over-refund is submitted to the provider and typically comes back as a `201`
        with `data.status: declined` or `error`. Pass an `Idempotency-Key` header to
        make retries safe. Returns `404` when the transaction is not found —
        including transactions that were not created through this API — `409` on an
        in-flight duplicate key, and `422` when the request fails validation (for
        example `amount_cents: 0`). On success, API-key-authenticated requests emit
        a `payment.refunded` webhook.
      tags:
      - Transactions
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transaction:
                  type: object
                  additionalProperties: false
                  properties:
                    amount_cents:
                      type: integer
                      minimum: 1
                      description: Partial refund amount in the source transaction's
                        currency smallest unit (defaults to the full transaction amount)
                    metadata:
                      type: object
                      additionalProperties:
                        "$ref": "#/components/schemas/JsonValue"
            examples:
              full_refund:
                summary: Refund the full transaction amount
                value: {}
              partial_refund:
                summary: Partial refund of $10.00
                value:
                  transaction:
                    amount_cents: 1000
      responses:
        '201':
          description: Credit created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionDataResponse"
              examples:
                refund:
                  summary: Partial refund recorded as a `refund` transaction
                  value:
                    data:
                      id: fpi_01hxyzjkl012
                      gateway_id: stripe-usd
                      payment_method_id: 018f2c1a-9c4b-7e6d-9f10-3b4c5d6e7f80
                      card_network: visa
                      parent_transaction_id: fpi_01hxyzabc123
                      action: refund
                      status: success
                      amount_cents: 1000
                      currency_code: USD
                      payment_source: CreditCard
                      gateway_transaction_id: re_3PQr7s2eZvKYlo2C
                      reference_token: null
                      description: null
                      processing_fee_cents: 0
                      platform_fee_cents: 0
                      credited_amount_cents: 0
                      retain_on_success: false
                      metadata: {}
                      created_at: '2026-04-03T15:45:00Z'
                      updated_at: '2026-04-03T15:45:00Z'
                    meta:
                      request_id: 018f2c1a-8b3a-7e6d-9f10-2a3b4c5d6e7f
                      timestamp: '2026-04-03T15:45:00Z'
          headers:
            X-Idempotent-Replayed:
              description: Present and `true` when this response is a cached
                replay of an earlier request with the same Idempotency-Key.
              schema:
                type: string
                enum:
                - 'true'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          "$ref": "#/components/responses/Conflict"
        '422':
          "$ref": "#/components/responses/UnprocessableEntity"
  "/api/payment/v2026-04/merchants/{merchant_id}/configuration":
    parameters:
    - name: merchant_id
      in: path
      required: true
      schema:
        type: integer
      description: |
        Company ID of the merchant. The lookup resolves by company ID only — the
        payments-merchant row ID is not accepted, so a merchant whose row ID differs
        from its company ID returns `404` when addressed by row ID.
    get:
      operationId: showMerchantConfiguration
      summary: Get merchant payment configuration
      description: Root-admin-only. Returns VGS, Kount, 3DS acquirer, payout, and
        platform-fee settings for a merchant. Secret fields are obfuscated.
      tags:
      - Merchant Configuration
      responses:
        '200':
          description: Merchant payment configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantConfigurationResponse"
              examples:
                configuration:
                  summary: Merchant on Fluid's portfolio Kount account
                  value:
                    data:
                      vgs_client_id: ACt7mrewpsQ8cnrKX9wDCLwM
                      vgs_client_secret: 1a2b********9z
                      vgs_environment: live
                      kount_enterprise: false
                      kount_api_key: null
                      kount_environment: production
                      kount_client_id: null
                      kount_channel_prefix: acme
                      kount_webhook_signing_key: null
                      kount_accounts:
                      - environment: production
                        enterprise: false
                        channel_prefix: acme
                        api_key: null
                        client_id: null
                        webhook_signing_key: null
                      network_tokens_enabled: true
                      vgs_cmp_vault_id: tntabc12345
                      vgs_proxy_username: USfoobar
                      vgs_proxy_password: ab12********cd
                      network_3ds_setting:
                        visa_acquirer_bin: '400551'
                        visa_acquirer_merchant_id: '123456789012345'
                      payouts_settings:
                        payout_collection_enabled: true
                        payout_collection_schedule: daily
                        minimum_payout_amount: 25
                        last_payout_collection_at: '2026-04-01T06:00:00Z'
                      platform_fee_rate: 1.9
                      platform_fee_fixed: 0.35
                    meta:
                      request_id: 018f2c1a-8b3a-7e6d-9f10-2a3b4c5d6e7f
                      timestamp: '2026-04-01T12:00:00Z'
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: updateMerchantConfiguration
      summary: Update merchant payment configuration
      description: Root-admin-only. Updates VGS, Kount, 3DS acquirer, payout,
        and/or platform-fee settings. Obfuscated secret values (containing
        "********") are silently skipped to prevent overwriting real secrets.
        3DS acquirer fields are merged into the network_3ds_setting JSONB.
        Payout fields are merged into payouts_settings JSONB.
      tags:
      - Merchant Configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - configuration
              properties:
                configuration:
                  "$ref": "#/components/schemas/MerchantConfigurationUpdateRequest"
            examples:
              vgs:
                summary: Rotate VGS environment and enable network tokens
                value:
                  configuration:
                    vgs_environment: sandbox
                    network_tokens_enabled: true
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MerchantConfigurationResponse"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        # 422 stays inline: render_error_result returns { status, errors, meta },
        # which differs from the Action-pattern ErrorResponse shape
        # ({ error_message, errors, meta }) referenced by the shared
        # UnprocessableEntity response.
        '422':
          description: Validation error (field-level errors returned)
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - errors
                - meta
                properties:
                  status:
                    type: string
                    enum:
                    - error
                  errors:
                    "$ref": "#/components/schemas/ErrorBag"
                    description: Field-level error messages
                  meta:
                    "$ref": "#/components/schemas/Meta"
webhooks:
  payment.completed:
    post:
      operationId: webhookPaymentCompleted
      summary: payment.completed
      description: |
        Sent when a purchase or authorization created through this API
        succeeds. Delivered as an HTTP POST to the merchant's configured
        webhook URL with `X-Fluid-Event: payment.completed` and an
        `X-Fluid-Signature` header carrying the hex HMAC-SHA256 of the raw
        body, keyed with the merchant's webhook secret. Verify the signature
        with a constant-time comparison before trusting the payload.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
            examples:
              completed:
                summary: Successful purchase
                value:
                  event: payment.completed
                  created_at: '2026-04-01T12:00:01Z'
                  data:
                    id: fpi_01hxyzabc123
                    action: purchase
                    status: success
                    amount_cents: 4999
                    currency_code: USD
                    gateway_transaction_id: ch_3PQr7s2eZvKYlo2C
                    gateway_id: stripe-usd
                    parent_transaction_id: null
                    metadata: {}
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
  payment.captured:
    post:
      operationId: webhookPaymentCaptured
      summary: payment.captured
      description: |
        Sent when a capture created through this API succeeds. Same delivery,
        signature, and retry contract as `payment.completed`.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
  payment.voided:
    post:
      operationId: webhookPaymentVoided
      summary: payment.voided
      description: |
        Sent when a void created through this API succeeds. Same delivery,
        signature, and retry contract as `payment.completed`.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
  payment.refunded:
    post:
      operationId: webhookPaymentRefunded
      summary: payment.refunded
      description: |
        Sent when a refund created through this API succeeds (full or
        partial). Same delivery, signature, and retry contract as
        `payment.completed`.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
  payment.declined:
    post:
      operationId: webhookPaymentDeclined
      summary: payment.declined
      description: |
        Sent when the provider declines a purchase, authorization, capture,
        void, or refund created through this API. The declined transaction is
        in `data` with `status: declined`. Same delivery, signature, and retry
        contract as `payment.completed`.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
  payment.error:
    post:
      operationId: webhookPaymentError
      summary: payment.error
      description: |
        Sent when a purchase, authorization, capture, void, or refund created
        through this API fails with a processing error (gateway timeout,
        network failure). The transaction is in `data` with `status: error`.
        Same delivery, signature, and retry contract as `payment.completed`.
      tags:
      - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaymentWebhookEvent"
      responses:
        '200':
          "$ref": "#/components/responses/WebhookAck"
