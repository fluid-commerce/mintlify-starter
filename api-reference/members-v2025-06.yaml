  /api/v2025-06/members/{member_id}/payment_methods:
    get:
      operationId: admin_v2025_06_member_payment_methods
      summary: List a member's payment methods
      description: Returns owner-stamped saved cards plus reusable cards vaulted at this company on
        the member's linked wallet. The company-wallet arm is enabled by default and is omitted for
        isolated-payment-token companies. Card sources only - non-card displayable sources such as
        PayPal are excluded, because this view reports every row it renders as a credit card with
        card-shaped details. Non-card methods remain visible on the member detail embed, which reports
        source and no card-shaped fields.
      tags:
      - members
      security:
      - bearer_auth: []
      parameters:
      - name: member_id
        in: path
        required: true
        description: The member's native UUID or legacy_user_company_id.
        schema:
          type: string
      - name: country_code
        in: query
        required: false
        description: ISO country code used to resolve whether each card requires 3DS. Without it,
          details.requires_3ds is false for every row.
        schema:
          type: string
      responses:
        '200':
          description: The member's company-wallet payment method listing.
          content:
            application/json:
              schema:
                type: object
                required:
                - payment_methods
                - status
                - meta
                properties:
                  payment_methods:
                    type: array
                    items:
                      $ref: '#/components/schemas/MemberPaymentMethod'
                  status:
                    type: integer
                    enum:
                    - 200
                  meta:
                    $ref: '#/components/schemas/Meta'
                additionalProperties: false
              example:
                payment_methods:
                - id: 73318
                  source: card
                  created_at: '2026-09-03T18:40:22Z'
                  updated_at: '2026-09-03T18:40:22Z'
                  payment_title: Credit Card
                  au_status: null
                  default: true
                  payment_type: Credit Card
                  details:
                    id: 73318
                    type: CreditCard
                    card_network: visa
                    card_brand: Visa
                    last4_digits: '4242'
                    last_four: '4242'
                    exp_month: 11
                    exp_year: 2029
                    logo_url: https://assets.fluid.app/images/payment_icons/visa.svg
                    vgs_card_id: null
                    requires_3ds: false
                  billing_address: null
                status: 200
                meta:
                  request_id: b7e2c4d1-3f5a-4e8b-9c2d-6a1f0e3b5d47
                  timestamp: '2026-09-30T14:22:07Z'
        '401':
          description: No valid bearer token was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '403':
          description: The caller is not a company admin with payment_methods.view permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '404':
          description: No kept member matches member_id for the current company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
  /api/v2025-06/members/{member_id}/genealogy:
    get:
      operationId: admin_v2025_06_member_genealogy
      summary: Get a member's sponsor genealogy
      description: 'Returns the sponsor tree rooted at this member. A company admin may read any member;
        a rep may read their own genealogy or one rooted at a member inside their own downline.

        '
      tags:
      - members
      security:
      - bearer_auth: []
      parameters:
      - name: member_id
        in: path
        required: true
        description: The member's native UUID or legacy_user_company_id.
        schema:
          type: string
      - name: levels
        in: query
        required: false
        description: Downline depth to return. Values outside 1–5 are clamped rather than rejected, and
          a non-integer falls back to 1.
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - genealogy
                - status
                - meta
