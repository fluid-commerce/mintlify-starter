  "/api/company/fluid_os/definitions/{id}/git_credential":
    post:
      summary: Mint a short-lived git credential for the portal definition repo
      tags:
      - fluid-os---definitions
      operationId: fluid_os_v0_definition_git_credential_create
      security:
      - bearer_auth: []
      description: |
        Returns an HTTPS clone URL with a fresh installation token from the
        Fluid GitHub App embedded as the password. The CLI uses it
        transparently — no `gh`, no PAT, no SSH key.

        Valid for ~1 hour (GitHub installation token TTL); re-mint on each
        operation.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Definition ID
      responses:
        '201':
          description: Credential issued
          content:
            application/json:
              schema:
                type: object
                required:
                - git_credential
                properties:
                  git_credential:
                    "$ref": "#/components/schemas/GitCredential"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Definition not found or not owned by this company
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: Repo not yet provisioned or connected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '502':
          description: GitHub provider error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
