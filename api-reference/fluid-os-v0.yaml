          type: integer
        description: Number of items per page
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FluidOSDefinitionListResponse"
        '422':
          description: Unprocessable entity (validation failed)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Unauthorized
