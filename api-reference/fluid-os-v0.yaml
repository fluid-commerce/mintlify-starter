  "/api/company/fluid_os/widget_package_versions/{version}/complete_upload":
    post:
      summary: Complete a Fluid OS widget package upload
      tags:
      - fluid-os---widget-package-versions
      operationId: fluid_os_v0_complete_widget_package_version_upload
      security:
      - bearer_auth: []
      description: Verify uploaded artifacts for a company-owned Fluid OS widget package
        version and approve the version when verification succeeds. Uploaded
        manifest.json is verified for matching packageId, matching version, and
        valid company-owned `company.<package_key>.` widget type prefixes.
      parameters:
      - name: version
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          pattern: '^(?!\.\.?$)[A-Za-z0-9._~-]+$'
        description: Non-empty, object-path-safe widget package version identifier
          to verify. Dotted versions such as 1.0.0 are accepted; only exact . or
          .. path segments and characters outside [A-Za-z0-9._~-] are rejected.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FluidOSWidgetPackageVersionCompleteUploadResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: Widget package or version not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Validation or verification failed
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/FluidOSWidgetPackageVersionVerificationErrorResponse"
                - "$ref": "#/components/schemas/StandardErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FluidOSWidgetPackageVersionCompleteUploadRequest"
              description: Request payload
        required: false
