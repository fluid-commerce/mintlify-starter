paths:
  "/api/companies/set_bundle_subscriptions":
    post:
      summary: Set the bundle subscriptions setting for a company
      tags:
      - companies
      operationId: onboarding_v0_set_company_bundle_subscriptions
      security:
      - bearer_auth: []
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '200':
          description: bundle subscriptions setting updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - success
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetCompanyBundleSubscriptionsRequestBodyApplicationJsonSchema"
  "/api/companies/set_shipping":
    post:
      summary: Set the shipping method for a company
      tags:
      - companies
      operationId: onboarding_v0_set_shipping_method
      security:
      - bearer_auth: []
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '200':
          description: shipping method updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  company:
                    "$ref": "#/components/schemas/OnboardingCompany"
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - company
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetShippingMethodRequestBodyApplicationJsonSchema"
  "/api/companies/set_tax_class":
    patch:
      summary: Set the tax class for a company
      tags:
      - companies
      operationId: onboarding_v0_set_company_tax_class
      security:
      - bearer_auth: []
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '422':
          description: Invalid tax class or missing provider configuration
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '200':
          description: tax class updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - success
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetCompanyTaxClassRequestBodyApplicationJsonSchema"
  "/api/companies/set_tax_option":
    patch:
      summary: Set the tax option for a company
      tags:
      - companies
      operationId: onboarding_v0_set_company_tax_option
      security:
      - bearer_auth: []
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '200':
          description: tax option updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - success
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetCompanyTaxOptionRequestBodyApplicationJsonSchema"
  "/api/companies/{company_id}/bank_accounts":
    get:
      summary: List company bank accounts
      tags:
      - bank-accounts
      operationId: onboarding_v0_list_company_bank_accounts
      security:
      - bearer_auth: []
      parameters:
      - name: company_id
        in: path
        required: true
        example: 1
        schema:
          type: integer
      responses:
        '401':
          description: unauthorized - company access denied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '200':
          description: bank accounts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  bank_accounts:
                    type: array
                    items:
                      "$ref": "#/components/schemas/JsonValue"
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - bank_accounts
    post:
      summary: Create company bank account
      tags:
      - bank-accounts
      operationId: onboarding_v0_create_company_bank_account
      security:
      - bearer_auth: []
      parameters:
      - name: company_id
        in: path
        required: true
        example: 1
        schema:
          type: integer
      responses:
        '401':
          description: unauthorized - company access denied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '201':
          description: bank account created
          content:
            application/json:
              schema:
                type: object
