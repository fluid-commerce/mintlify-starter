---
openapi: 3.1.0
info:
  title: Fluid Onboarding API
  version: v0
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
- url: https://{company}.fluid.app
  description: Production server with company subdomain
  variables:
    company:
      default: myco
      description: Company subdomain
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    SetCompanyBundleSubscriptionsRequestBodyApplicationJsonSchema:
      type: object
      required:
      - bundle_subscriptions
      properties:
        bundle_subscriptions:
          type: boolean
          description: Enable or disable bundle subscriptions for the company.
    SetShippingMethodRequestBodyApplicationJsonSchema:
      type: object
      required:
      - settings
      properties:
        settings:
          type: object
          properties:
            shipping:
              type: string
              enum:
              - manual
              - country
              - droplet
              - fluid-rates
              description: Shipping calculation mode
            allow_free_shipping:
              type: boolean
              description: Allow free shipping
    SetCompanyTaxClassRequestBodyApplicationJsonSchema:
      type: object
      required:
      - tax_class
      properties:
        tax_class:
          type: string
          enum:
          - fluid
          - custom
          - droplet
          - avalara
          - tax_free
          - per_country
          description: Choose service class to be used for taxation.
    SetCompanyTaxOptionRequestBodyApplicationJsonSchema:
      type: object
      required:
      - tax_option
      properties:
        tax_option:
          type: string
          description: Choose service for taxation.
    RefreshOnboardingUrlRequestBodyApplicationJsonSchema:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
    UploadOnboardingDocumentRequestBody:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: Document file to upload.
    CreateCompanyOwnerRequestBodyApplicationJsonSchema:
      type: object
      required:
      - owner
      - company_id
      properties:
        owner:
          "$ref": "#/components/schemas/OnboardingCompanyOwnerCreateRequest"
        company_id:
          type: integer
    UpdateCompanyOwnerRequestBodyApplicationJsonSchema:
      type: object
      required:
      - owner
      - company_id
      - id
      properties:
        owner:
          "$ref": "#/components/schemas/OnboardingCompanyOwnerRequest"
        company_id:
          type: integer
        id:
          type: integer
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/OnboardingMeta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardUnauthorizedResponse:
      description: Common legacy unauthorized response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    OnboardingCreateCompanyEntityRequest:
      description: Entity attributes accepted when creating one. `archived` is
        absent on purpose - an entity is retired through an update, once nothing
        live references it, so it cannot be created already retired.
      allOf:
      - "$ref": "#/components/schemas/OnboardingCompanyEntityRequest"
      - type: object
        properties:
          status:
            description: Lifecycle state to open the entity in. Omit it to open
              the entity in the default, `inactive`; a null is refused with 422
              rather than read as the default.
            type: string
            enum:
            - draft
            - active
            - inactive
    OnboardingUpdateCompanyEntityRequest:
      description: Entity attributes accepted when updating one. `draft` and
        `archived` both take the entity out of service and run the same
        reference guards, so either one is refused with 422 while the entity is
        still the company default, still holds live payment accounts, or still
        has countries assigned.
      allOf:
      - "$ref": "#/components/schemas/OnboardingCompanyEntityRequest"
      - type: object
        properties:
          status:
            description: Lifecycle state to move the entity into. Omit it to
              leave the entity where it is; a null is refused with 422 rather
              than read as no change.
            type: string
            enum:
            - draft
            - active
            - inactive
            - archived
