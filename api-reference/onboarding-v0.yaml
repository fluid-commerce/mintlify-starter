      - name: company_id
        in: path
        required: true
        example: 1
        schema:
          type: integer
      - name: id
        in: path
        required: true
        example: 1
        schema:
          type: integer
      responses:
        '401':
          description: unauthorized - company access denied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '204':
          description: entity deleted successfully
        '422':
          description: entity is still in use - it is the default entity, has
            live payment accounts, or has countries assigned to it, and those
            references must be moved before it can be deleted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
