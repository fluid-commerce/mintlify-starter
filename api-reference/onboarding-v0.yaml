        '401':
          description: unauthorized - company access denied
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '200':
          description: entity updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  entity:
                    "$ref": "#/components/schemas/OnboardingCompanyEntity"
                  meta:
                    "$ref": "#/components/schemas/OnboardingMeta"
                required:
                - entity
        '422':
          description: entity could not be updated - either the attributes are
            invalid, or the update takes the entity out of service while
            something live still references it. Both `archived` and `draft` are
            out of service and run the same guards, so either one is refused
            while the entity is still the company default, still has live
            payment accounts, or still has countries assigned to it, and those
            references must be moved first. A request naming the status the
            entity already holds is not an error - the retirement has nothing
            to do, and the rest of the payload is saved - so a client that
            round-trips the resource it just read is answered 200
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateCompanyEntityRequestBodyApplicationJsonSchema"
              description: Request payload
