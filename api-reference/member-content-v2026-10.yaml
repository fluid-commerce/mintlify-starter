  /api/member/v2026-10/search:
    get:
      operationId: member_search_index
      tags:
        - search
      summary: Search the storefront catalogue
      description: >-
        Returns ranked hits across the company's public products, enrollment packs, pages, media, playlists and
        posts: only what the public storefront lists. Facets count the matching results of each requested
        type. Available to every membership, limited to 30 searches per minute per credential. Responses are
        never stored.
      parameters:
        - name: q
          in: query
          required: true
          description: Search text, 2 to 200 characters.
          schema:
            type: string
            minLength: 2
            maxLength: 200
        - name: types
          in: query
          description: >-
            Comma-separated types to search: products, enrollment-packs, pages, media, playlists or posts. All
            six by default.
          schema:
            type: string
            maxLength: 200
            example: products,media
        - name: page[cursor]
          in: query
          description: >-
            Opaque cursor from meta.pagination.next_cursor. Expires after one hour and only continues the same
            query and types. A catalogue reindex between pages invalidates it with a 400; repeat the search
            without a cursor.
          schema:
            type: string
        - name: page[limit]
          in: query
          description: Maximum number of hits returned.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
      responses:
        '200':
          description: A page of hits.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEnvelope'
              example:
                status: 200
                data:
                  - kind: products
                    id: 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f61
                    title: Primex Wellness Kit
                    image_url: https://ik.imagekit.io/fluid/primex/wellness-kit.jpg
                    url: https://primex.fluid.app/home/products/primex-wellness-kit
                    share_url: https://primex.fluid.app/riley-kim/products/primex-wellness-kit
                    snippet: Everything you need for a 30-day wellness reset.
                    score: 12.4
                meta:
                  request_uuid: 0199a3f2-7a10-7c3e-8f21-4d5e6f708192
                  timestamp: '2026-09-30T18:24:05Z'
                  facets:
                    products: 1
                    media: 0
                  pagination:
                    next_cursor: null
        '400':
          description: >-
            Malformed, tampered or expired pagination cursor, or one from before a catalogue reindex. Repeat the
            search without a cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          description: >-
            The credential has searched more than 30 times in the current minute. Wait `retry_after` seconds
            before searching again. Unlike other responses it carries no Cache-Control header.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
              example:
                error: Rate limit exceeded
                message: Too many requests. Please wait before trying again.
                retry_after: 42
        '503':
          description: Search is unavailable; retry shortly.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: 503
                error:
                  message: Search is unavailable; retry shortly
                  details:
                    error: unavailable
                meta:
                  request_uuid: 0199a3f2-7a10-7c3e-8f21-4d5e6f708193
                  timestamp: '2026-09-30T18:24:06Z'
      x-fluid-audience: member
  /api/member/v2026-10/media/uploads:
    post:
      operationId: member_media_uploads_create
      tags:
        - media-uploads
      summary: Sign a direct upload
      description: >-
        Signs an upload of one image, video, PDF or presentation to a path in the member's own storage
        namespace and records its receipt. The signature expires after 15 minutes. Declared sizes over the
        type's limit (images 10 MB, videos 100 MB, documents 25 MB) are refused. Responses are never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The file about to be uploaded.
              additionalProperties: false
              required:
                - content_type
                - filename
              properties:
                content_type:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^\u0000]*[^\u0000\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\u0000]*$'
                  description: MIME type of the file, containing at least one non-whitespace character and no NUL.
                filename:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^\u0000]*[^\u0000\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\u0000]*$'
                  description: >-
                    Original file name, containing at least one non-whitespace character and no NUL; it is sanitized and
                    prefixed to keep paths unique.
                byte_size:
                  type: integer
                  minimum: 1
                  description: Size in bytes. When given, the stored file must match it exactly.
            example:
              content_type: video/mp4
              filename: morning-routine.mp4
              byte_size: 48213000
      responses:
        '201':
          description: The signed upload.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEnvelope'
              example:
                status: 201
                data:
                  upload_id: 0199a3f2-5b0d-7c3a-8f09-2a1b0c9d8e7f
                  url: https://upload.imagekit.io/api/v2/files/upload
                  fields:
