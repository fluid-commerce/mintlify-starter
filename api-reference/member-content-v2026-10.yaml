  /api/member/v2026-10/playlists/{id}/items/reorder:
    parameters:
      - name: id
        in: path
        required: true
        description: Public id of a playlist the signed-in member owns.
        schema:
          type: string
          format: uuid
    patch:
      operationId: member_playlist_items_reorder
      tags:
        - playlist-items
      summary: Reorder a playlist
      description: >-
        Replaces the order of every item at once. `ids` must name each of the playlist's items exactly once; the whole order
        applies or nothing does. Requests support at most 1,000 items; larger playlists cannot be reordered through this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The complete new order.
              additionalProperties: false
              required:
                - ids
              properties:
                ids:
                  type: array
                  description: Every item id, in the new order.
                  maxItems: 1000
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
            example:
              ids:
                - 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f61
                - 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f60
      responses:
        '200':
          description: Every item in its new order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReorderedItemsEnvelope'
              example:
                status: 200
