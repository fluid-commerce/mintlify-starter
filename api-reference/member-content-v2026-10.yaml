      description: >-
        Returns a tracked link for a target the member may share: their own media or shared playlists, or the
        company's public catalogue. Repeating the same target, channel and recipient returns the existing share
        with 200 instead of creating another. Nothing is sent: the member's client delivers the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: What to share, how, and to whom.
              additionalProperties: false
              required:
                - target
              properties:
                target:
                  type: object
                  description: What to share.
                  additionalProperties: false
                  required:
                    - kind
                    - id
                  properties:
                    kind:
                      type: string
                      description: Target kind.
                      enum:
                        - media
                        - playlist
                        - product
                        - enrollment_pack
                        - page
                    id:
                      type: string
                      format: uuid
                      description: Public id of the target.
                channel:
                  type: string
                  description: Where the member is sharing it (default link).
                  enum:
                    - link
                    - email
                    - sms
                    - whatsapp
                    - facebook
                    - x
                    - qr
                recipient:
                  type: object
                  description: One of the member's contacts.
                  additionalProperties: false
                  required:
                    - contact_id
                  properties:
                    contact_id:
                      type: string
                      format: uuid
                      description: Public contact id.
            example:
              target:
                kind: product
                id: 0199a3f2-5c1e-7d4b-9a10-3b2c1d4e5f60
              channel: sms
      responses:
        '200':
          description: The existing share for this target, channel and recipient.
          content:
