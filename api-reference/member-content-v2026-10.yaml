    post:
      operationId: member_media_create
      tags:
        - media
      summary: Create a medium from an upload
      description: >-
        Verifies the object stored for the upload (at exactly its signed path, of the signed kind, and
        within the size limits) and creates the member's medium, consuming the upload. The kind is the
        category and media kind of the signed type: an image signed as image/png accepts a stored
        image/jpeg, while a video or a document in its place is refused. An upload is used once: a repeat
        returns 409, and `error.details.media_id` names the medium the first use created while that medium
        still exists (after it is deleted the details carry `upload_id` alone). Unknown, another member's,
        expired and unverifiable uploads return 422 and stay unconsumed. Tags must be existing company
        medium tags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The upload to consume and the medium's details.
              additionalProperties: false
              required:
                - upload_id
                - title
              properties:
                upload_id:
                  type: string
                  format: uuid
                  description: The upload_id from POST /media/uploads.
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                  pattern: '^[^\u0000]*[^\u0000\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000][^\u0000]*$'
                  description: Title containing at least one non-whitespace character.
                description:
                  type:
                    - string
                    - 'null'
                  maxLength: 5000
                  pattern: '^[^\u0000]*$'
                  description: Plain-text description.
                tags:
                  type: array
                  description: Names of existing company medium tags.
                  items:
                    type: string
                    maxLength: 255
                    pattern: '^[^\u0000]*$'
            example:
              upload_id: 0199a3f2-5b0d-7c3a-8f09-2a1b0c9d8e7f
              title: Morning routine
              description: How I start my day with the wellness kit.
              tags:
