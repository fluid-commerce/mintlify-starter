openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Content
  description: >-
    The signed-in member's own media and playlists: list, read, write, and delete, including direct
    media uploads and media creation. The bearer credential determines the member and company; no path,
    query or body parameter can change either. Only rep-eligible memberships may use these endpoints;
    other memberships receive 403. Foreign, deleted, and malformed identifiers return 404. Playlist items
    are separate operations outside this contract. Upload bytes never pass through this API:
    `POST /media/uploads` signs a direct upload bound to one path in the member's own storage namespace,
    the client posts the file to the returned URL with the returned fields, and `POST /media` then
    verifies the stored object and creates the medium, consuming the upload once.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
  - MemberBearer: []
servers:
  - url: https://api.fluid.app
    description: Production API server
  - url: https://api.fluid.test
    description: Local development server
tags:
  - name: media
    description: The signed-in member's own uploaded media.
    x-fluid-section: Members
  - name: playlists
    description: Ordered collections of media the member assembles to share.
    x-fluid-section: Members
  - name: shares
    description: Tracked links the member created, and what happened to them.
    x-fluid-section: Members
  - name: playlist-items
    description: Items and ordering in a member-owned playlist.
    x-fluid-section: Members
  - name: search
    description: Ranked search across the company's public storefront catalogue.
    x-fluid-section: Members
  - name: media-uploads
    description: Signed direct uploads that become the member's media.
    x-fluid-section: Members
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or an opaque member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it
        is unchanged.
      schema:
        type: string
    RateLimitLimit:
      description: Searches allowed per minute for this credential.
      schema:
        type: string
        example: '30'
    RateLimitRemaining:
      description: Searches left in the current minute; always 0 on a refused request.
      schema:
        type: string
        example: '0'
    RateLimitReset:
      description: When the current minute ends and the credential's search budget is restored, as a UTC timestamp.
      schema:
        type: string
        example: 2026-09-30 18:25:00 UTC
    CacheControl:
      description: >-
        Standard HTTP Cache-Control directive. Private for member reads; no-store for search and uploads. Media
        reads send max-age=0, so a client revalidates with If-None-Match on every use.
      schema:
        type: string
        example: max-age=0, private
  parameters:
    MediumId:
      name: id
      in: path
      required: true
      description: Public id of a medium the signed-in member owns.
      schema:
        type: string
        format: uuid
    PlaylistId:
      name: id
      in: path
      required: true
      description: Public id of a playlist the signed-in member owns.
      schema:
        type: string
        format: uuid
    PageCursor:
      name: page[cursor]
      in: query
      description: Opaque cursor from meta.pagination.next_cursor. Expires after three days.
      schema:
        type: string
    PageLimit:
      name: page[limit]
      in: query
      description: Maximum number of items returned.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    NotModified:
      description: The member's representation matches If-None-Match.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    BadCursor:
      description: Malformed, tampered or expired pagination cursor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or unusable member credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The membership cannot share content, or the credential is read-only and the request writes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Missing identifier, malformed identifier, or a resource outside the member's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Invalid:
      description: Unsupported parameter, invalid value, or a validation failure, with field-keyed details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: The JSON request body is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UploadUnavailable:
      description: Upload storage is unavailable or could not be asked; retry later. An upload is never consumed by this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
        - request_uuid
        - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          description: The error message and field-keyed details.
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Field-keyed error details.
              additionalProperties: true
          required:
            - message
            - details
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - error
        - meta
    RateLimitError:
      type: object
      description: >-
        The rate limiter's refusal. It is sent before the request reaches the API, so it has no status, error
        or meta envelope.
      properties:
        error:
          type: string
          description: Always `Rate limit exceeded`.
          example: Rate limit exceeded
        message:
          type: string
          description: Human-readable explanation.
          example: Too many requests. Please wait before trying again.
        retry_after:
          type: integer
          minimum: 1
          description: Seconds until the credential's search budget is restored.
          example: 42
      required:
        - error
        - message
        - retry_after
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
            - string
            - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
        - next_cursor
    PageMeta:
      description: Envelope metadata with the list's pagination state.
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
          required:
            - pagination
    Medium:
      type: object
      description: A medium the signed-in member uploaded.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public medium id.
        kind:
          type: string
          description: What the medium is. Documents are PDFs and presentations.
          enum:
            - image
            - video
            - document
            - link
        title:
          type:
            - string
            - 'null'
          description: Title.
        description:
          type:
            - string
            - 'null'
          description: Plain-text description.
        tags:
          type: array
          description: Names of the company medium tags assigned to it.
          items:
            type: string
        url:
          type:
            - string
            - 'null'
          description: Delivery URL of the media file (or the destination of a link).
        thumbnail_url:
          type:
            - string
            - 'null'
          description: Thumbnail or image URL.
        duration:
          type:
            - integer
            - 'null'
          description: Video length in seconds, once known.
        size_bytes:
          type:
            - integer
            - 'null'
          description: Stored size in bytes, recorded for media created from a verified upload.
        status:
          type: string
          description: processing while a video's length and thumbnail are still being extracted, otherwise ready.
          enum:
            - processing
            - ready
        share_url:
          type:
            - string
            - 'null'
          description: The member's untracked storefront link, crediting their username; null without a username.
        created_at:
          type: string
          format: date-time
          description: When it was created.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
      required:
        - id
        - kind
        - title
        - description
        - tags
        - url
        - thumbnail_url
        - duration
        - size_bytes
        - status
        - share_url
        - created_at
        - updated_at
    MediumEnvelope:
      type: object
      description: One medium.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/Medium'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    MediaEnvelope:
      type: object
      description: A page of media.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's media, newest first.
          items:
            $ref: '#/components/schemas/Medium'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    Playlist:
      type: object
      description: A playlist the signed-in member owns.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public playlist id.
        title:
          type:
            - string
            - 'null'
          description: Title.
        description:
          type:
            - string
            - 'null'
          description: Description.
        cover_url:
          type:
            - string
            - 'null'
          description: The playlist's cover image, or the image of its first medium that has one.
        items_count:
          type: integer
          description: Number of items in the playlist.
        visibility:
          type: string
          description: >-
            shared playlists are published on the storefront and can be shared. private playlists are
            unlisted: they are omitted from the storefront catalogue and search, and the Member API does
            not generate a share URL for them. Existing public direct links continue to work, matching
            legacy playlist behavior; private does not restrict direct-link access.
          enum:
            - private
            - shared
        share_url:
          type:
            - string
            - 'null'
          description: The member's untracked storefront link; null while private or without a username.
        created_at:
          type: string
          format: date-time
          description: When it was created.
        updated_at:
          type: string
          format: date-time
          description: When it last changed.
      required:
        - id
        - title
        - description
        - cover_url
        - items_count
        - visibility
        - share_url
        - created_at
        - updated_at
    PlaylistEnvelope:
      type: object
      description: One playlist.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/Playlist'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    PlaylistsEnvelope:
      type: object
      description: A page of playlists.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's playlists, newest first.
          items:
            $ref: '#/components/schemas/Playlist'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    ShareTarget:
      type:
        - object
        - 'null'
      description: >-
        Current summary of the shared target, or null if it no longer exists or is no longer readable by this
        member. Owned private kept playlists remain readable in history, although creating a new playlist share
        requires shared visibility.
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Target kind.
          enum:
            - media
            - playlist
            - product
            - enrollment_pack
            - page
        id:
          type: string
          format: uuid
          description: Public id of the target.
        title:
          type:
            - string
            - 'null'
          description: Target title.
        image_url:
          type:
            - string
            - 'null'
          description: Target image, when it stores one.
      required:
        - kind
        - id
        - title
        - image_url
    Share:
      type: object
      description: A tracked link the member created.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public share id.
        target:
          $ref: '#/components/schemas/ShareTarget'
        channel:
          type: string
          description: Client-provided channel recorded when this share was created. It does not verify delivery or change when legacy APIs reuse the link. Shares made before this API read as link.
          enum:
            - link
            - email
            - sms
            - whatsapp
            - facebook
            - x
            - qr
        recipient:
          type:
            - object
            - 'null'
          description: >-
            The current identity of the member's kept contact it was shared with; null if no recipient was
            recorded or the contact is no longer owned in this company.
          additionalProperties: false
          properties:
            contact_id:
              type: string
              format: uuid
              description: Public contact id.
            name:
              type:
                - string
                - 'null'
              description: Contact name.
          required:
            - contact_id
            - name
        url:
          type: string
          format: uri
          description: The tracked link to hand out.
        opens_count:
          type: integer
          description: How many times the tracked link has been opened.
        last_opened_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the link last led to a recorded storefront visit.
        created_at:
          type: string
          format: date-time
          description: When it was created.
      required:
        - id
        - target
        - channel
        - recipient
        - url
        - opens_count
        - last_opened_at
        - created_at
    ShareFields:
      description: The share fields shared by list and detail.
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Public share id.
        target:
          $ref: '#/components/schemas/ShareTarget'
        channel:
          $ref: '#/components/schemas/Share/properties/channel'
        recipient:
          $ref: '#/components/schemas/Share/properties/recipient'
        url:
          type: string
          format: uri
          description: The tracked link to hand out.
        opens_count:
          type: integer
          description: How many times the tracked link has been opened.
        last_opened_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the link last led to a recorded storefront visit.
        created_at:
          type: string
          format: date-time
          description: When it was created.
      required:
        - id
        - target
        - channel
        - recipient
        - url
        - opens_count
        - last_opened_at
        - created_at
    ShareDetail:
      description: A tracked link with its recent activity.
      allOf:
        - $ref: '#/components/schemas/ShareFields'
        - type: object
          properties:
            events:
              type: array
              description: 'Activity newest first: when the link was created, and its 50 most recent storefront visits and orders. Creation is not confirmation of delivery; the client delivers the link.'
              items:
                type: object
                description: One event.
                additionalProperties: false
                properties:
                  type:
                    type: string
                    description: What happened.
                    enum:
                      - created
                      - visited
                      - converted
                  occurred_at:
                    type: string
                    format: date-time
                    description: When it happened.
                required:
                  - type
                  - occurred_at
          required:
            - events
    ShareEnvelope:
      type: object
      description: One share.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/Share'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    ShareDetailEnvelope:
      type: object
      description: One share with its activity.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/ShareDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    SharesEnvelope:
      type: object
      description: A page of shares.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's shares, newest first.
          items:
            $ref: '#/components/schemas/Share'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    PlaylistItem:
      type: object
      description: One item of a playlist.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public item id.
        position:
          type:
            - integer
            - 'null'
          description: Position in the playlist, starting at 1; null for historical unpositioned items, including legacy zero or negative stored positions. Items retain their canonical stored order.
        content_kind:
          type: string
          description: >-
            What the item is. Playlists edited elsewhere may also hold products, pages or enrollment packs; those keep their
            place with media null.
          enum:
            - media
            - product
            - page
            - enrollment_pack
            - other
        media:
          description: >-
            Summary of a kept own upload or currently public company catalogue medium. Null for other item kinds or
            unavailable media; the item retains its id and position.
          oneOf:
            - type: object
              description: Medium summary.
              additionalProperties: false
              properties:
                id:
                  type: string
                  format: uuid
                  description: Public medium id.
                kind:
                  type: string
                  description: What the medium is.
                  enum:
                    - image
                    - video
                    - document
                    - link
                title:
                  type:
                    - string
                    - 'null'
                  description: Title.
                thumbnail_url:
                  type:
                    - string
                    - 'null'
                  description: Thumbnail or image URL.
                duration:
                  type:
                    - integer
                    - 'null'
                  description: Video length in seconds, once known.
              required:
                - id
                - kind
                - title
                - thumbnail_url
                - duration
            - type: 'null'
      required:
        - id
        - position
        - content_kind
        - media
    PlaylistItemEnvelope:
      type: object
      description: One playlist item.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/PlaylistItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    PlaylistItemsEnvelope:
      type: object
      description: A page of playlist items, in playlist order.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The page's items.
          items:
            $ref: '#/components/schemas/PlaylistItem'
        meta:
          $ref: '#/components/schemas/PageMeta'
      required:
        - status
        - data
        - meta
    ReorderedItemsEnvelope:
      type: object
      description: Every item of the playlist in its new order.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: The playlist's items, in their new order.
          items:
            $ref: '#/components/schemas/PlaylistItem'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    SearchHit:
      type: object
      description: One ranked catalogue result.
      additionalProperties: false
      properties:
        kind:
          type: string
          description: Catalogue type of the result.
          enum:
            - products
            - enrollment-packs
            - pages
            - media
            - playlists
            - posts
        id:
          type: string
          format: uuid
          description: Public id of the result.
        title:
          type:
            - string
            - 'null'
          description: Title of the result.
        image_url:
          type:
            - string
            - 'null'
          description: Stored image, when the type stores one.
        url:
          type:
            - string
            - 'null'
          description: >-
            Canonical storefront URL, built from the result's slug. An enrollment pack without a slug uses its token
            instead; null when the result has neither.
        share_url:
          type:
            - string
            - 'null'
          description: >-
            The member's untracked storefront link crediting their username, built from the same slug or enrollment
            pack token as url; null without a username, or when the result has neither a slug nor a token.
        snippet:
          type:
            - string
            - 'null'
          description: Plain-text excerpt of the description, up to 200 characters.
        score:
          type:
            - number
            - 'null'
          description: Relevance score; comparable within one response only.
      required:
        - kind
        - id
        - title
        - image_url
        - url
        - share_url
        - snippet
        - score
    SearchMeta:
      description: Envelope metadata with per-type facets and the search cursor.
      allOf:
        - $ref: '#/components/schemas/ResponseMeta'
        - type: object
          properties:
            facets:
              type: object
              description: >-
                Number of matching results of each requested type, counted in the search itself. A result
                changed since it was last indexed can be counted before the index catches up.
              additionalProperties:
                type: integer
            pagination:
              $ref: '#/components/schemas/PaginationMeta'
          required:
            - facets
            - pagination
    SearchEnvelope:
      type: object
      description: One page of search results.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          type: array
          description: Hits, best match first.
          items:
            $ref: '#/components/schemas/SearchHit'
        meta:
          $ref: '#/components/schemas/SearchMeta'
      required:
        - status
        - data
        - meta
    UploadEnvelope:
      type: object
      description: One signed upload.
      properties:
        status:
          type: integer
          description: HTTP response status.
        data:
          $ref: '#/components/schemas/Upload'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - data
        - meta
    Upload:
      type: object
      description: >-
        A signed direct upload. POST the file as multipart form data to `url`, sending every entry of
        `fields` unchanged plus the file as `file`, before `expires_at`. Then create the medium with
        `upload_id`.
      additionalProperties: false
      properties:
        upload_id:
          type: string
          format: uuid
          description: Receipt id; send it to POST /media once the file is stored, or for an image to PATCH /me (`avatar_upload_id`) or PATCH /profile (`photo_upload_id`). It is used once.
        url:
          type: string
          format: uri
          description: Where to post the file.
        fields:
          type: object
          description: Signed form fields to post with the file, unchanged.
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
          description: When the signature expires. POST /media accepts the upload for one hour after this.
      required:
        - upload_id
        - url
        - fields
        - expires_at
paths:
  /api/member/v2026-10/media:
    get:
      operationId: member_media_index
      tags:
        - media
      summary: List the member's media
      description: >-
        Returns the member's own uploads, newest first. Company media the member may share come from the
        public storefront catalogue and search, not from here. Responses are private and must be revalidated.
      parameters:
        - name: filter[kind]
          in: query
          description: Only media of this kind.
          schema:
            type: string
            enum:
              - image
              - video
              - document
              - link
        - name: filter[tag]
          in: query
          description: Only media with this company medium tag.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: filter[q]
          in: query
          description: Only media whose title, in any language, contains this text, case-insensitively.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: A page of the member's media.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaEnvelope'
              example:
