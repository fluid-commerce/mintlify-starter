      operationId: companyDropletDestroy
      summary: Delete a droplet
      description: |-
        Deletes a droplet your company publishes, with your own installation of it, and deactivates its credentials. Refused with 409 while another company has it installed, because deleting a droplet removes every installation of it.

        Needs the `droplets.update` permission.
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '204':
          description: Deleted.
        '401':
