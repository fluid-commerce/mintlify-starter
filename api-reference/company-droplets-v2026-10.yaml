  responses:
    WriteForbidden:
      description: Authenticated, but not a company admin with `droplets.update`, or a droplet installation token (bare body);
        or a write only some callers may make (the error envelope), such as publishing without being a Fluid root admin, or
        `egress_proxy_requested` from a caller other than a company admin or company API token.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ForbiddenError'
            - $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Publishing goes through marketplace review
              details:
                status:
                - must be a Fluid root admin to publish or unlist a droplet
            status: 403
            meta:
              request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-20T15:32:08Z'
    StatusForbidden:
      description: Not a company admin with the needed permissions (bare body), or a droplet installation token (the error
        envelope).
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ForbiddenError'
            - $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Not authorized.
    Unauthorized:
      description: Missing or invalid bearer token. The body is a bare `{ message }`, not the error envelope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            message: Invalid credentials.
    Forbidden:
      description: Authenticated, but not a company admin with the needed droplets permission, or a droplet installation token.
        The body is bare.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
          example:
            message: Not authorized.
    NotFound:
      description: No such droplet for your company. Another company's private droplet, and on writes another company's droplet
        of any status, read as missing.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
