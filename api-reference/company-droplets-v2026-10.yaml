  /api/company/v2026-10/droplet-installations:
    get:
      operationId: companyDropletInstallationsIndex
      summary: List installed droplets
      description: |-
        Every droplet your company has installed, ordered by title, with the installation's and droplet's identifiers, title and logo, and the installation's `status` and `lifecycle`. Use it for navigation menus and other places shown on every page: it is one small response, not paginated, where listing the catalog with `filter[ownership]=installed` returns each droplet's full listing.

        Installations being removed are left out here; `view=full` lists them. `lifecycle.delivery_state` is the latest install webhook's state: `unknown` when Fluid recorded none, never assumed delivered. An `active` installation whose install webhook was rejected, exhausted its retries or could not be queued reads `needs_attention`.

        With `view=full` it returns full installation rows instead (status, scopes, effective scopes, the droplet, and the role when you have `roles.view`), as `GET /api/droplet_installations` did: every installation not yet uninstalled, so one being removed too, newest first, narrowed with `filter[category]` and paged by cursor (`page[limit]`, `page[cursor]`, `meta.pagination.next_cursor`). In full rows an installation being removed reads `lifecycle.status` `uninstalling`, or `failed` when the droplet rejected the uninstall webhook. The other parameters are read only with `view=full`.

        Needs the `droplets.view` permission.
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - full
        example: full
        description: '`full` for full installation rows, paged. Leave out for the navigation list.'
      - name: filter[category]
        in: query
        required: false
        schema:
          type: string
        example: payments
        description: With `view=full`, only installations of droplets in this category slug.
      - name: page[cursor]
        in: query
        required: false
