  /api/company/v2026-10/droplets/{uuid}/webhook-secret-rotations:
    parameters:
    - name: uuid
      in: path
      required: true
      description: The uuid of a droplet your company publishes.
      schema:
        type: string
      example: drp_9xk2mt7pq4rz1bwc8hd5nfy3jvs6ale0
    post:
      operationId: companyDropletWebhookSecretRotationCreate
      summary: Rotate a droplet's webhook secret
      description: |-
        Generates a new webhook secret for a droplet your company publishes and returns it, once. This is how you obtain the secret on v2026-10: no other response returns it, and asking again rotates again.

        The old secret stops being used the moment the new one is saved: every webhook and data request Fluid signs from then on uses the new one, so update your droplet straight away. A lifecycle webhook already queued when you rotate is still signed with the old one. A droplet built in Mist has the new secret written to its app's `FLUID_DROPLET_SECRET` and `FLUID_WEBHOOK_AUTH_TOKEN` and is redeployed. A Mist app with no linked GitHub repository gets the new values but is not redeployed, so it keeps verifying with the old secret until its next deploy; deploy it yourself after rotating.

        Another company's droplet is a 404. The response is never cached. Needs the `droplets.update` permission, including for a Fluid root admin's sign-in narrowed to company admin.
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '201':
          description: The new secret.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDropletWebhookSecretRotationResponse'
              example:
                webhook_secret_rotation:
                  droplet_uuid: drp_9xk2mt7pq4rz1bwc8hd5nfy3jvs6ale0
                  webhook_secret: dws_3Fq8mZr2kTn6vXb1cLw9yHd4pJs7aGe5u
                  rotated_at: '2026-10-20T15:32:08Z'
                status: 201
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-20T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No droplet your company publishes by that uuid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Droplet not found
                  details: {}
                status: 404
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-20T15:32:08Z'
  /api/company/v2026-10/droplets/{droplet_uuid}/publish-request:
    parameters:
    - name: droplet_uuid
      in: path
      required: true
      description: The uuid of a draft or internal droplet your company publishes.
      schema:
        type: string
      example: drp_9xk2mt7pq4rz1bwc8hd5nfy3jvs6ale0
    post:
      operationId: companyDropletPublishRequestCreate
      summary: Ask Fluid to publish a droplet
      description: |-
        Asks Fluid to put a draft or internal droplet your company publishes in the public marketplace. Fluid's reviewers are told; the droplet keeps its status, and keeps working for the stores that use it, until a reviewer decides. Approving publishes it. Rejecting leaves it as it is, and the requester is emailed why; the reason also shows in the droplet's `latest_publish_review`.

        Asking while a request already waits returns that request with 200 and tells no one again; a new request is 201. A droplet that is published, suspended or archived cannot ask (409). Another company's droplet is a 404.

        Needs the `droplets.update` permission.
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '201':
          description: The new request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDropletPublishRequestResponse'
              example:
                publish_request:
                  id: 01a1507c-2222-7333-8444-555566667777
                  state: pending
                  status_before: internal
                  reason: null
                  requested_at: '2026-10-21T18:04:12Z'
                  decided_at: null
                status: 201
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-21T18:04:12Z'
        '200':
          description: The request already waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDropletPublishRequestResponse'
              example:
                publish_request:
                  id: 01a1507c-2222-7333-8444-555566667777
                  state: pending
                  status_before: internal
                  reason: null
                  requested_at: '2026-10-21T18:04:12Z'
                  decided_at: null
                status: 200
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-21T18:10:40Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The droplet is not draft or internal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Only a draft or internal droplet can ask to be published
                  details:
                    status:
                    - is published
                status: 409
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-21T18:04:12Z'
    delete:
      operationId: companyDropletPublishRequestDestroy
      summary: Withdraw a request to publish a droplet
      description: |-
        Withdraws the droplet's waiting request. The droplet stays as it is. 404 when no request waits.

        Needs the `droplets.update` permission.
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '204':
          description: Withdrawn.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No droplet your company publishes by that uuid, or no request waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: No publish request is waiting
                  details: {}
                status: 404
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-21T18:04:12Z'
        '409':
          description: The request was decided while you withdrew it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
