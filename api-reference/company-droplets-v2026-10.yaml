    patch:
      operationId: companyDropletUpdate
      summary: Update a droplet
      description: Changes a droplet your company publishes. Only the keys you send change, so updating the summary leaves
        the description, logo and features alone. `features`, when sent, replaces the list. `status` takes the droplet offline
        (`draft`) or back into service (`internal`); publishing needs a Fluid root admin. `egress_proxy_requested` needs a
        company admin or a company API token, and `extension_zip_url` a public HTTPS URL; both are checked before anything is
        written. Scopes a published droplet newly adds to `requested_scopes` may wait for Fluid review. The droplet keeps the
        scopes it already had, the full list you asked for shows in `pending_requested_scopes`, and Fluid approves or rejects
        it. Removing a scope applies at once and withdraws a pending request that asked for it. A scope Fluid does not offer
        is refused with 422, and a write refused for any reason holds nothing for review.
