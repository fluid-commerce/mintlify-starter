      properties:
        installation:
          type: object
          description: Only the keys sent change.
          properties:
            role_uuid:
              type:
              - string
              - 'null'
              format: uuid
              description: The role the droplet acts with, by its uuid. Null clears it. Needs the `roles.update` permission.
            role_id:
              type:
              - integer
              - 'null'
              deprecated: true
              description: 'Deprecated: use `role_uuid`. The role by its integer id; null clears it. Sent with `role_uuid`,
                both must name the same role or the update is refused with 422. Needs the `roles.update` permission.'
            scopes:
              type: array
              items:
                type: string
              description: Scopes to grant, within what the droplet requests. Replaces the list.
            active:
              type: boolean
              description: '`false` uninstalls an active installation after any other change is saved, as `DELETE` does.
                `true` changes nothing: an installation being removed cannot be reactivated.'
    CompanyDropletInstallRequest:
      type: object
      properties:
        installation:
          type: object
          properties:
            scopes:
              type: array
              items:
                type: string
              description: Scopes to grant, within what the droplet requests. The droplet's own declaration when left out.
            role_uuid:
              type: string
              format: uuid
              description: The role the droplet acts with, by its uuid. A new role is made when left out. Needs the `roles.update`
                permission.
            role_id:
              type: integer
              deprecated: true
              description: 'Deprecated: use `role_uuid`. The role by its integer id. Sent with `role_uuid`, both must name
                the same role or the install is refused with 422. Needs the `roles.update` permission.'

