          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyDropletCreateRequest:
      type: object
      required:
      - droplet
      properties:
        droplet:
          type: object
          required:
          - title
          - embed_url
          properties:
            title:
              type: string
              minLength: 1
              description: The droplet's name.
            embed_url:
              type: string
              minLength: 1
              description: Where the droplet renders inside Fluid admin.
            install_webhook_url:
              type:
              - string
              - 'null'
              description: Called when a company installs the droplet.
            uninstall_webhook_url:
              type:
              - string
              - 'null'
              description: Called when a company uninstalls the droplet.
            widget_data_url:
              type:
              - string
              - 'null'
              description: Where widget capability calls are served from.
            requested_scopes:
              type: array
              items:
                type: string
              description: What the droplet asks to read or change in a store.
            categories:
              type: array
              items:
                type: string
              description: Category slugs. Replaces the droplet's categories; an unknown slug is a 422 and nothing is written.
            summary:
              type:
              - string
              - 'null'
              description: One line for the marketplace card. Plain text.
            description:
              type:
              - string
              - 'null'
              description: The details-page description, as HTML.
            logo_url:
              type:
              - string
              - 'null'
            features:
              type: array
              items:
                $ref: '#/components/schemas/CompanyDropletFeatureWrite'
              description: Replaces the feature list, in this order.
            service_operational_countries:
              type:
              - array
              - 'null'
              items:
                type: string
                pattern: ^[A-Z]{3}$
            data_url:
              type:
              - string
              - 'null'
              description: The same URL as `widget_data_url`, by the name the droplet manifest uses. Sent together, the two
                must match.
            extension_zip_url:
              type: string
              minLength: 1
              description: A public HTTPS URL of an extension zip (such as a theme extension) to import once the droplet is
                saved. Any other URL is refused with 422 and nothing is written. The import runs in the background; read
                `app_extensions` for its status.
            egress_proxy_requested:
              type: boolean
              description: Ask for the droplet's installations to reach the internet through Fluid's egress proxy, from Fluid's
                IP addresses. Only a company admin or a company API token may send it (403 otherwise). Setting it to false
                also withdraws Fluid's grant. The grant itself, `egress_proxy_enabled`, is not set through this API.
            liveness_opt_out_requested:
              type: boolean
              description: Ask to be excused from Fluid's liveness probes; needs `liveness_opt_out_reason`. The request alone
                changes nothing, because only a Fluid root admin's grant takes effect, and that is not set through this API. Only a
                company admin or a company API token may send it (403 otherwise). Setting it to false withdraws the grant.
            liveness_opt_out_reason:
              type:
              - string
              - 'null'
              description: Why the droplet should be excused from liveness probes. Same audience as `liveness_opt_out_requested`.
            lifecycle_contract_version:
              type: string
              enum:
              - v1
              - v2
              description: Which install and uninstall webhook contract the droplet speaks.
            status:
              type: string
              enum:
              - draft
              - internal
              - published
              description: '`draft` takes the droplet offline. `internal` makes it installable by your company and companies
                it is granted to; a published droplet cannot be unlisted this way. `published` lists it in the public marketplace
                and needs a Fluid root admin (403 otherwise): publish through marketplace review. Sending the current status
                changes nothing, and moves the droplet''s lifecycle does not allow (for example out of `suspended`, or out
                of service while other companies have it installed) are refused with 422. On create, the droplet starts from
                `draft`.'
