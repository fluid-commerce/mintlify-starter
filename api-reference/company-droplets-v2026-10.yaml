            meta:
              request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-18T15:32:08Z'
paths:
  /api/company/v2026-10/droplets:
    get:
      operationId: companyDropletsIndex
      summary: List and search droplets
      description: |-
        The droplets your company may see, a page at a time. Search with `q` to find a droplet that already does what you need before building one; narrow with `filter[ownership]`, `filter[category]` and `filter[status]`.

        Needs the `droplets.view` permission.

        Examples:

        - Find one to install: `GET /api/company/v2026-10/droplets?q=sync%20orders%20to%20a%20warehouse`
        - Your company's own droplets (what `GET /api/droplets/company_droplets` returned): `?filter[ownership]=owned`
        - What you have installed: `?filter[ownership]=installed`
        - The next page: `?page[cursor]=<meta.pagination.next_cursor>`
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: A page of droplets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDropletListResponse'
              example:
                droplets:
                - uuid: drp_4tq8nxw2kfl9mrv3bpz6cyh1jds7age5
                  title: Order Sync
                  summary: Push every paid order to your warehouse the moment it is captured.
                  description: <p>Order Sync sends each paid order to your warehouse management system as soon as payment
                    is captured, and writes tracking numbers back when it ships.</p><h3>What it does</h3><ul><li>Sends new
                    orders, with line items and shipping address, within seconds.</li><li>Marks orders fulfilled and adds
                    tracking when the warehouse ships.</li></ul>
                  logo_url: https://ik.imagekit.io/fluid/droplets/order-sync/logo.png
                  features:
                  - title: Real-time order push
                    image_url: https://ik.imagekit.io/fluid/droplets/order-sync/dashboard.png
                    video_url: null
                  - title: Tracking write-back
                    image_url: null
                    video_url: https://ik.imagekit.io/fluid/droplets/order-sync/tour.mp4
                  categories:
                  - slug: orders-shipping
                    name: Orders & Shipping
                  publisher:
                    uuid: 0190a1b2-7c3d-7e4f-8a5b-6c7d8e9f0a1b
                    name: Pied Piper Apps
                  mist_apps: []
                  app_extensions: []
                  status: published
                  owned: false
                  installed: true
                  requested_scopes:
                  - orders
                  service_operational_countries: null
                  embed_url: https://apps.piedpiper.com/fluid/order-sync
                  install_embed_url: https://apps.piedpiper.com/fluid/order-sync
                  client_id: drp_client_ordersync7k2m
                  egress_proxy_requested: false
                  egress_proxy_enabled: false
                  created_at: '2026-09-08T16:20:44Z'
                  updated_at: '2026-10-02T09:12:30Z'
                status: 200
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-18T15:32:08Z'
                  pagination:
                    cursor: null
                    limit: 25
                    prev_cursor: null
                    next_cursor: eyJuYW1lIjoiT3JkZXIgU3luYyIsImlkIjo0MTJ9
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: An invalid filter, sort, limit or cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Invalid parameters
                  details:
                    filter:
                      ownership:
                      - 'must be one of: all, owned, installed'
                status: 422
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-18T15:32:08Z'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
        example: sync orders to a warehouse
        description: 'Words describing what the droplet should do. Matches the title, summary, description and categories.
          With no `sort`, the response is one page of the best matches, most relevant first, and `next_cursor` is null: refine
          `q` rather than paging. With a `sort`, every match (up to 10,000) pages in that order.'
      - name: page[cursor]
        in: query
        required: false
        schema:
          type: string
        description: Opaque cursor from `meta.pagination.next_cursor` or `prev_cursor`. Do not construct or decode it.
      - name: page[limit]
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
        example: 25
        description: Droplets per page. Default 25, maximum 100.
      - name: filter[ownership]
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - owned
          - installed
        example: owned
        description: '`all` (default): every droplet your company may see, which is published droplets, your own in any status,
          and internal droplets granted to you. `owned`: only the droplets your company publishes. `installed`: only the droplets
          your company has installed.'
      - name: filter[category]
        in: query
        required: false
        schema:
          type: string
        example: orders-shipping
        description: A droplet category slug.
      - name: filter[status]
        in: query
        required: false
        schema:
          type: string
          enum:
          - draft
          - internal
          - pending
          - published
          - archived
          - suspended
        description: Only droplets in this status.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - title
          - -title
          - created_at
          - -created_at
          - updated_at
          - -updated_at
        example: -updated_at
        description: Sort key; prefix `-` for descending. Default `title`, or relevance when `q` is given.
