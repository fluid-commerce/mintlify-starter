---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Droplets
  version: 2026-10
  description: |-
    Your company's droplets on v2026-10: the catalog your company can install from, the droplets your company publishes, and installing, changing and uninstalling one.

    ## Authentication

    Send a company admin credential as `Authorization: Bearer <token>`: an admin session token or an API token for your company. Reads need the `droplets.view` permission; writes and installs need `droplets.update`. Droplet installation tokens are refused, so a droplet cannot rewrite the catalog it is listed in.

    ## Responses

    Every response wraps the resource under its own key with `status` and `meta`, in the shape of the v2026-04 storefront API:

    ```json
    { "droplet": { "uuid": "drp_…", "title": "Order Sync" }, "status": 200, "meta": { "request_id": "…", "timestamp": "…" } }
    ```

    Errors use the same envelope with `error.message` and field-keyed `error.details`. A 401 is a bare `{ "message": … }`.

    ## Finding a droplet

    `GET /droplets?q=…` searches what droplets say they do, so look here before building one. Lists page by cursor: follow `meta.pagination.next_cursor` until it is null.

    ## Showing installed droplets

    `GET /droplet-installations` returns every droplet your company has installed with just its uuid, title and logo, for navigation menus and other places shown on every page. Open one with `GET /droplets/{uuid}`.

    ## Managing an installation

    `GET /droplet-installations/{uuid}` reads one installation with its droplet, role and scopes. `PATCH` changes its role or scopes, and `DELETE` uninstalls it: the droplet's credentials are revoked and its uninstall webhook is sent.

    ## Who installed your droplet

    `GET /droplets/{droplet_uuid}/installations` lists the companies that have installed a droplet your company publishes, each named by its uuid.

    ## Describing a droplet

    A droplet is described like the rest of the app's resources: a `title`, a one-line `summary` for its marketplace card, a longer `description` for its details page (HTML: paragraphs, headings, lists, links), a `logo_url`, and `features`, each a `title` with an optional `image_url` or `video_url`. Upload media to your company's DAM first and use the URLs it gives you.

    ## Publishing a droplet

    Only Fluid publishes a droplet to the public marketplace. When a draft or internal droplet is ready, `POST /droplets/{droplet_uuid}/publish-request` asks Fluid to review it; the droplet keeps its status, and keeps working for the stores that use it, until Fluid decides. Asking again while a request waits returns the same request, and `DELETE` withdraws it. Fluid publishes the droplet when it approves, or emails why it didn't; `latest_publish_review` on the droplet shows where the request stands, with the reason once rejected. Every move back to the marketplace, such as after Fluid unlists a droplet, is asked for the same way.

    ## Webhook secret

    Fluid signs the webhooks and data requests it sends your droplet with its webhook secret. No droplet response carries it. `POST /droplets/{uuid}/webhook-secret-rotations` generates a new one and returns it once; the old one stops being used immediately.

    ## Checking a droplet's health

    `GET /droplets/{uuid}/health` says how a droplet's callbacks have behaved for your company's own installation over a trailing window: each callback it answers, whether a checkout waits on it, and its request, failure and timeout counts and latency. Read `metrics_available` first: the figures come from Fluid's monitoring, so they can be missing (`metrics` null, `metrics_error` set) while the installation and its callbacks are listed in full. A zero count is a real reading: nothing called that callback in the window. `installation` is null when your company publishes the droplet but has not installed it. Only your company's installation is ever returned.

    ## What changed from `/api/droplets`

    - A droplet is flat: `title`, `summary`, `description`, `logo_url` and `features` replace the `name` and `settings` object, and a feature is its `title` and media.
    - `filter[ownership]=owned` replaces `GET /api/droplets/company_droplets`.
    - `publisher` carries the publishing company's `uuid`, not its integer id.
    - A droplet's installations are read by their own uuid at `/droplet-installations/{uuid}`, and `PATCH` there does not need `active`.
    - Listing who installed your droplet answers 404, not 401, when the droplet is not your company's.
    - `PATCH` changes only what you send.
    - `status` replaces the `active` and `publicly_available` flags, with the same rules: anyone with `droplets.update` can take a droplet offline (`draft`) or back into service (`internal`); publishing, or unlisting a published droplet, needs a Fluid root admin.
    - `DELETE` is refused while another company has the droplet installed.
    - Publishing goes through marketplace review (`POST /droplets/{droplet_uuid}/publish-request`) rather than an `active` or `publicly_available` flag.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: droplets
  description: Droplets your company finds, publishes and installs.
  x-fluid-section: Droplets
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: A company admin credential for your company. Droplet installation tokens are refused.
  schemas:
    Meta:
      type: object
      description: |
        Response metadata included on every successful response body.
        `request_id` and `timestamp` are always present; list endpoints
        also add `pagination`.
      required:
      - request_id
      - timestamp
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
      - cursor
      - limit
      - prev_cursor
      - next_cursor
      properties:
        cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
          example: 25
        prev_cursor:
          type:
          - string
          - 'null'
        next_cursor:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    IdempotencyRefusal:
      type: object
      description: The idempotency guard's own refusal, rendered before the action runs.
      required:
      - status
      - message
      properties:
        status:
          type: string
          enum:
          - error
        message:
          type: string
    UnauthorizedError:
      type: object
      description: |
        Bare 401 body — a single `message` string, not the wrapped
        `ErrorResponse`.
      required:
      - message
      properties:
        message:
          type: string
          example: Invalid credentials.
    ForbiddenError:
      description: |
        Bare 403 body: `{ error }` when a storefront permission is missing,
        or `{ message }` when the credential is not company-admin tier.
      oneOf:
      - type: object
        required:
        - error
        properties:
          error:
            type: string
            example: Not authorized.
      - type: object
        required:
        - message
        properties:
          message:
            type: string
            example: Not authorized.
    CompanyDroplet:
      type: object
      description: A droplet as your company sees it.
      required:
      - uuid
      - title
      - status
      - owned
      - installed
      - publisher
      - mist_apps
      - app_extensions
      - categories
      - embed_url
      - install_embed_url
      - client_id
      - requested_scopes
      - summary
      - description
      - logo_url
      - features
      - service_operational_countries
      - created_at
      - updated_at
      properties:
        uuid:
          type: string
          description: The droplet's public identifier.
        title:
          type:
          - string
          - 'null'
          description: The droplet's name.
        summary:
          type:
          - string
          - 'null'
          description: One line about the droplet, shown on its marketplace card. Plain text.
        description:
          type:
          - string
          - 'null'
          description: The details-page description, as HTML.
        logo_url:
          type:
          - string
          - 'null'
        features:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDropletFeature'
        categories:
          type: array
          items:
            type: object
            required:
            - slug
            - name
            properties:
              slug:
                type: string
              name:
                type: string
        publisher:
          type: object
          required:
          - uuid
          - name
          properties:
            uuid:
              type:
              - string
              - 'null'
              format: uuid
              description: The publishing company's uuid.
            name:
              type:
              - string
              - 'null'
          description: The company that publishes the droplet.
        mist_apps:
          type: array
          description: The Mist apps that serve this droplet, newest first. Empty for a droplet not built in Mist. Only apps
            of the publishing company are listed, and an app being deleted or archived is left out.
          items:
            $ref: '#/components/schemas/CompanyDropletMistApp'
        app_extensions:
          type: array
          description: The extensions the droplet ships, such as a theme extension.
          items:
            $ref: '#/components/schemas/CompanyDropletAppExtension'
        status:
          type: string
          enum:
          - draft
          - internal
          - pending
          - published
          - archived
          - suspended
          description: '`published`: in the public marketplace. `draft` and `internal`: private to the publisher, and an internal
            droplet also to companies it is granted to. `archived`: no new installs. `suspended`: stopped by Fluid for
            every store and out of the marketplace; its publisher and the companies that installed it still see it.'
        owned:
          type: boolean
          description: Your company publishes this droplet.
        installed:
          type: boolean
          description: Your company has this droplet installed.
        requested_scopes:
          type: array
          items:
            type: string
          description: What the droplet asks to read or change in a store.
        service_operational_countries:
          type:
          - array
          - 'null'
          items:
            type: string
            pattern: ^[A-Z]{3}$
          description: ISO3 codes of the countries the droplet works in; null when it works everywhere.
        embed_url:
          type:
          - string
          - 'null'
          description: Where the droplet renders inside Fluid admin.
        install_embed_url:
          type:
          - string
          - 'null'
          readOnly: true
          description: Where this company's install frames the droplet. Follows the install's pinned manifest when it declares a detail page, otherwise equals embed_url; null when the pinned detail page is refused.
        client_id:
          type:
          - string
          - 'null'
          description: The droplet's OAuth client id. Not a secret; a full-page embed sends it to mint a session token. Null
            when the droplet has no OAuth client.
        egress_proxy_requested:
          type: boolean
          description: The publisher asked for the droplet's traffic to leave through Fluid's egress proxy. Present only for
            a root admin, a company admin, or a company API token, so an admin sees it before installing.
        egress_proxy_enabled:
          type: boolean
          description: A Fluid root admin recorded the egress grant. Present to the same callers as `egress_proxy_requested`.
        liveness_opt_out_requested:
          type: boolean
          description: The publisher asked to be excused from Fluid's liveness probes. Only a Fluid root admin's grant takes
            effect. Present only for a droplet your company publishes, to its admins and its company API tokens with `droplets.view`; hidden for droplets owned by another company.
        liveness_opt_out_reason:
          type:
          - string
          - 'null'
          description: Why the publisher asked to be excused from liveness probes. Present to the same callers as `liveness_opt_out_requested`, which are the publishing company's admins and its API tokens with `droplets.view`, never for a droplet owned by another company.
        liveness_opt_out_granted:
          type: boolean
          description: A Fluid root admin granted the opt-out, so probes are skipped. Present to the same callers as `liveness_opt_out_requested`, which are the publishing company's admins and its API tokens with `droplets.view`, never for a droplet owned by another company.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyDropletMistApp:
      type: object
      description: A Mist app that serves the droplet.
      required:
      - id
      - name
      - slug
      - public_url
      properties:
        id:
          type: string
          format: uuid
          description: The Mist app's id, as the Mist API names it.
        name:
          type:
          - string
          - 'null'
          description: The name the Mist app's owner gave it.
        slug:
          type: string
          description: Six-character short id that the app's repository and URL carry.
          example: 3bed85
        public_url:
          type:
          - string
          - 'null'
    CompanyDropletAppExtension:
      type: object
      description: An extension the droplet ships.
      required:
      - extension_type
      - name
      - version
      - status
      properties:
        extension_type:
          type: string
          enum:
          - theme
        name:
          type: string
        version:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - draft
          - publishing
          - published
          - error
        error_message:
          type:
          - string
          - 'null'
          description: Why publishing the extension failed. Only on a droplet your company publishes, read one at a time.
    CompanyDropletDetail:
      description: A droplet, with the endpoints only its publisher sees.
      allOf:
      - $ref: '#/components/schemas/CompanyDroplet'
      - type: object
        properties:
          install_webhook_url:
            type:
            - string
            - 'null'
            description: Called when a company installs the droplet. Publisher only.
          uninstall_webhook_url:
            type:
            - string
            - 'null'
            description: Called when a company uninstalls the droplet. Publisher only.
          widget_data_url:
            type:
            - string
            - 'null'
            description: Where widget capability calls are served from. Publisher only.
          data_url:
            type:
            - string
            - 'null'
            description: The same URL as `widget_data_url`, by the name the droplet manifest uses. Publisher only.
          lifecycle_contract_version:
            type: string
            enum:
            - v1
            - v2
            description: Which install and uninstall webhook contract the droplet speaks. Publisher only.
          pending_requested_scopes:
            type:
            - array
            - 'null'
            items:
              type: string
            description: The full scope list waiting on marketplace review after a published droplet asked for new scopes,
              or null. Publisher only.
          latest_scope_review:
            type:
            - object
            - 'null'
            description: Fluid's latest review of scopes this droplet asked to add, with the reason when it was rejected
              (the reason the publisher was emailed), or null when it never asked. Publisher only.
            required:
            - state
            - added_scopes
            - reason
            - requested_at
            - decided_at
            properties:
              state:
                type: string
                enum:
                - pending
                - approved
                - rejected
              added_scopes:
                type: array
                items:
                  type: string
                description: The scopes the request asked to add.
              reason:
                type:
                - string
                - 'null'
                description: Why Fluid rejected the request; null unless rejected.
              requested_at:
                type: string
                format: date-time
              decided_at:
                type:
                - string
                - 'null'
                format: date-time
                description: When Fluid approved or rejected it; null while pending.
          latest_publish_review:
            description: Your latest request for Fluid to publish the droplet, pending, approved or rejected, with the reason
              once rejected; null when it never asked, or after withdrawing. Publisher only.
            oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/CompanyDropletPublishRequest'
          latest_governance_action:
            type:
            - object
            - 'null'
            description: Fluid's latest marketplace action on the droplet (suspended, reinstated, unlisted, relisted or
              taken down), with the reason the publisher was emailed, or null. Publisher only.
            required:
            - kind
            - reason
            - status_after
            - state
            - created_at
            properties:
              kind:
                type: string
                enum:
                - suspend
                - reinstate
                - unlist
                - relist
                - take_down
              reason:
                type: string
              status_after:
                type: string
                description: The droplet's status after the action.
              state:
                type: string
                enum:
                - running
                - completed
                - failed
                description: A take-down runs in the background; every other action completes at once.
              created_at:
                type: string
                format: date-time
    CompanyDropletListResponse:
      type: object
      description: A page of droplets.
      required:
      - droplets
      - status
      - meta
      properties:
        droplets:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDroplet'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyDropletResponse:
      type: object
      description: One droplet.
      required:
      - droplet
      - status
      - meta
      properties:
        droplet:
          $ref: '#/components/schemas/CompanyDropletDetail'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyDropletHealthResponse:
      type: object
      description: A droplet's health for your company's installation.
      required:
      - droplet_health
      - status
      - meta
      properties:
        droplet_health:
          $ref: '#/components/schemas/CompanyDropletHealth'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyDropletHealth:
      type: object
      required:
      - window_hours
      - generated_at
      - metrics_available
      - metrics_error
      - droplet
      - installation
      properties:
        window_hours:
          type: integer
          description: The trailing window the figures cover, in hours.
        generated_at:
          type: string
          format: date-time
          description: When the figures were read. Readings are reused for up to a minute.
        metrics_available:
          type: boolean
          description: Whether the callback figures could be read. When false, every `metrics` is null and `metrics_error`
            says why.
        metrics_error:
          description: Why the figures are missing or partial, or null.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletHealthMetricsError'
        droplet:
          type: object
          required:
          - uuid
          - name
          - status
          properties:
            uuid:
              type: string
            name:
              type:
              - string
              - 'null'
            status:
              type: string
        installation:
          description: Your company's active installation of the droplet, or null when it has none.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletHealthInstallation'
    CompanyDropletHealthMetricsError:
      type: object
      required:
      - type
      - description
      properties:
        type:
          type: string
          enum:
          - unavailable
          - incomplete
          description: '`unavailable`: the figures could not be read; try again in a few minutes. `incomplete`: the window
            was read but may be missing some callbacks.'
        description:
          type: string
          description: A fixed plain-language sentence for the type.
    CompanyDropletHealthInstallation:
      type: object
      required:
      - installation_uuid
      - installation_status
      - scopes
      - classification
      - verdict
      - metrics
      - registrations
      properties:
        installation_uuid:
          type: string
        installation_status:
          type: string
        scopes:
          type: array
          items:
            type: string
          description: The API scopes the installation holds.
        classification:
          $ref: '#/components/schemas/CompanyDropletHealthClassification'
        verdict:
          type: string
          enum:
          - healthy
          - degraded
          - failing
          - idle
          - unknown
          description: The installation's current state from the health rollup, independent of `window_hours`. A stale or
            missing rollup reads `unknown`, never `healthy`; `idle` means it was read and nothing was called.
        metrics:
          description: Every callback of the installation together. Null when the figures could not be read.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletHealthMetrics'
        registrations:
          type: array
          description: The callbacks the droplet answers for your company.
          items:
            $ref: '#/components/schemas/CompanyDropletHealthRegistration'
    CompanyDropletHealthClassification:
      type: object
      description: Where the installation sits relative to a checkout, from its active callbacks and its scopes.
      required:
      - criticality
      - domains
      - checkout_path
      - commerce_access
      - blocking
      - reasons
      properties:
        criticality:
          type: string
          enum:
          - checkout_blocking
          - commerce_blocking
          - auth_blocking
          - checkout_async
          - non_blocking
        domains:
          type: array
          items:
            type: string
            enum:
            - cart
            - subscription
            - order
            - payment
            - auth
            - email
            - platform
        checkout_path:
          type: boolean
          description: Whether it answers a callback fired during a checkout.
        commerce_access:
          type: boolean
          description: Whether its scopes can read or change cart, order or payment data.
        blocking:
          type: boolean
          description: Whether Fluid waits on its response to finish a request.
        reasons:
          type: array
          items:
            type: string
    CompanyDropletHealthRegistration:
      type: object
      required:
      - uuid
      - definition_name
      - criticality
      - domain
      - url
      - active
      - country_codes
      - metrics
      properties:
        uuid:
          type: string
        definition_name:
          type: string
          description: The callback it answers, e.g. `update_cart_tax`.
        criticality:
          type:
          - string
          - 'null'
          enum:
          - checkout_blocking
          - commerce_blocking
          - auth_blocking
          - checkout_async
          - non_blocking
          - null
          description: '`checkout_blocking` means a checkout waits on this callback.'
        domain:
          type:
          - string
          - 'null'
          enum:
          - cart
          - subscription
          - order
          - payment
          - auth
          - email
          - platform
          - null
        url:
          type:
          - string
          - 'null'
          description: The endpoint Fluid calls, as scheme, host and path only. A query string, fragment or credentials in
            the registered URL are never returned.
        active:
          type:
          - boolean
          - 'null'
        country_codes:
          type: array
          items:
            type: string
          description: Countries the callback is limited to; empty means every country.
        metrics:
          description: Null when the figures could not be read; zero requests means nothing called it.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletHealthMetrics'
    CompanyDropletHealthMetrics:
      type: object
      required:
      - request_count
      - failure_count
      - timeout_count
      - failure_rate
      - average_ms
      - worst_p95_ms
      - max_ms
      properties:
        request_count:
          type: integer
        failure_count:
          type: integer
          description: Requests that did not return a successful answer.
        timeout_count:
          type: integer
          description: Requests that timed out, a subset of failures.
        failure_rate:
          type: number
          description: Failures over requests, 0 to 1.
        average_ms:
          type:
          - number
          - 'null'
        worst_p95_ms:
          type:
          - number
          - 'null'
          description: The highest p95 among the callbacks folded in.
        max_ms:
          type:
          - number
          - 'null'
    CompanyDropletStatusResponse:
      type: object
      description: One droplet installation's status.
      required:
      - droplet_status
      - status
      - meta
      properties:
        droplet_status:
          $ref: '#/components/schemas/CompanyDropletStatus'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    CompanyDropletStatus:
      type: object
      required:
      - generated_at
      - window_hours
      - installation
      - history
      - sections
      properties:
        generated_at:
          type: string
          format: date-time
        window_hours:
          type: integer
          description: The trailing window `sections.metrics` and `sections.webhook_health` cover.
        installation:
          $ref: '#/components/schemas/CompanyDropletStatusInstallation'
        history:
          description: Every installation your company has made of the droplet, newest first. Null when read by installation uuid.
          oneOf:
          - type: 'null'
          - type: array
            items:
              $ref: '#/components/schemas/CompanyDropletStatusInstallation'
        sections:
          $ref: '#/components/schemas/CompanyDropletStatusSections'
    CompanyDropletStatusInstallation:
      type: object
      description: One of your company's installations of a droplet, in any status.
      required:
      - uuid
      - status
      - droplet
      - created_at
      - updated_at
      properties:
        uuid:
          type: string
        status:
          type: string
          enum:
          - active
          - pending_uninstall
          - uninstalled
          description: The installation's own status. For what to tell a merchant, read `sections.install_status`.
        droplet:
          type: object
          required:
          - uuid
          - name
          properties:
            uuid:
              type: string
            name:
              type:
              - string
              - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: For an uninstalled installation, when it last changed, which is when it was uninstalled.
    CompanyDropletStatusStateSignal:
      type: object
      required:
      - state
      - observed_at
      properties:
        state:
          type: string
          description: The signal's state; `unknown` when the reading is stale or absent.
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
    CompanyDropletStatusError:
      type: object
      description: Why a section could not be read. A fixed category and sentence, never a provider's own text.
      required:
      - type
      - description
      properties:
        type:
          type: string
          enum:
          - unavailable
          - incomplete
        description:
          type: string
    CompanyDropletStatusSection:
      type: object
      description: One part of the status. Each part is read on its own, so one that fails does not hide the others.
      required:
      - available
      - error
      - data
      properties:
        available:
          type: boolean
          description: False when the part could not be read, and for `reconcile` and `connect`, which are not built yet.
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletStatusError'
        data:
          type:
          - object
          - 'null'
    CompanyDropletStatusSections:
      type: object
      required:
      - deployment
      - install_status
      - lifecycle
      - health
      - metrics
      - webhook_health
      - app_hosts
      - reconcile
      - connect
      properties:
        deployment:
          description: The droplet's Mist app deployments for your company; unavailable unless you hold `mist.code`.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required:
                  - hosted
                  - deployments
                  properties:
                    hosted:
                      type: boolean
                      description: Whether your company has a Mist app serving the droplet.
                    deployments:
                      type: array
                      items:
                        type: object
                        required:
                        - id
                        - state
                        - url
                        - commit_sha
                        - created_at
                        - target
                        properties:
                          id:
                            type: string
                          state:
                            type: string
                          url:
                            type:
                            - string
                            - 'null'
                          commit_sha:
                            type:
                            - string
                            - 'null'
                          created_at:
                            type:
                            - string
                            - 'null'
                          target:
                            type:
                            - string
                            - 'null'
        install_status:
          description: What to tell the merchant, from the installation's status and its latest lifecycle webhook.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/CompanyDropletInstallationLifecycle'
        lifecycle:
          description: The installation's install and uninstall webhook deliveries, newest first.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required:
                  - deliveries
                  properties:
                    deliveries:
                      type: array
                      items:
                        type: object
                        required:
                        - event
                        - trigger
                        - state
                        - attempts
                        - last_status
                        - last_error_category
                        - created_at
                        - updated_at
                        properties:
                          event:
                            type: string
                            enum:
                            - installed
                            - uninstalled
                          trigger:
                            type: string
                            enum:
                            - install
                            - uninstall
                            - retry
                          state:
                            type: string
                            enum:
                            - pending
                            - enqueue_failed
                            - retrying
                            - delivered
                            - rejected
                            - exhausted
                          attempts:
                            type: integer
                          last_status:
                            type:
                            - integer
                            - 'null'
                          last_error_category:
                            type:
                            - string
                            - 'null'
                          created_at:
                            type: string
                            format: date-time
                          updated_at:
                            type: string
                            format: date-time
        health:
          description: The installation's health rollup, with its verdict and signals including the circuit breaker.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required:
                  - verdict
                  - signals
                  properties:
                    verdict:
                      type: string
                      enum: [healthy, degraded, failing, idle, unknown]
                      description: This installation's callback verdict worsened by its delivery verdict and its circuit breaker, and, when enabled for the platform, by the liveness and endpoint probe signals, from the health rollup and independent of `window_hours`. A stale or missing rollup reads `unknown`.
                    signals:
                      type: object
                      required: [callback, delivery, breaker, lifecycle, liveness, probe]
                      properties:
                        callback:
                          type: object
                          required: [verdict]
                          properties:
                            verdict:
                              type: string
                              enum: [healthy, degraded, failing, idle, unknown]
                        delivery:
                          type: object
                          description: How this installation's own webhook, lifecycle and callback deliveries fared, from the share that failed. `idle` when none were attempted in the window.
                          required: [verdict]
                          properties:
                            verdict:
                              type: string
                              enum: [healthy, degraded, failing, idle, unknown]
                        breaker:
                          $ref: '#/components/schemas/CompanyDropletStatusStateSignal'
                        lifecycle:
                          $ref: '#/components/schemas/CompanyDropletStatusStateSignal'
                        liveness:
                          $ref: '#/components/schemas/CompanyDropletStatusStateSignal'
                        probe:
                          description: "Whether Fluid can reach this installation's registered embed and callback hosts: `reachable`, `unreachable` (the latest three probes of an endpoint all failed in transport), or `unknown`."
                          $ref: '#/components/schemas/CompanyDropletStatusStateSignal'
        metrics:
          description: Every callback of this installation together over `window_hours`; unavailable when New Relic cannot be read.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required: [window_hours, request_count, failure_count, timeout_count, failure_rate, average_ms, worst_p95_ms, max_ms]
                  properties:
                    window_hours:
                      type: integer
                    request_count:
                      type: integer
                    failure_count:
                      type: integer
                    timeout_count:
                      type: integer
                    failure_rate:
                      type: number
                    average_ms:
                      type: [number, 'null']
                    worst_p95_ms:
                      type: [number, 'null']
                    max_ms:
                      type: [number, 'null']
        webhook_health:
          description: The installation's ordinary event webhooks, kept apart from lifecycle delivery.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required: [window_hours, verdict, webhooks, deliveries, recent_failures, shared_events]
                  properties:
                    window_hours:
                      type: integer
                    verdict:
                      type: string
                      enum: [none, ambiguous, healthy, attention, failing]
                      description: '`none` when the installation has no webhooks. `ambiguous` when every event it takes is shared with another of your webhooks, so no delivery can be attributed to it. `failing` when its last three settled deliveries failed or under 80% of settled deliveries succeeded.'
                    webhooks:
                      type: object
                      required: [total, active, events]
                      properties:
                        total:
                          type: integer
                        active:
                          type: integer
                        events:
                          type: array
                          items:
                            type: string
                    deliveries:
                      type: object
                      required: [total, succeeded, failed, pending, success_rate, capped]
                      properties:
                        total:
                          type: integer
                        succeeded:
                          type: integer
                        failed:
                          type: integer
                        pending:
                          type: integer
                        success_rate:
                          type: [number, 'null']
                        capped:
                          type: boolean
                          description: True when the window held more deliveries than were counted.
                    recent_failures:
                      type: array
                      items:
                        type: object
                        required: [id, event, status, at]
                        properties:
                          id:
                            type: string
                          event:
                            type: string
                          status:
                            type: [string, 'null']
                          at:
                            type: string
                            format: date-time
                    shared_events:
                      type: array
                      items:
                        type: string
                      description: Events another active webhook of your company also takes. Deliveries are matched by event name, so these counts may include the other webhook's deliveries.
        app_hosts:
          description: Which of your company's webhooks deliver to the Mist app's hosts; unavailable unless you hold `mist.code`.
          allOf:
          - $ref: '#/components/schemas/CompanyDropletStatusSection'
          - properties:
              data:
                oneOf:
                - type: 'null'
                - type: object
                  required: [hosted, hosts, webhooks, shared_events, capped]
                  properties:
                    hosted:
                      type: boolean
                    hosts:
                      type: array
                      items:
                        type: string
                    webhooks:
                      type: array
                      items:
                        type: object
                        required: [event, active, url]
                        properties:
                          event:
                            type: [string, 'null']
                          active:
                            type: boolean
                          url:
                            type: [string, 'null']
                            description: Origin and path only.
                    shared_events:
                      type: array
                      items:
                        type: string
                    capped:
                      type: boolean
                      description: True when your company has more webhooks than were matched.
        reconcile:
          description: Not built yet. Always `available` false.
          $ref: '#/components/schemas/CompanyDropletStatusSection'
        connect:
          description: Not built yet. Always `available` false.
          $ref: '#/components/schemas/CompanyDropletStatusSection'
    CompanyDropletInstallation:
      type: object
      required:
      - uuid
      - droplet_uuid
      - droplet
      - status
      - scopes
      - effective_scopes
      - installed_by
      - lifecycle
      - created_at
      - updated_at
      properties:
        uuid:
          type: string
          description: The installation's public identifier.
        droplet_uuid:
          type: string
        droplet:
          type: object
          description: The droplet installed.
          required:
          - uuid
          - title
          - logo_url
          properties:
            uuid:
              type: string
            title:
              type:
              - string
              - 'null'
            logo_url:
              type:
              - string
              - 'null'
        role:
          description: The role the droplet acts with, or null. Present only when you have the `roles.view` permission.
          oneOf:
          - type: 'null'
          - type: object
            required:
            - id
            - uuid
            - name
            properties:
              id:
                type: integer
                deprecated: true
                description: 'Deprecated: use `uuid`.'
              uuid:
                type: string
                format: uuid
              name:
                type:
                - string
                - 'null'
        installed_by:
          description: Who installed it; null for installations made before this was recorded or by an API credential.
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CompanyDropletInstaller'
        status:
          type: string
          enum:
          - active
          - pending_uninstall
          - uninstalled
        lifecycle:
          $ref: '#/components/schemas/CompanyDropletInstallationLifecycle'
        scopes:
          type: array
          items:
            type: string
          description: The scopes granted.
        effective_scopes:
          type: array
          items:
            type: string
          description: 'The scopes in force: those granted, within what the droplet may request.'
        created_at:
          type: string
          format: date-time
          description: When it was installed.
        updated_at:
          type: string
          format: date-time
    CompanyDropletInstallationLifecycle:
      type: object
      description: What to tell the merchant about an installation, from its status and the latest lifecycle webhook delivery.
      required:
      - status
      - delivery_state
      - reason
      properties:
        status:
          type: string
          enum:
          - active
          - needs_attention
          - uninstalling
          - failed
          - uninstalled
          description: '`needs_attention`: active, but the install webhook was rejected, exhausted its retries or could not be queued. `failed`: the uninstall webhook was rejected, exhausted its retries or could not be queued while the installation is still `pending_uninstall`. A rejected or exhausted uninstall is finalized anyway, so the installation then reads `uninstalled`; one whose webhook could not be queued stays `pending_uninstall` until the uninstall is requested again.'
        delivery_state:
          type: string
          enum:
          - unknown
          - pending
          - enqueue_failed
          - retrying
          - delivered
          - rejected
          - exhausted
          description: The latest delivery's state, `unknown` when none was recorded.
        reason:
          type:
          - string
          - 'null'
          enum:
          - install_webhook_failed
          - liveness_failing
          - null
          description: 'Why the status is `needs_attention`: `install_webhook_failed` when the install webhook failed, `liveness_failing` when the droplet is failing its liveness checks. `null` for every other status.'
    CompanyDropletInstaller:
      type: object
