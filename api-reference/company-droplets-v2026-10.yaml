  /api/company/v2026-10/droplet-installations/{uuid}/rollback:
    parameters:
    - name: uuid
      in: path
      required: true
      description: The installation's uuid.
      schema:
        type: string
      example: dri_7hq2mxk4bnv8rlp3ctw6yzd1fgs9aje5
    post:
      operationId: rollbackCompanyDropletInstallation
      summary: Roll an installation back to an earlier version
      description: 'Points your company''s installation at an earlier version in its droplet''s ledger and queues a reconcile. A version outside the consent mark leaves the installation in `awaiting_consent`; rollback never widens the consent mark. Refused with 409 `reconcile_off` unless the droplet''s reconcile gate is `apply`. Needs the `droplets.update` permission and an `Idempotency-Key` header: repeating a key answers the first response.'
      tags:
      - droplets
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: A client-chosen key, 1 to 255 printable ASCII characters; anything else answers 422.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - version
              properties:
                version:
                  type: integer
                  minimum: 1
            example:
              version: 3
      responses:
        '202':
          description: Accepted and queued.
          content:
            application/json:
              schema:
                type: object
                required:
                - installation_uuid
                - status
                - meta
                properties:
                  installation_uuid:
                    type: string
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                installation_uuid: dri_7hq2mxk4bnv8rlp3ctw6yzd1fgs9aje5
                status: 202
                meta:
                  request_id: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-23T15:32:08Z'
        '404':
          description: The installation does not exist or belongs to another company (`installation_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`reconcile_off`, `not_adopted`, `reconcile_in_progress` or `already_at_version`. When `already_at_version` is returned after this call changed the installation''s operator pin, `details.pin` is `set` or `cleared`; it is absent when the pin did not change. Also the idempotency guard''s 409 for a key already in flight.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/IdempotencyRefusal'
        '422':
          description: '`idempotency_key_required`, a malformed key (over 255 characters or not printable ASCII), `unknown_version`, `below_min_supported`, `would_fail` (details.reason is the reconciler''s error code), or the guard''s 422 for a key reused with a different request.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/IdempotencyRefusal'
        '423':
          description: '`installation_not_active`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The idempotency claim store could not answer; retry the same request under the same key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdempotencyRefusal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/WriteForbidden'
