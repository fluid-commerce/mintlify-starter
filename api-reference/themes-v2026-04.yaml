  "/api/v202604/themes/{theme_id}/preview_comments/{client_id}/replies":
    post:
      summary: Reply to a preview comment
      description: |-
        Appends a reply. Authorship comes from the authenticated principal.
        Idempotent on the reply's `client_id`: repeating a request appends
        nothing and succeeds.

        Set `author_kind` to `agent` to record the agent's answer instead of a
        person's. A reply bound to the active run moves it from `handed` to
        `review`, and leaves every other status where a person put it: the agent
        can answer a thread but never close it, and never reopens one somebody
        decided. Reopening or skipping a thread revokes its run; later replies
        carrying that identity receive 409. While the run remains authorized,
        repeating its answer stores nothing and succeeds, so the same body
        cannot arrive twice under two ids.

        Replying is discussion and is never refused for belonging to work.
        When the thread belongs to a work item, though, the run that owns the
        thread is the work item's and not the comment's: an answer carrying
        any other identity receives 409, and an answer that does land leaves
        the thread where it is, because a linked thread's status belongs to
        the work item.
      tags: [preview comments]
      operationId: createThemePreviewCommentReply
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme the comment belongs to.
        schema: {type: integer}
      - name: client_id
        in: path
        required: true
        description: Client-generated id of the comment being replied to.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reply:
                  type: object
                  properties:
                    client_id:
                      type: string
                      description: Client-generated id for this reply.
                    body:
                      type: string
                      description: The reply text.
                    mentions:
                      type: array
                      description: People or projects mentioned in the reply.
                      items: {"$ref": "#/components/schemas/PreviewCommentMention"}
                    run_id:
                      type: string
                      maxLength: 255
                      description: The runtime run identity. A mismatched run receives 409; an unbound reply never changes status.
                    author_kind:
                      type: string
                      enum: [user, agent]
                      default: user
                      description: >-
                        Who the reply is recorded as. A matching active agent run moves
                        the comment to review; other replies leave status alone.
                    shot:
                      type: object
                      description: >-
                        Dimensions of the after screenshot. Absent when the
                        capture produced nothing, which is not an error.
                      properties:
                        width: {type: integer}
                        height: {type: integer}
                        asset_id:
                          type: integer
                          description: The uploaded image.
                      required: [width, height, asset_id]
                    proof:
                      type: object
                      description: >-
                        Evidence around the screenshot. Every part is optional;
                        a reply explaining why there is no picture beats a
                        refused write.
                      properties:
                        route: {type: string}
                        files:
                          type: array
                          items: {type: string}
                        before:
                          type: object
                          description: >-
                            The image this work was compared against, by asset
                            id — so replacing the comment's baseline later does
                            not change what this reply appears to have compared.
                          properties:
                            asset_id: {type: integer}
                          required: [asset_id]
                        checks:
                          type: array
                          items:
                            "$ref": "#/components/schemas/PreviewCommentProofCheck"
                        record_changes:
                          type: array
                          maxItems: 50
                          description: The company records the run changed through the API.
                          items:
                            "$ref": "#/components/schemas/PreviewCommentRecordChange"
                        data_snapshots:
                          type: array
                          maxItems: 3
                          description: The reads Mist named before its work, read again after.
                          items:
                            "$ref": "#/components/schemas/PreviewCommentDataSnapshot"
                  required: [client_id, body]
              required: [reply]
