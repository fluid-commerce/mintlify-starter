  "/api/v202604/themes/{theme_id}/templates/{id}":
    get:
      summary: Get one template, with its Liquid body
      description: |-
        The only endpoint on this surface that serves template `content`, and
        it serves exactly one. Together with the templates list this reaches
        the same data as the v0 bulk response without any request being forced
        to 5.5MB.

        Scoped through the theme, so a template belonging to another company's
        theme 404s.
      tags: [themes]
      operationId: getThemeTemplate
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: The theme the template belongs to.
        schema: {type: integer}
      - name: id
        in: path
        required: true
        description: The template's id.
        schema: {type: integer}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    "$ref": "#/components/schemas/ThemeTemplate"
                required: [template]
              example:
                template:
                  id: 902114
                  name: Home
                  themeable_type: home_page
                  status: active
                  default: true
                  global: false
                  source: theme
                  application_theme_id: 48213
                  company_id: 1405
                  app_extension_id: null
                  extension_uri: null
                  droplet_name: null
                  country_ids: []
                  hide_navbar: false
                  use_active_application_theme: false
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  created_at: '2026-03-02T18:11:26Z'
                  updated_at: '2026-09-14T15:02:11Z'
                  content: '{% section ''hero-banner'' %}

                    {% section ''featured-products'' %}

                    {% section ''testimonials'' %}'
                  variables:
                    hero_heading: Limitless Paper in a Paperless World
                  translations:
