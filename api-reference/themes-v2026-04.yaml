        Live comments with their replies nested, ordered by creation time and
        then by `client_id`. Deleted comments are absent from `preview_comments`
        and present in `deleted_client_ids`, which is what lets a client tell a
        deletion apart from a comment it has simply not seen.
      tags: [preview comments]
      operationId: listThemePreviewComments
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme whose comments to list.
        schema: {type: integer}
      responses:
        '200':
          description: The theme's live comments, plus the ids of deleted ones.
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview_comments:
                    type: array
                    description: Live comments, replies nested.
                    items:
                      "$ref": "#/components/schemas/PreviewComment"
                  deleted_client_ids:
                    type: array
                    description: Client ids of comments that have been deleted.
                    items: {type: string}
                  status:
                    type: integer
                    description: HTTP status, repeated in the body.
