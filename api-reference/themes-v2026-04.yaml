---
openapi: 3.1.0
info:
  title: Fluid Themes API
  description: |-
    **The versioned themes surface.**

    Themes v0 (`/api/application_themes`) remains in place and unchanged — the
    theme editor and the Fluid CLI consume it and depend on its shape,
    including the heavy fields this version omits. That immovability is why
    this version exists: here the DEFAULT response is the lean one.

    Concretely, measured against production:

    - `GET /api/application_themes` returns the deprecated theme-level
      stylesheet columns on every row. For a three-theme company that is a
      185KB response of which `global_stylesheet` alone is 182KB.
    - `GET /api/application_themes/active` renders every template with its
      Liquid `content`. On a 245-template theme that is 5.5MB, 96.5% of it
      template bodies, when callers typically need only `id`,
      `themeable_type` and `default` to resolve a single template.

    The path segment here is `themes`, not `application_themes`.
  version: v2026-04
  contact:
    email: support@fluid.app
servers:
- url: https://api.fluid.app
security:
- bearer_auth: []
tags:
- name: themes
  description: Theme listing and the active theme.
- name: preview comments
  description: |-
    Comments pinned to an element on a theme's preview, and their replies.

    A comment is addressed by the client-generated `client_id` rather than a
    row id: that is the identity every client already holds, so a retry after
    a dropped response is the same request rather than a new one. Creating a
    comment or a reply twice under one id is a success that changes nothing.

    There is one route per operation rather than a single write of the whole
    comment set. `status` is a last-writer-wins register keyed on
    `status_at_ms`, so a write carrying an older stamp than the stored one is
    accepted and discarded — it answers 200 with the status unchanged, because
    the request did what the contract says.
paths:
  "/api/v202604/themes":
    get:
      summary: List the company's themes
      description: |-
        Themes reduced to what a picker needs — `name`, `version`, `status`,
        `cover_image`. Same filtering, sorting and pagination as themes v0.
      tags: [themes]
      operationId: listThemes
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        description: Page of results to return. Defaults to 1.
        schema: {type: integer}
      - name: per_page
        in: query
        required: false
        description: Results per page. Defaults to 10.
        schema: {type: integer}
      - name: search_query
        in: query
        required: false
        description: Free-text filter on the theme name.
        schema: {type: string}
      - name: sorted_by
        in: query
        required: false
        description: 'Sort key and direction, e.g. `created_at_desc`. Defaults to `created_at_desc`.'
        schema: {type: string}
      - name: status
        in: query
        required: false
        description: Restrict to themes with this status.
        schema: {type: string}
      - name: root_themes
        in: query
        required: false
        description: Return the shared root (marketplace) themes instead of the company's own.
        schema: {type: boolean}
      - name: include_development
        in: query
        required: false
        description: Include development themes, which are omitted by default.
        schema: {type: boolean}
      - name: include_default_home_template
        in: query
        required: false
        description: |-
          Resolve each theme's default home-page template id into
          `default_home_template_id`. Off by default — it costs an extra query
          per page and only the theme editor needs it.
        schema: {type: boolean}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ThemeSummary"
                  meta:
                    "$ref": "#/components/schemas/PaginationMeta"
                required: [themes, meta]
              example:
                themes:
                - id: 48213
                  name: Scranton Storefront
                  version: '7'
                  status: active
                  source: fluid
                  company_id: 1405
                  cover_image: https://cdn.fluid.app/dunder-mifflin/themes/48213/cover.png
                  outdated: false
                  updated_at: '2026-09-14T15:02:11Z'
                - id: 48240
                  name: Holiday Paper Drive
                  version: '2'
                  status: draft
                  source: fluid
                  company_id: 1405
                  cover_image: https://cdn.fluid.app/dunder-mifflin/themes/48240/cover.png
                  outdated: true
                  updated_at: '2026-09-10T11:47:03Z'
                meta:
                  current_page: 1
                  total_pages: 1
                  total_count: 2
                  per_page: 10
        '401':
          description: Unauthorized
  "/api/v202604/themes/{id}":
    get:
      summary: Get one theme
      description: |-
        A single theme in full — stylesheets, versions, images, GitSync repos.

        Templates are NOT embedded; they are a sub-resource at
        `/api/v202604/themes/{id}/templates`. Embedding them is what makes the
        v0 responses 5.5MB on a 245-template theme.
      tags: [themes]
      operationId: getTheme
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The theme's id.
        schema: {type: integer}
      - name: version
        in: query
        required: false
        description: Resolve a historical snapshot of the theme.
        schema: {type: integer}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  theme:
                    "$ref": "#/components/schemas/ThemeDetail"
                required: [theme]
              example:
                theme:
                  id: 48213
                  name: Scranton Storefront
                  version: '7'
                  status: active
                  source: fluid
                  description: Dunder Mifflin's main storefront theme for shop.dundermifflin.com.
                  variables: '{"color_primary":"#1f3b73","font_heading":"Montserrat"}'
                  company_id: 1405
                  cover_image: https://cdn.fluid.app/dunder-mifflin/themes/48213/cover.png
                  custom_stylesheet: '.hero__title { letter-spacing: -0.01em; }'
                  global_stylesheet: ':root { --color-primary: #1f3b73; }'
                  versions:
                  - version: 7
                    created_at: '2026-09-14T15:02:11Z'
                    published: true
                    current: true
                    author_id: 52001
                    author_name: Michael Scott
                  - version: 6
                    created_at: '2026-09-09T16:20:48Z'
                    published: false
                    current: false
                    author_id: 52018
                    author_name: Pam Beesly
                  images:
                  - id: 66120
                    url: https://cdn.fluid.app/dunder-mifflin/themes/48213/cover.png
                    position: 1
                  git_sync_repos:
                  - id: 3108
                    role: primary
                    status: connected
                    repo_full_name: fluid-themes/dunder-mifflin-scranton-storefront
                    default_branch: main
                    last_push_at: '2026-09-14T15:02:40Z'
                    last_pull_at: '2026-09-14T14:58:02Z'
                    status_updated_at: '2026-09-14T15:02:40Z'
                    last_error: null
                  created_at: '2026-03-02T18:11:26Z'
                  updated_at: '2026-09-14T15:02:11Z'
        '401': {description: Unauthorized}
        '404': {description: No such theme for this company}
  "/api/v202604/themes/{theme_id}/templates":
    get:
      summary: List a theme's templates
      description: |-
        Template metadata — no Liquid `content`. Fetch a body one at a time
        from `/api/v202604/themes/{theme_id}/templates/{id}`.
      tags: [themes]
      operationId: listThemeTemplates
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: The theme's id.
        schema: {type: integer}
      - name: themeable_type
        in: query
        required: false
        description: |-
          Restrict to one or more themeable types, comma-separated for several.
          Unknown values match nothing.
        schema: {type: string}
        example: page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
