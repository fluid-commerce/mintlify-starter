  "/api/v202604/themes/{theme_id}/preview_comments/{client_id}/backstop-reply":
    post:
      summary: Record an unanswered turn without overriding a newer decision
      description: |-
        Append an unanswered-turn reply only while the observed run and record
        version still own an active comment. The checks and reply share a row
        lock. A newer decision or answer returns 409 with the current comment.
        Reply identity prevents duplicate writes during retries.

        The reply's `client_id` is validated before the run and version are
        compared, so a malformed id is 422 whether or not they still match.

        The reply may carry the same `shot` and `proof` an answer carries: the
        page as the turn left it, and the before taken when the run started.
        They are evidence of what the turn left behind, not a claim that the
        comment was addressed.

        When the thread belongs to a work item, the run and the active state
        are read off the work item rather than the comment; the version stays
        the comment's own and is never translated between the two registers.
      tags: [preview comments]
      operationId: createThemePreviewCommentBackstopReply
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme that owns the comment.
        schema: {type: integer}
      - name: client_id
        in: path
        required: true
        description: Client-generated id of the root comment.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply, run_id, expected_version]
              properties:
                reply:
                  type: object
                  required: [client_id, body]
                  properties:
                    client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: "^[A-Za-z0-9_-]+$"
                      description: >-
                        Stable reply id for this turn's retryable backstop.
                        Letters, digits, underscore and hyphen only — the same
                        charset every comment and reply id is stored under.
                        Checked before the run and version, so a malformed id
                        is 422 whether or not they still match.
                    body:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: Explanation that the turn did not post an answer.
                    shot:
                      type: object
                      description: >-
                        The page as the turn left it, captured when the turn
                        ended. Absent when the capture produced nothing, which
                        is not an error.
                      properties:
                        width: {type: integer, minimum: 1}
                        height: {type: integer, minimum: 1}
                        asset_id:
                          type: integer
                          minimum: 1
                          description: The uploaded image.
                      required: [width, height, asset_id]
                    proof:
                      type: object
                      description: >-
                        Evidence around the screenshot, in the shape an answer
                        carries. Every part is optional; the backstop lands
                        with or without it.
                      properties:
                        route: {type: string}
                        files:
                          type: array
                          items: {type: string}
                        before:
                          type: object
                          description: >-
                            The image taken before this run started, by asset
                            id, so a later baseline does not change what this
                            reply compares against.
                          properties:
                            asset_id: {type: integer, minimum: 1}
                          required: [asset_id]
                        checks:
                          type: array
                          items:
                            "$ref": "#/components/schemas/PreviewCommentProofCheck"
                        record_changes:
                          type: array
                          maxItems: 50
                          description: The company records the run changed through the API.
                          items:
                            "$ref": "#/components/schemas/PreviewCommentRecordChange"
                        data_snapshots:
                          type: array
                          maxItems: 3
                          description: The reads Mist named before its work, read again after.
                          items:
                            "$ref": "#/components/schemas/PreviewCommentDataSnapshot"
                run_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: The runtime identity of the active unanswered run.
                expected_version:
                  type: integer
                  minimum: 0
                  description: The observed lock_version, checked atomically with the run identity.
            example:
              reply:
                client_id: backstop-run_01J8Z3K4QF7M2V9XB6T0RC5HWD
                body: This turn ended without posting an answer. The run stopped before it could change the hero section;
                  send it again to retry.
              run_id: run_01J8Z3K4QF7M2V9XB6T0RC5HWD
              expected_version: 4
      responses:
        '200':
          description: The current comment with the backstop recorded.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreviewCommentEnvelope"
              example:
                preview_comment:
                  id: 31877
                  run_id: run_01J8Z3K4QF7M2V9XB6T0RC5HWD
                  lock_version: 5
                  client_id: c-3f9a2e71
                  n: 4
                  body: The hero headline wraps onto three lines on mobile. Can we tighten it so it fits on two?
                  status: review
                  status_at_ms: 1789467150000
