      summary: Get the active theme
      description: |-
        The active theme itself. Templates are not embedded — see
        `/api/v202604/themes/active/templates`.
      tags: [themes]
      operationId: getActiveTheme
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  theme:
                    "$ref": "#/components/schemas/ThemeSummary"
                required: [theme]
              example:
                theme:
                  id: 48213
                  name: Scranton Storefront
                  version: '7'
                  status: active
                  source: fluid
                  company_id: 1405
                  cover_image: https://cdn.fluid.app/dunder-mifflin/themes/48213/cover.png
                  outdated: false
                  updated_at: '2026-09-14T15:02:11Z'
        '401':
          description: Unauthorized
        '404':
          description: The company has no active theme
  "/api/v202604/themes/active/templates":
    get:
      summary: List the active theme's templates
      description: |-
        Template metadata — no Liquid `content`.

        An active theme carries roughly 245 templates, of which ~183 are the
        shared `sections` library and ~19 are `locales`. Use `themeable_type`
        to fetch only what you need.
      tags: [themes]
      operationId: listActiveThemeTemplates
      security:
      - bearer_auth: []
      parameters:
      - name: themeable_type
        in: query
        required: false
        description: |-
          Restrict to one or more themeable types, comma-separated for several
          (`home_page,post_page`). Unknown values match nothing.
        schema:
          type: string
        example: home_page
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ThemeTemplateSummary"
                required: [templates]
              example:
                templates:
                - id: 902114
                  name: Home
                  themeable_type: home_page
                  status: active
                  default: true
                  global: false
                  source: theme
                  application_theme_id: 48213
                  company_id: 1405
                  app_extension_id: null
                  extension_uri: null
                  droplet_name: null
                  country_ids: []
                  hide_navbar: false
                  use_active_application_theme: false
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  created_at: '2026-03-02T18:11:26Z'
                  updated_at: '2026-09-14T15:02:11Z'
        '401':
          description: Unauthorized
        '404':
          description: The company has no active theme
  "/api/v202604/themes/{theme_id}/preview_comments":
