  "/api/v202604/themes/{theme_id}/preview_comments/{client_id}":
    patch:
      summary: Move a preview comment's status
      description: |-
        Applies the status only when expected_version equals the current comment lock_version.
        A stale version returns 409 with the current comment in error.details.preview_comment.
        Status timestamps are recorded by the server and do not order writes.

        A thread that belongs to a work item is not writable workflow here.
        This returns 409 with the current comment in
        `error.details.preview_comment`, and the work is changed through the
        work item instead. Draining is how a company reaches that state: a
        thread a client is still executing is never linked to work. A thread
        that belongs to no work behaves exactly as it always has.
      tags: [preview comments]
      operationId: updateThemePreviewComment
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme the comment belongs to.
        schema: {type: integer}
      - name: client_id
        in: path
        required: true
        description: Client-generated id of the comment.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview_comment:
                  type: object
                  properties:
                    status:
                      type: string
                      description: The status to move to.
                      enum: [open, skipped, needs_info]
                    expected_version:
                      type: integer
                      minimum: 0
                      description: The lock_version from the comment being changed.
                  required: [status, expected_version]
              required: [preview_comment]
            example:
              preview_comment:
                status: needs_info
                expected_version: 3
      responses:
        '200':
          description: The comment, moved or left as it was.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreviewCommentEnvelope"
              example:
                preview_comment:
                  id: 31877
                  run_id: null
                  lock_version: 4
                  client_id: c-3f9a2e71
                  n: 4
                  body: The hero headline wraps onto three lines on mobile. Can we tighten it so it fits on two?
                  status: needs_info
                  status_at_ms: 1789464365000
                  page_url: /
                  author_name: Michael Scott
                  created_at_ms: 1789398131000
                  theme_changed_at: null
                  template_id: 902114
                  section:
                    id: hero-banner-1
                    type: hero-banner
                  block: null
                  target:
                    tag: h1
