  "/api/v202604/themes/{theme_id}/preview_comments/{client_id}/proof_baseline":
    put:
      summary: Record a preview comment's proof baseline
      description: |-
        Stores the page as it looked before the work started, so an after shot
        on a reply has something to be compared against.

        Its own operation because it is its own register. `captured_at_ms` is
        compared only against the stored baseline's stamp, never against the
        status stamp, so a write rejected for carrying an older status does not
        also drag the baseline backwards. A write carrying an older stamp is
        discarded and answered 200 with the comment unchanged, exactly as a
        losing status write is.

        `shot` is optional, and a request without one is not an error: it
        records that a capture was attempted and produced nothing, which is
        what stops a reader taking the previous attempt's baseline for this
        one's.
      tags: [preview comments]
      operationId: recordThemePreviewCommentProofBaseline
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme the comment belongs to.
        schema: {type: integer}
      - name: client_id
        in: path
        required: true
        description: Client-generated id of the comment.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof_baseline:
                  type: object
                  properties:
                    captured_at_ms:
                      type: integer
                      description: |-
                        When the capture was taken, in milliseconds since the
                        epoch. The key this register compares on.
                    shot:
                      type: object
                      description: >-
                        The image's dimensions. Absent when the capture
                        produced nothing.
                      properties:
                        width: {type: integer}
                        height: {type: integer}
                        asset_id:
                          type: integer
                          description: >-
                            The uploaded image. Without it the dimensions are
                            stored and no picture is ever served, because the
                            image is read from the asset attached to the
                            comment. An id naming another company's asset
                            attaches nothing and the url reads null.
                      required: [width, height, asset_id]
                  required: [captured_at_ms]
              required: [proof_baseline]
            example:
              proof_baseline:
                captured_at_ms: 1789464360000
                shot:
                  width: 1440
                  height: 900
                  asset_id: 77104
      responses:
        '200':
          description: The comment, with the baseline recorded or left as it was.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreviewCommentEnvelope"
              example:
