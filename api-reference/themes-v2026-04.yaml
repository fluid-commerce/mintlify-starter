  "/api/v202604/themes/{theme_id}/preview_comments/{client_id}/position":
    put:
      summary: Place a preview comment's card on the Tasks board
      description: |-
        Stores where the comment's card sits on the Tasks board: a canonical
        fractional index the client computed between the card's new
        neighbours, so moving one card rewrites only that card, or null to take
        it out of the order. Positions follow the fractional-indexing format
        (the first character gives the integer part's length and the fraction
        never ends in 0), which always leaves room between two keys; a key that
        is not canonical is refused. They order the whole board, in the same
        order work items keep, and equal positions are ordered by id.

        Its own operation because it is its own register, resolved exactly as
        priority is. `board_position_at_ms` is compared only against the
        stored position's stamp, and placing a card never changes the
        comment's `lock_version`, so placing a card and moving its status in
        the same moment both land. A write carrying an older stamp is discarded
        and answered 200 with the comment unchanged; an equal stamp is taken by
        the incoming write. A null still carries its stamp, so a cleared
        position is not restored by a later write holding an older one.

        A thread that belongs to a work item is not writable workflow here.
        This returns 409 with the current comment in
        `error.details.preview_comment`; the work item holds the card's
        position instead.
      tags: [preview comments]
      operationId: modifyThemePreviewCommentBoardPosition
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme the comment belongs to.
        schema: {type: integer}
        example: 42
      - name: client_id
        in: path
        required: true
        description: Client-generated id of the comment.
        schema: {type: string}
        example: c-7f3a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position_change:
                  type: object
                  properties:
                    board_position_at_ms:
                      type: integer
                      minimum: 1
                      maximum: 253402300799999
                      description: |-
                        When the card was placed, in milliseconds since the
                        epoch, up to the end of year 9999. The key this
                        register compares on. A stamp ahead of the server's
                        clock is stored as the server's time, so a client
                        clock running fast cannot hold the card still.
                    board_position:
                      type: [string, 'null']
                      pattern: '^[0-9A-Za-z]+$'
                      maxLength: 255
                      description: >-
                        The canonical fractional index to store, or null to take
                        the card out of the order.
                  required: [board_position_at_ms, board_position]
              required: [position_change]
            example:
              position_change:
                board_position_at_ms: 1789000000000
                board_position: a0V
      responses:
        '200':
          description: The comment, with the position stored or left as it was.
