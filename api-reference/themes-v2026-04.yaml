    post:
      summary: Pin a comment on a theme's preview
      description: |-
        Creates a comment. Authorship comes from the authenticated principal, so
        there is no author field to send.

        Idempotent on `client_id`: repeating a request returns the stored comment
        rather than creating a second one. `template_id` is required and must
        belong to this theme — the rendered page carries the identity, so a
        client that cannot supply it has not resolved what it is commenting on.
      tags: [preview comments]
      operationId: createThemePreviewComment
      security:
      - bearer_auth: []
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Id of the theme to pin the comment on.
        schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preview_comment:
                  "$ref": "#/components/schemas/PreviewCommentCreate"
              required: [preview_comment]
            example:
              preview_comment:
                client_id: c-3f9a2e71
                body: The hero headline wraps onto three lines on mobile. Can we tighten it so it fits on two?
                template_id: 902114
                number: 4
                page_path: /
                pin:
                  x: 48.2
                  y: 22.7
                  ox: 0.41
                  oy: 0.63
                section:
                  id: hero-banner-1
                  type: hero-banner
                anchor:
                  tag: h1
                  selector: section[data-section-id="hero-banner-1"] h1.hero__title
                  text: Limitless Paper in a Paperless World
                  html: <h1 class="hero__title">Limitless Paper in a Paperless World</h1>
                mentions:
                - id: '52018'
                  name: Pam Beesly
      responses:
        '201':
          description: The stored comment.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PreviewCommentEnvelope"
              example:
                preview_comment:
