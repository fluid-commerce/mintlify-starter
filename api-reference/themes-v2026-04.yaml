  "/api/v202604/themes/{theme_id}/member-preview":
    post:
      summary: Render a draft member page or system screen
      description: |-
        Authoring preview for company administrators with theme view permission.
        Select a site belonging to the theme and exactly one page or system screen.
        Unpublished pages and draft themes are supported. Content comes from the
        selected theme's stored templates, sections, settings and site navigation.
        No role means unrestricted authoring; member_type_id selects a synthetic
        audience and applies site access rules. Private member collections are
        not loaded. This endpoint neither authenticates a member nor publishes
        content. Responses must not be cached. The CLI keeps its bearer token on
        its local server and serves the returned HTML without the builder base tag.
        Body/resource overrides are ignored; system-screen bodies remain sealed.
      tags: [themes]
      operationId: renderMemberPreview
      parameters:
      - name: theme_id
        in: path
        required: true
        description: Company-owned theme to preview, including a draft theme.
        schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [members_site_id]
              oneOf:
              - required: [members_page_id]
                not: {required: [system_screen_key]}
              - required: [system_screen_key]
                not: {required: [members_page_id]}
              properties:
                members_site_id:
                  type: integer
                  minimum: 1
                  description: Site belonging to the selected theme.
                members_page_id:
                  type: integer
                  minimum: 1
                  description: Page belonging to the selected site, with a template in this theme.
                system_screen_key:
                  type: string
                  minLength: 1
                  description: Registered system screen key, such as messaging.
                country_id:
                  type: integer
                  minimum: 1
                  description: Active company country; defaults to the company's default country.
                language_id:
                  type: integer
                  minimum: 1
                  description: Active company language; defaults to the company's default language.
                member_type_id:
                  type: string
                  minLength: 1
                  description: Company member type for sample audience matching; omit for unrestricted authoring.
            example:
              members_site_id: 7310
              members_page_id: 18422
              member_type_id: brand-partner
      responses:
        "200":
          description: Sample preview, including an access-denied view when the chosen role cannot access this site.
          headers:
            Cache-Control:
              description: Prevent storage of authoring previews.
              schema: {type: string, const: "private, no-store"}
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemberPreviewResponse"
              example:
                preview:
                  mode: sample
                  contract_version: 1
                  theme_id: 48213
                  members_site_id: 7310
                  members_page_id: 18422
                  system_screen_key: null
                  html_content: <main class="members-page"><h1>Welcome back to the Dunder Mifflin rep portal</h1></main>
                  page_stylesheet: '.members-page { max-width: 72rem; margin: 0 auto; }'
                  template_stylesheet: null
                  preview_audience:
                    kind: sample_member
                    member_type_id: brand-partner
                    matched_site_id: 7310
                    selected_site_accessible: true
                status: 200
                meta:
                  request_uuid: 7c1e9a52-4b3d-4f0e-9d2a-81f6c3b5e240
                  timestamp: '2026-09-15T09:26:05Z'
        "401":
          description: Missing or invalid CLI/admin credential.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "403":
          description: Credential lacks company administration or theme view permission.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        "404":
          description: Feature disabled, foreign or stale selection, unknown screen, or unavailable audience/locale.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemberPreviewError"
        "422":
          description: Invalid selection; supply exactly one page or screen.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MemberPreviewError"
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
  schemas:
    MemberPreviewError:
      type: object
      description: Preview selection or rendering failure.
      required: [error, status, meta]
      properties:
        error:
          type: object
          required: [message, details]
          properties:
            message: {type: string}
            details: {type: object}
        status: {type: integer}
        meta: {type: object}
    MemberPreviewResponse:
      type: object
      description: Synthetic authoring render; no real member session or private collections.
      required: [preview, status, meta]
      properties:
        status: {type: integer, const: 200}
        meta: {type: object}
        preview:
          type: object
          required: [mode, contract_version, theme_id, members_site_id, members_page_id, system_screen_key, html_content, page_stylesheet, template_stylesheet, preview_audience]
          properties:
            mode: {type: string, const: sample}
            contract_version: {type: integer, const: 1}
            theme_id: {type: integer}
            members_site_id: {type: integer}
            members_page_id: {type: [integer, "null"]}
            system_screen_key: {type: [string, "null"]}
            html_content: {type: string}
            page_stylesheet: {type: [string, "null"]}
            template_stylesheet: {type: [string, "null"]}
            preview_audience:
              type: object
              required: [kind, member_type_id, matched_site_id, selected_site_accessible]
              properties:
                kind: {type: string, enum: [guest, sample_member]}
                member_type_id: {type: [string, "null"]}
                matched_site_id: {type: [integer, "null"]}
                selected_site_accessible: {type: [boolean, "null"]}
    PreviewCommentResponseMeta:
      type: object
      description: Envelope metadata returned on every preview-comment response.
      properties:
        request_uuid:
          type: [string, "null"]
          description: Correlation id for this request, when one was assigned.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
      required: [request_uuid, timestamp]
    PreviewCommentError:
      type: object
      description: The error envelope returned by the preview-comment routes.
      properties:
        error:
          type: object
          description: What went wrong.
          properties:
            message:
              type: string
              description: Human-readable description of the failure.
            details:
              type: object
              description: |-
                Machine-readable detail. Carries `type` — the failure's symbol,
                such as `not_found` or `validation_failed` — when the failure
                came from the domain rather than from parameter validation.
          required: [message, details]
        status:
          type: integer
          description: HTTP status, repeated in the body.
        meta:
          "$ref": "#/components/schemas/PreviewCommentResponseMeta"
      required: [error, status, meta]
    PreviewCommentEnvelope:
      type: object
      description: A single comment, wrapped in the standard response envelope.
      properties:
        preview_comment:
          "$ref": "#/components/schemas/PreviewComment"
        status:
          type: integer
          description: HTTP status, repeated in the body.
        meta:
          "$ref": "#/components/schemas/PreviewCommentResponseMeta"
      required: [preview_comment, status, meta]
    PreviewCommentPin:
      type: object
      description: |-
        Where the pin sits. `x` and `y` are percentages of the viewport; `ox`
        and `oy` are the click's offset within the anchored element, from 0 to
        1, so two pins on one image stay apart. The offsets are null on
        comments made before they were recorded.
      properties:
        x: {type: number, description: Horizontal position, as a percentage of the viewport.}
        y: {type: number, description: Vertical position, as a percentage of the viewport.}
        ox: {type: [number, "null"], description: Horizontal offset within the element, 0 to 1.}
        oy: {type: [number, "null"], description: Vertical offset within the element, 0 to 1.}
      required: [x, y, ox, oy]
    PreviewCommentTarget:
      type: object
      description: |-
        The element the comment was pinned to. Null when the click landed on
        nothing resolvable, which clients already tolerate.
      properties:
        tag: {type: [string, "null"], description: Tag name of the element.}
        selector: {type: [string, "null"], description: CSS selector that located the element.}
        text: {type: [string, "null"], description: Text quoted from the element at pin time.}
        html: {type: [string, "null"], description: Truncated outer HTML of the element.}
      required: [tag, selector, text, html]
    PreviewCommentThemeRef:
      type: object
      description: |-
        Theme identity of the pinned element. `type` names the file — a section
        renders from `sections/<type>/index.liquid` — and `id` names which
        instance of it is on the page. More durable than the selector, which
        dies when markup changes.
      properties:
        id: {type: [string, "null"], description: Identity of this instance in the template schema.}
        type: {type: [string, "null"], description: Type name, which is the file.}
      required: [id, type]
    PreviewCommentShot:
      type: object
      description: |-
        Proof screenshot attached to a reply. `url` is null when the image was
        recorded but is not retrievable, so a client must treat a present
        object with a null url as "no image to show" rather than an error.
      properties:
        url: {type: [string, "null"], description: Where to fetch the image.}
        width: {type: [integer, "null"], description: Intrinsic width in pixels.}
        height: {type: [integer, "null"], description: Intrinsic height in pixels.}
      required: [url, width, height]
    PreviewCommentProofBaseline:
      type: object
      description: |-
        The page before the work started, carried by the comment. Its
        `captured_at_ms` is its own register: it is compared only against a
        stored baseline's stamp, never against the status stamp.

        A present object with a null url means the capture was recorded but is
        not retrievable — which is not the same as no baseline, and must not be
        rendered as a broken image.
      properties:
        url: {type: [string, "null"], description: Where to fetch the image.}
        width: {type: [integer, "null"], description: Intrinsic width in pixels.}
        height: {type: [integer, "null"], description: Intrinsic height in pixels.}
        captured_at_ms:
          type: integer
          description: When the capture was taken, in milliseconds.
      required: [url, width, height, captured_at_ms]
    PreviewCommentProofCheck:
      type: object
      description: One mechanical result a reviewer reads alongside the images.
      properties:
        label: {type: string, description: What was checked.}
        status:
          type: string
          enum: [pass, warn, fail]
          description: How it came out.
        detail:
          type: string
          description: Why, when it did not pass.
      required: [label, status]
    PreviewCommentProof:
      type: object
      description: |-
        What a reviewer reads instead of taking "I fixed it" on trust: the
        route the change was measured on, the image it was compared against,
        what changed on disk, and the mechanical results.

        Every part is optional. A capture that did not happen is an ordinary
        outcome, and a reply explaining why there is no picture is worth more
        than a refused write.
      properties:
        route:
          type: [string, "null"]
          description: The page this was measured on.
        before:
          type: ["object", "null"]
          description: >-
            The image the work was compared against — the comment's baseline as
            it stood when this reply was written, so replacing the baseline
            later does not change what this reply appears to have compared.
          properties:
            url: {type: [string, "null"], description: Where to fetch the image.}
          required: [url]
        files:
          type: array
          description: Paths that changed on disk.
          items: {type: string}
        checks:
          type: array
          description: Mechanical results, each pass, warn or fail.
          items: {"$ref": "#/components/schemas/PreviewCommentProofCheck"}
        record_changes:
          type: array
          description: >-
            The company records the run changed through the API, each field
            before and after; empty when it changed none.
          items: {"$ref": "#/components/schemas/PreviewCommentRecordChange"}
        data_snapshots:
          type: array
          description: >-
            The reads Mist named before its work, read again after; empty when
            it named none.
          items: {"$ref": "#/components/schemas/PreviewCommentDataSnapshot"}
      required: [route, before, files, checks]
    PreviewCommentDataSnapshot:
      type: object
      description: >-
        A read Mist named before changing anything, read again when it
        finished: each value before and after, and a series to chart when the
        read is one. A side with no values says why.
      properties:
        label:
          type: string
          maxLength: 200
          description: What the read shows, such as "Best sellers, last 30 days".
        path:
          type: string
          maxLength: 2048
          description: The API path read with GET, with its query.
        rows:
          type: array
          maxItems: 40
          description: Each value read, before and after as text, changed ones first.
          items: {"$ref": "#/components/schemas/PreviewCommentRecordChangeField"}
        series:
          type: object
          description: A list in the read that pairs a label with a number.
          properties:
            name: {type: string, maxLength: 100}
            before:
              type: array
              maxItems: 120
              items: {"$ref": "#/components/schemas/PreviewCommentSeriesPoint"}
            after:
              type: array
              maxItems: 120
              items: {"$ref": "#/components/schemas/PreviewCommentSeriesPoint"}
          required: [name]
        before_at:
          type: string
          maxLength: 40
          description: When the before was read, as ISO 8601.
        after_at:
          type: string
          maxLength: 40
          description: When the after was read, as ISO 8601.
        before_missing:
          type: string
          maxLength: 500
        after_missing:
          type: string
          maxLength: 500
        truncated:
          type: boolean
          description: True when values were left out or shortened.
        values_withheld:
          type: boolean
          readOnly: true
          description: >-
            Set by the server, never sent: true when this reader is not a
            person signed in to the company, so each row is listed without its
            values and there is no series.
      required: [label, path, rows]
    PreviewCommentSeriesPoint:
      type: object
      properties:
        x: {type: string, maxLength: 60, description: The point's label, such as a date.}
        y: {type: number}
      required: [x, y]
    PreviewCommentRecordChange:
      type: object
      description: >-
        One company record a run wrote through the API. A side the run has no
        values for says why in before_missing or after_missing.
      properties:
        label:
          type: string
          maxLength: 200
          description: What happened to the record, such as "Updated product".
        method:
          type: string
          enum: [POST, PATCH, PUT, DELETE]
        path:
          type: string
          maxLength: 2048
          description: The API path of the record.
        outcome:
          type: string
          enum: [applied, failed, uncertain]
          description: >-
            applied when the API accepted the write; failed when it refused it;
            uncertain when the response was lost and a read afterwards found it
            applied.
        fields:
          type: array
          maxItems: 15
          items: {"$ref": "#/components/schemas/PreviewCommentRecordChangeField"}
        before_missing:
          type: string
          maxLength: 500
          description: Why the record has no values from before the run.
        after_missing:
          type: string
          maxLength: 500
          description: Why the record has no values after the run.
        truncated:
          type: boolean
          description: True when fields or values were shortened to fit.
        values_withheld:
          type: boolean
          readOnly: true
          description: >-
            Set by the server, never sent: true when this reader is not a
            person signed in to the company, such as a Droplet or an API
            token, so each field is listed without its values.
      required: [label, method, path, outcome, fields]
    PreviewCommentRecordChangeField:
      type: object
      description: One changed field, its value before and after as text.
      properties:
        path:
          type: string
          maxLength: 200
          description: The field, as a dot path within the record; empty for the whole value.
        before:
          type: string
          maxLength: 200
          description: Absent when the run added the field.
        after:
          type: string
          maxLength: 200
          description: Absent when the run removed the field.
      required: [path]
    PreviewCommentMention:
      type: object
      description: |-
        One mention on a comment or reply. A person, or a project distinguished
        by a `project:` prefix on its id — `project:theme-873`. The prefix
        rather than a separate field, because the desktop stores both in one
        list and tells them apart the same way.
      properties:
        id:
          type: string
          description: The mentioned person's id, or `project:` plus the project's own id.
        name:
          type: string
          description: The name as it was written in the body.
        kind:
          type: string
          description: Present on a project mention — theme, portal, mist, or mysite.
        role:
          type: string
          description: Present on a person, when the roster reported one.
      required: [id, name]
      additionalProperties: false
    PreviewCommentMentionedProject:
      type: object
      description: |-
        The project a comment is about, taken from the first project mentioned.
        Stored as its own columns so "which comments are about this project" is
        an indexed query rather than a scan of every comment's mentions.
      properties:
        kind:
          type: string
          description: theme, portal, mist, or mysite.
        ref:
          type: string
          description: The project's id within that kind.
      required: [kind, ref]
      additionalProperties: false
    PreviewCommentReply:
      type: object
      description: One reply on a comment, from a person or from the agent.
      properties:
        run_id:
          type: [string, 'null']
          description: The associated Mist run, or null for unbound comments and replies.
        client_id:
          type: string
          description: Client-generated id, unique within the comment.
        body:
          type: string
          description: The reply text.
        author_name:
          type: [string, "null"]
          description: |-
            Who replied. The literal `Mist` for the agent's own replies, which
            is what a client compares against to tell whether a thread has been
            answered.
        created_at_ms:
          type: integer
          description: When the reply was created, in milliseconds since the epoch.
        mentions:
          type: array
          description: People or projects mentioned in the reply.
          items: {"$ref": "#/components/schemas/PreviewCommentMention"}
        shot:
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentShot"
          - type: "null"
          description: Proof screenshot, when the reply carries one.
        proof:
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentProof"
          - type: "null"
          description: The evidence around the screenshot, when the reply carries it.
      required: [run_id, client_id, body, author_name, created_at_ms, mentions, shot, proof]
    PreviewCommentPerson:
      type: object
      description: |-
        One person on a work item. Mist is a person here, with a fixed id and
        no user row of its own.
      properties:
        id:
          type: string
          description: The user id as a string, or `mist` for the agent.
        name:
          type: [string, "null"]
          description: The name the server attributed, falling back to the email address.
        kind:
          type: string
          enum: [user, agent]
          description: Whether this is a person or the agent.
      required: [id, name, kind]
    PreviewCommentWorkItem:
      type: object
      description: |-
        The work a discussion belongs to. A routing and display hint and never
        the authority: it says which surface owns this thread's workflow, so a
        client sends the work rather than the comment, and the work's own read
        is what its card is drawn from. Read-only on this API — every write
        here is refused with 409 while the thread belongs to work.
      properties:
        id:
          type: string
          format: uuid
          description: The work item's id, as the task API addresses it.
        status:
          type: string
          enum: [open, kept, needs_info, in_progress, handed, review, skipped]
          description: Where the work stands. The comment's own `status` is not this and may be stale.
        priority:
          type: [string, "null"]
          enum: [urgent, high, medium, low, null]
          description: How urgent the work is, or null when nobody has judged it.
        run_id:
          type: [string, "null"]
          description: The run that owns the work now, or null when none does.
        lock_version:
          type: integer
          minimum: 0
          description: The work's own version register, which is not the comment's and is never compared against it.
        assignee:
          description: Who owns the work now, or null for nobody.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentPerson"
          - type: "null"
      required: [id, status, priority, run_id, lock_version, assignee]
    PreviewComment:
      type: object
      description: A comment pinned to an element on a theme's preview.
      properties:
        run_id:
          type: [string, 'null']
          description: The associated Mist run, or null for unbound comments and replies.
        lock_version:
          type: integer
          minimum: 0
          description: Server record version used to order accepted status snapshots and guard changes.
        id:
          type: integer
          description: |-
            The discussion's row id. Served alongside `client_id` rather than
            in place of it: every route here still addresses a comment by
            `client_id`. This is the identity a company-scoped endpoint that is
            given no theme has to name a discussion by, because `client_id` is
            unique only within its theme — the task API's `source_thread_id`
            is this value.
        client_id:
          type: string
          description: Client-generated id, unique within the theme.
        n:
          type: integer
          description: |-
            Display number shown on the pin. Assigned by the client, so it is a
            label rather than an identifier — address a comment by `client_id`.
        body:
          type: string
          description: The comment text.
        status:
          type: string
          description: |-
            Where the comment stands. `kept` is a legacy spelling that still
            counts as open. `handed` means it has been sent for work and is
            still running; `review` means the work finished and is waiting on a
            person. Only a person sets `skipped`, and only a person moves a
            comment past `review` — the agent stops there.

            When two writes carry the same stamp the order is
            `skipped` > `review` > `handed` > the incoming value, so a resolve
            is never lost to a same-millisecond write and finished work is never
            dragged back to in-progress.
          enum: [open, kept, skipped, handed, review, needs_info]
        status_at_ms:
          type: [integer, "null"]
          description: |-
            When the status was last intentionally set, in milliseconds. The key
            the last-writer-wins register compares on. Null on comments
            predating the register.
        page_url:
          type: string
          description: Normalized path of the page the comment was pinned on.
        author_name:
          type: [string, "null"]
          description: Who pinned the comment, attributed by the server.
        created_at_ms:
          type: integer
          description: When the comment was created, in milliseconds since the epoch.
        theme_changed_at:
          type: [string, 'null']
          format: date-time
          description: |-
            When the theme was last published after this comment was created, or
            null when it has not been. A time here means the comment was pinned
            against a page that has since changed, so it may be out of date.

            The latest of: the comment's own template, any structural template
            of the theme (layouts, sections, blocks, components, navbar, footer,
            library navbar, config and locales), the theme's own variables and
            stylesheets, and a release being put in service, which includes a
            rollback and counts from the moment it was activated rather than
            built. Drafts do not count. Computed on each read and never
            stored. Carried by the comment only; its replies do not have it.
            Publishes before this field shipped were not recorded, so only a
            later publish can make an existing comment stale.
          example: '2026-09-15T19:20:00.000Z'
        template_id:
          type: integer
          description: |-
            The theme template the comment was pinned against. For a pin on
            shared chrome this is the navbar or footer template rather than the
            page's, because that is the one needing the edit.
        section:
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentThemeRef"
          - type: "null"
          description: The section the pin sits in, when the render carried it.
        block:
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentThemeRef"
          - type: "null"
          description: |-
            The block the pin sits in. Null unless the page was rendered by the
            theme editor, which is the only render that emits block identity.
        target:
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentTarget"
          - type: "null"
          description: The anchored element.
        pin:
          "$ref": "#/components/schemas/PreviewCommentPin"
        mentions:
          type: array
          description: People or projects mentioned in the comment.
          items: {"$ref": "#/components/schemas/PreviewCommentMention"}
        mentioned_project:
          description: |-
            The project this comment is about, or null when it is about a page.
            Taken from the first project mentioned.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentMentionedProject"
          - type: "null"
        proof_baseline:
          description: |-
            The page before the work started, or null when no capture has been
            recorded. Carries its own stamp, resolved independently of status.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentProofBaseline"
          - type: "null"
        work_item:
          description: |-
            The work this discussion belongs to, or null while it is only a
            discussion. Null too once that work is deleted, which gives the
            thread back to the legacy workflow path.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentWorkItem"
          - type: "null"
        board_position:
          type: [string, 'null']
          pattern: '^[0-9A-Za-z]+$'
          maxLength: 255
          description: |-
            Where the comment's card sits on the Tasks board, as a canonical
            fractional index in base-62 digits that sorts as a plain string, in
            the same order work items keep. One order for the whole board;
            equal positions are ordered by id. Null until someone places the
            card. Not read for a comment that belongs to a work item, which is
            drawn as that work.
          example: a0V
        board_position_at_ms:
          type: [integer, 'null']
          description: When the card was last placed, in milliseconds since the epoch. The key the position register compares on.
          example: 1789000000000
        assignee:
          description: Who owns the work now, or null for nobody. Mist appears with `kind` `agent`.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentPerson"
          - type: "null"
        assigner:
          description: Who handed the comment over, or null until somebody has. Kept after the handover.
          oneOf:
          - "$ref": "#/components/schemas/PreviewCommentPerson"
          - type: "null"
        assigned_at_ms:
          type: [integer, 'null']
          description: When the assignment was last set, in milliseconds since the epoch. The key the assignment register compares on.
        priority:
          type: [string, 'null']
          enum: [urgent, high, medium, low, null]
          description: How urgent the comment is, or null when nobody has judged it.
        priority_at_ms:
          type: [integer, 'null']
          description: When the priority was last set, in milliseconds since the epoch. The key the priority register compares on.
        replies:
          type: array
          description: Replies, ordered by creation time then client id.
          items:
            "$ref": "#/components/schemas/PreviewCommentReply"
      required: [id, run_id, client_id, n, body, status, status_at_ms, lock_version, page_url, author_name, created_at_ms,
                 theme_changed_at, template_id, section, block, target, pin, mentions, mentioned_project,
                 proof_baseline, work_item, replies]
    PreviewCommentCreate:
      type: object
      description: |-
        A comment to pin. No author field: authorship comes from the
        authenticated principal, and a field that is always ignored is one a
        client eventually trusts.
      properties:
        client_id:
          type: string
          description: Client-generated id, unique within the theme.
        body:
          type: string
          description: The comment text.
        template_id:
          type: integer
          description: The theme template being commented on. Must belong to this theme.
        number:
          type: integer
          description: Display number for the pin.
        page_path:
          type: string
          description: Normalized path of the page.
        pin:
          type: object
          description: Where the pin sits.
          properties:
            x: {type: number, description: Horizontal position, as a percentage of the viewport.}
            y: {type: number, description: Vertical position, as a percentage of the viewport.}
            ox: {type: [number, "null"], description: Horizontal offset within the element, 0 to 1.}
            oy: {type: [number, "null"], description: Vertical offset within the element, 0 to 1.}
          required: [x, y]
        section:
          type: object
          description: Theme identity of the section, read from the rendered page.
          properties:
            id: {type: [string, "null"], description: Instance id of the section.}
            type: {type: [string, "null"], description: Section type, which is the file.}
        block:
          type: object
          description: Theme identity of the block, when the render carried it.
          properties:
            id: {type: [string, "null"], description: Instance id of the block.}
            type: {type: [string, "null"], description: Block type, which is the file.}
        anchor:
          type: object
          description: The element the pin was made against.
          properties:
            tag: {type: [string, "null"], description: Tag name of the element.}
            selector: {type: [string, "null"], description: CSS selector that located it.}
            text: {type: [string, "null"], description: Text quoted from the element.}
            html: {type: [string, "null"], description: Truncated outer HTML.}
        mentions:
          type: array
          description: People or projects mentioned in the comment.
          items: {"$ref": "#/components/schemas/PreviewCommentMention"}
      required: [client_id, body, template_id, number, page_path, pin]
    ThemeSummary:
      type: object
      description: A theme as a picker row — no stylesheet blobs.
      properties:
        id: {type: integer}
        name: {type: string}
        version: {type: [string, 'null']}
        status: {type: [string, 'null']}
        source: {type: [string, 'null']}
        company_id: {type: [integer, 'null']}
        cover_image: {type: [string, 'null'], description: URL of the theme's cover image.}
        outdated: {type: [boolean, 'null'], description: True when a newer version of the source theme exists.}
        default_home_template_id: {type: [integer, 'null'], description: Only present when include_default_home_template=true.}
        updated_at: {type: [string, 'null'], format: date-time}
      required: [id, name]
    ThemeTemplateSummary:
      type: object
      description: |-
        A template's metadata. Deliberately excludes `content` (the Liquid
        body), `variables` and `translations` — all unbounded blobs.
      properties:
        id: {type: integer}
        name: {type: [string, 'null']}
        themeable_type: {type: [string, 'null']}
        status: {type: [string, 'null']}
        default: {type: [boolean, 'null']}
        global: {type: [boolean, 'null']}
        source: {type: [string, 'null']}
        application_theme_id: {type: [integer, 'null']}
        company_id: {type: [integer, 'null']}
        app_extension_id: {type: [integer, 'null']}
        extension_uri: {type: [string, 'null']}
        droplet_name: {type: [string, 'null']}
        country_ids: {type: [array, 'null'], items: {type: integer}}
        hide_navbar: {type: [boolean, 'null']}
        use_active_application_theme: {type: [boolean, 'null']}
        stylesheet: {type: [string, 'null']}
        stylesheet_tag_injected: {type: [boolean, 'null']}
        stylesheet_column_hidden: {type: [boolean, 'null']}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
      required: [id]
    ThemeDetail:
      type: object
      description: |-
        A single theme in full. Superset of ThemeSummary — adds the deprecated
        stylesheet columns, versions, images and GitSync repos. Does NOT embed
        templates.
      properties:
        id: {type: integer}
        name: {type: string}
        version: {type: [string, 'null']}
        status: {type: [string, 'null']}
        source: {type: [string, 'null']}
        description: {type: [string, 'null']}
        variables: {type: [string, 'null'], description: Serialized theme variables.}
        company_id: {type: [integer, 'null']}
        cover_image: {type: [string, 'null'], description: URL of the theme's cover image.}
        custom_stylesheet: {type: [string, 'null']}
        global_stylesheet: {type: [string, 'null']}
        versions: {type: [array, 'null'], items: {type: object, additionalProperties: true}}
        images: {type: [array, 'null'], items: {type: object, additionalProperties: true}}
        git_sync_repos: {type: [array, 'null'], items: {type: object, additionalProperties: true}}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
      required: [id, name]
    ThemeTemplate:
      type: object
      description: A template including its Liquid `content`.
      properties:
        id: {type: integer}
        name: {type: [string, 'null']}
        content: {type: [string, 'null']}
        themeable_type: {type: [string, 'null']}
        status: {type: [string, 'null']}
        default: {type: [boolean, 'null']}
        variables: {type: [object, 'null'], additionalProperties: true, description: Template-level Liquid variables.}
        translations: {type: [object, 'null'], additionalProperties: true}
        application_theme_id: {type: [integer, 'null']}
        company_id: {type: [integer, 'null']}
        app_extension_id: {type: [integer, 'null']}
        extension_uri: {type: [string, 'null']}
        droplet_name: {type: [string, 'null']}
        source: {type: [string, 'null']}
        global: {type: [boolean, 'null']}
        country_ids: {type: [array, 'null'], items: {type: integer}}
        hide_navbar: {type: [boolean, 'null']}
        use_active_application_theme: {type: [boolean, 'null']}
        stylesheet: {type: [string, 'null']}
        stylesheet_tag_injected: {type: [boolean, 'null']}
        stylesheet_column_hidden: {type: [boolean, 'null']}
        created_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: [string, 'null'], format: date-time}
      required: [id]
    PaginationMeta:
      type: object
      properties:
        current_page: {type: integer}
        total_pages: {type: integer}
        total_count: {type: integer}
        per_page: {type: integer}
