      summary: Claim a comment for one Mist run
      description: |-
        Claims an open comment with its observed version. A retry succeeds only
        while that run is still handed and both run_id and expected_version
        match the original claim request. Completed runs and requests using a
        different version receive 409 with the current comment.

        A thread that belongs to a work item is not writable workflow here.
        This returns 409 with the current comment in
        `error.details.preview_comment`, and the work is changed through the
        work item instead. Draining is how a company reaches that state: a
        thread a client is still executing is never linked to work. A thread
        that belongs to no work behaves exactly as it always has.
        A thread whose work item was deleted is the one exception here: it
        gets the rest of its workflow back, but it still names that work, and
        a run cannot be claimed on a linked thread, so the claim keeps
        returning 409.
