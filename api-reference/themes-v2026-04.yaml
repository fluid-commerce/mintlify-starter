    put:
      summary: Set who owns a preview comment
      description: |-
        Hands a comment to a company admin or to Mist, and records who handed
        it over.

        Its own operation because it is its own register, for the same reason
        the proof baseline is. `assigned_at_ms` is compared only against the
        stored assignment's stamp, so a screen open since before a
        reassignment loses the assignment and nothing else — it cannot drag
        status backwards on the way down. A write carrying an older stamp is
        discarded and answered 200 with the comment unchanged, exactly as a
        losing status write is. An equal stamp is taken by the incoming write,
        matching the desktop so both sides resolve a same-millisecond write
        the same way.

        Reaching `review` returns the comment to its assigner: the work goes
        back to whoever asked for it rather than staying with whoever finished
        it. That happens on the status write, not here.

        `assignee` may be null, and a null is not an error: it leaves the
        comment owned by nobody. The stamp still travels with it, because a
        cleared assignment carrying no stamp would lose to a later write
        holding an older one and quietly restore an owner somebody removed.

        Only a company admin can be named. Mist is named by `kind: agent` and
        carries no `user_id`, because the agent is a worker in the queue with
        no user row of its own.

        A thread that belongs to a work item is not writable workflow here.
        This returns 409 with the current comment in
        `error.details.preview_comment`, and the work is changed through the
        work item instead. Draining is how a company reaches that state: a
        thread a client is still executing is never linked to work. A thread
        that belongs to no work behaves exactly as it always has.
      tags: [preview comments]
