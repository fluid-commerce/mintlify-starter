  "/api/public/v2025-06/commerce/carts/{cart_token}/payment_methods/{type}":
    post:
      summary: Sets cart payment method
      tags:
      - carts
      operationId: public_v2025_06_cart_payment_method-update
      description: 'Sets the payment method on the cart. The type path parameter determines which payment provider flow is used. The payment_method request body fields vary by type. An optional billing_address can be provided with any type. Note: apple_pay may return a CreditCardPaymentResponse (card flow) or a PayPalPaymentResponse (decrypted PayPal flow) depending on the cart''s payment account configuration.

        '
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: type
        in: path
        description: 'Payment method type. Core types: credit_card, affirm, bread, paypal, apple_pay, klarna. Platform-specific types follow the pattern {method}_{platform} (e.g. wechat_citcon, pix_dlocal, bancontact_ppro).

          '
        required: true
        schema:
          type: string
          x-extensible-enum:
          - credit_card
          - affirm
          - bread
          - paypal
          - apple_pay
          - klarna
      - name: jwt
        in: query
        required: false
        description: JWT token for authenticated checkout
        schema:
          type: string
      - name: payment_method_id
        in: query
        required: false
        description: 'Saved payment method ID. When provided with a jwt query param, uses an existing saved payment method instead of creating a new one. The request body is not required in this flow.

          '
        schema:
          type: integer
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '201':
          description: Payment method set successfully
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/CreditCardPaymentResponse"
                - "$ref": "#/components/schemas/PayPalPaymentResponse"
                - "$ref": "#/components/schemas/KlarnaPaymentResponse"
                - "$ref": "#/components/schemas/EmptyPaymentResponse"
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  "$ref": "#/components/schemas/PaymentMethodRequest"
                billing_address:
                  "$ref": "#/components/schemas/BillingAddress"
                use_customer_payment_method:
                  type: boolean
                  description: 'When true, payment_method_id resolves against the customer''s saved methods (via jwt). When false or omitted, it resolves against the fluid pay account.

                    '
                payment_account:
                  type:
                  - string
                  - 'null'
                  description: Payment account identifier
                device_data:
                  type:
                  - string
                  - 'null'
                  description: Braintree fraud detection fingerprint
      security: []
