  "/api/public/v2025-06/forms/{token}":
    get:
      summary: Get form by public token
      operationId: public_v2025_06_form-show
      description: Returns an active, shared form by its public token so a
        storefront or embed can render it, including its active elements in
        display order. No authentication is required. A password-protected form
        returns only its id, title, description, and `password_required` set to true
        until you send a valid access token from Verify form password, either as
        the `access_token` query parameter or the `X-Form-Access-Token` header.
        Returns 404 for an unknown, inactive, or unshared form, 410 once the
        form's embed expiry has passed, and 403 when the request's `Origin` or
        `Referer` is not one of the form's allowed embed domains (requests with
        neither header are allowed).
      tags:
      - forms
      parameters:
      - name: token
        in: path
        description: Form public token
        example: aBcDeFgHiJkLmNoPqRsT_w
        required: true
        schema:
          type: string
      - name: access_token
        in: query
        description: Access token for password-protected forms (returned by verify_password)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success. The full form, or the locked form summary when
            the form is password-protected and no valid access token was sent.
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/PublicFormResponse"
                - type: object
                  description: Locked summary of a password-protected form.
                  properties:
                    id:
                      type: integer
                      description: Form ID
                    title:
                      type: string
                      description: Form title
                    description:
                      type:
                      - string
                      - 'null'
                      description: Form description
                    password_required:
                      type: boolean
                      description: Always true; verify the password to load the
                        form's elements.
                    meta:
                      type: object
                      description: Request metadata
                      properties:
                        request_id:
                          type:
                          - string
                          - 'null'
                        timestamp:
                          type: string
                          format: date-time
                  required:
                  - id
                  - title
