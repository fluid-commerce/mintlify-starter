  "/api/public/v2025-06/commerce/carts/{cart_token}/items/{item_id}/update_volumes":
    patch:
      operationId: public_v2025_06_public_commerce_carts_items_update_volumes_patch
      description: Overrides a line item's CV and QV volumes. Used by admin tooling;
        requires a bearer token.
      summary: Update Volumes update volumes
      tags:
      - public
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: item_id
        in: path
        required: true
        schema:
          type: string
      # requestBody is optional rather than required so the 404/401 error paths,
      # which legitimately carry no body, still conform. The "cv or qv must be
      # provided" rule is enforced by the endpoint, not the schema.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cv:
                  type: [number, string, 'null']
                  format: decimal
                  description: Commission Volume override, rounded to the cart currency's minor unit. Null leaves it unchanged.
                  example: '5.25'
                qv:
                  type: [number, string, 'null']
                  format: decimal
                  description: Qualifying Volume override, rounded to the cart currency's minor unit. Null leaves it unchanged.
                  example: '2.5'
              additionalProperties: false
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '401':
          description: Unauthorized
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicCartItemVolumeResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Invalid parameters, for example a non-numeric cv or qv
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security:
      - bearer_auth: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/items/{item_id}/variant":
    patch:
      summary: Updates a cart item's variant
      tags:
      - carts
      description: |
        Updates a cart item to use a different variant.
        If the target variant already exists in another cart item, the quantities are consolidated.

        **Consolidation behavior:**
        - If cart already has an item with the target variant_id, the source item's quantity is added to the existing item
        - The source item is then removed
        - Otherwise, the cart item's variant is updated directly

        **Optional quantity parameter:**
        - If provided, uses this quantity instead of the current cart item quantity when updating to a new variant
        - When consolidating, this quantity is added to the existing item's quantity (not replacing it)
      operationId: public_v2025_06_cart_update-item-variant
      parameters:
      - name: cart_token
        in: path
        required: true
        description: The cart token
        example: abc123def456
        schema:
          type: string
      - name: item_id
        in: path
        required: true
        description: The cart item ID
        example: 123
        schema:
          type: integer
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartAddressUpdateResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartUpdateItemVariantResponse404ApplicationJsonSchema"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartUpdateItemVariantRequestBodyApplicationJsonSchema"
        required: true
        description: Variant update parameters
      security: []
