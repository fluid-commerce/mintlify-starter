          type: string
      - name: is_pay_later
        in: query
        required: true
        schema:
          type: boolean
      responses:
        '409':
          "$ref": "#/components/responses/PaymentInProgressError"
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PostApiV202506CartsByCartTokenPaypalCreateOrderResponse201ApplicationJsonSchema"
              example:
                success: true
                order_id: 5O190127TN364715T
                meta:
                  request_id: a3e6c9f2-1d4b-4a78-9e25-7b0c3f8d6a14
                  timestamp: '2026-09-14T15:35:48Z'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      operationId: public_v2025_06_post_api_v202506_carts_by_cart_token_paypal_create_order
      security: []
  "/api/v202506/carts/{cart_token}/paypal/shipping_address_change":
