    patch:
      summary: Flag a Public SDK cart as enrollment eligible
      tags:
      - carts
      operationId: public_v2025_06_cart_enrollment-update
      description: |
        Writes the cart's enrollment-eligibility flag. `enrollment: true` marks
        a regular cart as an enrollment cart and reprices it at wholesale, with
        or without an enrollment pack; `false` returns a pack-less flagged cart
        to a regular cart at retail. Un-flagging is refused while the cart
        holds an enrollment pack or its enrollment has left the `beginning`
        state. Flagging is refused when the company has no active enrollment
        configuration for the cart's country or default, or when the buyer rep
        cannot re-enroll. A frozen cart is refused with 410, and a cart whose
        checkout lock is held is refused with 409.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartSnapshotResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: Checkout holds the cart lock, or a redirect payment is open at the provider (`meta.code` = `payment_in_progress`)
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/StandardErrorResponse"
                - "$ref": "#/components/schemas/PaymentInProgressErrorResponse"
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '422':
          description: The flag cannot be written — the company has no enrollment
            configuration, the buyer rep cannot re-enroll, the cart still holds a
            pack, or its enrollment has already started
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The enrollment flag to write
              required:
              - enrollment
              properties:
                enrollment:
                  type: boolean
                  description: True flags the cart as enrollment eligible; false clears the flag
              additionalProperties: false
      security: []
