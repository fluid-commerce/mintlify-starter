  "/api/v202506/carts/{cart_token}/dlocal/{webhook_type}":
    post:
      operationId: public_v2025_06_carts_dlocal_post
      summary: Create dlocal
      description: Receives signed dLocal payment lifecycle notifications. Returns 200 only after the notification is authenticated and processed.
      tags:
      - carts
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: webhook_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - charge
          - agreement
      - name: Authorization
        in: header
        required: true
        description: dLocal V2-HMAC-SHA256 signature over X-Login, X-Date, and the raw request body.
        schema:
          type: string
      - name: X-Date
        in: header
        required: true
        description: Timestamp included in the dLocal notification signature.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - status
              properties:
                id:
                  type: string
                  description: dLocal payment identifier
                status:
                  type: string
                  description: dLocal payment lifecycle status
                status_detail:
                  type:
                  - string
                  - 'null'
                  description: Optional provider detail for the lifecycle status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaymentWebhookAcknowledgementResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '401':
          description: Missing or invalid dLocal notification signature
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/carts/refunds/dlocal":
    post:
      operationId: public_v2025_06_carts_refunds_dlocal_post
      summary: Create dlocal refund notification
      description: Receives signed dLocal refund settlement notifications. Refund notifications
        carry no cart token, so the refund is resolved from dLocal's own refund id and
        the signature is verified against that refund payment's payment account. The
        notified status is read back from dLocal before anything is recorded. Returns
        200 only once the settlement has been applied, or was already applied by an
        earlier delivery.
      tags:
      - carts
      parameters:
      - name: Authorization
        in: header
        required: true
        description: dLocal V2-HMAC-SHA256 signature over X-Login, X-Date, and the raw request body.
        schema:
          type: string
      - name: X-Date
        in: header
        required: true
        description: Timestamp included in the dLocal notification signature.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - status
              properties:
                id:
                  type: string
                  description: dLocal refund identifier
                status:
                  type: string
                  description: dLocal refund status (PENDING, SUCCESS, REJECTED, CANCELLED)
                status_detail:
                  type:
                  - string
                  - 'null'
                  description: Optional provider detail for the refund status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaymentWebhookAcknowledgementResponse"
        '401':
          description: Missing or invalid dLocal notification signature
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: No refund payment matches the notified refund id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/subscriptions/renewals/dlocal":
    post:
      operationId: public_v2025_06_subscriptions_renewals_dlocal_post
      summary: Create dlocal renewal notification
      description: Receives signed dLocal settlement notifications for subscription
        renewals dLocal accepted as PENDING and settles asynchronously. A renewal order
        carries no cart, so the renewal is resolved from dLocal's own payment id and the
        signature is verified against that payment's payment account. The notified status
        is read back from dLocal before the order is promoted or the decline recorded.
        Returns 200 only once the settlement has been applied, or was already applied by
        an earlier delivery.
      tags:
      - subscriptions
      parameters:
      - name: Authorization
        in: header
        required: true
        description: dLocal V2-HMAC-SHA256 signature over X-Login, X-Date, and the raw request body.
        schema:
          type: string
      - name: X-Date
        in: header
        required: true
        description: Timestamp included in the dLocal notification signature.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - status
              properties:
                id:
                  type: string
                  description: dLocal payment identifier for the renewal charge
                status:
                  type: string
                  description: dLocal payment status (PENDING, PAID, REJECTED, CANCELLED, EXPIRED)
                status_detail:
                  type:
                  - string
                  - 'null'
                  description: Optional provider detail for the payment status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaymentWebhookAcknowledgementResponse"
        '401':
          description: Missing or invalid dLocal notification signature
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: No renewal charge matches the notified payment id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
