              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: >-
            Cart is being updated or checkout holds the cart lock; retry. With
            an `enrollment` block, also the enrollment conflicts the
            /enrollment endpoint reports:
            `enrollment_in_progress` (an identical enrollment is still being
            processed), `enrollment_pack_conflict` (a different pack is on the
            cart), and `enrollment_configuration_conflict` (the same pack with
            a different configuration).
            Or a redirect payment is open at the provider (`meta.code` = `payment_in_progress`).
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/StandardErrorResponse"
                - "$ref": "#/components/schemas/PaymentInProgressErrorResponse"
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '422':
          description: Every requested item was skipped and nothing was added, or
            the request referenced an unknown cart_item_id / carried invalid item
            parameters.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/CartItemsAllSkippedResponse422ApplicationJsonSchema"
                - "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      variant_id:
                        type: integer
                        description: Variant ID
                      cart_item_id:
                        type: integer
                        description: ID of an existing cart line. When present, the entry
                          sets that line's quantity instead of adding a new item; quantity
                          0 removes the line. Fails when the id is not in the cart.
                      quantity:
                        type: integer
                        description: Quantity
                      subscription:
                        type: boolean
                        description: Whether item is a subscription
                      subscription_plan_id:
                        type: integer
                        description: Subscription plan ID
                      enrollment_pack_id:
                        type: integer
                        description: Enrollment pack ID
                      price:
                        type: number
                        format: decimal
                        description: Override price (admin only)
                      cv:
                        type: [number, string]
                        format: decimal
                        description: Override CV value (admin only)
                      qv:
                        type: [number, string]
                        format: decimal
                        description: Override QV value (admin only)
                      title:
                        type: string
                        description: Item title override
                      image_url:
                        type: string
                        description: Item image URL
                      display_to_customer:
                        type: boolean
                        description: Whether to display item to customer
                      bundled_items:
                        type: array
                        description: Bundle group selections for bundle products
                        items:
                          type: object
                          properties:
                            variant_id:
                              type: integer
                              description: Variant ID of the bundled item
                            quantity:
                              type: integer
                              minimum: 0
                              description: Quantity of the bundled item
                            product_bundle_group_id:
                              type: integer
                              description: Bundle group the selection belongs to
                            display_to_customer:
                              type: boolean
                              description: Whether to display bundled item to customer
                            subscription:
                              type: boolean
                              description: Whether bundled item is a subscription
                            subscription_plan_id:
                              type: integer
                              description: Subscription plan for the bundled item
                          required:
                          - variant_id
                          - quantity
                    required:
                    - variant_id
                    - quantity
                perform_cart_calculations:
                  type: boolean
                  description: Whether to run cart calculations after adding items (defaults to true)
                enrollment:
                  type: object
                  description: >-
                    Claim an enrollment pack and add its items before the items
                    above, in one request. Equivalent to calling the
                    /enrollment endpoint first — same body, same conflict
                    semantics (409 while an identical enrollment is in
                    progress, 409 on a differing configuration, 404 for an
                    unknown or inactive pack) — but it saves a round trip and
                    returns one cart covering both. The /enrollment endpoint
                    remains supported.
                  properties:
                    enrollment_pack_id:
                      type: integer
                      description: The enrollment pack to claim
                    bundle_selections:
                      type: array
                      description: Bundle group selections for packs whose products are bundles
                      items:
                        type: object
                        properties:
                          variant_id:
                            type: integer
                          bundled_items:
                            type: array
                            items:
                              type: object
                              properties:
                                variant_id:
                                  type: integer
                                quantity:
                                  type: integer
                                  minimum: 0
                                display_to_customer:
                                  type: boolean
                                subscription:
                                  type: [boolean, 'null']
                                subscription_plan_id:
                                  type: [integer, 'null']
                                product_bundle_group_id:
                                  type: [integer, 'null']
                              required:
                              - variant_id
                              - quantity
                        required:
                        - variant_id
                  required:
                  - enrollment_pack_id
                include_checkout_context:
                  type: boolean
                  description: >-
                    When false, the response cart omits the checkout-decision
                    fields (valid_for_checkout, valid_for_checkout_pre_payment,
                    payment_method, payment_method_auto_assignable,
                    shipping_method, available_shipping_methods,
                    available_payment_methods), skipping their computation.
                    Defaults to true. A client that stores the cart and renders
                    totals without reading those fields can send false to skip
                    their computation.
              required:
              - items
            example:
              items:
              - variant_id: 70412
                quantity: 2
              - variant_id: 70455
                quantity: 1
      security:
      - bearer_auth: []
      - {}
