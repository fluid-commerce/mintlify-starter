      description: Returns the settings the storefront SDK needs when a page loads,
        and records a URL-visit analytics event for the page. The response
        includes the shop's branding with its enabled countries and languages,
        the affiliate resolved from the page URL or metadata.attribution (with
        the attribution used), the token of the visitor's open cart for this
        session and country, and the widget scripts to load (empty on rep shop
        pages). metadata.fluid_locale in the response is the resolved locale -
        the requested fluid_locale where the shop supports it, otherwise the
        most preferred language in the request's Accept-Language header that
        the shop offers (falling back to the shop's default language) and the
        visitor's country. Both page and
