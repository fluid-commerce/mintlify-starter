      description: |
        Returns a Braintree client token that the checkout front end uses to
        initialise the Braintree drop-in or the PayPal and Venmo buttons for
        this cart, plus whether PayPal is enabled on the payment account. No
        authentication is required; the unguessable cart token scopes access.
        Pass the Braintree payment account as `payment_account_id`: a missing
        account, or one that belongs to a different company than the cart,
        returns 404. Called by the FairShare SDK checkout; direct REST
        integrations should use `checkout-v2026-04`.
      parameters:
