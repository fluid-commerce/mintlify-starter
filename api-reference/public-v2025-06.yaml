        in: header
        required: true
        description: dLocal V2-HMAC-SHA256 signature over X-Login, X-Date, and the raw request body.
        schema:
          type: string
      - name: X-Date
        in: header
        required: true
        description: Timestamp included in the dLocal notification signature.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - status
              properties:
                id:
                  type: string
                  description: dLocal refund identifier
                status:
                  type: string
                  description: dLocal refund status (PENDING, SUCCESS, REJECTED, CANCELLED)
                status_detail:
                  type:
                  - string
                  - 'null'
                  description: Optional provider detail for the refund status
            example:
              id: REF-4-2d7a9c1e-6b3f-4e85-a0c2-9f1e5b8d3a76
              status: SUCCESS
              status_detail: The refund was paid.
      responses:
