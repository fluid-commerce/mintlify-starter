  "/api/public/v2025-06/forms/{token}/respond":
    post:
      summary: Submit a form response
      operationId: public_v2025_06_form-respond
      description: Records one completed submission of a shared form. Send one
        answer per form element in `form_response.responses`; every
        `form_element_id` must be an active element of this form. When you send
        `form_response.contact.email`, the respondent is matched to, or added
        as, a contact of the form's company. No authentication is required. A
        password-protected form also needs the access token from Verify form
        password (`access_token` query parameter or `X-Form-Access-Token`
        header), otherwise the request fails with 401. Returns 422 when no
        responses are sent, an element does not belong to the form, the form
        requires a contact email and none is sent, or the form's submission
        limit is reached.
      tags:
      - forms
      parameters:
      - name: token
        in: path
        description: Form public token
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicFormMessageResponse"
              example:
                message: Form submitted successfully
                meta:
                  request_id: null
                  timestamp: '2026-09-14T15:31:47Z'
        '401':
          description: The form is password-protected and no valid access token
            was sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '403':
          description: The request's Origin or Referer is not an allowed embed
            domain for this form
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '410':
          description: The form's embed expiry has passed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Missing responses, an element outside this form, a
            missing required contact email, or the submission limit is reached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PublicFormResponseSubmissionRequest"
              description: Request payload
            example:
              form_response:
                contact:
                  email: holly.flax@dundermifflin.com
                  first_name: Holly
                  last_name: Flax
                responses:
                - form_element_id: 90417
                  answer: Vance Refrigeration
                - form_element_id: 90418
                  answer: 20lb
      security: []
  "/api/public/v2025-06/forms/{token}/verify_password":
    post:
      summary: Verify form password
      operationId: public_v2025_06_form-verify-password
      description: Checks the password for a password-protected shared form and
        returns a short-lived access token (valid for 30 minutes). Send that
        token as the `access_token` query parameter or `X-Form-Access-Token`
        header on Get form by public token and Submit a form response. Changing
        the form's password invalidates tokens already issued. No
        authentication is required. For a form without a password the response
        a `message` of "No password required" instead of a token. A wrong password
        returns 401.
      tags:
      - forms
      parameters:
      - name: token
        in: path
        description: Form public token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success. An access token for a password-protected form,
            or a message when the form has no password.
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  description: Access granted to a password-protected form.
                  properties:
                    access_token:
                      type: string
                      description: Signed token that unlocks the form; send it
                        as `access_token` or `X-Form-Access-Token`.
                    expires_in:
                      type: integer
                      description: Seconds until the access token expires.
                    meta:
                      type: object
                      description: Request metadata
                      properties:
                        request_id:
                          type:
                          - string
                          - 'null'
                        timestamp:
                          type: string
                          format: date-time
                  required:
                  - access_token
                  - expires_in
                - "$ref": "#/components/schemas/PublicFormMessageResponse"
              example:
                access_token: eyJfcmFpbHMiOnsiZGF0YSI6NDgyMTMsImV4cCI6IjIwMjYtMDktMTRUMTY6MDA6MTJaIiwicHVyIjoiZm9ybV9hY2Nlc3NfNDgyMTNfOWYyYzdlNDEifX0=--4b8e2d71c9a05f3e6d17b2a8c40f95e3d6a71b28
                expires_in: 1800
                meta:
                  request_id: null
                  timestamp: '2026-09-14T15:30:12Z'
        '401':
          description: The password is incorrect
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '403':
          description: The request's Origin or Referer is not an allowed embed
            domain for this form
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '410':
          description: The form's embed expiry has passed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PublicFormPasswordVerificationRequest"
              description: Request payload
            example:
              password: scranton-samples-2026
      security: []
