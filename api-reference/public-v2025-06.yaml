                client_token: eyJ2ZXJzaW9uIjoyLCJhdXRob3JpemF0aW9uRmluZ2VycHJpbnQiOiJkdW5kZXItbWlmZmxpbiJ9
                paypal_enabled: true
                meta:
                  request_id: c41e7a90-3b5d-4f28-9e61-8d2a0b7f5c13
                  timestamp: '2026-09-17T14:22:08Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/carts/{cart_token}/braintree/create_payment":
    post:
      operationId: public_v2025_06_carts_braintree_create_payment_post
      summary: Create Payment create payment
      tags:
      - carts
      description: |
        Authorizes a Braintree payment (card, PayPal, Pay Later or Venmo) for
        the cart from the nonce the Braintree client SDK returned, and returns
        the gateway transaction id and the detected payment type. No
        authentication is required; the unguessable cart token scopes access,
        and `payment_account_id` must name a Braintree payment account of the
        cart's company (otherwise 404).

        When `shipping_address` is sent (for example from the PayPal popup) it
        is saved as the cart's ship-to address. `payment_type` is honoured only
        as `braintree_paypal_pay_later`, and only for a PayPal nonce on a cart
        without subscriptions; otherwise the type is detected from the gateway
        response. A PayPal modal that pinned an amount sends `approved_amount`
        and `approved_currency` (and `paypal_flow: checkout_with_vault` for the
        vaulted flow); a cart whose total no longer matches is refused with
        422.

        Returns 422 for a zero-amount cart, a duplicate payment, a decline or
        a failed pinned-amount check (see `error_code`), 409 while another
        authorization for the cart is in flight, and 503 when the gateway is
        unavailable. Called by the FairShare SDK checkout; direct REST
        integrations should use `checkout-v2026-04`.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_account_id:
                  type: string
                  description: UUID of the company's Braintree payment account.
                    Required in practice; a missing or foreign account returns 404.
                payment_method_nonce:
                  type: string
                  description: One-time payment method nonce returned by the
                    Braintree client SDK
                device_data:
                  type: string
                  description: Braintree device data string for fraud screening
                payment_type:
                  type: string
                  description: Optional override. Only `braintree_paypal_pay_later`
                    is honoured; any other value is ignored.
                payer_email:
                  type: string
                  format: email
                  description: Email of the PayPal payer
                shipping_address:
                  type: object
                  description: Shipping address collected by the wallet popup;
                    saved as the cart's ship-to address
                  properties:
                    recipient_name:
                      type: string
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postal_code:
                      type: string
                    country_code:
                      type: string
                      description: ISO 3166-1 alpha-2 country code
                approved_amount:
                  type: string
                  description: Decimal string of the total the buyer approved in
                    the PayPal modal. Required for the checkout-with-vault flow.
                approved_currency:
                  type: string
                  description: ISO 4217 currency of `approved_amount`. Required
                    whenever `approved_amount` is sent.
                paypal_flow:
                  type: string
                  description: Set to `checkout_with_vault` when the front end
                    produced a checkout-with-vault nonce.
            example:
              payment_account_id: 9d3f6b2a-4e71-4c8d-a0b5-e27c1f9a6d34
              payment_method_nonce: tokencc_bh_7xk2mq_9vrbt3_nwz8lp_yc4hd2_q6f
              device_data: '{"correlation_id":"a1c8e3f07b2d4e96"}'
              payer_email: holly.flax@dundermifflin.com
              shipping_address:
                recipient_name: Holly Flax
                line1: 221 Lackawanna Avenue
                line2: Apt 4B
                city: Scranton
                state: PA
                postal_code: '18503'
                country_code: US
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicCartBraintreeCreatePaymentResponse"
              example:
                transaction_id: 8kq2vx4m
                payment_type: braintree_paypal
                meta:
                  request_id: c41e7a90-3b5d-4f28-9e61-8d2a0b7f5c13
                  timestamp: '2026-09-17T14:22:08Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: An authorization for this cart is already in progress, or a redirect payment is open at the provider (`meta.code` = `payment_in_progress`)
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/StandardErrorResponse"
                - "$ref": "#/components/schemas/PaymentInProgressErrorResponse"
        '503':
          description: Braintree gateway or auth error, or payment service temporarily
            unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/carts/{cart_token}/braintree/vault-payment-method":
    post:
      operationId: public_v2025_06_carts_braintree_vault_payment_method_post
      summary: Save a Braintree PayPal account without a charge
      x-fluid-audience: public
      tags:
      - braintree
      description: |
        Saves a Braintree PayPal account for a start-free cart ($0 today, paid
        subscription renewal) and binds it to the cart as its payment method.
        Send the nonce from the Braintree PayPal vault flow (no amount). No
        authorization is made, and the order completes at $0 through checkout;
        renewals charge the saved account. Offered only when the cart's
        Braintree PayPal entry in `available_payment_methods` carries
        `vault_without_charge: true`. No authentication is required; the
        unguessable cart token scopes access, and `payment_account_id` must name
        a Braintree payment account of the cart's company (otherwise 404).

        Returns 422 when the cart is not start-free, the PayPal address
        changed the total (`amount_changed`),
        the nonce is not a PayPal account, or the bind failed (see
        `error_code`); 409 while the same approval is being saved; and 503 when
        the gateway is unavailable.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - payment_account_id
              - payment_method_nonce
              properties:
                payment_account_id:
                  type: string
                  description: UUID of the company's Braintree payment account.
                payment_method_nonce:
                  type: string
                  description: One-time nonce from the Braintree PayPal vault flow
                payer_email:
                  type: string
                  format: email
                  description: Email of the PayPal payer
                shipping_address:
                  type: object
                  description: Shipping address collected by the PayPal popup;
                    saved as the cart's ship-to address
                  properties:
                    recipient_name:
                      type: string
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postal_code:
                      type: string
                    country_code:
                      type: string
                      description: ISO 3166-1 alpha-2 country code
            example:
              payment_account_id: 9d3f6b2a-4e71-4c8d-a0b5-e27c1f9a6d34
              payment_method_nonce: tokenpp_bh_7xk2mq_9vrbt3_nwz8lp_yc4hd2_q6f
              payer_email: holly.flax@dundermifflin.com
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - payment_method_id
                - payment_type
                - meta
                properties:
                  payment_method_id:
                    type: integer
                    description: Id of the payment method now bound to the cart
                  payment_type:
                    type: string
                  meta:
                    "$ref": "#/components/schemas/Meta"
              example:
                payment_method_id: 48213
                payment_type: braintree_paypal
                meta:
                  request_id: c41e7a90-3b5d-4f28-9e61-8d2a0b7f5c13
                  timestamp: '2026-10-08T14:22:08Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: A save for this approval is already in progress, or a redirect payment is open at the provider (`meta.code` = `payment_in_progress`)
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/StandardErrorResponse"
                - "$ref": "#/components/schemas/PaymentInProgressErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '503':
          description: Braintree gateway or auth error, or payment service temporarily
            unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/carts/{cart_token}/check_order_status":
    get:
      operationId: public_v2025_06_carts_check_order_status_get
      summary: Check Order Status check order status
      tags:
