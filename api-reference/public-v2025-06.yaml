          type:
          - string
          - 'null'
        fluid_session:
          type:
          - string
          - 'null'
          format: "/\\Afs_[0-9A-Za-z&&[^0OIl]]{22}\\z/"
        fluid_locale:
          type:
          - string
          - 'null'
          format: "/\\A[a-z]{2}_[A-Z]{2}\\z/"
        fluid_journey:
          type:
          - string
          - 'null'
        fluid_geo:
          type:
          - string
          - 'null'
          description: Visitor location read from the edge-set `fluid_geo`
            cookie — either a bare ISO 3166-1 alpha-2 country (e.g. US, the
            legacy cookie shape) or the composite country/subdivision/city the
            CDN writes, which the SDK percent-decodes before sending (e.g.
            US/USCA/San Francisco). The server stores each slot it can
            validate, and the country anchors the value — a value whose country
            is not an ISO country is recorded as unknown rather than rejected,
            and its finer slots are dropped with it. Omit the field when the
            cookie is absent.
        country:
          type:
          - string
          - 'null'
          description: Legacy name for `fluid_geo`, carrying the same cookie
            value in the same two shapes. SDK bundles released before the
            rename send the location here, so the field stays supported for as
            long as those bundles are deployed. When a request carries both,
            `fluid_geo` wins and this field is ignored. New integrations should
            send `fluid_geo` instead.
        timezone:
          type: string
          description: IANA timezone identifier (e.g. America/New_York). Omit the field rather than sending null.
