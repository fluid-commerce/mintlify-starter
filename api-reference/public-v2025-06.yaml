openapi: 3.1.0
info:
  title: Fluid Public SDK API
  description: |-
    **Fluid Public SDK API — the REST surface behind the `@fluid-app` FairShare
    SDK.**

    This is what the SDK calls on your behalf from the browser. Read it to
    understand what the SDK sends and receives, to verify a payload, or to call an
    SDK-backed endpoint directly. It also owns the browser-side platform surface
    that exists nowhere else: event tracking, lead capture, media and playlists,
    embeddable widgets, forms, sessions, settings, browser fingerprinting,
    affiliate lookup, and root themes.

    Its cart endpoints (`/api/public/v2025-06/commerce/carts/…`) are
    **session-aware**: they accept `fluid_session` and populate visitor session
    and rep attribution on the cart. They also cover enrollment-pack carts
    (`…/enroll`, `…/enrollment`) and payment-gateway callbacks, which the Checkout
    API does not.

    Most browser and cart operations require no bearer token. The cart token in
    the path scopes cart requests. Synchronizing an authenticated customer,
    overriding cart item prices, and overriding cart item volumes require a
    bearer token.

    **Building a checkout from scratch, server-side? Use the Fluid Checkout API
    (`checkout-v2026-04`) instead** — it is the forward surface and the only one
    with customer accounts and subscription management. See
    [Choosing a cart surface](https://docs.fluid.app/api/choosing-a-cart-surface)
    for the operation map and boundary.

    Note: the version label names this spec, not a single path prefix. Endpoints
    here live under `/api/public/v2025-06/`, its partial
    `/api/public/stable/` alias, `/api/public/`, `/api/v202506/carts/`, and the
    cart price-override path under `/api/carts/`.
  version: v2025-06
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
tags:
- name: carts
  description: Create, read, and mutate session-aware carts (items, address, country,
    language, discounts, shipping method, payment method, magic-link login, checkout).
- name: checkout
  description: Checkout-started event emitted when a shopper enters the checkout flow.
- name: commerce
  description: Admin-authenticated cart price overrides.
- name: orders
  description: Public order lookup by token, including earned loyalty points.
- name: product
  description: Localized product lookup by slug for storefronts and themes.
- name: enrollment-packs
  description: Enrollment pack lookup by slug, for enrollment-pack carts.
- name: payment
  description: Klarna session creation and updates for a cart.
- name: paypal
  description: PayPal order creation, authorization, and shipping callbacks for a
    cart.
- name: braintree
  description: Saving a Braintree PayPal account for a start-free cart.
  x-fluid-section: Checkout
- name: events
  description: Browser-side event ingestion — page visits, URL visits, and lead capture.
- name: session
  description: Visitor session creation, the basis of cart and rep attribution.
- name: fingerprint
  description: Browser fingerprint registration used to link sessions to a visitor.
- name: lead
  description: Lead capture from storefront and theme forms.
- name: forms
  description: Public form retrieval, password verification, and response submission.
- name: media
  description: Media lookup by slug and video analytics events.
- name: playlist
  description: Playlist (library) lookup by slug.
- name: widgets
  description: Embeddable storefront widgets — banners, carts, chats, and popups.
- name: page
  description: Page-visit tracking for storefront and theme pages.
- name: url
  description: Short-link and URL visit tracking.
- name: settings
  description: Company storefront settings the SDK reads at boot — company, cart,
    and affiliate configuration.
- name: affiliate
  description: Affiliate lookup used to resolve a rep from a share link or handle.
- name: root-themes
  description: Root theme catalog backing the theme editor and storefront rendering.
- name: public
  description: Public utilities — health checks, Apple Pay domain verification,
    leaderboards, and cart item volumes.
- name: public-drop-zones
  description: Active checkout, order-confirmation, and slideout-cart drop zones
    used internally by the FairShare SDK. Direct REST integrations should use
    checkout-v2026-04.
components:
  parameters:
    CheckoutJourneyId:
      name: X-Checkout-Journey-Id
      in: header
      required: false
      description: |
        Optional non-authorizing checkout journey UUID. Use with
        X-Checkout-Attempt-Id. Capture is disabled by default; malformed or
        incomplete pairs are ignored without changing checkout behavior.
        Cart scope comes from the authenticated cart token, never these headers.
      schema:
        type: string
      example: '00000000-0000-4000-8000-000000000001'
    CheckoutAttemptId:
      name: X-Checkout-Attempt-Id
      in: header
      required: false
      description: |
        Optional customer-submission UUID paired with X-Checkout-Journey-Id.
        Retain it for transport retries and originating continuations; use a new
        UUID for a new customer submission. It does not replace payment or order
        idempotency keys. Invalid pairs are ignored rather than rejecting payment.
      schema:
        type: string
      example: '00000000-0000-4000-8000-000000000011'
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  responses:
    PaymentInProgressError:
      description: |
        A redirect payment (PPRO, dLocal, Citcon) is open at the provider, so the
        cart refuses writes until the charge resolves (`meta.code` =
        `payment_in_progress`). The provider collects the amount the charge
        opened with, and the order is built from this cart when it does.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PaymentInProgressErrorResponse"
    ProcessedCartResponse:
      description: >-
        The cart is locked and can no longer be modified. Cart-mutation endpoints
        return this when the cart has already been processed (converted to an
        order) or, for enrollment carts, is in an authorized payment state. The
        body carries the full cart plus the store URL so the client can display
        the locked cart and redirect.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/LockedCartErrorResponse"
  schemas:
    PaymentInProgressErrorResponse:
      description: |
        409 envelope for a cart write refused while a redirect payment is
        open at the provider (CURRENT-3992). `meta.cart` is the cart as it
        stands, so the client can show the pending payment without a second
        fetch.
      type: object
      additionalProperties: false
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          type: object
          additionalProperties: false
          required:
          - request_id
          - timestamp
          - code
          - shop_url
          - cart
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            code:
              type: string
              enum:
              - payment_in_progress
            shop_url:
              type: string
            cart:
              "$ref": "#/components/schemas/Cart"
    LockedCartErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          type: object
          additionalProperties: false
          required:
          - request_id
          - timestamp
          - shop_url
          - cart
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            shop_url:
              type: string
            cart:
              "$ref": "#/components/schemas/Cart"
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          $ref: '#/components/schemas/ErrorMeta'
    CartResponse:
      type: object
      required:
      - cart
      additionalProperties: false
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        meta:
          type: object
          additionalProperties: false
          properties:
            checkout_url:
              type:
              - string
              - 'null'
            shop_url:
              type:
              - string
              - 'null'
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type:
              - string
              - 'null'
    Cart:
      type: object
      additionalProperties: false
      required:
      - enrollment
      properties:
        id:
          type: integer
        cart_token:
          type: string
        state:
          type: string
        state_revision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic ordering marker for published cart snapshots.
        population_status:
          type: string
          enum:
          - pending
          - complete
          - failed
          description: Progress of the background job that adds a deferred
            create's items. `pending` while it runs, then `complete` or `failed`.
            A synchronous create returns `complete`.
            An unexpected job error can leave it `pending`, so clients should stop
            waiting after a timeout.
        email:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        language_iso:
          type:
          - string
          - 'null'
        currency_code:
          type: string
        currency_symbol:
          type: string
        currency_decimal_places:
          type: integer
        type:
          type:
          - string
          - 'null'
        enrollment:
          type: boolean
          description: Whether the cart is flagged as enrollment eligible, with
            or without an enrollment pack.
        buyer_rep_id:
          type:
          - integer
          - 'null'
        customer_id:
          type:
          - integer
          - 'null'
        enrollment_pack_id:
          type:
          - integer
          - 'null'
        enrollment_member_type:
          examples:
          - id: 22c58158-7f6c-4f33-a033-32e259941684
            slug: rep
            name: Representative
          - null
          anyOf:
          - type: object
            additionalProperties: false
            required:
            - id
            - slug
            - name
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: string
          - type: 'null'
        email_marketing:
          type:
          - boolean
          - 'null'
        sms_marketing:
          type:
          - boolean
          - 'null'
        auto_apply_points:
          type: boolean
          description: Whether renewals created from this cart apply reward points automatically
        processed:
          type: boolean
        payment_in_progress:
          type: boolean
          description: |
            `true` while a redirect payment (PPRO, dLocal, Citcon) is open at the
            provider. Cart writes answer `409` with `meta.code` =
            `payment_in_progress` until the charge resolves.
        payment_resume_url:
          type:
          - string
          - 'null'
          description: |
            Fluid's resume endpoint for the open payment
            (`GET /api/checkout/v2026-04/carts/{cart_token}/payment/resume`), which
            redirects the shopper to the provider page; the provider link itself can
            carry a session credential and is never returned. `null` when no payment
            is in progress or the provider gave no page (a BLIK mandate is approved in
            the banking app).
        valid_for_checkout:
          type: boolean
        valid_for_checkout_pre_payment:
          type: boolean
        checkout_blockers:
          type: array
          description: >-
            Why `valid_for_checkout_pre_payment` is false, one entry per reason.
            Empty when it is true.
          items:
            type: object
            properties:
              code:
                type: string
                description: >-
                  Stable identifier for the validator that blocked checkout, e.g.
                  `shipping_address`. Key your own customer-facing copy off this.
              message:
                type: string
                description: >-
                  The validator's own English wording, as a fallback for a `code`
                  the client does not recognise. Not translated.
            required:
            - code
            - message
            additionalProperties: false
        contains_subscription:
          type: boolean
          description: '`true` when the cart contains a subscribed top-level item or bundle child.'
        vault_without_charge:
          type: boolean
        payment_method_auto_assignable:
          type: boolean
        requires_payment_method:
          type: boolean
        requires_3ds:
          type: boolean
        immutable_items:
          type: boolean
        digital_only:
          type: boolean
        points_enabled:
          type: boolean
        messages:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        metadata:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        cv_total:
          type: [string, 'null']
          format: decimal
        qv_total:
          type: [string, 'null']
          format: decimal
        amount_total:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        amount_total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        sub_total:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        sub_total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        tax_total:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        tax_exempt:
          type: boolean
        tax_total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        tax_total_for_display:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        inclusive_shipping_tax:
          type: number
        shipping_total:
          type: number
        shipping_total_in_currency:
          type: string
        shipping_total_for_display:
          type: string
        discount_total:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        discount_total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        subtotal_after_discounts:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        subtotal_after_discounts_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        price_inclusive_of_tax:
          type: boolean
        price_inclusive_tax_name:
          type:
          - string
          - 'null'
        totals:
          type: [object, 'null']
          additionalProperties: false
          required:
          - gross_subtotal
          - gross_subtotal_in_currency
          - net_subtotal
          - net_subtotal_in_currency
          - item_tax
          - item_tax_in_currency
          - shipping_net
          - shipping_net_in_currency
          - shipping_tax
          - shipping_tax_in_currency
          - total_tax
          - total_tax_in_currency
          - price_inclusive_of_tax
          - tax_label
          description: >-
            Display-ready totals breakdown.
             Decomposes the inclusive-tax figures so clients render
            the net subtotal, item tax, shipping net and shipping VAT without
            re-deriving them. Each money component carries a raw boundary-rounded
            decimal string plus its currency-formatted `_in_currency` sibling.
          properties:
            gross_subtotal:
              type: string
              description: Catalog sum of line-item prices (customer display).
            gross_subtotal_in_currency:
              type: string
            net_subtotal:
              type: string
              description: Items subtotal excluding embedded item tax.
            net_subtotal_in_currency:
              type: string
            item_tax:
              type: string
              description: Embedded tax attributable to the items.
            item_tax_in_currency:
              type: string
            shipping_net:
              type: string
              description: Shipping charge excluding embedded shipping tax.
            shipping_net_in_currency:
              type: string
            shipping_tax:
              type: string
              description: Embedded tax attributable to shipping.
            shipping_tax_in_currency:
              type: string
            total_tax:
              type: string
              description: Combined item and shipping tax.
            total_tax_in_currency:
              type: string
            price_inclusive_of_tax:
              type: boolean
              description: Whether catalog prices include tax.
            tax_label:
              type:
              - string
              - 'null'
              description: The resolved tax-line label (e.g. "VAT"), or null.
        enrollment_fee:
          type:
          - number
          - string
        enrollment_fee_in_currency:
          type: string
        transaction_fee:
          type:
          - number
          - string
        transaction_fee_in_currency:
          type: string
        shipping_discount:
          type: number
        discount_codes:
          type: array
          items:
            type: string
        product_discount_codes:
          type: array
          items:
            type: string
        shipping_discount_codes:
          type: array
          items:
            type: string
        customer_total_points:
          type: integer
        customer_total_points_in_currency:
          type: string
        points_applied:
          type: integer
        points_applied_amount_in_currency:
          type: string
        remaining_customer_points:
          type: integer
        remaining_customer_points_amount_in_currency:
          type: string
        remaining_cart_amount_after_points:
          type: [number, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        remaining_cart_amount_after_points_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        max_applicable_points:
          type: integer
        total_creditable_points:
          type: integer
        shipping_address:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        billing_address:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        discount_breakdown:
          type: object
          additionalProperties: false
          properties:
            internal_discounts:
              type: number
            external_discounts:
              type: number
            total_discounts:
              type: number
        external_discount:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        buyer_rep:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            id:
              type:
              - integer
              - 'null'
            email:
              type: string
            full_name:
              type: string
            image_url:
              type:
              - string
              - 'null'
            external_id:
              type:
              - string
              - 'null'
        buyer_rep_member_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Durable member UUID of the buyer rep, or `null` when the
            cart has no buyer rep. Populated for both legacy and native reps.
        volume_rep:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            id:
              type:
              - integer
              - 'null'
            email:
              type: string
            full_name:
              type: string
            image_url:
              type:
              - string
              - 'null'
        volume_rep_member_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Durable member UUID of the volume rep, or `null` when the
            cart has no volume rep. Populated for both legacy and native reps.
        available_shipping_methods:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type:
                - string
                - integer
              title:
                type: string
              price:
                type: number
              delivery_time_estimate:
                type:
                - string
                - 'null'
              price_label:
                type:
                - string
                - 'null'
        available_payment_methods:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
        payment_unavailable_reason:
          type: [string, 'null']
          description: >-
            Why available_payment_methods is empty, or null when payment is
            available. Diagnostic only; it does not change what the cart may do.
          enum:
          - no_gateway_for_country
          - below_minimum_amount
          - filtered_out
          - test_mode_no_gateway
          - test_mode_gateway_ineligible
          - null
        payment_account:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        shipping_method:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            id:
              type: string
            name:
              type: string
        payment_method:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        ship_to:
          $ref: '#/components/schemas/CartAddress'
        bill_to:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        attribution:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        agreements:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: integer
              title:
                type: string
              show_at_checkout:
                type: boolean
              default_checked:
                type: boolean
              subscription_only:
                type: boolean
              standalone_on_checkout:
                type: boolean
              show_path:
                type: string
              enrollment_pack_id:
                type:
                - integer
                - 'null'
              required:
                type: boolean
        country:
          $ref: '#/components/schemas/CartCountry'
        company:
          $ref: '#/components/schemas/CartCompany'
        enrollment_pack:
          anyOf:
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: 'null'
        recurring:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - subtotal
            - subtotal_in_currency
            - interval
            - interval_unit
            - interval_unit_identifier
            - subtotal_for_display
            - start_date
            properties:
              subtotal:
                type:
                - number
                - 'null'
              subtotal_in_currency:
                type:
                - string
                - 'null'
              interval:
                type: integer
              interval_unit:
                type: string
              interval_unit_identifier:
                type: string
                enum:
                - day
                - week
                - month
                - year
              subtotal_for_display:
                type:
                - string
                - 'null'
              start_date:
                type: string
    CartItem:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
        title:
          type: string
        quantity:
          type: integer
        price:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        price_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        discount_amount:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        discount_amount_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        tax:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        tax_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        cv:
          type: [string, 'null']
          format: decimal
        qv:
          type: [string, 'null']
          format: decimal
        cv_total:
          type: [string, 'null']
          format: decimal
        qv_total:
          type: [string, 'null']
          format: decimal
        total:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        line_total_in_currency:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
        total_after_discounts:
          type: [string, 'null']
          description: "Unavailable (null): a bundle price for this tier cannot be computed; checkout refuses the line."
