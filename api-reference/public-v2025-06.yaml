  "/api/v202506/carts/{cart_token}/paypal/venmo_shipping_callback":
    post:
      operationId: public_v2025_06_carts_paypal_venmo_shipping_callback_post
      summary: Venmo Shipping Callback shipping callback
      description: 'PayPal''s server-side shipping callback for Venmo orders. PayPal''s servers call this, not
        the buyer''s browser: once the buyer is switched into the Venmo app no client-side shipping callback
        can run, so this is where the cart is repriced. The request carries a coarse address (country, admin
        areas and postal code, no street) and, when the buyer picked a different shipping option in Venmo, a
        `shipping_option`; its presence is what distinguishes the two callbacks. The chosen option is applied
        before repricing. The response body is the update itself: PayPal applies the returned `purchase_units`
        rather than Fluid patching the order, so this action does not use the `{ success, order_id, meta }`
        envelope. Declines use PayPal''s 422 shape (`MISSING_SHIPPING_ADDRESS`, `MISSING_ORDER_ID`, `SHIPPING_UNAVAILABLE`
        or `CART_TOTAL_UNAVAILABLE`), and a declined address is removed from the cart again. No Bearer token;
        the cart is addressed by `cart_token`.'
      tags:
      - carts
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicVenmoShippingCallbackUpdate"
              example:
                id: 5O190127TN364715T
                purchase_units:
                - reference_id: default
                  amount:
                    currency_code: USD
                    value: '66.43'
                    breakdown:
                      item_total:
                        currency_code: USD
                        value: '54.99'
                      shipping:
                        currency_code: USD
                        value: '7.95'
                      tax_total:
                        currency_code: USD
                        value: '3.49'
                  shipping_options:
                  - id: '3107'
                    label: Standard Ground
                    type: SHIPPING
                    selected: true
                    amount:
                      currency_code: USD
                      value: '7.95'
                  - id: '3108'
                    label: Two-Day Express
                    type: SHIPPING
                    selected: false
                    amount:
                      currency_code: USD
                      value: '18.50'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicVenmoShippingCallbackDecline"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: PayPal order id, as PayPal names it in the callback. Echoed back. Either `id`
                    or `order_id` is required.
                order_id:
                  type: string
                  description: Alias for `id`, accepted for manual calls.
                shipping_address:
                  type: object
                  description: Buyer's shipping address as PayPal sends it. Required.
                  properties:
                    admin_area_1:
                      type: string
                      description: State, province or region.
                    admin_area_2:
                      type: string
                      description: City or town.
                    postal_code:
                      type: string
                    country_code:
                      type: string
                      description: ISO 3166-1 alpha-2 country code.
                shipping_option:
                  type: object
                  description: Present only when the buyer picked a different shipping option in Venmo.
                  properties:
                    id:
                      type: string
                      description: Shipping method id from the options returned earlier.
                purchase_units:
                  type: array
                  description: Echoed back so the answer addresses the same purchase unit. Defaults to `default`.
                  items:
                    type: object
                    properties:
                      reference_id:
                        type: string
            example:
              id: 5O190127TN364715T
              shipping_address:
                admin_area_1: PA
                admin_area_2: Scranton
                postal_code: '18505'
                country_code: US
              purchase_units:
              - reference_id: default
      security: []
  "/api/v202506/carts/{cart_token}/ppro/{webhook_type}":
    post:
      operationId: public_v2025_06_carts_ppro_post
      summary: Create ppro
      description: 'Receives PPRO webhooks for a cart''s alternative payment method (APM) charge or recurring
        payment agreement. Called by PPRO''s servers, so no Bearer token is used; the cart is addressed by `cart_token`.
        Every delivery must be signed: `Webhook-Signature` carries the hex SHA-256 digest of `<raw body>.<signing
        secret>`. A missing or invalid signature returns 401 and an empty body 400. `webhook_type` is `charge`
        or `agreement`, but the event family is taken from the event `type` in the body, so charge events delivered
        to the agreement URL are still processed as charges. Informational events that need no action are acknowledged
        with the message `acknowledged`, even when the cart does not exist. A processable event returns 404
        when the cart is not found and 422 when it cannot be applied.'
      tags:
      - carts
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: webhook_type
        in: path
        required: true
        description: Webhook family the notification URL was registered for, `charge` or `agreement`.
        schema:
          type: string
      - name: Webhook-Signature
        in: header
        required: true
        description: Hex SHA-256 digest of the raw request body, a period, and the payment account's
          PPRO webhook signing secret.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaymentWebhookAcknowledgementResponse"
              example:
                message: Webhook processed successfully
                meta:
                  request_id: 6b2f9d58-3e1a-4c7b-8d05-1f4a7e9c2b36
                  timestamp: '2026-09-14T15:36:50Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: PPRO event envelope. Fields not listed here are accepted and kept with the payment
                record.
              properties:
                id:
                  type: string
                  description: PPRO event id. Used to recognize redelivered events.
                type:
                  type: string
                  description: PPRO event type, for example `PAYMENT_CHARGE_CAPTURE_SUCCEEDED` or `PAYMENT_AGREEMENT_FAILED`.
                data:
                  type: object
                  description: Event payload.
                  properties:
                    paymentChargeId:
                      type: string
                      description: PPRO charge id. Required on charge events.
                    paymentAgreementId:
                      type: string
                      description: PPRO payment agreement id. Required on agreement events.
                    failure:
                      type: object
                      description: Failure detail on failed events.
            example:
              id: evt_9TqW4mZr7KxP2vNc
              type: PAYMENT_CHARGE_CAPTURE_SUCCEEDED
              data:
                paymentChargeId: charge_3Lh8XyQe5RbD1mVs
      security: []
