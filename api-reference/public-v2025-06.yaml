        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApplePayDomainVerificationFileResponse200ApplicationJsonSchema"
      security: []
  "/api/public/v2025-06/browser/fingerprint":
    post:
      summary: Start a new fingerprint
      operationId: public_v2025_06_fingerprint-create
      tags:
      - fingerprint
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FingerprintCreateRequestBodyApplicationJsonSchema"
      security: []
  "/api/public/v2025-06/commerce/carts":
    post:
      summary: Creates a cart
      tags:
      - carts
      description: 'Create a cart. Items, attribution and enrollment_pack_id are optional. Buyer rep assignment follows this priority: 1. If JWT is provided, extracts user from JWT and assigns as the rep. 2. If session cookie is present, extracts user from session and assigns it as the rep. 3. If no authentication is provided, cart is created without a rep. When authenticated as a rep, the cart will include rep-specific pricing.'
      operationId: public_v2025_06_cart-create
      parameters:
      - name: Cookie
        in: header
        required: false
        description: Session cookie (_fluid_session)
        schema:
          type: string
      - name: jwt
        in: query
        required: false
        description: |-
          JWT token for user authentication. When provided,
                            extracts user and assigns it as the rep to the cart.
        example: eyJhbGciOiJIUzI1NiJ9.eyJhdXRoX3R5cGUiOiJ1c2VyX2NvbXBhbnkiLCJpZCI6MTIzfQ...
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartItemsAddResponse200ApplicationJsonSchema"
        '422':
          description: Every requested item was unavailable; no cart was created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartItemsAllSkippedResponse422ApplicationJsonSchema"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartCreateRequestBodyApplicationJsonSchema"
        description: Cart params
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}":
    get:
      summary: Retrieves a cart
      tags:
      - carts
      operationId: public_v2025_06_cart-get
      description: Returns the full cart — items, totals, addresses, and available
        payment methods — for a cart token.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: fluid_shop
        in: query
        description: The domain of your Fluid shop (excluding the scheme)
        example: myco.fluid.app
        schema:
          type: string
      - name: fluid_session
        in: query
        description: Session token
        example: fs_szwdDuRbqEe7AV7sXk7vVq
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Cart retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartResponse"
        '404':
          description: cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security: []
    patch:
      summary: Updates a cart
      tags:
      - carts
      operationId: public_v2025_06_cart-update
      description: Updates the cart email and phone; a blank email clears it and
        recalculates email-gated discounts.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: fluid_shop
        in: query
        description: The domain of your Fluid shop (excluding the scheme)
        example: myco.fluid.app
        schema:
          type: string
      - name: fluid_session
        in: query
        description: Session token
        example: fs_szwdDuRbqEe7AV7sXk7vVq
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Cart update payload
              properties:
                phone:
                  type: string
                  description: Customer phone number
                email:
                  type: string
                  format: email
                  description: Customer email address
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Cart updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartResponse"
        '422':
          description: Email update rejected by validation or external callback
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/address":
    post:
      summary: Updates cart address
      tags:
      - carts
      operationId: public_v2025_06_cart_address-update
      description: Sets the cart's ship-to or bill-to address and recalculates shipping
        and tax.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartAddressUpdateResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartAddressUpdateRequestBodyApplicationJsonSchema"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/cart_info":
    get:
      summary: Retrieves cart company information
      tags:
      - carts
      operationId: public_v2025_06_cart_info-get
      description: Returns the cart's company and storefront context without the full
        cart payload.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: fluid_shop
        in: query
        description: The domain of your Fluid shop (excluding the scheme)
        example: myco.fluid.app
        schema:
          type: string
      - name: fluid_session
        in: query
        description: Session token
        example: fs_szwdDuRbqEe7AV7sXk7vVq
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Cart info retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                - languages
                - countries
                properties:
                  languages:
                    type: array
                    items:
                      "$ref": "#/components/schemas/JsonValue"
                  countries:
                    type: array
                    items:
                      "$ref": "#/components/schemas/JsonValue"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/change_language":
    patch:
      summary: Updates the language of a cart
      tags:
      - carts
      operationId: public_v2025_06_cart_language-update
      description: Sets the cart language, which drives translated product and pack copy
        on later responses.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartAddressUpdateResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartLanguageUpdateRequestBodyApplicationJsonSchema"
        required: true
        description: List of valid iso are at `/api/public/v2025-06/commerce/carts/{cart_token}/cart_info`
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/checkout":
    post:
      summary: Completes cart checkout
      tags:
      - carts
      operationId: public_v2025_06_cart-checkout
      description: Submits the cart for payment and converts it to an order.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartCheckoutResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Checkout could not be completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/confirm_magic_link":
    post:
      summary: Confirm magic link for cart
      tags:
      - carts
      operationId: public_v2025_06_cart_magic_link-confirm
      description: Confirms a magic-link code and attaches the authenticated customer to
        the cart.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: fluid_shop
        in: query
        description: The domain of your Fluid shop (excluding the scheme)
        example: myco.fluid.app
        schema:
          type: string
      - name: fluid_session
        in: query
        description: Session token
        example: fs_szwdDuRbqEe7AV7sXk7vVq
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartMagicLinkConfirmResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartMagicLinkConfirmRequestBodyApplicationJsonSchema"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/discount":
    post:
      summary: Applies a discount to the cart
      tags:
      - carts
      operationId: public_v2025_06_cart-discount-apply
      description: Applies a promo discount code to the cart and recalculates totals.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartAddressUpdateResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartDiscountApplyResponse404ApplicationJsonSchema"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartDiscountApplyRequestBodyApplicationJsonSchema"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/enroll":
    get:
      summary: Retrieves enroll for cart
      tags:
      - carts
      operationId: public_v2025_06_cart-enroll
      description: Returns the enrollment form and pack context for an enrollment-pack
        cart.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: placement
        in: query
        required: false
        schema:
          type: string
          enum:
          - pre_purchase
          - post_purchase
          - all
      - name: fluid_shop
        in: query
        description: The domain of your Fluid shop (excluding the scheme)
        example: myco.fluid.app
        schema:
          type: string
      - name: fluid_session
        in: query
        description: Session token
        example: fs_szwdDuRbqEe7AV7sXk7vVq
        schema:
          type: string
      responses:
        '200':
          description: Enroll retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EnrollResponse"
        '404':
          description: enroll not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/enrollment":
    post:
      summary: Add enrollment to existing cart
      tags:
      - carts
      operationId: public_v2025_06_cart_enrollment-create
      description: Creates the enrollment record for an enrollment-pack cart from the
        submitted form answers.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartCountryUpdateResponse200ApplicationJsonSchema"
        '400':
          description: Bad request — invalid bundle_selections, duplicate enrollment, or blocked email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_message:
                    type: string
                  errors:
                    "$ref": "#/components/schemas/ErrorBag"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Request payload
              required:
              - enrollment_pack_id
              properties:
                enrollment_pack_id:
                  type: integer
                  description: ID of the enrollment pack to add
                bundle_selections:
                  type: array
                  description: Optional bundle group selections for dynamic bundle products in the enrollment pack
                  items:
                    type: object
                    required:
                    - variant_id
                    properties:
                      variant_id:
                        type: integer
                        description: Variant ID of the bundle product in the enrollment pack
                      bundled_items:
                        type: array
                        items:
                          type: object
                          required:
                          - variant_id
                          - quantity
                          properties:
                            variant_id:
                              type: integer
                              description: Variant ID of the selected bundle group item
                            quantity:
                              type: integer
                              minimum: 0
                              description: Quantity of this item
                            display_to_customer:
                              type: boolean
                              description: Whether to display this item to the customer
                            subscription:
                              type:
                              - boolean
                              - 'null'
                              description: Whether this item is a subscription
                            subscription_plan_id:
                              type:
                              - integer
                              - 'null'
                              description: Subscription plan ID for this item
      security: []
  "/api/public/v2025-06/commerce/carts/{cart_token}/items":
    post:
      summary: Adds items to cart
      tags:
      - carts
      operationId: public_v2025_06_cart_items-add
      description: Adds one or more variants — including dynamic bundles — to the cart.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartItemsAddResponse200ApplicationJsonSchema"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: Cart is being updated, please retry
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '422':
          description: Every requested item was skipped and nothing was added, or
            the request referenced an unknown cart_item_id / carried invalid item
            parameters.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/CartItemsAllSkippedResponse422ApplicationJsonSchema"
                - "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      variant_id:
                        type: integer
                        description: Variant ID
                      cart_item_id:
                        type: integer
                        description: ID of an existing cart line. When present, the entry
                          sets that line's quantity instead of adding a new item; quantity
                          0 removes the line. Fails when the id is not in the cart.
                      quantity:
                        type: integer
                        description: Quantity
                      subscription:
                        type: boolean
                        description: Whether item is a subscription
                      subscription_plan_id:
                        type: integer
                        description: Subscription plan ID
                      enrollment_pack_id:
                        type: integer
                        description: Enrollment pack ID
                      price:
                        type: number
                        format: decimal
                        description: Override price (admin only)
                      cv:
                        type: [number, string]
                        format: decimal
                        description: Override CV value (admin only)
                      qv:
                        type: [number, string]
                        format: decimal
                        description: Override QV value (admin only)
                      title:
                        type: string
                        description: Item title override
                      image_url:
                        type: string
                        description: Item image URL
                      display_to_customer:
                        type: boolean
                        description: Whether to display item to customer
                      bundled_items:
                        type: array
