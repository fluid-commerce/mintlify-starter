      summary: Shipping Address Change shipping address change
      description: Called by Fluid checkout when the buyer changes their shipping address inside the PayPal
        window. Writes the address to the cart as the ship-to address (and uses it for billing), reprices shipping
        and tax, then patches the PayPal order so its amount matches the cart. No Bearer token; the cart is
        addressed by `cart_token`. Returns 422 when `order_id` or `shipping_address` is missing, 404 when the
        cart or its PayPal payment account is not found, and 400 when PayPal rejects the update. Used by Fluid
        checkout and the FairShare SDK; direct REST integrations should use checkout-v2026-04.
      tags:
      - carts
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '409':
          "$ref": "#/components/responses/PaymentInProgressError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaypalShippingChangeResponse"
              example:
                success: true
                order_id: 5O190127TN364715T
                meta:
                  request_id: 9d4b1e72-6c3a-4f85-b0e9-2a7d5c8f1b63
                  timestamp: '2026-09-14T15:34:02Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
