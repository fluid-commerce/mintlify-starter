      description: |
        Polls for the order created from the cart after an asynchronous
        payment (for example an alternative payment method confirmed by a
        provider webhook). The request checks immediately and then waits up
        to about six seconds with backoff before answering. Returns the order
        once it exists, `{"payment_status": "declined"}` as soon as the cart's
        latest payment attempt is declined, or 404 if neither happens in time
        or the cart is unknown — retry the call to keep polling. No
        authentication is required; the unguessable cart token scopes access.
        Called by the FairShare SDK checkout; direct REST integrations should
        use `checkout-v2026-04`.
