  "/api/public/v2025-06/commerce/carts/{cart_token}/checkout":
    post:
      summary: Completes cart checkout
      tags:
      - carts
      operationId: public_v2025_06_cart-checkout
      description: |
        Submits the cart for payment and converts it to an order.

        Send `expected_total` and `expected_currency`, the total the shopper
        was shown, and the charge boundary refuses (`409`,
        `cart_total_changed`) to charge anything else. Without them the cart
        is charged whatever it says when the request is processed.
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartCheckoutResponse200ApplicationJsonSchema"
              example:
                order:
                  id: 58830
                  first_name: Holly
                  last_name: Flax
                  email: holly.flax@dundermifflin.com
                  phone: '+15705550142'
                  order_number: DM-100482
                  token: fo_3VbQ8mTk2WzR7nHp5LxYc9
                  status: awaiting_shipment
                  order_status: pending
                  financial_status: paid
                  fulfillment_status: unfulfilled
                  warehouse_id: null
                  order_type: purchased
                  amount: '126.53'
                  amount_in_base: '126.53'
                  base_to_currency_rate: '1.0'
                  refundable_amount: '126.53'
                  note: null
                  recurring: []
                  order_confirmation_url: https://checkout.fluid.app/orders/fo_3VbQ8mTk2WzR7nHp5LxYc9
                  currency_code: USD
                  created_at: '2026-09-17T14:25:41Z'
                  updated_at: '2026-09-17T14:25:43Z'
                  metadata: {}
                  external_id: null
                  enrollment_pack: null
                  enrollment_member_type: null
                  resulting_member_type: null
                  source: web
                  points_applied: 0
                  free_shipping: false
                  discount_codes: []
                  created_subscriptions: []
                meta:
                  request_id: c41e7a90-3b5d-4f28-9e61-8d2a0b7f5c13
                  shop_url: https://shop.dundermifflin.com
                  timestamp: '2026-09-17T14:25:43Z'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '409':
          description: |
            The cart no longer says the total sent as `expected_total`
            (`meta.code` = `cart_total_changed`, `meta.cart` carries the
            current total), or a checkout is already in flight for this cart
            (`errors.checkout`). Nothing was charged.
          content:
            application/json:
              schema:
                anyOf:
                - "$ref": "#/components/schemas/StandardErrorResponse"
                - "$ref": "#/components/schemas/CartTotalChangedErrorResponse"
        '422':
          description: Checkout could not be completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        description: |
          Optional. Other submit-time fields (fraud session, device data,
          browser info) are accepted as well. Send `accepted_agreement_ids`
          whenever the cart has a required agreement, and always send the
          `expected_total` / `expected_currency` pair.
        content:
          application/json:
            schema:
              type: object
              properties:
                accepted_agreement_ids:
                  type: array
                  items:
                    type: integer
                  description: |
                    Ids of the agreements the shopper accepted, from the cart's
                    `agreements` array. Required whenever the cart has a
                    required agreement: checkout refuses with `422` and
                    `errors.agreements` when any agreement the cart marks
                    `required` is missing from this list, unless the cart's
                    payment is already authorized or captured.
                  example:
                  - 658
                expected_total:
                  type: string
                  pattern: '^\d{1,12}(\.\d{1,5})?$'
                  description: |
                    The cart total the client showed the shopper, as a decimal
                    string in the cart currency's major unit (`"141.74"`), taken
                    from `amount_total` of the cart the client last rendered.
                    Requires `expected_currency`.
                  example: "141.74"
                expected_currency:
                  type: string
                  description: ISO 4217 code of the currency the shopper was
                    shown. Requires `expected_total`.
                  example: USD
                phone:
                  type: string
                  description: |
                    Phone number to save on the cart before the checkout runs,
                    for a company whose checkout settings require one.
                    Intended for a cart that cannot take a `PATCH`: once a
                    wallet payment is approved the cart is `authorized` and
                    every cart mutation answers `410`, so a shopper finishing
                    such a cart supplies the number here instead. Ignored on an
                    already-completed cart. A number that is still not dialable
                    leaves the checkout refused with `phone` in `errors`.
                  example: "+12125551005"
            example:
              expected_total: '126.53'
              expected_currency: USD
      security:
      - bearer_auth: []
      - {}
