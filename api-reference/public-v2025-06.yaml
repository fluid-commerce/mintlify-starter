  "/api/v202506/carts/{cart_token}/citcon_upi/ipn":
    post:
      operationId: public_v2025_06_carts_citcon_upi_ipn_post
      summary: Ipn ipn
      description: Receives Citcon UPI instant payment notifications (IPN) for a cart's payment. Called by Citcon's
        servers, not by storefront code, so no Bearer token is used; the cart is addressed by `cart_token`.
        The notification's `reference` must name the payment method attached to that cart, otherwise it returns
        404. Only `charge` transactions are processed; any other `transaction_type` returns 422. A `status`
        of `succeeded` records a captured payment and completes checkout. When the payment account requires
        signed notifications, a missing or invalid `sign` returns 401. A redelivered notification whose `id`
        was already recorded is acknowledged without creating a second payment. Returns 200 only once the notification
        is processed, so Citcon retries anything else.
      tags:
      - carts
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicPaymentWebhookAcknowledgementResponse"
              example:
                message: IPN processed successfully
                meta:
                  request_id: 7f3c2a91-4d6e-4b8a-9c15-2e8d0f6b1a47
                  timestamp: '2026-09-14T15:32:08Z'
        '401':
          description: The notification's signature was invalid, or was absent for
            an account that requires one
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The notification as Citcon posts it. Fields not listed here are accepted and kept
                with the payment record.
              properties:
                id:
                  type: string
                  description: Citcon transaction id. Used to recognize redelivered notifications.
                transaction_type:
                  type: string
                  description: Transaction type. Only `charge` is processed.
                reference:
                  type: string
                  description: Merchant reference in the form `<payment method uuid>--<unix timestamp>`, set
                    when the charge was created.
                status:
                  type: string
                  description: Transaction status. `succeeded` marks the payment captured.
                amount:
                  type: number
                  description: Transaction amount as reported by Citcon.
                currency:
                  type: string
                  description: ISO 4217 currency code.
                sign:
                  type: string
                  description: Citcon SHA-256 signature over the notification. Required when the payment account
                    enforces signed notifications.
            example:
              id: ch_7Hq2mWx9KtR4vLp3
              transaction_type: charge
              reference: 5b8e2f14-9c3a-4d71-a6e0-3f7b1c9d2e58--1789399862
              status: succeeded
              amount: 5499
              currency: USD
              sign: 4f9a1c7e2b6d8053a9e4c1f7b2d6e8a0c3f5b7d9e1a2c4f6b8d0e3a5c7f9b1d2
      security: []
