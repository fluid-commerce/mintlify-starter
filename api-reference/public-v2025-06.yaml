        schema:
          type: string
      - name: X-Date
        in: header
        required: true
        description: Timestamp included in the dLocal notification signature.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - status
              properties:
                id:
                  type: string
                  description: dLocal payment identifier for the renewal charge
                status:
                  type: string
                  description: dLocal payment status (PENDING, PAID, REJECTED, CANCELLED, EXPIRED)
                status_detail:
                  type:
                  - string
