  "/api/v202506/carts/{cart_token}/paypal/authorize_order":
    post:
      summary: Authorize order in paypal
      description: 'Authorizes a PayPal order after the buyer approves it in the PayPal window, placing a hold
        for the cart''s total. Called by Fluid checkout; no Bearer token, the cart is addressed by `cart_token`.
        The approved order''s own amount is compared with the repriced cart before anything is authorized; `expected_total`
        and `expected_currency` (sent together) are the fallback when PayPal''s amount cannot be read. If the
        totals disagree it returns 409 and nothing is authorized. The 200 response carries `authorized_total`,
        the amount PayPal now holds, whenever PayPal reported one. For a zero-amount "start free" subscription
        cart, send `setup_token_id` instead of `order_id`: the approved vault setup token is exchanged for a
        reusable PayPal payment method on the cart, nothing is charged, and the response carries `payment_method_id`.
        Returns 422 when `order_id` is missing on a chargeable cart or the cart does not require payment, 404
        when the cart or its PayPal payment account is not found, and 400 when PayPal declines the authorization.
        Used by Fluid checkout and the FairShare SDK; direct REST integrations should use checkout-v2026-04.'
      tags:
      - paypal
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '409':
          "$ref": "#/components/responses/PaymentInProgressError"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicCartPaypalOrderAuthorizationResponse"
              example:
                success: true
                order_id: 5O190127TN364715T
                authorization_id: 0VF52814937998046
                authorized_total:
                  amount_total: '66.43'
                  currency_code: USD
                meta:
                  request_id: 4d8b2f61-9a3c-4e57-b1d6-8c0f3a7e5b29
                  timestamp: '2026-09-14T15:37:22Z'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PaypalAuthorizeOrderRequestBodyApplicationJsonSchema"
              description: Request payload
            example:
              order_id: 5O190127TN364715T
              expected_total: '66.43'
              expected_currency: USD
        required: true
      operationId: public_v2025_06_post_api_v202506_carts_by_cart_token_paypal_authorize_order
      security: []
  "/api/v202506/carts/{cart_token}/paypal/create_order":
    post:
      summary: Create order in paypal
      description: 'Creates a PayPal order for the cart''s current total and returns its id for the PayPal JS
        SDK. Called by Fluid checkout; no Bearer token, the cart is addressed by `cart_token`. Send the buyer''s
        `funding_source` (for example `paypal` or `venmo`) or a vaulted `payment_token_id`; these may be sent
        as query parameters or in a JSON body. Returns 422 when both are blank, when the cart already holds
        a charge, or when PayPal rejects the order, and 404 when the cart or its PayPal payment account is not
        found. The 201 response has one of three shapes: a plain `order_id`; on the PayPal Fastlane flow, `order_id`
        plus the `authorization_id` and `payment_uuid` of an immediate authorization; or, for a zero-amount
        "start free" subscription cart, a vault `setup_token_id` and the `approve_url` the buyer approves it
        at. Used by Fluid checkout and the FairShare SDK; direct REST integrations should use checkout-v2026-04.'
      tags:
      - paypal
      parameters:
      - name: cart_token
        in: path
        required: true
        schema:
          type: string
      - name: funding_source
