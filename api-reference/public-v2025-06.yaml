          pattern: ^[a-zA-Z0-9_]+$
        key:
          description: The unique identifier for the metafield definition within its namespace and owner_resource. Combined with namespace and owner_resource, this must be unique per company.
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
        name:
          description: Human-readable display name for the metafield definition, shown in admin interfaces and forms.
          type:
          - string
          - 'null'
          maxLength: 100
        description:
          description: Detailed explanation of what this metafield definition represents, how it should be used, and any special instructions for content creators.
          type:
          - string
          - 'null'
        value_type:
          description: The data type that defines how metafield values should be validated, stored, and displayed. Determines which validation rules are available.
          type:
          - string
          - 'null'
        validation_rules:
          description: JSON object containing validation constraints that will be applied to metafield values. Available rules depend on the value_type.
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
        owner_resource:
          description: The type of resource (model class name) that metafields using this definition can be attached to. Must match the polymorphic owner_type.
          type:
          - string
          - 'null'
        pinned:
          description: Whether this definition should be prominently displayed or prioritized in admin interfaces and forms.
          type:
          - boolean
          - 'null'
          default: false
        position:
          default: 0
          description: Sort order for displaying this definition relative to others in the same category and owner_resource. Lower numbers appear first.
          type:
          - integer
          - 'null'
        locked:
          description: Whether this metafield definition is locked, preventing direct updates or deletions of metafields using this definition.
          type:
          - boolean
          - 'null'
          default: false
        created_at:
          description: Timestamp when the metafield definition was created.
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          description: Timestamp when the metafield definition was last updated.
          type:
          - string
          - 'null'
          format: date-time
        list_type:
          description: Whether this definition is for list-type metafields that store arrays of values.
          type:
          - boolean
          - 'null'
        reference_type:
          description: Whether this definition is for reference-type metafields that store references to other resources.
          type:
          - boolean
          - 'null'
        supported_validations:
          description: Array of validation rule names that are supported for this value_type.
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/JsonValue'
        validation_description:
          description: Human-readable description of what the value_type represents and its constraints.
          type:
          - string
          - 'null'
        category_ids:
          description: Array of category IDs that this metafield definition is associated with for organizational purposes.
          items:
            type: integer
          type:
          - array
          - 'null'
      additionalProperties: false
    PublicMetafield:
      title: LegacyMetafield
      type:
      - object
      - 'null'
      properties:
        id:
          type: integer
        namespace:
          description: A container for related metafields. Commonly used to group metafields by app or functionality.
          type:
          - string
          - 'null'
          maxLength: 20
          pattern: ^[a-zA-Z0-9_]+$
        key:
          description: The unique identifier for the metafield within its namespace. Must be unique per namespace and owner.
          type:
          - string
          - 'null'
          maxLength: 30
          pattern: ^[a-zA-Z0-9_]+$
        value:
          description: The actual data stored in the metafield. Type depends on value_type.
          anyOf:
          - type:
            - string
            - number
            - integer
            - boolean
            - 'null'
          - type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonValue'
          - type: array
            items:
              $ref: '#/components/schemas/JsonValue'
        value_type:
          description: The data type that defines how the value should be interpreted and validated.
          type:
          - string
          - 'null'
        description:
          description: Optional human-readable description explaining the purpose of this metafield.
          type:
          - string
          - 'null'
        owner_type:
          description: The type of resource that this metafield belongs to (polymorphic association).
          type:
          - string
          - 'null'
        owner_id:
          description: The ID of the specific resource that this metafield belongs to.
          type:
          - integer
          - 'null'
        created_at:
          description: Timestamp when the metafield was created.
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          description: Timestamp when the metafield was last updated.
          type:
          - string
          - 'null'
          format: date-time
        metafield_definition:
          $ref: '#/components/schemas/PublicMetafieldDefinition'
      additionalProperties: false
    OrderMeta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
        shop_url:
          type: string
        # Present only when the checkout was started from the member portal
        # (the cart was claimed there); `null` for storefront checkouts. This
        # operation shares its action with checkout-v2026-04's get_order, so it
        # emits the field too.
        portal_return_url:
          type:
          - string
          - 'null'
      additionalProperties: false
    ErrorMeta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
        shop_url:
          type:
          - string
          - 'null'
        cart:
          anyOf:
          - $ref: '#/components/schemas/Cart'
          - type: 'null'
      additionalProperties: false
paths:
  "/api/carts/{cart_token}/update_cart_items_prices":
    patch:
      summary: Update cart items prices
      operationId: public_v2025_06_commerce-carts-update-cart-items-prices
      description: Overrides line-item prices on the cart. Used by admin tooling;
        requires a bearer token.
      tags:
      - commerce
      security:
      - bearer_auth: []
      parameters:
      - name: cart_token
        in: path
        required: true
        description: Cart token
        schema:
          type: string
      responses:
        '409':
          "$ref": "#/components/responses/PaymentInProgressError"
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommerceCartsUpdateCartItemsPricesResponse200ApplicationJsonSchema"
              example:
                cart:
                  id: 48213
                  cart_token: ct_4mW8hTq2ZkP9vRnB6xYs1c
                  state: start
                  currency_code: USD
                  sub_total: 99.98
                  amount_total: 107.23
                  items:
                  - id: 91547
                    title: Dunder Mifflin 20lb Copy Paper
                    quantity: 2
                    price: '49.99'
                    total: '99.98'
                    metadata:
                      price_locked: true
                meta:
                  request_id: 3f6c2a91-8d4e-4b7a-9c15-2e8f0d6b7a43
                  timestamp: '2026-09-14T15:32:08Z'
        '401':
          description: Unauthorized
        '422':
          description: |-
            The request was understood but refused. Distinguish the cases by
            error_message:

            * the cart's items are immutable and cannot be repriced;
            * `price_authority` was sent by a credential that resolves to no
              holder, which means the record behind it has gone missing;
            * a release named an item the caller does not hold, either because
              another holder controls it or because it carries a legacy pin with
              no holder at all. `errors.cart_items` then lists the offending
              item ids and no price in the batch was written.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CommerceCartsUpdateCartItemsPricesRequestBodyApplicationJsonSchema"
            example:
              cart_items:
              - id: 91547
                price: '49.99'
  "/api/carts/{cart_token}/refresh-discounts":
    post:
      summary: Recalculate the cart's external discounts
      operationId: public_v2025_06_commerce-carts-refresh-discounts
      description: Re-runs the update_cart_discount callback fan-out for the cart
        and recalculates its totals. Fired best-effort by droplet integrations
        after they change the cart; the default response is a small receipt
        because those callers read only the status. In production, a company
        with no active update_cart_discount registration and no persisted
        external discount skips the recalculation and receives a receipt with
        refreshed false.
      tags:
      - commerce
      parameters:
      - name: cart_token
        in: path
        required: true
        description: Cart token
        schema:
          type: string
      responses:
        '409':
          "$ref": "#/components/responses/PaymentInProgressError"
        '410':
          "$ref": "#/components/responses/ProcessedCartResponse"
        '200':
          description: Receipt for the refresh, or the full cart when include_cart
            is requested
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: Default receipt; every live caller reads only the status
                  required:
                  - cart_token
                  - refreshed
                  properties:
                    cart_token:
                      type: string
                    refreshed:
                      type: boolean
                      description: False when the recalculation was skipped because
                        nothing was registered and nothing was persisted
                    reason:
                      type: string
                      description: Present only on a skipped refresh
                    meta:
                      "$ref": "#/components/schemas/ResponseMetadata"
                - type: object
                  description: Full cart body, returned when include_cart is requested
                  required:
                  - cart
                  properties:
                    cart:
                      "$ref": "#/components/schemas/Cart"
                    meta:
                      type: object
                      description: Standard response metadata plus the cart's
                        checkout and shop URLs
                      properties:
                        request_id:
                          type:
                          - string
                          - number
                        timestamp:
                          type: string
                        checkout_url:
                          type: string
                        shop_url:
                          type: string
              example:
                cart_token: ct_4mW8hTq2ZkP9vRnB6xYs1c
                refreshed: true
                meta:
                  request_id: 7b1e9d24-5a3c-4f86-b2d0-9c4e1a8f6b35
                  timestamp: '2026-09-14T15:34:51Z'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        required: false
        description: Optional flags; include_cart returns the full rendered cart
          instead of the receipt
        content:
          application/json:
            schema:
              type: object
              properties:
                include_cart:
                  type: boolean
                  description: Render the refreshed cart in the response body
            example:
              include_cart: false
  "/api/public/drop_zones":
    get:
      summary: An array of available checkout, order confirmation, and cart drop
        zones (public)
      description: Returns active checkout, order-confirmation, and slideout-cart
        drop zones for the requested Fluid shop. This is an SDK-internal surface
        used by the FairShare SDK; direct REST integrations should use
        checkout-v2026-04.
      tags:
      - public-drop-zones
      operationId: public_v2025_06_index_public_drop_zones
      parameters:
      - name: fluid_shop
        in: query
        required: true
        description: Company subdomain
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IndexDropZonesResponse200ApplicationJsonSchema"
              example:
                drop_zones:
                - uuid: 6f2d8a41-93c7-4e5b-b18a-2c7e0d94f3a6
                  name: Paper Protection Plan
                  active: true
                  settings:
                    page: checkout
                    zone: footer
                    priority: 1
                  embed_url: https://dunder-mifflin.fluid.app/drop_zones/paper-protection/embed
                - uuid: b3e91c07-5a4f-4d28-8e6b-71f0c2d9a845
                  name: Schrute Farms Beet Box Upsell
                  active: true
                  settings:
                    page: order_confirmation
                    zone: header
                    priority: 2
                  embed_url: https://dunder-mifflin.fluid.app/drop_zones/beet-box-upsell/embed
                meta:
                  request_id: 2d7c4b9e-1f38-4a6d-b5e0-8c93f17a2e54
                  timestamp: '2026-09-14T15:30:12Z'
                  pagination:
                    current_page: 1
                    total_pages: 1
                    total_count: 2
                    per_page: 25
        '404':
          description: No company matches the supplied fluid_shop
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: fluid_shop is missing or empty
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/public/health":
    get:
      operationId: public_v2025_06_public_health_get
      summary: Health health
      description: Liveness check for uptime monitors and load balancers.
        Reports whether the database and cache are reachable (`up` or `down`)
        and the running environment. No authentication is required. An
        unexpected failure returns 503 with an `error` message.
      tags:
      - public
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicHealthResponse"
              example:
                db: up
                redis: up
                env: production
        '503':
          description: Database or cache connectivity check failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
              example:
                error: Database connection unavailable
      security: []
  "/api/public/health/db_port":
    get:
      operationId: public_v2025_06_public_health_db_port_get
      summary: Db Port db port
      description: Diagnostic check that reports the database port the
        application is configured to connect to, so operators can confirm
        whether connections go through the connection pooler (6432) or directly
        to the database (5432). No authentication is required. An unexpected
        failure returns 503 with an `error` message.
      tags:
      - public
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicHealthDatabasePortResponse"
              example:
                db_port: 6432
                env: production
                timestamp: '2026-09-14T15:30:12Z'
      security: []
  "/api/public/health/homepage_render":
    get:
      operationId: public_v2025_06_public_health_homepage_render_get
      summary: Homepage Render homepage render
      description: Deep health check that renders the homepage of Fluid's
        designated health-check storefront end to end (active theme, homepage
        template, and page rendering) and reports what it rendered. No
        authentication is required. Returns 503 with a `status` of `unhealthy` and an
        `error` message when the storefront, its active theme, or its homepage
        template is missing, or rendering fails.
      tags:
      - public
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicHealthHomepageRenderResponse"
              example:
                status: healthy
                company: www
                theme: Scranton Paper Co.
                template: home_page
                html_length: 184233
                timestamp: '2026-09-14T15:30:12Z'
      security: []
  "/api/public/leaderboards/countries":
    get:
      operationId: public_v2025_06_public_leaderboards_countries_get
      summary: Countries countries
      description: Lists the country filter options for a company's rep
        leaderboards, as single-entry objects mapping an ISO country code to
        its name. The first entry is always `ALL` (All Countries), followed by
        the company's countries sorted by name. Identify the company with the
        `X-COMPANY-ID` header; no bearer token is required. Returns 401 when the
        header is missing or does not name an active company.
      tags:
      - public
      parameters:
      - name: X-COMPANY-ID
        in: header
        required: true
        description: ID of the active company whose leaderboard to read.
        schema:
          type: string
          pattern: "^[0-9]+$"
          example: "1482"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicLeaderboardCountryListResponse"
              example:
                message: success
                countries:
                - ALL: All Countries
                - CA: Canada
                - US: United States
        '401':
          description: The `X-COMPANY-ID` header is missing or names no active company.
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    example: Invalid Credentials
      security: []
  "/api/public/v2025-06/affiliates/lookup":
    post:
      summary: Retrieve affiliate information
      operationId: public_v2025_06_affiliate-lookup
      description: Resolves the rep (affiliate) a storefront visitor is attributed
        to. Send the shop in metadata.fluid_shop and one identifier in
        metadata.attribution (email, username, share_guid, fluid_rep_id, or
        external_id). No authentication is required; the shop is resolved from
        fluid_shop. If metadata.fluid_session is sent it must be a valid session
        token, otherwise the request fails with 422. Returns 404 when the shop
        does not resolve or no affiliate matches the identifier. Used by the
        FairShare SDK; direct REST integrations should use checkout-v2026-04.
      tags:
      - affiliate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AffiliateLookupResponse201ApplicationJsonSchema"
              example:
                status: 201
                affiliate:
                  name: Dwight Schrute
                  email: dwight.schrute@dundermifflin.com
                  image_url: https://cdn.fluid.app/uploads/users/48213/avatar.jpg
                  username: dwight-schrute
                  external_id: DM-REP-1042
                  fluid_rep_id: 48213
                metadata:
                  fluid_shop: dunder-mifflin.fluid.app
                  fluid_session: fs_7kQx9mR2vWbT4nHcJ8pLz3
                  fluid_locale: en_US
                  request_uuid: 9a2d4c7e-1b3f-4e58-8a6d-5c0f2b7e9d14
                  timestamp: '2026-09-14T15:30:12Z'
        '404':
          description: Affiliate not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AffiliateLookupRequestBodyApplicationJsonSchema"
            example:
              metadata:
                fluid_shop: dunder-mifflin.fluid.app
                fluid_session: fs_7kQx9mR2vWbT4nHcJ8pLz3
                fluid_locale: en_US
                attribution:
                  username: dwight-schrute
      security: []
