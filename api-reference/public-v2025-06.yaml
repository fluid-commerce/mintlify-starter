    CommerceCartsUpdateCartItemsPricesRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        cart_token:
          type: string
          description: Token of the cart to update
        cart_items:
          type:
          - array
          - 'null'
          description: Array of cart items with their new prices
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                type: integer
                description: Cart item ID
              price:
                type:
                - string
                - number
                - 'null'
                format: decimal
                description: New price for the cart item
        price_authority:
          type:
          - object
          - 'null'
          description: Whether the caller is taking control of these prices, or
            handing control back. Omit it (or send null) to override prices
            without recording a hold, which is how this endpoint has always
            behaved. An empty object claims the prices for the caller. The
            holder is derived from the authenticated credential and is never
            accepted from the request body, so a caller cannot present itself as
            a different holder. Holds are not exclusive. A hold records whoever
            last set the price, so a later override or claim by another holder
            moves it, which is how admin tooling overrides an integration's
            price. What is protected is handing a hold back, which only ever
            affects the calling holder's own items. A credential that resolves
            to no holder (a customer or portal-member token) is rejected with
            422.
          properties:
            reason:
              type:
              - string
              - 'null'
              description: Why the caller is taking control of these prices
            release:
              type:
              - boolean
              - 'null'
              description: Hand control back rather than take it. Clears the
                calling holder's hold from every item on the cart, returning
                those items to automatic pricing on the next full pricing run,
                and leaves other holders' items untouched. Send with an empty
                cart_items when only the hold needs clearing and the prices are
                already correct. Rejected with 422 if cart_items names an item
                held by a different holder.
          additionalProperties: false
