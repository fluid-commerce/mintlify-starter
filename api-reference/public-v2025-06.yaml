  "/api/public/v2025-06/events/leads/capture":
    post:
      summary: Save a new lead capture
      description: |
        `metadata.fluid_session` is best-effort here. A lead carries a real
        person's name, email and question, so a browser that cannot produce a
        readable session token is not a reason to reject it: the captured
        event falls back to its own UUID and the lead is still recorded.
        Attribution is carried by `metadata.attribution` rather than the
        session, so rep credit is unaffected by the fallback.

        This is deliberately more forgiving than the other analytics events on
        this API, which still require a readable session token. `RequestMetadata`
        is shared with those operations, so the `fs_...` format it annotates on
        `fluid_session` describes them rather than this one — a value that fails
        it is still accepted here.
      operationId: public_v2025_06_lead-capture
      tags:
      - events
      - lead
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiResponse"
              example:
                status: 201
                metadata:
                  fluid_shop: dunder-mifflin.fluid.app
                  fluid_session: fs_7kQx9mR2vWbT4nHcJ8pLz3
                  fluid_locale: en_US
                  request_uuid: a7d3f1b8-2c6e-4a95-8b04-1e9c5d7f3a26
                  timestamp: '2026-09-14T15:33:05Z'
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LeadCaptureRequestBodyApplicationJsonSchema"
            example:
              lead:
                message: Can Dunder Mifflin match our current paper supplier's price for 40 cases a month?
                contact:
                  name: Jan Levinson
                  email: jan.levinson@serenitybyjan.com
                  phone: +1 570 555 0143
              page:
                url: https://shop.dundermifflin.com/pages/bulk-orders
                title: Bulk paper orders
                description: Volume pricing for offices of every size.
                image: https://cdn.fluid.app/uploads/dunder-mifflin/pages/bulk-orders/hero.jpg
              metadata:
                fluid_shop: dunder-mifflin.fluid.app
                fluid_session: fs_7kQx9mR2vWbT4nHcJ8pLz3
                fluid_locale: en_US
                attribution:
                  username: dwight-schrute
      security: []
