    PublicVenmoShippingCallbackUpdate:
      type: object
      properties:
        id:
          type: string
        purchase_units:
          type: array
          items:
            type: object
            properties:
              reference_id:
                type: string
              amount:
                type: object
                properties:
                  currency_code:
                    type: string
                  value:
                    type: string
                    pattern: '^((-?[0-9]+)|(-?([0-9]+)?[.][0-9]+))$'
                    description: PayPal's Money type is a decimal STRING at the
                      currency's minor units — "1.76", never 1.76. The parser that
                      reads a merchant's callback answer nulls a numeric value
                      rather than coercing it.
                  breakdown:
                    type: object
                    properties:
                      item_total:
                        "$ref": "#/components/schemas/PublicVenmoShippingCallbackMoney"
                      shipping:
                        "$ref": "#/components/schemas/PublicVenmoShippingCallbackMoney"
                      tax_total:
                        "$ref": "#/components/schemas/PublicVenmoShippingCallbackMoney"
                    required:
                    - item_total
                    - shipping
                    - tax_total
                    additionalProperties: false
                required:
                - currency_code
                - value
                - breakdown
                additionalProperties: false
              shipping_options:
                type: array
                minItems: 1
                maxItems: 10
                description: The methods the buyer may pick from, exactly one of them
                  selected. OPTIONAL — PayPal rejects a list with nothing selected, so a
                  cart whose shipping cost matches no offered method answers with the
                  amount alone and no options key at all. Never sent empty.
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The shipping method id as a string. Fluid's own shipping
                        strategy keys methods by record id, so this is a stringified integer
                        for most merchants.
                    label:
                      type: string
                      maxLength: 50
                      description: The buyer-facing method name, truncated to PayPal's limit.
                        Never blank.
                    type:
                      type: string
                      description: Always SHIPPING. PayPal discards an option that omits it.
                    selected:
                      type: boolean
                      description: True on EXACTLY one option, never more and never fewer —
                        the method the cart was repriced against, whose price the breakdown's
                        shipping component quotes. PayPal throws SHIPPING_OPTION_NOT_SELECTED
                        on a list with none selected, so when neither the cart's chosen method
                        nor its quoted shipping matches anything on offer, the whole
                        shipping_options key is omitted instead. Marking an option would tell
                        PayPal a shipping cost the breakdown does not charge, and a wrong price
                        is worse than no list.
                    amount:
                      "$ref": "#/components/schemas/PublicVenmoShippingCallbackMoney"
                  required:
                  - id
                  - label
                  - type
                  - selected
                  - amount
                  additionalProperties: false
            required:
            - reference_id
            - amount
            additionalProperties: false
      required:
      - id
      - purchase_units
      additionalProperties: false
    PublicVenmoShippingCallbackMoney:
      description: One money value in a Venmo shipping callback answer — a
