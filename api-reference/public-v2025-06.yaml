            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      security: []
  "/api/v202506/subscriptions/renewals/dlocal":
    post:
      operationId: public_v2025_06_subscriptions_renewals_dlocal_post
      summary: Create dlocal renewal notification
      description: Receives signed dLocal settlement notifications for subscription
