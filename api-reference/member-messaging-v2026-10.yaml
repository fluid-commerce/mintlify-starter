                      filename:
                        type: string
                        minLength: 1
                        maxLength: 255
                      content_type:
                        type: string
                        minLength: 1
                        maxLength: 255
                      content_size:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
              anyOf:
              - required:
                - text
                properties:
                  text:
                    pattern: "\\S"
              - required:
                - attachments
                properties:
                  attachments:
                    minItems: 1
