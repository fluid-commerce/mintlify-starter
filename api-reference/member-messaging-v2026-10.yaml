  "/api/member/v2026-10/messaging/realtime/auth":
    post:
      operationId: member_messaging_realtime_auth
      tags:
      - messaging
      summary: Admit a realtime socket
      description: |
        Issues a ticket that admits one socket connection within one minute, so the bearer credential
        never travels in a socket URL. Connect with `member_socket_token` and subscribe to
        `MessageChannel`. The socket then receives what a member storefront socket for the same
        membership receives. The ticket is checked again at connect: a membership that can no longer
        act or message is refused. The socket may subscribe to the messaging channels only, and the
        membership is checked again before each channel command.

        The read-only portal JWT may ask for a ticket: a socket only receives what the credential can
        already read, and legacy sockets accept a portal JWT. A member session JWT, the kind order and
        subscription email links carry, may not: legacy sockets refuse it.
      x-fluid-audience: member
      responses:
        '201':
          description: A socket ticket.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RealtimeEnvelope"
              example:
                status: 201
                data:
                  ticket: eyJfcmFpbHMiOnsiZGF0YSI6eyJtZW1iZXJfaWQiOiJjMGRkNjgxMiJ9fX0--4f1c2b
                  expires_at: '2026-10-01T15:05:05Z'
                  url: wss://websockets.fluid.app/cable
                  channel: MessageChannel
                  connect_params:
                    member_socket_token: eyJfcmFpbHMiOnsiZGF0YSI6eyJtZW1iZXJfaWQiOiJjMGRkNjgxMiJ9fX0--4f1c2b
                meta:
                  request_uuid: '01a0f4fe-de00-75b3-8d8a-b74b0cde8b07'
                  timestamp: '2026-10-01T15:04:05Z'
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: >-
            The membership cannot message (a customer or preferred customer, even when its member type
            grants the rep-eligible capability, or a membership with no messaging identity), or the
            credential is a member session JWT, the kind order and subscription email links carry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/messaging/recipients/search":
    get:
      operationId: member_messaging_recipients_search
      tags:
      - messaging
      summary: Search people to message
      description: |
        Searches, in the server's own database, the people the member may start a conversation with or
        add to a group: the other members of the member's company by name, as the legacy recipient list
        offers them, and the member's own contacts with an email address or phone number by name or
        email. Another member's email is never matched. Members blocked by or blocking the member are
        left out.
        Members come first, then contacts, each by first name, each kind at most `limit`.

        Limited to 30 searches per minute per credential. Responses are never stored.
      x-fluid-audience: member
      parameters:
      - name: q
        in: query
        required: true
        description: At least two characters once trimmed of surrounding whitespace.
        schema:
          type: string
          minLength: 2
          maxLength: 100
        example: nat
      - name: limit
        in: query
        required: false
        description: Most results of each kind. Defaults to 10.
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 10
      responses:
