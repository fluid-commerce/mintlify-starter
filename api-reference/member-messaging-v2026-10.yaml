    post:
      operationId: member_messaging_conversation_scheduled_messages_create
      tags:
      - messaging
      summary: Schedule a message
      description: |
        Schedules a message of text, attachments or both for later, to be sent as the conversation's
        delivery kind (an email or SMS for a contact conversation, direct otherwise). Scheduling clears the member's own draft in
        the conversation. It needs the same standing as sending a premium message: a membership
        without it, or a conversation it can no longer post to, returns 403.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - scheduled_at
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  pattern: "\\S"
                  description: Required unless the schedule has attachments; it may not be blank.
                scheduled_at:
                  type: string
                  format: date-time
                  description: >-
                    A future ISO 8601 timestamp with an explicit UTC offset (`Z` or `+05:45`); one without an
                    offset is refused.
                theme:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                attachments:
                  type: array
                  maxItems: 10
                  description: >-
                    Files the client has uploaded, named by URL, as the legacy schedule endpoint takes them.
                    The URL is not checked as an owned upload.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - url
                    - filename
                    properties:
                      url:
                        type: string
                        maxLength: 2048
                        pattern: "^https?://\\S+$"
                      filename:
                        type: string
                        maxLength: 255
                      content_type:
                        type: string
                        maxLength: 255
                      content_size:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
              anyOf:
              - required:
                - text
              - required:
                - attachments
                properties:
                  attachments:
                    minItems: 1
            example:
              text: Doors open at nine.
              scheduled_at: '2030-01-15T10:00:00-05:00'
      responses:
        '201':
          description: The scheduled message.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScheduledMessageEnvelope"
