      description: |
        Changes the text, theme, time or attachments of the member's pending schedule. Only the fields sent change,
        and the delivery kind is kept. Unlike a new schedule, a changed time is not required to be in the
        future, as in the legacy update. Offset timestamps name the same instant and are returned in
        UTC. A schedule that a delivery has claimed, another person's, or one in a conversation the
        member can no longer see returns 404.
