  "/api/member/v2026-10/messaging/conversations/{id}/draft":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of a conversation the member can see.
      schema:
        type: string
        format: uuid
    put:
      operationId: member_messaging_drafts_update
      tags:
      - messaging
      summary: Save a draft
      description: |
        Saves the member's own unsent draft in the conversation without sending it. Only the fields
        sent change. A submission with no text, no subject, no reply and no attachments removes the
        whole draft and answers an empty object. A request with no body is refused rather than read as
        an empty submission, so only an explicit empty JSON object clears the draft. Attachments sent
        are added to those already saved, and a draft that has attachments needs no text. A file already
        on the draft with the same URL and filename is not added again, and a save that would leave the
        draft with more than 10 attachments is refused with 422.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text:
                  type:
                  - string
                  - 'null'
                  maxLength: 10000
                subject:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                reply_to_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: A message in this conversation the member can read; null removes the reply.
                attachments:
                  type: array
                  maxItems: 10
                  description: >-
                    Files the client has uploaded, named by URL, as the legacy composer takes them. They are
                    added to the draft's saved attachments, which hold at most 10 in all. The URL is not checked as an owned upload.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - url
                    - filename
                    properties:
                      url:
                        type: string
                        maxLength: 2048
                        pattern: "^https?://\\S+$"
                      filename:
                        type: string
                        maxLength: 255
                      content_type:
                        type: string
                        maxLength: 255
                      content_size:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
            example:
              text: Running ten minutes late.
              subject: Kickoff
      responses:
        '200':
          description: The saved draft, or an empty object when a blank save cleared it.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DraftEnvelope"
              example:
                status: 200
                data:
                  id: '0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a70'
                  conversation_id: '0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b'
                  text: Running ten minutes late.
                  subject: Kickoff
                  attachments: []
                  reply_to:
                  mentioned_recipients: []
                  created_at: '2026-10-01T15:01:59Z'
                  updated_at: '2026-10-01T15:01:59Z'
                meta:
                  request_uuid: '01a0f4fe-de00-75b3-8d8a-b74b0cde8b07'
                  timestamp: '2026-10-01T15:04:05Z'
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The credential is read-only, the membership cannot message, or the change is not allowed here.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: Nothing with this id is visible to the member.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The request has no body, a parameter is invalid or unknown (such as an attachment without an http(s) URL or with a size above 2147483647), or the reply target is not in this conversation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: member_messaging_drafts_destroy
      tags:
