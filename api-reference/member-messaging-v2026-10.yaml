      summary: Send a message
      description: |
        Sends a text message through the same writer every other client uses, so delivery, push and the
        conversation's state update as they do there. A contact conversation sends email or SMS. A
        conversation the member cannot post to (a broadcast-only channel, an archived or closed
        conversation, or one the member has archived for themselves) returns 403.

        A retry with the same `client_message_id` returns the message already sent, even when the
        conversation has closed since. If that message was deleted, the response carries no text or
        attachments.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Required unless the message has attachments.
                reply_to_id:
                  type: string
                  format: uuid
                  description: A message in this conversation the member can read.
                client_message_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: >-
                    An id the client chooses. A retry with the same id returns the message already sent,
                    with 200, instead of sending it again.
                attachments:
                  type: array
                  maxItems: 10
                  description: >-
                    Files the client has uploaded, named by URL, as the legacy message endpoint takes them. The
                    URL is not checked as an owned upload.
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - url
