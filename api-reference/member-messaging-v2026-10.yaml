  "/api/member/v2026-10/messaging/conversations/{id}/messages":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of a conversation the member can see.
      schema:
        type: string
        format: uuid
    get:
      operationId: member_messaging_messages_index
      tags:
      - messaging
      summary: List messages
      description: |
        The conversation's messages the member can read, newest first: others' messages once delivered
        after the member joined, and the member's own. Messages deleted for everyone or for the member,
        drafts and scheduled messages are left out. Conversation events (people joining, leaving or
        being added, a rename) are included as messages of `kind` `event`, as in the legacy list; a
        channel leaves out the membership events.

        As the legacy message list does, reading marks the conversation read for the member, unless
        `preview` is `true`. The member's `unread` state is cleared before the page is read, so a
        message that arrives in between is on the page.

        Access is rechecked on every request: a member who leaves a Team group can no longer read any
        of its messages, old or new.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication and the current read run before a 304 is
          considered.
        schema:
          type: string
      - name: preview
        in: query
        required: false
        description: When `true`, read without marking the conversation read.
        schema:
          type: boolean
          default: false
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`. A malformed, tampered or expired cursor returns
          400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
