---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Messaging
  description: |
    The signed-in member's messaging. Every operation acts as the member the
    bearer credential speaks for; the member and their company come from the
    credential alone.

    Messaging follows the rule the legacy messaging API applies: a
    membership with a messaging identity whose member type is the rep type,
    a company admin who holds the messaging view permission, or a root
    admin. A company admin's own credential is not a member credential and
    receives 401, so in practice a rep's or a root admin's membership
    reaches messaging. A customer or preferred-customer
    membership receives 403 from every operation, even when its member type
    grants the rep-eligible capability. A member session JWT, the kind order
    and subscription email links carry, never authenticates a rep, so it also
    receives 403 from every operation.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: messaging
  description: The signed-in member's conversations, messages and realtime delivery.
  x-fluid-section: Messaging
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or a member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's current representation. Send it back in If-None-Match; the server
        reads the member's current conversations before answering 304.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Reads are private and revalidated on every use.
      schema:
        type: string
        example: max-age=0, private
    CacheControlNoStore:
      description: Standard HTTP Cache-Control directive. Responses are never stored.
      schema:
        type: string
        example: no-store
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    Identity:
      type: object
      description: "A participant: a member, one of the member's contacts, or another kind of recipient such as a bot."
      additionalProperties: false
      required:
      - id
      - kind
      - name
      - avatar_url
      properties:
        id:
          type: string
          format: uuid
          description: The member's id, the contact's id, or the recipient's own id for other kinds.
        kind:
          type: string
          enum:
          - member
          - contact
          - other
          description: What `id` refers to.
        name:
          type:
          - string
          - 'null'
          description: First and last name. Email and phone are never shown in its place.
        avatar_url:
          type:
          - string
          - 'null'
          description: Avatar image, when there is one.
    Conversation:
      type: object
      description: One conversation as the signed-in member sees it.
      additionalProperties: false
      required:
      - id
      - kind
      - title
      - avatar_url
      - recipients
      - recipients_truncated
      - last_message
      - unread
      - archived
      - pinned_count
      - last_activity_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - direct
          - group
          - downline
          - channel
          description: >-
            `direct` (one other person, a member or a contact by email or SMS), `group`, `downline` (the
            creator's current Team) or a company `channel`.
        title:
          type:
          - string
          - 'null'
          description: >-
            The conversation's name, or up to three other participants' names. A direct conversation is
            titled by the name stored for the member's seat, as in the legacy conversation list, which for
            a contact with no name is their email or phone; renaming a direct conversation does not change
            this title.
        avatar_url:
          type:
          - string
          - 'null'
          description: >-
            The conversation's image, or, in an in-app direct conversation, the other participant's
            avatar. An email or SMS conversation shows only its own image.
        recipients:
          type: array
          description: >-
            Other current participants in the order they joined: at most 10 in a list and 100 in a
            detail. A downline conversation lists only current Team members.
          items:
            "$ref": "#/components/schemas/Identity"
        recipients_truncated:
          type: boolean
          description: Whether more current participants exist than `recipients` shows.
        last_message:
          type:
          - object
          - 'null'
          description: The newest message the member can read.
          additionalProperties: false
          required:
          - id
          - preview
          - sent_at
          - sender_id
          properties:
            id:
              type: string
              format: uuid
            preview:
              type: string
              description: Up to 140 characters of the text.
            sent_at:
              type: string
              format: date-time
            sender_id:
              type:
              - string
              - 'null'
              format: uuid
              description: The sender's participant `id`.
        unread:
          type: boolean
          description: Whether the conversation has messages the member has not read.
        archived:
          type: boolean
          description: Whether the member archived it.
        pinned_count:
          type: integer
          minimum: 0
          description: Pinned messages.
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Latest activity; the list's sort key.
        draft_message:
          description: >-
            The member's own saved draft. Present only when the request asks for it with
            `include=draft`; null when the member has no draft here.
          oneOf:
          - "$ref": "#/components/schemas/Draft"
          - type: 'null'
        created_at:
          type: string
          format: date-time
    Draft:
      type: object
      description: >-
        The member's unsent draft in one conversation. It is never delivered; sending is a separate
        message.
      additionalProperties: false
      required:
      - id
      - conversation_id
      - text
      - subject
      - attachments
      - reply_to
      - mentioned_recipients
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        text:
          type: string
          description: The draft text; empty when only a subject or a reply was saved.
        subject:
          type:
          - string
          - 'null'
        attachments:
          type: array
          description: Files attached to the draft.
          items:
            type: object
            additionalProperties: false
            required:
            - url
            - filename
            - content_type
            - kind
            - content_size
            properties:
              url:
                type:
                - string
                - 'null'
              filename:
                type:
                - string
                - 'null'
              content_type:
                type:
                - string
                - 'null'
              kind:
                type:
                - string
                - 'null'
                description: The kind of file the server derived, such as `image` or `pdf`.
              content_size:
                type:
                - integer
                - 'null'
                description: Size in bytes, when the client sent it.
        reply_to:
          type:
          - object
          - 'null'
          description: The message this draft replies to, while the member can still read it.
          additionalProperties: false
          required:
          - id
          - preview
          properties:
            id:
              type: string
              format: uuid
            preview:
              type: string
              description: Up to 140 characters of its text.
        mentioned_recipients:
          type: array
          description: People mentioned in the text who are still participants.
          items:
            "$ref": "#/components/schemas/Identity"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DraftEnvelope:
      type: object
      description: The saved draft, or an empty object after a blank save cleared it.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          oneOf:
          - "$ref": "#/components/schemas/Draft"
          - type: object
            additionalProperties: false
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ConversationEnvelope:
      type: object
      description: One conversation.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Conversation"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ConversationsEnvelope:
      type: object
      description: A page of conversations.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Conversation"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    RealtimeTicket:
      type: object
      description: A single-use socket ticket and how to connect with it.
      additionalProperties: false
      required:
      - ticket
      - expires_at
      - url
      - channel
      - connect_params
      properties:
        ticket:
          type: string
          description: The ticket. It admits one socket connection, once, until `expires_at`.
        expires_at:
          type: string
          format: date-time
          description: When the ticket stops admitting a connection, one minute after issue.
        url:
          type:
          - string
          - 'null'
          description: The socket endpoint to connect to.
        channel:
          type: string
          description: The channel to subscribe to once connected.
          enum:
          - MessageChannel
        connect_params:
          type: object
          description: The parameters to send when connecting.
          additionalProperties: false
          required:
          - member_socket_token
          properties:
            member_socket_token:
              type: string
              description: The ticket.
    RealtimeEnvelope:
      type: object
      description: A socket ticket.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/RealtimeTicket"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    IdentityList:
      type: object
      description: People the member may message.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Identity"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    MessagesEnvelope:
      type: object
      description: A page of messages.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Message"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    MessageEnvelope:
      type: object
      description: One message.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Message"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    Message:
      type: object
      description: One message as the signed-in member sees it.
      additionalProperties: false
      required:
      - id
      - conversation_id
      - sender
      - kind
      - text
      - event
      - attachments
      - reply_to
      - reactions
      - pinned
      - seen_by_count
      - client_message_id
      - sent_at
      - created_at
      - edited_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender:
          oneOf:
          - "$ref": "#/components/schemas/Identity"
          - type: 'null'
          description: Who sent it, or null for a sender that no longer exists.
        kind:
          type: string
          enum:
          - message
          - event
          description: A message someone wrote, or an event the conversation recorded, such as a person joining.
        text:
          type: string
          description: The message text; empty for an event.
        event:
          type:
          - object
          - 'null'
          description: What happened, for an event; null for a message.
          additionalProperties: false
          required:
          - name
          - people
          - previous_title
          - title
          properties:
            name:
              type: string
              description: >-
                The event, such as `recipient_added`, `recipient_joined`, `recipient_removed`,
                `recipient_left` or `conversation_name_updated`.
            people:
              type: array
              description: Up to 10 people a membership event names.
              items:
                "$ref": "#/components/schemas/Identity"
            previous_title:
              type:
              - string
              - 'null'
              description: The title before a rename.
            title:
              type:
              - string
              - 'null'
              description: The title after a rename.
        attachments:
          type: array
          description: Files attached to the message.
          items:
            type: object
            additionalProperties: false
            required:
            - url
            - filename
            - content_type
            - kind
            - content_size
            properties:
              url:
                type:
                - string
                - 'null'
              filename:
                type:
                - string
                - 'null'
              content_type:
                type:
                - string
                - 'null'
              kind:
                type:
                - string
                - 'null'
                description: The kind of file the server derived, such as `image` or `pdf`.
              content_size:
                type:
                - integer
                - 'null'
                description: Size in bytes, when the client sent it.
        reply_to:
          type:
          - object
          - 'null'
          description: The message this one replies to, unless it was deleted.
          additionalProperties: false
          required:
          - id
          - preview
          properties:
            id:
              type: string
              format: uuid
            preview:
              type: string
              description: Up to 140 characters of its text.
        reactions:
          type: array
          description: Reaction totals, and whether the member chose each.
          items:
            type: object
            additionalProperties: false
            required:
            - emoji
            - count
            - mine
            properties:
              emoji:
                type: string
              count:
                type: integer
                minimum: 1
              mine:
                type: boolean
        pinned:
          type: boolean
        seen_by_count:
          type: integer
          minimum: 0
          description: Participants who have seen it.
        client_message_id:
          type:
          - string
          - 'null'
          description: The id the sending client chose, when it sent one.
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it was delivered; null while the member's own message is still queued.
        created_at:
          type: string
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
    ScheduledMessagesEnvelope:
      type: object
      description: A page of scheduled messages.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/ScheduledMessage"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    ScheduledMessageEnvelope:
      type: object
      description: One scheduled message.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/ScheduledMessage"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    ScheduledMessage:
      type: object
      description: >-
        A message the member scheduled. When delivery claims it, it becomes an ordinary message of the
        conversation and is no longer listed here.
      additionalProperties: false
      required:
      - id
      - conversation_id
      - text
      - theme
      - scheduled_at
      - attachments
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        text:
          type: string
        theme:
          type:
          - string
          - 'null'
          description: The message theme the client chose, when it chose one.
        scheduled_at:
          type: string
          format: date-time
          description: When delivery is due, in UTC.
        attachments:
          type: array
          description: Files attached to the scheduled message.
          items:
            type: object
            additionalProperties: false
            required:
            - url
            - filename
            - content_type
            - kind
            - content_size
            properties:
              url:
                type:
                - string
                - 'null'
              filename:
                type:
                - string
                - 'null'
              content_type:
                type:
                - string
                - 'null'
              kind:
                type:
                - string
                - 'null'
                description: The kind of file the server derived, such as `image` or `pdf`.
              content_size:
                type:
                - integer
                - 'null'
                description: Size in bytes, when the client sent it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
paths:
  "/api/member/v2026-10/messaging/conversations":
    get:
      operationId: member_messaging_conversations_index
      tags:
      - messaging
      summary: List conversations
      description: |
        The member's conversations, most recent activity first: direct, group, downline and company
        channel conversations in which the member holds a current seat. Company announcements are not
        listed here. Open, unarchived conversations are listed by default; `filter[archived]=true` lists
        those the member archived and those archived for everyone. A closed conversation is in neither
        list. A conversation with no message yet is not listed, and conversation kinds the company
        hides from messaging are left out of the list, though one the member holds a seat in can still
        be fetched and changed by id.

        Access is rechecked on every request: a member who leaves a Team group no longer sees its
        downline conversation, or its messages, from the next read.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication and the current read run before a 304 is
          considered.
        schema:
          type: string
      - name: filter[archived]
        in: query
        required: false
        description: "`true` lists conversations the member archived or that are archived for everyone, instead of the inbox."
        schema:
          type: boolean
      - name: filter[unread]
        in: query
        required: false
        description: "`true` lists only conversations with unread messages."
        schema:
          type: boolean
          enum:
          - true
      - name: filter[q]
        in: query
        required: false
        description: Matches the conversation's name or a participant's name, email or phone.
        schema:
          type: string
          maxLength: 100
      - name: page[cursor]
        in: query
        required: false
        description: >-
          Opaque cursor from `meta.pagination.next_cursor`. A malformed, tampered or expired cursor returns
          400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of conversations.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConversationsEnvelope"
              example:
                status: 200
                data:
                - id: '0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b'
                  kind: group
                  title: Launch team
                  avatar_url:
                  recipients:
                  - id: '01a08944-eff4-7a2a-be01-d699fa649966'
                    kind: member
                    name: Nathan Rivera
                    avatar_url:
                  recipients_truncated: false
                  last_message:
                    id: '0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a60'
                    preview: See you at the kickoff.
                    sent_at: '2026-10-01T15:02:00Z'
                    sender_id: '01a08944-eff4-7a2a-be01-d699fa649966'
                  unread: true
                  archived: false
                  pinned_count: 0
                  last_activity_at: '2026-10-01T15:02:00Z'
                  created_at: '2026-09-28T12:00:00Z'
                meta:
                  request_uuid: '01a0f4fe-de00-75b3-8d8a-b74b0cde8b07'
                  timestamp: '2026-10-01T15:04:05Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The credential is read-only, or the membership cannot message.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A parameter is invalid or unknown.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      operationId: member_messaging_conversations_create
      tags:
      - messaging
      summary: Start a conversation
      description: |
        Starts a conversation with addressable people (see `GET /messaging/recipients/search`), or
        returns the one that already exists with exactly the same people. One member and no title is a
        direct conversation; more people, or a title, make a group. One of the member's own contacts
        and no title starts a one-to-one email conversation, or SMS when the contact has no email
        address. A group may hold members and the member's own contacts together, as legacy groups do.

        A new conversation is listed once its first message is sent.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - recipients
              properties:
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: >-
                    The other people, each named by exactly one of `member_id` (another member of the
                    company) or `contact_id` (one of the member's own contacts).
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      member_id:
                        type: string
                        format: uuid
                      contact_id:
                        type: string
                        format: uuid
                    oneOf:
                    - required:
                      - member_id
                    - required:
                      - contact_id
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: A name, which makes a group even with one other member.
            example:
              recipients:
              - member_id: '01a08944-eff4-7a2a-be01-d699fa649966'
              title: Launch team
      responses:
        '201':
          description: The new conversation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ConversationEnvelope"
              example:
                status: 201
                data:
                  id: '0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b'
                  kind: group
                  title: Launch team
                  avatar_url:
