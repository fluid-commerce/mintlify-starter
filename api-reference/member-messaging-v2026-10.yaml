                text:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  pattern: "\\S"
                scheduled_at:
                  type: string
                  format: date-time
                  description: >-
                    An ISO 8601 timestamp with an explicit UTC offset (`Z` or `+05:45`); one without an
                    offset is refused. Unlike a new schedule, it may be in the past.
                theme:
                  type:
                  - string
                  - 'null'
                  maxLength: 255
                attachments:
                  type: array
                  maxItems: 10
