openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Flow member messaging policy, channel moderation and Today
  version: 2026-10
  description: 'Whom your Members may see, search and message in Flow (Fluid Messaging), and which contact fields they
    see on each other.


    Some companies keep Members from finding and messaging each other, to prevent cross-recruiting between teams or for
    privacy. The policy only limits a Member reaching another Member: admins, staff and bots are always reachable, and a
    Member can always reach them. Name and avatar are always shown. Fluid enforces the policy in search, member lists,
    new direct and group conversations, new messages and contact fields; an existing conversation with a Member who is
    now out of reach keeps its history, leaves the Member''s list and takes no new messages.


    Admins of your company, and bots running with their owner''s rights, also moderate the company''s channels:
    they read the messages of the channels they are in and remove or restore anyone''s message in any channel.
    Direct and group conversations are never moderated.


    They moderate the company''s Today feed too: read its posts and comments, archived ones included, archive or
    restore them with a reason, and read the open reports. Archived items leave the feed for everyone else and keep
    their likes and comments for a restore; every archive and restore is audited, naming the admin, or the bot and its
    owner.


    Sign in as an admin of your company (`bearer_auth`).'
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: messaging-member-policy
  description: The company's Member messaging policy for Flow.
  x-fluid-section: Settings
- name: channel-messages
  description: Reading, removing and restoring messages in the company's Flow channels.
  x-fluid-section: Messaging
- name: messaging-today
  description: Reading and moderating the company's Today feed in Flow.
  x-fluid-section: Messaging
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: The session token of an admin of your company.
  schemas:
    Meta:
      type: object
      description: Response metadata.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: What went wrong.
            details:
              type: object
              additionalProperties: true
              description: Field-keyed errors.
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    LegacyError:
      description: The error body an authorization refusal answers with.
      type: object
      additionalProperties: true
    MemberPolicy:
      type: object
      description: The company's Member messaging policy.
      required:
      - directory_scope
      - include_upline
      - show_email
      - show_phone
      - show_bio
      - today_enabled
      - today_posting
      - updated_at
      additionalProperties: false
      properties:
        directory_scope:
          type: string
          enum:
          - all_members
          - team_graph
          - no_direct_messages
          description: 'Whom a Member may see, search and message among your Members. `all_members`: everyone (the
            default). `team_graph`: only Members in their Team Graph, their downline on any tree. `no_direct_messages`:
            no other Member.'
        include_upline:
          type: boolean
          description: Under `team_graph`, whether a Member also reaches the Members above them on each tree, such as
            their sponsor. Defaults to true.
        show_email:
          type: boolean
          description: Whether a Member sees another Member's email. Defaults to true.
        show_phone:
          type: boolean
          description: Whether a Member sees another Member's phone number. Defaults to true.
        show_bio:
          type: boolean
          description: Whether a Member sees another Member's bio. Defaults to false.
        today_enabled:
          type: boolean
          description: Whether Members see Flow's Today feed. Admins always see it. Defaults to true.
        today_posting:
          type: string
          enum:
          - everyone
          - admins
          description: 'Who may post to Today: `everyone` (the default) or only `admins`.'
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the policy was last changed; null while the company uses the defaults.
    MemberPolicyResponse:
      type: object
      required:
      - member_policy
      - status
      - meta
      properties:
        member_policy:
          $ref: '#/components/schemas/MemberPolicy'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    ChannelMessage:
      type: object
      description: One message in a company channel.
      required:
      - id
      - channel
      - sender
      - body
      - in_thread
      - created_at
      - edited_at
      - removed_at
      - restorable
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The message's id.
        channel:
          type: object
          required:
          - id
          - name
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              description: The channel's id.
            name:
              type:
              - string
              - 'null'
              description: The channel's name.
        sender:
          type: object
          required:
          - name
          - kind
          additionalProperties: false
          properties:
            name:
              type:
              - string
              - 'null'
              description: The sender's display name.
            kind:
              type: string
              enum:
              - person
              - guest
              - bot
              - webhook
              - other
              description: '`person`: one of the company''s admins or Members. `guest`: someone from a company the
                channel is shared with. `bot`, `webhook` or `other`: not a person.'
        body:
          type:
          - string
          - 'null'
          description: The message's text, kept when it was removed.
        in_thread:
          type: boolean
          description: Whether the message is a reply in a thread.
        created_at:
          type: string
          format: date-time
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        removed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the message was removed; null while it shows.
        restorable:
          type: boolean
          description: Whether a moderator removed it, so it can be restored. A message its author removed cannot be.
    ChannelMessageResponse:
      type: object
      required:
      - message
      - status
      - meta
      properties:
        message:
          $ref: '#/components/schemas/ChannelMessage'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    ChannelMessagesResponse:
      type: object
      required:
      - messages
      - status
      - meta
      properties:
        messages:
          type: array
          description: The messages, oldest first.
          items:
            $ref: '#/components/schemas/ChannelMessage'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    TodayAuthor:
      description: Who wrote a Today post or comment, a person or a company bot. Never their contact details.
      type: object
      additionalProperties: false
      required:
      - id
      - first_name
      - last_name
      - avatar_url
      - avatar_background
      - receivable_type
      - bot
      properties:
        id:
          type: integer
          description: The author's messaging recipient id.
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
        avatar_background:
          type:
          - string
          - 'null'
        receivable_type:
          type: string
        bot:
          type: boolean
          description: Whether the author is one of the company's We-Bots.
    TodayAttachment:
      description: A file on a Today post.
      type: object
      required:
      - id
      - url
      - filename
      - kind
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
        filename:
          type: string
        content_type:
          type:
          - string
          - 'null'
        content_size:
          type:
          - integer
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        kind:
          type: string
          enum:
          - image
          - video
          - pdf
        metadata:
          type:
          - object
          - 'null'
    TodayArchive:
      description: Who archived a Today post or comment, when and why; null while it is live.
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - archived_at
      - archived_by
      - reason
      properties:
        archived_at:
          type: string
          format: date-time
        archived_by:
          $ref: '#/components/schemas/TodayAuthor'
        reason:
          type:
          - string
          - 'null'
    TodayComment:
      description: A comment on a Today post.
      type: object
      additionalProperties: false
      required:
      - id
      - post_id
      - body
      - author
      - created_at
      - archive
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        body:
          type: string
        author:
          $ref: '#/components/schemas/TodayAuthor'
        created_at:
          type: string
          format: date-time
        archive:
          $ref: '#/components/schemas/TodayArchive'
    TodayPost:
      description: A post on the company's Today feed.
      type: object
      required:
      - id
      - body
      - author
      - attachments
      - share_cards
      - likes_count
      - comments_count
      - pinned
      - edited_at
      - created_at
      - archive
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        author:
          $ref: '#/components/schemas/TodayAuthor'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/TodayAttachment'
        share_cards:
          type: array
          description: Storefront items shared on the post, each with the poster's own link.
          items:
            type: object
            additionalProperties: true
        likes_count:
          type: integer
        comments_count:
          type: integer
          description: The live comments; archived ones are not counted, and come back on a restore.
        pinned:
          type: boolean
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        archive:
          $ref: '#/components/schemas/TodayArchive'
        comments:
          type: array
          description: On a single post only, its first 50 comments, oldest first, archived ones included.
          items:
            $ref: '#/components/schemas/TodayComment'
    TodayReport:
      description: An open report of a Today post.
      type: object
      additionalProperties: false
      required:
      - id
      - reason
      - reporter
      - post
      - created_at
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        reporter:
          $ref: '#/components/schemas/TodayAuthor'
        post:
          $ref: '#/components/schemas/TodayPost'
        created_at:
          type: string
          format: date-time
    TodayPageMeta:
      description: Response metadata with the page's cursors.
      type: object
      required:
      - pagination
      properties:
        request_uuid:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
        pagination:
          type: object
          required:
          - limit
          - next_cursor
          properties:
            cursor:
              type:
              - string
              - 'null'
            limit:
              type: integer
            prev_cursor:
              type:
              - string
              - 'null'
            next_cursor:
              type:
              - string
              - 'null'
              description: Pass as `cursor` for the next page; null on the last page.
    TodayPostResponse:
      type: object
      required:
      - post
      - status
      - meta
      properties:
        post:
          $ref: '#/components/schemas/TodayPost'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    TodayPostsResponse:
      type: object
      required:
      - posts
      - status
      - meta
      properties:
        posts:
          type: array
          description: The posts, newest first.
          items:
            $ref: '#/components/schemas/TodayPost'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/TodayPageMeta'
    TodayCommentResponse:
      type: object
      required:
      - comment
      - status
      - meta
      properties:
        comment:
          $ref: '#/components/schemas/TodayComment'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    TodayReportsResponse:
      type: object
      required:
      - reports
      - status
      - meta
      properties:
        reports:
          type: array
          description: The open reports, newest first.
          items:
            $ref: '#/components/schemas/TodayReport'
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/TodayPageMeta'
    TodayArchiveRequest:
      type: object
      properties:
        archive:
          type: object
          properties:
            reason:
              type:
              - string
              - 'null'
              maxLength: 500
              description: Why, for the admins who see the archive.
  parameters:
    TodayPostId:
      name: id
      in: path
      required: true
      description: The post's uuid_v7.
      schema:
        type: string
        format: uuid
    TodayCommentId:
      name: id
      in: path
      required: true
      description: The comment's uuid_v7.
      schema:
        type: string
        format: uuid
    TodayCursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    TodayLimit:
      name: limit
      in: query
      required: false
      description: Items per page, at most 50; 20 by default.
      schema:
        type: integer
        minimum: 1
        maximum: 50
    ChannelMessageId:
      name: id
      in: path
      required: true
      description: The message's id (uuid; a numeric id is still accepted).
      schema:
        type: string
paths:
  /api/company/v2026-10/messaging/member-policy:
    get:
      operationId: companyMessagingMemberPolicyShow
      summary: Get the Member messaging policy
      description: The company's policy, or the defaults when it never saved one. Needs `members.view`.
      tags:
      - messaging-member-policy
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPolicyResponse'
              example:
                member_policy:
                  directory_scope: team_graph
                  include_upline: true
                  show_email: false
                  show_phone: false
                  show_bio: true
                  today_enabled: true
                  today_posting: everyone
                  updated_at: '2026-10-23T09:30:00Z'
                status: 200
                meta:
                  request_uuid: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  timestamp: '2026-10-23T09:31:00Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: Not an admin of the company, or missing `members.view`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
    put:
      operationId: companyMessagingMemberPolicyUpdate
      summary: Change the Member messaging policy
      description: Changes only the fields sent; the change is audited. Needs `members.manage`.
      tags:
      - messaging-member-policy
      x-fluid-audience: company
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member_policy
              additionalProperties: false
              properties:
                member_policy:
                  type: object
                  additionalProperties: false
                  properties:
                    directory_scope:
                      type: string
                      description: One of `all_members`, `team_graph` or `no_direct_messages`; another value
                        answers 422.
                    include_upline:
                      type: boolean
                    show_email:
                      type: boolean
                    show_phone:
                      type: boolean
                    show_bio:
                      type: boolean
                    today_enabled:
                      type: boolean
                      description: Whether Members see Flow's Today feed.
                    today_posting:
                      type: string
                      description: One of `everyone` or `admins`; another value answers 422.
            example:
              member_policy:
                directory_scope: team_graph
                show_email: false
      responses:
        '200':
          description: The changed policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPolicyResponse'
              example:
                member_policy:
                  directory_scope: team_graph
                  include_upline: true
                  show_email: false
                  show_phone: false
                  show_bio: true
                  today_enabled: true
                  today_posting: everyone
                  updated_at: '2026-10-24T09:31:00Z'
                status: 200
                meta:
                  request_uuid: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  timestamp: '2026-10-24T09:31:00Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: Not an admin of the company, or missing `members.manage`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '409':
          description: Someone else changed the policy at the same time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: A field was missing or had an unknown value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/channel-messages:
    get:
      operationId: companyChannelMessagesIndex
      summary: Read channel messages
      description: 'Messages from the company''s channels the caller is in: by `ids[]` (up to 100; ids from anywhere
        else are left out), or one channel''s newest by `conversation_id`. A bot reads only the channels an admin
        seated it in. Removed messages are included with their text. Needs `messaging.view`.'
      tags:
      - channel-messages
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: ids[]
        in: query
        required: false
        description: Message ids to read (uuid or numeric).
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: conversation_id
        in: query
        required: false
        description: A channel's id, to read its newest messages instead.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: With `conversation_id`, the most messages to return (1 to 50, default 20).
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - name: since
        in: query
        required: false
        description: With `conversation_id`, only messages created after this time.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: The messages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessagesResponse'
              example:
                messages:
                - id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a91
                  channel:
                    id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
                    name: General
                  sender:
                    name: Riley Kim
                    kind: person
                  body: Join my team for a free car!
                  in_thread: false
                  created_at: '2026-10-24T09:30:00Z'
                  edited_at: null
                  removed_at: null
                  restorable: false
                status: 200
                meta:
                  request_uuid: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  timestamp: '2026-10-24T09:31:00Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: Not an admin of the company, or missing `messaging.view`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '404':
          description: '`conversation_id` names no channel the caller is in.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Neither `ids[]` nor `conversation_id` was given, or more than 100 ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/channel-messages/{id}:
    delete:
      operationId: companyChannelMessagesDestroy
      summary: Remove a channel message
      description: 'Removes anyone''s message from one of the company''s channels, announcement and admins-only
        channels included. The message keeps its text and can be restored; the removal is audited, naming the admin,
        or the bot and its owner. Only an admin of the channel''s own company may, so a bot of a company the channel
        is shared with may not. Needs `messaging.update`.'
      tags:
      - channel-messages
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/ChannelMessageId'
      responses:
        '200':
          description: The removed message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessageResponse'
              example:
                message:
                  id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a91
                  channel:
                    id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
                    name: General
                  sender:
                    name: Riley Kim
                    kind: person
                  body: Join my team for a free car!
                  in_thread: false
                  created_at: '2026-10-24T09:30:00Z'
                  edited_at: null
                  removed_at: '2026-10-24T09:31:00Z'
                  restorable: true
                status: 200
                meta:
                  request_uuid: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  timestamp: '2026-10-24T09:31:00Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: Not an admin of the company, missing `messaging.update`, or not an admin of the channel's
            company.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/LegacyError'
        '404':
          description: No such message in the company's channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The message is already removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/company/v2026-10/channel-messages/{id}/restore:
    post:
      operationId: companyChannelMessagesRestore
      summary: Restore a removed channel message
      description: 'Shows a message a moderator removed again, audited. A message its author removed stays removed.
        Needs `messaging.update`.'
      tags:
      - channel-messages
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/ChannelMessageId'
      responses:
        '200':
          description: The restored message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelMessageResponse'
              example:
                message:
                  id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a91
                  channel:
                    id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
                    name: General
                  sender:
                    name: Riley Kim
                    kind: person
                  body: Join my team for a free car!
                  in_thread: false
                  created_at: '2026-10-24T09:30:00Z'
                  edited_at: null
                  removed_at: null
                  restorable: false
                status: 200
                meta:
                  request_uuid: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  timestamp: '2026-10-24T09:31:00Z'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyError'
        '403':
          description: Not an admin of the company, missing `messaging.update`, or not an admin of the channel's
            company.
          content:
            application/json:
