  /api/company/v2026-10/bot-runs/current/playbook-subjects:
    get:
      operationId: companyBotRunPlaybookSubjectsIndex
      summary: List a playbook's subjects
      description: 'With a bot''s run login: the subjects a playbook may act on now, each assigned an arm by Fluid before
        the bot sees it. Only treatment subjects are listed, as references with a touch id; held-out subjects are counted.
        A live playbook whose messages cannot be sent lists none and says why in `blockers`. One call reads at most 500
        matches, newest first; when matches remain, `next_cursor` is set and passing it as `cursor` reads on from there.
        The run needs the playbook''s read permission.'
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bot_run_auth: []
      parameters:
      - name: playbook
        in: query
        required: true
        description: The playbook key.
        schema:
          type: string
        example: declined_subscription
      - name: cursor
        in: query
        required: false
        description: The `next_cursor` of an earlier call, to read older matches.
        schema:
          type: string
        example: WyIyMDI2LTEwLTIwVDE0OjAwOjAwLjAwMDAwMFoiLDQ4MV0
      responses:
        '200':
          description: The subjects.
          content:
            application/json:
              schema:
                type: object
                required:
                - playbook_subjects
                - status
                - meta
                properties:
                  playbook_subjects:
                    type: object
                    required:
                    - playbook
                    - mode
                    - held_out_count
                    - blockers
                    - subjects
                    - next_cursor
                    properties:
                      playbook:
                        type: string
                      mode:
                        type: string
                        enum:
                        - shadow
                        - live
                      held_out_count:
                        type: integer
                      blockers:
                        type: array
                        items:
                          $ref: '#/components/schemas/Blocker'
                      subjects:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlaybookSubject'
                      next_cursor:
                        type:
                        - string
                        - 'null'
                        description: Pass as `cursor` to read older matches; null when every match was read.
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                playbook_subjects:
                  playbook: declined_subscription
                  mode: live
                  held_out_count: 1
                  blockers: []
                  subjects:
                  - touch_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                    subject_id: '481'
                    value_cents: 4999
                    currency_code: USD
                    item_count: 1
                    product_ids:
                    - 77
                    hours_since_event: 30
                    failure_group: insufficient_funds
                    prior_touches: 0
                  next_cursor: null
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RunForbidden'
        '404':
          description: Bots are off, the bot was not installed from a template, or it has no such playbook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Not found
                  details: {}
                status: 404
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '422':
          description: The cursor is not one this endpoint answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: That cursor is not one this endpoint answered
