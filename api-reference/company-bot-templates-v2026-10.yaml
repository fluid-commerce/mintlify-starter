---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Bot templates and playbooks
  version: 2026-10
  description: 'Bot templates your admins install, an installed bot''s playbooks, the messages it asked Fluid to send and
    the facts Fluid records about them.


    A template is reviewed data published by Fluid: a profile, instructions, a grant bundle, playbooks and message copy. What
    a template can do, and every check on it, is Fluid''s code. An installed bot runs the version it installed until a keeper
    accepts an upgrade.


    The bot never sends. A running bot asks Fluid to message a customer; Fluid decides who is eligible and who is held out,
    renders the message from the template''s reviewed copy, adds every link and its tracking tags, checks consent, opt-outs,
    frequency and quiet hours, and sends it through your company''s own email identity. Fluid records what was sent, what
    happened to it, each subject''s holdout arm and the orders it can tie to a touch by a key; it does not credit wins. The
    bot reads those facts and computes its own results.


    Bots are being released company by company; until they are on for your company, every endpoint here answers 404. Sign
    in as an admin of your company (`bearer_auth`); the `bot-runs/current` endpoints take a bot''s run login (`bot_run_auth`)
    instead.'
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: bot-templates
  description: Bot templates, playbooks and the facts Fluid records about them.
  x-fluid-section: Settings
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: The session token of an admin of your company.
    bot_run_auth:
      type: http
      scheme: bearer
      description: A bot's run login, minted for one run.
  parameters:
    TemplateKey:
      name: key
      in: path
      required: true
      description: The template key.
      schema:
        type: string
      example: chomper
    BotId:
      name: bot_id
      in: path
      required: true
      description: The bot's id.
      schema:
        type: string
        format: uuid
      example: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
    PlaybookKey:
      name: playbook_key
      in: path
      required: true
      description: The playbook key.
      schema:
        type: string
      example: declined_subscription
    TouchId:
      name: id
      in: path
      required: true
      description: The touch's id.
      schema:
        type: string
        format: uuid
      example: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
  schemas:
    Meta:
      type: object
      description: Response metadata.
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: Request correlation identifier.
        timestamp:
          type: string
          format: date-time
          description: When the response was built.
    ErrorResponse:
      type: object
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
              description: What went wrong.
            details:
              type: object
              additionalProperties: true
              description: Field-keyed errors; a refusal adds its reason as `type`.
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    UnauthorizedError:
      type: object
      description: Bare 401 body, not the error envelope.
      required:
      - message
      properties:
        message:
          type: string
    BareForbidden:
      description: Bare 403 body.
      anyOf:
      - type: object
        required:
        - error
        properties:
          error:
            type: string
      - type: object
        required:
        - message
        properties:
          message:
            type: string
    KeyedPlaybooks:
      type: object
      required:
      - key
      - playbooks
      properties:
        key:
          type: string
        playbooks:
          type: array
          items:
            type: string
    TemplatePlaybook:
      type: object
      required:
      - key
      - label
      - subject_kind
      - levers
      properties:
        key:
          type: string
        label:
          type: string
        subject_kind:
          type: string
          enum:
          - cart
          - subscription
        levers:
          type: array
          items:
            type: object
            required:
            - key
            - channels
            properties:
              key:
                type: string
              channels:
                type: array
                items:
                  type: string
    BotTemplate:
      type: object
      description: A published template, without its message copy, and the keys the reader lacks to install it.
      required:
      - key
      - version
      - singleton
      - profile
      - required_keys
      - optional_keys
      - playbooks
      - missing_required_keys
      - missing_optional_keys
      - installed
      - listing
      properties:
        key:
          type: string
          description: The template key.
        installed:
          type: boolean
          description: Whether the company already has a bot from this template.
        listing:
          description: How the template appears in the bot marketplace; null for a template with no listing.
          oneOf:
          - $ref: '#/components/schemas/TemplateListing'
          - type: 'null'
        version:
          type: integer
          description: The latest published version, or the one installed.
        singleton:
          type: boolean
          description: Whether a company keeps at most one bot of it.
        profile:
          type: object
          description: Name, description and avatar.
        model:
          type: string
        min_model_tier:
          type: string
        required_keys:
          type: array
          items:
            type: string
        optional_keys:
          type: array
          items:
            $ref: '#/components/schemas/KeyedPlaybooks'
        capabilities:
          type: array
          items:
            type: string
        playbooks:
          type: array
          items:
            $ref: '#/components/schemas/TemplatePlaybook'
        missing_required_keys:
          type: array
          items:
            type: string
        missing_optional_keys:
          type: array
          items:
            type: string
        published_at:
          type:
          - string
          - 'null'
          format: date-time
    TemplateListing:
      type: object
      required:
      - category
      - pitch
      - character
      - uses_keys
      properties:
        category:
          type: string
          enum:
          - sales
          - support
          - operations
          - marketing
          - finance
          - team
        pitch:
          type: string
          description: One line for the marketplace card.
        character:
          type: object
          description: The bot's animated character (body, color, eyes, accessory), as company-bots.yaml's BotCharacter.
          required:
          - body
          - color
          - eyes
          - accessory
          properties:
            body:
              type: string
            color:
              type: string
            eyes:
              type: string
            accessory:
              type: string
        highlights:
          type: array
          description: What the bot does, for the detail view.
          items:
            type: string
        example_prompts:
          type: array
          items:
            type: string
        name_suggestions:
          type: array
          description: Three short names that fit the role, offered when the bot is named after it is added.
          minItems: 3
          maxItems: 3
          items:
            type: string
        suggested_triggers:
          type: array
          items:
            type: object
            required:
            - label
            - kind
            properties:
              label:
                type: string
              kind:
                type: string
                enum:
                - schedule
                - event
              cron:
                type: string
              timezone:
                type: string
              topic:
                type: string
        suggested_limit:
          type: array
          items:
            type: string
        uses_keys:
          type: array
          description: The permission keys the bot will use, from its owner; the suggested limit, or every key the template needs.
          items:
            type: string
    Bot:
      type: object
      description: The installed bot, as `GET /bots/{id}` returns it (company-bots.yaml).
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      additionalProperties: true
    Bound:
      type: object
      required:
      - min
      - max
      - default
      properties:
        min:
          type: integer
        max:
          type: integer
        default:
          type: integer
    Playbook:
      type: object
      required:
      - key
      - label
      - mode
      - params
      - available
      - missing_keys
      - lock_version
      - bounds
      - levers
      properties:
        key:
          type: string
        label:
          type: string
        mode:
          type: string
          enum:
          - 'off'
          - shadow
          - live
        params:
          type: object
          description: 'Effective parameters: owner''s choices within the bounds, else defaults.'
        available:
          type: boolean
          description: Whether the bot's grant holds every key the playbook needs.
        missing_keys:
          type: array
          items:
            type: string
        lock_version:
          type: integer
        bounds:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Bound'
        levers:
          type: array
          items:
            type: object
            required:
            - key
            - channels
            properties:
              key:
                type: string
              channels:
                type: array
                items:
                  type: string
    Blocker:
      type: object
      required:
      - code
      - description
      properties:
        code:
          type: string
        description:
          type: string
    PlaybookSubject:
      type: object
      description: 'A subject as references only: never a name, address or email.'
      required:
      - touch_id
      - subject_id
      - value_cents
      - item_count
      - product_ids
      - prior_touches
      properties:
        touch_id:
          type: string
          format: uuid
          description: The touch to cite when asking Fluid to send.
        subject_id:
          type: string
        value_cents:
          type: integer
        currency_code:
          type: string
        item_count:
          type: integer
        product_ids:
          type: array
          items:
            type: integer
        hours_since_event:
          type:
          - integer
          - 'null'
        failure_group:
          type:
          - string
          - 'null'
        prior_touches:
          type: integer
    Touch:
      type: object
      description: 'One subject''s episode: its arm and, when messaged, the receipt.'
      required:
      - id
      - bot_id
      - playbook_key
      - arm
      - status
      - slots
      properties:
        id:
          type: string
          format: uuid
        bot_id:
          type: string
          format: uuid
        playbook_key:
          type: string
        subject_type:
          type: string
        subject_id:
          type: string
        episode_key:
          type: string
        arm:
          type: string
          enum:
          - treatment
          - holdout
        status:
          type: string
          enum:
          - assigned
          - skipped
          - shadowed
          - scheduled
          - requested
          - sent
          - refused
          - failed
        refusal_reason:
          type:
          - string
          - 'null'
        lever:
          type:
          - string
          - 'null'
        channel:
          type:
          - string
          - 'null'
        message_type:
          type:
          - string
          - 'null'
        slots:
          type: object
        run_id:
          type:
          - string
          - 'null'
          format: uuid
        approval_id:
          type:
          - string
          - 'null'
          format: uuid
        delivery_state:
          type:
          - string
          - 'null'
        provider_message_id:
          type:
          - string
          - 'null'
        comms_event_id:
          type:
          - string
          - 'null'
          format: uuid
        click_count:
          type:
          - integer
          - 'null'
          description: Null while clicks are not recorded.
        template_version_id:
          type: string
          format: uuid
        assigned_at:
          type:
          - string
          - 'null'
          format: date-time
        scheduled_for:
          type:
          - string
          - 'null'
          format: date-time
        requested_at:
          type:
          - string
          - 'null'
          format: date-time
        sent_at:
          type:
          - string
          - 'null'
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
        first_opened_at:
          type:
          - string
          - 'null'
          format: date-time
        bounced_at:
          type:
          - string
          - 'null'
          format: date-time
        complained_at:
          type:
          - string
          - 'null'
          format: date-time
        first_clicked_at:
          type:
          - string
          - 'null'
          format: date-time
        window_ends_at:
          type:
          - string
          - 'null'
          format: date-time
    Link:
      type: object
      description: An order Fluid can tie to the touch's subject by a key, inside the touch's window. A fact, not credit.
      required:
      - kind
      - order_id
      - ordered_at
      - amount_in_base_cents
      - financial_status
      properties:
        kind:
          type: string
          enum:
          - cart_converted
          - subscription_recovered
          - discount_redeemed
        order_id:
          type: integer
        ordered_at:
          type: string
          format: date-time
        amount_in_base_cents:
          type: integer
        financial_status:
          type: string
    TouchWithLinks:
      allOf:
      - $ref: '#/components/schemas/Touch'
      - type: object
        required:
        - links
        properties:
          links:
            type: array
            items:
              $ref: '#/components/schemas/Link'
    Pagination:
      type: object
      required:
      - cursor
      - limit
      - prev_cursor
      - next_cursor
      properties:
        cursor:
          type:
          - string
          - 'null'
        limit:
          type: integer
        prev_cursor:
          type:
          - string
          - 'null'
        next_cursor:
          type:
          - string
          - 'null'
    Cohorts:
      type: object
      description: Counts of recorded facts by holdout arm for subjects assigned in the period. Fluid computes no lift or
        revenue.
      required:
      - playbook
      - from
      - to
      - treatment
      - holdout
      properties:
        playbook:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        treatment:
          type: object
          required:
          - subjects
          - messaged
          - with_linked_order
          - linked_by_kind
          properties:
            subjects:
              type: integer
            messaged:
              type: integer
            with_linked_order:
              type: integer
            linked_by_kind:
              type: object
              additionalProperties:
                type: integer
        holdout:
          type: object
          required:
          - subjects
          - messaged
          - with_linked_order
          - linked_by_kind
          properties:
            subjects:
              type: integer
            messaged:
              type: integer
            with_linked_order:
              type: integer
            linked_by_kind:
              type: object
              additionalProperties:
                type: integer
    SendStats:
      type: object
      description: Send counts per playbook for subjects assigned in the period.
      required:
      - from
      - to
      - playbooks
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        playbooks:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
          example:
            message: Invalid credentials.
    Forbidden:
      description: Not an admin of the company signed in as themselves, without the `we_bots` permission the endpoint needs,
        or (installing) without `we_bots.update` (`install_needs_update_permission`).
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/BareForbidden'
            - $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Not authorized.
    RunForbidden:
      description: Not a bot's run login.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BareForbidden'
          example:
            message: Only a running bot can call this
    NotFound:
      description: No such template, or no installed bot you own or steward by that id, or bots are not turned on for your
        company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Bot not found
              details: {}
            status: 404
            meta:
              request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-22T15:32:08Z'
    FlagNotFound:
      description: Bots are not turned on for your company.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Not found
              details: {}
            status: 404
            meta:
              request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
              timestamp: '2026-10-22T15:32:08Z'
paths:
  /api/company/v2026-10/bot-templates:
    get:
      operationId: companyBotTemplatesIndex
      summary: List bot templates
      description: Templates with a published version, each with its playbooks, the keys it requires and offers, and the ones
        you lack. Needs `we_bots.view`.
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bearer_auth: []
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                required:
                - bot_templates
                - status
                - meta
                properties:
                  bot_templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/BotTemplate'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                bot_templates:
                - key: chomper
                  version: 1
                  singleton: true
                  published_at: '2026-10-22T15:32:08Z'
                  profile:
                    name: Chomper
                    description: Wins back revenue your store is leaving on the table.
                  model: auto
                  min_model_tier: standard
                  required_keys:
                  - orders.view
                  - subscriptions.view
                  - customer_outreach.create
                  - mist.view
                  capabilities:
                  - use_ai
                  - playbook_subjects
                  - send_outreach
                  - read_outcomes
                  optional_keys:
                  - key: coupons.create
                    playbooks:
                    - abandoned_cart
                  playbooks:
                  - key: declined_subscription
                    label: Save declined subscriptions
                    subject_kind: subscription
                    levers:
                    - key: update_payment
                      channels:
                      - email
                      - sms
                  missing_required_keys: []
                  missing_optional_keys:
                  - coupons.create
                  installed: false
                  listing: null
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/company/v2026-10/bot-templates/{key}:
    get:
      operationId: companyBotTemplatesShow
      summary: Get a bot template
      description: A template's latest published version and the keys you lack to install it. Needs `we_bots.view`.
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/TemplateKey'
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                type: object
                required:
                - bot_template
                - status
                - meta
                properties:
                  bot_template:
                    $ref: '#/components/schemas/BotTemplate'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                bot_template:
                  key: chomper
                  version: 1
                  singleton: true
                  published_at: '2026-10-22T15:32:08Z'
                  profile:
                    name: Chomper
                    description: Wins back revenue your store is leaving on the table.
                  model: auto
                  min_model_tier: standard
                  required_keys:
                  - orders.view
                  - subscriptions.view
                  - customer_outreach.create
                  - mist.view
                  capabilities:
                  - use_ai
                  - playbook_subjects
                  - send_outreach
                  - read_outcomes
                  optional_keys:
                  - key: coupons.create
                    playbooks:
                    - abandoned_cart
                  playbooks:
                  - key: declined_subscription
                    label: Save declined subscriptions
                    subject_kind: subscription
                    levers:
                    - key: update_payment
                      channels:
                      - email
                      - sms
                  missing_required_keys: []
                  missing_optional_keys:
                  - coupons.create
                  installed: false
                  listing: null
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/company/v2026-10/bot-templates/{key}/install:
    post:
      operationId: companyBotTemplatesInstall
      summary: Install a bot template
      description: 'Installs a published version (the latest unless `template_version` names one) as a bot you own and grant:
        the version''s required keys plus each optional key you hold. A missing required key refuses the install and names
        each one; a missing optional key leaves the playbooks that need it unavailable. The bot pins the version, starts with
        every playbook off, and is seated in `conversation_id` when you name one (an admin-only conversation you are in).
        Needs `we_bots.create` and `we_bots.update`.'
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - $ref: '#/components/parameters/TemplateKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - install
              properties:
                install:
                  type: object
                  properties:
                    name:
                      type:
                      - string
                      - 'null'
                      maxLength: 120
                      description: The bot's name; defaults to the template's.
                    conversation_id:
                      type:
                      - string
                      - 'null'
                      format: uuid
                      description: An admin-only conversation to seat the bot in.
                    template_version:
                      type:
                      - integer
                      - 'null'
                      minimum: 1
                      description: The published version; defaults to the latest.
            example:
              install:
                name: Chomper
      responses:
        '201':
          description: The installed bot.
          content:
            application/json:
              schema:
                type: object
                required:
                - bot
                - status
                - meta
                properties:
                  bot:
                    $ref: '#/components/schemas/Bot'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                bot:
                  id: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  name: Chomper
                status: 201
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: This company already has a bot of this single-install template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: This company already has a bot of this template
                  details:
                    type: template_already_installed
                status: 409
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '422':
          description: Invalid parameters, missing required keys, a conversation others read, or a version that cannot be
            installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
