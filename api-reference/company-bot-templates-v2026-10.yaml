  /api/company/v2026-10/bot-runs/current/outreach:
    post:
      operationId: companyBotRunOutreachCreate
      summary: Ask Fluid to message a customer
      description: 'With a bot''s run login: ask Fluid to message the customer of a touch the run was given, with one allowed
        lever and channel and typed slot references. The request declares `customer_outreach.create` (action class `message_customer`),
        so the run''s grant and the owner''s autonomy mode decide first. Fluid then checks, in order, that the touch is in
        the treatment arm and unused, the playbook is on, the lever and channel are allowed, the customer still qualifies,
        the company can send from its own identity, and the customer has not opted out, is not blocked, has consent where
        needed and had no bot message within the playbook''s frequency. Shadow mode records the choice and sends nothing;
        outside the playbook''s quiet hours in the customer''s time zone the message is scheduled. Fluid renders the message
        from the template''s reviewed copy and adds every link. Send an `Idempotency-Key` header; a repeat answers the first
        outcome. A retry of an approved call that sent nothing runs again on the approval it used, only with the identical
        body and the same `Fluid-Bot-Approval`; any other body needs its own approval.'
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bot_run_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outreach
              properties:
                outreach:
                  type: object
                  required:
                  - playbook
                  - touch_id
                  - lever
                  - channel
                  properties:
                    playbook:
                      type: string
                    touch_id:
                      type: string
                      format: uuid
                    lever:
                      type: string
                    channel:
                      type: string
                      enum:
                      - email
                      - sms
                    slots:
                      type:
                      - object
                      - 'null'
                      description: 'Typed references, such as { "product": { "id": 12 } }.'
            example:
              outreach:
                playbook: declined_subscription
                touch_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                lever: update_payment
                channel: email
      responses:
        '202':
          description: The touch, requested, scheduled or shadowed; `outcome` says which.
          content:
            application/json:
              schema:
                type: object
                required:
                - touch
                - status
                - meta
                - outcome
                properties:
                  touch:
                    $ref: '#/components/schemas/Touch'
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
                  outcome:
                    type: string
                    enum:
                    - requested
                    - scheduled
                    - shadowed
              example:
                outcome: requested
                touch:
                  id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a90
                  bot_id: 0192f3c4-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  playbook_key: declined_subscription
                  subject_type: Commerce::Subscription
                  subject_id: '481'
                  episode_key: 481:1761091200
                  arm: treatment
                  status: requested
                  refusal_reason: null
                  lever: update_payment
                  channel: email
                  message_type: we_bot_subscription_save
                  slots: {}
                  run_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a95
                  approval_id: null
                  delivery_state: sent
                  provider_message_id: 0100019a-ses
                  comms_event_id: null
                  click_count: null
                  template_version_id: 0199a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a92
                  assigned_at: '2026-10-22T15:32:08Z'
                  scheduled_for: null
                  requested_at: '2026-10-22T15:32:08Z'
                  sent_at: null
                  delivered_at: null
                  first_opened_at: null
                  bounced_at: null
                  complained_at: null
                  first_clicked_at: null
                  window_ends_at: '2026-11-05T15:32:08Z'
                status: 202
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/RunForbidden'
        '404':
          description: Bots are off, or no such touch for this bot and playbook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Touch not found
                  details:
                    type: touch_not_found
                status: 404
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '409':
          description: The customer is held out, the touch was already used, or the gate refused a used or expired approval
            (bare body, reason in `Fluid-Bot-Refusal`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorResponse'
