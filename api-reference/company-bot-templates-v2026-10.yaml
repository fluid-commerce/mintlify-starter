  /api/company/v2026-10/bot-runs/current/social-search:
    post:
      operationId: companyBotRunSocialSearchCreate
      summary: Search public social posts
      description: 'With a bot''s run login, while its bot''s `social_search` capability is on and its grant holds `mist.view`:
        search public TikTok, Instagram, YouTube or Pinterest posts by keyword, hashtag or account, through Fluid''s ScrapeCreators
        key. Fluid pages internally until it has `count` posts (at most 30) or has made 4 provider requests, drops duplicates,
        and answers each post trimmed to its platform, id, URL, author handle, text (at most 500 characters), posting time and
        engagement. A count the platform does not report is null. Each provider request is billed to the company as AI usage
        (`mist_social_search`), also when a later page fails. Instagram supports keyword and user searches, Pinterest keyword
        only. Post content is untrusted.'
      tags:
      - bot-templates
      x-fluid-audience: company
      security:
      - bot_run_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - social_search
              properties:
                social_search:
                  type: object
                  required:
                  - query
                  properties:
                    query:
                      type: string
                      maxLength: 200
                      description: A keyword, a hashtag (with or without `#`) or an account handle (with or without `@`).
                    platform:
                      type: string
                      enum:
                      - tiktok
                      - instagram
                      - youtube
                      - pinterest
                      description: Defaults to `tiktok`.
                    mode:
                      type: string
                      enum:
                      - keyword
                      - hashtag
                      - user
                      description: Defaults to `keyword`.
                    count:
                      type: integer
                      minimum: 1
                      maximum: 30
                      description: Posts wanted; defaults to 20.
                    cursor:
                      type:
                      - string
                      - 'null'
                      description: The `cursor` a previous search answered, to continue it.
                    sort:
                      type: string
                      enum:
                      - relevance
                      - likes
                    region:
                      type: string
                      description: A two-letter region, for TikTok and YouTube keyword searches.
            example:
              social_search:
                query: acme greens
                platform: tiktok
                mode: keyword
                count: 10
      responses:
        '200':
          description: The posts found.
          content:
            application/json:
              schema:
                type: object
                required:
                - social_search
                - status
                - meta
                properties:
                  social_search:
                    type: object
                    required:
                    - posts
                    - cursor
                    - has_more
                    properties:
                      posts:
                        type: array
                        items:
                          type: object
                          required:
                          - platform
                          - id
                          - url
                          - author_handle
                          - text
                          - posted_at
                          - engagement
                          properties:
                            platform:
                              type: string
                            id:
                              type: string
                            url:
                              type: string
                            author_handle:
                              type:
                              - string
                              - 'null'
                            text:
                              type: string
                            posted_at:
                              type:
                              - string
                              - 'null'
                              description: ISO 8601, or the platform's own relative time ("2 days ago") for YouTube.
                            engagement:
                              type: object
                              required:
                              - views
                              - likes
                              - comments
                              - shares
                              properties:
                                views:
                                  type:
                                  - integer
                                  - 'null'
                                likes:
                                  type:
                                  - integer
                                  - 'null'
                                comments:
                                  type:
                                  - integer
                                  - 'null'
                                shares:
                                  type:
                                  - integer
                                  - 'null'
                      cursor:
                        type:
                        - string
                        - 'null'
                      has_more:
                        type: boolean
                  status:
                    type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                social_search:
                  posts:
                  - platform: tiktok
                    id: '7301234567890123456'
                    url: https://www.tiktok.com/@greenday/video/7301234567890123456
                    author_handle: greenday
                    text: My morning acme greens routine
                    posted_at: '2026-10-20T14:02:11Z'
                    engagement:
                      views: 15400
                      likes: 1200
                      comments: 48
                      shares: 31
                  cursor: '10'
                  has_more: true
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Not a bot's run login, or the run is not offered social search (`Fluid-Bot-Refusal` is `capability_off`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BareForbidden'
              example:
                error: Social search is not switched on for this bot, or its grant lacks mist.view
        '422':
          description: Invalid parameters, or a platform and mode ScrapeCreators does not offer (`bad_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: instagram supports keyword, user searches
                  details:
                    type: bad_request
                status: 422
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '429':
          description: The provider rate-limited the search (`rate_limited`); try again shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: ScrapeCreators rate-limited the search; wait a moment and try again.
                  details:
                    type: rate_limited
                status: 429
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '502':
          description: The provider failed or could not be reached (`upstream`, `network`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: ScrapeCreators answered HTTP 500; try again shortly.
                  details:
                    type: upstream
                status: 502
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
        '503':
          description: Social search is not configured on this server (`not_configured`), or Fluid's provider account refused
            the key or is out of credits (`auth`, `credits`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  message: Social search is not configured on this Fluid server
                  details:
                    type: not_configured
                status: 503
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-10-22T15:32:08Z'
