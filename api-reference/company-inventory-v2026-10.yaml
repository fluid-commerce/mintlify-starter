  /api/company/v2026-10/locations:
    get:
      operationId: listLocationsV202610
      summary: List locations
      description: Your locations, oldest first, a page at a time. Needs `warehouses.view`.
      tags:
      - locations
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: filter[active]
        in: query
        required: false
        description: Only active (`true`) or inactive (`false`) locations.
        schema:
          type: boolean
      - name: filter[external_id]
        in: query
        required: false
        description: Only the location with this `external_id`.
        schema:
          type: string
      - $ref: '#/components/parameters/PageCursor'
      - name: page[limit]
        in: query
        required: false
        description: Locations per page, 1 to 100. Defaults to 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: The locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationListResponse'
              example:
                locations:
                - uuid: 0199c3e1-6b1a-7f2e-9d3c-4b5a6c7d8e9f
                  id: 212
                  name: Scranton Distribution Center
                  external_id: SCR-01
                  active: true
                  address:
                    address1: 1725 Slough Avenue
                    address2: Loading Dock B
                    city: Scranton
                    state: Pennsylvania
                    subdivision_code: PA
                    postal_code: '18505'
                    phone: '+15705550142'
                    country_code: US
                  created_at: '2025-01-08T16:20:00Z'
                  updated_at: '2026-10-30T11:45:02Z'
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-11-02T15:04:05Z'
                  pagination:
                    cursor: null
                    limit: 25
                    prev_cursor: null
                    next_cursor: eyJpZCI6NDgyMTR9
