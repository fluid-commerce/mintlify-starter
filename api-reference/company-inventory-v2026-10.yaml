  /api/company/v2026-10/inventory-levels:
    get:
      operationId: listInventoryLevelsV202610
      summary: List inventory levels
      description: The stock of each variant at each location, least recently changed first (`updated_at`, then `id`), a page at a time. Every level is listed when no filter is sent. A level that changes while you page moves to the end and is read again, never skipped. Send the same filters with every page of a cursor. Needs `inventory.view`.
      tags:
      - inventory-levels
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: filter[location_id]
        in: query
        required: false
        description: Only levels at the location with this `uuid`.
        schema:
          type: string
          format: uuid
      - name: filter[location_external_id]
        in: query
        required: false
        description: Only levels at the location with this `external_id`.
        schema:
          type: string
      - name: filter[variant_id]
        in: query
        required: false
        description: Only levels of this variant.
        schema:
          type: integer
      - name: filter[sku]
        in: query
        required: false
        description: Only levels of variants with this SKU.
        schema:
          type: string
      - name: filter[tracked]
        in: query
        required: false
        description: Only levels of variants whose stock Fluid counts (`true`) or does not (`false`).
        schema:
          type: boolean
      - name: filter[updated_since]
        in: query
        required: false
        description: Only levels that changed at or after this time. Send the newest `updated_at` your last sync read.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PageCursor'
      - name: page[limit]
        in: query
        required: false
        description: Levels per page, 1 to 100. Defaults to 25.
        schema:
          type: integer
