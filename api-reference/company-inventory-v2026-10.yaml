---
openapi: 3.1.0
info:
  title: Fluid Company API v2026-10 — Inventory & Logistics
  version: 2026-10
  description: |-
    Your stock on v2026-10: where you hold it (locations), how much of each variant is at each location (inventory levels), and the calls a warehouse or ERP system makes to keep it right (counts, adjustments and the history of every change).

    ## Authentication

    Send a company admin credential as `Authorization: Bearer <token>`: an admin session token or an API token for your company. Locations need `warehouses.view` to read and `warehouses.update` to write; inventory needs `inventory.view` to read and `inventory.update` to write. A droplet installation token works too when it holds the scope those permissions map to: `settings` for locations, `products` for inventory.

    ## Names

    The API uses the names common to commerce and warehouse systems. Each maps to a name the older APIs use, and the data is the same:

    | This API | Older APIs |
    | --- | --- |
    | location | warehouse |
    | `variant.tracked` | `track_quantity` |
    | `variant.inventory_policy`: `continue` / `deny` | `keep_selling`: `true` / `false` |
    | inventory count | set an inventory level |
    | inventory adjustment | adjust an inventory level |

    Records have a `uuid`, which these endpoints take in paths and filters, and the integer `id` the older APIs and the inventory webhooks use.

    ## Quantities

    Each inventory level holds four quantities. `on_hand` is every unit physically at the location and always equals `available + committed + unavailable`. `available` can be sold now. `committed` is held for orders that have not shipped: Fluid moves units into it when an order is placed and out of it when the order ships, is cancelled or is refunded. `unavailable` is set aside, for example damaged or in quality control.

    You never write `committed`. A count sets `available` or `on_hand`; an adjustment changes `available` or `unavailable`. Either way `committed` stays as Fluid holds it, so a sync from your warehouse system cannot undo an order placed a moment earlier.

    ## Keeping a warehouse system in step

    * **Counts** set absolute quantities, the way a cycle count or a full sync reports them. Send `compare_quantity`, the value you last read, to apply a count only if nothing changed since; otherwise it answers 409 with the current value.
    * **Adjustments** change a quantity by an amount: stock received, damaged, found or written off. They need an `Idempotency-Key`, so a resend after a lost response is not applied twice.
    * **Reading back**: page through `GET /inventory-levels?filter[updated_since]=…`. Levels come least recently changed first, so a level that changes while you page moves to the end and is read again, never skipped. Keep the newest `updated_at` you saw for the next run.
    * **Being told**: subscribe a company webhook to resource `inventory_level`, events `updated`, `out_of_stock` or `back_in_stock`. Each delivery carries the quantities before and after the change.
    * **History**: `GET /inventory-adjustments` lists every stock change, whatever made it (orders, shipments, counts, adjustments, imports, admin edits), with its reason.

    Counts and adjustments take up to 100 lines and apply all of them or none. A line names a variant by `variant_id` or `sku` and a location by `location_id` or `location_external_id`.

    ## Responses

    Every response wraps the resource under its own key with `status` and `meta`. Lists are cursor-paginated with `page[cursor]` and `page[limit]`, and return `meta.pagination.next_cursor`. Errors use the same envelope with `error.message` and `error.details`; a failed line's details are keyed by its index in the request. A 401 is a bare `{ "message": … }`. Until the API is released for your company, every endpoint answers 404.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
