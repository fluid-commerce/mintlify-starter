  /api/company/v2026-10/inventory-counts:
    post:
      operationId: createInventoryCountsV202610
      summary: Record inventory counts
      description: |-
        Sets absolute quantities, the way a cycle count or a warehouse system sync reports them. Each count names `available` or `on_hand` and its `quantity`; for `on_hand`, `available` becomes `quantity` minus `committed` minus `unavailable`. `committed` is never written. A variant with no level at the location gets one.

        Send `compare_quantity`, the value you last read, to apply a count only if the level still holds it; otherwise nothing is applied and the response is 409 with the current value in `error.details`. The batch applies every count or none. Needs `inventory.update`.
      tags:
      - inventory-counts
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'A key you make (a UUID works) that makes a resend safe: resending the same request with the same key within 24 hours replays the first response with `X-Idempotent-Replayed: true` and applies nothing. The key is 1 to 255 printable ASCII characters. A different request under the same key answers 422, and a resend while the first is still running answers 409.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryCountRequest'
            example:
              counts:
              - sku: PAPER-A4-500
                location_external_id: SCR-01
                name: on_hand
                quantity: 244
                compare_quantity: 240
                reason: November cycle count
      responses:
        '200':
          description: The levels after the counts, in the order the counts came.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelBatchResponse'
              example:
                inventory_levels:
                - uuid: 0199c3e1-7a2b-7c4d-8e5f-6a7b8c9d0e1f
                  id: 48213
                  location:
                    uuid: 0199c3e1-6b1a-7f2e-9d3c-4b5a6c7d8e9f
                    id: 212
                    name: Scranton Distribution Center
                    external_id: SCR-01
                  variant:
                    id: 70421
                    sku: PAPER-A4-500
                    product_id: 9184
                    title: A4 / 500 sheets
                    tracked: true
                    inventory_policy: deny
                  quantities:
                    available: 228
                    committed: 12
                    on_hand: 244
                    unavailable: 4
                  created_at: '2026-03-14T09:12:44Z'
                  updated_at: '2026-11-02T15:04:05Z'
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-11-02T15:04:05Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A count's `compare_quantity` did not match (the error envelope, keyed by the count's index), or a request with the same `Idempotency-Key` is still running (`{ status, message }`).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorResponse'
                - $ref: '#/components/schemas/IdempotencyRefusal'
              example:
                error:
                  message: available is 226, not 228
                  details:
                    '0':
                      compare_quantity:
                      - 'does not match: available is now 226'
                      current_quantity: 226
                status: 409
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-11-02T15:04:05Z'
        '422':
          $ref: '#/components/responses/InvalidLines'
  /api/company/v2026-10/inventory-adjustments:
    get:
      operationId: listInventoryAdjustmentsV202610
      summary: List inventory history
      description: 'Every change to your stock, newest first, a page at a time: orders placed, cancelled, refunded and shipped, cart holds, counts, adjustments, CSV imports and edits in the admin. Each entry says how each quantity moved and the reason recorded with it. Needs `inventory.view`.'
      tags:
      - inventory-adjustments
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: filter[since]
        in: query
        required: false
        description: The earliest change to return. Defaults to the start of the hour 30 days ago. Send the same value with every page of a cursor.
        schema:
          type: string
          format: date-time
      - name: filter[inventory_level_id]
        in: query
        required: false
        description: Only changes to the inventory level with this `uuid`.
        schema:
          type: string
          format: uuid
      - name: filter[location_id]
        in: query
        required: false
        description: Only changes at the location with this `uuid`.
        schema:
          type: string
          format: uuid
      - name: filter[location_external_id]
        in: query
        required: false
        description: Only changes at the location with this `external_id`.
        schema:
          type: string
      - name: filter[variant_id]
        in: query
        required: false
        description: Only changes to this variant's stock.
        schema:
          type: integer
      - name: filter[sku]
        in: query
        required: false
        description: Only changes to the stock of variants with this SKU.
        schema:
          type: string
      - $ref: '#/components/parameters/PageCursor'
      - name: page[limit]
        in: query
        required: false
        description: Changes per page, 1 to 100. Defaults to 25.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAdjustmentListResponse'
              example:
                inventory_adjustments:
                - uuid: 0199c4a0-1b2c-7d3e-8f40-5a6b7c8d9e0f
                  inventory_level:
                    uuid: 0199c3e1-7a2b-7c4d-8e5f-6a7b8c9d0e1f
                    id: 48213
                  location:
                    uuid: 0199c3e1-6b1a-7f2e-9d3c-4b5a6c7d8e9f
                    id: 212
                    name: Scranton Distribution Center
                    external_id: SCR-01
                  variant:
                    id: 70421
                    sku: PAPER-A4-500
                    product_id: 9184
                    title: A4 / 500 sheets
                    tracked: true
                    inventory_policy: deny
                  changes:
                    available:
                      from: 230
                      to: 228
                      change: -2
                    committed:
                      from: 10
                      to: 12
                      change: 2
                  reason: 'Inventory adjusted: Order [#100412] placed.'
                  created_at: '2026-11-02T15:04:05Z'
                status: 200
                meta:
                  request_uuid: 7e2c9b41-3f8a-4d15-b6e0-9a4c21d7f583
                  timestamp: '2026-11-02T15:04:05Z'
                  pagination:
