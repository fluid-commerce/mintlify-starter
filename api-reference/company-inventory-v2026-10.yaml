    post:
      operationId: createInventoryAdjustmentsV202610
      summary: Adjust inventory
      description: |-
        Changes quantities by an amount: stock received, damaged, found or written off. `available` changes sellable stock and `unavailable` changes set-aside stock; `on_hand` moves with either. `committed` is never changed. Each change applies to the level as it is when the request arrives, so concurrent orders are kept. `available` may go below zero (stock oversold against open orders); `unavailable` and `on_hand` may not.

        The variant needs a level at the location; record an inventory count to create one. The batch applies every adjustment or none. An `Idempotency-Key` is required. Needs `inventory.update`.
      tags:
      - inventory-adjustments
      x-fluid-audience: company
      security:
      - bearer_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required. A key you make (a UUID works) that makes a resend safe: resending the same request with the same key within 24 hours replays the first response with `X-Idempotent-Replayed: true` and applies nothing. The key is 1 to 255 printable ASCII characters. A different request under the same key answers 422, and a resend while the first is still running answers 409.'
        schema:
          type: string
          minLength: 1
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAdjustmentRequest'
            example:
              adjustments:
              - sku: PAPER-A4-500
                location_external_id: SCR-01
                name: available
                change: 48
                reason: PO 7731 received
              - variant_id: 70421
                location_id: 0199c3e1-6b1a-7f2e-9d3c-4b5a6c7d8e9f
                name: unavailable
                change: 2
                reason: Water-damaged cases
      responses:
        '201':
          description: The levels after the adjustments, in the order the adjustments came.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLevelBatchResponse'
              example:
                inventory_levels:
                - uuid: 0199c3e1-7a2b-7c4d-8e5f-6a7b8c9d0e1f
                  id: 48213
                  location:
                    uuid: 0199c3e1-6b1a-7f2e-9d3c-4b5a6c7d8e9f
                    id: 212
                    name: Scranton Distribution Center
                    external_id: SCR-01
                  variant:
                    id: 70421
                    sku: PAPER-A4-500
                    product_id: 9184
                    title: A4 / 500 sheets
                    tracked: true
                    inventory_policy: deny
                  quantities:
                    available: 228
                    committed: 12
                    on_hand: 244
                    unavailable: 4
                  created_at: '2026-03-14T09:12:44Z'
