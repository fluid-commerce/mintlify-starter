  schemas:
    TaskReview:
      type: object
      additionalProperties: false
      description: Mist's saved review of one finished task version. Cited reads carry a tool and route, never a record's path or id.
      required:
        - id
        - task_id
        - message_id
        - discussion_id
        - reviewed_version
        - score
        - summary
        - findings
        - unchecked
        - evidence
        - cap_reasons
        - reopenable
        - checkable
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        message_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The chat message that draws this review.
        discussion_id:
          type: string
          format: uuid
          description: The chat the check was asked in.
        reviewed_version:
          type: integer
          minimum: 0
          description: The task version in review that was checked.
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Mist's confidence that the work matches the request
          after the server's caps.: null
        summary:
          type: string
          minLength: 1
          maxLength: 500
        findings:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required:
              - priority
              - title
              - description
            properties:
              priority:
                type: string
                enum:
                  - P0
                  - P1
                  - P2
              title:
                type: string
                minLength: 1
                maxLength: 200
              description:
                type: string
                minLength: 1
                maxLength: 1000
              where:
                type: string
                minLength: 1
                maxLength: 200
        unchecked:
          type: array
          maxItems: 10
          description: What Mist could not check.
          items:
            type: string
            minLength: 1
            maxLength: 300
        evidence:
          type: array
          maxItems: 10
          description: The successful reads of company data the score relies on.
          items:
            type: object
            additionalProperties: false
            required:
              - tool
            properties:
              tool:
                type: string
                maxLength: 64
              route:
                type: string
                maxLength: 512
                description: The API route read
                with ids and slugs replaced by parameter names.: null
        cap_reasons:
          type: array
          description: Why the server lowered the score to 3. Empty when the score was not lowered.
          items:
            type: string
            enum:
              - theme_work
              - no_record_read
        reopenable:
          type: boolean
          description: Whether the reader may reopen the task from this review now. Only the task's newest review offers it
          while the task waits in review at the reviewed version: null
          to a reader with the chat reply and task update grants.: null
        checkable:
          type: boolean
          description: Whether the reader may ask for another check of the reviewed version now. Only the task's newest review offers it
          while the task waits in review at the reviewed version: null
          to a reader with the check endpoint's grants.: null
        created_at:
          type: string
          format: date-time
    TaskHistoryEvent:
      type: object
      additionalProperties: false
      description: One recorded write to a task, or to a preview thread standing in for one, and who made it.
      required:
        - id
        - task_id
        - preview_thread_id
        - changes
        - assignee
        - agency
        - people
        - created_at
        - actor
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The task the write changed
          or null for a preview thread.: null
        preview_thread_id:
          type:
            - integer
            - 'null'
          description: The root preview thread the write changed
          or null for a task.: null
        changes:
          type: object
          description: 'Each changed field mapped to its value before and after the write. Fields are title, kind, status, assignee_kind, assignee_id, priority, due_on, tags, agency_id, discarded_at and description, plus resolution on a preview thread (how a Done comment was decided); a preview thread has no title, kind, due_on, tags or description. A description change is recorded as [null, null]: the work holds its current text, so history says only that the request was rewritten. A task''s activity that is no field of it is recorded the same way, with ids and kinds only: agency_step is [null, kind], an agency request step such as quoted, quote_accepted, declined, work_accepted, reopened or a reminder (a send and a withdrawal are agency_id changes); agency_owner is who at the agency held the ticket before and after, as user ids or null; agency_access is [null, user_ids] for store access given and [user_ids, null] for access taken away; mist_start is [null, requested | publish_requested | cancelled]; mist_assessment is [null, assessed]; and mist_review is [null, reviewed]. An agency''s own staff read history without any of this activity.'
          minProperties: 1
          additionalProperties:
            type: array
            minItems: 2
            maxItems: 2
        agency:
          description: The agency the work was sent to before and after the write as `[before, after]`, each an agency or null for none, when the write sent, switched or withdrew it; otherwise null. A send is `[null, agency]`, a switch `[from, to]` and a withdrawal `[agency, null]`. An agency's own staff read history without these writes.
          type:
            - array
            - 'null'
          minItems: 2
          maxItems: 2
          prefixItems:
            - anyOf:
                - $ref: '#/components/schemas/Agency'
                - type: 'null'
            - anyOf:
                - $ref: '#/components/schemas/Agency'
                - type: 'null'
        assignee:
          description: The owner before and after the write as `[before, after]`, each a person or null for nobody, when the write changed the owner; otherwise null. A user who has since been erased keeps their id and has a null name.
          type:
            - array
            - 'null'
          minItems: 2
          maxItems: 2
          prefixItems:
            - anyOf:
                - $ref: '#/components/schemas/Person'
                - type: 'null'
            - anyOf:
                - $ref: '#/components/schemas/Person'
                - type: 'null'
        people:
          description: The people the event's agency_owner and agency_access changes name, keyed by user id, each by their name or "Unnamed person", never by email; the actor of an agency step, pick-up or access change is named the same way. A user who has since been erased keeps their id and has a null name. Empty when the event names nobody, and always on an agency's own read.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Person'
        created_at:
          type: string
          format: date-time
        actor:
          description: Who made the change, or null when nobody did by hand, such as Mist finishing a run, or when that person has since been erased.
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
