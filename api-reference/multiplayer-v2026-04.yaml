    PreviewThreadDetail:
      type: object
      description: Original preview-comment fields, with replies limited to this page.
      required:
        - id
        - client_id
        - 'n'
        - body
        - status
        - status_at_ms
        - lock_version
        - run_id
        - page_url
        - author_name
        - created_at_ms
        - theme_changed_at
        - template_id
        - pin
        - target
        - section
        - block
        - mentions
        - mentioned_project
        - proof_baseline
        - assignee
        - assigner
        - assigned_at_ms
        - priority
        - priority_at_ms
        - replies
        - work_item
      properties:
        id:
          type: integer
        client_id:
          type: string
        body:
          type: string
        'n':
          type: integer
        status:
          type: string
          enum:
            - open
            - kept
            - needs_info
            - in_progress
            - handed
            - review
            - skipped
        resolution:
          type:
            - string
            - 'null'
          enum:
            - approved
            - closed
            - null
          description: How a Done (skipped) comment was decided, or null while it is not Done or was decided without a verdict.
        status_at_ms:
          type:
            - integer
            - 'null'
        lock_version:
          type: integer
          minimum: 0
        run_id:
          type:
            - string
            - 'null'
        page_url:
          type: string
        author_name:
          type:
            - string
            - 'null'
        created_at_ms:
          type: integer
        theme_changed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the theme was last published after this comment was created, or null when it has not been. A time here means the comment was pinned against a page that has since changed, so it may be out of date. The latest of the comment's own template, any structural template of the theme, the theme's own variables and stylesheets, and a release being put in service (a rollback included). Drafts do not count. Computed on each read and never stored. Carried by the comment only; its replies do not have it. Matches the theme's own preview comment list.
        template_id:
          type:
            - integer
            - 'null'
        pin:
          $ref: '#/components/schemas/PreviewThreadPin'
        target:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadTarget'
            - type: 'null'
        section:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadThemeRef'
            - type: 'null'
        block:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadThemeRef'
            - type: 'null'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/PreviewThreadMention'
        mentioned_project:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadMentionedProject'
            - type: 'null'
        proof_baseline:
          description: Before screenshot URL and dimensions, or null if no capture was recorded.
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadBaseline'
            - type: 'null'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadPerson'
            - type: 'null'
        assigner:
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadPerson'
            - type: 'null'
        assigned_at_ms:
          type:
            - integer
            - 'null'
        published:
          description: That the change Mist answered with went out in a publish, or null while none has.
          oneOf:
            - type: object
              required:
                - run_id
                - at_ms
                - publisher
              properties:
                run_id:
                  type: string
                at_ms:
                  type: integer
                publisher:
                  oneOf:
                    - $ref: '#/components/schemas/PreviewThreadPerson'
                    - type: 'null'
            - type: 'null'
        priority:
          type:
            - string
            - 'null'
          enum:
            - urgent
            - high
            - medium
            - low
            - null
        priority_at_ms:
          type:
            - integer
            - 'null'
        work_item:
          description: Routing hint when the reader also holds multiplayer_tasks.view; otherwise null.
          oneOf:
            - $ref: '#/components/schemas/PreviewThreadWorkItem'
            - type: 'null'
        replies:
          type: array
          description: This reply page, newest first by creation time and row id.
          items:
            $ref: '#/components/schemas/PreviewThreadReply'
    BoardPreviewComment:
