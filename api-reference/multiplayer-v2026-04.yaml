  /api/v202604/multiplayer/board:
    get:
      operationId: getMultiplayerBoard
      tags:
        - Cowork tasks
      x-fluid-audience: company
      summary: Read everything the task board draws
      description: 'Requires a user session with multiplayer_tasks.view or application_themes.view. Returns the company''s work, most recently updated first, and every theme''s preview comments in one read: each theme''s undiscarded root comments with their complete replies, oldest first, and the client ids of its deleted root comments. Comments are returned only with application_themes.view, and a comment''s work identity only with multiplayer_tasks.view. Each half is bounded: at most 500 pieces of work; at most 500 live root comments and 2,000 rows counting their replies; and the 500 most recently deleted root comments. `truncated` says when either half was cut short. With `tasks=false` the work is not read: `tasks` is empty and `truncated.tasks` is false.'
      security:
        - bearer_auth: []
      parameters:
        - name: tasks
          in: query
          required: false
          description: false leaves the company's work out, for a board that reads its work a column page at a time from the task list and wants only the comments.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: The company's work and its themes' preview comments.
          content:
            application/json:
              example:
