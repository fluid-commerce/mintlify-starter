      x-fluid-audience: company
      summary: Attach an image or file to the company's work
      description: 'Requires a user session with multiplayer_tasks.update or the existing application_themes.update permission, and the cowork-ticket-attachments release for the company; without the release it answers not-found. Takes one multipart file. Its type is read from its bytes, never its name: PNG, JPEG, GIF, WebP, PDF, Word, Excel and PowerPoint documents are recognised from their contents, and plain text, CSV and Markdown are accepted by name only when the bytes are text. SVG, HTML and anything else are refused. A file can be at most 25 MB and a ticket holds at most 20. Like rewriting the request, it is refused while a run holds the work or its result is still on it. The bytes are stored privately and read only through the ten-minute link the ticket''s detail lists.'
      security:
        - bearer_auth: []
      parameters:
        - name: task_id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The image or file to attach.
      responses:
        '201':
          description: The attachment as the ticket now lists it.
          content:
            application/json:
              example:
                attachment:
