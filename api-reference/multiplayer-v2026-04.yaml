  /api/v202604/agencies/{agency}/tasks:
    get:
      operationId: listAgencyTasks
      tags:
        - Agency work
      x-fluid-audience: company
      summary: List the tickets sent to an agency
      description: Requires an admin-tier user session whose user is a kept member of the agency, confirmed again on this request; root admin does not stand in for membership. Returns undeleted tickets sent to the agency in companies with Cowork on, across every such company, most recently updated first, with stable cursor pagination. Each ticket names its company. The read never changes the session's company and returns no chat, theme, customer or order.
      security:
        - bearer_auth: []
      parameters:
        - $ref: '#/components/parameters/AgencyKey'
        - name: sort
          in: query
          description: '`updated` (the default) and `board` both return the most recently updated tickets first: board positions belong to one company, so they order nothing across companies. `due` returns tickets by due date, earliest first, then tickets with no due date, ties by id.'
          schema:
            type: string
            enum:
              - updated
              - board
              - due
        - name: page[cursor]
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: page[limit]
          in: query
          description: Maximum records to return, defaulting to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: filter[status]
          in: query
          description: Comma-separated statuses to keep, for example `open,needs_info`.
          schema:
            type: string
            maxLength: 200
            pattern: ^(open|kept|needs_info|in_progress|handed|review|skipped)( *, *(open|kept|needs_info|in_progress|handed|review|skipped))*$
        - name: filter[exclude_status]
          in: query
          description: Comma-separated statuses to leave out. Refused together with `filter[status]`.
          schema:
            type: string
            maxLength: 200
            pattern: ^(open|kept|needs_info|in_progress|handed|review|skipped)( *, *(open|kept|needs_info|in_progress|handed|review|skipped))*$
        - name: filter[priority]
          in: query
          description: Comma-separated priorities to keep, for example `urgent,high`. `none` keeps tickets with no priority.
          schema:
            type: string
            maxLength: 200
            pattern: ^(urgent|high|medium|low|none)( *, *(urgent|high|medium|low|none))*$
        - name: filter[kind]
          in: query
          description: Comma-separated kinds to keep, for example `bug,change`. `none` keeps tickets with no kind. Values within the filter match any of them; the filter narrows with the other filters, and with `filter[category]` a ticket must match both.
          schema:
            type: string
            maxLength: 200
            pattern: ^(bug|change|feature|design|support|none)( *, *(bug|change|feature|design|support|none))*$
        - name: filter[category]
          in: query
          description: 'Comma-separated categories to keep, for example `design,support`: `design` keeps design tickets, `support` keeps support tickets and `eng` keeps bugs, changes and features. `none` keeps tickets with no kind, which belongs to no category. Values within the filter match any of them; the filter narrows with the other filters, and with `filter[kind]` a ticket must match both.'
          schema:
            type: string
            maxLength: 200
            pattern: ^(design|support|eng|none)( *, *(design|support|eng|none))*$
        - name: filter[title]
          in: query
          description: Keep tickets whose title contains this text, ignoring case. `%` and `_` match themselves.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: filter[owner]
          in: query
          description: '`me` keeps tickets the caller owns. `unpicked` keeps tickets nobody owns: never picked up, or released.'
          schema:
            type: string
            enum:
              - me
              - unpicked
        - name: filter[stage]
          in: query
          description: 'Comma-separated request stages to keep, for example `requested,quoted`: `requested` waits for a quote, `quoted` waits for the customer, `accepted` is being built and `done_proposed` waits for the customer to accept the work. `meta.total` counts with the filter.'
          schema:
            type: string
            maxLength: 200
            pattern: ^(requested|quoted|accepted|done_proposed)( *, *(requested|quoted|accepted|done_proposed))*$
        - name: filter[due_from]
          in: query
          description: Keep tickets due on or after this date, an inclusive calendar date the client computes in its own time zone. Tickets with no due date are not kept. May be combined with `filter[due_to]`; refused with `filter[due]`, and when it is after `filter[due_to]`.
          schema:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        - name: filter[due_to]
          in: query
          description: Keep tickets due on or before this date, an inclusive calendar date the client computes in its own time zone. Tickets with no due date are not kept. May be combined with `filter[due_from]`; refused with `filter[due]`.
          schema:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        - name: filter[due]
          in: query
          description: '`none` keeps tickets with no due date. Refused with `filter[due_from]` or `filter[due_to]`.'
          schema:
            type: string
            enum:
              - none
      responses:
        '200':
          description: A page of the agency's tickets.
          content:
            application/json:
              schema:
                type: object
                required:
                  - tasks
                  - status
                  - meta
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgencyTask'
                  status:
                    const: 200
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - pagination
                        properties:
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                          total:
                            type: integer
                            minimum: 0
                            description: On a page read without a cursor, the number of tickets the filters keep.
              example:
                tasks:
                  - id: 0197d4e2-7a31-7c3e-9b52-4f1d8a6e2c11
                    client_id: acme-videos
                    company_id: 42
                    creator_id: 4120
                    title: Add customer videos
                    description: Use videos from the media library
                    status: open
                    priority: high
                    due_on: null
