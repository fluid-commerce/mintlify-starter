                    run_id: null
                    run_thread_id: null
                    source_threads: []
                    status: open
                    status_editable: true
                    tags: []
                    title: Undated
                    updated_at: '2026-11-12T17:52:35Z'
                status: 200
                meta:
                  request_uuid: null
                  timestamp: '2026-11-12T17:52:35Z'
                  pagination:
                    cursor: 
                    limit: 2
                    prev_cursor: 
                    next_cursor: 
              schema:
                type: object
                required:
                  - tasks
                  - status
                  - meta
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  status:
                    const: 200
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - type: object
                        required:
                          - pagination
                        properties:
                          pagination:
                            $ref: '#/components/schemas/Pagination'
                          total:
                            type: integer
                            minimum: 0
                            description: On a page read without a cursor, the number of tickets the filters keep.
                          next_board_position:
                            type:
                              - string
                              - 'null'
                            description: With `sort=board`, the position of the first ticket after this page, or null at the end or when that ticket is unplaced.
                          attachment_limits:
                            type: object
                            description: While the company has Cowork and ticket attachments are released for it, the limits a file attached to a ticket is held to; left out otherwise.
                            required:
                              - byte_limit
                              - count_limit
                            additionalProperties: false
                            properties:
                              byte_limit:
                                type: integer
                                minimum: 1
                                description: The largest file, in bytes.
                              count_limit:
                                type: integer
                                minimum: 1
                                description: The most files one ticket holds.
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, and read permission are required.
        '422':
          description: The pagination limit, cursor, sort, or a filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createMultiplayerTask
      tags:
        - Cowork tasks
      x-fluid-audience: company
      summary: Submit standalone company work
      description: Requires an authenticated person who is a company admin with multiplayer_tasks.create or the existing application_themes.update permission. Company and creator come from the authenticated session. No theme, template, or pin is required. An identical client_id submission returns the stored task; a conflicting submission returns 409, and a deleted identity returns 410.
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              task:
                client_id: shipping-poland
                title: Investigate checkout in Poland
                description: Shipping methods are missing
            schema:
              type: object
              required:
                - task
              properties:
                task:
                  type: object
                  required:
                    - client_id
                    - title
                  properties:
                    client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: Client-generated submission identity, unique within the company. The `preview-` prefix is reserved for work migrated from preview discussions and is refused with 422.
                    title:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: A short description of the requested work.
                    description:
                      type: string
                      maxLength: 10000
                      description: Additional request context; defaults to an empty string.
                    due_on:
                      type:
                        - string
                        - 'null'
                      format: date
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      description: 'The calendar day the work is due, as YYYY-MM-DD, or null for no due date. A day and not an instant, so it carries no time zone. Anything that is not a real calendar day, such as 2026-02-30 or a word like friday, is refused with 422. It is written with the work only: an identical client_id submission returns the stored task with whatever due date it has since been given.'
      responses:
        '201':
          description: The newly created or identically retried task.
          content:
            application/json:
              example:
                task:
                  id: 01a1d0e3-51be-7c13-8ed7-cc78cde51ac4
                  agency: null
                  agency_join_request: null
                  agency_request: null
                  assignee: null
                  assigner: null
                  board_position: a0
                  board_position_at_ms: null
                  category: null
                  client_id: shipping-poland
                  company_id: 96778814
                  created_at: '2026-11-12T17:52:00Z'
                  creator_id: 433400890
                  description: Shipping methods are missing
                  due_on: null
                  kind: null
                  lock_version: 0
                  merged_from: []
                  merged_into: null
                  mist_confidence:
                    state: not_assessed
                  plan: null
                  priority: null
                  run_id: null
                  run_thread_id: null
                  source_threads: []
                  status: open
                  status_editable: true
                  tags: []
                  title: Investigate checkout in Poland
                  updated_at: '2026-11-12T17:52:00Z'
                status: 201
                meta:
                  request_uuid: null
                  timestamp: '2026-11-12T17:52:00Z'
              schema:
                type: object
                required:
                  - task
                  - status
                  - meta
                properties:
                  task:
                    $ref: '#/components/schemas/Task'
                  status:
                    const: 201
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, and task-creation permission are required.
        '409':
          description: The client identity belongs to a different submission. The current task is included only for its original submitter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '410':
          description: The task was deleted and cannot be recreated by retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The submission is invalid, or it names a source_thread_id, which creation no longer accepts; a discussion is linked to work through POST /api/v202604/multiplayer/tasks/{id}/source-threads. Nothing is created either way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v202604/multiplayer/agencies:
    get:
      operationId: listMultiplayerAgencies
      tags:
        - Agency requests
      x-fluid-audience: company
      summary: List the agencies work can be sent to
      description: 'Requires a company-admin user session with multiplayer_tasks.view or application_themes.view. An agency is a partner that works the tickets customers send it. Agencies belong to no company, so every company reads the same list: the kept agencies ordered by name, each by its permanent key and its name. Send work to one with POST /api/v202604/multiplayer/tasks/{id}/agency-requests.'
      security:
        - bearer_auth: []
      responses:
        '200':
          description: The agencies, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - agencies
                  - status
                  - meta
                properties:
                  agencies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agency'
                  status:
                    const: 200
                  meta:
                    $ref: '#/components/schemas/Meta'
