      summary: Merge a ticket into the older one Mist read it as a repeat of
      description: 'Requires a user session with multiplayer_tasks.update or the existing application_themes.update permission, and Cowork enabled for the company (features/cowork, Phase 026). Mist suggests (mist_confidence.duplicate_of) and never merges; this is the person''s decision. The ticket''s request is appended to the older ticket''s request under a heading "Merged from {title}", through the same edit as rewriting the request, so the older ticket is scored again; and the ticket is closed (status skipped) and frozen, keeping its row, history and links, until it is split. Both changes are made together or not at all. The older ticket has no version to send: it is read under its lock. Only the suggestion of the ticket''s current read can be merged, while the work has not started. Work sent to an agency, and an older ticket Mist holds, that is in Review, or that carries a run''s result, cannot take a request. Work in another company, deleted work, an unknown id, and a company without Cowork all answer the same not-found.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID of the ticket to merge.
          schema:
            type: string
            format: uuid
        - name: assessment_id
          in: path
          required: true
          description: The read that named the older ticket, from mist_confidence.assessment_id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expected_version
              properties:
                expected_version:
                  type: integer
                  minimum: 0
                  description: The ticket's lock_version the person observed.
            examples:
              merge:
                value:
                  expected_version: 3
      responses:
        '200':
          description: The older ticket, now carrying the block, and the ticket that was closed.
          content:
