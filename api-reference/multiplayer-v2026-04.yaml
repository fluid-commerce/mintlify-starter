      tags:
        - Discussions
      x-fluid-audience: company
      summary: Add a person's message to a discussion
      description: Requires multiplayer_discussions.reply. The author comes from the authenticated session and the message takes the next sequence. Retrying the same client_id with the same body and admin page returns the saved message with 200; the same client_id with a different body or admin page returns 409. A message from the person who asked the question a runtime has claimed ends that claim and leaves any answer to the earlier question unpublished; a teammate's message does not.
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              message:
                client_id: m-2-e1
                body: Two, edited
                withdraws:
                  from_sequence: 2
                  through_sequence: 2
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: object
                  required:
                    - client_id
                    - body
                  properties:
                    client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: Client-generated message identity, unique for its author within the discussion.
                    body:
                      type: string
                      minLength: 1
                      maxLength: 32768
                      description: At most 32,768 bytes of UTF-8, which is fewer characters when the text is not ASCII; a longer body is refused with 422.
                    admin_page:
                      $ref: '#/components/schemas/DiscussionAdminPage'
                    withdraws:
                      type: object
                      description: The earlier messages the person took back on another device, by editing or rewinding the chat, before writing this one. Readers such as Mist's runs in Rails skip them; nothing is removed. Only the chat's creator may send it, only for messages before this one, and only where MIST_SHARED_CHAT is on. A retry must repeat it.
                      required:
                        - from_sequence
                        - through_sequence
                      properties:
                        from_sequence:
                          type: integer
                          minimum: 1
                        through_sequence:
                          type: integer
                          minimum: 1
      responses:
        '200':
          description: An identical retry; the saved message is returned and nothing new is written.
          content:
            application/json:
              example:
                message:
                  id: 01a1d0e3-7939-75e2-91c3-b42b79ffb130
                  admin_page: null
                  author:
                    id: '433400890'
                    name: Admin Acme
