  /api/v202604/multiplayer/tasks/{id}/status:
    put:
      operationId: modifyMultiplayerTaskStatus
      tags:
        - Cowork tasks
      x-fluid-audience: company
      summary: Record a person's verdict on the company's work
      description: 'Requires a user session with multiplayer_tasks.update or the existing application_themes.update permission. Records a human decision: keep the work open, send it back for more information, mark it in progress or ready for review, or close it. Work a person holds, closed work included, can be moved to any of these. Execution states are not human decisions and are refused as an invalid payload — work a run still owns is given back by cancelling that run at the identity and version that holds it, not by naming a status here, and a decision that supersedes a run clears the run and the discussion it was going to answer. The version the client observed is compared with the stored one, so a verdict reached against a stale view is refused and answered with the current task instead of merged. Work in another company, deleted work, and an unknown id all answer the same not-found; work deleted after that read and before the verdict lands answers 410. A successful write announces a data-free invalidation on every theme this work''s linked discussions sit on. Only the people working a ticket move its status, in a company with Cowork on. A ticket sent to an agency (it has an open request) is moved by the agency''s members through the agency route, and the person who made it accepts or refuses their work instead; a ticket not sent, with an assignee, is moved by that assignee. Anyone else is refused with 403 and `details.type` `status_not_yours`, before the observed version is compared, and nothing is written. An unassigned ticket is unchanged. The `status_editable` of each task card says whether the viewer may move it.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              status_change:
                status: in_progress
                expected_version: 0
            schema:
              type: object
              required:
                - status_change
              properties:
                status_change:
                  type: object
                  required:
                    - status
                    - expected_version
                  properties:
                    status:
                      type: string
                      enum:
                        - open
                        - needs_info
                        - in_progress
                        - review
                        - skipped
                      description: The verdict. Only these are a person's to name; handed belongs to a run. In progress says a person is working on unfinished work, and Review finishes it, as a finished run does.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: The task version the client observed. A mismatch is a conflict.
      responses:
        '200':
          description: The task at its new status.
          content:
            application/json:
              example:
                task:
                  id: 01a1d0e2-0319-7df7-8a02-8c326fdbff67
                  agency: null
                  agency_join_request: null
                  agency_request: null
                  assignee:
