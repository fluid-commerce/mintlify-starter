      summary: Cancel the ask for an agency
      description: 'Requires a company-admin user session with multiplayer_tasks.execute and the company''s COWORK feature flag, as asking does, but not AGENCY_REQUESTS: turning that flag off never strands a request that is waiting. Any such admin may cancel, not only the person who asked. It moves the request the client names (`join_request_id`, the `agency_join_request.id` on the ticket) from `pending` to `cancelled`, so the ticket reads `agency_join_request` as null, and compares that request''s own version (`agency_join_request.lock_version` on the ticket) rather than the task''s. The client names the request because a ticket can ask again after a cancel: a stale cancel of the first request never reaches the newer one. A request that is no longer pending (Fluid answered, or it was cancelled already) answers 409 with `details.type` already_decided and the ticket as it now stands, including the newer request if there is one, and a stale version answers 409 with `details.type` conflict. An id the ticket never had answers 404. Not-found and 410 behave as they do when asking.'
