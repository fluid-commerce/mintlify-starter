  /api/v202604/multiplayer/tasks/{id}/run/finish:
    post:
      operationId: finishMultiplayerTaskRun
      tags:
        - Mist runs
      x-fluid-audience: company
      summary: End the run and store the answer it has to show
      description: 'Requires a user session with multiplayer_tasks.execute or the existing application_themes.update permission. Moves work the run still owns to review (or to needs_info when the backstop marks the run unfinished, which must then carry a reply or result saying why) and, when a reply is supplied, stores it on the discussion that run was claimed from — both under one transaction, so a refused answer leaves the work where it was and a refused completion takes the answer back out. Omit expected_version and the run is answering for itself, so a priority set while it was out does not lose its answer; supply one for the backstop, which wants the work only if nothing has happened to it since. A reply is required while the discussion the run was claimed from is undeleted and still linked to this work, and finishing without one then is refused. Omit reply when there is no such discussion: standalone work, or a discussion deleted or unlinked while the run was out, which finishes without one rather than leaving the work stuck; supplying one for such work is refused. A standalone run accepted through a saved Start request instead requires a bounded plain-text result, stored on that same request in the completion transaction. Legacy standalone runs without a Start request may still finish without a result. Work in another company, deleted work, and an unknown id all answer the same not-found; work deleted after that read and before the completion lands answers 410. A successful completion announces a data-free invalidation on every theme this work''s linked discussions sit on.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              run:
                run_id: finish-0002
              reply:
                client_id: run-answer-0001
                body: Set the heading to your collection.
                shot:
                  width: 1280
                  height: 720
                  asset_id: 1050970312
                proof:
                  route: /home/shop
                  checks:
                    - label: Rendered
                      status: pass
                  record_changes:
                    - label: Updated product
                      method: PATCH
                      path: /api/v202604/company/products/7
                      outcome: uncertain
                      fields:
                        - path: price
                          before: '40'
                          after: '45'
                  data_snapshots:
                    - label: Best sellers
                      path: /api/v202604/analytics/dashboard/best_sellers
                      rows:
                        - path: data[0].name
                          before: Cap
                          after: Hoodie
            schema:
              type: object
              required:
                - run
              properties:
                run:
                  type: object
                  required:
                    - run_id
                  properties:
                    run_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The identity of the run that is answering. It must be the one the work holds.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: The task version the client observed. Present is the backstop's shape and a mismatch is a conflict; absent is the run answering for itself, which accepts any version.
                    unfinished:
                      type: boolean
                      description: The backstop's mark for a run that ended without an answer of its own. The reply or result then says why, and the work moves to needs_info, back to the person who asked for it, instead of review.
                reply:
                  type: object
                  description: The answer to store on the discussion this run was claimed from. Required while that discussion is undeleted and still linked to this work; omit it when there is none.
                  required:
                    - client_id
                    - body
                  properties:
                    client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: Client-generated reply identity. Retrying it stores one reply and fills in any evidence it gained.
                    body:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: What the run has to say. Whitespace-only bodies are refused.
                    shot:
                      type: object
                      description: The after screenshot's dimensions and the asset holding it. Absent evidence is not an error.
                      required:
                        - width
                        - height
                        - asset_id
                      properties:
                        width:
                          type: integer
                          minimum: 1
                          description: Captured width in pixels.
                        height:
                          type: integer
                          minimum: 1
                          description: Captured height in pixels.
                        asset_id:
                          type: integer
                          minimum: 1
                          description: Id of the company's stored image asset.
                    proof:
                      type: object
                      description: What a reviewer reads instead of taking "I fixed it" on trust. Every part is optional.
                      properties:
                        route:
                          type: string
                          description: The page path the work was measured on.
                        files:
                          type: array
                          description: The files that changed on disk.
                          items:
                            type: string
                        before:
