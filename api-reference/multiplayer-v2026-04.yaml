  /api/v202604/multiplayer/tasks/{task_id}/reviews:
    post:
      operationId: checkMultiplayerTask
      tags:
        - Mist runs
      x-fluid-audience: company
      summary: Ask Mist to check finished work
      description: 'Asks Mist to check a task in review, as the person''s question in the chat the task came from: the oldest linked chat the caller can open, else the caller''s chat started from the task, else a new chat started from it. The check run only reads and ends with a saved review. Requires multiplayer_tasks.view (or application_themes.view), multiplayer_discussions.view, multiplayer_discussions.create, multiplayer_discussions.reply and mist.view. The question, a new chat and the run are saved together, or none of them. A retry with the same client id returns the same chat, question and run while that check runs or once it saved its review, and only while the caller can still open the chat; after a check that failed, was cancelled, or finished without a review it starts the next attempt. A check whose outcome is unknown is returned, not asked again, since it may have reached the model. A client id names one task version''s check, so another task or version is a conflict.'
      security:
        - bearer_auth: []
      parameters:
        - name: task_id
          in: path
          required: true
          description: The task UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              check:
                client_id: recheck-newer
                expected_version: 1
                review_id: 01a1d0e3-c68a-7809-bc99-3fe404ee54dc
            schema:
              type: object
              required:
                - check
              properties:
                check:
                  type: object
                  required:
                    - client_id
                    - expected_version
                  properties:
                    client_id:
                      type: string
                      maxLength: 200
                      pattern: ^(?![A-Za-z0-9_-]*-r[0-9]+$)[A-Za-z0-9_-]+$
                      description: The client's identity for this check; a retry with it returns the same chat, question and run. It may not end in -r and a number, which the server adds to the attempts after a check that ended without a review.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: The task version the person saw in review. A mismatch is a conflict.
                    review_id:
                      type: string
                      format: uuid
                      description: The review a Check again comes from. The check is refused as a conflict once a newer review of the task, visible to the caller, replaced it.
      responses:
        '202':
          description: The chat, the person's question and the accepted check run.
          content:
