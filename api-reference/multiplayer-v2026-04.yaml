            - string
            - 'null'
        finished_at:
          type: string
          format: date-time
    ResultEvidenceSideInput:
      type: object
      description: One side of a screenshot, the capture or why there is none.
      properties:
        asset_id:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        missing:
          type: string
          maxLength: 500
          description: Why this side has no capture. Never sent with a capture.
    ResultEvidenceInput:
      type: object
      required:
        - kind
        - label
      description: A screenshot item carries route, before and after; a files item carries files and total; a record_change item carries method, path, outcome and fields, with before_missing or after_missing when a side has no values; a data_snapshot item carries path, rows, an optional series, and when each side was read.
      properties:
        kind:
          type: string
          enum:
            - screenshot
            - files
            - record_change
            - data_snapshot
        label:
          type: string
          maxLength: 200
        route:
          type: string
          maxLength: 2048
          description: The storefront path the screenshot shows.
        before:
          $ref: '#/components/schemas/ResultEvidenceSideInput'
        after:
          $ref: '#/components/schemas/ResultEvidenceSideInput'
        files:
          type: array
          maxItems: 50
          items:
            type: string
        total:
          type: integer
          minimum: 0
          description: Every file the run wrote, including any beyond those listed.
        method:
          type: string
          enum:
            - POST
            - PATCH
            - PUT
            - DELETE
          description: How the run wrote the record.
        path:
          type: string
          maxLength: 2048
          description: The API path of the record.
        outcome:
          type: string
          enum:
            - applied
            - failed
            - uncertain
          description: applied when the API accepted the write; failed when it refused it; uncertain when the response was lost and a read afterwards found it applied.
        fields:
          type: array
          maxItems: 15
          items:
            $ref: '#/components/schemas/RecordChangeFieldInput'
        before_missing:
          type: string
          maxLength: 500
          description: Why the record has no values from before the run, such as one it created.
        after_missing:
          type: string
          maxLength: 500
          description: Why the record has no values after the run, such as one it deleted.
        truncated:
          type: boolean
          description: True when fields or values were shortened to fit.
        rows:
          type: array
          maxItems: 40
          description: Each value a data snapshot read, before and after, changed ones first.
          items:
            $ref: '#/components/schemas/RecordChangeFieldInput'
        series:
          $ref: '#/components/schemas/DataSnapshotSeriesInput'
        before_at:
          type: string
          maxLength: 40
          description: When the before was read, as ISO 8601.
        after_at:
          type: string
          maxLength: 40
          description: When the after was read, as ISO 8601.
    DataSnapshotSeriesInput:
      type: object
      required:
        - name
      description: A list in the read that pairs a label with a number, to chart before and after.
      properties:
        name:
          type: string
          maxLength: 100
        before:
          type: array
          maxItems: 120
          items:
            $ref: '#/components/schemas/DataSnapshotPoint'
        after:
          type: array
          maxItems: 120
          items:
            $ref: '#/components/schemas/DataSnapshotPoint'
    DataSnapshotPoint:
      type: object
      required:
