  /api/v202604/multiplayer/tasks/{id}/position:
    put:
      operationId: modifyMultiplayerTaskBoardPosition
      tags:
        - Cowork tasks
      x-fluid-audience: company
      summary: Place the company's work on the board
      description: 'Requires a user session with multiplayer_tasks.update or the existing application_themes.update permission. Stores where the work sits on the board: a canonical fractional index the client computed between the card''s new neighbours, so moving one card rewrites only that card, or null to take it out of the order. A key that is not canonical is refused, so the order can always be extended; a client whose next key would pass 255 characters rewrites the positions around it instead. The position is its own register, stamped by the client like a preview comment''s: the newer placement wins, an equal stamp goes to the incoming write, and an older one is discarded and answered with the current task. Placing work never changes its lock_version, so a status, priority, assignment, or run write made at the same moment still lands. Work in another company, deleted work, and an unknown id all answer the same not-found; work deleted after that read and before the write lands answers 410. A successful write announces a data-free invalidation on every theme this work''s linked discussions sit on.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              position_change:
                board_position: a0V
                board_position_at_ms: 1789000000000
            schema:
              type: object
              required:
                - position_change
              properties:
                position_change:
                  type: object
                  required:
                    - board_position
                    - board_position_at_ms
                  properties:
                    board_position:
                      type:
                        - string
                        - 'null'
                      pattern: ^[0-9A-Za-z]+$
                      maxLength: 255
                      description: The fractional index to store, or null to take the work out of the order.
                    board_position_at_ms:
                      type: integer
                      minimum: 1
                      maximum: 253402300799999
                      description: When the card was placed, in Unix milliseconds. The newer placement wins. A stamp ahead of the server's clock is stored as the server's time, so a client clock running fast cannot hold the card still.
      responses:
        '200':
          description: The task at its new position, or as it is when a newer placement is already stored.
          content:
            application/json:
