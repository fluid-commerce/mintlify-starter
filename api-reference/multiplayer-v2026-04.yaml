  /api/v202604/multiplayer/tasks/{id}/start-requests:
    post:
      operationId: createMultiplayerTaskStartRequest
      tags:
        - Mist runs
      x-fluid-audience: company
      summary: Save an authenticated Start in Mist instruction
      description: 'Requires a user session, company admin status, and multiplayer_tasks.execute or application_themes.update. The caller must name the task version it saw. The task must be open or kept, or needs_info for a desktop request or one with a reply; saving the request leaves its assignee as it is, and the run claim on acceptance gives unassigned work to the requester. The request remains pending while Desktop is closed. A cloud request (`runner: cloud`) instead queues a box Rails starts for it, and `runner: auto` lets Rails choose between the two. A ticket an agency is building, whose open agency request is `accepted` or `done_proposed`, is refused with 422 (`details.type` `agency_building`) until the agency''s work is accepted or the request closes; a ticket at `requested` or `quoted` is not blocked. Its UUID is a reference, not a credential; a plain task URL never authorizes execution. An exact retry by the same requester and client id returns the original request without refreshing its task version or scope. A publish request (`action: publish`) puts the work the requester''s saved cloud box keeps onto the theme or Mist app that work ran on, which Rails names; it needs application_themes.update for a theme, or mist.code for a Mist app, and work in review, and its run returns the work to review, or to needs_info when it could not publish. A publish of Mist app work saves target `mist_app` and fills `requested_target_mist_id` with the app, which its run pushes to. A We-Bots bot calls this with its owner''s own login and names itself in `X-Fluid-Bot-Id`; a work request then records the bot in `requested_by_bot` (and the bot run it came from, whose conversation is told the cloud run''s result and wakes the bot there). The header is attribution only: the owner is the requester and accepts the Start, on Mist Desktop or through the cloud runner, as for any Start.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Task UUID in the authenticated company.
          schema:
            type: string
            format: uuid
        - name: X-Fluid-Bot-Id
          in: header
          required: false
          description: The We-Bots bot making this call with its owner's login; attribution only.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            example:
              start_request:
                client_id: f70203a2-7712-4713-acf8-d4d0b8ad09af
                expected_version: 2
                reply: 20% off, ending October 31
                runner: cloud
            schema:
              type: object
              required:
                - start_request
              properties:
                start_request:
                  type: object
                  required:
                    - client_id
                    - expected_version
                  properties:
                    client_id:
                      type: string
                      format: uuid
                      description: UUID allocated by the browser before the click is sent; reuse it only for an exact retry.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: Version of the task displayed when Start was clicked.
                    target_theme_id:
                      type: integer
                      minimum: 1
                      description: Optional company theme chosen in the browser. Desktop chooses one if absent. Not allowed with the company_api target.
                    target:
                      type: string
                      enum:
                        - theme
                        - company_api
                      default: theme
                      description: 'What Mist runs the work against. `theme` edits a local company theme. `company_api` asks Mist Desktop to make a requested business change through its own API tool, under the requester''s current permissions; it names no theme and is refused for work from a preview discussion. A request never names a Mist app; the run that works on one says so when it claims the Start (`target_mist_id`). Only a publish of Mist app work is saved for its app, by Rails. Usually left out: Mist Desktop reads the work and accepts it on the theme it needs, or on none, which makes it company_api.'
                    runner:
                      type: string
                      enum:
                        - desktop
                        - cloud
                        - auto
                      default: desktop
                      description: 'Where Mist runs the work. `desktop` is the requester''s Mist Desktop. `cloud` is a box Rails starts and runs as the requester; it takes company_api or theme work, but not work from a preview discussion, needs the company''s COWORK and MIST_CLOUD_RUNS flags, and only that box''s run can accept it. `auto` asks Rails to choose when it saves the request: `cloud` when the company has both flags on and the work is not from a preview discussion, `desktop` otherwise, and `desktop` for needs_info work without a reply, which only Mist Desktop picks up. The saved request names the runner Rails chose, never `auto`, and an exact retry returns it.'
                    action:
                      type: string
                      enum:
                        - work
                        - publish
                      default: work
                      description: What the run does. `work` does the task. `publish` puts the work the requester's saved cloud box keeps onto the theme or Mist app it ran on, as Mist Desktop's Publish does for a theme, merging edits made on that theme meanwhile; it runs in the cloud (runner defaults to cloud), names no theme or app, and starts from work in review.
                    reply:
                      type: string
                      minLength: 1
                      maxLength: 10000
                      description: The person's reply to what Mist's last run asked or said, for the next run to read with its brief. Work with a reply may also start from needs_info, where a run that needed something from the person left it, as may a desktop request, whose Mist can ask the person itself. Only a cloud request carries one; a publish takes none.
      responses:
        '200':
          description: Exact idempotent replay of an earlier Start instruction.
          content:
            application/json:
              example:
                task:
                  id: 01a1d0e3-978f-7199-970d-00739dea4495
                  agency: null
                  agency_join_request: null
                  agency_request: null
                  assignee:
                    id: '433400890'
                    name: Admin Acme
                    kind: user
                  assigner:
                    id: '433400890'
                    name: Admin Acme
                    kind: user
                  board_position: a0
                  board_position_at_ms: null
                  category: null
                  client_id: e6ba3421-865c-4ce0-ba44-e383b72b22c2
                  company_id: 96778814
