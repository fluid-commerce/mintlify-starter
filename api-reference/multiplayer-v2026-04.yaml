      properties:
        id:
          type: string
          format: uuid
        discussion_id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        client_id:
          type: string
        created_work_item:
          type: boolean
          description: Whether this link created the work rather than pointing at work that existed.
        source_from_id:
          type: string
          format: uuid
        source_through_id:
          type: string
          format: uuid
        linked_by:
          $ref: '#/components/schemas/Person'
        created_at:
          type: string
          format: date-time
    DiscussionTaskLinkSaved:
