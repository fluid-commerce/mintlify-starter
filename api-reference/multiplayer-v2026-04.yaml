        - items_count
        - items
      properties:
        order_number:
          type:
            - string
            - 'null'
          maxLength: 128
        status:
          type:
            - string
            - 'null'
          maxLength: 128
        financial_status:
          type:
            - string
            - 'null'
          maxLength: 128
        fulfillment_status:
          type:
            - string
            - 'null'
          maxLength: 128
        created_at:
          type:
            - string
            - 'null'
          maxLength: 128
        customer_name:
          type:
            - string
            - 'null'
          maxLength: 128
        amount:
          type:
            - string
            - 'null'
          maxLength: 128
        currency_code:
          type:
            - string
            - 'null'
