        discussion:
          $ref: '#/components/schemas/Discussion'
        message:
          $ref: '#/components/schemas/DiscussionMessage'
        status:
          type: integer
          enum:
            - 200
            - 201
        meta:
          $ref: '#/components/schemas/Meta'
    DiscussionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
