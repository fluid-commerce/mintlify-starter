      x-fluid-audience: company
      summary: Send the company's work to an agency
      description: 'Requires a company-admin user session with multiplayer_tasks.execute (the permission that starts Mist work) and the company''s COWORK feature flag; a company without it answers 404. Planning permission alone is not enough, and neither is application_themes.update. The agency is named by its key. The send is one write: any request still open to another agency is withdrawn, the agency gets a `sent` request recording who sent it, and the task''s `agency` is set, so the version and history move once. The agency''s queue then shows the ticket and no other agency''s does. `client_id` is the identity the client allocates for this send. Repeating a send whose request is still open to that agency answers 200 with the ticket as it is, whatever version the client observed. A client id already used for a different agency, or for a send that no longer stands, is a 409. Work already sent to the agency also answers 200 and keeps its pick-up. Work that Mist holds (status `handed`) is refused with 422 until the run ends. An unknown or discarded agency key is 404. Work in another company, deleted work, and an unknown id answer the same not-found; work deleted after that read answers 410. A successful send announces a data-free invalidation on every theme this work''s linked discussions sit on. A send also cancels the ticket''s pending ask for an agency Fluid does not have yet (POST /tasks/{id}/agency-join-requests), in the same write, so a customer who sends to an agency that exists no longer waits for one that doesn''t. A company whose platform charges are paid from credits and whose spendable balance is spent is refused with 402 (`details.type` credits_exhausted) and nothing is written; a repeat of a send already made still answers 200. A company not on credits is never refused for its balance.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
