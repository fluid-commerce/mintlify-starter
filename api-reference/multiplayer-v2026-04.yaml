              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                status:
                  type: string
                  enum:
                    - open
                    - kept
                    - needs_info
                    - in_progress
                    - handed
                    - review
                    - skipped
    AgencyMembership:
      type: object
      description: An agency the caller belongs to.
      required:
        - agency
      properties:
        agency:
          $ref: '#/components/schemas/Agency'
    AgencyTask:
      description: 'A ticket as an agency''s member reads it: the task API''s ticket plus the company it belongs to, who in the agency has picked it up, and the agency''s sent request for it. The customer''s linked threads and Mist''s plan stay with the company: `source_threads` is always empty, and `run_thread_id` and `plan` are always null. A pick-up or release sends the request''s `version` back as `expected_version`, so a change made since is refused.'
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          required:
            - company
            - pickup
          properties:
            company:
              type: object
              description: The company the ticket belongs to.
              required:
                - id
                - name
              properties:
                id:
                  type: integer
                name:
                  type: string
            pickup:
              description: The agency's acceptance of the ticket, or null while no member has picked it up.
              anyOf:
                - $ref: '#/components/schemas/AgencyPickup'
                - type: 'null'
        - type: object
          required:
            - request
          properties:
            request:
              description: 'The agency''s sent request for the ticket, or null if it left the agency after the queue was read: withdrawn, or declined by the agency in the response to its own decline.'
              anyOf:
                - type: object
                  required:
                    - state
                    - sent_at
                    - own_due_at
                    - resolve_due_at
                    - resolve_breached_at
                    - resolve_paused_at
                    - version
                    - stage
                    - quote
                    - revised_quote
                    - changes_round
                    - delivery_overdue
                    - last_step
                    - access
                    - you_have_access
                  properties:
                    access:
                      type: array
                      description: The reader's own entry among the people the customer gave access to their store from this ticket, with the role they hold, or an empty list when the reader was given none (an admin they hold of their own is not an entry). It never names another person or the role they hold.
                      maxItems: 1
                      items:
                        $ref: '#/components/schemas/AgencyAccessEntry'
                    you_have_access:
                      type: boolean
                      description: 'Whether the reader can get into the customer''s store: they were given access from this ticket, or hold an admin of their own there. It stays accurate when `access` is empty.'
                    state:
                      type: string
                      enum:
                        - sent
                    sent_at:
                      type: string
                      format: date-time
                    own_due_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: 'When a member should pick the ticket up: the send time plus the agency''s pick-up time for the ticket''s priority, fixed at the send. Null when the agency had no pick-up time for that priority.'
                    resolve_due_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: 'When the agency should propose the work done: the customer''s acceptance of the quote plus the agency''s resolve time for the ticket''s priority, moved later by every pause. Null until the quote is accepted, and when the agency had no resolve time for that priority. While `resolve_paused_at` is set the date is not final: it moves by the length of the pause when the pause ends.'
                    resolve_breached_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: When the resolve deadline was found missed, set once by the sweep that runs every five minutes. Null while the deadline is met or has no clock.
                    resolve_paused_at:
                      type:
                        - string
                        - 'null'
                      format: date-time
                      description: When the resolve clock was paused, or null while it runs or has not started. The clock is paused while the ticket is in Needs info and while the agency waits for the customer's answer to a done proposal.
                    version:
                      type: integer
                      description: The request's `lock_version`, sent back as `expected_version` by every step.
                    stage:
                      type: string
                      enum:
                        - requested
                        - quoted
                        - accepted
                        - done_proposed
                      description: 'Where the work stands: `requested` waits for a quote, `quoted` for the customer''s answer, `accepted` is being built, and `done_proposed` waits for the customer to accept the work.'
                    quote:
                      description: The current quote, or null while `requested`.
                      anyOf:
                        - $ref: '#/components/schemas/AgencyRequestQuote'
                        - type: 'null'
                    revised_quote:
                      description: The quote the agency revised while building, waiting for the customer's answer, or null when none waits. A second revision replaces it.
                      anyOf:
                        - $ref: '#/components/schemas/AgencyRequestQuote'
                        - type: 'null'
                    changes_round:
                      type: integer
                      minimum: 0
                      description: How many times the customer has asked for changes on the request.
                    delivery_overdue:
                      type: boolean
                      description: True while the request is `accepted` and the current quote's `deliver_on` is before today in UTC. A sweep notes the first time with a `delivery_missed` step.
                    last_step:
                      description: The latest step on the request, or null for a request nobody has stepped on.
                      anyOf:
                        - $ref: '#/components/schemas/AgencyRequestStep'
                        - type: 'null'
                - type: 'null'
    AgencyTaskConflictError:
      description: A ticket moved on since the member read it; the current ticket is included.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      const: conflict
                    task:
                      $ref: '#/components/schemas/AgencyTask'
    AgencyTaskInvalidError:
      description: A step the request's stage does not allow (`details.type` is `invalid`), with the ticket as it is. A field that fails answers 422 with `details` naming the field instead.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  properties:
                    type:
                      const: invalid
                    task:
                      $ref: '#/components/schemas/AgencyTask'
    AgencyTaskNotPickedUpError:
      description: A quote on a ticket nobody has picked up (`details.type` is `not_picked_up`), with the ticket as it is.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  properties:
                    type:
                      const: not_picked_up
                    task:
                      $ref: '#/components/schemas/AgencyTask'
    AgencyRequestQuote:
      type: object
      description: 'An agency''s quote. It is an estimate: no price, credits or money. A later quote replaces the current one, and the earlier stays in the request''s record.'
      required:
        - hours
        - deliver_on
        - note
        - quoted_at
        - quoted_by
      properties:
        hours:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          description: The estimate in hours, with at most two decimals.
        deliver_on:
          type: string
          format: date
          description: The day the agency commits to.
        note:
          type:
            - string
            - 'null'
        quoted_at:
          type: string
          format: date-time
        quoted_by:
          description: The member who quoted; null once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/AgencyPerson'
            - type: 'null'
    AgencyRequestStep:
      type: object
      description: The latest step on a request, with the note or reason it came with.
      required:
        - kind
        - at
        - by
        - note
      properties:
        kind:
          type: string
          description: One of `sent`, `quoted`, `declined`, `quote_accepted`, `quote_declined`, `done_proposed`, `work_accepted`, `work_refused`, `withdrawn`, `quote_revised`, `revision_accepted`, `revision_declined`, `reopened`, `done_reminded`, `quote_reminded` or `delivery_missed`. A client treats a kind it does not know as a step it cannot name.
        at:
          type: string
          format: date-time
        by:
          description: Who took the step, a member of the agency or a person at the customer; null once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/AgencyPerson'
            - type: 'null'
        note:
          type:
            - string
            - 'null'
          description: The quote or done note, or the reason a step gave.
    AgencyTimeEntry:
      type: object
      description: 'Time an agency member spent on a ticket sent to the agency. Private to the agency: no customer surface carries it. An entry logged by start and end, or by a timer, has `started_at` and `ended_at`; a timer entry is `running` from `started_at` until `ended_at`. An entry logged by a bare duration (deprecated) has neither.'
      required:
        - id
        - user
        - logged_by
        - spent_on
        - duration_seconds
        - started_at
        - ended_at
        - running
        - note
        - editable
        - lock_version
      properties:
        id:
          type: string
          format: uuid
        user:
          description: Who worked; null once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        logged_by:
          description: Who entered the entry; null once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        spent_on:
          type: string
          format: date
          description: The day the time was spent on.
        duration_seconds:
          type: integer
          minimum: 0
          description: Whole seconds. A running entry holds 0 until it stops.
        started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the work or the timer started; null for time logged by a bare duration.
        ended_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the work ended or the timer stopped; null while it runs and for time logged by a bare duration.
        running:
          type: boolean
        note:
          type:
            - string
            - 'null'
        editable:
          type: boolean
          description: Whether the caller may change or delete it; only the worker may.
        lock_version:
          type: integer
          minimum: 0
          description: Send as `expected_version` when changing the entry.
    AgencyTimeEntryWithTask:
      description: A time entry with the ticket it was spent on.
      allOf:
        - $ref: '#/components/schemas/AgencyTimeEntry'
        - type: object
          required:
            - task
          properties:
            task:
              type: object
              required:
                - id
                - title
                - company
                - in_queue
                - request_state
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                company:
                  type: object
                  required:
                    - id
                    - name
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                in_queue:
                  type: boolean
                  description: Whether the agency's queue still holds the ticket. False once it is withdrawn, deleted or its company turns Cowork off; the entry stays.
                request_state:
                  type: string
                  enum:
                    - sent
                    - withdrawn
                    - declined
                    - done
                  description: 'Where the ticket''s request to the agency stands: `sent` while it is open, `done` once the customer accepted the work, `declined` once the agency declined it, `withdrawn` once the customer took it back.'
    AgencyTimeEntryConflictError:
      description: The entry changed since the member read it; the current entry is included.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                    - time_entry
                  properties:
                    type:
                      const: conflict
                    time_entry:
                      $ref: '#/components/schemas/AgencyTimeEntry'
    AgencyTimerRunningError:
      description: The caller already runs a timer; the running entry and its ticket are included when the timer runs for this agency.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      const: timer_running
                    time_entry:
                      $ref: '#/components/schemas/AgencyTimeEntryWithTask'
    AgencyPickup:
      type: object
      description: A member's acceptance of a ticket. It stays when the owner is released, with a null owner, and returns with the ticket if it leaves the queue and comes back.
      required:
        - owner
        - picked_up_at
        - picked_up_by
      properties:
        owner:
          description: The member who owns the ticket now, or null once released or once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        picked_up_at:
          type: string
          format: date-time
        picked_up_by:
          description: The member who first accepted the ticket; null once that user is erased.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
    AgencyPerson:
      type: object
      description: A member of an agency, as another member chooses whom to hand a ticket to. It carries no email.
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
          description: The user id as a string.
        name:
          type: string
          description: The member's name, or `Unnamed person` when they have none. It never falls back to their email address.
        kind:
          type: string
          enum:
            - user
