                $ref: '#/components/schemas/Error'
  /api/v202604/multiplayer/discussions/{discussion_id}/answers:
    parameters:
      - name: discussion_id
        in: path
        required: true
        description: The discussion UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: publishMultiplayerDiscussionAnswer
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Publish a client's answer to a person's question
      description: Requires multiplayer_discussions.reply, the MIST_SHARED_CHAT company flag and the chat's creator. A first-party client such as Mist Desktop publishes the answer it wrote to the person's question named by reply_to_client_id, under the claim its answering attempt (holder) took. Retrying the same result_id with the same body returns the saved message with 200; a different body, or a different reply_to_client_id, returns 409. When the person who asked the question has written a newer message, the question already has an answer, or another attempt holds the discussion's claim, nothing is saved and the response says why. A teammate's newer message does not stop the answer.
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              answer:
                producer: mist_desktop
                holder: desktop-turn-1
                result_id: a-1
                reply_to_client_id: desktop-teammate-q
                body: Themes are Liquid templates.
            schema:
              type: object
              required:
                - answer
              properties:
                answer:
                  type: object
                  required:
                    - producer
                    - holder
                    - result_id
                    - reply_to_client_id
                    - body
                  properties:
                    producer:
                      type: string
                      enum:
                        - mist_desktop
                      description: What produced the answer.
                    holder:
                      $ref: '#/components/schemas/AnswerClaimHolder'
                    result_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The client's identity for the answer, unique within the producer.
                    reply_to_client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The client_id of the caller's message this answers.
                    body:
                      type: string
                      minLength: 1
                      maxLength: 32768
                      description: The answer text. At most 32,768 bytes of UTF-8, which is fewer characters when the text is not ASCII; a longer body is refused with 422.
      responses:
        '200':
          description: An identical retry, returning the saved message; or, with nothing saved, superseded with the reason newer_message (the person who asked has written again) or answered_elsewhere (the question has an answer, or another attempt holds the claim).
          content:
            application/json:
              example:
                message:
                  id: 01a1d0e3-60cd-74c7-95a6-c38d0f3d240b
                  admin_page: null
                  author: null
                  body: Themes are Liquid templates.
                  client_id: null
                  created_at: '2026-11-12T17:52:04Z'
                  discussion_id: 01a1d0e3-605f-7592-ba2a-28de447e771a
                  format: text
                  page_results: []
                  producer: mist_desktop
                  resource_results: []
                  result_id: a-1
                  role: assistant
                  round_limit_reached: false
                  sequence: 2
                status: 200
                meta:
                  request_uuid: null
                  timestamp: '2026-11-12T17:52:04Z'
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DiscussionMessageAdded'
                  - $ref: '#/components/schemas/DiscussionAnswerSuperseded'
        '201':
          description: The answer was published.
          content:
            application/json:
              example:
                message:
                  id: 01a1d0e3-603c-7abb-befa-dd2c8ec7bdb3
                  admin_page: null
                  author: null
                  body: Themes are Liquid templates.
                  client_id: null
                  created_at: '2026-11-12T17:52:04Z'
                  discussion_id: 01a1d0e3-5fac-708b-863a-6dd4a308f803
                  format: text
                  page_results: []
                  producer: mist_desktop
                  resource_results: []
                  result_id: a-1
                  role: assistant
                  round_limit_reached: false
                  sequence: 3
                status: 201
                meta:
                  request_uuid: null
                  timestamp: '2026-11-12T17:52:04Z'
              schema:
                $ref: '#/components/schemas/DiscussionMessageAdded'
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, multiplayer_discussions.reply and the chat's creator are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The discussion is not this company's or not readable by the caller, or the COWORK or MIST_SHARED_CHAT flag is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The result_id already published a different answer, or an answer to a different question.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The answer is invalid, names an unknown producer, or replies to no message of the caller's. Nothing is saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v202604/multiplayer/discussions/{discussion_id}/steps:
    parameters:
      - name: discussion_id
        in: path
        required: true
        description: The discussion UUID.
        schema:
          type: string
          format: uuid
    post:
      operationId: saveMultiplayerDiscussionSteps
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Save the tool steps a client ran for a person's question
      description: 'Requires multiplayer_discussions.reply, the MIST_SHARED_CHAT and MIST_WORK_RECORD company flags and the chat''s creator. A first-party client such as Mist Desktop saves up to 50 steps of one attempt at answering the question named by question_client_id, beside the conversation and never in a message body. Steps are saved whether or not the attempt published an answer, and for a question the person took back. A step is identified by the discussion, the producer, the attempt''s result_id and the step''s tool_call_id: saving an identity that already exists keeps the first content and ignores the new body. Responds 201 when at least one step was newly saved and 200 when every step already was, with the saved steps in position order. Inputs are at most 65,536 bytes and inline outputs at most 16,384 bytes; output object paths are not accepted yet.'
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              attempt:
                producer: mist_desktop
                holder: desktop-turn-1
                result_id: a-1
                question_client_id: steps-chat-q
                occurred_at: '2026-10-15T01:12:09Z'
              steps:
                - tool_call_id: call-1
                  position: 0
                  tool_name: fluid_api
                  status: completed
                  output_rule: full
                  input:
                    method: GET
                    path: /api/orders
                  output: Changed
                  output_bytes: 2
                - tool_call_id: call-2
                  position: 1
                  tool_name: fluid_api
                  status: completed
                  output_rule: full
                  input: {}
                  output: '[]'
                  output_bytes: 2
            schema:
              type: object
              required:
                - attempt
                - steps
              properties:
                attempt:
                  type: object
                  required:
                    - producer
                    - holder
                    - result_id
                    - question_client_id
                    - occurred_at
                  properties:
                    producer:
                      type: string
                      enum:
                        - mist_desktop
                      description: What ran the attempt.
                    holder:
                      $ref: '#/components/schemas/AnswerClaimHolder'
                    result_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The client's identity for the attempt's answer, unique within the producer.
                    question_client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The client_id of the caller's message the attempt worked on.
                    occurred_at:
                      type: string
                      format: date-time
                      description: When the attempt's message was written.
                steps:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: The attempt's steps, in order.
                  items:
                    type: object
                    required:
                      - tool_call_id
                      - position
                      - tool_name
                      - status
                      - output_rule
                      - input
                    properties:
                      tool_call_id:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: The tool call's id, unique within the attempt.
                      position:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
                        description: The step's order within the attempt, from 0.
                      tool_name:
                        type: string
                        minLength: 1
                        maxLength: 128
                      status:
                        type: string
                        enum:
                          - completed
                          - error
                          - not_run
                      output_rule:
                        type: string
                        enum:
                          - full
                          - input_only
                        description: Whether the tool's output is sent (full) or only its input (input_only, which carries no output).
                      input:
                        type: object
                        additionalProperties: true
                        description: The tool's input. At most 65,536 bytes as JSON.
                      output:
                        type:
                          - string
                          - 'null'
                        maxLength: 16384
                        description: The tool's output. At most 16,384 bytes of UTF-8; null for an input_only step.
                      output_bytes:
                        type:
                          - integer
                          - 'null'
                        minimum: 0
                        maximum: 2147483647
                        description: The size of the whole output before any cut.
                      output_object_path:
                        type:
                          - string
