            - string
            - 'null'
          maxLength: 128
        status:
          type:
            - string
            - 'null'
          maxLength: 128
        active:
          type:
            - boolean
            - 'null'
        price:
          type:
            - string
            - 'null'
          maxLength: 128
        currency_code:
          type:
            - string
            - 'null'
          maxLength: 128
        in_stock:
          type:
            - boolean
            - 'null'
        image_url:
          type:
            - string
            - 'null'
