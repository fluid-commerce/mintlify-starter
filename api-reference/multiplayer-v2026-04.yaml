  /api/v202604/multiplayer/discussions/capability:
    get:
      operationId: getMultiplayerDiscussionCapability
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Whether Mist Desktop saves chats here
      description: 'Requires multiplayer_discussions.view. Reports whether Mist Desktop saves the chats this person starts as discussions and publishes its answers to them: true only when the company has the MIST_SHARED_CHAT company flag on and the person holds both multiplayer_discussions.create (to start a chat) and multiplayer_discussions.reply (to add to it and publish answers). Without the flag, or without either grant, it reports false. work_record reports whether steps are saved too: true only when shared_chat is true and the company has the MIST_WORK_RECORD flag on. The response is private and never cached.'
      security:
        - bearer_auth: []
      responses:
        '200':
          description: The company's shared chat capability.
          content:
            application/json:
              example:
                shared_chat:
                  enabled: false
                work_record:
                  enabled: false
                status: 200
                meta:
                  request_uuid: null
                  timestamp: '2026-11-12T17:50:36Z'
              schema:
                type: object
                required:
                  - shared_chat
                  - work_record
                  - status
                  - meta
                properties:
                  shared_chat:
                    type: object
                    required:
                      - enabled
                    properties:
                      enabled:
                        type: boolean
                        description: True when Mist Desktop shares this company's chats, so they can be read and continued on the web.
                  work_record:
                    type: object
                    required:
                      - enabled
                    properties:
                      enabled:
                        type: boolean
                        description: 'True when Mist Desktop also saves the tool steps it ran for each question, beside the chat: shared_chat is enabled and the company has the MIST_WORK_RECORD flag on. While false, the steps endpoint answers 404.'
                  status:
                    const: 200
                  meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, and multiplayer_discussions.view are required.
        '404':
          description: The COWORK feature flag is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
