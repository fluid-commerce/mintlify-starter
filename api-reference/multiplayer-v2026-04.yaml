  /api/v202604/multiplayer/discussions/{discussion_id}/answer-claim:
    parameters:
      - name: discussion_id
        in: path
        required: true
        description: The discussion UUID.
        schema:
          type: string
          format: uuid
    put:
      operationId: claimMultiplayerDiscussionQuestion
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Claim the question a client is answering
      description: Requires multiplayer_discussions.reply, the MIST_SHARED_CHAT company flag and the chat's creator. Claims a person's message for one answering attempt (holder), so no other runtime answers it, or renews the attempt's claim. The message must be the newest by its author; a teammate's later message does not stop the claim. The chat holds one claim, and an answered claim gives way to a claim on a later question. A question that already has an answer is not claimed again. A client's claim expires two minutes after it is taken or renewed unless the attempt publishes under it.
      security:
        - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              answer_claim:
                holder: desktop-turn-1
                producer: mist_desktop
                through_client_id: teammate-claim-q
            schema:
              type: object
              required:
                - answer_claim
              properties:
                answer_claim:
                  type: object
                  required:
                    - holder
                    - producer
                    - through_client_id
                  properties:
                    holder:
                      $ref: '#/components/schemas/AnswerClaimHolder'
                    producer:
                      type: string
                      enum:
                        - mist_desktop
                      description: What the attempt will publish as.
                    through_client_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The client_id of the caller's message, the question being answered; it must be the caller's newest.
      responses:
        '200':
          $ref: '#/components/responses/DiscussionAnswerClaimed'
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, multiplayer_discussions.reply and the chat's creator are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The discussion is not this company's or not readable by the caller, or the COWORK or MIST_SHARED_CHAT flag is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another answering attempt holds the chat's claim, or the question already has an answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The question's author has written a newer message, or the claim is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: releaseMultiplayerDiscussionQuestion
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Release a client's claim
      description: Requires multiplayer_discussions.reply, the MIST_SHARED_CHAT company flag and the chat's creator. Gives up the attempt's claim when it has not published an answer under it, so another runtime can answer. Releasing a claim the attempt does not hold changes nothing.
      security:
        - bearer_auth: []
      parameters:
        - name: holder
          in: query
          required: true
          description: The answering attempt giving up its claim.
          schema:
            $ref: '#/components/schemas/AnswerClaimHolder'
      responses:
        '200':
          $ref: '#/components/responses/DiscussionAnswerClaimed'
        '401':
          description: Authentication is required.
        '403':
          description: A user session, company admin status, multiplayer_discussions.reply and the chat's creator are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The discussion is not this company's or not readable by the caller, or the COWORK or MIST_SHARED_CHAT flag is off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The holder is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v202604/multiplayer/discussions/{discussion_id}/task-links:
    post:
      operationId: createMultiplayerDiscussionTaskLink
      tags:
        - Discussions
      x-fluid-audience: company
      summary: Turn a discussion's saved messages into work
      description: Requires multiplayer_discussions.reply. With a title, creates new work from the saved message range and links it in one transaction; that also requires multiplayer_tasks.create or application_themes.update. With a task_id, links existing work without changing it; that also requires multiplayer_tasks.view or application_themes.view. The work's description is the range's messages in order. Retrying the same client_id returns the saved link with 200; a retry that changes the work, title or range returns 409. A conversation that retained source permissions creates the work with a fixed description instead of its messages; the link stays visible only to readers who hold those permissions. An authorized exact retry of a task created before restriction returns the saved work without copying text again. Linking existing work does not copy message text and still requires the conversation's source permissions.
      security:
        - bearer_auth: []
      parameters:
        - name: discussion_id
          in: path
          required: true
          description: The discussion UUID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              link:
                client_id: existing
                source_from_id: 01a1d0e2-aa90-73b8-8df0-8c625246fb31
                source_through_id: 01a1d0e2-aa90-73b8-8df0-8c625246fb31
                task_id: 01a1d0e2-aa96-79cd-91ea-998ebeab734e
            schema:
              type: object
              required:
                - link
              properties:
                link:
                  type: object
                  required:
                    - client_id
                    - source_from_id
                    - source_through_id
                  properties:
                    client_id:
                      type: string
                      minLength: 1
                      maxLength: 247
                      pattern: ^[A-Za-z0-9_-]+$
                      description: Client-generated link identity, unique for its author within the discussion. New work gets the client id cowork_ followed by a UUID derived from the discussion, the author and this identity.
                    source_from_id:
                      type: string
                      format: uuid
                      description: The first saved message of the range.
                    source_through_id:
                      type: string
                      format: uuid
                      description: The last saved message of the range, not before source_from_id.
                    task_id:
                      type: string
                      format: uuid
                      description: Existing work to link. Omit to create work.
                    title:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: Title of new work. Required when task_id is omitted, refused with it.
      responses:
        '200':
          description: An identical retry; the saved link and its work are returned and nothing new is written.
          content:
            application/json:
              example:
                task_link:
                  id: 01a1d0e2-a9bc-79df-8cec-b5c126383bf8
                  client_id: link-1
                  created_at: '2026-11-12T17:51:17Z'
                  created_work_item: true
