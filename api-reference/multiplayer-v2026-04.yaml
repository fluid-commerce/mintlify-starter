openapi: 3.1.0
info:
  title: Fluid Cowork API v2026-04
  version: v2026-04
  description: |
    Cowork is the company's shared board of work: tickets that people file,
    plan, assign and finish, that Mist can work on, and that a company can send
    to an agency to do for it. The Mist task board and Cowork in the Fluid admin
    are built on this API, so everything they do is available through it.

    **Authentication.** Every endpoint needs a Bearer token for a person: a
    company admin's session, or the token of their company membership. A
    company API token is refused with `403`, because each write is recorded
    against the person who made it. The permissions each endpoint needs, such
    as `multiplayer_tasks.create` or `multiplayer_discussions.view`, are listed
    on the endpoint.

    **Feature flags.** Discussions, preview threads and everything to do with
    agencies also need the company's `COWORK` flag. A company without it gets
    `404` from those endpoints.

    **Versions.** A task carries a `lock_version`. Writes to an existing task
    take the `lock_version` you last read as `expected_version`, and answer
    `409` with the current task when it has changed since, so retry against
    that one.

    **Agencies.** A company sends a task to an agency with an agency request.
    The agency's members then work it through the Agency work and Agency time
    endpoints, which need a person who belongs to that agency.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.fluid.app
tags:
  - name: Cowork tasks
    description: The company's work, one task per ticket. Create, read, change and delete tasks, and read the board that draws them.
    x-fluid-section: Cowork
  - name: Task channels and attachments
    description: A task's comment channel, its images and files, and the discussions it is linked to.
    x-fluid-section: Cowork
  - name: Task assessments
    description: Mist's check of a task before work starts, the answers to its questions, and what to do when it finds a duplicate.
    x-fluid-section: Cowork
  - name: Mist runs
    description: Starting Mist on a task, Mist claiming and finishing the work, and asking Mist to review finished work.
    x-fluid-section: Cowork
  - name: Agency requests
    description: Sending a task to an agency, and the company's answers to the agency's quotes and finished work.
    x-fluid-section: Cowork
  - name: Discussions
    description: The company's chats with Mist, their messages, and the work they lead to.
    x-fluid-section: Cowork
  - name: Preview threads
    description: The theme preview comments that stand in for work on the board.
    x-fluid-section: Cowork
  - name: Agency work
    description: For an agency's members, the tickets customers sent the agency, and picking them up, quoting, declining and finishing them.
    x-fluid-section: Cowork
  - name: Agency time
    description: For an agency's members, the time they log on tickets and the timer that records it.
    x-fluid-section: Cowork
