  /api/v202604/multiplayer/tasks/{id}/run/finish-result:
    post:
      operationId: finishMultiplayerTaskRunResult
      tags:
        - Mist runs
      x-fluid-audience: company
      summary: Save a standalone Start result and finish its run atomically
      description: 'Requires a user session with multiplayer_tasks.execute or application_themes.update. The result must be present; a reply is refused. The run must be owned by an accepted Start request without a live discussion. The plain result and the transition commit together: to review, or to needs_info when run.unfinished is true, which then also returns the work to whoever handed it over. An exact retry returns the saved result only when it repeats the original body, proof, and optional expected_version. The distinct route lets clients fail closed on a server that does not yet support required result storage. A deleted, other-company, or unknown task answers not-found; deletion after the task was read answers gone.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              run:
                run_id: evidence-run
              result:
                body: Added the size guide link
                evidence:
                  - kind: screenshot
                    label: Home page
                    route: /
                    before:
                      asset_id: 1050970312
                      width: 1408
                      height: 1168
                    after:
                      asset_id: 1050970312
                      width: 1408
                      height: 1168
                  - kind: screenshot
                    label: /products/hoodie
                    route: /products/hoodie
                    before:
                      missing: Mist named this page when it finished.
                    after:
                      asset_id: 1050970312
                      width: 1408
                      height: 1168
            schema:
              type: object
              required:
                - run
                - result
              properties:
                run:
                  type: object
                  required:
                    - run_id
                  properties:
                    run_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: The identity of the run that is answering.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: Optional observed task version for a backstop finish.
                    unfinished:
                      type: boolean
                      description: The backstop's mark for a run that ended without saving a result of its own. The result then says why, and the work moves to needs_info instead of review.
                result:
                  type: object
                  required:
                    - body
                  description: Plain result saved on the accepted Start request.
                  properties:
                    body:
                      type: string
                      minLength: 1
                      maxLength: 32768
                      description: Result text, limited to 32 KiB of UTF-8.
                    proof:
                      type:
                        - string
                        - 'null'
                      maxLength: 32768
                      description: Optional evidence or links, limited to 32 KiB of UTF-8.
                    development_theme_id:
                      type: integer
                      minimum: 1
                      description: A cloud run's development theme, which its work is on. It is recorded only for the cloud run that answered and only when it is a development theme of the company made since that run began while no other cloud run of the company was running; it then previews only through the result's preview_url. Any other theme is left unrecorded, and the result is saved either way.
                    handoff:
                      type: string
                      enum:
                        - desktop
                      description: Marks work that only Mist Desktop does, for a cloud run that stopped on finding it. Cowork then offers to open the task there. Only an unfinished run may send it; otherwise the request is refused with 422 and nothing is saved.
                    evidence:
                      type: array
                      maxItems: 20
                      description: 'What a reviewer compares beside the text: pages before and after the run, and the files it wrote. Each image must be a screenshot this company uploaded after the run was accepted; any other asset is 422. A retry keeps the evidence saved first.'
                      items:
                        $ref: '#/components/schemas/ResultEvidenceInput'
      responses:
        '200':
          description: The task in review with its result saved on the accepted Start request.
          content:
            application/json:
              example:
                task:
                  id: 9271f7b9-237c-5dbe-ab78-f866652d747a
