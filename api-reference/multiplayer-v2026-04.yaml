      summary: Accept the agency's quote
      description: 'Requires a company-admin user session with multiplayer_tasks.execute and the company''s COWORK feature flag, as sending work to an agency does; planning permission alone is not enough. The answer writes the agency request and one event and does not change the task''s status, owner or version. It is posted to the task''s channel when it has one. With `access`, the customer gives agency people access to their store in the same step, as `POST /agency-request/access` does: the acceptance and the grant commit together, and a grant that is refused refuses the acceptance, leaving the request `quoted`. Giving access also needs `users.update`, and a role whose permissions the caller holds; a refusal answers 403 with `details.type` `access_not_allowed`. Accepts a quote that waits for an answer (`quoted`): the stage becomes `accepted` and the agency can start. Any other stage answers 422. It is allowed while Mist holds the task (`handed`).'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agency_request
              properties:
                agency_request:
                  type: object
                  required:
