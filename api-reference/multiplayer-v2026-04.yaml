  /api/v202604/multiplayer/tasks:
    get:
      operationId: listMultiplayerTasks
      tags:
        - Cowork tasks
      x-fluid-audience: company
      summary: List the company's work
      description: Requires a user session with multiplayer_tasks.view or application_themes.view. Returns undeleted company work, most recently updated first or in board order, with stable cursor pagination.
      security:
        - bearer_auth: []
      parameters:
        - name: sort
          in: query
          description: '`updated` (the default) returns the most recently updated work first. `board` returns work in the order boards draw a column: unplaced work first, then by `board_position` compared byte by byte, ties by id. `due` returns work by due date, earliest first, then work with no due date, ties by id.'
          schema:
            type: string
            enum:
              - updated
              - board
              - due
        - name: page[cursor]
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: page[limit]
          in: query
          description: Maximum records to return, defaulting to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: filter[status]
          in: query
          description: Comma-separated statuses to keep, for example `open,needs_info`.
          schema:
            type: string
            maxLength: 200
            pattern: ^(open|kept|needs_info|in_progress|handed|review|skipped)( *, *(open|kept|needs_info|in_progress|handed|review|skipped))*$
        - name: filter[exclude_status]
          in: query
          description: Comma-separated statuses to leave out, so a board can read the work whose status it has no column for. Refused together with `filter[status]`.
          schema:
            type: string
            maxLength: 200
            pattern: ^(open|kept|needs_info|in_progress|handed|review|skipped)( *, *(open|kept|needs_info|in_progress|handed|review|skipped))*$
        - name: filter[priority]
          in: query
          description: Comma-separated priorities to keep, for example `urgent,high`. `none` keeps work with no priority. Values within the filter match any of them; the filter narrows with the other filters.
          schema:
            type: string
            maxLength: 200
            pattern: ^(urgent|high|medium|low|none)( *, *(urgent|high|medium|low|none))*$
        - name: filter[kind]
          in: query
          description: Comma-separated kinds to keep, for example `bug,change`. `none` keeps work with no kind. Values within the filter match any of them; the filter narrows with the other filters, and with `filter[category]` work must match both.
          schema:
            type: string
            maxLength: 200
            pattern: ^(bug|change|feature|design|support|none)( *, *(bug|change|feature|design|support|none))*$
        - name: filter[category]
          in: query
          description: 'Comma-separated categories to keep, for example `design,support`: `design` keeps design work, `support` keeps support work and `eng` keeps bugs, changes and features. `none` keeps work with no kind, which belongs to no category. Values within the filter match any of them; the filter narrows with the other filters, and with `filter[kind]` work must match both.'
          schema:
            type: string
            maxLength: 200
            pattern: ^(design|support|eng|none)( *, *(design|support|eng|none))*$
        - name: filter[assignee]
          in: query
          description: Keep work assigned to nobody (`unassigned`, which includes work whose assigned user was deleted and so has no assignee), to Mist (`agent`), or to the person with this user id.
          schema:
            type: string
            maxLength: 20
            pattern: ^(unassigned|agent|[1-9][0-9]{0,18})$
        - name: filter[tag]
          in: query
          deprecated: true
          description: The retired `fluid_studios` tag, kept for older clients. No work carries it, so this keeps nothing. Use `filter[agency]` instead. Any other value answers 422.
          schema:
            type: string
            enum:
              - fluid_studios
        - name: filter[without_tag]
          in: query
          deprecated: true
          description: The retired `fluid_studios` tag, kept for older clients. No work carries it, so this leaves the list as it is. Any other value answers 422.
          schema:
            type: string
            enum:
              - fluid_studios
        - name: filter[agency]
          in: query
          description: Keep work sent to the agency with this key, `any` for work sent to an agency, or `none` for work sent to no agency. A key that names no agency keeps nothing. The filter narrows what the caller may already read and grants no access of its own.
          schema:
            type: string
            maxLength: 64
            pattern: ^[a-z0-9_]+$
          examples:
            agency:
              summary: Work sent to one agency
              value: example_agency
            any:
              summary: Work sent to an agency
              value: any
            none:
              summary: Work sent to no agency
              value: none
        - name: filter[title]
          in: query
          description: Keep work whose title contains this text, ignoring case. `%` and `_` match themselves.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: filter[due_from]
          in: query
          description: Keep work due on or after this date, an inclusive calendar date the client computes in its own time zone. Work with no due date are not kept. May be combined with `filter[due_to]`; refused with `filter[due]`, and when it is after `filter[due_to]`.
          schema:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        - name: filter[due_to]
          in: query
          description: Keep work due on or before this date, an inclusive calendar date the client computes in its own time zone. Work with no due date are not kept. May be combined with `filter[due_from]`; refused with `filter[due]`.
          schema:
            type: string
            format: date
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        - name: filter[due]
          in: query
          description: '`none` keeps work with no due date. Refused with `filter[due_from]` or `filter[due_to]`.'
          schema:
            type: string
            enum:
              - none
      responses:
        '200':
          description: A page of company work.
          content:
            application/json:
              example:
                tasks:
                  - id: 01a1d0e3-d906-7ee2-98f2-91e8419fd03d
                    agency: null
                    agency_join_request: null
                    agency_request: null
                    assignee: null
                    assigner: null
                    board_position: Zz
                    board_position_at_ms: null
                    category: null
                    client_id: late
