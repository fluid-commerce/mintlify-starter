          type: integer
          enum:
            - 200
            - 201
        meta:
          $ref: '#/components/schemas/Meta'
    StartRequest:
      type: object
      description: Browser Start intent and the one Desktop run it authorized, if any. It is not a task or run state machine.
      required:
        - id
        - client_id
        - expected_version
        - requester_id
        - requested_target_theme_id
        - requested_target_mist_id
        - accepted_run_id
        - accepted_by_id
        - accepted_target_theme_id
        - accepted_target_mist_id
        - accepted_at
        - acceptable
        - result
        - target
        - runner
        - action
        - reply
        - cloud_run
        - requested_by_bot
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        expected_version:
          type: integer
          minimum: 0
        requester_id:
          type: integer
        requested_target_theme_id:
          type:
            - integer
            - 'null'
        requested_target_mist_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Mist app a publish of Mist app work names (target mist_app); null for work, which names its app only when claimed, and for a theme publish.
        accepted_run_id:
          type:
            - string
            - 'null'
        accepted_by_id:
          type:
            - integer
            - 'null'
        accepted_target_theme_id:
          type:
            - integer
            - 'null'
          description: The theme a theme request ran on; always null for a company_api or mist_app request.
        accepted_target_mist_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Mist app a mist_app request ran on; null for every other target.
        target:
          type: string
          enum:
            - theme
            - mist_app
            - company_api
          description: What Mist runs the work against. A theme request accepted on no theme reads company_api from then on; one accepted on a Mist app reads mist_app.
        runner:
          type: string
          enum:
            - desktop
            - cloud
          description: Where Mist runs the work, the requester's Mist Desktop or a cloud box.
        action:
          type: string
          enum:
            - work
            - publish
          description: What the run does, the task's work or a publish of the requester's cloud theme or Mist app work.
        reply:
          type:
            - string
            - 'null'
          description: The person's reply to what Mist's last run asked or said, for this run to read; null without one.
        cloud_run:
          description: The cloud box's run once Rails has started launching it, or a failed run with no box when the launch was refused or waited too long; null for a desktop request and for a cloud request still waiting for a box.
          anyOf:
            - $ref: '#/components/schemas/StartRequestCloudRun'
            - type: 'null'
        requested_by_bot:
          description: The bot that asked for this Start with the requester's own login, named in the X-Fluid-Bot-Id header and recorded for attribution only, so Cowork can say "<bot>, for <requester>". The requester still accepts it like any Start. Null for a person's own Start.
          anyOf:
            - $ref: '#/components/schemas/StartRequestBot'
            - type: 'null'
        accepted_at:
          type:
            - string
            - 'null'
          format: date-time
        acceptable:
          type: boolean
          description: Current display hint. The server rechecks before accepting.
        result:
          description: Result of this accepted standalone run, or null before completion and for preview replies.
          anyOf:
            - $ref: '#/components/schemas/StartRequestResult'
            - type: 'null'
    StartRequestBot:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    StartRequestCloudRun:
      type: object
      required:
