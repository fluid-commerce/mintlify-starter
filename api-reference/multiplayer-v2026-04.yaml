                    source_threads: []
                    status: open
                    status_editable: true
                    tags: []
                    title: late
                    updated_at: '2026-11-12T17:52:35Z'
                  - id: 01a1d0e3-d903-7b38-aa4e-e8f3795335e1
                    agency: null
                    agency_join_request: null
                    agency_request: null
                    assignee: null
