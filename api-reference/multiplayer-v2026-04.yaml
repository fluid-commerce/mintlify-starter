                  agency:
                    key: example_agency
                    name: Example agency
                  assignee: null
                  assigner: null
                  source_threads: []
                  created_at: '2026-10-16T20:50:00Z'
                  updated_at: '2026-10-16T20:58:32Z'
                status: 200
