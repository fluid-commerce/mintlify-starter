  /api/v202604/multiplayer/discussions:
    get:
      operationId: listMultiplayerDiscussions
      tags:
        - Discussions
      x-fluid-audience: company
      summary: List the company's shared discussions
      description: Requires a user session with multiplayer_discussions.view. Returns the company's discussions, newest first, with stable cursor pagination, and the work they led to for callers who may read work. With include_messages, each discussion also brings its first page of messages; a discussion whose message_count exceeds the messages listed has more to read from its messages endpoint. Source-bound conversations are listed only while the original source exists and the caller can read it. source_kind and source_id together narrow the page to one original task or preview thread. Conversations that used preview context also require current theme read access, even after a thread is unlinked. Retained product/order source permissions are checked for every reader before pagination, including opening messages and titles.
      security:
        - bearer_auth: []
      parameters:
        - name: page[cursor]
          in: query
          description: Opaque cursor returned by the previous page.
          schema:
            type: string
            maxLength: 4096
        - name: page[limit]
          in: query
          description: Maximum records to return, defaulting to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: include_messages
          in: query
          description: When true, the response includes messages, the first 25 messages of each listed discussion within 1 MiB of message bodies. Defaults to false.
          schema:
            type: boolean
        - name: source_kind
          in: query
          description: Original work kind; supply with source_id.
          schema:
            type: string
            enum:
              - task
              - preview_thread
        - name: source_id
          in: query
          description: Original task UUID or preview root row ID; supply with source_kind.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: A page of the company's discussions.
          content:
            application/json:
              example:
                discussions:
                  - id: 00e4d19e-1655-5076-a2bb-5fc72b33393b
