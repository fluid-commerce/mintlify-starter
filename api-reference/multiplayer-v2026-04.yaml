  /api/v202604/multiplayer/tasks/{id}/run:
    post:
      operationId: createMultiplayerTaskRun
      tags:
        - Mist runs
      x-fluid-audience: company
      summary: Send the company's work to a run
      description: 'Requires a user session with multiplayer_tasks.execute or the existing application_themes.update permission. Claims open or kept work for one run identity the client allocated before dispatch. Answers 200 and not 201 because the same identity and version arriving again is the same claim rather than a second one; a different identity, a stale version, or work that already spent this one is refused with the current task. The run also decides where its answer will go: name a discussion with thread_id, or omit it and work with exactly one discussion answers that one. Work with several discussions and no named one is refused, because nothing here can pick for the sender. Work in another company, deleted work, and an unknown id all answer the same not-found; work deleted after that read and before the claim lands answers 410. Work assigned to nobody goes to the sender with the claim, when they are an active admin who could be assigned it and may assign work: multiplayer_tasks.update, its application_themes.update fallback, or root admin. A sender who may only execute, or could not be assigned it, leaves it unassigned. Work assigned to someone stays with them, since Mist runs it for them and is never its owner. A successful claim announces a data-free invalidation on every theme this work''s linked discussions sit on.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            example:
              run:
                run_id: claim-0002
                expected_version: 0
                thread_id: 809222460
            schema:
              type: object
              required:
                - run
              properties:
                run:
                  type: object
                  required:
                    - run_id
                    - expected_version
                  properties:
                    run_id:
                      type: string
                      minLength: 1
                      maxLength: 255
                      pattern: ^[A-Za-z0-9_-]+$
                      description: Identity the runtime allocated before dispatch. Replaying it against the same version is the same claim.
                    expected_version:
                      type: integer
                      minimum: 0
                      description: The task version the client observed. A mismatch is a conflict.
                    thread_id:
                      type: integer
                      minimum: 1
                      description: Row id of the discussion this run should answer, from this task's own source_threads. Omit it when the work has one discussion or none; required when it has several.
      responses:
