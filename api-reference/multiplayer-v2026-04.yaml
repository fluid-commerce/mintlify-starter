    StandaloneRunResult:
      type: object
      required:
        - run_id
        - action
        - body
        - proof
        - evidence
        - target_theme_id
        - target_mist_id
        - preview_url
        - publishable
        - publish_stopped
        - handoff
        - finished_at
      properties:
        run_id:
          type: string
        action:
          type: string
          enum:
            - work
            - publish
          description: Whether this is the result of the task's work or of a publish of it.
        body:
          type: string
        proof:
          type:
            - string
            - 'null'
        evidence:
          type: array
          description: Pages before and after the run, the files it wrote and the records it changed through the API; empty when it gathered none.
          items:
            $ref: '#/components/schemas/ResultEvidence'
        target_theme_id:
          type:
            - integer
            - 'null'
          description: The theme the run worked on; null for company API work and for work on a Mist app.
        target_mist_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The Mist app the run worked on; null for every other target.
        preview_url:
          type:
            - string
            - 'null'
          format: uri
          description: For a cloud run's theme work, a storefront link that previews the development theme its work is on, signed so that theme opens only through such a link; each read signs a fresh one, valid for 7 days. Null for a reader without application_themes.view, and otherwise.
        publishable:
          type: boolean
          description: 'Whether the reader may publish this work now: it is their cloud work on a theme or a Mist app, they may edit themes (or use mist.code for a Mist app), cloud runs can start for the company, its saved box is still there, and no run is using the box.'
        publish_stopped:
          type: boolean
          description: True when this is work whose publish was cancelled after Mist took it, so part of it may already be live.
        handoff:
          type:
            - string
            - 'null'
          enum:
            - desktop
            - null
          description: '"desktop" when the run stopped because the work is only Mist Desktop''s, so Cowork can offer to open the task there; null otherwise, and for every run of Mist Desktop.'
        finished_at:
          type: string
          format: date-time
    Task:
      type: object
      required:
        - id
        - client_id
        - company_id
        - creator_id
        - title
        - description
        - status
        - priority
        - board_position
        - due_on
        - kind
        - category
        - plan
        - board_position_at_ms
        - lock_version
        - run_id
        - run_thread_id
        - tags
        - agency
        - assignee
        - assigner
        - source_threads
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        company_id:
          type: integer
        creator_id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - open
            - kept
            - needs_info
            - in_progress
            - handed
            - review
            - skipped
        priority:
          type:
            - string
            - 'null'
          enum:
            - urgent
            - high
            - medium
            - low
            - null
          description: How urgent the work is, or null when nobody has judged it.
        due_on:
          type:
            - string
            - 'null'
          format: date
          description: 'The calendar day the work is due, as YYYY-MM-DD, or null when no date has been set. A day and not an instant: it carries no time zone and reads as the same day for everyone.'
        kind:
          type:
            - string
            - 'null'
          enum:
            - bug
            - change
            - feature
            - design
            - support
            - null
          description: What kind of work this is, as Mist classified the request Cowork made it from, or null when nobody has. change is an edit to content, data or settings that is neither a fault nor something new.
        category:
          type:
            - string
            - 'null'
          enum:
            - design
            - support
            - eng
            - null
          description: 'The department the work''s kind belongs to: design, support, or eng for bugs, changes and features. Derived from kind and never written, so it is null exactly when kind is.'
        plan:
          type:
            - array
            - 'null'
          minItems: 2
          maxItems: 8
          description: 'The steps Mist planned for the work when Cowork made it from a chat, in order, or null when there is no plan: work with a single step has none. A proposal of how the work goes; nothing in it has been approved or done.'
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - outcome
            properties:
              title:
                type: string
                maxLength: 120
              outcome:
                type: string
                maxLength: 300
                description: What the step looks like done.
        board_position:
          type:
            - string
            - 'null'
          pattern: ^[0-9A-Za-z]+$
          maxLength: 255
          description: 'Where the work sits on the board, as a canonical fractional index in base-62 digits (the fractional-indexing format: the first character gives the integer part''s length and the fraction never ends in 0) that sorts as a plain string. One order for the whole board, which each column draws its cards in; equal positions are ordered by id. Null until someone places it; a board draws unplaced work newest first.'
        board_position_at_ms:
          type:
            - integer
            - 'null'
          description: 'When the board position was last written, in Unix milliseconds. The position is its own register: a client folding two readings of the same work keeps the position with the newer stamp, whatever their lock_version, since placing work never changes it. Null until someone places the work.'
        lock_version:
          type: integer
          minimum: 0
        run_id:
          type:
            - string
            - 'null'
          description: The owning runtime identity, when work has a recorded run.
        run_thread_id:
          type:
            - integer
            - 'null'
          description: 'Row id of the discussion the current run will answer, chosen from this task''s own source_threads when the run was claimed and released with it. Never anything else, and not reconciled afterwards: a destination unlinked or deleted while the run is out keeps its id here and stops being listed in source_threads. That run then finishes without a reply, and one arriving with a reply is refused for having no discussion to answer.'
        tags:
          type: array
          uniqueItems: true
          description: Tag keys on the work, each at most once. No key is supported, so this is empty; work is sent to an agency through `agency`. (`fluid_studios` once marked work waiting for Fluid Studios.) Clients show a key they do not know as unsupported rather than dropping it.
          items:
            type: string
        agency:
          description: The agency the work is sent to, or null when it is sent to none. Set by sending it (POST /tasks/{id}/agency-requests) and cleared by withdrawing it. An agency that has since been discarded is still named.
          anyOf:
            - $ref: '#/components/schemas/Agency'
            - type: 'null'
        assignee:
          description: Who owns the work now, or null for nobody.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        assigner:
          description: Who handed the work over, kept after it comes back, or null.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        source_threads:
          type: array
          description: 'The preview discussions this work came from, oldest first. A summary only: enough to draw a card and open the thread, never what was said.'
          items:
            $ref: '#/components/schemas/SourceThread'
        mist_confidence:
          $ref: '#/components/schemas/MistConfidence'
        source:
          description: 'Where the work came from when an outside work tool sent it, such as a Linear issue someone labelled Cowork, else null for work made in Fluid. Present on every full card while Cowork''s Linear connector is released for the company: the task list, a task, the answers to task writes, duplicate merges, dismissals and splits, and agency asks, and the board. The key is left out, not null, on the brief cards of refusals and run flows, and for a company without the connector. Read only: Fluid never writes back to the outside tool.'
          anyOf:
            - $ref: '#/components/schemas/TaskSource'
            - type: 'null'
        attachment_count:
          type: integer
          minimum: 0
          description: How many images and files the work holds. Present on the cards of the task list, a task, task writes, Mist's answers and assessments, and the board while the company has Cowork and ticket attachments are released for it; left out otherwise.
        agency_request:
          description: 'Where the work stands with its agency: the open request, else the latest request when it closed as declined or done, else null. Present on the task list, a single task, and the writes the task routes themselves answer (creating and changing a task, and sending, withdrawing and answering its agency request), including the task in a 409 or 422. The key is left out, not null, on other responses that carry a task: assessments and their answers, discussion decisions, task links and reviews, the board, and the agency''s own read; read the task to see it. It names the agency and carries no agency member, owner, pick-up or time. A client sends its `version` as `expected_version` when it answers a quote or finished work.'
          anyOf:
            - $ref: '#/components/schemas/TaskAgencyRequest'
            - type: 'null'
        agency_join_request:
          description: 'Where the work stands with an ask for an agency Fluid does not have yet (POST /tasks/{id}/agency-join-requests): the pending request, else the latest one Fluid declined while the work has no agency and no newer request, else null. An approved request is not shown (the work''s `agency` says it), and neither is a cancelled one. Present wherever `agency_request` is, and left out, not null, wherever that is. It names the agency asked for, the state and the decline reason, and never the contact email, the note or who decided. A client sends its `lock_version` as `expected_version` when it cancels the request.'
          anyOf:
            - $ref: '#/components/schemas/TaskAgencyJoinRequest'
            - type: 'null'
        merged_into:
          description: 'The ticket this one was merged into, or null for a ticket that is not merged (features/cowork, Phase 026). A merged ticket is `skipped`, frozen and has nothing to do but Split (POST /tasks/{id}/split). A deleted target is drawn with `deleted: true`, so the ticket can still be split. Present wherever `mist_confidence` is, and left out, not null, wherever that is.'
          anyOf:
            - $ref: '#/components/schemas/MergedInto'
            - type: 'null'
        merged_from:
          type: array
          description: The tickets merged into this one, oldest merge first; empty when nothing was merged in. A merged ticket that was deleted is left out. Present wherever `mist_confidence` is, and left out wherever that is.
          items:
            $ref: '#/components/schemas/MergedFrom'
        conversation_id:
          type:
            - integer
            - 'null'
          description: The id of the ticket's messaging channel, the conversation in the company where the customer talks about the ticket, or null before the ticket's first send to an agency. A switch to another agency keeps it. Present only for a company with the COWORK feature flag on, and then wherever `agency_request` is; left out, not null, otherwise. Whether the reader may open the channel is up to Messaging.
        status_editable:
          type: boolean
          description: 'Whether the viewer may move this task''s status now: the status rules hold (not sent to an agency; assigned to nobody or to the viewer; in a company without Cowork, always), Mist is not running it, and the viewer holds multiplayer_tasks.update or application_themes.update. Per viewer, so a client does not derive it. Present on the cards of the task list, a single task and the writes the task routes answer, wherever `agency_request` is, and left out, not false, wherever that is and for a caller that is not a user session. The status route still decides: this is a hint for the control, not the check.'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MergedInto:
      type: object
      description: The ticket another ticket was merged into.
      required:
        - id
        - title
        - deleted
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        deleted:
          type: boolean
          description: Whether the target was deleted since. A merged ticket can still be split then.
    MergedFrom:
      type: object
      description: A ticket merged into the one that carries this list.
      required:
        - id
        - title
        - merged_at
        - version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        merged_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: The merged ticket's `lock_version`, for a client's own cache. Split takes no version.
    TaskAgencyJoinRequest:
      type: object
      description: A task's ask for an agency Fluid does not have yet, as the customer reads it. `state` is `pending` while Fluid has not answered and `declined` once it has said no, with the reason in `decline_reason`.
      required:
        - id
        - state
        - agency_name
        - decline_reason
        - requested_at
        - lock_version
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - pending
            - declined
        agency_name:
          type: string
          description: The name of the agency the customer asked for.
        decline_reason:
          type:
            - string
            - 'null'
          description: Why Fluid declined, or null while the request is pending.
        requested_at:
          type: string
          format: date-time
        lock_version:
          type: integer
          minimum: 0
          description: The request's version, sent back as `expected_version` when it is cancelled.
    AgencyJoinRequestConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      enum:
                        - already_pending
                        - already_decided
                        - conflict
                        - merged
                    task:
                      $ref: '#/components/schemas/Task'
    AgencyAccessGrantInput:
      type: object
      description: The agency people to give access to the company's store, and the role they hold.
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: integer
          description: The ids of kept members of the request's agency.
        role_id:
          type: integer
          description: One of the company's roles that people can hold. When omitted, the company's role named Developer is used, and the call is refused (422 `role_required`) if it has none.
    AgencyAccessEntry:
      type: object
      description: An agency person given access to a company's store from a ticket, and their role. The customer's read lists them for a reader who may manage access; an agency member's read carries only their own.
      required:
        - person
        - role
      properties:
        person:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              description: The user id as a string.
            name:
              type: string
              description: The person's name, or `Unnamed person`. It never falls back to their email.
        role:
          description: The role the person's admin holds, or null for an admin with no role.
          anyOf:
            - type: object
              required:
                - id
                - name
              properties:
                id:
                  type: integer
                name:
                  type: string
            - type: 'null'
    TaskSource:
      type: object
      description: The outside issue a ticket was imported from.
      required:
        - provider
        - identifier
        - url
      properties:
        provider:
          type: string
          enum:
            - linear
          description: The outside work tool.
        identifier:
          type: string
          description: The issue's identifier in that tool, such as ACM-482.
        url:
          type: string
          description: Link to the issue in that tool.
      additionalProperties: false
    TaskAgencyRequest:
      type: object
      description: A task's request to its agency as the customer reads it. `state` is `sent` while the request is open, `done` once the customer accepted the work and `declined` once the agency declined it. `stage` says where open work stands, and a closed request keeps the stage it closed from.
      required:
        - agency
        - state
        - stage
        - version
        - sent_at
        - quote
        - revised_quote
        - changes_round
        - reopenable_until
        - delivery_overdue
        - last_step
        - owner
        - access
        - owner_has_access
      properties:
        agency:
          $ref: '#/components/schemas/Agency'
        owner:
          description: The agency member who picked the ticket up, who is the person to give access to by default. It is the only agency person the customer's read names apart from those given access. Null while nobody has picked it up, when the member's account is gone, and once the request is not open.
          anyOf:
            - type: object
              required:
                - id
                - name
              properties:
                id:
                  type: string
                  description: The user id as a string.
                name:
                  type: string
                  description: The member's name, or `Unnamed person`. It never falls back to their email.
            - type: 'null'
        access:
          type: array
          description: The agency people the customer gave access to their store from this ticket, each with the role they hold, ordered by name. Shown only to a reader who may manage that access (`users.update`, as `POST /agency-request/access` asks); any other reader gets an empty list, however many people were given access. Empty once the request is not open.
          items:
            $ref: '#/components/schemas/AgencyAccessEntry'
        owner_has_access:
          type: boolean
          description: 'Whether the agency member who picked the ticket up can get into the store: they were given access here, or hold an admin of their own. False while nobody has picked it up, and once the request is not open. Every reader sees it, whether or not they may manage access.'
        state:
          type: string
          enum:
            - sent
            - declined
            - done
        stage:
          type: string
          enum:
            - requested
            - quoted
            - accepted
            - done_proposed
          description: '`requested` waits for the agency''s quote, `quoted` for the customer''s answer, `accepted` is being built, and `done_proposed` waits for the customer to accept the work.'
        version:
          type: integer
          minimum: 0
          description: The request's version, sent back as `expected_version` by the answers.
        sent_at:
          type: string
          format: date-time
        quote:
          description: The current quote, or null while no quote stands.
          anyOf:
            - type: object
              required:
                - hours
                - deliver_on
                - note
                - quoted_at
              properties:
                hours:
                  type: number
                  description: The agency's estimate in hours. It is not a price.
                deliver_on:
                  type: string
                  format: date
                note:
                  type:
                    - string
                    - 'null'
                quoted_at:
                  type: string
                  format: date-time
            - type: 'null'
        revised_quote:
          description: The quote the agency revised while building, waiting for the customer's answer (accept-revision or decline-revision), or null when none waits.
          anyOf:
            - type: object
              required:
                - hours
                - deliver_on
                - note
                - quoted_at
              properties:
                hours:
                  type: number
                  description: The agency's estimate in hours. It is not a price.
                deliver_on:
                  type: string
                  format: date
                note:
                  type:
                    - string
                    - 'null'
                quoted_at:
                  type: string
                  format: date-time
            - type: 'null'
        changes_round:
          type: integer
          minimum: 0
          description: How many times the customer has asked this agency for changes on the request.
        reopenable_until:
          type:
            - string
            - 'null'
          format: date-time
          description: Until when finished work (`state` `done`) may be reopened, 14 days after it was accepted. Null for any other request and once the time has passed.
        delivery_overdue:
          type: boolean
          description: True while the agency is still building (`stage` `accepted`) after the delivery date of the current quote, which is before today in UTC. False for any other request.
        last_step:
          description: The latest step on the request, or null for a request nobody has stepped on.
          anyOf:
            - type: object
              required:
                - kind
                - at
                - note
              properties:
                kind:
                  type: string
                  description: One of `sent`, `quoted`, `declined`, `quote_accepted`, `quote_declined`, `done_proposed`, `work_accepted`, `work_refused`, `withdrawn`, `quote_revised`, `revision_accepted`, `revision_declined`, `reopened`, `done_reminded`, `quote_reminded` or `delivery_missed`. A client treats a kind it does not know as a step it cannot name.
                at:
                  type: string
                  format: date-time
                note:
                  type:
                    - string
                    - 'null'
                  description: The quote or done note, or the reason a step gave.
            - type: 'null'
    MistConfidence:
      type: object
      description: 'Mist''s confidence that it could do the work as written, scored from the task''s title, request, kind and plan before work starts. Present on the task list, a task, a write that answers with the task, and the board; absent where a task is embedded elsewhere. It only informs: no status, assignment, run or Start reads it. The state is derived from saved assessments and the task''s current content, never from a queue.'
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - current
            - failed
            - out_of_date
            - assessing
            - not_assessed
          description: 'current: a score read the task''s current content. failed: the newest attempt at the current content saved no score. out_of_date: the newest score read content the task no longer has, and a new one is on its way. assessing: no score yet, and one is on its way. A score is on its way only for work that has not started and was written to in the last 35 minutes. not_assessed: nothing is on its way: Cowork is off, work has started, or the task has not been written to since before assessment existed. The newest score, if any, comes with it.'
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: The newest score, from 1 to 5. Absent until one exists.
        band:
          type: string
          enum:
            - red
            - yellow
            - green
          description: The color the score reads as, decided by the server from the score alone, 1-2 red, 3 yellow, 4-5 green.
        summary:
          type: string
          maxLength: 280
          description: Why the work earns the score, in at most two short sentences.
        concerns:
          type: array
          maxItems: 3
          description: What holds the score back. A score below 5 has at least one.
          items:
            type: string
            maxLength: 200
        raise_by:
          type: array
          maxItems: 3
          description: What the person could add or decide that would raise the score.
          items:
            type: string
            maxLength: 200
        assessed_at:
          type: string
          format: date-time
          description: When the newest score was saved.
        failure:
          type: string
          enum:
            - budget
            - provider
            - invalid_reply
          description: 'Why the newest attempt at the current content saved no score: the company''s Mist budget refused it, the model call failed, or the reply did not meet the contract. Present only in the failed state.'
        assessment_id:
          type: string
          format: uuid
          description: The read the newest score came from. Answers to its questions name it. Present whenever score is.
        suggested_kind:
          type: string
          enum:
            - bug
            - change
            - feature
            - design
            - support
          description: 'The kind of work Mist reads the task as. It never sets the task''s kind; a person takes it with an ordinary kind update. This and the other triage fields come together, and only for a read that carries a triage: reads from before triage have none of them.'
        category:
          type: string
          enum:
            - design
            - support
            - eng
          description: The department the suggested kind belongs to, derived from it - design, support, or eng for bugs, changes and features.
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
          description: How hard Mist rates the work.
        hours_low:
          type: integer
          minimum: 1
          maximum: 160
          description: The low end of the whole hours a skilled person would take. Hours, never money.
        hours_high:
          type: integer
          minimum: 1
          maximum: 160
          description: The high end of the hours range, no less than hours_low.
        questions:
          type: array
          maxItems: 3
          description: What Mist needs to know from the task's creator, only when the read found something missing; empty for a read of 4 or 5. Answers go to answerMultiplayerTaskAssessment.
          items:
            $ref: '#/components/schemas/MistQuestion'
        duplicate_of:
          $ref: '#/components/schemas/MistDuplicate'
    MistDuplicate:
      type: object
      description: 'An older open ticket of the same company that Mist read this one as a repeat of (features/cowork, Phase 026). Present only while the suggestion stands: the state is `current`, the work has not started, the read named the ticket, the company has Cowork on, the other ticket still exists and is not closed, and nobody has merged or dismissed the pair. The key is absent, not null, otherwise. A suggestion informs and never merges: POST .../assessments/{assessment_id}/merge and .../dismiss are the person''s.'
      required:
        - id
        - title
        - status
        - reason
        - merge_blocked
      properties:
        id:
          type: string
          format: uuid
          description: The older ticket.
        title:
          type: string
        status:
          type: string
          enum:
            - open
            - kept
            - needs_info
            - in_progress
            - handed
            - review
          description: The older ticket's status now.
        reason:
          type: string
          maxLength: 200
          description: One sentence of why Mist thinks the two repeat each other.
        merge_blocked:
          description: 'Why a merge into the older ticket would be refused now, or null. `agency`: it is sent to an agency. `running`: a Mist run holds it. `review`: it is in Review, whether or not a run put it there. `result`: it carries a run''s result. The link is shown either way.'
          anyOf:
            - type: string
              enum:
                - agency
                - running
                - review
                - result
            - type: 'null'
    MistQuestion:
      type: object
      description: One question Mist asked in a read, answerable in a sentence or by picking an option.
      required:
        - id
        - prompt
        - options
      properties:
        id:
          type: string
          enum:
            - q1
            - q2
            - q3
          description: The question's id within its read, in the order asked.
        prompt:
          type: string
          maxLength: 200
          description: The question.
        options:
          type: array
          maxItems: 4
          description: Likely answers to pick from; empty when the answer is free text.
          items:
            type: string
            maxLength: 80
    Agency:
      type: object
      description: An agency a customer can send work to, by the permanent key that names it in requests and the name people read. Agencies are records a root admin creates; no client names one in code.
      required:
        - key
        - name
      properties:
        key:
          type: string
          pattern: ^[a-z0-9_]+$
          description: The agency's permanent key.
        name:
          type: string
          description: The name to show.
      examples:
        - key: example_agency
          name: Example agency
    Person:
      type: object
      description: One person on a card. Mist is a person here, with a fixed id and no user row.
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
          description: The user id as a string, or `mist` for the agent.
        name:
          type:
            - string
            - 'null'
          description: The name the server attributed, falling back to the email address.
        kind:
          type: string
          enum:
            - user
            - agent
          description: Whether this is a person or the agent.
    SourceThread:
      type: object
      description: A preview discussion that contributes to a task, without its content.
      required:
        - id
        - theme_id
        - client_id
        - 'n'
        - page_url
        - author_name
      properties:
        id:
          type: integer
          description: The discussion's row id.
        theme_id:
          type: integer
          description: The theme the discussion is pinned on. Reading it needs the theme's own permission.
        client_id:
          type: string
          description: The client-generated id the preview clients address the discussion by.
        'n':
          type:
            - integer
            - 'null'
          description: Display number shown on the pin. A label rather than an identifier.
        page_url:
          type:
            - string
            - 'null'
          description: Normalized path of the page the discussion was pinned on.
        author_name:
          type:
            - string
            - 'null'
          description: Who pinned it, attributed by the server.
    Pagination:
      type: object
      required:
        - cursor
        - limit
        - prev_cursor
        - next_cursor
      properties:
        cursor:
          type:
            - string
            - 'null'
        limit:
          type: integer
        prev_cursor:
          type:
            - string
            - 'null'
        next_cursor:
          type:
            - string
            - 'null'
    Meta:
      type: object
      required:
        - request_uuid
        - timestamp
      properties:
        request_uuid:
          type:
            - string
            - 'null'
        timestamp:
          type: string
          format: date-time
    TaskAttachment:
      type: object
      additionalProperties: false
      required:
        - id
        - filename
        - content_type
        - byte_size
        - kind
        - source
        - url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
          description: The name the file was given, kept only as a label.
        content_type:
          type: string
          description: The type read from the file's bytes.
        byte_size:
          type: integer
          minimum: 1
          maximum: 26214400
        kind:
          type: string
          enum:
            - image
            - file
          description: image for PNG, JPEG, GIF and WebP, shown in place; file for everything else, downloaded.
        source:
          type: string
          enum:
            - board
            - linear
          description: board when someone attached it in Cowork; linear when it was copied from the Linear issue the ticket came from.
        url:
          type: string
          format: uri
          description: 'A link that reads the file for a short time: ten minutes for the ticket''s own company, one minute for an agency member, so a link issued before the customer withdraws the ticket stops soon after.'
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
        - status
        - meta
      properties:
        error:
          type: object
          required:
            - message
            - details
          properties:
            message:
              type: string
            details:
              type: object
        status:
          type: integer
        meta:
          $ref: '#/components/schemas/Meta'
    PermissionFilterError:
      description: A 403 body. The permission filter renders a bare error message when the caller lacks the grant; the operation's own refusals render the Error envelope.
      oneOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
            - error
          properties:
            error:
              type: string
          additionalProperties: false
    CreditsExhaustedError:
      description: 'A 402 body: the company''s platform charges are paid from credits and its spendable balance is spent. Buying credits at `recovery_path` lifts it.'
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                    - error
                    - category
                    - recovery_path
                  properties:
                    type:
                      const: credits_exhausted
                    error:
                      const: credits_exhausted
                    category:
                      const: platform
                      description: The funding category whose credits are spent.
                    recovery_path:
                      type: string
                      description: The admin page where the company buys credits.
                      example: /settings/billing
                    task:
                      $ref: '#/components/schemas/Task'
    ConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      enum:
                        - conflict
                        - merged
                      description: '`conflict`: the version sent is stale. `merged`: the ticket was merged into another (features/cowork, Phase 026), so it is closed and frozen until it is split, and `merged_into` names the other ticket. Only a merged ticket answers `merged`, and only on a write that would change it; moving its card and deleting it still work.'
                    merged_into:
                      type: object
                      required:
                        - id
                        - title
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                    task:
                      $ref: '#/components/schemas/Task'
    StatusNotYoursError:
      description: A status write by someone who does not work the ticket (Cowork Phase 025). The ticket is as the viewer reads it.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  required:
                    - type
                    - rule
                    - task
                  properties:
                    type:
                      const: status_not_yours
                    rule:
                      type: string
                      enum:
                        - sent_to_agency
                        - assigned_to_other
                      description: '`sent_to_agency`: the ticket has an open request, so the agency''s members move it and its creator accepts or refuses their work. `assigned_to_other`: the ticket is not sent and is assigned to someone else.'
                    task:
                      $ref: '#/components/schemas/Task'
    Discussion:
      type: object
      description: A company chat. It is private to its creator until they share it with the work it led to. It holds no task state.
      required:
        - id
        - client_id
        - company_id
        - title
        - source
        - creator
        - message_count
        - channel
        - shared_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
        company_id:
          type: integer
        title:
          type: string
        source:
          oneOf:
            - $ref: '#/components/schemas/DiscussionSource'
            - type: 'null'
        creator:
          $ref: '#/components/schemas/Person'
        message_count:
          type: integer
          minimum: 1
          description: How many messages the discussion has accepted.
        answer_claim:
          description: Which runtime is answering a person's newest question, while that stops another from answering it; null otherwise.
          anyOf:
            - $ref: '#/components/schemas/DiscussionAnswerClaim'
            - type: 'null'
        channel:
          description: The texting channel this chat collects messages from, or null for a chat held in Fluid. Messages arrive from outside the browser, so clients read such a chat again while it is open.
          anyOf:
            - $ref: '#/components/schemas/DiscussionChannel'
            - type: 'null'
        shared_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the creator shared the chat with its work. Null while it is private, readable only by its creator.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DiscussionChannel:
      type: object
      additionalProperties: false
      required:
        - kind
        - number_last4
      properties:
        kind:
          type: string
          enum:
            - sms
        number_last4:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{4}$
          description: The last four digits of the linked phone number, for the person who linked it. Null for anyone else reading a shared chat.
    DiscussionSource:
      type: object
      description: The original company record selected when this assistant conversation started.
      required:
        - kind
        - id
      properties:
        kind:
          type: string
          enum:
            - task
            - preview_thread
        id:
          type: string
          minLength: 1
          maxLength: 64
    DiscussionAdminPage:
      type: object
      description: The admin page open beside the chat when a person sent a message. It records where they were, as their client reported it; it is not evidence that the record exists or that a reader may see it. A request's other keys in this object are ignored, as in every nested object of these requests.
      required:
        - type
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9_-]+(/[a-z0-9_-]+)*$
          description: The page's admin section, such as products, orders or settings/payments.
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[A-Za-z0-9_-]+$
          description: The record the page shows, when it shows one; absent on a section page such as a list.
    DiscussionMessage:
      type: object
      description: One message, numbered in the order the discussion accepted it. A person's message is immutable.
      required:
        - id
        - discussion_id
        - sequence
        - role
        - client_id
        - author
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
        discussion_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 1
        role:
          type: string
          enum:
            - human
            - assistant
        client_id:
          type:
            - string
            - 'null'
          description: The client-generated identity of a person's message; null for an assistant message.
        author:
          description: The person who wrote the message, or null for an assistant message.
          anyOf:
            - $ref: '#/components/schemas/Person'
            - type: 'null'
        body:
          type: string
        admin_page:
          description: The admin page open beside the chat when a person sent this message; null when it was sent from none, and for every assistant message.
          anyOf:
            - $ref: '#/components/schemas/DiscussionAdminPage'
            - type: 'null'
        format:
          type: string
          enum:
            - text
          description: Present for server-produced conversational text and first-party client answers. Preserve its body without interpreting legacy answer headings; absent for older messages.
        producer:
          type: string
          enum:
            - mist_desktop
          description: Present only on an answer a first-party client published, naming the client that wrote it.
        result_id:
          type: string
          description: Present only on an answer a first-party client published; the client's own identity for that answer, so it can recognise the answer in a later read.
        resource_results:
          type: array
          maxItems: 20
          description: Product and order cards saved with a Mist answer, in displayed order, for the current reader; empty for other messages.
          items:
            $ref: '#/components/schemas/MistResourceResult'
        page_results:
          type: array
          maxItems: 10
          description: Storefront pages read or captured for a Mist answer, in the order they were read, for the current reader; empty for other messages.
          items:
            $ref: '#/components/schemas/MistPageResult'
        withdraws:
          type: object
          description: Present only on a person's message that took earlier messages back, in the shape the append request sends it. Those messages stay in the discussion; readers that rebuild the conversation skip them. Absent on every other message.
          required:
            - from_sequence
            - through_sequence
          properties:
            from_sequence:
              type: integer
              minimum: 1
              description: The sequence of the first message taken back.
            through_sequence:
              type: integer
              minimum: 1
              description: The sequence of the last message taken back, ends included.
        round_limit_reached:
          type: boolean
          description: True when a Mist answer was written by a round that could not call tools, because its run used its last model round or had no room for more tool results, so it may have left part of the question unanswered. A person can ask Mist to continue. False for every other message.
        created_at:
          type: string
          format: date-time
    MistPageResult:
      type: object
      description: A storefront page Cowork read or captured, projected from its saved read_page or capture_page receipt for a reader already allowed to see the run or conversation. Restored without fetching the page again. Unavailable, with no URL, title or picture, when the page's host is no longer this company's storefront.
      additionalProperties: false
      required:
        - receipt_id
        - request_id
        - tool_call_id
        - recorded_at
        - kind
        - state
        - url
        - final_url
        - observed_at
        - title
        - viewport
        - screenshot_url
      properties:
        receipt_id:
          type: string
          maxLength: 256
          description: Stable identity of the result within its saved read.
        request_id:
          type: string
          format: uuid
          description: The model attempt whose tool call read the page.
        tool_call_id:
          type: string
          maxLength: 128
          description: The tool call that read the page.
        recorded_at:
          type: string
          format: date-time
          description: When the read was saved.
        kind:
          type: string
          enum:
            - text
            - screenshot
          description: A text read of the page as served
          or a captured screenshot of its visible part.: null
        state:
          type: string
          enum:
            - available
            - unavailable
          description: Unavailable when the page's host is no longer this company's storefront.
        url:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: The https URL that was requested; null when unavailable.
        final_url:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: The URL read after redirects; null when unavailable.
        observed_at:
          type:
            - string
            - 'null'
          description: When the page was fetched or captured; null when unavailable.
        title:
          type:
            - string
            - 'null'
          maxLength: 300
          description: The page title from a text read; null for a screenshot.
        viewport:
          type:
            - object
            - 'null'
          description: The emulated viewport of a screenshot; null for a text read.
          additionalProperties: false
          properties:
            name:
              type: string
              enum:
                - mobile
                - desktop
            width:
              type:
                - integer
                - 'null'
            height:
              type:
                - integer
                - 'null'
        screenshot_url:
          type:
            - string
            - 'null'
          maxLength: 4096
          description: 'The saved screenshot: the ImageKit URL of its DAM image asset while the asset is kept, or, for a capture saved in the private bucket before DAM storage, a signed URL valid for about ten minutes. Null for a text read or when the screenshot is unavailable.'
    MistResourceResult:
      type: object
      description: A product or order card projected from a saved api_get answer for the current reader. Facts stay as observed; the reader's grant for the source kind and the record's presence in the company are checked when the card is read. Model prose never creates a card.
      additionalProperties: false
      required:
        - receipt_id
        - request_id
        - tool_call_id
        - recorded_at
        - source_kind
        - source_id
        - state
        - observation
        - admin_path
        - api_path
        - required_permissions
        - summary
      properties:
        receipt_id:
          type: string
          maxLength: 256
          description: Stable identity of the card within its saved read.
        request_id:
          type: string
          format: uuid
          description: The model attempt whose tool call made the read.
        tool_call_id:
          type: string
          maxLength: 128
          description: The tool call that made the read.
        recorded_at:
          type: string
          format: date-time
          description: When the read was saved.
        source_kind:
          type: string
          enum:
            - product
            - order
          description: The kind of record.
        source_id:
          type:
            - string
            - 'null'
          pattern: ^[1-9][0-9]{0,18}$
          description: The record id; null when the card is unavailable.
        state:
          type: string
          enum:
            - available
            - unavailable
          description: Unavailable when the record no longer exists in this company.
        observation:
          type: string
          enum:
            - list
            - detail
          description: Whether the card came from a list read or a detail read.
        admin_path:
          type:
            - string
            - 'null'
          pattern: ^/(products|orders)/[1-9][0-9]{0,18}$
          description: The record's admin page; null when unavailable.
        api_path:
          type:
            - string
            - 'null'
          maxLength: 512
          description: The API path that was read
          without its query; null when unavailable.: null
        required_permissions:
          type: array
          minItems: 1
          maxItems: 1
          description: The reader grant this card requires.
          items:
            type: string
            enum:
              - storefront.view
              - orders.view
        summary:
          description: Bounded facts from the saved answer; null when unavailable.
          anyOf:
            - $ref: '#/components/schemas/MistProductSummary'
            - $ref: '#/components/schemas/MistOrderSummary'
            - type: 'null'
    MistProductSummary:
      type: object
