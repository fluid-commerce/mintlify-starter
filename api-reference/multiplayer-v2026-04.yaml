                  properties:
                    type:
                      const: conflict
                    discussion:
                      $ref: '#/components/schemas/Discussion'
    AnswerClaimHolder:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9_-]+$
      description: One answering attempt, such as a single Mist Desktop turn. Never returned in a response.
    DiscussionAnswerClaim:
      type: object
      description: 'Which runtime is answering a question in the chat. While a claim is live, or once its holder has answered, no other runtime answers that question. The chat holds one claim: a claim on a later question replaces an answered one, and an answered question is not answered again.'
      required:
        - producer
        - through_sequence
        - answered
        - expires_at
      properties:
        producer:
          type: string
          description: What the holder publishes as, such as mist_desktop or cowork_conversation.
        through_sequence:
          type: integer
          minimum: 1
          description: The sequence of the claimed question.
        answered:
          type: boolean
          description: True once the holder published its answer; the claim then holds until a newer message from the person who asked the question, or a claim on a later question.
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When an unanswered claim ends unless renewed; null for an answer published without one.
    DiscussionAnswerSuperseded:
      type: object
      description: An answer left unpublished. Nothing was saved.
      required:
        - superseded
        - reason
        - status
        - meta
      properties:
        superseded:
          const: true
        reason:
          type: string
          enum:
            - newer_message
            - answered_elsewhere
          description: newer_message when the person who asked the question has written a newer message; answered_elsewhere when the question already has an answer or another attempt holds the claim.
        status:
          const: 200
        meta:
          $ref: '#/components/schemas/Meta'
    DiscussionMessageAdded:
      type: object
      required:
        - message
        - status
        - meta
      properties:
        message:
          $ref: '#/components/schemas/DiscussionMessage'
        status:
          type: integer
          enum:
            - 200
            - 201
        meta:
          $ref: '#/components/schemas/Meta'
    DiscussionStep:
      type: object
      description: One tool step a client ran while it worked on a person's question, saved beside the conversation.
      required:
        - id
        - discussion_id
        - question_message_id
        - producer
        - result_id
        - tool_call_id
        - position
        - tool_name
        - status
        - output_rule
        - input
        - output
        - output_bytes
        - occurred_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        discussion_id:
          type: string
          format: uuid
        question_message_id:
          type: string
          format: uuid
          description: The person's message the attempt worked on.
        producer:
          type: string
          enum:
            - mist_desktop
        result_id:
          type: string
          description: The attempt's answer id, whether or not that answer was published.
        tool_call_id:
          type: string
        position:
          type: integer
          minimum: 0
        tool_name:
          type: string
        status:
          type: string
          enum:
            - completed
            - error
            - not_run
        output_rule:
          type: string
          enum:
            - full
            - input_only
        input:
          type: object
          additionalProperties: true
        output:
          type:
            - string
            - 'null'
          description: Null for an input_only step.
        output_bytes:
          type:
            - integer
            - 'null'
          description: The size of the whole output before any cut.
        occurred_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    DiscussionStepsSaved:
      type: object
      required:
        - steps
        - status
        - meta
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/DiscussionStep'
        status:
          type: integer
          enum:
            - 200
            - 201
        meta:
          $ref: '#/components/schemas/Meta'
    DiscussionTaskLink:
      type: object
