        x:
          type: string
          maxLength: 60
        'y':
          type: number
    ReplyDataSnapshotInput:
      type: object
      required:
        - label
        - path
        - rows
      description: 'A read Mist named before its work, read again after, as a reply''s proof lists it: a task result''s data_snapshot without its kind.'
      properties:
        label:
          type: string
          maxLength: 200
        path:
          type: string
          maxLength: 2048
        rows:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/RecordChangeFieldInput'
        series:
          $ref: '#/components/schemas/DataSnapshotSeriesInput'
        before_at:
          type: string
          maxLength: 40
        after_at:
          type: string
          maxLength: 40
        before_missing:
          type: string
          maxLength: 500
        after_missing:
          type: string
          maxLength: 500
        truncated:
          type: boolean
    ReplyDataSnapshot:
