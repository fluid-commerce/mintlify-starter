        task_link:
          $ref: '#/components/schemas/DiscussionTaskLink'
        task:
          $ref: '#/components/schemas/Task'
        status:
          type: integer
          enum:
            - 200
            - 201
        meta:
          $ref: '#/components/schemas/Meta'
    DiscussionTaskLinkWithDiscussion:
      allOf:
        - $ref: '#/components/schemas/DiscussionTaskLink'
