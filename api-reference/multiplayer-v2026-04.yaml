      x-fluid-audience: company
      summary: Give the agency's people access to the company's store
      description: 'Requires a company-admin user session with multiplayer_tasks.execute, the company''s COWORK feature flag, and `users.update` (the permission to add admins). The caller can give only a role whose permissions they hold, as the admin invite checks; a root admin gives freely. Fluid never gives this access: only the customer does, from the ticket. The access lasts while the ticket''s request is open, at any stage and through every round of changes, and ends when the request closes (done or declined), is withdrawn or switched to another agency, when the agency is deleted, when the person leaves the agency, or when the customer takes it away (`DELETE /agency-request/access/{user_id}`). Each person must be a kept member of the request''s agency. A person is made an admin of the company holding the role. A person who already holds an admin of their own, which this access did not make, keeps it exactly as it is and is given nothing: they had access. A person whose admin another open request''s grant keeps gets this request''s grant too and keeps the role they hold. A person whose admin carries a ticket seat mark, live or ended (a pickup owner''s messaging-only seat), keeps that admin: it is restored if it ended, loses the mark and holds the role in place of the seat''s role, and the person stays in the ticket''s channel as an admin. When the access ends, the admin goes back to being a seat, so a pickup owner whose request is still open stays in the channel. The whole call is refused, and nothing is written, when any person is not a kept member of the agency (`not_an_agency_member`) or cannot be made an admin (`enrolment_failed`), or the request has closed; holding a ticket seat is never a reason to refuse. The request is not written: no event, no new version. Giving access again to a person who has it answers 200 with the task as it is. Without `role_id`, the company''s role named Developer is used; a company without one answers 422 `role_required`.'
      security:
        - bearer_auth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The task UUID returned at creation or in a task page.
          schema:
            type: string
            format: uuid
