  "/api/member/v2026-10/team/{id}/level":
    get:
      tags:
      - team
      summary: List one level below a seat
      description: |
        Pages the current seats exactly `depth` levels below a seat in your
        team, skipping seats of removed members, breadth-first by
        (`relative_depth`, `id`). `depth` is both the traversal bound and the
        selected distance. The admitted profile is depth 1 to 7 and at most
        10,000 positions. A deeper request, or one whose range holds more
        positions, returns 422 `pagination_requires_projection` without a
        partial page; a read past its deadline returns `lookup_too_large`.

        Only `depth`, `cursor`, `limit`, `ids_only` and `as_of` are accepted;
        a body, filters and other selectors are refused with 422. A cursor is
        bound to you, the tree, the anchor seat, the operation, the depth and
        the ordering, and grants no access.
      operationId: member_team_level_index
      x-fluid-audience: member
      parameters:
      - in: path
        name: id
        required: true
        description: A node in your team.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
      - in: query
        name: depth
        required: true
        description: Positive relative distance to select and traverse. Values above the admitted profile are refused, not clamped.
        schema:
          type: integer
          minimum: 1
        example: 1
      - in: query
        name: cursor
        description: Opaque forward cursor from a previous page of this same lookup.
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        description: Maximum nodes in this page; may change between pages.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: ids_only
        description: When true, return the same ordered page as an `ids` array instead of node objects.
        schema:
          type: boolean
          default: false
      - in: query
        name: as_of
        description: Read the placements recorded at this instant; omit for the current team. Intervals include their start and exclude their end.
        schema:
