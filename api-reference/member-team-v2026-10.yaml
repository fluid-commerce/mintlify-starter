                    - 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                    meta:
                      request_uuid: 0192f4d0-8b9c-7d0e-9f1a-2b3c4d5e6f78
                      timestamp: '2026-09-16T10:02:00Z'
                      pagination:
                        cursor: null
