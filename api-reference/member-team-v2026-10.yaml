---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Team
  description: |
    The signed-in member's own team: their seat in each company tree, the
    downline beneath it, and the moves they request inside it. This is the
    member API, so every operation acts as the signed-in member. The bearer
    credential alone identifies the member and their company. No path, query
    or body parameter names a member, and a request that tries to (a
    `member_id` selector, for example) is refused with 422.

    A member only ever reads or changes their own data. Reads start from a
    node in their own team: their primary seat or a seat currently beneath
    it. A node outside that team returns 404, and a parent outside it is
    returned as null. Moves may only rearrange seats inside their downline,
    and move requests and move jobs are readable only by the member who
    requested them.

    Company admins, partners and company integrations read and move any seat
    through the company genealogy API instead, with a company API token, a
    partner token or an admin credential.

    Moves take effect at server time. An applied or unchanged move returns
    200. A move that needs approval, or that is too large to validate inline,
    returns 202 with a receipt to poll.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
tags:
- name: team
  description: Read the signed-in member's seat, their downline and its recorded history.
  x-fluid-section: Members
- name: team moves
  description: Preview and request moves inside the signed-in member's downline, and follow their own move requests and jobs.
  x-fluid-section: Members
paths:
  "/api/member/v2026-10/team/{id}":
    get:
      tags:
      - team
      summary: Show a seat in your team
      description: |
        Returns one seat in your team: your own primary seat or a seat
        currently beneath it. Without `as_of`, the response is the current
        relationship with `children_count`, `downline_count` and
        `counts_as_of`, observed in one database statement. The counts include
        retained seats of removed members, so they can exceed what the page
        endpoints list.

        With `as_of`, the response is the recorded relationship at that
        instant, without counts. Historical access follows today's team: a
        parent outside it is returned as null. Only recorded relationships are
        returned; historical rank, volume and profile values are not inferred.

        A current read returns 422 `lookup_too_large` when it runs past its
        deadline, or `counter_inconsistent` when a structural count is
        negative.
      operationId: member_team_show
      x-fluid-audience: member
      parameters:
      - name: id
        in: path
        required: true
        description: A node in your team.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
      - name: as_of
        in: query
        description: Read the placement recorded at this instant; omit for the current placement. Intervals include their start and exclude their end.
        schema:
          type: string
          format: date-time
        example: '2026-09-01T00:00:00Z'
      responses:
        '200':
          description: The seat's current relationship with counts, or its recorded relationship at `as_of`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentOrHistoricalRelationshipResponse"
              examples:
                current:
                  summary: Dwight Schrute's own seat, with his downline counts
                  value:
                    status: 200
                    node:
                      id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a8-5c1e-7d42-9b6a-3e8f1c2d4a57
                      parent_node_id: null
                      leg: null
                      effective_at: '2026-06-01T14:00:00Z'
                      ended_at: null
                      children_count: 2
                      downline_count: 2
                      counts_as_of: '2026-09-30T15:04:12Z'
                    meta:
                      request_uuid: 0192f4d0-1a2b-7c3d-8e4f-5a6b7c8d9e01
                      timestamp: '2026-09-30T15:04:12Z'
                recorded:
                  summary: Pam Beesly's seat as recorded on 1 September, before she moved under Jim Halpert
                  value:
                    status: 200
                    node:
                      id: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-2c3d-7e4f-9a5b-6c7d8e9f0a12
                      parent_node_id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      leg: null
                      effective_at: '2026-06-15T09:30:00Z'
                      ended_at: '2026-09-22T16:45:10Z'
                    meta:
                      request_uuid: 0192f4d0-2b3c-7d4e-9f5a-6b7c8d9e0f12
                      timestamp: '2026-09-30T15:05:03Z'
        '401':
          description: The credential is missing or does not resolve a membership in the company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The node, or its placement at `as_of`, is not in your team.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: An invalid or unsupported query parameter, `lookup_too_large`, or `counter_inconsistent`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
