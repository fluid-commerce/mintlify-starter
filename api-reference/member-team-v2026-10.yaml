                "$ref": "#/components/schemas/Error"
  "/api/member/v2026-10/team/{id}/move":
    post:
      tags:
      - team moves
      summary: Move a seat in your downline
      description: |
        Moves a seat in your downline under another seat in your downline, or
        asks for approval to. You need rep eligibility and the tree's member
        movement policy must allow it: an open movement window, a movement
        depth limit, and a tree that accepts member moves. You cannot move
        your own seat. Neither the seat nor its new parent may be outside
        your team, and no member or actor selector is accepted.

        Returns 200 when the move is applied or already in place, and 202
        with a move request when the tree requires approval, or with a move
        job when the move is too large to validate inline. Moves cannot be
        backdated. Move submission is off until Fluid enables it for the
        company; until then this returns 503.
      operationId: member_team_move_create
      x-fluid-audience: member
      parameters:
      - name: id
        in: path
        required: true
        description: The seat to move, in your downline.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
      - name: Idempotency-Key
        in: header
        required: false
        description: |
          Optional key that makes the request safe to retry. The first request
          with a key is evaluated and its outcome recorded; a retry with the
          same key and the same proposal replays that outcome, with the
          resource's current state, instead of moving again. The same key with
          a different proposal is refused with 409 `idempotency_key_reused`.
          Keys are scoped to you and the tree; failed requests record nothing.
          While moves are paused for the company the request returns 503
          without reading or recording the key, so retry it later with the
          same key. A recorded outcome is kept for at least 24 hours.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
        example: 3f1e8c0a-2b7d-4c1e-9a55-6e2f0b7d1c42
      requestBody:
        required: true
        description: The proposed new parent. The actor and source come from your credential.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MoveProposal"
            examples:
              move:
                summary: Move Pam Beesly under Jim Halpert
                value:
                  move:
                    parent_node_id: 0192f3c1-1b2c-7d3e-9f4a-5b6c7d8e9f0a
                    reason: Pam is joining Jim's Stamford sales team
      responses:
        '200':
          description: The move was applied, or the seat was already there.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MovementResponse"
              examples:
                applied:
                  summary: Pam Beesly now sits under Jim Halpert
                  value:
                    status: 200
                    changed: true
                    queued: false
                    deferred: false
                    move_request: null
                    move_job: null
                    placement:
                      id: 0192f3d2-3d4e-7f5a-9b6c-7d8e9f0a1b2c
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-2c3d-7e4f-9a5b-6c7d8e9f0a12
                      node_id: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                      parent_node_id: 0192f3c1-1b2c-7d3e-9f4a-5b6c7d8e9f0a
                      leg: null
                      effective_at: '2026-09-22T16:45:10Z'
                      ended_at: null
                      source: rep
                      actor_type: Company::Member
                      actor_id: 0192f3a8-5c1e-7d42-9b6a-3e8f1c2d4a57
                      reason: Pam is joining Jim's Stamford sales team
                      request_id: null
                    meta:
                      request_uuid: 0192f4d1-0d1e-7f2a-9b3c-4d5e6f7a8b90
                      timestamp: '2026-09-22T16:45:10Z'
        '202':
