  "/api/member/v2026-10/team/{id}/children":
    get:
      tags:
      - team
      summary: List a seat's children
      description: |
        Pages the current direct children of a seat in your team, skipping
        seats of removed members. Unilevel trees page in node id order.
        Binary and matrix trees page in leg order (`leg_rank`, `position`,
        `id`), where `leg_rank` is the leg's index in the tree's leg names,
        when the company has legged trees enabled (`unsupported_tree_kind`
        otherwise). There is no offset and no total.

        Only `cursor`, `limit` and `ids_only` are accepted; member, filter,
        history and depth selectors are refused with 422. A cursor is bound
        to you, the tree, the anchor seat and the ordering, and grants no
        access. A move or removal can change later pages; pages are not
        frozen snapshots.
      operationId: member_team_children_index
      x-fluid-audience: member
      parameters:
      - in: path
        name: id
        required: true
        description: A node in your team.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
      - in: query
        name: cursor
        description: Opaque forward cursor from a previous page of this same lookup.
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        description: Maximum nodes in this page; may change between pages.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: ids_only
        description: When true, return the same ordered page as an `ids` array instead of node objects.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: One ordered page of current children; an empty page succeeds.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/DirectPageResponse"
                - "$ref": "#/components/schemas/DirectIdsPageResponse"
              examples:
                nodes:
                  summary: Jim Halpert and Pam Beesly directly beneath Dwight Schrute
                  value:
                    status: 200
                    nodes:
                    - id: 0192f3c1-1b2c-7d3e-9f4a-5b6c7d8e9f0a
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-1b2c-7d3e-8f4a-5b6c7d8e9f01
                      parent_node_id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      leg: null
                      position: 0
                      pinned: false
                    - id: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-2c3d-7e4f-9a5b-6c7d8e9f0a12
                      parent_node_id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      leg: null
                      position: 0
                      pinned: false
                    meta:
                      request_uuid: 0192f4d0-4d5e-7f6a-9b7c-8d9e0f1a2b34
                      timestamp: '2026-09-14T11:20:00Z'
                      pagination:
                        cursor: null
                        next_cursor: null
                        limit: 100
                        ordering: node_id_asc
                ids:
                  summary: The same page with ids_only=true
                  value:
                    status: 200
                    ids:
                    - 0192f3c1-1b2c-7d3e-9f4a-5b6c7d8e9f0a
                    - 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                    meta:
                      request_uuid: 0192f4d0-5e6f-7a7b-8c8d-9e0f1a2b3c45
                      timestamp: '2026-09-14T11:20:02Z'
                      pagination:
                        cursor: null
                        next_cursor: null
                        limit: 100
                        ordering: node_id_asc
        '401':
          description: The credential is missing or does not resolve a membership in the company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The anchor is missing, malformed, removed, in another company, or outside your team; `error.details.type` is `record_missing`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: An invalid selector, `invalid_cursor`, `unsupported_tree_kind`, `invalid_ancestry`, or `lookup_too_large`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/member/v2026-10/team/{id}/descendants":
    get:
      tags:
      - team
      summary: List a seat's descendants
      description: |
        Pages the current strict descendants of a seat in your team, skipping
        seats of removed members, breadth-first by (`relative_depth`, `id`),
        down to `depth` levels. The admitted profile is depth 1 to 7 and at
        most 10,000 positions. A deeper request, or one whose range holds more
        positions, returns 422 `pagination_requires_projection` without a
        partial page; a read past its deadline returns `lookup_too_large`.

        Only `depth`, `cursor`, `limit`, `ids_only` and `as_of` are accepted;
        a body, filters and other selectors are refused with 422. A cursor is
        bound to you, the tree, the anchor seat, the operation, the depth and
        the ordering, and grants no access. A move or removal can change later
        pages; pages are not frozen snapshots.
      operationId: member_team_descendants_index
      x-fluid-audience: member
      parameters:
      - in: path
        name: id
        required: true
        description: A node in your team.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
      - in: query
        name: depth
        required: true
        description: Positive relative depth bound. Values above the admitted profile are refused, not clamped.
        schema:
          type: integer
          minimum: 1
        example: 3
      - in: query
        name: cursor
        description: Opaque forward cursor from a previous page of this same lookup.
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        description: Maximum nodes in this page; may change between pages.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: ids_only
        description: When true, return the same ordered page as an `ids` array instead of node objects.
        schema:
          type: boolean
          default: false
      - in: query
        name: as_of
        description: Read the placements recorded at this instant; omit for the current team. Intervals include their start and exclude their end.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: One ordered page of descendants with traversal metadata; an empty page succeeds.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/DeeperPageResponse"
                - "$ref": "#/components/schemas/DeeperIdsPageResponse"
              examples:
                nodes:
                  summary: Dwight Schrute's downline, one level deep
                  value:
                    status: 200
                    nodes:
                    - id: 0192f3c1-1b2c-7d3e-9f4a-5b6c7d8e9f0a
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-1b2c-7d3e-8f4a-5b6c7d8e9f01
                      parent_node_id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      leg: null
                      position: 0
                      pinned: false
                      relative_depth: 1
                    - id: 0192f3c1-2c3d-7e4f-8a5b-6c7d8e9f0a1b
                      tree_id: 0192f3c0-4d5e-7f60-8a7b-9c0d1e2f3a4b
                      member_id: 0192f3a9-2c3d-7e4f-9a5b-6c7d8e9f0a12
                      parent_node_id: 0192f3c1-0a1b-7c2d-8e3f-4a5b6c7d8e9f
                      leg: null
                      position: 0
                      pinned: false
                      relative_depth: 1
                    meta:
                      request_uuid: 0192f4d0-6f7a-7b8c-9d9e-0f1a2b3c4d56
                      timestamp: '2026-09-16T10:00:00Z'
                      pagination:
                        cursor: null
                        next_cursor: null
                        limit: 100
                        ordering: relative_depth_id_asc
                      traversal:
                        depth_truncated: false
        '401':
          description: The credential is missing or does not resolve a membership in the company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The anchor is missing, malformed, removed, in another company, or outside your team; `error.details.type` is `record_missing` or `placement_missing`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: An invalid selector, `invalid_cursor`, `pagination_requires_projection`, `invalid_ancestry`, or `lookup_too_large`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
