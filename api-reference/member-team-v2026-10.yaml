      description: |
        Counts the structural positions at each positive distance below a
        seat in your team, down to `depth`, including retained seats of
        removed members. Those seats are counted but never returned as
        readable nodes. Levels are zero-filled through the bound.
        `counts_as_of` is the time this statement observed the counts.

