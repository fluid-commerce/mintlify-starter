components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A credential in the `Authorization: Bearer` header that resolves to
        a membership in the company. The credential alone selects the member
        and the company.

        Accepted: a member's user token, a portal JWT whose login is linked
        to a membership, a member session JWT for a member with a customer
        record, a legacy customer session JWT, and, where enabled, a Fluid
        identity access token that names a membership. Unlike the People and Commerce member
        APIs, these routes do not treat any credential as read-only: a
        member session JWT or portal JWT can also submit and withdraw moves.

        Refused with 401: no credential, company API tokens, partner tokens,
        public (`pub-`) tokens and droplet installation tokens, since none of
        them identifies a member, and a portal JWT with no membership linked
        to it.

        Not refused: these routes do not yet apply the member credential
        rules of the People and Commerce APIs. An admin's user token, an
        admin's portal JWT and an impersonation JWT are accepted when the
        user holds a membership in the company, and act as that membership
        only, reading and moving within that membership's own team. Use the
        company genealogy API for company-wide access.
