                  menu_slug: reps-navigation
                  menu_id: 4417
                  unconstrained: false
                  rule:
                    country_ids:
                    - 214
                    member_type_ids:
                    - 0191d3f0-7c2a-7b4e-9d61-3f8a2c5e1b07
                  pages: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
