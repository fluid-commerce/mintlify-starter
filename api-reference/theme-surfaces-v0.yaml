      summary: Add a member site to the theme
      description: >-
        Appended rather than inserted, so adding a site never changes which
        site an existing member already resolves to. A merchant reorders
        deliberately, by sending `position`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [members_site]
              properties:
                members_site:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: What the merchant calls the site, unique within the theme.
                      examples: [Reps]
                    active:
                      type: boolean
                      description: Defaults to true. An inactive site resolves for nobody.
                    default:
                      type: boolean
                      description: >-
                        Defaults to false. A default site is the fallback, tried
                        only after every explicit site fails to match.
                    layout_name:
                      type: string
                      description: >-
                        A `layouts` template in this theme, or "none" for no
                        layout. Defaults to the theme's own `theme` layout.
                        `member` and `theme` name the fallback chain itself and
                        are accepted whether or not the theme has either
                        template yet; any other name must be a `layouts`
                        template of this theme, or the request is refused with
                        422 rather than saved as a selection the storefront
                        would not honour.
                      examples: [theme]
                    country_ids:
                      type: array
                      description: Empty or absent means any country.
                      items:
                        type: integer
                      examples: [[1]]
                    member_type_ids:
                      type: array
                      description: Empty or absent means any member type.
                      items:
                        type: string
                      examples: [['0191d3f0-0000-7000-8000-000000000000']]
            example:
              members_site:
                name: Reps
                active: true
                default: false
                layout_name: theme
