  "/api/company/members_sites/{id}":
    parameters:
    - name: application_theme_id
      in: query
      required: false
      description: Company-owned theme being edited, including draft themes. Omit for the active theme. Unknown or foreign themes return 404 without falling back.
      schema:
        type: integer
        minimum: 1
    - name: id
      in: path
      required: true
      description: The site's id, which must belong to this company's selected theme.
      schema:
        type: integer
    patch:
      tags: [members-sites]
      operationId: theme_surfaces_v0_update_members_site
      summary: Change a member site's name, order, activity or rule
      description: >-
        Only the fields sent are changed. That matters more here than usual: an
        axis sent as `[]` widens the site to everybody, so "absent" and
        "cleared" cannot be allowed to mean the same thing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [members_site]
              properties:
                members_site:
                  type: object
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      examples: [Leaders]
                    active:
                      type: boolean
                    default:
                      type: boolean
                    layout_name:
                      type: string
                      description: >-
                        A `layouts` template in this theme, or "none" for no
                        layout. `member` and `theme` name the fallback chain
                        itself and are always accepted; any other name must be
                        a `layouts` template of this theme, or the request is
                        refused with 422.
                      examples: [member]
                    position:
                      type: integer
                      minimum: 0
                      description: >-
                        Where to move the site among its siblings, as a
                        zero-based slot: `0` is first, and anything past the end
                        lands last. The whole list is renumbered to a contiguous
                        run afterwards, so two sites can never share a position
                        and precedence never falls back to record order.
                      examples: [0]
                    country_ids:
                      type: array
                      description: Sending `[]` widens the site to any country.
                      items:
                        type: integer
                      examples: [[1]]
                    member_type_ids:
                      type: array
                      description: Sending `[]` widens the site to any member type.
                      items:
                        type: string
                      examples: [['0191d3f0-0000-7000-8000-000000000000']]
            example:
              members_site:
                name: Leaders
                position: 0
      responses:
        '200':
          description: The changed site
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersSiteEnvelope'
              example:
                members_site:
                  id: 6021
                  name: Leaders
                  active: true
                  default: false
                  position: 1
                  layout_name: theme
                  menu_slug: reps-navigation
                  menu_id: 4417
                  unconstrained: false
                  rule:
                    country_ids:
                    - 214
                    member_type_ids:
                    - 0191d3f0-7c2a-7b4e-9d61-3f8a2c5e1b07
                  pages:
                  - id: 81530
                    title: Rewards
                    slug: rewards
                    published: true
                    path: /accounts/rewards
                    template_id: 55102
                    updated_at: '2026-09-18T14:03:27Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [members-sites]
      operationId: theme_surfaces_v0_delete_members_site
      summary: Remove a member site and the pages it governs
      description: >-
        The pages go with it: a page whose site is gone is a page nobody can be
        resolved to. Refuses the theme's last site rather than leaving a theme
        that resolves nobody, so emptying a members area is deactivation rather
        than deletion.
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  "/api/company/members_sites/{members_site_id}/pages":
    parameters:
    - name: application_theme_id
      in: query
      required: false
      description: Company-owned theme being edited, including draft themes. Omit for the active theme. Unknown or foreign themes return 404 without falling back.
      schema:
        type: integer
        minimum: 1
    - name: members_site_id
      in: path
      required: true
      description: The site that will govern the page, which must belong to this company's selected theme.
      schema:
        type: integer
    post:
      tags: [members-pages]
      operationId: theme_surfaces_v0_create_members_page
      summary: Add a page to a member site
      description: >-
        Nested under the site because a page cannot exist without one: the site
        is what decides who may see the page. Created active unless explicitly
        disabled, and with a `members_page` template already bound, since the
        builder opens a page by its template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [members_page]
              properties:
                members_page:
                  type: object
                  additionalProperties: false
                  required: [title]
                  properties:
                    title:
                      type: string
                      description: What the merchant calls the page.
                      examples: [Rewards]
                    slug:
                      type: string
                      maxLength: 64
                      description: >-
                        The path segment, unique within this site. Use / for the home page; system routes are reserved. Derived from
                        the title when absent, which is what the builder sends
                        unless a merchant edits the route by hand. The derived
                        slug is bounded by the same limit, so a very long title
                        is refused rather than producing a route the unique
                        index cannot hold.
                      examples: [rewards]
                    published:
                      type: boolean
                      default: true
                      description: >-
                        Active by default within this theme and site. Explicit
                        false keeps the page out of navigation and returns 404
                        when requested. Does not activate or publish the theme.
            example:
              members_page:
                title: Rewards
                slug: rewards
                published: true
      responses:
        '201':
          description: The new page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersPageEnvelope'
              example:
                members_page:
                  id: 81530
                  title: Rewards
                  slug: rewards
                  published: true
                  path: /accounts/rewards
                  template_id: 55102
                  updated_at: '2026-09-18T14:03:27Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  "/api/company/members_pages/{id}":
    parameters:
    - name: application_theme_id
      in: query
      required: false
      description: Company-owned theme being edited, including draft themes. Omit for the active theme. Unknown or foreign themes return 404 without falling back.
      schema:
        type: integer
        minimum: 1
    - name: id
      in: path
      required: true
      description: The page's id, which must sit in one of this company's active theme's sites.
      schema:
        type: integer
    patch:
      tags: [members-pages]
      operationId: theme_surfaces_v0_update_members_page
      summary: Change a member page's title, route, publication or site
      description: >-
        Only the fields sent are changed, so publishing a page does not rewrite
        the route a merchant chose. Sending `members_site_id` moves the page to
        another site, which moves who may see it — the target must belong to the
        same theme.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [members_page]
              properties:
                members_page:
                  type: object
                  additionalProperties: false
                  properties:
                    title:
                      type: string
                      examples: [Rewards]
                    slug:
                      type: string
                      maxLength: 64
                      description: >-
                        Use / for the home page; system routes are reserved. Normalised the way a create normalises it, and bounded
                        by the same limit, so a long value is refused rather
                        than reaching the unique index.
                      examples: [rewards]
                    published:
                      type: boolean
                    members_site_id:
                      type: integer
                      description: >-
                        Move the page to this site. Changes who may see it, so
                        the site must belong to the same theme.
                      examples: [42]
            example:
              members_page:
                title: Rewards & Perks
                published: false
      responses:
        '200':
          description: The changed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembersPageEnvelope'
              example:
                members_page:
                  id: 81530
                  title: Rewards & Perks
                  slug: rewards
                  published: false
                  path: /accounts/rewards
                  template_id: 55102
                  updated_at: '2026-09-25T17:12:48Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags: [members-pages]
      operationId: theme_surfaces_v0_delete_members_page
      summary: Remove a member page
      description: >-
        Takes the page's template with it: it was created for this page and
        nothing else routes to it. No last-page rule, unlike a site — a site
        with no pages is one a merchant is still filling in, whereas a theme
        with no sites serves nobody.
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
