    delete:
      tags: [theme-audiences]
      operationId: theme_surfaces_v0_delete_audience
      summary: Remove an audience and the bindings that named it
      description: >-
        Surfaces bound only through this audience fall back to their default
        binding rather than stopping.
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/api/company/theme_releases":
    get:
      tags: [theme-releases]
      operationId: theme_surfaces_v0_list_releases
      summary: List the theme's releases, newest first
      description: >-
        The manifest is deliberately absent: it is the whole resolved binding set
        and grows with the theme.
      responses:
        '200':
          description: The theme's releases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseList'
              example:
                releases:
                - id: 48219
                  revision: r3-9f2a1c4b
                  published_at: '2026-09-22T16:22:05Z'
                  active: false
                  surface_count: 12
                - id: 48214
                  revision: r2-4be07d13
                  published_at: '2026-09-15T13:08:51Z'
                  active: true
                  surface_count: 12
                - id: 48213
                  revision: r1-c81f5a92
                  published_at: '2026-09-08T10:44:17Z'
                  active: false
                  surface_count: 11
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [theme-releases]
      operationId: theme_surfaces_v0_publish_release
      summary: Freeze the theme's current bindings as a new release
      description: >-
        Refuses when two equal-priority audiences overlap. A release published
        from an ambiguous theme would resolve differently depending on row
        order, which is the one thing a frozen artifact must not do.
      responses:
        '201':
          description: The new release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEnvelope'
              example:
                release:
                  id: 48227
                  revision: r4-7d3e0b6a
                  published_at: '2026-09-29T15:31:40Z'
                  active: false
                  surface_count: 13
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  "/api/company/theme_releases/{id}/activate":
    parameters:
    - name: id
      in: path
      required: true
      description: The release to serve, which must belong to this company's active theme.
      schema:
        type: integer
    post:
      tags: [theme-releases]
      operationId: theme_surfaces_v0_activate_release
      summary: Serve a release
      description: >-
        A pointer move, not a re-render, which is what makes it as cheap to undo
        as to do.
      responses:
        '200':
          description: The now-active release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEnvelope'
              example:
                release:
                  id: 48227
                  revision: r4-7d3e0b6a
                  published_at: '2026-09-29T15:31:40Z'
                  active: true
                  surface_count: 13
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  "/api/company/theme_releases/rollback":
    post:
      tags: [theme-releases]
      operationId: theme_surfaces_v0_rollback_release
      summary: Serve the release before the active one
      description: >-
        Refuses when nothing is active, because publishing does not activate and
        a theme can hold releases with none being served.
      responses:
        '200':
          description: The restored release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseEnvelope'
              example:
                release:
                  id: 48219
                  revision: r3-9f2a1c4b
                  published_at: '2026-09-22T16:22:05Z'
                  active: true
                  surface_count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
