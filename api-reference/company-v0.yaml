  "/api/customers":
    get:
      summary: List customers
      description: Get all customers with optional filters
      tags:
      - customers
      operationId: commerce_v0_list_customers
      security:
      - bearer_auth: []
      parameters:
      - name: search_query
        in: query
        required: false
        description: Filter customers with search query that matches with their email, first name, last name or external_id
        schema:
          type: string
      - name: sorted_by
        in: query
        required: false
        example: id_asc
        description: |
          Sort the records by one of the supported attributes:

            - id
            - email
            - created_at
            - updated_at
            - country
            - full_name
            - active_subscriptions_count
            - inactive_subscriptions_count
            - orders_count
            - last_ordered_at

          The sort attribute should be followed by one of the order directives: '_asc', '_desc'
        schema:
          type: string
      - name: has_subscription
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who have subscription
      - name: has_recent_orders
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who have recent orders made within last 30 days
      - name: has_failed_orders
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who have failed orders
      - name: purchased_more_than_once
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who have purchased more than once
      - name: us_customers
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers from US
      - name: non_us_customers
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers outside from US
      - name: abandoned_in_the_last_30_days
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who have abandoned cart within last 30 days
      - name: reps
        in: query
        schema:
          type: boolean
          default: false
        required: false
        description: Filter customers who are also Reps
      - name: order_status
        in: query
        required: false
        description: Filter customers by their order status
        schema:
          type: string
          enum:
          - fulfilled
          - unfulfilled
      - name: ordered_since
        in: query
        required: false
        description: Filter customers who have ordered since the specified date. Can be used for e.g. last 30 days, 90 days, etc.
        example: '2024-10-27'
        schema:
          type: string
      - name: location
        in: query
        required: false
        description: Filter customers based upon their default address country iso. `US`, `CA`, `UK`, etc.
        example: CA
        schema:
          type: string
      - name: subscription_status
        in: query
        required: false
        description: Filter customers by their subscription orders status. `active` or `inactive`
        schema:
          type: string
          enum:
          - active
          - inactive
      - name: created_between
        in: query
        required: false
        description: >-
          Filter customers by creation date range. Format: MM-DD-YYYY-MM-DD-YYYY. Examples: '01-01-2024-12-31-2024' (between dates), '01-01-2024-' (after date), '-12-31-2024' (before date). Note: URL-encode
          the entire parameter value.
        example: 01-01-2024-12-31-2024
        schema:
          type: string
      - name: with_total_orders_between
        in: query
        required: false
        description: 'Filter customers by total number of orders range. Format: min-max. Example: ''2-5'', ''2-'', ''-5'''
        example: 2-5
        schema:
          type: string
      - name: with_total_spent_between
        in: query
        required: false
        description: 'Filter customers by total amount spent range. Format: min-max. Example: ''200-500'', ''200-'', ''-500'''
        example: 200-500
        schema:
          type: string
      - name: active_subscription_amount_between
        in: query
        required: false
        description: Filter customers by total amount of active subscription orders (e.g. '100-500' or '100-' or '-500')
        example: 100-500
        schema:
          type: string
      - name: inactive_subscription_amount_between
        in: query
        required: false
        description: Filter customers by total amount of inactive subscription orders (e.g. '100-500' or '100-' or '-500')
        example: 100-500
        schema:
          type: string
      - name: for_rep
        in: query
        required: false
        description: Filter customers by their rep id (user_company_id)
        schema:
          type: integer
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
        required: false
        description: Number of records per page
      - name: by_metadata
        in: query
        schema:
          type: string
          default: "{}"
          format: json
        required: false
        description: Search JSON meta data
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCustomersResponse200ApplicationJsonSchema"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
