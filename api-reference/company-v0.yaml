  "/api/refunds":
    post:
      summary: Create refund with restock_all_items accounting for existing partial refunds
      tags:
      - refunds
      operationId: commerce_v0_create_refund_with_restock_all_items_partial_refunds
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Refund created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonValue"
        '202':
          description: >-
            Refund accepted by the payment provider but not yet settled. The order stays unrefunded until the provider confirms it; the request must not be retried, since a second dispatch would refund
            the shopper twice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: What the provider still owes before the refund settles.
                  refund_status:
                    type: string
                    enum:
                    - pending
                    description: Marks the refund as accepted but unsettled.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - order_id
              - type
              properties:
                order_id:
                  type: integer
                  description: ID of the order to refund.
                type:
                  type: string
                  enum:
                  - all
                  - tax
                  - shipping
                  - product_price
                  - cv
                  - qv
                  - partial
                  description: Which portion of the order to refund.
                reason:
                  type: string
                  description: Optional human-readable reason for the refund.
                amount:
                  type: number
                  format: float
                  description: Amount to refund (used with partial/custom types).
                shipping:
                  type: number
                  format: float
                  description: Shipping amount to refund.
                tax:
                  type: number
                  format: float
                  description: Tax amount to refund.
                cv:
                  type:
                  - number
                  - string
                  format: decimal
                  description: CV (commissionable volume) to deduct with the refund.
                qv:
                  type:
                  - number
                  - string
                  format: decimal
                  description: QV (qualifying volume) to deduct with the refund.
                restock_all_items:
                  type: boolean
                  description: When true, restock every remaining (not-yet-refunded) order item.
                restock_items:
                  type: array
                  description: Specific items to restock; ignored when restock_all_items is true.
                  items:
                    type: object
                    required:
                    - item_id
                    - quantity
                    properties:
                      item_id:
                        type: integer
                      quantity:
                        type: integer
                refund_points:
                  type: boolean
                  description: When true and the order was paid with a split card+points payment, refund all redeemed points back to the customer. No-op if the order has no points portion or points have
                    already been refunded.
  "/api/refunds/items":
    post:
      summary: Create refund for items
