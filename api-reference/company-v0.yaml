  "/api/customers/lookup":
    get:
      summary: Look up customers for a picker
      description: >-
        Finds customers whose email, first name, last name or external id contains the term, and returns only the fields a picker renders. Unlike the customer index this endpoint does not paginate and does not
        count the match set, so it stays cheap enough to call on every keystroke. The term must carry at least three characters: shorter terms carry no trigram, the indexes behind the search cannot serve them,
        and the query would degrade to a scan of the whole tenant.
      tags:
      - customers
      operationId: commerce_v0_lookup_customers
      security:
      - bearer_auth: []
      parameters:
      - name: search_query
        in: query
        required: true
        description: >-
          Term matched case-insensitively anywhere in the customer's email, first name, last name or external id. The term is split on whitespace and every word must match, so at least one word must carry
          three characters or more.
        example: madison
        schema:
          type: string
          # minLength alone cannot express the rule: the server splits on
          # whitespace and needs one whole word of three characters, so "ma re"
          # is six characters and still refused.
          pattern: '\S{3,}'
      - name: limit
        in: query
        required: false
        description: Maximum rows to return. Defaults to 10 and is capped at 25.
        example: 10
        schema:
          type: integer
          default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CustomerLookupResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '422':
          description: The term is missing, or carries no word long enough for the search indexes to serve
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiErrorResponse"
