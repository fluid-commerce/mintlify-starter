  "/api/subscriptions/{token}/schedule":
    post:
      summary: Schedule next processing
      description: >-
        Sets the subscription's next bill date from a UTC calendar date and UTC time of day. The complete candidate instant is converted to the subscription timezone and rejected if that local date already
        has a staged, attempted, or succeeded billing event on a surviving order. Requests are also rejected while billing is currently in progress.
      tags:
      - subscriptions
      operationId: commerce_v0_schedule_subscription
      security:
      - bearer_auth: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - schedule
              properties:
                schedule:
                  type: object
                  required:
                  - date
                  - processing_time
                  properties:
                    date:
                      type: string
                      format: date
                      example: '2026-07-20'
                    processing_time:
                      type: string
                      description: >-
                        UTC time of day, "HH:MM" or "HH:MM:SS" (24-hour). Any valid time is accepted. The billing cron's slots (00:00/06:00/12:00/18:00 UTC) are billed exactly at their slot; other times
                        are picked up by the first slot at or after them.
                      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
                      example: '06:00'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonValue"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonValue"
        '422':
          description: >-
            Invalid schedule, active local billing date, billing currently in
            progress, or a subscription that has completed its plan's maximum
            billing cycles.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonValue"
