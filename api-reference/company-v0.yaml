    CartTotalChangedErrorResponse:
      description: |
        The cart no longer says the total the client sent as `expected_total`.
        Nothing was charged. `meta.cart` is the current total, so the client
        can show the shopper what changed before asking again.
      type: object
      additionalProperties: false
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          type: object
          additionalProperties: false
          required:
          - expected_total
          properties:
            expected_total:
              type: array
              items:
                type: string
        meta:
          type: object
          additionalProperties: false
          required:
          - request_id
          - timestamp
          - code
          - cart
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type: string
              format: date-time
            code:
              type: string
              const: cart_total_changed
            cart:
              type: object
              additionalProperties: false
              required:
              - amount_total
              - currency_code
              properties:
                amount_total:
                  type:
                  - string
                  - 'null'
                  description: The cart's current total as a decimal string in
                    the currency's major unit, rounded to the currency's minor
                    units -- at most three fraction digits, and none at all for
                    a currency billed in whole units (JPY, TWD). Resend it as
                    `expected_total`; the retry is compared at that same
                    rounding. Null when the cart carries no total at all, which
                    no retry can satisfy.
                  example: "128.85"
                currency_code:
                  type: string
                  description: ISO 4217 code of the currency this total is in.
                    Resend it as `expected_currency`; a retry that names a
                    different currency is refused before the totals are
                    compared.
                  example: USD
    CustomerLookupRow:
      description: One picker row. Identity resolves exactly as it does on the customer index.
      type: object
      additionalProperties: false
      required:
      - id
      - full_name
      - email
      - role
      - is_rep
      properties:
        id:
          type: integer
          description: The customer id, the same identifier GET /api/customers/{id} takes.
          example: 101
        full_name:
          type:
          - string
          - 'null'
          description: The customer's display name, or their email when no name is set.
          example: Madison Reese
        email:
          type:
          - string
          - 'null'
          description: The customer's email address.
          example: madison@example.com
        role:
          type:
          - string
          - 'null'
          description: The customer's resolved role, or null when it is not one of admin, rep, customer or preferred_customer.
          example: customer
        is_rep:
          type: boolean
          description: Whether the customer is also a rep.
          example: false
    CustomerLookupResponse:
