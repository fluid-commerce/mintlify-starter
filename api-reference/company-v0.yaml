  "/api/company/media":
    get:
      summary: List company media
      description: Get all company media with pagination and filtering. Only returns 'share' type media by default.
      tags:
      - media
      operationId: company_v0_list_company_media
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
        required: false
        description: Page number for pagination
      - name: per_page
        in: query
        schema:
          type: integer
          default: 10
        required: false
        description: Number of records per page
      - name: search_query
        in: query
        schema:
          type: string
        required: false
        description: Search by title
      - name: sorted_by
        in: query
        schema:
          type: string
        required: false
        description: Sort order (title_desc, created_at_desc, etc)
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
        required: false
        description: Filter by status (active/inactive)
      - name: language_iso
        in: query
        schema:
          type: string
        required: false
        description: Language code for translations (e.g., 'en', 'es', 'de')
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCompanyMediaResponse200ApplicationJsonSchema"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
    post:
      summary: Create company media
      description: >-
        Create a new media item for the company. The
        attached_shareables_attributes field creates video-shopping overlays and
        returns 422 when a substantive entry targets non-video media.
      tags:
      - media
      operationId: company_v0_create_company_media
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Media created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UpdateCompanyMediaResponse200ApplicationJsonSchema"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported non-video overlay or invalid media parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        description: >-
          Media attributes. Video-shopping overlay writes use
          attached_shareables_attributes and require video media. Null, empty, and
          destroy-only values are accepted for non-video media.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateMediaRequestBodyApplicationJsonSchema"
