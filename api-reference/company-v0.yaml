            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/subscriptions/{token}/retry":
    post:
      summary: Retry billing on a past-due subscription
      description: >-
        Queues an immediate retry on a past-due subscription against whatever payment method is currently on file. The customer may retry the saved method directly or update the method before making this
        request. The endpoint is idempotent for eligible subscriptions. It returns 422 when the current plan's maximum successful billing-cycle limit is reached or invalid. Otherwise, use the response's `queued` field to distinguish the two outcomes — `queued: true` means
        the subscription was past_due, its billing date had arrived, and a retry is pending; a rapid duplicate preserves the first retry time and does not enqueue another attempt. `queued: false` means
        no state change occurred, either because the subscription was not past_due or because its billing date has not yet arrived in the subscription's timezone (for example after a skip or a rescheduled
        next_bill_date). Billing cannot run before that date, so the request is a no-op rather than a deferred retry.
      tags:
      - subscriptions
      operationId: commerce_v0_retry_subscription
      security:
      - bearer_auth: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JsonValue"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '422':
          description: The current plan's maximum successful billing-cycle limit was reached or invalid, or retry state could not be persisted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/subscriptions/{token}/reprocess":
    post:
      summary: Reprocess a past-due subscription
      description: >-
        Queues an immediate billing retry against the subscription's current payment method and records the authenticated member in the customer audit trail. The subscription must be past due and its billing
        date must have arrived in its local timezone.
      tags:
      - subscriptions
      operationId: commerce_v0_reprocess_subscription
      security:
      - bearer_auth: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
