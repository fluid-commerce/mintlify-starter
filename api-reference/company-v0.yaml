            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      description: Delete a media item (soft delete)
      tags:
      - media
    put:
      summary: Update company media
      description: >-
        Update an existing media item. The attached_shareables_attributes field
        creates or modifies video-shopping overlays and returns 422 for substantive
        entries on non-video media. Destroy-only entries can remove legacy overlays
        from non-video media.
      tags:
      - media
      operationId: company_v0_update_company_media
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          example: 1
          description: Media ID
      - name: language_iso
        in: query
        schema:
          type: string
        required: false
        description: Language code for translations (e.g., 'en', 'es', 'de')
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanyClientUpdateCompanyMediaResponse200ApplicationJsonSchema"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Unsupported non-video overlay or invalid media parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        description: >-
          Media attributes. Video-shopping overlay writes use
          attached_shareables_attributes and require video media. Null, empty, and
          destroy-only values are accepted for non-video media.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MediaUpdate"
