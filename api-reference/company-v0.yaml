          "$ref": "#/components/schemas/ApiResponseMeta"
    ApiErrorResponse:
      description: A rejected request, wrapped in the standard API response envelope that Api::Response.error emits.
      type: object
      additionalProperties: false
      required:
      - error
      - status
      - meta
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - message
          - details
          properties:
            message:
              type: string
              description: What was wrong with the request.
              example: Search term must contain a word of at least 3 characters
            details:
              type: object
              description: The offending parameters, each mapped to its messages.
              additionalProperties:
                type: array
                items:
                  type: string
        status:
          type: integer
          description: The HTTP status code echoed in the response envelope.
          example: 422
        meta:
          "$ref": "#/components/schemas/ApiResponseMeta"
    ApiResponseMeta:
      description: The correlation metadata Api::Response emits on every target-pattern endpoint. Distinct from the legacy Meta schema, which carries request_id rather than request_uuid.
      type: object
      additionalProperties: false
      required:
      - request_uuid
      - timestamp
      properties:
        request_uuid:
          type:
          - string
          - 'null'
          description: The request correlation id, or null when unset.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the response was built.
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return one or more of these fields depending on the controller path.
