          pattern: '^\d{1,12}(\.\d{1,5})?$'
          description: |
            The cart total the client showed the operator, as a decimal string
            in the cart currency's major unit (`"141.74"`). Requires
            `expected_currency`. When the cart's total differs at the charge
            boundary the response is `409` with `meta.code` =
            `cart_total_changed` and nothing is charged.

            Not nullable, unlike its siblings here: half a pair is a `422`, so
            an explicit `null` for either field has no meaning. Omit both to
            leave the total unpinned. Matches checkout-v2026-04 and
            public-v2025-06.
          example: "141.74"
        expected_currency:
          type: string
          description: ISO 4217 code of the currency shown. Requires
            `expected_total`. Not nullable, for the reason given there.
          example: USD
