      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      - name: language_iso
        in: query
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      - name: sorted_by
        in: query
        required: false
        example: title_asc
        description: |
          Sort the records by one of the supported attributes:
            - title
            - active
            - required_on_checkout
            - created_at
            - updated_at
          The sort attribute should be followed by one of the order directives: '_asc', '_desc'
        schema:
          type: string
      - name: search_query
        in: query
        required: false
        description: Filter agreements with their title
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - inactive
        required: false
        description: Filter by status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListAgreementsResponse200ApplicationJsonSchema"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
