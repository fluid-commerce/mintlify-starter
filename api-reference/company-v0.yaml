                "$ref": "#/components/schemas/JsonValue"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Authenticated actor lacks permission to update subscriptions
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardForbiddenResponse"
        '404':
          description: Subscription not found or not owned by the authenticated actor
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Subscription is not past due, its billing date has not arrived, the current plan's maximum successful billing-cycle limit was reached or invalid, or the retry could not be persisted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
