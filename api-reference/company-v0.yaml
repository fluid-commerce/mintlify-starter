      description: >-
        Waives the missed billing and shipping cycle without collecting payment and without creating an order or shipment. The missed shipment is skipped. The subscription's original billing and shipping
        cadence and anchors are preserved, and each stored next date is advanced independently only as needed to reach a future local date.
