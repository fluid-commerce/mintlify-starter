      tags:
      - currencies
      description: Convert an amount from one currency to another using current exchange rates
      operationId: company_v0_convert_currency
      security:
      - bearer_auth: []
      parameters:
      - name: amount
        in: query
        required: true
        description: The amount to convert
        schema:
          type: number
      - name: from
        in: query
        required: true
        description: Source currency code (e.g. USD)
        schema:
          type: string
          pattern: "^[a-zA-Z]{3}$"
      - name: to
        in: query
        required: true
        description: Target currency code (e.g. CAD)
        schema:
          type: string
          pattern: "^[a-zA-Z]{3}$"
      responses:
        '200':
          description: Conversion successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversion:
                    type: object
                    properties:
                      from_currency:
                        type: string
                      to_currency:
                        type: string
                      original_amount:
                        type: number
                      converted_amount:
                        type: number
                      rate:
                        type: number
                    required:
                    - from_currency
                    - to_currency
                    - original_amount
                    - converted_amount
                    - rate
                required:
                - conversion
        '422':
          description: Invalid or missing parameters
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
