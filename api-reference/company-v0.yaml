      description: >-
        Resumes a paused subscription or restores normal scheduled billing for an exhausted past-due subscription without charging immediately. Paused subscriptions use the supplied next bill date, or the
        plan's next date when omitted. Exhausted subscriptions preserve a future bill date; a stale date is moved into the future using the subscription plan cadence.
      tags:
      - subscriptions
      operationId: commerce_v0_resume_subscription
      security:
      - bearer_auth: []
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: next_bill_date
        in: query
        schema:
          type: string
          format: date
        required: false
      responses:
        '200':
          description: Subscription billing resumed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CompanySubscriptionResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Subscription not found or not owned by the authenticated actor
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Subscription cannot be resumed, including when its maximum successful billing-cycle limit has been reached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
  "/api/subscriptions/{token}/failed-cycle-waiver":
