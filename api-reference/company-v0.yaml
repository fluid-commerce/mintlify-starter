              schema:
                "$ref": "#/components/schemas/FailedCycleWaiverMutationResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
