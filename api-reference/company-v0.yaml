  "/api/subscriptions":
    get:
      summary: List of subscriptions
      description: List all subscriptions
      tags:
      - subscriptions
      operationId: commerce_v0_list_subscriptions
      security:
      - bearer_auth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: Page number for pagination
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 25
        description: Number of records per page
      - name: status
        in: query
        required: false
        description: >-
          Filter subscriptions by status. Can be comma-separated for multiple values. Use 'inactive' to filter for inactive statuses (pending, paused, cancelled, past_due), or 'active' to filter for active
          statuses (active).
        schema:
          type: string
          enum:
          - pending
          - active
          - paused
          - past_due
          - cancelled
          - inactive
        example: active
      - name: subscription_plan_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter subscriptions by subscription plan ID
      - name: customer_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter subscriptions by customer ID
      - name: within_days
        in: query
        required: false
        schema:
          type: integer
        description: Filter subscriptions within number of days (e.g., last 7 days)
      - name: frequency
        in: query
        required: false
        description: 'Filter subscriptions by billing frequency. Supported values: day, week, month, year'
