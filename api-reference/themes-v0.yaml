                  timestamp: '2026-09-14T15:42:08Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateRootThemeRequestBodyApplicationJsonSchema"
            example:
              zip_file_url: https://cdn.fluid.app/uploads/dunder-mifflin/themes/scranton-classic-1.0.zip
              name: Scranton Classic
              changelog: Initial release with product, collection, and cart templates.
              demo_url: https://shop.dundermifflin.com
