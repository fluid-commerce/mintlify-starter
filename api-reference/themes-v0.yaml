    post:
      summary: Create a root theme
      description: |-
        Submits a new theme to the Fluid theme library for review. The theme is created
        under your company with an initial `1.0` version in `draft` status, built from the
        zip archive at `zip_file_url`. The version stays in draft until a Fluid platform
        administrator approves or rejects it.

        Requires a company admin Bearer token with the `application_themes` update
        permission. The response carries only a confirmation message; call
        `GET /api/root_themes/my` to see the new theme and its versions. A failure while
        creating the theme returns `422`.
      tags:
      - root-themes
      operationId: createRootTheme
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
