  "/api/application_themes/{id}/git_archive_url":
    get:
      summary: Get a short-lived download URL for the theme at a past version
      description: |
        Returns a pre-signed URL for a tarball of the theme's connected
        repository at one commit. The URL is fetched **directly from the Git
        provider by the client** and needs no authentication of its own — Fluid
        mints it and never proxies the bytes, so repository credentials stay
        server-side.

        One request returns the entire tree, binary assets included as real
        bytes. That matters for restoring a past version: an asset's current
        URL points at its current content, so anything built from per-file
        links would silently fail to revert images.

        Read-only. This exposes a version; it does not apply one. Clients with
        a local checkout restore by writing the archive into their theme
        folder, then pushing — the same local-then-publish flow as the Mist and
        Portal rollbacks. A client without one (the admin editor) uses the
        git_restore operation instead, which applies a version to the theme's
        draft records server-side.

        The URL is short-lived. Re-request it rather than caching it.
      tags:
      - application-themes
      security:
      - bearer_auth: []
      operationId: getApplicationThemeGitArchiveUrl
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Application theme ID
      - name: sha
        in: query
        required: true
        schema:
          type: string
        description: Commit SHA to archive, as returned by the git_versions operation.
          Accepts an abbreviated (7+ character) SHA.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  git_archive:
                    "$ref": "#/components/schemas/ApplicationThemeGitArchive"
                required:
                - git_archive
              example:
                git_archive:
                  url: https://codeload.github.com/fluid-gitsync/theme-48213/legacy.tar.gz/9f3c1e7b2a4d6f8e0c1b3a5d7e9f2c4b6a8d0e1f?token=AAQKXJ7M4S2VH6RT3N5PLGDBZC3WQ
                  expires_at: '2026-09-18T16:45:56Z'
                meta:
                  request_id: 3f9c2a7e-6b1d-4e8a-9c52-7d0e4b1a2f63
                  timestamp: '2026-09-18T16:40:56Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Theme not found in the current company
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: The theme has no repository yet, or it is not connected.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: The SHA is malformed or not present in the repository.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: The Git provider returned an error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/application_themes/{id}/git_connect":
    post:
      summary: Connect the theme to a Git repository, provisioning one if needed
      description: |
        Ensures the theme has a connected Git repository, creating and
        provisioning one when it doesn't already have it.

        Idempotent — an already-connected theme returns its repository
        unchanged, and one whose earlier provisioning failed has it retried.
        Safe to call twice.

        Provisioning the upstream repository happens in the background, so a
        freshly created connection reports `status: provisioning` and becomes
        `connected` shortly after. Poll the git_versions operation, or retry
        this one, to observe the change.

        This connects themes that automatic provisioning deliberately skips —
        development themes among them — because an explicit request is a
        different intent from "provision every theme on creation".
      tags:
      - application-themes
      security:
      - bearer_auth: []
      operationId: connectApplicationThemeToGit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Application theme ID
      responses:
        '200':
          description: Connected, or already connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  git_connection:
                    "$ref": "#/components/schemas/ApplicationThemeGitConnection"
                required:
                - git_connection
              example:
                git_connection:
                  repo_full_name: fluid-gitsync/theme-48213
                  status: provisioning
                  default_branch: main
                meta:
                  request_id: 3f9c2a7e-6b1d-4e8a-9c52-7d0e4b1a2f63
                  timestamp: '2026-09-18T16:40:56Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Theme not found in the current company
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: No Git organization has capacity, or the theme cannot be connected.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/application_themes/{id}/git_restore":
    post:
      summary: Restore the theme's draft content to a past published version
      description: |
        Applies one published version back to the theme, for a client that has
        no local checkout to stage it in. The git_archive_url operation is the
        equivalent for one that does.

        Publishes as it writes: every record goes through the theme's own write
        seam, which publishes it. Publishing is per record and there is no
        whole-theme publish, so a restore that only touched drafts would leave
        the caller publishing every template by hand. For an **active** theme
        this therefore goes live.

        It remains undoable: the version being left behind is still in the
        history this restored from.

        The version is read as a single archive rather than file by file, and
        applied in one transaction: a tree that cannot be written leaves the
        theme as it was rather than half-restored.

        Files the target version does not contain are removed, which is what
        makes this a restore rather than a merge — a template added after that
        version would otherwise survive into a tree that never had it.

        Undoing a restore is another restore: the version you were on is still
        in the history you restored from.
      tags:
      - application-themes
      security:
      - bearer_auth: []
      operationId: restoreApplicationThemeGitVersion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Application theme ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sha:
                  type: string
                  description: Commit SHA to restore, as returned by the git_versions
                    operation. Accepts an abbreviated (7+ character) SHA.
              required:
              - sha
            example:
              sha: 9f3c1e7
      responses:
        '200':
          description: The version was applied to the theme's draft records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha:
                    type: string
                    description: The commit that was restored.
                  files_written:
                    type: integer
                    description: Files the version carried into the theme.
                  files_removed:
                    type: integer
                    description: Files removed because the version did not contain
                      them.
                required:
                - sha
                - files_written
                - files_removed
              example:
                sha: 9f3c1e7b2a4d6f8e0c1b3a5d7e9f2c4b6a8d0e1f
                files_written: 38
                files_removed: 2
                meta:
                  request_id: 3f9c2a7e-6b1d-4e8a-9c52-7d0e4b1a2f63
                  timestamp: '2026-09-18T16:40:56Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Theme not found in the current company, or the SHA is not
            in the repository.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: The theme has no repository, it has no upstream to read yet,
            or its content is owned by the repository rather than by Fluid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: The SHA is malformed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: The Git provider returned an error, or the archive could not
            be read.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/application_themes/{id}/git_versions":
    get:
      summary: List a theme's published version history from its connected Git repo
      description: |
        Returns the recent commits on the theme's connected Git repository,
        newest first. Themes are DB-canonical: Fluid writes one commit per
        publish, so this log is the theme's published version history.

        `author_name` is the committing identity, which for anything Fluid
        pushed is the Fluid GitHub App. The person who published is named in
        `message`.

        Read-only — this endpoint never provisions or repairs a repository.
      tags:
      - application-themes
      security:
      - bearer_auth: []
      operationId: listApplicationThemeGitVersions
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Application theme ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Maximum versions to return. Defaults to 25, clamped to 100.
      responses:
        '200':
          description: Success. An empty list means the repository has no commits yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  git_versions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ApplicationThemeGitVersion"
                  current_sha:
                    type:
                    - string
                    - 'null'
                    description: The commit the repository was last synced to, or
                      null when nothing has synced yet.
                  syncing:
                    type: boolean
                    description: True while a push to the repository is in flight.
                      Publishing mirrors to Git through a background job, so for
                      a few seconds afterwards the newest commit does not exist
                      yet. Clients should show a syncing state and poll until this
                      clears rather than treating the list as final.
                  sync_failing:
                    type: boolean
                    description: True when the repository's last push failed. The
                      listed commits are still real and still restorable — the
                      newest theme state simply is not among them yet — so clients
                      should render the history with a warning rather than
                      treating the theme as disconnected.
                required:
                - git_versions
                - current_sha
                - syncing
                - sync_failing
              example:
                git_versions:
                - sha: 4b7d2e9a1c3f5e7b9d0a2c4e6f8b1d3a5c7e9f0b
                  short_sha: 4b7d2e9
                  message: 'Michael Scott: Publish theme Scranton Storefront (0192f4c1-8a3b-7c4d-9e2f-1a2b3c4d5e6f)'
                  author_name: mist-we-commerce[bot]
                  committed_at: '2026-09-18T16:41:02Z'
                  html_url: https://github.com/fluid-gitsync/theme-48213/commit/4b7d2e9a1c3f5e7b9d0a2c4e6f8b1d3a5c7e9f0b
                  current: true
                - sha: 9f3c1e7b2a4d6f8e0c1b3a5d7e9f2c4b6a8d0e1f
                  short_sha: 9f3c1e7
                  message: 'Pam Beesly: Publish theme Scranton Storefront (0192f4c1-8a3b-7c4d-9e2f-1a2b3c4d5e6f)'
                  author_name: mist-we-commerce[bot]
                  committed_at: '2026-09-15T09:04:37Z'
                  html_url: https://github.com/fluid-gitsync/theme-48213/commit/9f3c1e7b2a4d6f8e0c1b3a5d7e9f2c4b6a8d0e1f
                  current: false
                current_sha: 4b7d2e9a1c3f5e7b9d0a2c4e6f8b1d3a5c7e9f0b
                syncing: false
                sync_failing: false
                meta:
                  request_id: 3f9c2a7e-6b1d-4e8a-9c52-7d0e4b1a2f63
                  timestamp: '2026-09-18T16:40:56Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Theme not found in the current company
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: The theme has no repository yet, or it is not connected.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: The Git provider returned an error.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
