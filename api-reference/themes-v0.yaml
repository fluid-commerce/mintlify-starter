paths:
  "/api/application_theme_templates":
    get:
      summary: Lists all theme templates
      description: >-
        Lists the templates available to a theme: the theme's own templates,
        global templates it has not overridden, and — when you filter by
        `themeable_type` — active templates from installed droplets. Requires a
        company admin user or company API token with the `application_themes`
        view permission. The list is not paginated.
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      parameters:
      - name: application_theme_id
        in: query
        required: false
        schema:
          type: integer
        description: Theme whose templates to list. The server requires it and returns 422 when it is missing; it may also be sent in a JSON body.
        example: 7310
      - name: themeable_type
        in: query
        required: false
        schema:
          type: string
        description: Only return templates of this type, such as `product`, `page`, or `sections`.
        example: product
      - name: published
        in: query
        required: false
        schema:
          type: boolean
        description: Return the published snapshot of each template, omitting templates that have never been published.
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: Filter by template name.
        example: Paper
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApiApplicationThemeTemplatesResponse200ApplicationJsonSchema"
              example:
                templates:
                - id: 48213
                  name: Paper Product Page
                  content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  {{ product.description }}\n</section>"
                  status: active
                  themeable_type: product
                  company_id: 1405
                  variables:
                    show_breadcrumbs: true
                  created_at: '2026-09-08T14:22:31Z'
                  updated_at: '2026-09-21T16:05:47Z'
                  default: false
                  translations: {}
                  hide_navbar: false
                  use_active_application_theme: false
                  country_ids:
                  - 214
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  global: false
                  application_theme_id: 7310
                  source: theme
                  droplet_name: null
                  app_extension_id: null
                  extension_uri: null
                - id: 48214
                  name: Default Product
                  content: '{% layout ''theme'' %}

                    <h1>{{ product.title }}</h1>'
                  status: active
                  themeable_type: product
                  company_id: 1405
                  variables: {}
                  created_at: '2026-09-02T09:15:00Z'
                  updated_at: '2026-09-02T09:15:00Z'
                  default: true
                  translations: {}
                  hide_navbar: false
                  use_active_application_theme: false
                  country_ids: []
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  global: false
                  application_theme_id: 7310
                  source: theme
                  droplet_name: null
                  app_extension_id: null
                  extension_uri: null
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
      operationId: listThemeTemplates
    post:
      summary: Creates a theme template
      description: >-
        Creates a template in a theme and publishes it immediately. Pass the
        theme in the `application_theme_id` query parameter. Requires the
        `application_themes` update permission. Page types managed by a
        dedicated endpoint, such as `members_page`, are refused with 422. When
        the company has moved template stylesheets to theme-level assets, a
        request that includes `stylesheet` is also refused with 422.
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      parameters:
      - name: application_theme_id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateThemeTemplateResponse201"
              example:
                application_theme_template:
                  app_extension_id: null
                  application_theme_id: 7310
                  company_id: null
                  content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  {{ product.description }}\n</section>"
                  country_ids:
                  - 214
                  created_at: '2026-09-08T14:22:31Z'
                  default: false
                  droplet_name: null
                  extension_uri: null
                  global: false
                  hide_navbar: false
                  id: 48213
                  name: Paper Product Page
                  source: theme
                  status: active
                  stylesheet: null
                  stylesheet_tag_injected: false
                  stylesheet_column_hidden: true
                  themeable_type: product
                  translations: {}
                  updated_at: '2026-09-08T14:22:31Z'
                  use_active_application_theme: false
                  variables:
                    show_breadcrumbs: true
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '422':
          description: The `themeable_type` names a page type another endpoint owns, such as `members_page`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PostApiApplicationThemeTemplatesRequestBodyApplicationJsonSchema"
            example:
              name: Paper Product Page
              themeable_type: product
              content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  {{ product.description }}\n</section>"
              variables:
                show_breadcrumbs: true
              hide_navbar: false
              country_ids:
              - 214
      operationId: createThemeTemplate
  "/api/application_theme_templates/mysite_themes":
    get:
      summary: List all mysite themes
      description: List all mysite themes
      tags:
      - applicationthemetemplates
      operationId: listMysiteThemes
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApiApplicationThemeTemplatesResponse200ApplicationJsonSchema"
              example:
                templates:
                - id: 48302
                  name: Rep Site - Classic
                  content: '<header>{{ rep.name }}</header>

                    <main>{{ content_for_layout }}</main>'
                  status: active
                  themeable_type: mysite
                  company_id: 1405
                  variables: {}
                  created_at: '2026-09-08T14:22:31Z'
                  updated_at: '2026-09-21T16:05:47Z'
                  default: false
                  translations: {}
                  hide_navbar: false
                  use_active_application_theme: false
                  country_ids: []
                  stylesheet: '.rep-hero { color: #1f4e79; }'
                  stylesheet_tag_injected: false
                  stylesheet_column_hidden: false
                  global: false
                  application_theme_id: null
                  source: theme
                  droplet_name: null
                  app_extension_id: null
                  extension_uri: null
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
  "/api/application_theme_templates/{id}":
    get:
      summary: Retrieves a theme template
      description: |-
        Returns a theme template with details. For section templates whose schema
        declares `@theme` or named standalone block references, the response
        includes an `available_theme_blocks` array with the resolved block schemas
        (name, settings, presets). Private blocks (underscore-prefixed) are excluded
        from `@theme` results but included when explicitly referenced by name.
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApiApplicationThemeTemplatesByIdResponse200ApplicationJsonSchema"
              example:
                application_theme_template:
                  id: 48213
                  name: Paper Product Page
                  content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  {{ product.description }}\n</section>"
                  status: active
                  themeable_type: product
                  company_id: 1405
                  variables:
                    show_breadcrumbs: true
                  created_at: '2026-09-08T14:22:31Z'
                  updated_at: '2026-09-21T16:05:47Z'
                  default: false
                  translations: {}
                  hide_navbar: false
                  use_active_application_theme: false
                  country_ids:
                  - 214
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  global: false
                  application_theme_id: 7310
                  source: theme
                  droplet_name: null
                  app_extension_id: null
                  extension_uri: null
                  versions:
                  - version: 3
                    created_at: '2026-09-21T16:05:47Z'
                    published: true
                    current: true
                    author_id: 90412
                    author_name: Michael Scott
                  - version: 2
                    created_at: '2026-09-15T10:12:03Z'
                    published: false
                    current: false
                    author_id: 90415
                    author_name: Pam Beesly
                  navbar_template_id: 48190
                  footer_template_id: 48191
                  assigned_themeable_ids:
                  - 30117
                  - 30118
                  url: https://shop.dundermifflin.com/products/20lb-copy-paper?preview=true&template_id=48213
                  available_theme_blocks: []
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: The template does not exist or is a retired member login template.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      operationId: getThemeTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Updates a theme template
      description: >-
        Updates a template's attributes. Send `publish: true` to publish the
        saved changes in the same call. Requires the `application_themes` update
        permission. Global templates and templates provided by a droplet cannot
        be edited (403). Changing a template into or out of a page type managed
        by a dedicated endpoint, such as `members_page`, is refused with 422.
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApiApplicationThemeTemplatesByIdResponse200ApplicationJsonSchema"
              example:
                application_theme_template:
                  id: 48213
                  name: Paper Product Page
                  content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  {{ product.description }}\n</section>"
                  status: active
                  themeable_type: product
                  company_id: 1405
                  variables:
                    show_breadcrumbs: true
                  created_at: '2026-09-08T14:22:31Z'
                  updated_at: '2026-09-21T16:05:47Z'
                  default: false
                  translations: {}
                  hide_navbar: false
                  use_active_application_theme: false
                  country_ids:
                  - 214
                  stylesheet: null
                  stylesheet_tag_injected: true
                  stylesheet_column_hidden: true
                  global: false
                  application_theme_id: 7310
                  source: theme
                  droplet_name: null
                  app_extension_id: null
                  extension_uri: null
                  versions:
                  - version: 3
                    created_at: '2026-09-21T16:05:47Z'
                    published: true
                    current: true
                    author_id: 90412
                    author_name: Michael Scott
                  - version: 2
                    created_at: '2026-09-15T10:12:03Z'
                    published: false
                    current: false
                    author_id: 90415
                    author_name: Pam Beesly
                  navbar_template_id: 48190
                  footer_template_id: 48191
                  assigned_themeable_ids:
                  - 30117
                  - 30118
                  url: https://shop.dundermifflin.com/products/20lb-copy-paper?preview=true&template_id=48213
                  available_theme_blocks: []
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: The `themeable_type` would change the template's type into or out of a page type another endpoint owns, such as `members_page`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PatchApiApplicationThemeTemplatesByIdRequestBodyApplicationJsonSchema"
            example:
              application_theme_template:
                name: Paper Product Page
                content: "{% layout 'theme' %}\n<section class=\"product\">\n  <h1>{{ product.title }}</h1>\n  <p class=\"sku\">{{ product.sku }}</p>\n  {{ product.description }}\n</section>"
                country_ids:
                - 214
              publish: true
      operationId: updateThemeTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Deletes a theme template
      description: >-
        Deletes a template, along with any region rules that point at it. If it
        was the default for its type, another template is promoted to default.
        Requires the `application_themes` update permission. Global templates,
        droplet-provided templates, and page types managed by a dedicated
        endpoint are refused with 403; a template still referenced elsewhere
        returns 409.
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteThemeTemplateResponse200"
              example:
                message: Template was successfully destroyed.
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '403':
          description: The template is a page type another endpoint owns, such as `members_page`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
      operationId: deleteThemeTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  "/api/application_theme_templates/{id}/available_themeables":
    get:
      summary: Returns all available themeables for theme template
      description: >-
        Lists the company's records of the template's type (for example products
        or pages) that can be assigned to this template, with the template
        currently assigned to each. Records already using this template are
        listed first, then by title. Requires the `application_themes` view
        permission. Paginated with `page` and `per_page` (default 20); only
        shareable template types are supported (400 otherwise).
      tags:
      - applicationthemetemplates
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetApiApplicationThemeTemplatesByIdAvailableThemeablesResponse200ApplicationJsonSchema"
              example:
                available_themeables:
                - id: 30117
                  title: Dunder Mifflin 20lb Copy Paper
                  sku: DM-20LB-CASE
                  image: https://cdn.fluid.app/dunder-mifflin/products/20lb-copy-paper.jpg
                  themeable_type: product
                  application_theme_template_id: 48213
                - id: 30121
