  "/api/application_theme_templates/render_page":
    post:
      summary: Render a system screen in the selected member site's theme
      description: >-
        Uses the same layout, settings, localization, and GlobalEmbeds pipeline
        as template previews. The screen body is sealed and never persisted.
        Unsaved shared settings and layout overrides are accepted; screen body,
        stylesheet, variables, resource and version overrides are rejected.
        The real SDK element uses read-only sample data in the builder without
        member credentials or live member API calls. The builder displays the
        response in its preview canvas.
      tags: [applicationthemetemplates]
      operationId: renderThemeSystemScreenPage
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - "$ref": "#/components/schemas/PostApiApplicationThemeTemplatesByIdRenderPageRequestBodyApplicationJsonSchema"
              - type: object
                required: [system_screen_key, members_site_id]
                properties:
                  system_screen_key:
                    type: string
                    enum: [messaging, contacts, my-site, profile, orders, subscriptions, media, playlists]
                    description: Shipped screen key.
                  members_site_id:
                    type: integer
                    description: Site belonging to the selected theme in the authenticated company.
                  application_theme_template:
                    not:
                      anyOf:
                      - required: [content]
                      - required: [stylesheet]
                      - required: [variables]
                      - required: [use_active_application_theme]
                not:
                  anyOf:
                  - required: [id]
                  - required: [resources]
                  - required: [version]
            example:
              system_screen_key: orders
              members_site_id: 6021
              country_id: 214
              preview_audience:
                kind: sample_member
                member_type_id: 0f8e2c61-3a4b-4d7e-9b15-6c2a8d4e1f90
      responses:
        '200':
          description: Rendered HTML and styles using the selected theme
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PostApiApplicationThemeTemplatesByIdRenderPageResponse200ApplicationJsonSchema"
              example:
                liquid_content: "<main class=\"members-screen members-screen--orders\">\n  <fluid-orders></fluid-orders>\n</main>"
                html_content: "<main class=\"members-screen members-screen--orders\">\n  <fluid-orders></fluid-orders>\n</main>"
                page_stylesheet: '.members-screen { max-width: 960px; margin: 0 auto; }'
                template_stylesheet: ''
                preview_audience:
                  kind: sample_member
                  member_type_id: 0f8e2c61-3a4b-4d7e-9b15-6c2a8d4e1f90
                  matched_site_id: 6021
                  selected_site_accessible: true
                preview_url: https://dunder-mifflin.account.fluid.app/orders?member_preview_site_id=6021&preview=true
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Theme preview permission is required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '404':
          description: The site or screen is unavailable, or member storefront is disabled
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
        '422':
          description: Missing screen identity or an attempted override of its sealed body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
