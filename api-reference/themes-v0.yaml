      operationId: listThemeRegionRules
    post:
      summary: Create a sitemap country route (theme region rule)
      tags:
      - theme-region-rules
      description: |-
        Creates a sitemap country route, which the API calls a theme region rule. Country routes are the per-country overrides on the admin's Sitemap page.

        A region rule controls what visitors from one region see at a storefront route:
        a specific theme template (`redirect_type: template`), a redirect to
        `redirect_url` (`redirect`), or no page at all (`disabled`). Optionally point the
        rule at a specific resource with `resource_type` and `resource_id`.

        If `application_theme_id` is omitted, the rule is attached to your company's
        active theme. Requires a company admin or rep Bearer token with the
        `application_themes` update permission.

        This operation is an upsert keyed on theme, `route_path`, and `region_code`. When
        no matching rule exists it creates one and returns `201`. When one exists, the
        request body replaces its state and the response is `200`; omitted fields fall
        back to their defaults (`priority` 0, `active` true, `redirect_type`
        `template`). To change only some fields of an existing rule, use the update
        operation instead.
      security:
      - bearer_auth: []
      responses:
        '200':
          description: An existing rule for the same theme, route, and region was replaced
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeRegionRuleResponse"
              example:
                theme_region_rule:
                  id: 48213
                  company_id: 1405
                  application_theme_id: 7312
                  application_theme_template_id: 22904
                  route_path: products/20lb-copy-paper
                  region_code: CA
                  priority: 10
                  active: true
                  redirect_type: template
                  redirect_url:
                  description: Canadian copy paper page with metric sheet sizes
                  resource_type: Product
                  resource_id: 60318
                  route_kind: credit_prefixed
                  created_at: '2026-09-08T13:15:22Z'
                  updated_at: '2026-09-08T13:15:22Z'
                meta:
                  request_id: 5f0c9a2e-7b41-4d8e-9c36-1a2b8e4f7d90
                  timestamp: '2026-09-14T15:42:08Z'
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeRegionRuleResponse"
              example:
                theme_region_rule:
                  id: 48213
                  company_id: 1405
                  application_theme_id: 7312
                  application_theme_template_id: 22904
                  route_path: products/20lb-copy-paper
                  region_code: CA
                  priority: 10
                  active: true
                  redirect_type: template
                  redirect_url:
                  description: Canadian copy paper page with metric sheet sizes
                  resource_type: Product
                  resource_id: 60318
                  route_kind: credit_prefixed
                  created_at: '2026-09-08T13:15:22Z'
                  updated_at: '2026-09-08T13:15:22Z'
                meta:
                  request_id: 5f0c9a2e-7b41-4d8e-9c36-1a2b8e4f7d90
                  timestamp: '2026-09-14T15:42:08Z'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ThemeRegionRuleCreateRequestBodyApplicationJsonSchema"
            example:
              theme_region_rule:
                route_path: products/20lb-copy-paper
                region_code: CA
                application_theme_id: 7312
                application_theme_template_id: 22904
                priority: 10
                active: true
                redirect_type: template
                description: Canadian copy paper page with metric sheet sizes
                resource_type: Product
                resource_id: 60318
