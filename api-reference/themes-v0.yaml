  "/api/root_themes/{id}":
    patch:
      summary: Update a root theme
      description: |-
        Updates a theme your company submitted to the Fluid theme library. You can change
        its `name`, `description`, `demo_url`, and `status`. When you pass a
        `zip_file_url` that differs from the latest version's archive, any pending
        `draft` versions are marked `superseded` and a new draft version with the next
        major version number (for example `2.0`) is created for review, using
        `changelog` as its changelog. Passing the same archive URL again does not create
        a new version.

        Requires a company admin Bearer token with the `application_themes` update
        permission. You can only update themes that belong to your company; any other
        `id` returns `404`. The response carries only a confirmation message.
      tags:
      - root-themes
      operationId: updateRootTheme
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Root Theme ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeMutationResponse"
              example:
                message: New theme version has been uploaded for review
                meta:
                  request_id: 5f0c9a2e-7b41-4d8e-9c36-1a2b8e4f7d90
                  timestamp: '2026-09-14T15:42:08Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateRootThemeRequestBodyApplicationJsonSchema"
            example:
              zip_file_url: https://cdn.fluid.app/uploads/dunder-mifflin/themes/scranton-classic-2.0.zip
              changelog: Adds a Paper collection landing page and a sticky cart drawer.
              demo_url: https://shop.dundermifflin.com/collections/paper
    delete:
      summary: Delete a root theme
      description: |-
        Permanently deletes a theme your company submitted to the Fluid theme library,
        together with its versions and any theme region rules attached to it. Requires a
        company admin Bearer token with the `application_themes` update permission. You
        can only delete themes that belong to your company; any other `id` returns
        `404`. If the theme cannot be deleted, the request returns `422`.
      tags:
      - root-themes
      operationId: deleteRootTheme
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Root Theme ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeMutationResponse"
              example:
                message: Theme was successfully destroyed.
                meta:
                  request_id: 5f0c9a2e-7b41-4d8e-9c36-1a2b8e4f7d90
                  timestamp: '2026-09-14T15:42:08Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/root_themes/{id}/status":
    post:
      summary: Update a root theme status
      description: |-
        Approves or rejects one version of a theme in the Fluid theme library. Restricted
        to Fluid platform administrators; any other caller receives `403`.

        Set `approved` to `true` to publish a `draft` version, or to re-publish a
        previously `approved` version (for example, to roll back). The version moves to
        `publishing` and is imported in the background. Set `approved` to `false` to
        reject a `draft` version. Any other transition, such as rejecting an approved
        version, returns `422`. An unknown theme `id` or a `theme_version_id` that does
        not belong to the theme returns `404`.
      tags:
      - root-themes
      operationId: updateRootThemeStatus
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Root Theme ID
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ThemeMutationResponse"
              example:
                message: Theme version is being published
                meta:
                  request_id: 5f0c9a2e-7b41-4d8e-9c36-1a2b8e4f7d90
                  timestamp: '2026-09-14T15:42:08Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateRootThemeStatusRequestBodyApplicationJsonSchema"
            example:
              theme_version_id: 18961
              approved: true
