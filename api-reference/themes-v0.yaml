---
openapi: 3.1.0
info:
  title: Fluid Themes API
  version: v0
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ApplicationTheme:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - draft
          - published
          - development
          - active
          - importing
          - error
          description: Lifecycle state. `active` is the theme the storefront
            renders (at most one per company); `importing` and `error` belong to
            themes created by an import that is still running or has failed.
        source:
          type:
          - string
          - 'null'
        variables:
          anyOf:
          - type: object
            additionalProperties:
              "$ref": "#/components/schemas/JsonValue"
          - type: string
          - type: 'null'
        custom_stylesheet:
          type:
          - string
          - 'null'
          description: Deprecated theme-level custom CSS. Null when the company has moved theme stylesheets to theme-level assets; the value then lives in the theme's `styles.css` asset.
        global_stylesheet:
          type:
          - string
          - 'null'
          description: Deprecated theme-level global CSS. Null when the company has moved theme stylesheets to theme-level assets; the value then lives in the theme's `global_styles.css` asset.
        theme_stylesheet_tag_injected:
          type: boolean
          description: True when the theme's default layout renders `styles.css` and `global_styles.css` from theme-level assets.
        theme_stylesheet_columns_hidden:
          type: boolean
          description: True when the deprecated `custom_stylesheet` / `global_stylesheet` fields are hidden from this response. Use it to decide whether to show theme-level CSS editors.
        version:
          type:
          - string
          - 'null'
        company_id:
          type:
          - integer
          - 'null'
        cover_image:
          type:
          - string
          - 'null'
        outdated:
          type: boolean
        editor_url:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        default_home_template_id:
          type:
          - integer
          - 'null'
          description: ID of the theme's default active home page template. Only
            present on list responses requested with `include_default_home_template=true`.
        versions:
          type: array
          description: Edit history of the theme, newest first. Present on single-theme
            responses.
          items:
            type: object
            properties:
              version:
                type: integer
              created_at:
                type:
                - string
                - 'null'
                format: date-time
              published:
                type: boolean
                description: Whether this is the version the storefront serves.
              current:
                type: boolean
                description: Whether this is the latest edit.
              author_id:
                type:
                - integer
                - 'null'
              author_name:
                type:
                - string
                - 'null'
        application_theme_templates:
          type: array
          description: The theme's templates, including shared global templates,
            with their full Liquid content. Present on single-theme responses.
          items:
            type: object
            additionalProperties:
              "$ref": "#/components/schemas/JsonValue"
        images:
          type: array
          description: Cover images, ordered by `position`. Present on single-theme
            responses.
          items:
            type: object
            properties:
              id:
                type: integer
              url:
                type:
                - string
                - 'null'
              position:
                type:
                - integer
                - 'null'
        git_sync_repos:
          type: array
          description: Git repositories the theme is mirrored to, primary first.
            Empty when the theme has none. Present on single-theme responses.
          items:
            type: object
            properties:
              id:
                type: integer
              role:
                type:
                - string
                - 'null'
              status:
                type:
                - string
                - 'null'
              repo_full_name:
                type:
                - string
                - 'null'
              default_branch:
                type:
                - string
                - 'null'
              last_push_at:
                type:
                - string
                - 'null'
                format: date-time
              last_pull_at:
                type:
                - string
                - 'null'
                format: date-time
              status_updated_at:
                type:
                - string
                - 'null'
                format: date-time
              last_error:
                type:
                - object
                - 'null'
                additionalProperties:
                  "$ref": "#/components/schemas/JsonValue"
      required:
      - id
      - name
      - status
      - outdated
      - created_at
      - updated_at
    ApplicationThemeResource:
      type: object
      properties:
        resource_type:
          type:
          - string
          - 'null'
        resource_id:
          type:
          - integer
          - 'null'
        key:
          type: string
        content:
          anyOf:
          - type: object
            additionalProperties:
              "$ref": "#/components/schemas/JsonValue"
          - type: string
          - type: 'null'
        checksum:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      required:
      - key
      - checksum
    ApplicationThemeGitConnection:
      type: object
      description: The Git repository a theme is connected to.
      properties:
        repo_full_name:
          type: string
          description: Repository identifier, as `org/name`
          example: fluid-gitsync/theme-873
        status:
          type: string
          description: Connection state. `provisioning` means the upstream repository
            is still being created.
          enum:
          - provisioning
          - connected
          - pushing
          - error
          - disconnected
        default_branch:
          type: string
          example: main
      required:
      - repo_full_name
      - status
      - default_branch
    ApplicationThemeGitArchive:
      type: object
      description: A short-lived, pre-signed download URL for a theme version.
      properties:
        url:
          type: string
          description: Pre-signed tarball URL. Fetch it directly from the provider
            with no Authorization header.
        expires_at:
          type: string
          format: date-time
          description: After this the URL stops working and must be re-requested.
      required:
      - url
      - expires_at
    ApplicationThemeGitVersion:
      type: object
      description: One commit in a theme's published version history.
      properties:
        sha:
          type: string
          description: Full commit SHA
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        short_sha:
          type: string
          description: Abbreviated commit SHA, for display
          example: a1b2c3d
        message:
          type: string
          description: Commit message. Fluid-authored publishes name the acting user
            here.
          example: 'Ana Diaz: Publish theme Aurora (0192f4c1-8a3b-7c4d-9e2f-1a2b3c4d5e6f)'
        author_name:
          type:
          - string
          - 'null'
          description: Committing identity. For Fluid-authored publishes this is the
            Fluid GitHub App, not the person who published.
          example: mist-we-commerce[bot]
        committed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the commit was authored
          example: '2026-08-04T10:00:00Z'
        html_url:
          type:
          - string
          - 'null'
          description: Link to the commit on the Git provider
          example: https://github.com/fluid-gitsync/theme-877/commit/a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        current:
          type: boolean
          description: Whether this commit is the one the repository was last synced
            to. False for every entry when nothing has synced yet.
      required:
      - sha
      - short_sha
      - message
      - author_name
      - committed_at
      - html_url
      - current
    AvailableThemeable:
      type: object
      description: A company resource that a template can be assigned to.
      properties:
        id:
          type: integer
        slug:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        image:
          type:
          - string
          - 'null'
          description: Image URL, when the resource type has one.
        themeable_type:
          type: string
          description: The requested themeable type, lowercased.
        application_theme_template_id:
          type:
          - integer
          - 'null'
          description: Template currently assigned to this resource, if any.
    PaginationMeta:
      type: object
      properties:
        total_count:
          type: integer
        total_pages:
          type: integer
        current_page:
          type: integer
        per_page:
          type: integer
    PostApiApplicationThemeTemplatesRequestBodyApplicationJsonSchema:
      type: object
      required:
      - name
      - themeable_type
      properties:
        name:
          type: string
        themeable_type:
          type: string
        content:
          type:
          - string
          - 'null'
        stylesheet:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        translations:
          type:
          - object
          - 'null'
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        hide_navbar:
          type:
          - boolean
          - 'null'
        use_active_application_theme:
          type:
          - boolean
          - 'null'
        country_ids:
          type: array
          items:
            type: integer
    PatchApiApplicationThemeTemplatesByIdRequestBodyApplicationJsonSchema:
      type: object
      required:
      - application_theme_template
      properties:
        application_theme_template:
          "$ref": "#/components/schemas/ApplicationThemeTemplateRequest"
        publish:
          type: boolean
    GetApiApplicationThemeTemplatesByIdAvailableThemeablesResponse200ApplicationJsonSchema:
      type: object
      properties:
        available_themeables:
          type: array
          description: List of themeables that use the specified template
          items:
            type: object
            properties:
              id:
                type: integer
                description: ID of the themeable
              title:
                type:
                - string
                - 'null'
                description: Title of the themeable
              sku:
                type:
                - string
                - 'null'
                description: SKU, for themeable types that have one (products).
              image:
                type:
                - string
                - 'null'
                description: Image URL for the themeable
              themeable_type:
                type: string
                description: Type of the themeable
              application_theme_template_id:
                type:
                - integer
                - 'null'
                description: ID of the template that the themeable is assigned to
        meta:
          type: object
          description: Metadata about the request and response
          properties:
            request_id:
              type:
              - string
              - 'null'
              description: Unique identifier for the request
            timestamp:
              type:
              - string
              - 'null'
              description: Time when the request was processed
            pagination:
              "$ref": "#/components/schemas/PaginationMeta"
    PostApiApplicationThemeTemplatesByIdRenderPageResponse200ApplicationJsonSchema:
      type: object
      properties:
        liquid_content:
          type:
          - string
          - 'null'
        html_content:
          type: string
        page_stylesheet:
          type: string
          description: Stylesheet for the rendered page. Includes all the css needed by the page.
        template_stylesheet:
          type: string
          description: Stylesheet for the template itself.
        preview_audience:
          "$ref": "#/components/schemas/PreviewAudienceResponse"
        preview_url:
          type:
          - string
          - 'null'
          description: Preview URL for the rendered resource. System screens return their account-subdomain URL without a template ID or version.
        meta:
          "$ref": "#/components/schemas/Meta"
    PreviewAudienceRequest:
      description: Builder-only synthetic viewer. Does not authenticate a member.
      oneOf:
      - type: object
        additionalProperties: false
        required: [kind]
        properties:
          kind:
            type: string
            const: guest
            description: No role selected in the builder. Clears sample member context and skips preview access rules; live member access is unchanged.
      - type: object
        additionalProperties: false
        required: [kind, member_type_id]
        properties:
          kind:
            type: string
            const: sample_member
          member_type_id:
            type: string
            description: Active member-type UUID in the authenticated company.
    PreviewAudienceResponse:
      type: object
      required: [kind, member_type_id, matched_site_id, selected_site_accessible]
      properties:
        kind:
          type: string
          enum: [guest, sample_member]
        member_type_id:
          type: [string, 'null']
        matched_site_id:
          type: [integer, 'null']
          description: Site matching the sample country and member type, or null for Guest/no match.
        selected_site_accessible:
          type: [boolean, 'null']
          description: Whether the selected role matches the page's site; null for Guest (no role selected) or non-member pages. When false, html_content contains an access notice instead of the page, while liquid_content preserves the editable source.
    PostApiApplicationThemeTemplatesByIdRenderPageRequestBodyApplicationJsonSchema:
      type: object
      properties:
        preview_audience:
          "$ref": "#/components/schemas/PreviewAudienceRequest"
        resources:
          type: array
          items:
            type: object
            required:
            - id
            - type
            properties:
              id:
                type: integer
                description: ID of the resource to render
              type:
                type: string
                description: Type of the resource to render
        version:
          type: integer
        country_id:
          type:
          - integer
          - 'null'
          description: Render the page as a visitor from this active company
            country. Falls back to the company default when absent, unknown,
            inactive, or not enabled for the company. When preview_audience is
            supplied, an unavailable explicit country ID returns 404 instead;
            an omitted or null ID still uses the company default.
        language_id:
          type:
          - integer
          - 'null'
          description: Render the page in this active company language. Falls back
            to the company default when absent, unknown, inactive, or not enabled
            for the company. When preview_audience is supplied, an unavailable
            explicit language ID returns 404 instead; an omitted or null ID
            still uses the company default.
            Content not yet translated for the selected language renders its
            English version.
        navbar_template_id:
          type:
          - integer
          - 'null'
          description: Pin a specific navbar template to preview alongside this
            page. When set, the pinned template wins over the country-scoped
            auto-pick unless its own country tags exclude the preview country.
        footer_template_id:
          type:
          - integer
          - 'null'
          description: Pin a specific footer template to preview alongside this
            page. Same semantics as navbar_template_id.
        translations:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        application_theme_template:
          type: object
          properties:
            content:
              type: string
            stylesheet:
              type: string
            variables:
              type: object
              additionalProperties:
                "$ref": "#/components/schemas/JsonValue"
            hide_navbar:
              type: boolean
            use_active_application_theme:
              type: boolean
            header_content:
              type: string
            footer_content:
              type: string
            settings_data:
              type: string
            settings_schema:
              type: string
            layout_content:
              type: string
    PostApiApplicationThemeTemplatesByIdRenderSectionResponse200ApplicationJsonSchema:
      type: object
      properties:
        html_content:
          type: string
        meta:
          "$ref": "#/components/schemas/Meta"
    PutApiApplicationThemeTemplatesByIdThemeablesUpdateResponse200ApplicationJsonSchema:
      type: object
      properties:
        removed_count:
          type: integer
          description: Number of themeables unassigned from this template
        updated_count:
          type: integer
          description: Number of themeables assigned to this template
        meta:
          "$ref": "#/components/schemas/Meta"
    ImportApplicationThemeFromZipRequestBodyApplicationJsonSchema:
      type: object
      required:
      - zip_file_url
      properties:
        zip_file_url:
          type: string
          description: URL to a zip file containing a theme
        name:
          type: string
        theme_type:
          type: string
          enum:
          - fluid
          - shopify
    ThemeMutationResponse:
      type: object
      properties:
        message:
          type: string
        meta:
          "$ref": "#/components/schemas/Meta"
    UpdateApplicationThemeRequestBodyApplicationJsonSchema:
      type: object
      required:
      - application_theme
      properties:
        application_theme:
          type: object
          properties:
            name:
              type: string
              description: Name of the application theme
            description:
              type: string
              description: Description of the application theme
            status:
              type: string
              description: Status of the application theme
            active:
              type: boolean
            variables:
              type: string
              description: Theme variables in JSON format
            custom_stylesheet:
              type: string
              description: Custom CSS for the theme
            global_stylesheet:
              type: string
              description: Global CSS for the theme
            themeable_type:
              type: string
            images_attributes:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  image_url:
                    type: string
                  position:
                    type: integer
        publish:
          type: string
    PostApiApplicationThemesByIdPublishResponse404ApplicationJsonSchema:
      type: object
      properties:
        status:
          type: string
        data:
          type: object
          properties:
            error:
              type: string
    BulkDestroyFileResourcesResponse200ApplicationJsonSchema:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        meta:
          type: object
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type:
              - string
              - 'null'
            destroyed_count:
              type: integer
    BulkDestroyFileResourcesRequestBodyApplicationJsonSchema:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: integer
    DestroyFileResourceResponse200ApplicationJsonSchema:
      type: object
      properties:
        id:
          type: integer
        meta:
          "$ref": "#/components/schemas/Meta"
    CreateRootThemeRequestBodyApplicationJsonSchema:
      type: object
      required:
      - zip_file_url
      - name
      properties:
        zip_file_url:
          type: string
          description: URL for the uploaded zip file
        name:
          type: string
          description: Name of the application theme
        changelog:
          type: string
          description: Changelog for the application theme
        demo_url:
          type: string
        description:
          type: string
    UpdateRootThemeRequestBodyApplicationJsonSchema:
      type: object
      properties:
        zip_file_url:
          type: string
          description: URL for the updated zip file
        changelog:
          type: string
          description: Changelog for the application theme
        demo_url:
          type: string
        description:
          type: string
        status:
          type: string
        name:
          type: string
    UpdateRootThemeStatusRequestBodyApplicationJsonSchema:
      type: object
      required:
      - theme_version_id
      - approved
      properties:
        theme_version_id:
          type: integer
          description: ID of the theme version to set status for
        approved:
          type: boolean
          description: Approval status to set for the theme version
    GetApiThemeRegionRulesResponse200ApplicationJsonSchema:
      type: object
      properties:
        theme_region_rules:
          type: array
          items:
            "$ref": "#/components/schemas/ThemeRegionRule"
        meta:
          type: object
          properties:
            request_id:
              type:
              - string
              - 'null'
            timestamp:
              type:
              - string
              - 'null'
              format: date-time
            current_page:
              type: integer
            total_pages:
              type: integer
            total_count:
              type: integer
    ThemeRegionRule:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        application_theme_id:
          type:
          - integer
          - 'null'
        application_theme_template_id:
          type:
          - integer
          - 'null'
        route_path:
          type: string
        region_code:
          type: string
        priority:
          type: integer
        active:
          type: boolean
        redirect_type:
          type:
          - string
          - 'null'
        redirect_url:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        resource_type:
          type:
          - string
          - 'null'
        resource_id:
          type:
          - integer
          - 'null'
        route_kind:
          type: string
          enum:
          - credit_prefixed
          - non_credit
          description: Whether the route is served behind a rep credit prefix (`credit_prefixed`,
            `/<credit>/<route_path>`) or directly at `/<route_path>` (`non_credit`). Only
            custom routes can be `non_credit`.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ThemeRegionRuleRequestBodyApplicationJsonSchema:
      type: object
      required:
      - theme_region_rule
      properties:
        theme_region_rule:
          type: object
          properties:
            route_path:
              type: string
            region_code:
              type: string
            application_theme_template_id:
              type:
              - integer
              - 'null'
            priority:
              type: integer
              minimum: 0
            active:
              type: boolean
            redirect_type:
              type:
              - string
              - 'null'
            redirect_url:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
            resource_type:
              type:
              - string
              - 'null'
            resource_id:
              type:
              - integer
              - 'null'
            route_kind:
              type: string
              enum:
              - credit_prefixed
              - non_credit
              description: Whether the route is served behind a rep credit prefix (`credit_prefixed`)
                or directly at `/<route_path>` (`non_credit`). Only custom routes can be
                `non_credit`.
    ThemeRegionRuleCreateRequestBodyApplicationJsonSchema:
      type: object
      required:
      - theme_region_rule
      properties:
        theme_region_rule:
          type: object
          required:
          - route_path
          - region_code
          properties:
            route_path:
              type: string
            region_code:
              type: string
            application_theme_id:
              type:
              - integer
              - 'null'
            application_theme_template_id:
              type:
              - integer
              - 'null'
            priority:
              type: integer
              minimum: 0
            active:
              type: boolean
            redirect_type:
              type:
              - string
              - 'null'
            redirect_url:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
            resource_type:
              type:
              - string
              - 'null'
            resource_id:
              type:
              - integer
              - 'null'
            route_kind:
              type: string
              enum:
              - credit_prefixed
              - non_credit
              description: Whether the route is served behind a rep credit prefix (`credit_prefixed`)
                or directly at `/<route_path>` (`non_credit`). Only custom routes can be
                `non_credit`.
    ThemeRegionRuleResponse:
      type: object
      required:
      - theme_region_rule
      - meta
      properties:
        theme_region_rule:
          "$ref": "#/components/schemas/ThemeRegionRule"
        meta:
          "$ref": "#/components/schemas/Meta"
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
