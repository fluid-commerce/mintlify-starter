  "/api/application_themes/{application_theme_id}/resources/sync":
    post:
      summary: Commits the theme's current state as one version
      description: >-
        Called once by the CLI AFTER its per-file push loop, and the
        only thing that turns a push into a commit — the per-file
        writes themselves just mark the theme changed. This is the
        other half of check_push, which runs once before the loop.
        Omitting it is safe: the server sweeps anything left unsynced,
        so an older CLI lags by at most a sweep rather than going
        unsynced.
      tags:
      - applicationthemeresources
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Sync requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  content_version_sha:
                    type: string
                    description: >-
                      The theme's content version at the moment the sync
                      was requested. Thread forward as the next push's
                      base_sha.
                required:
                - content_version_sha
              example:
                content_version_sha: e71d04a9c35b28f6a0d9173c4be58f2a61c0d93b
                meta:
                  request_id: 4f1c2a9e-7b3d-4e8a-9c61-2d5f8a0b3e17
                  timestamp: '2026-09-22T15:04:12Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: application theme not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: Member configuration is incomplete; no sync was scheduled.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      operationId: syncThemeResources
      parameters:
      - name: application_theme_id
        in: path
        required: true
        schema:
          type: string
  "/api/application_themes/{application_theme_id}/resources/check_push":
    post:
      summary: Check a theme push before uploading
      description: >-
        Merge-aware push preflight: CLI checks its stored base_sha
        matches the server's current content_version_sha before
        starting the per-file push loop. Enforcement lives on the
        per-file PUT/DELETE too; this endpoint is UX so the CLI can
        fail fast before touching any state.
      tags:
      - applicationthemeresources
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success — base_sha matches (or was absent for force push).
          content:
            application/json:
              schema:
                type: object
                properties:
                  remote_sha:
                    type: string
                    description: Server's current content_version_sha.
                required:
                - remote_sha
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: application theme not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '409':
          description: Stale base_sha — server has advanced since last pull.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StaleBaseShaResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_sha:
                  type:
                  - string
                  - 'null'
                  description: >-
                    The content_version_sha the CLI stored on its last
                    pull. Null or blank is a force push — the server
                    skips the check and always 200s.
      operationId: checkPushThemeResources
      parameters:
      - name: application_theme_id
        in: path
        required: true
        schema:
          type: string
