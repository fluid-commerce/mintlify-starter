              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/payment-methods/three-ds/confirm":
    post:
      x-fluid-audience: member
      operationId: member_payment_methods_three_ds_confirm
      tags:
      - payment-methods
      summary: Confirm a card verification
      description: >-
        Advances the verification after any device fingerprinting or issuer challenge. Returns the saved method once approved (repeating it returns the same method), or the challenge to show. After the challenge is shown, follow it with the verification status route until `state` leaves `pending`, then confirm again to save the card. The verification is bound to the member that started it: another member's verification, or an
        unknown id, returns 404. Responses carry `Cache-Control: no-store`. Requires a writable member credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VerificationReference"
            example:
              verification_id: 6f1c2a9e-3b7d-4c58-9e21-0a4d8b7c5e13
      responses:
        '200':
          description: The approved method, or the challenge to complete.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VerificationConfirmationEnvelope"
              example:
                status: 200
                data:
                  id: 6f1c2a9e-3b7d-4c58-9e21-0a4d8b7c5e13
                  status: approved
                  created: true
                  payment_method:
                    id: 0192f501-2b3c-7d4e-8f5a-6b7c8d9e0f1a
                    kind: card
                    brand: visa
                    last4: '5555'
                    expires:
                      month: 3
                      year: 2031
                    card_holder: Casey Brooks
                    default: true
                    billing_address:
                      name: Casey Brooks
                      address1: 742 Evergreen Terrace
                      address2: null
                      city: Springfield
                      state: IL
                      postal_code: '62704'
                      country_code: US
                    created_at: '2026-07-02T19:44:10.000000Z'
                  challenge_form: null
                  challenge_url: null
                meta:
                  request_uuid: 0192f520-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  timestamp: '2026-09-30T15:20:00Z'
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The member credential can only read.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No verification of this member has this `verification_id`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: A concurrent change interrupted confirmation. Refresh the verification status and retry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The `verification_id` is missing, the membership has no payment wallet, or verification is denied, failed or pending. Verification failures include `error.details.error_code`. An expired verification without a linked payment method returns 404. A retry whose linked payment method still exists returns that method with 200, even after verification expiry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/payment-methods/three-ds/status":
    post:
      x-fluid-audience: member
      operationId: member_payment_methods_three_ds_status
      tags:
      - payment-methods
      summary: Read a card verification
      description: >-
        Reads the verification's state without changing it, including whether it has expired and the saved method once approved. This is how a member API client follows the issuer challenge: poll it after showing the challenge, until `state` leaves `pending` (`approved` once the issuer accepted it, otherwise `denied`, `timed_out` or `cancelled`), then confirm. No event stream is offered to member API clients. A POST, as the catalogue specifies. The verification is bound to the member that started it: another member's verification, or an
        unknown id, returns 404. Responses carry `Cache-Control: no-store`. Requires a writable member credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/VerificationReference"
            example:
              verification_id: 6f1c2a9e-3b7d-4c58-9e21-0a4d8b7c5e13
      responses:
        '200':
          description: The verification's state.
          headers:
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VerificationStatusEnvelope"
              example:
                status: 200
                data:
                  id: 6f1c2a9e-3b7d-4c58-9e21-0a4d8b7c5e13
                  state: pending
                  expired: false
                  payment_method_id: null
                meta:
                  request_uuid: 0192f520-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  timestamp: '2026-09-30T15:20:00Z'
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The member credential can only read.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No verification of this member has this `verification_id`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The `verification_id` is missing, or this membership has no payment wallet. Found sessions, including terminal or expired sessions, return 200.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/payment-methods/three-ds/cancel":
