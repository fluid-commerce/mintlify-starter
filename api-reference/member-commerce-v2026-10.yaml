      summary: Queue a subscription payment retry
      description: Queue an eligible past-due subscription for the existing asynchronous
        billing process. A fresh duplicate succeeds without another job. Non-past-due
        or not-yet-due subscriptions succeed with queued false; stopped recurring payments
        and exhausted cycle limits are refused. No gateway charge runs synchronously.
        The bearer fixes the member and company. State and ownership are rechecked under
