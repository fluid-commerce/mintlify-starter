  "/api/member/v2026-10/carts/{token}/claim":
    parameters:
    - name: token
      in: path
      required: true
      description: The guest cart's checkout token.
      schema:
        type: string
    post:
      x-fluid-audience: member
      operationId: member_carts_claim
      tags:
      - carts
      summary: Claim a guest cart
      description: >-
        Attach a guest cart in the member's company to the signed-in member and reprice it through checkout, which
        applies member pricing. Idempotent: claiming a cart the member already holds returns it again. Concurrent
        claims of one cart are serialized and only the first binds it. The member's other carts and their tokens are
        untouched; nothing is merged or replaced. A cart that another member holds, or that is not in the member's
        company, returns 404. Requires a writable member credential.
      responses:
        "400":
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '200':
          description: The claimed cart.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartEnvelope"
              example:
                status: 200
                data:
                  id: 0192f4e0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  token: ct_6d1f0c2a9b8e4f37
                  state: start
                  kind: regular
                  currency: USD
                  totals:
                    subtotal: '59.98'
                    discount: '0.0'
                    shipping: '7.5'
                    tax: '4.8'
                    total: '72.28'
                  created_at: '2026-09-29T16:02:11.402913Z'
                  updated_at: '2026-09-30T08:41:55.118204Z'
                  items:
                  - id: 0192f4e2-5d6e-7f80-91a2-b3c4d5e6f7a8
                    title: Daily Greens
                    variant_title: 30 servings
                    sku: DG-30
                    quantity: 2
                    subscription: false
                    unit_price: '29.99'
                    total: '59.98'
                    image_url: https://cdn.fluid.app/products/daily-greens-30.jpg
                meta:
                  request_uuid: 0192f520-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  timestamp: '2026-09-30T15:20:00Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The member credential can only read.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No claimable cart with this token in the member's company, or another member holds it.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
