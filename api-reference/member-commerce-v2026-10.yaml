---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Commerce
  description: >-
    Order and product-subscription history for the authenticated member. The bearer credential determines member and
    company; query filters cannot change either. Uses the same member credentials as the People API. Money is
    serialized as decimal strings in the enclosing currency. Order item counts and individual shipment statuses are
    not exposed because maintained source fields do not yet exist. A subscription's next-charge total (next_total,
    next_order_preview) carries the known pre-reward-points renewal charge when it can be stated from stored facts
    without pricing the renewal; it is null for current-rate, bundled, tax-inclusive, tax-exempt, audience-discount, expiring-discount
    or missing-fact subscriptions. Its subtotal is net of discounts. Authoritative saved per-line amounts are also
    exposed on the detail's items[].
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: orders
  description: The signed-in member’s own purchases and volume-credited orders.
  x-fluid-section: Members
- name: subscriptions
  description: The signed-in member’s own product subscriptions.
  x-fluid-section: Members
- name: carts
  description: The signed-in member's own carts, addressed by checkout token, and claiming a guest cart.
  x-fluid-section: Commerce
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or an opaque member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it is
        unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: max-age=60, private
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    Order:
      type: object
      description: Order summary. Item counts are not exposed until a maintained counter exists.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External order identifier.
          format: uuid
        number:
          type:
          - string
          - 'null'
          description: Human-readable order number, or null for an unnumbered historical order.
        relationship:
          type: string
          description: >-
            Own purchases are placed; other orders credited to this member are credited. Placed wins when both apply,
            including with the credited filter. An order of one of the member's contacts that the member neither placed
            nor is credited for appears only in GET /contacts/{id}/orders, as contact.
          enum:
          - placed
          - credited
          - contact
        status:
          type: string
          description: Current order lifecycle state.
          enum:
          - draft
          - pending
          - pending_review
          - processing
          - completed
          - cancelled
          - archived
        financial_status:
          type: string
          description: Current payment state.
          enum:
          - pending
          - authorized
          - partially_paid
          - paid
          - refund_pending
          - partially_refunded
          - refunded
          - voided
          - marked_free
          - marked_paid
        fulfillment_status:
          type: string
          description: Overall order fulfillment state.
          enum:
          - unfulfilled
          - in_progress
          - on_hold
          - partially_fulfilled
          - scheduled
          - fulfilled
        placed_at:
          type: string
          description: Sale time, falling back to creation time for historical orders.
          format: date-time
        currency:
          type: string
          description: ISO 4217 currency code for all amounts in this order.
          example: USD
        total:
          type: string
          description: Order total in major currency units.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '45.98'
        customer:
          type: object
          description: Stored purchaser reference and name, omitted for credited-only orders until a company visibility policy permits disclosure.
          additionalProperties: false
          properties:
            id:
              type:
              - string
              - 'null'
              description: Native member identifier; null for orders linked only through legacy customer metadata.
              format: uuid
            name:
              type:
              - string
              - 'null'
              description: Purchaser name recorded on the order.
          required:
          - id
          - name
        volume:
          type: object
          description: Commissionable and qualifying volume, omitted when the company hides customer-facing volume.
          additionalProperties: false
          properties:
            cv:
              type:
              - string
              - 'null'
              description: Commissionable volume in the order currency.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            qv:
              type:
              - string
              - 'null'
              description: Qualifying volume in the order currency.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
          required:
          - cv
          - qv
      required:
      - id
      - number
      - relationship
      - status
      - financial_status
      - fulfillment_status
      - placed_at
      - currency
      - total
    Address:
      type: object
      description: Normalized order address, with the historical JSON snapshot as fallback.
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: Recorded name.
        address1:
          type:
          - string
          - 'null'
          description: Recorded address1.
        address2:
          type:
          - string
          - 'null'
          description: Recorded address2.
        city:
          type:
          - string
          - 'null'
          description: Recorded city.
        state:
          type:
          - string
          - 'null'
          description: Recorded state.
        postal_code:
          type:
          - string
          - 'null'
          description: Recorded postal code.
        country_code:
          type:
          - string
          - 'null'
          description: Recorded country code.
        phone:
          type:
          - string
          - 'null'
          description: Recorded phone.
      required:
      - name
      - address1
      - address2
      - city
      - state
      - postal_code
      - country_code
      - phone
    LineItem:
      type: object
      description: One order line with its external identifier and stored amounts.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External order line identifier.
          format: uuid
        title:
          type:
          - string
          - 'null'
          description: Recorded product title, falling back to the current product title.
        variant_title:
          type:
          - string
          - 'null'
          description: Customer-facing variant title.
        sku:
          type:
          - string
          - 'null'
          description: Variant stock keeping unit.
        quantity:
          type: integer
          description: Ordered quantity.
        unit_price:
          type: string
          description: Stored unit price in major currency units.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '45.98'
        total:
          type: string
          description: Unit price multiplied by quantity in major currency units.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '45.98'
        image_url:
          type:
          - string
          - 'null'
          description: Variant image URL, falling back to the product image.
      required:
      - id
      - title
      - variant_title
      - sku
      - quantity
      - unit_price
      - total
      - image_url
    Shipment:
      type: object
      description: Recorded tracking information; individual shipment status is not stored and is omitted.
      additionalProperties: false
      properties:
        carrier:
          type:
          - string
          - 'null'
          description: Recorded shipping carrier.
        tracking_number:
          type:
          - string
          - 'null'
          description: Carrier tracking number.
        tracking_url:
          type:
          - string
          - 'null'
          description: Stored tracking URL, or a URL derived by the carrier integration.
      required:
      - carrier
      - tracking_number
      - tracking_url
    OrderDetail:
      type: object
      description: >-
        Accessible order detail. Credited-only orders omit buyer contact fields until a visibility policy is available.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External order identifier.
          format: uuid
        number:
          type:
          - string
          - 'null'
          description: Human-readable order number, or null for an unnumbered historical order.
        relationship:
          type: string
          description: >-
            Own purchases are placed; other orders credited to this member are credited. Placed wins when both apply,
            including with the credited filter. An order of one of the member's contacts that the member neither placed
            nor is credited for appears only in GET /contacts/{id}/orders, as contact.
          enum:
          - placed
          - credited
          - contact
        status:
          type: string
          description: Current order lifecycle state.
          enum:
          - draft
          - pending
          - pending_review
          - processing
          - completed
          - cancelled
          - archived
        financial_status:
          type: string
          description: Current payment state.
          enum:
          - pending
          - authorized
          - partially_paid
          - paid
          - refund_pending
          - partially_refunded
          - refunded
          - voided
          - marked_free
          - marked_paid
        fulfillment_status:
          type: string
          description: Overall order fulfillment state.
          enum:
          - unfulfilled
          - in_progress
          - on_hold
          - partially_fulfilled
          - scheduled
          - fulfilled
        placed_at:
          type: string
          description: Sale time, falling back to creation time for historical orders.
          format: date-time
        currency:
          type: string
          description: ISO 4217 currency code for all amounts in this order.
          example: USD
        total:
          type: string
          description: Order total in major currency units.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '45.98'
        customer:
          type: object
          description: Stored purchaser reference and name, omitted for credited-only orders until a company visibility policy permits disclosure.
          additionalProperties: false
          properties:
            id:
              type:
              - string
              - 'null'
              description: Native member identifier; null for orders linked only through legacy customer metadata.
              format: uuid
            name:
              type:
              - string
              - 'null'
              description: Purchaser name recorded on the order.
          required:
          - id
          - name
        volume:
          type: object
          description: Commissionable and qualifying volume, omitted when the company hides customer-facing volume.
          additionalProperties: false
          properties:
            cv:
              type:
              - string
              - 'null'
              description: Commissionable volume in the order currency.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            qv:
              type:
              - string
              - 'null'
              description: Qualifying volume in the order currency.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
          required:
          - cv
          - qv
        line_items:
          type: array
          description: Order lines, loaded only on the detail endpoint.
          items:
            "$ref": "#/components/schemas/LineItem"
        email:
          type:
          - string
          - 'null'
          description: Recorded purchaser email; present only for an own purchase.
        phone:
          type:
          - string
          - 'null'
          description: Recorded purchaser phone; present only for an own purchase.
        shipping_address:
          description: Shipping address or null; omitted for credited-only orders.
          oneOf:
          - "$ref": "#/components/schemas/Address"
          - type: 'null'
        billing_address:
          description: Billing address or null; omitted for credited-only orders.
          oneOf:
          - "$ref": "#/components/schemas/Address"
          - type: 'null'
        shipments:
          type: array
          description: Recorded shipment tracking information.
          items:
            "$ref": "#/components/schemas/Shipment"
        totals:
          type: object
          description: Order amounts in the enclosing order currency.
          additionalProperties: false
          properties:
            subtotal:
              type: string
              description: Order subtotal in major currency units.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            shipping:
              type: string
              description: Order shipping in major currency units.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            tax:
              type: string
              description: Order tax in major currency units.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            discount:
              type: string
              description: Order discount in major currency units.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
            total:
              type: string
              description: Order total in major currency units.
              pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
              example: '45.98'
          required:
          - subtotal
          - shipping
          - tax
          - discount
          - total
      required:
      - id
      - number
      - relationship
      - status
      - financial_status
      - fulfillment_status
      - placed_at
      - currency
      - total
      - line_items
      - shipments
      - totals
    OrderEnvelope:
      type: object
      description: One accessible order.
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          "$ref": "#/components/schemas/OrderDetail"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    OrdersEnvelope:
      type: object
      description: A page of orders.
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          type: array
          description: Matching orders on this page.
          items:
            "$ref": "#/components/schemas/Order"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
      required:
      - status
      - data
      - meta
    Subscription:
      type: object
      description: >-
        Product subscription summary. next_total carries the known pre-points renewal charge, or null when the charge
        cannot be stated without pricing the renewal (see the detail's items[] for authoritative saved line amounts).
        Discarded, missing or foreign-company catalog references suppress the preview. A discarded product cannot
        supply the product or title required for a renewal order item.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External subscription identifier.
          format: uuid
        status:
          type: string
          description: Current subscription lifecycle state.
          enum:
          - pending
          - active
          - paused
          - past_due
          - cancelled
        frequency:
          type: object
          description: How often the subscription bills, from its plan.
          additionalProperties: false
          properties:
            interval:
              type:
              - integer
              - 'null'
              description: Number of units between renewals.
            unit:
              type:
              - string
              - 'null'
              description: Interval unit, e.g. week or month.
          required:
          - interval
          - unit
        next_billing_at:
          type:
          - string
          - 'null'
          description: When the subscription next bills, or null when cancelled or paused indefinitely.
          format: date-time
        currency:
          type: string
          description: ISO 4217 currency code for this subscription's amounts.
          example: USD
        next_total:
          type:
          - string
          - 'null'
          description: >-
            The known pre-reward-points next-order total charge, or null when it cannot be stated without pricing the
            renewal (current-rate, bundled, tax-inclusive, tax-exempt, audience-discount, expiring-discount or missing-fact). Never a
            stored gross sum, which would overstate a discounted or tax-inclusive renewal.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '49.99'
        items_count:
          type:
          - integer
          - 'null'
          description: Units billed each cycle, or null when the saved quantity is unknown.
        paused_until:
          type:
          - string
          - 'null'
          description: When a paused subscription resumes billing, or null when not paused or paused indefinitely.
          format: date-time
        created_at:
          type: string
          description: When the subscription was created.
          format: date-time
      required:
      - id
      - status
      - frequency
      - next_billing_at
      - currency
      - next_total
      - items_count
      - paused_until
      - created_at
    SubscriptionItem:
      type: object
      description: One billed line of a subscription, with its authoritative saved recurring amounts.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External identifier of the subscribed variant, falling back to the subscription's own.
          format: uuid
        title:
          type:
          - string
          - 'null'
          description: Product title.
        variant_title:
          type:
          - string
          - 'null'
          description: Customer-facing variant title.
        sku:
          type:
          - string
          - 'null'
          description: Variant stock keeping unit.
        quantity:
          type:
          - integer
          - 'null'
          description: Units billed each cycle, or null when the saved quantity is unknown.
        unit_price:
          type:
          - string
          - 'null'
          description: Saved recurring price of one unit in major currency units, or null when unknown.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '49.99'
        total:
          type:
          - string
          - 'null'
          description: Saved recurring line total in major currency units, or null when price or quantity is unknown.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '99.98'
        image_url:
          type:
          - string
          - 'null'
          description: Variant image URL, falling back to the product image.
      required:
      - id
      - title
      - variant_title
      - sku
      - quantity
      - unit_price
      - total
      - image_url
    SubscriptionAddress:
      type: object
      description: The subscription's shipping destination, from its snapshot with an ActiveRecord fallback.
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: Recorded name.
        address1:
          type:
          - string
          - 'null'
          description: Recorded address1.
        address2:
          type:
          - string
          - 'null'
          description: Recorded address2.
        city:
          type:
          - string
          - 'null'
          description: Recorded city.
        state:
          type:
          - string
          - 'null'
          description: Recorded state.
        postal_code:
          type:
          - string
          - 'null'
          description: Recorded postal code.
        country_code:
          type:
          - string
          - 'null'
          description: Recorded country code.
      required:
      - name
      - address1
      - address2
      - city
      - state
      - postal_code
      - country_code
    SubscriptionPaymentMethod:
      type: object
      description: The stored payment method's presentational fields. Never a PAN or reusable credential.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External payment method identifier.
          format: uuid
        brand:
          type:
          - string
          - 'null'
          description: Card network or wallet brand.
        last4:
          type:
          - string
          - 'null'
          description: Last four digits of the stored card.
      required:
      - id
      - brand
      - last4
    SubscriptionDiscount:
      type: object
      description: An active discount attached to the subscription, with its configured value. No computed applied amount.
      additionalProperties: false
      properties:
        id:
          type: string
          description: External discount attachment identifier.
          format: uuid
        code:
          type:
          - string
          - 'null'
          description: Discount code.
        type:
          type:
          - string
          - 'null'
          description: Price discount type, e.g. flat or percentage.
        flat_value:
          type:
          - number
          - 'null'
          description: Configured flat amount, when the type is flat.
        percentage_value:
          type:
          - number
          - 'null'
          description: Configured percentage, when the type is percentage.
        duration:
          type:
          - string
          - 'null'
          description: How long the discount applies, e.g. once, repeating or forever.
      required:
      - id
      - code
      - type
      - flat_value
      - percentage_value
      - duration
    SubscriptionNextOrderPreview:
      type:
      - object
      - 'null'
      description: >-
        The known pre-reward-points next-order amounts, or null when they cannot be stated without pricing the
        renewal. See the subscription's items[] for authoritative saved line amounts.
      additionalProperties: false
      properties:
        subtotal:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          description: Next order subtotal in major currency units, net of discounts.
        shipping:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          description: Next order shipping in major currency units.
        tax:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          description: Next order tax in major currency units.
        total:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          description: Next order total in major currency units.
      required:
      - subtotal
      - shipping
      - tax
      - total
    SubscriptionDetail:
      type: object
      description: A subscription with its billed items, shipping, payment method, discounts and bundle.
      additionalProperties: false
      properties:
        auto_apply_points:
          type: boolean
          description: Whether renewal may automatically spend this member's reward points.
        id:
          type: string
          description: External subscription identifier.
          format: uuid
        status:
          type: string
          description: Current subscription lifecycle state.
          enum:
          - pending
          - active
          - paused
          - past_due
          - cancelled
        frequency:
          type: object
          description: How often the subscription bills, from its plan.
          additionalProperties: false
          properties:
            interval:
              type:
              - integer
              - 'null'
              description: Number of units between renewals.
            unit:
              type:
              - string
              - 'null'
              description: Interval unit, e.g. week or month.
          required:
          - interval
          - unit
        next_billing_at:
          type:
          - string
          - 'null'
          description: When the subscription next bills, or null when cancelled or paused indefinitely.
          format: date-time
        currency:
          type: string
          description: ISO 4217 currency code for this subscription's amounts.
          example: USD
        next_total:
          type:
          - string
          - 'null'
          description: The next order's total charge, or null when it cannot be stated without pricing the renewal.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '49.99'
        items_count:
          type:
          - integer
          - 'null'
          description: Units billed each cycle, or null when the saved quantity is unknown.
        paused_until:
          type:
          - string
          - 'null'
          description: When a paused subscription resumes billing, or null when not paused or paused indefinitely.
          format: date-time
        created_at:
          type: string
          description: When the subscription was created.
          format: date-time
        items:
          type: array
          description: The subscription's billed lines.
          items:
            "$ref": "#/components/schemas/SubscriptionItem"
        shipping_address:
          description: The subscription's shipping destination, or null.
          oneOf:
          - "$ref": "#/components/schemas/SubscriptionAddress"
          - type: 'null'
        payment_method:
          description: The stored payment method, or null when none is set.
          oneOf:
          - "$ref": "#/components/schemas/SubscriptionPaymentMethod"
          - type: 'null'
        discounts:
          type: array
          description: Active discounts attached to the subscription.
          items:
            "$ref": "#/components/schemas/SubscriptionDiscount"
        bundle:
          type: array
          description: Matching siblings from this bounded candidate page. Follow meta.bundle_pagination.next_cursor even when this array is absent; an empty candidate page can have a continuation.
          items:
            "$ref": "#/components/schemas/Subscription"
        next_order_preview:
          "$ref": "#/components/schemas/SubscriptionNextOrderPreview"
      required:
      - id
      - status
      - frequency
      - next_billing_at
      - currency
      - next_total
      - items_count
      - paused_until
      - created_at
      - items
      - shipping_address
      - payment_method
      - discounts
      - next_order_preview
      - auto_apply_points
    SubscriptionPause:
      type: object
      description: Pause indefinitely with an empty body, or choose a future date or number of upcoming orders, never both.
      additionalProperties: false
      properties:
        next_bill_date:
          type: string
          format: date
          description: Resume date after today in the subscription timezone, capped at two years for yearly plans or twelve months otherwise.
        number_of_orders:
          type: integer
          minimum: 1
          description: Upcoming cycles to skip before resuming, subject to the same future-date and horizon limits.
      not:
        required: [next_bill_date, number_of_orders]
    SubscriptionResume:
      type: object
      description: Resume a paused subscription, or waive an exhausted failed cycle using the existing recovery policy.
      additionalProperties: false
      properties:
        next_bill_date:
          type: string
          format: date
          description: Optional future local billing date with the same horizon as pause. Exhausted-cycle recovery uses its existing schedule and ignores this field.
    SubscriptionReactivate:
      type: object
      description: Reactivate a cancelled subscription, optionally confirming a saved shipping address in its existing country.
      additionalProperties: false
      properties:
        address_id:
          type: string
          format: uuid
          description: Public UUID of an owned saved address. Omission preserves the current address; country cannot change.
    SubscriptionEmptyTransition:
      type: object
      description: No transition fields are accepted. Supply an empty JSON object.
      additionalProperties: false
    SubscriptionRetryEnvelope:
      description: Fresh subscription detail with explicit asynchronous retry queue status.
      allOf:
      - "$ref": "#/components/schemas/SubscriptionEnvelope"
      - type: object
        properties:
          meta:
            type: object
            properties:
              subscription_retry:
                type: object
                additionalProperties: false
                properties:
                  queued:
                    type: boolean
                    description: True when a manual retry is pending, including accepted duplicates; false for a no-op when the subscription is not past due or not yet due.
                required: [queued]
            required: [subscription_retry]
    SubscriptionUpdate:
      type: object
      description: Safe subscription edits. Omitted fields retain their current values. References use public UUIDs.
      additionalProperties: false
      properties:
        payment_method_id:
          type: string
          format: uuid
          description: A saved payment method owned by the member or available through their shared wallet. Isolated companies require a company-local owned method.
        address_id:
          type: string
          format: uuid
          description: An owned saved address in the subscription's existing country. Country changes require cancellation and recreation.
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Units per cycle, subject to the variant's subscription quantity cap.
        next_bill_date:
          type: string
          format: date
          description: A date strictly after today in the subscription's timezone. Preserves billing time of day and aligned shipping. Maximum two years for yearly plans, twelve months otherwise.
        auto_apply_points:
          type: boolean
          description: Opt in or out of automatically applying points on renewal. Requires an actual JSON boolean.
        auto_apply_points_scope:
          type: string
          enum: [subscription, bundle]
          default: subscription
          description: Apply the points flag to this subscription or atomically to its renewal bundle. Payment and quantity edits always affect only the target. Bundle scope forbids address and date edits.
      anyOf:
      - required: [payment_method_id]
      - required: [address_id]
      - required: [quantity]
      - required: [next_bill_date]
      - required: [auto_apply_points]
      allOf:
      - if:
          properties:
            auto_apply_points_scope:
              const: bundle
          required: [auto_apply_points_scope]
        then:
          required: [auto_apply_points]
          not:
            anyOf:
            - required: [address_id]
            - required: [next_bill_date]
    SubscriptionUpdateEnvelope:
      description: Refreshed detail plus public IDs covered and changed by the edit. No-op edits have an empty changed_ids array.
      allOf:
      - "$ref": "#/components/schemas/SubscriptionEnvelope"
      - type: object
        properties:
          meta:
            type: object
            properties:
              subscription_update:
                type: object
                additionalProperties: false
                properties:
                  resolved_ids:
                    type: array
                    description: Public subscription UUIDs covered by this edit, scoped to the acting member.
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                  changed_ids:
                    type: array
                    description: Public subscription UUIDs whose saved attributes changed.
                    uniqueItems: true
                    items:
                      type: string
                      format: uuid
                required: [resolved_ids, changed_ids]
            required: [subscription_update]
    SubscriptionNextEnvelope:
      type: object
      description: The next active scheduled subscription summary, or null when none exists.
      required: [status, data, meta]
      additionalProperties: false
      properties:
        status:
          type: integer
          const: 200
        data:
          oneOf:
          - type: 'null'
          - type: object
            required: [id, plan_name, next_billing_at, next_billing_date]
            additionalProperties: false
            properties:
              id:
                type: string
                format: uuid
                description: Public subscription UUID; not a legacy subscription token.
              plan_name:
                type: [string, 'null']
                description: Name of the selected subscription plan, or null if unavailable in this company.
              next_billing_at:
                type: string
                format: date-time
                description: Scheduled billing timestamp in UTC.
              next_billing_date:
                type: string
                format: date
                description: Calendar day of the scheduled bill in the subscription's timezone.
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    SubscriptionEnvelope:
      type: object
      description: One accessible subscription.
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          "$ref": "#/components/schemas/SubscriptionDetail"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              bundle_pagination:
                type: object
                description: Continuation for the bounded sibling candidate scan.
                properties:
                  next_cursor:
                    type: [string, 'null']
                    description: Send as page[bundle_cursor] on this same detail endpoint; null when all candidates have been considered.
                required: [next_cursor]
                additionalProperties: false
            required: [bundle_pagination]
      required:
      - status
      - data
      - meta
    SubscriptionsEnvelope:
      type: object
      description: A page of subscriptions.
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          type: array
          description: The member's subscriptions on this page.
          items:
            "$ref": "#/components/schemas/Subscription"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
      required:
      - status
      - data
      - meta
    SubscriptionDiscountAttachment:
      type: object
      description: A current or removed subscription discount attachment, identified separately
        from its discount definition.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Public attachment UUID, used when removing this attachment.
          format: uuid
        subscription_id:
          type: string
          description: Public UUID of the owned subscription.
          format: uuid
        currency:
          type: string
          description: ISO currency code of this subscription.
        discount:
          type:
          - object
          - 'null'
          description: Same-company discount definition; null when unavailable.
          additionalProperties: false
          properties:
            id:
              type: string
              description: Public discount definition UUID.
              format: uuid
            code:
              type:
              - string
              - 'null'
              description: Immutable captured code, falling back to the definition for
                historical records.
          required:
          - id
          - code
        discount_version:
          type:
          - object
          - 'null'
          description: Immutable economic terms captured when this discount was attached.
          additionalProperties: false
          properties:
            version_number:
              type: integer
              description: Immutable version sequence.
            code:
              type:
              - string
              - 'null'
              description: Discount code captured in this version.
            price_discount_type:
              type: string
              description: Pricing kind captured in this version.
            flat_value:
              type:
              - string
              - 'null'
              description: Flat pricing amount as a decimal string in the subscription
                currency.
              pattern: "^-?[0-9]+(?:[.][0-9]+)?$"
            percentage_value:
              type:
              - string
              - 'null'
              description: Percentage amount as an exact decimal string.
              pattern: "^-?[0-9]+(?:[.][0-9]+)?$"
            apply_to_volume:
              type: boolean
              description: Whether this version discounts commission volume.
          required:
          - version_number
          - code
          - price_discount_type
          - flat_value
          - percentage_value
          - apply_to_volume
        duration:
          type: string
          description: Attachment duration.
          enum:
          - forever
          - once
          - repeating
        duration_cycles:
          type:
          - integer
          - 'null'
          description: Maximum applications for repeating duration; otherwise null.
        applied_cycles:
          type: integer
          description: Number of billing cycles that applied this attachment.
        starts_at:
          type: string
          description: Attachment start timestamp.
          format: date-time
        created_at:
          type: string
          description: Attachment creation timestamp.
          format: date-time
        updated_at:
          type: string
          description: Last attachment change timestamp.
          format: date-time
        removed_at:
          type:
          - string
          - 'null'
          description: Removal timestamp; null while active.
          format: date-time
        removed_reason:
          type:
          - string
          - 'null'
          description: Stored removal reason; null while active.
        removed_detail:
          type:
          - string
          - 'null'
          description: Optional removal explanation.
        notes:
          type:
          - string
          - 'null'
          description: Optional attachment notes.
        attached_via:
          type: string
          description: Source through which the attachment was created.
        attached_by:
          type:
          - object
          - 'null'
          description: Attributing actor from this company, or null when unavailable.
          additionalProperties: false
          properties:
            kind:
              type: string
              description: Actor kind.
              enum:
              - member
              - droplet_installation
            id:
              type: string
              description: Public member or installation UUID.
              format: uuid
            label:
              type:
              - string
              - 'null'
              description: Stored actor name, without an email fallback.
          required:
          - kind
          - id
          - label
      required:
      - id
      - subscription_id
      - currency
      - discount
      - discount_version
      - duration
      - duration_cycles
      - applied_cycles
      - starts_at
      - created_at
      - updated_at
      - removed_at
      - removed_reason
      - removed_detail
      - notes
      - attached_via
      - attached_by
    SubscriptionDiscountAttachmentsEnvelope:
      type: object
      description: A bounded page including active and removed attachments.
      additionalProperties: false
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          type: array
          description: Discount history on this page.
          items:
            "$ref": "#/components/schemas/SubscriptionDiscountAttachment"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
      required:
      - status
      - data
      - meta
    SubscriptionDiscountAttachmentEnvelope:
      type: object
      description: The newly attached discount.
      additionalProperties: false
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 201
        data:
          "$ref": "#/components/schemas/SubscriptionDiscountAttachment"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SubscriptionDiscountCreate:
      type: object
      description: Exactly one discount definition selector and its duration; the bearer
        supplies all ownership and actor fields.
      additionalProperties: false
      properties:
        discount_id:
          type: string
          description: Public UUID of an eligible discount definition from this company.
          format: uuid
        discount_code:
          type: string
          description: Case-insensitive discount code; use instead of discount_id. Ambiguous
            codes return 422; select a definition by discount_id instead.
          minLength: 1
        duration:
          type: string
          description: Duration of this attachment.
          enum:
          - forever
          - once
          - repeating
        duration_cycles:
          type: integer
          description: Positive cycle count, required only for repeating duration.
          minimum: 1
          maximum: 2147483647
        notes:
          type: string
          maxLength: 2048
          description: Optional attachment explanation.
      required:
      - duration
      oneOf:
      - required:
        - discount_id
        not:
          required:
          - discount_code
      - required:
        - discount_code
        not:
          required:
          - discount_id
      allOf:
      - if:
          properties:
            duration:
              const: repeating
        then:
          required:
          - duration_cycles
        else:
          not:
            required:
            - duration_cycles
    SubscriptionDiscountRemove:
      type: object
      description: Optional explanation for removing an active attachment.
      additionalProperties: false
      properties:
        removed_detail:
          type: string
          maxLength: 2048
          description: Optional removal explanation.
      required: []
    SubscriptionWaiverPreviewEnvelope:
      type: object
      description: Current waiver eligibility; ineligibility is a successful response.
      additionalProperties: false
      properties:
        status:
          type: integer
          description: HTTP response status.
          const: 200
        data:
          type: object
          description: Read-only waiver eligibility and proposed future timestamps.
          additionalProperties: false
          properties:
            eligible:
              type: boolean
              description: Whether the exhausted billing cycle can currently be waived.
            next_bill_date:
              type:
              - string
              - 'null'
              description: Proposed future billing timestamp; null when ineligible.
              format: date-time
            next_ship_date:
              type:
              - string
              - 'null'
              description: Proposed future shipping timestamp; null when ineligible.
              format: date-time
          required:
          - eligible
          - next_bill_date
          - next_ship_date
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    SubscriptionWaiverAccept:
      type: object
      description: Empty acceptance body; the server determines the next billing and shipping
        dates.
      additionalProperties: false
      properties: {}
      required: []
    CartTotals:
      type: object
      description: The cart's stored totals in its currency, as decimal strings. Nothing is recalculated on read.
      additionalProperties: false
      properties:
        subtotal:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '89.97'
        discount:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '10.0'
        shipping:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '7.5'
        tax:
          type: string
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '6.4'
        total:
          type:
          - string
          - 'null'
          description: The stored total; null while the cart has not been priced.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '93.87'
      required:
      - subtotal
      - discount
      - shipping
      - tax
      - total
    Cart:
      type: object
      description: One of the member's open carts. No count of its lines is included.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The cart's identifier.
        token:
          type:
          - string
          - 'null'
          description: >-
            The cart's checkout token: the capability the checkout surface uses to edit and pay for this cart, and the
            identifier of this cart on these routes. Only ever shown for the member's own carts, and only to a
            credential that can make changes; null for read-only member and portal JWTs.
          example: ct_6d1f0c2a9b8e4f37
        state:
          type:
          - string
          - 'null'
          description: The cart's checkout state; null for an open cart whose state was never set.
          enum:
          - start
          - products
          - payment_method
          - authorized
          - payment_captured
          - checkout_fail
          - three_ds_pending
          - null
        kind:
          type: string
          description: A regular purchase or an enrollment.
          enum:
          - regular
          - enrollment
        currency:
          type: string
          description: ISO 4217 code for every amount in the cart.
          example: USD
        totals:
          "$ref": "#/components/schemas/CartTotals"
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last change to the cart; the list is ordered by it, newest first.
      required:
      - id
      - token
      - state
      - kind
      - currency
      - totals
      - created_at
      - updated_at
    CartItem:
      type: object
      description: >-
        One line of a cart, retaining its stored quantity and prices. Live catalog
        fields are returned only when the variant and product belong to the cart's
        company. Missing or foreign catalog references return null presentation
        fields and retain the stored line title when available. Lines without a
        stored price retain null unit_price and total; a stored zero remains zero.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        title:
          type:
          - string
          - 'null'
          example: Daily Greens
        variant_title:
          type:
          - string
          - 'null'
          example: 30 servings
        sku:
          type:
          - string
          - 'null'
          example: DG-30
        quantity:
          type: integer
          minimum: 1
          example: 2
        subscription:
          type: boolean
          description: Whether this line starts a product subscription at checkout.
        unit_price:
          type:
          - string
          - 'null'
          description: Stored unit price, or null when no price is stored.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '29.99'
        total:
          type:
          - string
          - 'null'
          description: Stored unit price times quantity, or null when no price is stored.
          pattern: "^-?[0-9]+(?:\\.[0-9]+)?$"
          example: '59.98'
        image_url:
          type:
          - string
          - 'null'
      required:
      - id
      - title
      - variant_title
      - sku
      - quantity
      - subscription
      - unit_price
      - total
      - image_url
    CartDetail:
      type: object
      description: One of the member's open carts with the lines shown to the shopper.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The cart's identifier.
        token:
          type:
          - string
          - 'null'
          description: >-
            The cart's checkout token: the capability the checkout surface uses to edit and pay for this cart, and the
            identifier of this cart on these routes. Only ever shown for the member's own carts, and only to a
            credential that can make changes; null for read-only member and portal JWTs.
          example: ct_6d1f0c2a9b8e4f37
        state:
          type:
          - string
          - 'null'
          description: The cart's checkout state; null for an open cart whose state was never set.
          enum:
          - start
          - products
          - payment_method
          - authorized
          - payment_captured
          - checkout_fail
          - three_ds_pending
          - null
        kind:
          type: string
          description: A regular purchase or an enrollment.
          enum:
          - regular
          - enrollment
        currency:
          type: string
          description: ISO 4217 code for every amount in the cart.
          example: USD
        totals:
          "$ref": "#/components/schemas/CartTotals"
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last change to the cart; the list is ordered by it, newest first.
        items:
          type: array
          description: The lines shown to the shopper.
          items:
            "$ref": "#/components/schemas/CartItem"
      required:
      - items
      - id
      - token
      - state
      - kind
      - currency
      - totals
      - created_at
      - updated_at
    CartEnvelope:
      type: object
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/CartDetail"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    CartsEnvelope:
      type: object
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Cart"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
      required:
      - status
      - data
      - meta
    SubscriptionBundleCandidate:
      type: object
      description: A saved subscription line eligible for runtime grouping, not a complete bundle.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public subscription UUID used to hydrate display details.
        grouping_key:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Member- and company-scoped opaque key derived from authoritative runtime grouping facts; not a persistent bundle ID.
        next_billing_date:
          type: [string, 'null']
          format: date
          description: Scheduled calendar date in the subscription's local timezone, including null for unscheduled candidates.
        currency:
          type: [string, 'null']
          description: Currency code for the saved gross line amounts.
        quantity:
          type: [integer, 'null']
          description: Saved subscription quantity.
        unit_price:
          type: [string, 'null']
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: Saved gross unit price as a decimal string without currency-exponent rounding; not a renewal quote.
        line_total:
          type: [string, 'null']
          pattern: '^-?[0-9]+(\.[0-9]+)?$'
          description: Saved gross unit price multiplied by quantity without currency-exponent rounding or renewal adjustments; null if either source is absent.
      required: [id, grouping_key, next_billing_date, currency, quantity, unit_price, line_total]
    SubscriptionBundleCandidatesEnvelope:
      type: object
      description: One bounded fragment of candidate subscriptions; groups can span any number of pages.
      properties:
        status:
          type: integer
          const: 200
          description: HTTP response status.
        data:
          type: array
          description: Owned candidates on this page, never a claim of complete bundle membership.
          items:
            "$ref": "#/components/schemas/SubscriptionBundleCandidate"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required: [pagination]
      required: [status, data, meta]
paths:
  "/api/member/v2026-10/subscriptions/bundle-candidates":
    get:
      operationId: member_subscription_bundle_candidates_index
      x-fluid-audience: member
      tags: [subscriptions]
      summary: List runtime bundle candidates
      description: >-
        Streams the authenticated member's active, not-disabled subscriptions, including those without a billing date,
        newest created first with a stable internal tie breaker. Each page is only a fragment: clients must drain every
        page before constructing complete groups, counts or saved gross totals, and hydrate subscription UUIDs for display
        details. No complete bundle or persistent bundle ID is returned. Concurrent edits can change membership or keys;
        refresh the stream before relying on a complete grouping. Grouping follows the existing snapshot/address/customer
        fallback policy; a native profile without a legacy Customer does not introduce a new address fallback. Saved line
        amounts are not renewal quotes. Company bundling must be enabled; unsafe related references refuse the page.
        Only page[cursor] and page[limit] are accepted. Responses are private and require revalidation.
      parameters:
      - name: page[cursor]
        in: query
        description: Encrypted continuation valid for three days, bound to the member, company and fixed eligibility selection. Foreign or invalid cursors are refused.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum candidate subscriptions returned, not maximum complete bundles.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: One fragment of the owned candidate stream, or an empty page.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubscriptionBundleCandidatesEnvelope"
              example:
                status: 200
                data:
                - id: 01983a21-7b23-7123-8123-123456789abc
                  grouping_key: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  next_billing_date: '2026-11-01'
                  currency: USD
                  quantity: 2
                  unit_price: '40.0'
                  line_total: '80.0'
                meta:
                  request_uuid: 01983a21-7b23-7123-8123-123456789abd
