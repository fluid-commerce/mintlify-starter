      summary: Show one of the member’s subscriptions
      description: Returns one subscription the member owns, with its billed items, shipping
        address, payment method, active discounts, and the sibling subscriptions it bills
        with. next_order_preview carries the known pre-points renewal amounts or null;
        authoritative saved line amounts are on items[]. The payment method and address
        are fenced to the member and company. Authentication runs before conditional cache
        handling. Responses are private with a zero-second freshness lifetime requiring revalidation. Each response
        considers at most 100 sibling candidates using the existing grouping rules. Follow
        meta.bundle_pagination.next_cursor as page[bundle_cursor] until null, including
        responses without matching bundle entries. Every page repeats the root subscription
        detail.
      parameters:
      - name: id
        in: path
        required: true
        description: External subscription UUID.
        schema:
          type: string
          format: uuid
      - name: page[bundle_cursor]
        in: query
