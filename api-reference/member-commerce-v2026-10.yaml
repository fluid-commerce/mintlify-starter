  "/api/member/v2026-10/subscriptions":
    get:
      operationId: member_subscriptions_index
      tags:
      - subscriptions
      summary: List the signed-in member’s product subscriptions
      description: Returns the member's own subscriptions, newest by creation time first,
        with internal ID as the stable tie breaker. Optional filters preserve the member storefront
        status buckets and literal product-title or plan-name search. No whole-history counts
        are returned. Only page[cursor] and page[limit] pagination is supported; undeclared
        query parameters are refused. next_total carries
        the known pre-points renewal charge or null. Responses are private and must be
        revalidated.
      parameters:
      - name: filter[status]
        in: query
        description: >-
          Storefront bucket: active includes active, pending and past_due; inactive includes
          paused and cancelled. paused and cancelled select only that exact status.
          Omit to include every status.
        schema:
          type: string
          enum: [active, inactive, paused, cancelled]
      - name: filter[q]
        in: query
        description: >-
          Case-insensitive literal substring of the product title or subscription plan name.
          Percent, underscore and backslash are literal characters. The query must contain a
          non-whitespace character; omit this filter for an unfiltered list. Only names
          belonging to the member's company can match.
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\u0000]*$'
      - name: page[cursor]
        in: query
        description: Encrypted next-page cursor, valid for three days. Changing member
          ownership restarts at the first page, including when filters change. Within the same
          member scope, changing status or search filters invalidates the cursor; restart
          without it. Search case changes preserve the cursor.
        schema:
          type: string
      - name: page[limit]
        in: query
        description: Maximum number of subscriptions returned.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: A page of the member's subscriptions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubscriptionsEnvelope"
              example:
                status: 200
                data: []
                meta:
                  request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de'
                  timestamp: '2026-10-01T12:00:00Z'
                  pagination:
                    next_cursor:
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '304':
          description: The authenticated member representation matches If-None-Match.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: Malformed, tampered, expired or differently filtered cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Unsupported parameter or invalid filter or page value.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
      x-fluid-audience: member
