  "/api/member/v2026-10/subscriptions/bundle":
    post:
      operationId: member_subscriptions_bundle
      x-fluid-audience: member
      tags:
      - subscriptions
      summary: Align selected product subscriptions atomically
      description: >-
        Requires a writable member credential; legacy URL-carried JWTs are read-only. All responses use
        Cache-Control: private, no-store. Align two to one hundred distinct subscriptions owned by the authenticated member onto one bill date
        and, for physical subscriptions, one owned address. The company must enable subscription bundling.
        Existing currency, country, digital/physical, date-cap and billing-cycle rules apply. All selected
        writes and audit notes roll back together on failure. Omitted rep selection preserves existing
        attribution; subscriptions with mixed, unavailable or ambiguous reps are refused. Rep changes are
        not supported by this endpoint. The selected subscriptions must already share a rep or all be unassigned.
        A shared existing timezone takes precedence over the requested timezone, matching the bundle lifecycle.
        The response confirms only the selected subscriptions; it is not a complete runtime bundle listing
        and introduces no persisted bundle identifier. No other subscription is modified.
        Alignment saves schedule fields and any requested address while preserving subscription status, matching the existing
        bundle writer. A cancelled selection remains cancelled and cannot renew; this operation does not reactivate it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - subscription_ids
              - next_bill_date
              properties:
                subscription_ids:
                  type: array
                  minItems: 2
                  maxItems: 100
                  uniqueItems: true
                  description: Distinct public UUIDs of the member's selected subscriptions. UUID comparison ignores case.
                  items:
                    type: string
                    format: uuid
                next_bill_date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  description: Calendar bill date in the resolved bundle timezone; cannot be in the past.
                address_id:
                  type: string
                  format: uuid
                  description: Public UUID of an owned address. Required for physical subscriptions; omit for digital subscriptions.
                timezone:
                  type: string
                  maxLength: 255
                  description: IANA timezone used when the selected subscriptions do not already share one.
                  example: America/Los_Angeles
            example:
              subscription_ids:
              - '019a23a4-9211-71bf-8fa5-a5f31a82a0d1'
              - '019a23a4-9211-71bf-8fa5-a5f31a82a0d2'
              next_bill_date: '2026-10-15'
              address_id: '019a23a4-9211-71bf-8fa5-a5f31a82a0d3'
              timezone: America/Los_Angeles
      responses:
        '200':
          description: Every selected subscription was aligned successfully. Only the selected subscriptions are returned.
          content:
            application/json:
              schema:
                type: object
                required: [status, data, meta]
                additionalProperties: false
                properties:
                  status:
                    type: integer
                    const: 200
                    description: HTTP success status.
                  data:
                    type: array
                    minItems: 2
                    maxItems: 100
                    description: Explicitly selected subscriptions and their persisted billing instants.
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, next_billing_at]
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: Public subscription UUID.
                        next_billing_at:
                          type: string
                          format: date-time
                          description: Persisted billing instant, anchored to the chosen date in the bundle timezone.
                  meta:
                    "$ref": "#/components/schemas/ResponseMeta"
              example:
                status: 200
                data:
                - id: '019a23a4-9211-71bf-8fa5-a5f31a82a0d1'
                  next_billing_at: '2026-10-15T19:00:00Z'
                - id: '019a23a4-9211-71bf-8fa5-a5f31a82a0d2'
                  next_billing_at: '2026-10-15T19:00:00Z'
                meta:
                  request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de'
                  timestamp: '2026-10-01T12:00:00Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 401
                error:
                  message: A member credential is required
                  details: {error: unauthorized}
                meta: {request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de', timestamp: '2026-10-01T12:00:00Z'}
        '403':
          description: The member credential is read-only.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 403
                error:
                  message: This credential cannot make changes
                  details: {error: forbidden}
                meta: {request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de', timestamp: '2026-10-01T12:00:00Z'}
        '404':
          description: At least one selected subscription is missing or not owned by this member.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 404
                error:
                  message: The requested resource could not be found
                  details: {error: not_found}
                meta: {request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de', timestamp: '2026-10-01T12:00:00Z'}
        '409':
          description: A concurrent ownership or reference write prevents safe alignment. No selected subscription was changed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 409
                error:
                  message: Subscription reference ownership changed; try again
                  details: {}
                meta: {request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de', timestamp: '2026-10-01T12:00:00Z'}
        '422':
          description: Invalid fields, unavailable address, disabled bundling or a bundle policy refusal. No partial writes occur.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
              example:
                status: 422
                error:
                  message: Selected subscriptions must already share the same volume rep
                  details: {subscription_ids: [Selected subscriptions must already share the same volume rep]}
                meta: {request_uuid: '019a23a4-9211-71bf-8fa5-a5f31a82a0de', timestamp: '2026-10-01T12:00:00Z'}
  "/api/member/v2026-10/subscriptions/{id}":
    get:
      operationId: member_subscriptions_show
      tags:
