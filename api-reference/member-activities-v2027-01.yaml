---
openapi: 3.1.0
info:
  title: Fluid Member API v2027-01 — Activities
  description: 'The signed-in member''s activity feed. v2027-01 adds each activity''s page (the URL visited, its title and image, and the resource it shows) and the actor''s picture and contact details; every other field, filter and operation is as in v2026-10, which keeps serving the earlier shape. The member and company come from the bearer credential alone, which is resolved exactly as v2026-10 resolves it.

    '
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2027-01
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: activities
  description: The signed-in member's activity feed and unread count.
  x-fluid-section: People
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, an opaque member token, or a verified One Auth identity
        access token for a non-impersonated rep or shopper. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while it is unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: max-age=60, private
  schemas:
    ActivitiesEnvelope:
      type: object
      description: One page of the activity feed.
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Activity"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
            required:
            - pagination
      required:
      - status
      - data
      - meta
    Activity:
      type: object
      description: One item in the member's feed.
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Public activity id.
        kind:
          type: string
          enum:
          - abandoned_cart
          - announcements
          - cart_items_added
          - comment_reply
          - direct_message
          - new_lead
          - order_placed
          - page_views
          - page_views_contact
          - tasks
          - upcoming_event
          - video
          - video_started
          - video_complete
          - video_complete_contact
          - video_contact
          - message_received
          - message_sent
          - new_cart_items_added
          - smart_link_clicked
          - review_left
          - cart_item_removed
          - comment_like
          - emoji_reaction
          - media_views
          - enrollment
          - external_order
          - imported
          - cart_abandoned
          - fantasy_point
          - other
          description: The activity type. Types written before this list existed are reported as `other`.
        occurred_at:
          type: string
          format: date-time
          description: When the activity happened (UTC).
        read:
          type: boolean
          description: Whether the member has read it.
        summary:
          type:
          - string
          - 'null'
          description: One rendered line, stored in the language the activity was written in.
        subject:
          oneOf:
          - "$ref": "#/components/schemas/ActivitySubject"
          - type: 'null'
          description: The record the activity is about; null when it is not an order, media item or contact in this company.
        actor:
          oneOf:
          - "$ref": "#/components/schemas/ActivityActor"
          - type: 'null'
          description: The contact who caused it; null when there is none.
        page:
          oneOf:
          - "$ref": "#/components/schemas/ActivityPage"
          - type: 'null'
          description: The page that was viewed or the link that was followed; null for an activity that names no URL.
      required:
      - id
      - kind
      - occurred_at
      - read
      - summary
      - subject
      - actor
      - page
    ActivityActor:
      type: object
      description: 'Who caused the activity, where it is one of the member''s contacts. `email` and `phone` are the contact''s own, and null for a credential that cannot read contacts: the shopper session JWT that order and subscription email links carry, or a membership outside the rep tier (a customer or preferred customer).'
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - contact
          description: What the actor is.
        id:
          type: string
          format: uuid
          description: Public id of the actor.
        name:
          type:
          - string
          - 'null'
          description: Actor's display name.
        email:
          type:
          - string
          - 'null'
          format: email
          description: The contact's email; null when there is none or the credential cannot read contacts.
        phone:
          type:
          - string
          - 'null'
          description: The contact's phone number; null when there is none or the credential cannot read contacts.
        avatar_url:
          type:
          - string
          - 'null'
          description: The contact's picture, where they have one.
      required:
      - kind
      - id
      - name
      - email
      - phone
      - avatar_url
    ActivityEnvelope:
      type: object
      description: One activity.
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/Activity"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    ActivityRead:
      type: object
      description: 'Activities to mark read: give exactly one of `ids` or `before`.'
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Public ids of activities to mark read. Ids outside the member's feed are ignored.
        before:
          type: string
          format: date-time
          description: Mark every unread activity that occurred at or before this time.
      required: []
      minProperties: 1
      maxProperties: 1
    ActivitySubject:
      type: object
      description: The record an activity is about, resolved through the member's current ownership and visibility scopes.
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - order
          - media
          - contact
          description: What the subject is.
        id:
          type: string
          format: uuid
          description: Public id of the subject.
        title:
          type:
          - string
          - 'null'
          description: Display title.
        image_url:
          type:
          - string
          - 'null'
          description: Image, where the subject has one.
        url:
          type:
          - string
          - 'null'
          description: Reserved for a link to the subject; null today.
      required:
      - kind
      - id
      - title
      - image_url
      - url
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    UnreadCount:
      type: object
      description: The member's unread activity count.
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
          description: Unread activities in this company.
      required:
      - count
    UnreadCountEnvelope:
      type: object
      description: The unread activity count.
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/UnreadCount"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - data
      - meta
    ActivityResource:
      type: object
      additionalProperties: false
      description: The resource a visited page shows, resolved within the member's company. A Site resolves only when it is the company's or the member's own.
      properties:
        kind:
          type: string
          enum:
          - product
          - media
          - post
          - library
          - page
          - promotion
          - enrollment_pack
          - category
          - collection
          - site
          description: What the resource is.
        id:
          type: string
          format: uuid
          description: Public id of the resource.
        title:
          type:
          - string
          - 'null'
          description: Display title.
        slug:
          type:
          - string
          - 'null'
          description: The resource's slug (a Site's handle).
        image_url:
          type:
          - string
          - 'null'
          description: The resource's cover image, where it has one.
      required:
      - kind
      - id
      - title
      - slug
      - image_url
    ActivityPage:
      type: object
      additionalProperties: false
      description: 'The page behind a page view or a share link click: the URL as the visitor''s browser reported it, and the resource Fluid matched to it, from the URL or from the share link the visitor followed.'
      properties:
        url:
          type: string
          description: "The visited page's address: scheme, host and port, and the path only when it is /<section>/<slug> or /sites/<handle> (behind /home or nothing) and the slug is that of the resource Fluid matched to the page; any other path is /. The query, fragment and user info are left out. A tracked URL is the visitor's to write and can carry a share token, cart token or another credential."
        title:
          type:
          - string
          - 'null'
          description: The page's title as the browser reported it, else the resource's.
        image_url:
          type:
          - string
          - 'null'
          description: The resource's cover image from Fluid's records, or null. The og:image a visitor's browser reported is never returned, since it can be a signed URL holding a credential.
        resource:
          oneOf:
          - "$ref": "#/components/schemas/ActivityResource"
          - type: 'null'
          description: The resource the page shows; null when Fluid could not match one.
      required:
      - url
      - title
      - image_url
      - resource
paths:
  "/api/member/v2027-01/activities":
    get:
      summary: List the member's activity feed
      description: The member's activities in this company, newest first, keyset-paginated on (occurred_at, id). Activities stored without a company are not included. Subjects and actors are resolved in one query per kind, never per row. The ETag covers the page; the list is not cached (`max-age=0`).
      operationId: member_v202701_activities_index
      tags:
      - activities
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from a previous response.
        schema:
          type: string
      - name: filter[kind]
        in: query
        required: false
        description: Only activities of this kind.
        schema:
          type: string
          enum:
          - abandoned_cart
          - announcements
          - cart_items_added
          - comment_reply
          - direct_message
          - new_lead
          - order_placed
          - page_views
          - page_views_contact
          - tasks
          - upcoming_event
          - video
          - video_started
          - video_complete
          - video_complete_contact
          - video_contact
          - message_received
          - message_sent
          - new_cart_items_added
          - smart_link_clicked
          - review_left
          - cart_item_removed
          - comment_like
          - emoji_reaction
          - media_views
          - enrollment
          - external_order
          - imported
          - cart_abandoned
          - fantasy_point
          - other
        example: order_placed
      - name: filter[read]
        in: query
        required: false
        description: "`false` lists unread activities; `true` lists read ones."
        schema:
          type: boolean
        example: false
      - name: filter[since]
        in: query
        required: false
        description: Only activities at or after this time.
        schema:
          type: string
          format: date-time
        example: '2026-09-01T00:00:00Z'
      - name: page[cursor]
        in: query
        required: false
        description: Opaque cursor from `meta.pagination.next_cursor`. A cursor issued for other filters, another sort or another member restarts at the first page; a malformed, tampered or expired one (older than three days) returns 400.
        schema:
          type: string
      - name: page[limit]
        in: query
        required: false
        description: Page size. Defaults to 25, at most 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        example: 25
      responses:
        '200':
          description: One page of the feed.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ActivitiesEnvelope"
              example:
                status: 200
                data:
                - id: '01934f2a-7b1c-7d3e-8f4a-5b6c7d8e9f10'
                  kind: page_views_contact
                  occurred_at: '2026-09-29T18:42:07.123456Z'
                  read: false
                  summary: Sam Rivera visited Glow Night RSVP
                  subject:
                  actor:
                    kind: contact
                    id: '0192f3d1-6a2b-7c3d-8e4f-5a6b7c8d9e01'
                    name: Jordan Lee
                    email: sam@example.com
                    phone: "+15555550100"
                    avatar_url:
                  page:
                    url: https://shop.example.com/sites/glow-night
                    title: Glow Night RSVP
                    image_url: https://cdn.example.com/sites/glow-night/cover.png
                    resource:
                      kind: site
                      id: '01934f2a-7b1c-7d3e-8f4a-5b6c7d8e9f01'
                      title: Glow Night RSVP
                      slug: glow-night
                      image_url: https://cdn.example.com/sites/glow-night/cover.png
                - id: '0192f4a1-2b3c-7d4e-9f5a-6b7c8d9e0f12'
                  kind: order_placed
                  occurred_at: '2026-09-29T18:42:07.123456Z'
                  read: false
                  summary: Jordan Lee placed an order
                  subject:
                    kind: order
                    id: '0192f4a0-1c2d-7e3f-8a4b-5c6d7e8f9a01'
                    title: 'Order #10482'
                    image_url:
                    url:
                  actor:
                    kind: contact
                    id: '0192f3d1-6a2b-7c3d-8e4f-5a6b7c8d9e01'
                    name: Jordan Lee
                    email: sam@example.com
                    phone: "+15555550100"
                    avatar_url:
                  page:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
                  pagination:
                    next_cursor:
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: The pagination cursor is malformed, tampered with or expired.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: A query parameter is not valid, such as an unknown kind or a `page[limit]` outside 1 to 100.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2027-01/activities/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of one of the member's activities.
      schema:
        type: string
        format: uuid
    get:
      summary: Show one activity
      description: One activity from the member's feed. Another member's activity, a missing one and a malformed id all return 404. Privately cacheable with revalidation on every read.
      operationId: member_v202701_activities_show
      tags:
      - activities
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from a previous response.
        schema:
          type: string
      responses:
        '200':
          description: The activity.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ActivityEnvelope"
              example:
                status: 200
                data:
                  id: '0192f4a1-2b3c-7d4e-9f5a-6b7c8d9e0f12'
                  kind: order_placed
                  occurred_at: '2026-09-29T18:42:07.123456Z'
                  read: false
                  summary: Jordan Lee placed an order
                  subject:
                    kind: order
                    id: '0192f4a0-1c2d-7e3f-8a4b-5c6d7e8f9a01'
                    title: 'Order #10482'
                    image_url:
                    url:
                  actor:
                    kind: contact
                    id: '0192f3d1-6a2b-7c3d-8e4f-5a6b7c8d9e01'
                    name: Jordan Lee
                    email: sam@example.com
                    phone: "+15555550100"
                    avatar_url:
                  page:
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No activity in the member's feed has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2027-01/activities/read":
    post:
      summary: Mark activities read
      description: Marks unread activities read, either by up to 100 public ids or every activity at or before a time. Ids outside the member's feed are ignored rather than reported, so the call reveals nothing about other members. Returns the unread count afterwards, read from the maintained counter. The user's legacy activity badge is refreshed too. The call is all-or-nothing. When another request holds a selected unread activity or the counters it feeds, nothing is marked and the call returns 409, so a success never hides an unread activity that was selected and eligible. Retry the same request.
      operationId: member_v202701_activities_read
      tags:
      - activities
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ActivityRead"
            example:
              ids:
              - '0192f4a1-2b3c-7d4e-9f5a-6b7c8d9e0f12'
      responses:
        '200':
          description: The unread count after marking.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnreadCountEnvelope"
              example:
                status: 200
                data:
                  count: 4
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The valid member credential is read-only (a member JWT, or a portal JWT minted read-only).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: Neither or both of `ids` and `before`, more than 100 ids, a malformed id, or an unknown field.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '400':
          description: The request body is not valid JSON.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '409':
          description: A selected unread activity, or a counter it feeds, is locked or changed concurrently. No activity was marked read; retry the same request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: Historical unread state is awaiting background reconciliation; no changes were committed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2027-01/activities/unread":
    get:
      summary: Count unread activities
      description: The member's unread activity count in this company, read from a counter that database triggers maintain for every writer. A reconciled counter is read in one query. Historical state awaiting background reconciliation returns 503 without scanning history. Empty new scopes use a bounded existence check. Privately cacheable with revalidation on every read.
      operationId: member_v202701_activities_unread
      tags:
      - activities
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: ETag from a previous response.
        schema:
          type: string
      responses:
        '200':
          description: The unread count.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnreadCountEnvelope"
              example:
                status: 200
                data:
                  count: 5
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-09-30T15:08:21Z'
        '304':
          description: The representation is unchanged; authentication and ownership are checked before this response.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing or unusable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The credential belongs to a sandbox test company that cannot be reached now, because sandbox access is turned off for its live company or the live company was deleted.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '503':
          description: Historical unread state is awaiting background reconciliation.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
