      operationId: genealogy_placements_removed
      summary: Deliver genealogy placements removed
      description: 'Sent after a member lifecycle removal commits to the URL configured
        in the company webhook subscription. The seat, its placement history and
        its queued proposals are erased in the same transaction, so the receipt
        resolves to the tree and the snapshot carries the erased placement_id.
        Deduplicate using placement_id. strategy says whether children were
        adopted by the removed seat''s parent, made roots, or absent. Automated
        purges carry actor: null. This is an outgoing notification, not an API
        route.'
      requestBody:
        required: true
        content:
