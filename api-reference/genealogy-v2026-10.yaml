webhooks:
  genealogy_placements_added:
    post:
      operationId: genealogy_placements_added
      summary: Deliver genealogy placements added
      description: 'Sent after a seat''s first placement in a tree commits, to the
        URL configured in the company webhook subscription. It is sent per seat:
        each additional position of a member in a matrix tree is its own seat,
        with its own node and placement. It covers placements
        by an admin, enrollment seating, a held seat placed by hand or by the
        holding tank expiry job (source holding_tank_expiry), and replica seats
        asserted by a back office. Deferring a member sends nothing until its
        held seat is placed. The receipt resolves to the tree, so the delivery
        still arrives if the seat is removed before it is sent; the snapshot
        carries placement_id. Delivery retries may repeat the same fact:
        deduplicate using placement_id. Automated placements carry actor: null.
        This is an outgoing notification, not an API route.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlacementAddedWebhookPayload"
            examples:
              recorded:
                summary: Recorded first placement delivered to the subscribed URL
                value:
                  actor:
                    type: user
                  event: added
                  resource: genealogy_placements
                  company_id: 965188060
                  event_name: genealogy_placements_added
                  schema_hash: 3c9d7a51e2b84f60a1d5c7e9f2b0a4d6c8e1f3a5b7d9c0e2f4a6b8d0c2e4f6a8
                  resource_name: Genealogy::Tree
                  schema_version: 1.0.0
                  genealogy_placement:
                    leg: left
                    reason: New enrollment
                    source: admin
                    node_id: 01a08946-61c9-7579-8c15-12ef5cdef077
                    tree_id: 7096ad49-7117-53f6-8f7f-4805473d14c5
                    actor_id: c29f580e-15c2-5fe1-afd2-398a3340e5e0
                    position: 0
                    member_id: 423f3c52-5440-5955-8e53-e2050d0b86b6
                    actor_type: Company::Admin
                    company_id: 965188060
                    effective_at: '2026-09-30T02:04:46.297557Z'
                    placement_id: 01a08946-61da-7fd4-b414-d21ae8fa54e3
