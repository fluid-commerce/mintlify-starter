          const: 200
        nodes:
          type: array
          maxItems: 1000
          items:
            "$ref": "#/components/schemas/CurrentNode"
        meta:
          allOf:
          - "$ref": "#/components/schemas/Meta"
          - type: object
            required: [pagination]
            properties:
              pagination:
                "$ref": "#/components/schemas/DirectPagePagination"
    RoleIdsPageResponse:
      type: object
      required: [status, node, ids, meta]
      additionalProperties: false
      properties:
        node:
          "$ref": "#/components/schemas/CurrentNode"
