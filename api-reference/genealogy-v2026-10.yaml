  "/api/company/v2026-10/genealogy/nodes/{id}/ancestors":
    get:
      tags: [Genealogy reads]
      summary: Page the ancestor chain root first
      description: >-
        Requires company admin access and members.view under the existing permission aliases.
        Returns the visible chain from the component root down to the subject's parent, excluding
        the subject, ordered root first. A root succeeds with an empty chain. Ancestors order by
        parent-pointer distance and remain available for any tree kind because they do not read
        leg ordering; leg-valued child/sibling pages carry their own unilevel admission. Only
        cursor, limit, and as_of query parameters are accepted; body, history, filters, and other
        selectors are refused. limit defaults to 100 and caps pages at 1,000; a cursor requires limit. Cursors
        bind company, tree, anchor, operation, member scope, and timestamp. as_of reads recorded
        placements whose validity contains the timestamp; an explicit as_of omits current counts.
        Missing or discarded subjects and timestamps with no recorded chain return 404; invalid
        ancestry, malformed cursors, and read-deadline failures return 422. This endpoint does not
        activate or populate a tree.
      operationId: readCompanyGenealogyAncestorsPage
      parameters:
      - in: path
        name: id
        required: true
        description: Existing node UUID in the authenticated company.
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        description: Opaque forward cursor returned by this same lookup; requires limit.
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        description: Maximum ancestors in this page; may change between pages.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: as_of
        description: Read recorded placements containing this instant; omit for current state. Intervals include their start and exclude their end.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Ordered ancestors root first and forward pagination metadata; an empty chain succeeds.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AncestorPageResponse"
              example:
                status: 200
                nodes: []
                meta:
                  request_uuid: null
                  timestamp: '2026-09-16T00:00:00Z'
                  pagination:
                    cursor: null
                    next_cursor: null
                    limit: 100
                    ordering: distance_desc
        '401':
          description: Credentials are missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company member-read permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The subject is unavailable, including malformed IDs, or no recorded chain exists; error.details.type is record_missing or placement_missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: error.details.type identifies unsupported_selectors, invalid_cursor, invalid_ancestry, or lookup_too_large.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
