        Requires company admin access and members.view. Resolves the source member's primary
        seat in the company's enrollment-role tree, then pages its kept direct children.
        The target tree must be unilevel; the source tree may have any kind. Missing source,
        role, or target seat returns record_missing. The node field identifies the resolved
        target seat even when nodes is empty. Nodes are selected in UUID order before LIMIT.
        Only cursor, limit, and ids_only query selectors are accepted; history, depth, body
        selectors, and member-scope role browsing are unsupported. Signed cursors bind the source and
        operation plus the resolved target seat; a changed role/seat invalidates continuation.
        Current visibility and target ancestry are rechecked on every page. Pages are not a
        frozen snapshot. This read does not populate trees or change legacy sponsor semantics.
      operationId: readCompanyGenealogyPersonallyEnrolledPage
      parameters:
      - in: path
        name: id
        required: true
        description: Existing node UUID in the authenticated company.
        schema:
          type: string
          format: uuid
      - in: query
        name: cursor
        description: Opaque forward cursor returned by this same lookup.
        schema:
          type: string
          minLength: 1
      - in: query
        name: limit
        description: Maximum nodes in this page; may change between pages.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: ids_only
        description: When true, return the same ordered page as an ids array instead of node objects.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Ordered current nodes and forward pagination metadata; an empty group succeeds.
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/RolePageResponse"
                - "$ref": "#/components/schemas/RoleIdsPageResponse"
              example:
                status: 200
                node:
                  id: '7096ad49-7117-53f6-8f7f-4805473d14c5'
                  tree_id: '7096ad49-7117-53f6-8f7f-4805473d14c6'
                  member_id: '7096ad49-7117-53f6-8f7f-4805473d14c7'
                  parent_node_id: null
                  leg: null
                  position: 0
                  pinned: false
                nodes: []
                meta:
                  request_uuid: null
                  timestamp: '2026-09-14T00:00:00Z'
                  pagination:
                    cursor: null
                    next_cursor: null
                    limit: 100
                    ordering: node_id_asc
        '401':
          description: Credentials are missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company member-read permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The anchor is unavailable; error.details.type is record_missing.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Invalid selectors, invalid_cursor, unsupported_tree_kind, invalid_ancestry, or lookup_too_large.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  responses:
    RateLimited:
      description: The bearer credential has made more than 120 write requests to the member API
        in the current minute. Wait `retry_after` seconds before retrying; nothing was changed.
      headers:
        X-RateLimit-Limit:
          description: The writes allowed per minute.
          schema:
            type: string
            example: '120'
        X-RateLimit-Remaining:
          description: The writes left in the current minute; always `0` on this response.
          schema:
            type: string
            example: '0'
        X-RateLimit-Reset:
          description: The time the current minute ends and the limit lifts.
          schema:
            type: string
            example: '2026-10-06 19:17:00 UTC'
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/RateLimitError"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Company admin or company service token, subject to developer permissions.
    memberBearer:
      type: http
      scheme: bearer
      description: A member credential for the member's own team — a member or customer session JWT, or a member's user token. Company service tokens are refused.
