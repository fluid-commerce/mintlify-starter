  "/api/company/v2026-10/genealogy/nodes/{id}/move":
    post:
      tags:
      - Genealogy moves
      summary: Request a company genealogy move
      description: Requires a persisted company admin identity and members.manage
        (or users.update). Service tokens cannot provide an audited human move actor.
        HTTP move admission is disabled unless the company is explicitly included
        in GENEALOGY_MOVE_COMPANY_IDS after migration prerequisites are satisfied.
        Return 200 only when applied or unchanged, and 202 with a human approval request
        or durable full-validation job. Clients cannot request unbounded synchronous
        execution. No legacy sponsor-axis value is changed by this endpoint. The example
        uses illustrative fixture IDs. Substitute records visible to your authenticated
        company or member.
      operationId: requestCompanyGenealogyMove
      parameters:
      - name: id
        in: path
        required: true
        description: Moving node identifier in the authenticated company and permitted
          team.
        schema:
          type: string
          format: uuid
        example: 01a08945-0cb7-7748-b66d-358cdca923b6
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional client key that makes the request safe to retry. The
          first request with a key is evaluated and its outcome recorded; a retry
          with the same key and the same proposal replays that outcome, with the
          resource's current state, instead of moving again. The same key with a
          different proposal is refused with 409 idempotency_key_reused. Keys are
          scoped to the authenticated actor and tree; failed requests record nothing.
          While moves are paused for the company the request returns 503 without
          reading or recording the key, so retry it later with the same key.
          A recorded outcome is kept for at least 24 hours and then removed by an
          hourly cleanup; until it is removed the same key still replays it, and
          only after removal is the key evaluated as a new request. Retry within
          24 hours to be sure of a replay.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^[!-~]+$"
        example: 3f1e8c0a-2b7d-4c1e-9a55-6e2f0b7d1c42
      requestBody:
        required: true
        description: An explicit unilevel move proposal. Actor and source are derived
          from authentication.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MoveProposal"
            example:
              move:
                parent_node_id: '019f0100-0000-7000-8000-000000000002'
                reason: Correct the team placement
