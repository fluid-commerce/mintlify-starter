                    parent_member_id: d96dec6b-07b3-5c76-bf43-5d9fedf54914
      responses:
        '200':
          description: The subscriber accepts the recorded notification.
  genealogy_placements_moved:
    post:
      operationId: genealogy_placements_moved
      summary: Deliver genealogy placements moved
      description: 'Sent after the recorded transaction commits to the URL configured
        in the company webhook subscription. Delivery retries may repeat the same
        fact: deduplicate using the placement ID, or the request/job ID and transition.
