    get:
      tags: [Genealogy reads]
      summary: Answer a current two-node relation
      description: >-
        Requires company admin access and members.view aliases. Both nodes must be visible
        in the same company and tree. Unavailable nodes return 404 rather than false.
        Strict ancestry excludes self; subtree membership includes self. root_of includes
        the root itself. sibling_of follows the common-parent convention, including self
        and separate roots; sibling set reads separately exclude self. Historical, paging,
        expansion, and body selectors are not accepted. Reads do not require move admission.
      operationId: readCompanyGenealogyRelation
      parameters:
      - in: path
        name: id
        required: true
        description: Left-hand node UUID in the authenticated company.
        schema: {type: string, format: uuid}
      - in: query
        name: other
        required: true
        description: Right-hand node UUID in the same tree. For within_downline, this is the root.
        schema: {type: string, format: uuid}
      - in: query
        name: kind
        required: true
        description: Directional relation from the path node to other.
        schema:
          type: string
          enum: [ancestor_of, descendant_of, parent_of, child_of, sibling_of, root_of, indirect_of, in_subtree_of, within_downline]
      responses:
        '200':
          description: The Boolean answer for two available nodes.
          content:
            application/json:
