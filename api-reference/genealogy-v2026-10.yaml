            "$ref": "#/components/schemas/CurrentNode"
        meta:
          allOf:
          - "$ref": "#/components/schemas/Meta"
          - type: object
            required: [pagination]
            properties:
              pagination:
                "$ref": "#/components/schemas/DirectPagePagination"
    DirectIdsPageResponse:
      type: object
      required: [status, ids, meta]
      additionalProperties: false
      properties:
        status:
          type: integer
          const: 200
        ids:
          type: array
          maxItems: 1000
          description: Ordered node ids for this page, sharing the node page's coordinates and ordering.
          items:
            type: string
            format: uuid
        meta:
          allOf:
          - "$ref": "#/components/schemas/Meta"
          - type: object
            required: [pagination]
            properties:
              pagination:
