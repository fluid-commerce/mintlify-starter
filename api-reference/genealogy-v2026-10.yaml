                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company read permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: One or both nodes are unavailable in this company and tree.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: The selector or ancestry is invalid, or the read exceeded its deadline.
