      required: [node]
      properties:
        node:
          type: object
          additionalProperties: false
          required: [member_id]
          properties:
            member_id:
              type: string
              format: uuid
              description: Kept member of the authenticated company.
            parent_node_id:
              type: [string, 'null']
              format: uuid
              description: The parent seat, or where a rule's search starts. Null for a
                root seat; required with a rule other than exact and defer; must be
                null with defer.
            leg:
              type: [string, 'null']
              description: One of the tree's leg_names under parent_node_id. Not sent with
                a rule other than exact.
            position:
              type: integer
              minimum: 0
              maximum: 2147483647
              description: Seat position; above 0 only in a matrix tree that allows
                multiple positions. Defaults to 0.
            rule:
              type: [string, 'null']
              enum: [exact, first_empty, left, right, inside, outside, balanced, weak_leg, strong_leg, enroller_preference, defer, null]
              description: Placement rule; defer places the member in the holding tank.
            reason:
              type: [string, 'null']
              maxLength: 2000
              description: Optional explanation recorded on the placement. Not
                sent with the rule defer, which records no placement; send it when
                the held seat is placed.
