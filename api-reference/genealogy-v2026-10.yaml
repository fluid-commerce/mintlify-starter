---
openapi: 3.1.0
info:
  title: Genealogy trees and recorded history
  version: 2026-10
  description: 'Company-owned tree definitions and recorded relationships. A node
    is one member''s seat in a tree; a placement records its parent during a half-open
    time interval. The node shows the current relationship, while the placement journal
    supports as-of reads. Member history is always restricted by current team scope.
    Moves take effect at server time: an immediate/no-op outcome returns 200, while
    an approval request or deferred job returns 202 with a receipt. Large previews
    return validation_incomplete until the full check runs in a worker; they do not
    authorize a write. HTTP move submission and approval require explicit company
    admission after migration checks. The examples use fixture identities, never usable
    authentication tokens. Outgoing webhook snapshots describe the recorded transition
    even if a receipt changes later.'
servers:
- url: https://api.fluid.app
  description: Fluid API
tags:
- name: Genealogy trees
  description: Configure the company tree registry and explicit ownership declarations.
- name: Genealogy history
  description: Read recorded relationships under current company or member authorization.
- name: Genealogy moves
  description: Preview and request current-time genealogy moves.
- name: Genealogy reads
  description: Read current relationships from existing company-owned nodes.
- name: Genealogy placement
  description: Place members in binary and matrix trees and manage their holding tank.
security:
- bearerAuth: []
paths:
  "/api/company/v2026-10/genealogy/trees":
    get:
      tags:
      - Genealogy trees
      summary: List tree definitions
      description: Company admin access is required. Writes require developer.update.
        Droplet installation tokens are not supported. This registry API does not
        place or move members. Default role trees cannot be removed or have their
        role cleared. The example uses illustrative fixture IDs. Substitute records
        visible to your authenticated company or member.
      operationId: listGenealogyTrees
      responses:
        '200':
          description: List tree definitions.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TreeList"
              examples:
                recorded:
                  summary: List tree definitions.
                  value:
                    trees:
                    - allow_multiple_positions: false
                      authority: unconfigured
                      created_at: '2026-09-10T03:03:10Z'
                      default_placement_rule: under_enroller
                      external_integration_market_id:
                      holding_tank_days: 0
                      id: 9b7310f6-6dac-5a77-9726-21c9fade457a
                      key: enrollment
                      kind: unilevel
                      leg_names: []
                      lock_version: 0
                      max_depth: 300
                      max_movement_levels: 0
                      movement_approval: immediate
                      movement_window_days: 0
                      name: Enrollment
                      owning_company_integration_id:
                      role: enrollment
                      updated_at: '2026-09-10T03:03:10Z'
                      upstream_tree_ref:
                      volume_key:
                      volume_on_move:
                    - allow_multiple_positions: false
                      authority: unconfigured
                      created_at: '2026-09-10T03:03:10Z'
                      default_placement_rule: mirror_enrollment
                      external_integration_market_id:
                      holding_tank_days: 0
                      id: 7096ad49-7117-53f6-8f7f-4805473d14c5
                      key: placement
                      kind: unilevel
                      leg_names: []
                      lock_version: 0
                      max_depth: 300
                      max_movement_levels: 0
                      movement_approval: immediate
                      movement_window_days: 0
                      name: Placement
                      owning_company_integration_id:
                      role: sponsor
                      updated_at: '2026-09-10T03:03:10Z'
                      upstream_tree_ref:
                      volume_key:
                      volume_on_move:
                    status: 200
                    meta:
                      request_uuid:
                      timestamp: '2026-09-10T03:03:17Z'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company admin tier or developer permission is missing, or a
            droplet installation token was supplied.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
      x-codeSamples:
      - lang: Shell
        label: List tree definitions
        source: |-
          curl -X GET 'https://api.fluid.app/api/company/v2026-10/genealogy/trees' \
            -H 'Authorization: Bearer <company-token>'
    post:
      tags:
      - Genealogy trees
      summary: Add a tree definition
      description: Company admin access is required. Writes require developer.update.
        Droplet installation tokens are not supported. This registry API does not
        place or move members. Default role trees cannot be removed or have their
        role cleared. The example uses illustrative fixture IDs. Substitute records
        visible to your authenticated company or member.
      operationId: addGenealogyTree
      responses:
        '201':
          description: Add a tree definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TreeResponse"
              examples:
                recorded:
                  summary: Add a tree definition.
                  value:
                    tree:
                      allow_multiple_positions: false
                      authority: unconfigured
                      created_at: '2026-09-10T03:03:17Z'
                      default_placement_rule: exact
                      external_integration_market_id:
                      holding_tank_days: 0
                      id: 01a08945-0695-7e9b-80d5-76cd56d540e4
                      key: service-team
                      kind: unilevel
                      leg_names: []
                      lock_version: 0
                      max_depth: 300
                      max_movement_levels: 0
                      movement_approval: immediate
                      movement_window_days: 0
                      name: Service Team
                      owning_company_integration_id:
                      role:
                      updated_at: '2026-09-10T03:03:17Z'
                      upstream_tree_ref:
                      volume_key:
                      volume_on_move:
                    status: 201
                    meta:
                      request_uuid:
                      timestamp: '2026-09-10T03:03:17Z'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company admin tier or developer permission is missing, or a
            droplet installation token was supplied.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '422':
          description: Invalid input or a required ownership, volume or role rule
            was violated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Tree key or role already exists, or the supplied version is
            stale.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        description: Tree definition fields. Ownership must be declared explicitly
          on creation.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateTree"
            example:
              tree:
                key: team
                name: Sales Team
                kind: unilevel
                authority: unconfigured
            examples:
              recorded:
                summary: Add a tree definition
                value:
                  tree:
                    key: service-team
                    name: Service Team
                    kind: unilevel
                    authority: unconfigured
      x-codeSamples:
      - lang: Shell
        label: Add a tree definition
        source: |-
          curl -X POST 'https://api.fluid.app/api/company/v2026-10/genealogy/trees' \
            -H 'Authorization: Bearer <company-token>' \
            -H 'Content-Type: application/json' \
            --data \{\"tree\":\{\"key\":\"service-team\",\"name\":\"Service\ Team\",\"kind\":\"unilevel\",\"authority\":\"unconfigured\"\}\}
  "/api/company/v2026-10/genealogy/trees/{id}":
    patch:
      tags:
      - Genealogy trees
      summary: Modify a tree definition
      description: Company admin access is required. Writes require developer.update.
        Droplet installation tokens are not supported. This registry API does not
        place or move members. Default role trees cannot be removed or have their
        role cleared. The example uses illustrative fixture IDs. Substitute records
        visible to your authenticated company or member.
      operationId: modifyGenealogyTree
      responses:
        '200':
          description: Modify a tree definition.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TreeResponse"
              examples:
                recorded:
                  summary: Modify a tree definition.
                  value:
                    tree:
                      allow_multiple_positions: false
                      authority: unconfigured
                      created_at: '2026-09-10T03:03:10Z'
                      default_placement_rule: under_enroller
                      external_integration_market_id:
                      holding_tank_days: 0
                      id: 9b7310f6-6dac-5a77-9726-21c9fade457a
                      key: enrollment
                      kind: unilevel
                      leg_names: []
                      lock_version: 2
                      max_depth: 300
                      max_movement_levels: 0
                      movement_approval: immediate
                      movement_window_days: 0
                      name: Enrollment
                      owning_company_integration_id:
                      role: enrollment
                      updated_at: '2026-09-10T03:03:17Z'
                      upstream_tree_ref:
                      volume_key:
                      volume_on_move:
                    status: 200
                    meta:
                      request_uuid:
                      timestamp: '2026-09-10T03:03:17Z'
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company admin tier or developer permission is missing, or a
            droplet installation token was supplied.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '422':
          description: Invalid input or a required ownership, volume or role rule
            was violated.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Tree key or role already exists, the supplied version is stale,
            or the tree has nodes and the change is structural. Only the name of an
            occupied tree can change; details.type is tree_has_nodes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '404':
          description: No tree with this identifier belongs to this company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        required: true
        description: Tree definition fields. Ownership must be declared explicitly
          on creation.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateTree"
            example:
              tree:
                name: Sales Team
                lock_version: 0
            examples:
              recorded:
                summary: Modify a tree definition
                value:
                  tree:
                    lock_version: 1
                    allow_multiple_positions: false
                    volume_key:
      parameters:
      - in: path
        name: id
        required: true
        description: Identifier of a tree owned by the authenticated company.
        schema:
          type: string
          format: uuid
        example: 9b7310f6-6dac-5a77-9726-21c9fade457a
      x-codeSamples:
      - lang: Shell
        label: Modify a tree definition
        source: |-
          curl -X PATCH 'https://api.fluid.app/api/company/v2026-10/genealogy/trees/9b7310f6-6dac-5a77-9726-21c9fade457a' \
            -H 'Authorization: Bearer <company-token>' \
            -H 'Content-Type: application/json' \
            --data \{\"tree\":\{\"lock_version\":1,\"allow_multiple_positions\":false,\"volume_key\":null\}\}
    delete:
      tags:
      - Genealogy trees
      summary: Remove a custom tree definition
      description: Company admin access is required. Writes require developer.update.
        Droplet installation tokens are not supported. This registry API does not
        place or move members. Default role trees cannot be removed or have their
        role cleared. The example uses illustrative fixture IDs. Substitute records
        visible to your authenticated company or member.
      operationId: removeGenealogyTree
      responses:
        '204':
          description: Remove a custom tree definition.
        '401':
          description: Missing or invalid credentials.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company admin tier or developer permission is missing, or a
            droplet installation token was supplied.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: No tree with this identifier belongs to this company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: The supplied version is stale, or the tree still has nodes.
            Remove the tree's nodes first; details.type is tree_has_nodes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: The required default role tree cannot be removed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      parameters:
      - in: path
        name: id
        required: true
        description: Identifier of a tree owned by the authenticated company.
        schema:
          type: string
          format: uuid
        example: 9ccee984-60ae-5a87-9dcd-5a624e691f57
      - in: query
        name: lock_version
        required: true
        description: Version last read; prevents removing a definition changed by
          another request.
        schema:
          type: integer
          minimum: 0
        example: 1
      x-codeSamples:
      - lang: Shell
        label: Remove a custom tree definition
        source: |-
          curl -X DELETE 'https://api.fluid.app/api/company/v2026-10/genealogy/trees/9ccee984-60ae-5a87-9dcd-5a624e691f57?lock_version=1' \
            -H 'Authorization: Bearer <company-token>'
  "/api/company/v2026-10/genealogy/trees/{tree_id}/nodes":
    get:
      tags: [Genealogy reads]
      summary: Resolve a member's primary seat in a tree
      description: >-
        Company admin access and members.view aliases are required. member_id is
        mandatory in this initial lookup slice; omitting it does not scan the tree.
        Resolve only position zero for a kept member in the authenticated company.
        Missing trees, members, or seats return 404. Paging, expansion, historical,
        position, and body selectors are not accepted. No tree or seat is created.
      operationId: resolveCompanyGenealogyMemberNode
      parameters:
      - in: path
        name: tree_id
        required: true
        description: Existing tree UUID in the authenticated company.
        schema: {type: string, format: uuid}
      - in: query
        name: member_id
        required: true
        description: Kept member UUID whose primary seat is requested.
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: The member's current primary node in this tree.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SeatLookupResponse"
              example:
                status: 200
                node:
                  id: 019e5b8a-4c10-7000-8000-000000000001
                  tree_id: 7096ad49-7117-53f6-8f7f-4805473d14c5
                  member_id: 019e5b8a-4c10-7000-8000-000000000002
                  parent_node_id: null
                  leg: null
                  position: 0
                  pinned: false
                meta: {request_uuid: null, timestamp: '2026-09-14T00:00:00Z'}
        '401':
          description: Credentials are missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company read permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The tree, member, or primary seat is unavailable in this company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: The lookup selectors are invalid or the read exceeded its deadline.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      tags: [Genealogy placement]
      summary: Place a member in a binary or matrix tree
      description: >-
        Requires a persisted company admin identity and members.manage (or
        users.update); droplet tokens are not supported. The company must be
        enabled for legged trees (legged_trees_not_enabled otherwise), and the
        tree must be binary or matrix: unilevel trees, including the default
        enrollment and sponsor trees, are seated from enrollment and refuse this
        request with unsupported_tree_kind. Name the slot with parent_node_id
        and leg, or send a rule with the parent_node_id its search starts from:
        first_empty, left and right are supported; inside, outside and balanced
        fail with rule_not_confirmed, enroller_preference with
        preference_not_available, and weak_leg and strong_leg with
        volume_not_available. Rule searches never place below a discarded
        member's seat: first_empty skips it, and left or right stop above it
        (no_open_leg). The rule defer takes no parent and places the member in
        the tree's holding tank, returning the held seat with held_until. The
        placing admin is recorded on the placement. The example uses
        illustrative IDs.
      operationId: addCompanyGenealogyTreeNode
      parameters:
      - in: path
        name: tree_id
        required: true
        description: Binary or matrix tree UUID in the authenticated company.
        schema: {type: string, format: uuid}
        example: 7096ad49-7117-53f6-8f7f-4805473d14c5
      requestBody:
        required: true
        description: The member to place and either the slot or a placement rule.
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PlacementRequest"
            example:
              node:
                member_id: 019e5b8a-4c10-7000-8000-000000000002
                parent_node_id: 019e5b8a-4c10-7000-8000-000000000001
                rule: first_empty
                reason: New enrollment
      responses:
        '201':
          description: The member's new seat, placed or held in the holding tank.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlacedNodeResponse"
              example:
                status: 201
                node:
                  id: 019e5b8a-4c10-7000-8000-000000000003
                  tree_id: 7096ad49-7117-53f6-8f7f-4805473d14c5
                  member_id: 019e5b8a-4c10-7000-8000-000000000002
                  parent_node_id: 019e5b8a-4c10-7000-8000-000000000001
                  leg: left
                  position: 0
                  pinned: false
                  held_until: null
                meta: {request_uuid: null, timestamp: '2026-09-29T00:00:00Z'}
        '401':
          description: Credentials are missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: A company admin identity with member management permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The tree, member or parent seat is unavailable in this company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: The member already has a seat at that position (already_placed),
            the leg is taken (leg_full), the parent is in the holding tank
            (parent_held), or concurrent placements took the resolved legs
            (placement_busy); retry after reading current state.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Invalid parameters, a missing or unknown leg (leg_required,
            leg_unknown), a refused rule, a tree without a holding tank
            (holding_tank_disabled), no free leg within the depth limit
            (no_open_leg, max_depth_exceeded), a parent below a discarded member's
            seat (parent_member_discarded), or a tree or company that does not
            accept placements (unsupported_tree_kind, legged_trees_not_enabled,
            tree_unconfigured, tree_is_replica).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      x-codeSamples:
      - lang: Shell
        label: Place a member by the first empty leg
        source: |-
          curl -X POST 'https://api.fluid.app/api/company/v2026-10/genealogy/trees/7096ad49-7117-53f6-8f7f-4805473d14c5/nodes' \
            -H 'Authorization: Bearer <company-token>' \
            -H 'Content-Type: application/json' \
            --data \{\"node\":\{\"member_id\":\"019e5b8a-4c10-7000-8000-000000000002\",\"parent_node_id\":\"019e5b8a-4c10-7000-8000-000000000001\",\"rule\":\"first_empty\"\}\}
  "/api/company/v2026-10/genealogy/trees/{tree_id}/holding-tank":
    get:
      tags: [Genealogy placement]
      summary: List the seats waiting in a tree's holding tank
      description: >-
        Company admin access and members.view (or users.view) are required;
        droplet tokens are not supported. Returns seats placed with the rule
        defer that no one has placed yet, the soonest due first; seats of
        discarded members are not listed. Once held_until has passed, the expiry
        job, which runs every 15 minutes, places the seat with the tree's default
        rule below the tree's first placed root. It only does so when that
        default is first_empty, left or right and the tree has a placed root;
        otherwise, or when the placement is refused, the seat stays held until
        it is placed with the place endpoint. Reads use the primary database.
        The example uses illustrative IDs.
      operationId: listCompanyGenealogyHoldingTank
      parameters:
      - in: path
        name: tree_id
        required: true
        description: Tree UUID in the authenticated company.
        schema: {type: string, format: uuid}
        example: 7096ad49-7117-53f6-8f7f-4805473d14c5
      - in: query
        name: limit
        required: false
        description: Page size from 1 to 100; defaults to 25.
        schema: {type: integer, minimum: 1, maximum: 100}
        example: 25
      - in: query
        name: cursor
        required: false
        description: Opaque cursor from a previous page.
        schema: {type: string}
      responses:
        '200':
          description: One page of held seats with cursor metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HoldingTankPage"
              example:
                status: 200
                nodes:
                - id: 019e5b8a-4c10-7000-8000-000000000004
                  tree_id: 7096ad49-7117-53f6-8f7f-4805473d14c5
                  member_id: 019e5b8a-4c10-7000-8000-000000000005
                  position: 0
                  held_until: '2026-10-06T00:00:00.000000Z'
                meta:
                  request_uuid: null
                  timestamp: '2026-09-29T00:00:00Z'
                  pagination: {cursor: null, limit: 25, prev_cursor: null, next_cursor: null}
        '401':
          description: Credentials are missing or invalid.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '403':
          description: Company read permission is required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthError"
        '404':
          description: The tree is unavailable in this company.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: Invalid paging parameters or a cursor this listing did not issue
            (invalid_cursor).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      x-codeSamples:
      - lang: Shell
        label: List the holding tank
        source: |-
          curl 'https://api.fluid.app/api/company/v2026-10/genealogy/trees/7096ad49-7117-53f6-8f7f-4805473d14c5/holding-tank?limit=25' \
            -H 'Authorization: Bearer <company-token>'
  "/api/company/v2026-10/genealogy/nodes/{id}":
    get:
      tags:
      - Genealogy history
      summary: Read recorded relationship for company access
      description: Company admin tier and members.view (or users.view) permission
        are required. Droplet tokens are not supported. Returns only recorded relationships;
        historical rank, volume and profile values are not inferred. Reads use the
        primary database. The example uses illustrative fixture IDs. Substitute records
        visible to your authenticated company or member.
        Omitting as_of also returns children_count, downline_count, and counts_as_of in the
        same database observation. Counts include retained structural seats belonging to
        discarded members, so they can exceed the visible page lists. Current subjects must
        have a kept member; missing or discarded subjects return 404. Explicit as_of reads
        omit counts; historical counts are not inferred. A current read can return 422
        lookup_too_large on timeout or counter_inconsistent for a negative complete balance.
      operationId: readCompanyGenealogyRelationship
      parameters:
      - name: id
        in: path
        required: true
        description: Node identifier in the authenticated company.
        schema:
          type: string
          format: uuid
        example: 01a08944-f0a6-7977-9ea8-6a9d8245340f
      - name: as_of
        in: query
        description: Read the placement containing this instant; omit for the current
          placement. Intervals include their start and exclude their end.
        schema:
          type: string
          format: date-time
        example: '2026-09-10T03:03:11.782708Z'
      responses:
        '200':
          description: Recorded relationship.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CurrentOrHistoricalRelationshipResponse"
              examples:
                recorded:
                  summary: Recorded relationship.
                  value:
                    node:
                      id: 01a08944-f0a6-7977-9ea8-6a9d8245340f
                      effective_at: '2026-09-10T03:03:11.782708Z'
                      ended_at: '2026-09-10T03:03:12.000000Z'
                      leg:
                      member_id: d96dec6b-07b3-5c76-bf43-5d9fedf54914
                      parent_node_id: 01a08944-f09e-75ca-a913-0bfab6c7bd9d
