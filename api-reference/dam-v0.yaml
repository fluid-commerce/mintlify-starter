---
openapi: 3.1.0
info:
  title: Fluid Dam API
  version: v0
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type:
          - string
          - 'null'
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    OperationInProgressResponse:
      type: object
      description: >-
        An identical request under this operation key is still running, or already completed. The
        producer never runs twice under one admission; `operation` references the recorded outcome
        when it exists.
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
          enum: [conflict]
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        operation:
          type: object
          description: Present when this operation key already completed.
          required: [status, provider_reference]
          properties:
            status:
              type: string
              enum: [completed]
            provider_reference:
              type:
              - string
              - 'null'
              description: The provider resource or operation identity the completed work was recorded under.
        meta:
          "$ref": "#/components/schemas/Meta"
    BillingAdmissionUnavailableResponse:
      type: object
      description: >-
        Billing admission could not be recorded, so the producer did not run. This is not a
        refusal: missing or unreadable evidence is not proof of debt, and the operation may be
        retried.
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          type: string
          enum: [service unavailable]
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
    BillingRefusalResponse:
      type: object
      description: >-
        Billing admission refused this operation before it could cost anything. The merchant's
        standing is lapsed, the tier's grace has closed, and a warning was delivered with the
        approved lead-in. Recovery is at recovery_path; nothing here names a bank account, a
        waiver, or an actor.
      required:
      - error_message
      - errors
      - billing_unresolved
      - meta
      properties:
        error_message:
          type: string
          enum: [billing_unresolved]
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        billing_unresolved:
          type: object
          required: [error, tier, state, episode_id, condition_id, eligible_since, recovery_path]
          properties:
            error: { type: string, enum: [billing_unresolved] }
            tier: { type: string, enum: [immediate, short_grace, long_grace], description: The tier that refused. }
            state: { type: string, description: The derived standing state, lapsed when refusing. }
            episode_id: { type: [string, "null"], format: uuid, description: The open enforcement episode. }
            condition_id: { type: [string, "null"], format: uuid, description: The condition whose grace and delivered warning made the tier eligible. }
            eligible_since: { type: [string, "null"], format: date-time, description: When the tier became eligible for that condition. }
            recovery_path: { type: string, description: Where the merchant settles the balance or updates the payment method. }
        meta:
          "$ref": "#/components/schemas/Meta"
    CreateDamAssetRequestBodyMultipartFormDataSchema:
      type: object
      properties:
        billing_admission_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The admission a bytes preflight recorded; the create adopts and settles it.
        asset:
          type: object
          properties:
            file:
              type: string
              format: binary
            name:
              type: string
            description:
              type:
              - string
              - 'null'
            tags:
              type:
              - string
              - 'null'
          required:
          - file
          - name
          additionalProperties: false
        text_asset:
          type: object
          properties:
            text:
              type: string
            mime_type:
              type: string
            file_name:
              type: string
            name:
              type:
              - string
              - 'null'
            tags:
              type:
              - string
              - 'null'
          required:
          - text
          - mime_type
          - file_name
          additionalProperties: false
        placeholder_asset:
          type: object
          properties:
            mime_type:
              type: string
            name:
              type:
              - string
              - 'null'
          required:
          - mime_type
          additionalProperties: false
        skip_autotagging:
          type: boolean
      oneOf:
      - required:
        - asset
      - required:
        - text_asset
      - required:
        - placeholder_asset
      additionalProperties: false
    CreateDamUploadPreflightRequestBodyApplicationJsonSchema:
      type: object
      description: The declared identity of the bytes about to be uploaded.
      required: [file_name, file_size, content_type]
      properties:
        operation_key:
          type: string
          maxLength: 255
          description: The client's stable key for this upload across retries.
        file_name:
          type: string
          maxLength: 255
        file_size:
          type: integer
          minimum: 1
          maximum: 2147483648
        content_type:
          type: string
          maxLength: 255
        source:
          type: string
          enum: [multipart, json, external]
        asset_code:
          type: string
          maxLength: 255
    CreateDamUploadPreflightResponse201ApplicationJsonSchema:
      type: object
      description: The admission recorded before any byte is consumed.
      required: [admission, meta]
      properties:
        admission:
          type: object
          required: [id, operation_key, expires_at]
          properties:
            id: { type: string, format: uuid }
            operation_key: { type: string }
            expires_at: { type: string, format: date-time }
        meta:
          "$ref": "#/components/schemas/Meta"
    CreateDamImagekitAuthRequestBodyApplicationJsonSchema:
      type: object
      properties:
        asset_id:
          description: ID of the placeholder DAM asset the credential is bound to.
            When present the endpoint operates in V2 mode.
          type:
          - integer
          - 'null'
        filename:
          description: Original file name; required in V2 mode. Sanitized server-side
            and bound into the signed fileName claim.
          type:
          - string
          - 'null'
        tags:
          description: Comma-separated tag list to sign into the credential (V2 mode
            only).
          type:
          - string
          - 'null'
        autotag:
          description: When true, signs the google-auto-tagging extension into the
            credential (V2 mode only).
          type:
          - boolean
          - 'null'
      additionalProperties: false
    CreateDamImagekitAuthResponse201ApplicationJsonSchema:
      description: 'V2 mode (asset_id supplied): a path-bound JWT credential — the
        client must echo folder, file_name, tags and extensions verbatim as upload
        form fields and send nothing else besides the file and the token. Legacy
        V1 mode (no asset_id): the transitional token/signature/expire triple, removed
        in CURRENT-1626 phase C.'
      oneOf:
      - "$ref": "#/components/schemas/DamImagekitAuthV2Credential"
      - "$ref": "#/components/schemas/DamImagekitAuthLegacyV1Credential"
    DamImagekitAuthV2Credential:
      type: object
      required:
      - token
      - public_key
      - url_endpoint
      - folder
      - file_name
      - expire
      - meta
      properties:
        token:
          description: ImageKit V2 upload JWT; HMAC-signs the folder, fileName,
            tags and extensions claims.
          type: string
        public_key:
          type: string
        url_endpoint:
          type: string
        folder:
          description: Canonical DAM folder (<company_id>/<category>/<code>) the
            credential is bound to; echo verbatim.
          type: string
        file_name:
          description: Server-generated file name to echo verbatim as fileName.
          type: string
        expire:
          description: Unix timestamp when the credential expires; equals the JWT
            exp claim.
          type: integer
        tags:
          description: Comma-separated tags, present only when requested; echo verbatim.
          type: string
        extensions:
          description: Signed JSON string of ImageKit extensions, present only when
            autotag was requested; echo verbatim.
          type: string
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties: false
    DamImagekitAuthLegacyV1Credential:
      type: object
      deprecated: true
      description: 'Legacy V1 credential (token/signature/expire triple) returned
        when no asset_id is supplied. This schema, along with its required extensions
        field, must be removed together when the legacy V1 path is deleted in
        CURRENT-1626 phase C.'
      required:
      - token
      - signature
      - expire
      - folder
      - extensions
      - meta
      properties:
        token:
          type: string
        signature:
          type: string
        expire:
          type: integer
        folder:
          description: Advisory company folder; V1 signatures do not bind the upload
            to it.
          type: string
        extensions:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              minConfidence:
                type: integer
              maxTags:
                type: integer
            additionalProperties: false
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties: false
    CreateDamBackfillImagekitResponse201ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        asset:
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - string
              - number
              - 'null'
            code:
              description: A unique, human-readable identifier for the asset
              type:
              - string
              - number
              - integer
              - 'null'
            name:
              description: The name of the asset
              type:
              - string
              - number
              - integer
              - 'null'
              pattern: "^[\\w\\s.-]+$"
            description:
              description: A description of the asset
              type:
              - string
              - 'null'
              - number
              - integer
            category:
              description: The file category of the asset
              type:
              - string
              - number
              - integer
              - 'null'
            created_at:
              description: The date and time the asset was created in ISO 8601 format
              type:
              - string
              - number
              - integer
              - 'null'
              format: date-time
            updated_at:
              description: The date and time the asset was last updated in ISO 8601
                format
              type:
              - string
              - number
              - integer
              - 'null'
              format: date-time
            default_variant_id:
              description: The ID of the default variant
              type:
              - string
              - 'null'
              - number
              - integer
            canonical_path:
              type:
              - string
              - number
              - integer
              - 'null'
            company:
              type:
              - string
              - number
              - integer
              - 'null'
            default_variant_url:
              type:
              - string
              - 'null'
              - number
              - integer
          title: Dam::Asset
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    CreateDamBackfillImagekitRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        billing_admission_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The admission a bytes preflight recorded for this upload; the registration adopts and settles it.
        asset:
          type:
          - object
          - 'null'
          properties:
            imagekit_file_id:
              type:
              - string
              - number
              - integer
              - 'null'
              description: ImageKit file ID
            imagekit_url:
              type:
              - string
              - number
              - integer
              - 'null'
              description: ImageKit file URL
            name:
              type:
              - string
              - number
              - integer
              - 'null'
              description: Asset display name
            description:
              type:
              - string
              - number
              - integer
              - 'null'
              description: Optional asset description
            tags:
              type:
              - string
              - number
              - integer
              - 'null'
              description: Optional comma-separated tags
            file_size:
              type:
              - integer
              - string
              - number
              - 'null'
              description: File size in bytes
            mime_type:
              type:
              - string
              - number
              - integer
              - 'null'
              description: MIME type
            width:
              type:
              - integer
              - string
              - number
              - 'null'
              description: Optional image width in pixels
            height:
              type:
              - integer
              - string
              - number
              - 'null'
              description: Optional image height in pixels
    UpdateDamAssetRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        name:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Updated display name for the asset
        description:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Updated description for the asset
    GetDamAssetPathsResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        asset_paths:
          type:
          - array
          - 'null'
          items:
            title: Dam::AssetPath
            type:
            - object
            - 'null'
            properties:
              id:
                type:
                - integer
                - string
                - number
                - 'null'
              path:
                description: The tree path for the asset
                type:
                - string
                - number
                - integer
                - 'null'
              created_at:
                description: The date and time the asset path was created in ISO 8601
                  format
                type:
                - string
                - number
                - integer
                - 'null'
                format: date-time
              updated_at:
                description: The date and time the asset path was last updated in
                  ISO 8601 format
                type:
                - string
                - number
                - integer
                - 'null'
                format: date-time
              canonical:
                description: Whether this is the canonical path for the asset
                type:
                - boolean
                - 'null'
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    DiscardDamAssetResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        asset:
          title: Dam::Asset
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - integer
              - string
              - number
              - 'null'
            code:
              description: The code of the asset that was soft deleted
              type:
              - string
              - number
              - integer
              - 'null'
            discarded_at:
              description: The date and time the asset was soft deleted
              type:
              - string
              - 'null'
              - number
              - integer
              format: date-time
            name:
              description: The name of the asset
              type:
              - string
              - number
              - integer
              - 'null'
              pattern: "^[\\w\\s.-]+$"
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    UpdateDamVariantRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        tags:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - number
            - integer
            - 'null'
          description: Array of tag names to assign to the variant (replaces all existing
            tags)
    QueryDamAssetsRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        path:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Required tree path pattern for hierarchical filtering
        tags_string:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Optional comma/semicolon-separated tag string for variant filtering.
            Comma = OR, Semicolon = AND
        name:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Optional asset name with wildcard support
        search:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Optional partial search across asset names and descriptions
            (case-insensitive)
        exclude_tags:
          type:
          - string
          - array
          - 'null'
          items:
            type: string
          description: Optional tag names to exclude, as a comma-separated string or
            an array. Variants carrying these tags are left out of the tree.
        exclude_categories:
          type:
          - string
          - array
          - 'null'
          items:
            type: string
          description: Optional asset categories to exclude (images, videos, audio,
            text, data, documents, other), as a comma-separated string or an array.
        limit:
          type:
          - integer
          - string
          - 'null'
          description: Maximum number of asset paths to return per page. Defaults
            to 50 and is clamped to the range 1-100.
        cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor from a previous response's meta.next_cursor.
            Omit it to fetch the first page.
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          type: string
        error:
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardUnauthorizedResponse:
      description: Common legacy unauthorized response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    StandardForbiddenResponse:
      description: Common legacy forbidden response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    QueryDamAssetsResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        path:
          type:
          - string
          - number
          - integer
          - 'null'
          description: The path pattern that was queried
        tree:
          type:
          - object
          - 'null'
          description: Nested tree structure of assets organized by path segments.
            Folder nodes are objects keyed by the next path segment; each leaf is
            an asset object with asset_code, name, category, created_at, and a variants
            array (file_name, mime_type, updated_at, metadata, tags, default, url,
            content, data).
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
            total_count:
              type:
              - integer
              - 'null'
              description: Total number of asset paths matching the query across
                all pages
            next_cursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the next page. Present only when has_more
                is true.
            has_more:
              type:
              - boolean
              - 'null'
              description: True when more asset paths are available. Present only
                when there is a next page.
            limit:
              type:
              - integer
              - 'null'
              description: Page size applied to this request. Present only when
                there is a next page.
    UpdateDamVariantResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        variant:
          title: Dam::Variant
          type:
          - object
          - 'null'
          properties:
            id:
              type:
              - string
              - number
              - integer
              - 'null'
            file_name:
              type:
              - string
              - number
              - integer
              - 'null'
            mime_type:
              type:
              - string
              - number
              - integer
              - 'null'
            metadata:
              type:
              - object
              - 'null'
              additionalProperties:
                "$ref": "#/components/schemas/JsonValue"
            checksum:
              type:
              - string
              - number
              - integer
              - 'null'
            tags:
              type:
              - array
              - 'null'
              items:
                "$ref": "#/components/schemas/JsonValue"
            default:
              type:
              - boolean
              - 'null'
            url:
              type:
              - string
              - number
              - integer
              - 'null'
            media_type:
              type:
              - string
              - number
              - integer
              - 'null'
            is_original:
              type:
              - boolean
              - 'null'
            is_text:
              type:
              - boolean
              - 'null'
            content:
              type:
              - string
              - number
              - integer
              - 'null'
            updated_at:
              type:
              - string
              - number
              - integer
              - 'null'
              format: date-time
        meta:
          type:
          - object
          - 'null'
          properties:
            request_id:
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              type:
              - string
              - number
              - integer
              - 'null'
    DAMAssetCreateResponse:
      type: object
      properties:
        asset:
