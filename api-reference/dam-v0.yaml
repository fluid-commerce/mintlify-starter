paths:
  "/api/dam/assets":
    post:
      summary: Errors when multiple asset types are provided
      tags:
      - dam
      operationId: dam_v0_create_dam_asset_invalid_mixed_payload
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DAMAssetCreateResponse"
        '402':
          description: billing admission refused the upload before any byte or credential
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingRefusalResponse"
        '409':
          description: the operation key names an identical request that is still in progress or already completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationInProgressResponse"
        '503':
          description: billing admission could not be recorded, so the upload did not run
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingAdmissionUnavailableResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      requestBody:
        content:
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/CreateDamAssetRequestBodyMultipartFormDataSchema"
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDamAssetRequestBodyMultipartFormDataSchema"
        description: 'Binary file upload for the digital asset. Maximum file size:
          100MB. Required when using asset parameter group. Fileless asset groups
          (text_asset, placeholder_asset) may be sent as application/json.'
  "/api/dam/assets/backfill_imagekit":
    post:
      summary: Creates a DAM asset from ImageKit upload metadata
      tags:
      - dam
      operationId: dam_v0_create_dam_backfill_imagekit
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDamBackfillImagekitResponse201ApplicationJsonSchema"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDamBackfillImagekitRequestBodyApplicationJsonSchema"
        required: true
  "/api/dam/assets/imagekit_auth":
    post:
      summary: Issues ImageKit upload credentials (path-bound V2 JWT, or the transitional
        legacy V1 triple when no asset_id is given)
      tags:
      - dam
      operationId: dam_v0_create_dam_imagekit_auth
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDamImagekitAuthResponse201ApplicationJsonSchema"
        '402':
          description: billing admission refused the upload before any byte or credential
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingRefusalResponse"
        '409':
          description: the operation key names an identical request that is still in progress or already completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationInProgressResponse"
        '503':
          description: billing admission could not be recorded, so no credential was issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingAdmissionUnavailableResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: asset not found in the company's library
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation failed (missing filename, credential issuance failure)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '500':
          description: ImageKit is not configured
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDamImagekitAuthRequestBodyApplicationJsonSchema"
        required: false
  "/api/dam/assets/upload_preflight":
    post:
      summary: Admits one upload before any byte is consumed
      description: >-
        Records the billing admission and its start before the client sends the body, so a refusal
        arrives before local bytes, temporary files, remote fetches, or the store write. The
        returned admission id is what the registration adopts once the bytes are stored.
      tags:
      - dam
      operationId: dam_v0_create_dam_upload_preflight
      security:
      - bearer_auth: []
      responses:
        '201':
          description: Admitted and started before the bytes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDamUploadPreflightResponse201ApplicationJsonSchema"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '402':
          description: billing admission refused the upload before any byte
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingRefusalResponse"
        '409':
          description: the operation key names an identical request that is still in progress or already completed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OperationInProgressResponse"
        '422':
          description: the declared file identity is invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '503':
          description: billing admission could not be recorded, so no byte may be sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BillingAdmissionUnavailableResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDamUploadPreflightRequestBodyApplicationJsonSchema"
        required: true
  "/api/dam/assets/{asset_code}/variants/{id}/discard":
    patch:
      summary: Discards a variant for an existing asset (soft delete)
      tags:
      - dam
      operationId: dam_v0_discard_dam_variant
      security:
      - bearer_auth: []
      parameters:
      - name: asset_code
        in: path
        required: true
        description: Asset code
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Variant ID
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DAMVariantDiscardResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: asset not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/dam/assets/{code}":
    get:
      summary: Retrieves an asset by code
      tags:
      - dam
      description: Returns a single Digital Asset Management (DAM) asset for the
        authenticated company, looked up by its six-character asset code. The response
        includes the asset's canonical tree path, category, default variant ID, and
        the URL of its default variant. Requires a company admin Bearer token with
        media view permission, or a token granted the dam:browse scope. Soft-deleted
        (discarded) assets and codes belonging to another company return 404.
      operationId: dam_v0_show_dam_asset
      security:
      - bearer_auth: []
      parameters:
      - name: code
        in: path
        required: true
        description: Unique code identifier for the asset
        example: LOGO-001
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDamBackfillImagekitResponse201ApplicationJsonSchema"
              example:
                asset:
                  id: 48213
                  code: K7QM4X
                  name: 20lb Copy Paper Hero
                  description: Product hero shot of a case of Dunder Mifflin 20lb Copy
                    Paper
                  category: images
                  created_at: '2026-09-14T15:22:08Z'
                  updated_at: '2026-09-21T09:47:31Z'
                  default_variant_id: 3f8b2c61-9d4e-4a7b-b1c5-7e2f9a6d0c84
                  canonical_path: 1405.image.png.K7QM4X
                  company: Dunder Mifflin Paper Company
                  default_variant_url: https://cdn.fluid.app/dunder-mifflin/dam/K7QM4X/20lb-copy-paper-hero.png
                meta:
                  request_id: 9c1e4f7a-2b3d-4e8f-a6c5-1d0b7e3f2a94
                  timestamp: '2026-09-30T14:05:12Z'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: asset not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    put:
      summary: Updates an existing asset
      tags:
      - dam
      operationId: dam_v0_update_dam_asset
      security:
      - bearer_auth: []
      parameters:
      - name: code
        in: path
        required: true
        description: Unique code identifier for the asset
        example: ACMELG
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateDamBackfillImagekitResponse201ApplicationJsonSchema"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: asset not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateDamAssetRequestBodyApplicationJsonSchema"
        required: true
  "/api/dam/assets/{code}/asset_paths":
    get:
      summary: Lists asset paths for an existing asset
