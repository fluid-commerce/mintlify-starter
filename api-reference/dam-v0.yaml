          - request_id
          - timestamp
          additionalProperties: false
        variant:
          type: object
          properties:
            checksum:
              type: 'null'
            content:
              type: 'null'
            created_at:
              type: string
              format: date-time
            default:
              type: boolean
            file_name:
              type: string
            id:
              type: string
            is_original:
              type: boolean
