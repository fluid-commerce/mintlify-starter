          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateDamVariantRequestBodyApplicationJsonSchema"
  "/api/dam/generate":
    post:
      summary: Generate AI images from a prompt with optional product context
      tags:
      - dam
      description: |
        Enqueues AI image generation as a background job using gpt-image-1.
        Returns immediately with a generation_id. Poll GET /api/dam/generate/{id}
        for results. When complete, use POST /api/dam/generate/save to persist
        selected images to the DAM.

        **Scope required:** `dam:ai_generate`
      operationId: dam_v0_generate_dam_images
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - generate
              properties:
                generate:
                  type: object
                  required:
                  - prompt
                  properties:
                    prompt:
                      type: string
                      description: The image generation prompt
                      example: lifestyle photo of this product on a kitchen counter
                    product_id:
                      type: integer
                      description: Optional product ID for context and reference images
                      example: 62
                    image_urls:
                      type: array
                      items:
                        type: string
                      description: Optional reference image URLs for GPT-4o vision.
                        Max 4.
                      example:
                      - https://ik.imagekit.io/fluid/s3/example_product.webp
                    count:
                      type: integer
                      description: Number of images to generate (1-4)
                      minimum: 1
                      maximum: 4
                      default: 1
                      example: 2
                    reference_image_url:
                      type: string
                      description: URL of an existing product image to use as a base
                        for editing (img2img). Must be HTTPS.
                      example: https://ik.imagekit.io/fluid/s3/product-photo.webp
                    size:
                      type: string
                      description: Image dimensions
                      default: 1024x1024
                      enum:
                      - 1024x1024
                      - 1536x1024
                      - 1024x1536
                      - auto
                      example: 1024x1024
                    quality:
                      type: string
                      description: Image quality
                      default: high
                      enum:
                      - low
                      - medium
                      - high
                      example: high
                    background:
                      type: string
                      description: Background handling for product cutouts
                      default: auto
                      enum:
                      - transparent
                      - opaque
                      - auto
                      example: auto
                    style:
                      type:
                      - string
                      - 'null'
                      description: Free-text style instruction appended to the prompt.
                        Null for no style.
                      example: cinematic
                    preset:
                      type:
                      - string
                      - 'null'
                      description: Style preset that prepends scene/lighting context
                        to the prompt. Null for no preset.
                      enum:
                      - studio
                      - lifestyle
                      - flat_lay
                      - outdoor
                      - social
                      - fashion
                      - wellness
                      - retro
                      example: lifestyle
            example:
              generate:
                prompt: lifestyle photo of this product on a marble countertop
                product_id: 62
                count: 2
                size: 1024x1024
                quality: high
                preset: lifestyle
      responses:
        '202':
          description: Generation enqueued
          content:
            application/json:
              schema:
                type: object
                required:
                - generation_id
                - status
                - meta
                properties:
                  generation_id:
                    type: string
                    format: uuid
                    description: Unique ID to poll for results
                    example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  status:
                    type: string
                    enum:
                    - pending
                    description: Always "pending" on initial response
                    example: pending
                  meta:
                    "$ref": "#/components/schemas/Meta"
              example:
                generation_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                status: pending
                meta:
                  request_id: req_abc123
                  timestamp: '2026-04-14T15:00:00Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/dam/generate/{id}":
    get:
      summary: Poll for image generation status
      tags:
      - dam
      description: |
        Returns the current status of a generation job. Poll every 2-3 seconds
        until status is "completed" or "failed". Results are available for 1 hour.

        **Scope required:** `dam:ai_generate`
      operationId: dam_v0_status_dam_generation
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The generation_id returned by POST /api/dam/generate
        schema:
          type: string
          format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: Generation status
          content:
            application/json:
              schema:
                type: object
                required:
                - generation_id
                - status
                - meta
                properties:
                  generation_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - pending
                    - completed
                    - failed
                  generated_images:
                    type: array
                    description: Present only when status is "completed"
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: URL of the generated image (hosted on ImageKit)
                          example: https://ik.imagekit.io/fluid/dam/ai-generated/12345/ai-generated-a1b2c3d4-0.png
                        revised_prompt:
                          type:
                          - string
                          - 'null'
                        index:
                          type: integer
                        size:
                          type: string
                        quality:
                          type: string
                        style:
                          type:
                          - string
                          - 'null'
                  refined_prompt:
                    type: string
                    description: Present only when status is "completed"
                  error:
                    type: string
                    description: Present only when status is "failed"
                  meta:
                    "$ref": "#/components/schemas/Meta"
              examples:
                pending:
                  summary: Still processing
                  value:
                    generation_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    status: pending
                    meta:
                      request_id: req_poll1
                      timestamp: '2026-04-14T15:00:05Z'
                completed:
                  summary: Images ready
                  value:
                    generation_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    status: completed
                    generated_images:
                    - url: https://ik.imagekit.io/fluid/dam/ai-generated/12345/ai-generated-a1b2c3d4-0.png
                      revised_prompt: A lifestyle photo of a supplement bottle on
                        marble
                      index: 0
                      size: 1024x1024
                      quality: high
                      style:
                    refined_prompt: lifestyle photo of this product on a marble countertop
                    meta:
                      request_id: req_poll2
                      timestamp: '2026-04-14T15:00:30Z'
                failed:
                  summary: Generation failed
                  value:
                    generation_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    status: failed
                    error: All image generations failed
                    meta:
                      request_id: req_poll3
                      timestamp: '2026-04-14T15:00:15Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: Generation not found or expired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/dam/generate/save":
    post:
      summary: Save generated images to the DAM
      tags:
      - dam
      description: |
        Persists one or more generated images (from temporary DALL-E URLs) into
        the DAM as assets. Each image is uploaded to ImageKit and tagged with
        `ai-generated` automatically. Saves are atomic — if any image fails,
        none are saved.

        **Scope required:** `dam:ai_generate`
      operationId: dam_v0_save_dam_generated_images
      security:
      - bearer_auth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - images
              properties:
                images:
                  type: array
                  description: Array of generated images to save
                  items:
                    type: object
                    required:
                    - url
                    - name
                    properties:
                      url:
                        type: string
                        description: Temporary DALL-E image URL
                        example: https://oaidalleapiprodscus.blob.core.windows.net/private/img.png?token=abc
                      name:
                        type: string
                        description: Display name for the DAM asset
                        example: AI Product Lifestyle Shot
                      description:
                        type: string
                        description: Optional description
                        example: AI-generated lifestyle photo of Rain Renu
                      tags:
                        type: string
                        description: Comma-separated tags (ai-generated added automatically)
                        example: marketing,hero,lifestyle
            example:
              images:
              - url: https://oaidalleapiprodscus.blob.core.windows.net/private/img.png?token=abc
                name: AI Product Lifestyle Shot
                description: AI-generated lifestyle photo
                tags: marketing,hero
      responses:
        '201':
          description: Images saved to DAM
          content:
            application/json:
              schema:
                type: object
                required:
                - assets
                - meta
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        "$ref": "#/components/schemas/JsonValue"
                  meta:
                    "$ref": "#/components/schemas/Meta"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '422':
          description: Save failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
              example:
                error_message: Save failed
                errors:
                  base:
                  - Failed to save generated images
                meta:
                  request_id: req_save789
                  timestamp: '2026-04-14T15:00:00Z'
  "/api/dam/query":
    post:
      summary: Query DAM assets using tree paths and tags
      tags:
      - dam
      description: Searches and retrieves DAM assets using tree path pattern matching,
        tag-based variant filtering, wildcard name matching, and partial search.
        Requires a company admin Bearer token with media view permission, or a token
        granted the dam:browse scope. Results are cursor-paginated over matching
        asset paths - pass limit (default 50, max 100) and the opaque meta.next_cursor
        from the previous response as cursor. A missing path, an invalid path pattern,
        or too many tags returns 400.
      operationId: dam_v0_query_dam_assets
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/QueryDamAssetsResponse200ApplicationJsonSchema"
              example:
                path: 1405.image.*
                tree:
                  '1405':
                    image:
                      png:
                        K7QM4X:
                          asset_code: K7QM4X
                          name: 20lb Copy Paper Hero
                          category: images
                          created_at: '2026-09-14T15:22:08Z'
                          variants:
                          - file_name: 20lb-copy-paper-hero.png
                            mime_type: image/png
                            updated_at: '2026-09-21T09:47:31Z'
                            metadata:
                              mime: image/png
                              width: 2400
                              height: 1600
                              size: 184320
                            tags:
                            - product
                            - hero
                            default: true
                            url: https://cdn.fluid.app/dunder-mifflin/dam/K7QM4X/20lb-copy-paper-hero.png
                            content:
                            data:
                meta:
                  request_id: 5e2a8d14-7c3f-4b91-9a6e-0f4d2c8b7e13
                  timestamp: '2026-09-30T14:07:45Z'
                  total_count: 37
                  next_cursor: eyJhc3NldF9wYXRoX2lkIjo5MTc0MiwiY3JlYXRlZF9hdCI6IjIwMjYtMDktMTRUMTU6MjI6MDhaIn0=
                  has_more: true
                  limit: 1
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: A public token (pub-) with an Origin the token's domain_allowlist
            does not permit, for a company enforcing that allowlist.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardForbiddenResponse"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/QueryDamAssetsRequestBodyApplicationJsonSchema"
            example:
              path: 1405.image.*
              tags_string: product,hero
              search: copy paper
              exclude_categories: videos,audio
              limit: 1
        required: true
