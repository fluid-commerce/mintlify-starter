  "/api/dam/assets/{code}/replace_file":
    patch:
      summary: Replace the underlying ImageKit file for an existing asset's default
        variant
      tags:
      - dam
      operationId: dam_v0_replace_file_dam_asset
      security:
      - bearer_auth: []
      parameters:
      - name: code
        in: path
        required: true
        description: Unique code identifier for the asset
        example: ACMELG
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DAMAssetReplaceFileResponse"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UnauthorizedResponse"
        '404':
          description: asset not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '422':
          description: validation failed (mime mismatch, fileId mismatch, missing
            variant)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - asset
              properties:
                asset:
                  type: object
                  required:
                  - imagekit_file_id
                  - mime_type
                  - imagekit_url
                  - file_size
                  properties:
                    imagekit_file_id:
                      type: string
                      description: ImageKit file ID; must match the variant's existing
                        file ID
                      example: 6839bdd2c1e6e500342a40b2
                    mime_type:
                      type: string
                      description: MIME type of the replacement file; must share the
                        family of the existing variant
                      example: image/jpeg
                    imagekit_url:
                      type: string
                      description: ImageKit URL of the replacement file; preserved
                        across overwrite
                      example: https://ik.imagekit.io/fluid/123/images/ACMELG/photo.jpg
                    file_size:
                      type: integer
                      description: Size of the replacement file in bytes
                      example: 248576
                    width:
                      type: integer
                      description: Width in pixels (images only)
                      example: 1920
                    height:
                      type: integer
                      description: Height in pixels (images only)
                      example: 1080
        required: true
