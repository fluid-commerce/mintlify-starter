  "/api/forms/{id}/send_reminders":
    post:
      summary: Send manual enrollment reminders
      description: >-
        Emails a reminder to finish enrolling to this post-purchase form's eligible incomplete
        enrollees, the same people **List incomplete enrollees** marks `eligible`. The email
        links to the enrollee's checkout so they can complete the form. Each enrollee gets at
        most one manual reminder per 24 hours, counting automatic reminders too. A manual
        reminder delays the next automatic one rather than replacing it. Send `enrollment_ids`
        to remind only some enrollees. Emails are queued, not sent while you wait. Manual
        reminders are turned on per company; without them this returns 404. Returns 422 for a
        form that isn't post-purchase.
      tags:
      - forms
      operationId: forms_v0_send_form_reminders
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of the post-purchase form.
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SendFormRemindersRequestBodyApplicationJsonSchema"
            examples:
              two_enrollees:
                summary: Remind Kelly Kapoor and Ryan Howard
                value:
                  enrollment_ids:
                  - 90248
                  - 90233
              everyone:
                summary: Remind every eligible enrollee
                value: {}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FormSendRemindersResponse"
              examples:
                one_sent:
                  summary: Kelly Kapoor was reminded; Ryan Howard got a reminder this morning
                  value:
                    sent: 1
                    skipped:
                      recently_reminded: 1
                    meta:
                      request_id: d5a0e7c2-3f68-4b19-8e4d-6a1c9f3b7e52
                      timestamp: '2026-10-07T15:56:30Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '403':
          description: Forbidden. The caller is not an admin of the company, or a client
