  "/api/forms/{id}/embed_settings":
    patch:
      operationId: forms_v0_forms_embed_settings_patch
      summary: Update embed settings
      description: |-
        Sets restrictions on the form's public share and embed links. Send them inside an `embed_settings` object; settings you leave out keep their values.

        - `allowed_domains`: array of domain names, such as `shop.example.com`, that may embed the form. A subdomain of a listed domain is allowed too. An empty array allows every site. Requests that carry no `Origin` or `Referer` header aren't restricted.
        - `password`: a password visitors must enter before they can see or submit the form. `remove_password: true` removes it.
        - `expires_at`: date and time after which the public form returns 410. `null` removes it.
        - `max_submissions`: stop accepting public submissions once the form has this many completed respondents. `null` or 0 removes the limit.
        - `require_contact`: when `true`, public submissions must include a contact email.

        Returns 422 for an invalid domain or date.
