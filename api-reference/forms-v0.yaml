    post:
      summary: Create a form
      description: >-
        Creates a form. Send the fields inside a `form` object; `title` is required. A new form
        is a `draft` unless you set `status`. Set `form_type` to `post_purchase` or `general`:
        `pre_purchase` is retired and returns 422. Send `form_components` to create the form's
        elements in the same request. Creating a form sends the `form_created` webhook event. A
        form created as `active` has no public token until you call **Generate a public token**.
      tags:
      - forms
      operationId: forms_v0_create_form
      security:
      - bearer_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "\\S"
        description: Optional client-chosen key, 1 to 255 characters with at least one
          that is not whitespace; a blank key answers 422. A retry
          of the same request with the same key from the same company answers with
          the record the first request created instead of creating another, even
          when the first response was lost. The same key sent with a different
          request, or by a different user or credential, answers 422.
      responses:
        '200':
          description: Success, or the form an earlier request with the same Idempotency-Key created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateFormResponse200ApplicationJsonSchema"
              examples:
                created:
                  summary: The new draft form, with an element ID on each component
                  value:
                    message: Form created successfully
