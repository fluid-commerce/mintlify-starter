---
openapi: 3.1.0
info:
  description: |-
    Manage your company's forms: build them, choose where they appear, share or embed them, and read, export, and follow up on their responses.

    A form is either a **post-purchase** form, which enrollment checkout shows after payment to buyers in the form's countries, or a **general** form, which you share by link, embed on a website, or send by email. Its fields are **form elements**. Each submission is a **respondent** that holds one **response** per answered element.

    Every operation takes a Bearer token (`Authorization: Bearer <token>`) for your company. Reading operations need the forms view permission, and writing operations need the forms update permission, except **Respond to a form**, which any member of the company can call. Root admins and droplet tokens skip these permission checks. **Respond to a form** also accepts unauthenticated calls, but those are deprecated: to collect answers from the public, generate a public token and use the Fluid Public SDK API's token-addressed forms operations, or the hosted share and embed URLs.

    Answers to elements marked sensitive are masked as `********` unless the caller holds the forms view-sensitive permission, is a root admin, or uses a droplet token.
  title: Fluid Forms API
  version: v0
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://api.fluid.app
- url: https://{company}.fluid.app
  description: Production server with company subdomain
  variables:
    company:
      default: myco
      description: Company subdomain
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: Bearer token authentication
  schemas:
    Meta:
      description: Request metadata returned with the response.
      type: object
      properties:
        request_id:
          description: Identifier of this request, for support and log correlation.
          type:
          - string
          - 'null'
        timestamp:
          description: When the server built the response, in ISO 8601.
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - error_message
      - errors
      - meta
      properties:
        error_message:
          description: Human-readable summary of the error, such as `Form not found`.
          type: string
        errors:
          description: Error details keyed by field, or empty when there are none.
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          description: Request metadata.
          "$ref": "#/components/schemas/Meta"
    UnauthorizedResponse:
      type: object
      properties:
        message:
          description: Why the request was refused.
          type: string
      required:
      - message
    CreateFormRequestBodyApplicationJsonSchema:
      description: >-
        The new form. Send its fields inside a `form` object, for example `{"form": {"title":
        "Enrollment details", "form_type": "post_purchase"}}`. The server reads only the `form`
        object; it accepts the same fields as **Update a form**, and `title` is required.
      type:
      - object
      - 'null'
      properties:
        title:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Title of the form. Required. Send it as `form.title`.
        description:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Description of the form. Send it as `form.description`.
    GetFormStatisticsResponse200ApplicationJsonSchema:
      description: Response counts across every form your company has.
      type:
      - object
      - 'null'
      properties:
        total_forms:
          description: Number of forms the company has, in any status.
          type:
          - integer
          - string
          - number
          - 'null'
        total_responses:
          description: >-
            Number of respondents across all of the company's forms. Each submission counts
            once.
          type:
          - integer
          - string
          - number
          - 'null'
        completed_responses:
          description: Number of those respondents whose completion status is `completed`.
          type:
          - integer
          - string
          - number
          - 'null'
        completion_rate:
          description: >-
            `completed_responses` as a percentage of `total_responses`, from 0 to 100, rounded
            to two decimals. 0 when there are no responses.
          type:
          - number
          - string
          - integer
          - 'null'
          format: float
        today_responses:
          description: Respondents created since midnight UTC today.
          type:
          - integer
          - string
          - number
          - 'null'
        yesterday_responses:
          description: Respondents created yesterday, midnight to midnight UTC.
          type:
          - integer
          - string
          - number
          - 'null'
    UpdateFormRequestBodyApplicationJsonSchema:
      description: >-
        The fields to change. Send at least one field inside `form`; fields you leave out keep
        their values.
      type:
      - object
      - 'null'
      properties:
        form:
          description: The form fields to change.
          type:
          - object
          - 'null'
          properties:
            title:
              type:
              - string
              - number
              - integer
              - 'null'
              description: Title of the form. Can't be blank.
            description:
              type:
              - string
              - number
              - integer
              - 'null'
              description: Description shown with the form.
            status:
              type:
              - string
              - number
              - integer
              - 'null'
              description: >-
                `draft` or `active`. Only an `active` form is shown at checkout or served by its
                public token. Changing a form to `active` gives it a public token if it has
                none. Activating a form also sends the `form_activated` webhook event.
            form_type:
              type:
              - string
              - number
              - integer
              - 'null'
              description: >-
                The form's type, which decides where it appears. `post_purchase`: shown on the
                order confirmation page of an enrollment checkout, after payment, when the
                cart's country is one of the form's countries and the form is `active`. Every
                active post-purchase form for that country is shown, and the enrollment stays
                incomplete until each required field is answered. `general`: a standalone form
                that checkout never shows; you share it by link, embed, or email. `pre_purchase`
                is retired: creating a form with it, or changing a form to it, returns 422 with
                an `errors.form_type` message. Pre-purchase forms created before the retirement
                keep running before payment at enrollment checkout and stay editable. A form can
                also have no type (`null`).
            form_components:
              type:
              - string
              - number
              - integer
              - 'null'
              description: >-
                The form's elements, as a JSON-encoded string of an array of components. Each
                component is an object with an `element_type` and its settings, such as `label`,
                `placeholder`, `required`, and `sensitive_info`. A component that carries the
                `id` of one of this form's elements updates that element in place; a component
                without an `id` adds a new element. Elements you leave out are deactivated, and
                their stored answers are kept. Changing which fields are marked `sensitive_info`
                needs the forms manage-sensitive permission, otherwise the request returns 422.
                See **List form elements** for the element types.
            form_styles:
              type:
              - string
              - number
              - integer
              - 'null'
              description: >-
                The form's visual styles, as a JSON-encoded string of an object. Responses
                return it decoded.
            form_redirect:
              type:
              - string
              - number
              - integer
              - 'null'
              description: >-
                URL the hosted form sends the respondent to after they submit. Send `null` to
                clear it.
            default:
              type:
              - boolean
              - 'null'
              description: >-
                Stored with the form and returned to the builder. Which forms checkout shows
                doesn't depend on it.
            country_ids:
              type:
              - array
              - 'null'
              items:
                type:
                - integer
                - string
                - number
                - 'null'
              description: >-
                IDs of the countries the form is for. Replaces the form's current countries. A
                post-purchase form is shown only for carts in one of these countries.
    CreateDamBackfillImagekitResponse401ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        message:
          description: >-
            Confirmation message, such as `Form deleted successfully` or `Email sent
            successfully`.
          type:
          - string
          - number
          - integer
          - 'null'
    ExportFormRespondentsCsvResponse200ApplicationJsonSchema:
      description: Where to download the finished export.
      type:
      - object
      - 'null'
      properties:
        url:
          description: >-
            Signed download URL of the CSV file. It expires 12 hours after the export. The file
            has one row per respondent with the columns `respondent_type`, `respondent_name`,
            `respondent_email`, `respondent_phone`, `form_completion_status`, `submitted_at`,
            and `updated_at`, followed by one column per answered element, headed by the
            element's label.
          type:
          - string
          - number
          - integer
          - 'null'
        meta:
          description: Request metadata.
          type:
          - object
          - 'null'
          properties:
            request_id:
              description: Identifier of this request, for support and log correlation.
              type:
              - string
              - number
              - integer
              - 'null'
            timestamp:
              description: When the server built the response, in ISO 8601.
              type:
              - string
              - number
              - integer
              - 'null'
    RespondToFormResponse201ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        message:
          description: >-
            Confirmation message: `Responses created successfully`.
          type:
          - string
          - number
          - integer
          - 'null'
        responses:
          description: The answers that were saved, one per submitted element.
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                description: ID of the saved response.
                type:
                - integer
                - string
                - number
                - 'null'
              form_element_id:
                description: ID of the form element the answer is for.
                type:
                - integer
                - string
                - number
                - 'null'
              form_respondent_id:
                description: ID of the respondent record this submission created.
                type:
                - integer
                - string
                - number
                - 'null'
              response:
                description: The answer as saved.
                type:
                - string
                - number
                - integer
                - 'null'
              created_at:
                description: When the answer was saved.
                type:
                - string
                - number
                - integer
                - 'null'
                format: date-time
              updated_at:
                description: When the answer was last changed.
                type:
                - string
                - number
                - integer
                - 'null'
                format: date-time
    RespondToFormRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        form_response:
          description: The submission. Required.
          type:
          - object
          - 'null'
          properties:
            contact:
              description: >-
                Who is answering. Required, with `email`, when the caller isn't signed in as a
                member of the form's company; the answers are then filed under a new contact of
                that company built from these details. Ignored when the caller is a member of
                the form's company, because the answers are filed under their membership.
              type:
              - object
              - 'null'
              properties:
                first_name:
                  description: The respondent's first name.
                  type:
                  - string
                  - number
                  - integer
                  - 'null'
                last_name:
                  description: The respondent's last name.
                  type:
                  - string
                  - number
                  - integer
                  - 'null'
                email:
                  description: The respondent's email address. Required when you send `contact`.
                  type:
                  - string
                  - number
                  - integer
                  - 'null'
            responses:
              description: >-
                The answers, one per element. Required. Every `form_element_id` must belong to
                this form, otherwise the request returns 422 and nothing is saved.
              type:
              - array
              - 'null'
              items:
                type:
                - object
                - 'null'
                properties:
                  form_element_id:
                    description: ID of the form element being answered. Required.
                    type:
                    - integer
                    - string
                    - number
                    - 'null'
                  answer:
                    description: >-
                      The answer, as a string. Required. For a file upload, send the uploaded
                      file's URL.
                    type:
                    - string
                    - number
                    - integer
                    - 'null'
    ListFormRespondentsResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        data:
          description: The respondents on this page. Each is one submission of the form.
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                description: ID of the respondent record. Use it to delete the submission.
                type:
                - integer
                - string
                - number
                - 'null'
              form_completion_status:
                description: >-
                  `not_started`, `in_progress`, or `completed`. Submissions through **Respond to
                  a form** are always `completed`.
                type:
                - string
                - number
                - integer
                - 'null'
              respondent:
                description: >-
                  Who submitted the form, or `null` when unknown. For a contact or company
                  member it carries their profile. For an enrollee it carries `id` (the
                  enrollment ID), `full_name`, and `email`, and only when the caller holds the
                  forms view-sensitive permission, is a root admin, or uses a droplet token; otherwise it is `null`.
                type:
                - object
                - 'null'
                properties:
                  id:
                    description: >-
                      ID of the respondent: the contact, company member, or enrollment.
                    type:
                    - integer
                    - string
                    - number
                    - 'null'
                  email:
                    description: The respondent's email address.
                    type:
                    - string
                    - number
                    - integer
                    - 'null'
                  full_name:
                    description: The respondent's full name.
                    type:
                    - string
                    - number
                    - integer
                    - 'null'
                  status:
                    description: The contact's status, when the respondent is a contact.
                    type:
                    - string
                    - number
                    - integer
                    - 'null'
                  token:
                    description: The contact's token, when the respondent is a contact.
                    type:
                    - string
                    - number
                    - integer
                    - 'null'
              respondent_type:
                description: >-
                  What kind of record answered: `Contact` (a person who answered through a
                  shared or public form), `UserCompany` or `Company::CompanyMember` (a signed-in
                  member of your company), or `Commerce::Enrollment` (an enrollee answering a
                  form at checkout).
                type:
                - string
                - number
                - integer
                - 'null'
              response:
                description: The respondent's answers, one per answered element.
                type:
                - array
                - 'null'
                items:
                  type:
                  - object
                  - 'null'
                  properties:
                    id:
                      description: ID of the response.
                      type:
                      - integer
                      - string
                      - number
                      - 'null'
                    form_element_id:
                      description: ID of the form element the answer is for.
                      type:
                      - integer
                      - string
                      - number
                      - 'null'
                    response:
                      description: >-
                        The answer. A sensitive element's answer is `********` unless the caller
                        holds the forms view-sensitive permission, is a root admin, or uses a droplet token. A file upload's answer is a
                        time-limited signed URL.
                      type:
                      - string
                      - number
                      - integer
                      - 'null'
              updated_at:
                description: When the respondent record last changed.
                type:
                - string
                - number
                - integer
                - 'null'
                format: date-time
        pagination:
          description: Where this page sits in the full list.
          type:
          - object
          - 'null'
          properties:
            current_page:
              description: The page returned, starting at 1.
              type:
              - integer
              - string
              - number
              - 'null'
            next_page:
              description: >-
                Not currently returned. Request `current_page + 1` while it is no greater than
                `total_pages`.
              type:
              - integer
              - 'null'
              - string
              - number
            prev_page:
              description: >-
                Not currently returned. Request `current_page - 1` while it is at least 1.
              type:
              - integer
              - 'null'
              - string
              - number
            total_pages:
              description: Number of pages at the requested page size.
              type:
              - integer
              - string
              - number
              - 'null'
            total_count:
              description: Number of records across all pages.
              type:
              - integer
              - string
              - number
              - 'null'
        filters:
          description: The sort options this endpoint accepts.
          type:
          - object
          - 'null'
          properties:
            sorted_by:
              description: >-
                Sort options as `[label, value]` pairs. Pass a value as
                `filterrific[sorted_by]`.
              type:
              - array
              - 'null'
              items:
                type:
                - array
                - 'null'
                items:
                  type:
                  - string
                  - number
                  - integer
                  - 'null'
    SendFormViaEmailRequestBodyApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        email:
          type:
          - string
          - number
          - integer
          - 'null'
          description: Email address to send the form link to. Required.
    SendFormRemindersRequestBodyApplicationJsonSchema:
      type: object
      properties:
        enrollment_ids:
          type: array
          description: >-
            Enrollment IDs to remind, taken from **List incomplete enrollees**. Only the IDs
            that are still eligible are reminded; the others are counted in `skipped` as
            `form_completed` or `out_of_scope`. Omit it to remind every eligible enrollee.
          items:
            type: integer
      additionalProperties: false
    JsonValue:
      description: Any valid JSON value for provider, integration, theme, metadata,
        or other dynamic payloads whose keys are not fixed by the API contract.
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
      - type: array
        items:
          "$ref": "#/components/schemas/JsonValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorValue:
      description: A validation or API error value.
      anyOf:
      - type: string
      - type: array
        items:
          type: string
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/JsonValue"
    ErrorBag:
      description: Validation errors keyed by field, a list of errors, a single error
        message, or null when no structured error details are available.
      anyOf:
      - type: string
      - type: array
        items:
          "$ref": "#/components/schemas/ErrorValue"
      - type: object
        additionalProperties:
          "$ref": "#/components/schemas/ErrorValue"
      - type: 'null'
    ErrorMessage:
      description: An API error message represented as text or structured JSON.
      anyOf:
      - type: string
      - "$ref": "#/components/schemas/ErrorBag"
      - type: 'null'
    StandardErrorResponse:
      description: Common legacy error response envelope. Older endpoints may return
        one or more of these fields depending on the controller path.
      type: object
      properties:
        message:
          description: Human-readable error message, when the endpoint returns one.
          type: string
        error:
          description: Error message or details, when the endpoint returns them under this key.
          "$ref": "#/components/schemas/ErrorMessage"
        error_message:
          description: >-
            Human-readable summary of the error, such as `Form not found` or `Invalid
            parameters`.
          "$ref": "#/components/schemas/ErrorMessage"
        errors:
          description: >-
            Error details, usually keyed by field. For example, a request for the retired
            pre-purchase type returns a message under `form_type`.
          "$ref": "#/components/schemas/ErrorBag"
        meta:
          description: Request metadata.
          "$ref": "#/components/schemas/Meta"
      additionalProperties:
        "$ref": "#/components/schemas/JsonValue"
    StandardUnauthorizedResponse:
      description: Common legacy unauthorized response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    StandardForbiddenResponse:
      description: Common legacy forbidden response envelope.
      allOf:
      - "$ref": "#/components/schemas/StandardErrorResponse"
    Form:
      description: >-
        A form as the admin sees it. Responses also carry `public_token`, `embed_settings`,
        `embed_url`, and `share_url`, described under **Generate a public token**.
      type:
      - object
      - 'null'
      properties:
        id:
          description: ID of the form.
          type:
          - integer
          - string
          - number
          - 'null'
        countries:
          description: >-
            The countries the form is for. A post-purchase form is shown only for carts in one
            of them.
          type:
          - array
          - 'null'
          items:
            type:
            - object
            - 'null'
            properties:
              id:
                description: ID of the country.
                type:
                - integer
                - string
                - number
                - 'null'
              iso:
                description: Two-letter ISO country code, such as `US`.
                type:
                - string
                - number
                - integer
                - 'null'
              name:
                description: Name of the country.
                type:
                - string
                - number
                - integer
                - 'null'
        description:
          description: Description shown with the form.
          type:
          - string
          - number
          - integer
          - 'null'
        form_components:
          description: >-
            The form's elements as the builder saved them, a JSON-encoded array of components.
            Each component carries the `id` of the active element it maps to, so you can send it
            back to **Update a form** to edit elements in place.
          type:
          - string
          - number
          - integer
          - 'null'
        form_styles:
          description: The form's visual styles, or `null` when none are set.
          type:
          - object
          - 'null'
          additionalProperties:
            "$ref": "#/components/schemas/JsonValue"
        form_redirect:
          description: URL the hosted form sends the respondent to after they submit, or `null`.
          type:
          - string
          - number
          - integer
          - 'null'
        form_respondents_count:
          description: Number of respondents the form has, in any completion status.
          type:
          - integer
          - string
          - number
          - 'null'
        form_type:
          description: >-
            `post_purchase`, `general`, or the retired `pre_purchase`; `null` when unset. See
            **Update a form** for what each type means.
          type:
          - string
          - number
          - integer
          - 'null'
        status:
          description: >-
            `draft` or `active`. Only an `active` form is shown at checkout or served by its
            public token. Changing a form to `active` gives it a public token if it has none.
          type:
          - string
          - number
          - integer
          - 'null'
        title:
          description: Title of the form.
          type:
          - string
          - number
          - integer
          - 'null'
        updated_at:
          description: When the form last changed.
          type:
          - string
          - number
          - integer
          - 'null'
          format: date-time
    CreateFormResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        message:
          description: Confirmation message, such as `Form created successfully`.
          type:
          - string
          - number
          - integer
          - 'null'
        form:
          description: The form as saved.
          "$ref": "#/components/schemas/Form"
    DuplicateFormResponse200ApplicationJsonSchema:
      "$ref": "#/components/schemas/Form"
    ListFormsResponse200ApplicationJsonSchema:
      type:
      - object
      - 'null'
      properties:
        data:
          description: The forms on this page, newest first.
          type:
          - array
          - 'null'
          items:
            "$ref": "#/components/schemas/Form"
        pagination:
          description: Where this page sits in the full list.
          type:
          - object
          - 'null'
          properties:
            current_page:
              description: The page returned, starting at 1.
              type:
              - integer
              - string
              - number
              - 'null'
            next_page:
              description: >-
                Not currently returned. Request `current_page + 1` while it is no greater than
                `total_pages`.
              type:
              - integer
              - string
              - number
              - 'null'
            prev_page:
              description: >-
                Not currently returned. Request `current_page - 1` while it is at least 1.
              type:
              - integer
              - string
              - number
              - 'null'
            total_pages:
              description: Number of pages at the requested page size.
              type:
              - integer
              - string
              - number
              - 'null'
            total_count:
              description: Number of records across all pages.
              type:
              - integer
              - string
              - number
              - 'null'
        filters:
          description: The sort options the admin offers for forms.
          type:
          - object
          - 'null'
          properties:
            sorted_by:
              description: >-
                Sort options as `[label, value]` pairs. This endpoint always returns forms
                newest first.
              type:
              - array
              - 'null'
              items:
                type:
                - array
                - 'null'
                items:
                  type:
                  - string
                  - number
                  - integer
                  - 'null'
    FormAnalyticsResponse:
      description: A form with its completion counts and monthly response volume.
      type: object
      properties:
        description:
          description: Description of the form.
          type: string
        form_elements:
          description: >-
            The form's active elements that collect an answer, each with its `id`, `type`,
            `title`, `metadata`, `position`, and `status`.
          type: array
          items:
            "$ref": "#/components/schemas/JsonValue"
        form_statistics:
          description: Completion counts for this form.
          type: object
          properties:
            completed_count:
              description: Respondents whose status is `completed`.
              type: integer
            completion_percentage:
              description: >-
                `completion_rate` formatted as text, such as `75.0%`.
              type: string
            completion_rate:
              description: >-
                `completed_count` as a percentage of `total_respondents`, from 0 to 100, rounded
