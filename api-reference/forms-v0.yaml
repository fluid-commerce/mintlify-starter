      - forms
      operationId: forms_v0_respond_to_form
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of the form to answer.
        schema:
          type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RespondToFormResponse201ApplicationJsonSchema"
              examples:
                created:
                  summary: Jim Halpert's answers were saved
                  value:
                    message: Responses created successfully
                    responses:
                    - id: 512214
                      form_element_id: 18341
                      form_respondent_id: 77162
                      response: A friend or family member
