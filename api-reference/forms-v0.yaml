  "/api/forms/{form_id}/form_elements":
    get:
      summary: List form elements
      description: |-
        Lists the elements of one of your company's forms, lowest position first. The list includes elements that later edits deactivated, which keep their answers; the response doesn't mark which elements are active, so use `form_components` on the form for the current layout. Needs a company admin token. This list is paginated by page number. Send `page` (default 1) and `per_page` (default 20); `pagination` in the response reports the current page, total pages, and total count.

        Element types a form can contain, as stored in each component's `element_type`:

        - `short_text_entry`: a single line of text.
        - `long_text_entry`: a paragraph of text.
        - `number_entry`: a number. The builder's minimum and maximum digit settings (`min`, `max`) are saved with the element but are not enforced when the form is answered at checkout.
        - `multiple_choice_entry`: one choice from `multiple_choice_options`.
        - `yes_no_entry`: a yes or no answer from `yes_no_options`.
        - `checkbox`: a single checkbox.
        - `file_upload`: a file the respondent uploads. The answer is the file's URL.
        - `input`: a prebuilt identity field. Its `puck_type` names which one: `email`, `legal_name`, `full_name`, `phone_number`, `date_of_birth`, or `ssn`.
        - `header`, `information`, `section_label`, `helper_text`, `error_text`, `page_break`, and `button`: layout and text. They collect nothing.
        - `file_download`: a file the respondent can download. It collects nothing.

        Checkout also renders the older `text`, `date`, `number`, `email`, `legal_name`, `ssn`, and `date_of_birth` types. It skips any type it doesn't recognize.
      tags:
      - form-elements
      operationId: forms_v0_list_form_elements
      security:
      - bearer_auth: []
      parameters:
      - name: form_id
        in: path
        required: true
        description: ID of the form.
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Page number, starting at 1. Defaults to 1.
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: Number of elements per page. Defaults to 20.
        schema:
          type: integer
      - name: filterrific
        in: query
        required: false
        description: >-
          Not applied by the server. Elements are always sorted by position, lowest first.
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FormElementListResponse"
              examples:
                first_two:
                  summary: The first two elements of Enrollment - United States, with per_page=2
                  value:
                    data:
                    - id: 18301
                      type: input
                      title: Legal name
                      metadata:
                        label: Legal name
                        placeholder: As it appears on your tax return
                        required: true
                      position: 0
                    - id: 18302
                      type: input
                      title: Date of birth
                      metadata:
                        label: Date of birth
                        placeholder: MM/DD/YYYY
                        required: true
                      position: 1
                    filters:
                      sorted_by:
                      - - Position (Lowest first)
                        - position_asc
                      - - Position (Highest first)
                        - position_desc
                      - - Status (Active first)
                        - status_asc
                      - - Status (Inactive first)
                        - status_desc
                    meta:
                      request_id: c3a8e1f7-5b20-4d96-8e4a-2f7d0b9c1e58
                      timestamp: '2026-10-07T15:42:30Z'
                    pagination:
                      current_page: 1
                      per_page: 2
                      total_count: 5
                      total_pages: 3
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardUnauthorizedResponse"
        '404':
          description: Not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StandardErrorResponse"
