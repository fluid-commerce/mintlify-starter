      type: object
      required:
      - enrollment_id
      - name
      - email
      - last_reminder_sent_at
      - eligible
      - skip_reason
      properties:
        enrollment_id:
          description: >-
            ID of the enrollment. Pass it in `enrollment_ids` to remind only this enrollee.
          type: integer
        name:
          description: Name the reminder email would address.
          type: string
        email:
          description: >-
            Email address of the order's customer, where the reminder would go, or `null`.
          type:
          - string
          - 'null'
        last_reminder_sent_at:
          description: >-
            When the enrollee was last sent a reminder, manual or automatic, or `null` if never.
          type:
          - string
          - 'null'
          format: date-time
        eligible:
          description: Whether **Send manual enrollment reminders** would email this enrollee now.
          type: boolean
        skip_reason:
          description: >-
            Why the enrollee can't be reminded now, or `null` when `eligible` is true.
            `email_disabled`: the company's enrollment-completion email is turned off.
            `cart_paused`: the enrollment is paused. `not_resumable`: the checkout can no longer
            be resumed. `no_email`: the customer has no email address. `no_resume_url`: there's
            no link for finishing the enrollment. `recently_reminded`: a reminder went out in
            the last 24 hours.
          type:
          - string
          - 'null'
