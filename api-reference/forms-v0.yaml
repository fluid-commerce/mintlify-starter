  "/api/forms/{id}/export_csv":
    post:
      summary: Export form responses as CSV
      description: >-
        Builds a CSV file of a form's respondents and their answers and returns a download URL
        that expires after 12 hours. The export runs while you wait; nothing is emailed.
        Sensitive answers are unmasked only when you send `include_sensitive=true` and you either
        hold the forms view-sensitive permission or are a root admin or droplet token. Every other
        export, including a root admin's or droplet's export without `include_sensitive=true`,
        shows them as `********`, and an enrollee's name, email, and phone are blank on the same
        terms. A sensitive column keeps its header either way. Returns 404 when the form
        isn't one of your company's.
      tags:
      - forms
      operationId: forms_v0_export_form_respondents_csv
      security:
      - bearer_auth: []
      parameters:
      - name: id
        in: path
        required: true
        description: ID of the form.
        schema:
          type: integer
      - name: with_completion_status
        in: query
        required: false
        description: >-
          Export only respondents with this completion status: `not_started`, `in_progress`, or
          `completed`. Omit it to export every respondent.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: >-
          Export only respondents last active at or after this time (ISO 8601). Pair with `to`
          for a closed range; omit both to export every respondent.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Export only respondents last active at or before this time (ISO 8601).
        schema:
          type: string
          format: date-time
      - name: columns
        in: query
        required: false
        description: >-
          Restrict the export to these columns. Detail columns are `name`, `email`, `phone`,
          `completion_status`, `submitted_at`, `updated_at`, and `respondent_type`; a question
          column is `question:<form_element_id>`. Omit it to export every column.
        schema:
          type: array
          items:
            type: string
      - name: include_sensitive
        in: query
        required: false
        description: Include answers the form builder marked sensitive. Required for every unmasked export, and honored only for callers holding the forms.view_sensitive permission, root admins, and droplet tokens. Every other export masks them.
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExportFormRespondentsCsvResponse200ApplicationJsonSchema"
              examples:
                masked:
                  summary: Export of Enrollment - United States, sensitive answers masked
