  "/api/forms/{id}/respond":
    post:
      summary: Respond to a form
      description: |-
        Saves one submission of a form and marks it `completed`. Who can call it:

        - A signed-in member of the form's company can answer any of the company's forms, including drafts. The answers are filed under their membership, and `contact` is ignored.
        - Anyone else can answer only an `active` form, and must send `contact` with an `email`. The answers are filed under a new contact of the form's company. Unauthenticated calls are deprecated and return a `Deprecation: true` header: collect public answers through the form's public token instead.

        Every `form_element_id` must belong to this form. This endpoint doesn't check required elements or the form's type and countries. A submission sends the `form_submitted` webhook event. Returns 404 when the form doesn't exist or the caller can't answer it.
