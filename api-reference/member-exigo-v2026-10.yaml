        - months
    ExigoRecentActivity:
      type: object
      description: >-
        A person's last orders, new direct enrollees and titles reached. The figures of the `recent-activity`
        operation.
      properties:
        operation:
          type: string
          description: Always `recent-activity`.
          const: recent-activity
        customer_id:
          type: integer
          description: The Exigo customer id these figures are for.
        path:
