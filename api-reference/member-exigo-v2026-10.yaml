openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Exigo member data
  description: |
    A member's figures from the Exigo compensation plan their company runs:
    titles, volumes, estimated payouts, commissions, payouts, the company's
    title ladders, the people in their team and their recent activity, each
    read as the smaller resource a screen needs. Every
    operation acts as the member the bearer credential speaks for; the member
    and their company come from the credential alone, and their own Exigo
    customer id is read from their membership, never from the request. A
    `team/{exigo_id}` path (or the older `of` query parameter) only picks a
    person inside that member's own downline to read; it can't switch to
    another member's account, and a credential for another company or member
    can only ever reach its own figures and downline.

    **Who can read what.** A member reads their own figures when their
    membership is rep-eligible; a `team/{exigo_id}` path naming the member's
    own id is that same read. Reading anyone else's figures, which is the
    team list and a `team/{exigo_id}` operation for someone in their
    downline, needs a rep member, a company admin or a root admin; a
    membership that is only rep-eligible is refused with `403`. Opening a person who is not in the member's downline
    answers `404` with the status `not_in_team`. The feature is off until the
    company turns on Exigo member data, and every operation answers `404`
    until then.

    **The envelope.** Every answer, including one with no figures, carries an
    `exigo` object holding the `operation`, a `status`, how fresh the figures
    are and the `figures` themselves. The HTTP code follows the `status`:
    `200` for `ready`, `503` for `unavailable` (with `Retry-After`), and `404`
    for every status that means there is nothing to read. The `figures` are
    `null` unless the status is `ready`.

    **Freshness.** `as_of` is when the figures were read from Exigo, in UTC. A
    cached answer keeps the time of the read it holds, not the time of the
    request. `stale` says whether the figures are an older copy served because
    Exigo could not answer. `is_estimate` says whether they are still moving:
    it is `true` for a summary, team, earnings or commission-history answer
    whose month has not ended.

    **Resources.** Read only what a screen shows: `summary`, `team` and `plan`;
    `commission-history`, `commissions`, `payouts` and `adjustments` for
    earnings; `title-history`, `recent-activity` and `metrics` for activity.
    `earnings` and `activity` still answer everything of theirs at once but
    are deprecated, and will be removed. A team member can be opened for
    `summary`, `team`, `title-history`, `recent-activity`, `metrics` and the
    older `activity`; the others are only ever the member's own.

    **Figures that vary by company.** The `volumes`, `pending` and `estimates`
    sections are maps whose keys are the figures the company's Exigo mapping
    defines, so they differ from company to company. Read the keys from the
    response rather than assuming a set, and use the `labels` object, which
    carries the company's own name for each key, to show them.

    **Caching.** Responses are private to the caller and are never reusable
    from a cache (`Cache-Control: private, no-store`).

    **Sandbox test companies.** A sandbox test company is linked to a live
    company. While the test company cannot be reached, because sandbox access
    is turned off for its live company or the live company was deleted, every
    operation refuses a credential for it with `403` and the standard error
    envelope, before the operation runs.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
  - MemberBearer: []
servers:
  - url: https://api.fluid.app
    description: Production API server
  - url: https://api.fluid.test
    description: Local development server
tags:
  - name: exigo
    description: >-
      The signed-in member's figures from their company's Exigo compensation plan, and those of the people
      in their team.
    x-fluid-section: Members
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a portal
        JWT whose login is linked to a membership in that company, or an
        opaque member token. The credential alone identifies the member and
        company. A member session JWT, the kind order and subscription email
        links carry, is refused with 403. A company admin's own credential is
        not a member credential and gets 401.
  headers:
    CacheControl:
      description: Standard HTTP Cache-Control directive. Exigo figures are private to the caller and never reusable from a cache.
      schema:
        type: string
        example: private, no-store
    RetryAfter:
      description: Seconds to wait before asking again.
      schema:
        type: string
        example: '60'
  parameters:
    Period:
      name: period
      in: query
      description: >-
        Month to read, as YYYY-MM. Defaults to the current month in the company's Exigo timezone. Accepted
        only for summary, team, earnings and commission-history, whose history ends at the month containing
        it; every other operation accepts no `period`.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-10'
    TeamPage:
      name: page
      in: query
      description: >-
        Page of the team list, 25 per page, from 1 to 1000. Accepted for team, commissions (the commission
        ledger) and payouts. On the member's own earnings it pages both the ledger and the payouts, an older
        form kept for existing clients; use the commissions and payouts operations instead.
      schema:
        type: string
        pattern: '^([1-9]\d{0,2}|1000)$'
        example: '2'
    TeamType:
      name: type
      in: query
      description: Limit the team list to affiliates or customers. Accepted only for team.
      schema:
        type: string
        enum:
          - affiliate
          - customer
    LedgerPage:
      name: ledger_page
      in: query
      description: >-
        Page of the earnings commission ledger, 25 per page, from 1 to 1000. Accepted only for the member's own
        earnings, which is deprecated; use `page` on commissions instead.
      schema:
        type: string
        pattern: '^([1-9]\d{0,2}|1000)$'
        example: '2'
    PayoutsPage:
      name: payouts_page
      in: query
      description: >-
        Page of the earnings payouts, 25 per page, from 1 to 1000. Accepted only for the member's own
        earnings, which is deprecated; use `page` on payouts instead.
      schema:
        type: string
        pattern: '^([1-9]\d{0,2}|1000)$'
        example: '2'
    Of:
      name: of
      in: query
      deprecated: true
      description: >-
        Exigo customer id of someone in the member's team to read instead of the member. Use the
        `team/{exigo_id}/{operation}` path instead. Accepted only for summary, team and activity, with the
        same checks as the path; the member's own id reads as if it were not sent.
      schema:
        type: string
        pattern: '^[1-9]\d{0,9}$'
        example: '4388'
  responses:
    Unauthorized:
      description: Missing or unusable member credential.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 401
            error:
              message: A member credential is required
              details:
                error: unauthorized
            meta:
              request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
              timestamp: '2026-10-21T15:04:05Z'
    Forbidden:
      description: >-
        The credential cannot read this. It is the shopper session JWT that order and subscription email
        links carry; or the membership is not rep-eligible; or the request reads the team list or another
        person's figures and the membership is not a rep member, company admin or root admin; or the
        credential is for a sandbox test company that cannot be reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 403
            error:
              message: Widget is unavailable for this membership
              details: {}
            meta:
              request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
              timestamp: '2026-10-21T15:04:05Z'
    Invalid:
      description: >-
        A query parameter this operation does not accept, or a value of the wrong shape. The message says
        which kind.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            status: 422
            error:
              message: Query parameters are not supported
              details: {}
            meta:
              request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
              timestamp: '2026-10-21T15:04:05Z'
    Unavailable:
      description: >-
        Exigo or the connector could not answer (`exigo.status` is `unavailable`, `figures` is `null`). Ask
        again after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ExigoEnvelope'
          example:
            status: 503
            exigo:
              operation: summary
              status: unavailable
              as_of: null
              stale: false
              is_estimate: false
              figures: null
            meta:
              request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
              timestamp: '2026-10-21T15:04:05Z'
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
        - request_uuid
        - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          description: The error message and details.
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              description: Further detail about the error; may be empty.
              additionalProperties: true
          required:
            - message
            - details
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - error
        - meta
    ExigoEnvelope:
      type: object
      description: The envelope every Exigo answer is in, with or without figures.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        exigo:
          $ref: '#/components/schemas/ExigoReading'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
        - status
        - exigo
        - meta
    ExigoReading:
      type: object
      description: One operation's answer, with how fresh it is.
      additionalProperties: false
      properties:
        operation:
          type: string
          description: The operation answered.
          enum:
            - summary
            - team
            - earnings
            - plan
            - activity
            - commission-history
            - commissions
            - payouts
            - adjustments
            - title-history
            - recent-activity
            - metrics
        status:
          type: string
          description: >-
            `ready` when figures are present; `not_configured` when the company has no Exigo connector or
            mapping; `no_exigo_id` when the member has no numeric Exigo id; `member_not_found` when Exigo has
            no such customer; `not_in_team` when the opened person is not in the member's downline;
            `unavailable` when Exigo or the connector could not answer.
          enum:
            - ready
            - not_configured
            - no_exigo_id
            - member_not_found
            - not_in_team
            - unavailable
        as_of:
          type:
            - string
            - 'null'
          format: date-time
          description: >-
            When the figures were read from Exigo, in UTC. A cached answer keeps the time of the read it
            holds, not the time of the request. Null when there are no figures.
        stale:
          type: boolean
          description: >-
            Whether the figures are an older copy served because Exigo could not answer. Always false for
            now; no last-good copy is kept yet.
        is_estimate:
          type: boolean
          description: >-
            Whether the figures are still moving. True for a summary, team, earnings or commission-history
            answer whose month has not ended; false for a closed month, for every other operation, and when
            there are no figures.
        figures:
          description: The operation's figures, or null unless the status is `ready`. Its shape follows `operation`.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ExigoSummary'
            - $ref: '#/components/schemas/ExigoTeam'
            - $ref: '#/components/schemas/ExigoEarnings'
            - $ref: '#/components/schemas/ExigoPlan'
            - $ref: '#/components/schemas/ExigoActivity'
            - $ref: '#/components/schemas/ExigoCommissionHistory'
            - $ref: '#/components/schemas/ExigoCommissions'
            - $ref: '#/components/schemas/ExigoPayouts'
            - $ref: '#/components/schemas/ExigoAdjustments'
            - $ref: '#/components/schemas/ExigoTitleHistory'
            - $ref: '#/components/schemas/ExigoRecentActivity'
            - $ref: '#/components/schemas/ExigoMetrics'
      required:
        - operation
        - status
        - as_of
        - stale
        - is_estimate
        - figures
    ExigoPeriod:
      description: The month the figures cover, or null for an operation that has none.
      oneOf:
        - type: 'null'
        - type: object
          properties:
            id:
              type: integer
              description: Exigo's id for the period.
            name:
              type:
                - string
                - 'null'
              description: The period's name.
            start:
              type: string
              format: date
              description: First day of the period.
            end:
              type: string
              format: date
              description: Last day of the period.
          required:
            - id
            - name
            - start
            - end
    ExigoPath:
      description: The chain from the member down to the person these figures are for, member first. A single entry when the member reads their own.
      type: array
      items:
        type: object
        properties:
          customer_id:
            type: integer
            description: The person's Exigo customer id.
          name:
            type:
              - string
              - 'null'
            description: >-
              Name from the company's member records; `Private Member` for a team member who keeps it
              private; null when Fluid has no single member with this Exigo id.
          private:
            type: boolean
            description: Whether this team member keeps their name and earnings private (never the member themselves).
        required:
          - customer_id
          - name
          - private
    ExigoTitles:
      type: object
      description: The titles a person holds on each track.
      properties:
        circle_pay:
          type:
            - string
            - 'null'
          description: The circle title paid this period.
        circle_highest:
          type:
            - string
            - 'null'
          description: The highest circle title reached.
        team_pay:
          type:
            - string
            - 'null'
          description: The team title paid. Filled only by the monthly commission run, so null mid-month.
        team_highest:
          type:
            - string
            - 'null'
          description: The highest team title reached.
      required:
        - circle_pay
        - circle_highest
        - team_pay
        - team_highest
    ExigoMoney:
      description: An amount in the person's currency, or null when there is none.
      type:
        - number
        - 'null'
    ExigoVolumes:
      description: >-
        The company's volume figures, keyed by the names its Exigo mapping defines, so the keys differ from
        company to company. A figure the company has no data for is null. Read each key's name from
        `labels.volumes`.
      type: object
      additionalProperties:
        type:
          - number
          - 'null'
    ExigoPending:
      description: >-
        Volume still scheduled this period (subscriptions), keyed like `volumes`. Every value is null
        outside the current period. Read each key's name from `labels.pending`.
      type: object
      additionalProperties:
        type:
          - number
          - 'null'
    ExigoEstimates:
      description: >-
        This month's estimated earnings by component, keyed by the names the company's mapping defines, plus
        a total. Read each key's name from `labels.estimates`.
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ExigoMoney'
    ExigoLabels:
      description: >-
        The company's own name for each key of `volumes`, `pending` and `estimates`, grouped like the figures
        they name. A key without a label is absent. Read from the stored mapping on every request, so an edit
        shows without waiting on the figures cache.
      type: object
      properties:
        volumes:
          description: Labels of the keys of `volumes`.
          type: object
          additionalProperties:
            type: string
        pending:
          description: Labels of the keys of `pending`.
          type: object
          additionalProperties:
            type: string
        estimates:
          description: Labels of the keys of `estimates` (summary and earnings).
          type: object
          additionalProperties:
            type: string
    ExigoEstimatedPayout:
      description: This month's estimated payout split into circle, team and total; null for a team member who keeps their earnings private.
      type:
        - object
        - 'null'
      additionalProperties:
        $ref: '#/components/schemas/ExigoMoney'
    ExigoTitleTrack:
      type: object
      description: One title track with the title paid this period and the highest reached.
      properties:
        track:
          type: string
          description: Which track this is.
          enum:
            - circle
            - team
        label:
          type: string
          description: The track's name.
        paid_as:
          type:
            - string
            - 'null'
          description: The title paid this period.
        highest:
          type:
            - string
            - 'null'
          description: The highest title reached.
        paid_as_label:
          type: string
          description: The company's name for the paid-as title; team track only, and only when the mapping labels it.
        highest_label:
          type: string
          description: The company's name for the highest title; team track only, and only when the mapping labels it.
      required:
        - track
        - label
        - paid_as
        - highest
    ExigoTeamLeader:
      type: object
      description: A person leading one of the member's teams.
      properties:
        id:
          type: integer
          description: The leader's Exigo customer id.
        name:
          type:
            - string
            - 'null'
          description: >-
            Name from the company's member records; `Private Member` for a leader who keeps it private; null
            when Fluid has no single member with this Exigo id.
        title:
          type:
            - string
            - 'null'
          description: The leader's title as the connector reports it; null when the connector sends none.
        private:
          type: boolean
          description: Whether this leader keeps their name and earnings private (never the member themselves).
      required:
        - id
        - name
        - title
        - private
    ExigoLedgerEntry:
      type: object
      description: One commission run's earnings.
      properties:
        run_id:
          type: integer
          description: The commission run's id.
        description:
          type:
            - string
            - 'null'
          description: The run's description.
        kind:
          type: string
          description: Whether the run is a daily or monthly run, or another kind.
          enum:
            - daily
            - monthly
            - other
        run_date:
          type:
            - string
            - 'null'
          format: date
          description: The date of the run.
        currency:
          type:
            - string
            - 'null'
          description: The currency code of the amounts.
        earnings:
          $ref: '#/components/schemas/ExigoMoney'
        total:
          $ref: '#/components/schemas/ExigoMoney'
      required:
        - run_id
        - description
        - kind
        - run_date
        - currency
        - earnings
        - total
    ExigoPayoutEntry:
      type: object
      description: One payout.
      properties:
        payout_id:
          type: integer
          description: The payout's id.
        date:
          type:
            - string
            - 'null'
          format: date
          description: The payout date.
        type:
          type:
            - string
            - 'null'
          description: How the payout was made.
        currency:
          type:
            - string
            - 'null'
          description: The currency code of the amount.
        amount:
          $ref: '#/components/schemas/ExigoMoney'
      required:
        - payout_id
        - date
        - type
        - currency
        - amount
    ExigoAdjustmentEntry:
      type: object
      description: One manual adjustment.
      properties:
        run_id:
          type: integer
          description: The commission run's id.
        run_description:
          type:
            - string
            - 'null'
          description: The run's description.
        run_date:
          type:
            - string
            - 'null'
          format: date
          description: The date of the run.
        kind:
          type: string
          description: Always `adjustment`.
          const: adjustment
        description:
          type:
            - string
            - 'null'
          description: The adjustment's description.
        currency:
          type:
            - string
            - 'null'
          description: The currency code of the amount.
        amount:
          $ref: '#/components/schemas/ExigoMoney'
      required:
        - run_id
        - run_description
        - run_date
        - kind
        - description
        - currency
        - amount
    ExigoMonthlyEarnings:
      type: object
      description: One month's earnings.
      properties:
        id:
          type: integer
          description: Exigo's id for the period.
        name:
          type:
            - string
            - 'null'
          description: The period's name.
        start:
          type: string
          format: date
          description: First day of the period.
        end:
          type: string
          format: date
          description: Last day of the period.
        circle:
          $ref: '#/components/schemas/ExigoMoney'
        team:
          $ref: '#/components/schemas/ExigoMoney'
        other:
          $ref: '#/components/schemas/ExigoMoney'
        total:
          $ref: '#/components/schemas/ExigoMoney'
      required:
        - id
        - name
        - start
        - end
        - circle
        - team
        - other
        - total
    ExigoActivityEntry:
      type: object
      description: One recent event. Which fields are present depends on `kind`.
      properties:
        kind:
          type: string
          description: What happened.
          enum:
            - order
            - enrollment
            - title
        date:
          type:
            - string
            - 'null'
          format: date
          description: When it happened.
        order_id:
          type: integer
          description: The order's id (order).
        currency:
          type:
            - string
            - 'null'
          description: The currency code of the amount (order).
        amount:
          $ref: '#/components/schemas/ExigoMoney'
        customer_id:
          type: integer
          description: The new enrollee's Exigo customer id (enrollment).
        customer_type:
          type: string
          description: Whether the new enrollee is an affiliate or a customer (enrollment).
          enum:
            - affiliate
            - customer
        name:
          type:
            - string
            - 'null'
          description: >-
            The new enrollee's name from the company's member records; `Private Member` when they keep
            it private (enrollment).
        private:
          type: boolean
          description: Whether the new enrollee keeps their name private (enrollment).
        track:
          type: string
          description: The track the title is on (title).
          enum:
            - circle
            - team
        title:
          type:
            - string
            - 'null'
          description: The title reached (title).
      required:
        - kind
        - date
    ExigoActivityMetrics:
      description: >-
        Performance metrics. `growth_trend` is the change in circle volume between the two latest
        complete months and `retention_rate` the share of direct people who bought in the earlier of them
        and again in the later one, both as fractions; null when there is nothing to compare.
      type: object
      properties:
        months_active:
          type:
            - integer
            - 'null'
          description: Months the person has been active.
        avg_order_value:
          description: Average counted order over the window, in `avg_order_currency`.
          $ref: '#/components/schemas/ExigoMoney'
        avg_order_currency:
          type:
            - string
            - 'null'
          description: The currency of the latest order; others are not blended in.
        growth_trend:
          type:
            - number
            - 'null'
          description: The change in circle volume between the two latest complete months, as a fraction.
        retention_rate:
          type:
            - number
            - 'null'
          description: The share of direct people who bought in the earlier month and again in the later one.
      required:
        - months_active
        - avg_order_value
        - growth_trend
        - retention_rate
    ExigoSummary:
      type: object
      description: A person's titles, volumes and estimated payout for a month. The figures of the `summary` operation.
      properties:
        operation:
          type: string
          description: Always `summary`.
          const: summary
        customer_id:
          type: integer
          description: The Exigo customer id these figures are for.
        path:
          $ref: '#/components/schemas/ExigoPath'
        period:
          $ref: '#/components/schemas/ExigoPeriod'
        titles:
          $ref: '#/components/schemas/ExigoTitles'
        volumes:
          $ref: '#/components/schemas/ExigoVolumes'
        pending:
          $ref: '#/components/schemas/ExigoPending'
        labels:
          $ref: '#/components/schemas/ExigoLabels'
        title_tracks:
          description: >-
            The circle and team titles as a list, in that order, each with the title paid this period and the
            highest reached. The team track carries the company's own names for the two when its mapping has
            them. The same titles are in `titles`.
          type: array
          items:
            $ref: '#/components/schemas/ExigoTitleTrack'
        estimated_payout:
          $ref: '#/components/schemas/ExigoEstimatedPayout'
        estimates:
          description: >-
            This month's estimated earnings by component, keyed by the names the company's mapping defines,
            plus a total. Read each key's name from `labels.estimates`. Null for a team member who keeps their
