        team_leaders:
          description: >-
            The people leading the teams, one per entry of `teams` and in the same order. Present only for a
            member who may read the team list (a rep member, company admin or root admin); a member who is
            only rep-eligible gets their summary without it, and `teams` is unchanged.
          type: array
          items:
            $ref: '#/components/schemas/ExigoTeamLeader'
      required:
