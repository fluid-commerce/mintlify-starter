paths:
  /api/member/v2026-10/exigo/{operation}:
    get:
      operationId: member_exigo_show
      tags:
        - exigo
      summary: Read the member's Exigo figures
      x-fluid-audience: member
      description: >-
        Returns one operation's figures for the signed-in member from their company's Exigo connector. The
        member is always the bearer's member and their Exigo id comes from their membership, never from the
        request. The company must have Exigo member data turned on, and the membership must be rep-eligible;
        the team list (`team`) is for rep members, company admins and root admins. `summary` is titles,
        volumes, the estimated payout and the estimates; `team` is the people directly below the member; `plan`
        is the company's title ladders, the same for every member. Earnings come as `commission-history`
        (the last six months, ending at the `period` month), `commissions` (the commission ledger, paged with
        `page`), `payouts` (paged with `page`) and `adjustments` (manual adjustment lines); activity comes as
        `title-history` (the titles and circle volume of each recent month), `recent-activity` (recent orders,
        enrollments and titles) and `metrics` (performance metrics). `earnings` is deprecated: use
        commission-history, commissions, payouts and adjustments. `activity` is deprecated: use
        title-history, recent-activity and metrics. An operation answers `422` for a query parameter it does
        not accept. Answers are cached briefly per member, operation, month, pages and opened person, names
        included.
      parameters:
        - name: operation
          in: path
          required: true
          description: The operation to read.
          schema:
            type: string
            enum:
              - summary
              - team
              - earnings
              - plan
              - activity
              - commission-history
              - commissions
              - payouts
              - adjustments
              - title-history
              - recent-activity
              - metrics
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/TeamPage'
        - $ref: '#/components/parameters/TeamType'
        - $ref: '#/components/parameters/LedgerPage'
        - $ref: '#/components/parameters/PayoutsPage'
        - $ref: '#/components/parameters/Of'
      responses:
        '200':
          description: The figures. Their shape follows the operation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExigoEnvelope'
              example:
                status: 200
                exigo:
                  operation: summary
                  status: ready
                  as_of: '2026-10-21T15:04:05Z'
                  stale: false
                  is_estimate: true
                  figures:
                    operation: summary
                    customer_id: 4021
                    path:
                      - customer_id: 4021
                        name: Sam Example
                        private: false
                    period:
                      id: 24
                      name: October 2026
                      start: '2026-10-01'
                      end: '2026-10-31'
                    titles:
                      circle_pay: Silver
                      circle_highest: Gold
                      team_pay: null
                      team_highest: Gold II
                    volumes:
                      personal_points: 1250.5
                      group_points: 8800
                      qualified_legs: 2
                    pending:
                      group_points: 640.25
                    labels:
                      volumes:
                        personal_points: Personal Points
                        group_points: Group Points
                        qualified_legs: Qualified Legs
                      pending:
                        group_points: Scheduled Group Points
                      estimates:
                        circle_sales: Circle Sales
                        team_sales: Team Sales
                    title_tracks:
                      - track: circle
                        label: Circle
                        paid_as: Silver
                        highest: Gold
                      - track: team
                        label: Team
                        paid_as: null
                        highest: Gold II
                        highest_label: Highest Team Rank
                    estimated_payout:
                      circle: 100
                      team: 25.5
                      total: 125.5
                    estimates:
                      circle_sales: 100
                      team_sales: 25.5
                      total: 125.5
                    teams:
                      - 4388
                      - 5120
                    team_leaders:
                      - id: 4388
                        name: Alex Sample
                        title: Gold
                        private: false
                      - id: 5120
                        name: Private Member
                        title: null
                        private: true
                meta:
                  request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
                  timestamp: '2026-10-21T15:04:05Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            There is nothing to read. Either the company has not turned on Exigo member data, or the operation
            is unknown (an error envelope); or there are no figures (`exigo.status` is `not_configured`,
            `no_exigo_id`, `member_not_found` or `not_in_team`, and `figures` is `null`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExigoEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: 404
                exigo:
                  operation: summary
                  status: no_exigo_id
                  as_of: null
                  stale: false
                  is_estimate: false
                  figures: null
                meta:
                  request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
                  timestamp: '2026-10-21T15:04:05Z'
        '422':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/member/v2026-10/exigo/team/{exigo_id}/{operation}:
    get:
      operationId: member_exigo_team_member_show
      tags:
        - exigo
      summary: Read a team member's Exigo figures
      x-fluid-audience: member
      description: >-
        Opens someone in the member's team, by the Exigo customer id a team list's people carry, for summary,
        team, activity, title-history, recent-activity and metrics. The connector refuses anyone outside the
        member's downline (`exigo.status` is `not_in_team`, 404), and reading anyone other than yourself needs
        a rep member, company admin or root admin. The member's own id reads as their own figures. The plan
        and the earnings resources (earnings, commission-history, commissions, payouts and adjustments) are
        only ever the member's own. The answer is shaped like the member's own, and the figures name whose they are
        (`customer_id`) and the chain from the member to them (`path`). A team member who keeps their
        earnings private appears as `Private Member` with no estimated payout.
      parameters:
        - name: exigo_id
          in: path
          required: true
          description: Exigo customer id of someone in the member's team, as a team list's `customer_id`.
          schema:
            type: string
            pattern: '^[1-9]\d{0,9}$'
        - name: operation
          in: path
          required: true
          description: The operation to read for that person.
          schema:
            type: string
            enum:
              - summary
              - team
              - activity
              - title-history
              - recent-activity
              - metrics
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/TeamPage'
        - $ref: '#/components/parameters/TeamType'
      responses:
        '200':
          description: The figures of the person opened. Their shape follows the operation.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExigoEnvelope'
              example:
                status: 200
                exigo:
                  operation: activity
                  status: ready
                  as_of: '2026-10-21T15:04:05Z'
                  stale: false
                  is_estimate: false
                  figures:
                    operation: activity
                    customer_id: 4388
                    path:
                      - customer_id: 4021
                        name: Sam Example
                        private: false
                      - customer_id: 4388
                        name: Alex Sample
                        private: false
                    recent:
                      - kind: order
                        date: '2026-10-12'
                        order_id: 90210
                        currency: usd
                        amount: 84.5
                      - kind: enrollment
                        date: '2026-09-29'
                        customer_id: 6150
                        customer_type: affiliate
                        name: Jordan Placeholder
                        private: false
                      - kind: title
                        date: '2026-08-01'
                        track: circle
                        title: Silver
                    metrics:
                      months_active: 14
                      avg_order_value: 91.25
                      avg_order_currency: usd
                      growth_trend: 0.04
                      retention_rate: 0.83
                meta:
                  request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
                  timestamp: '2026-10-21T15:04:05Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >-
            There is nothing to read. Either the company has not turned on Exigo member data, or the operation
            or Exigo id is malformed (an error envelope); or there are no figures (`exigo.status` is
            `not_configured`, `no_exigo_id`, `member_not_found` or `not_in_team`, and `figures` is `null`).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExigoEnvelope'
                  - $ref: '#/components/schemas/ErrorEnvelope'
              example:
                status: 404
                exigo:
                  operation: summary
                  status: not_in_team
                  as_of: null
                  stale: false
                  is_estimate: false
                  figures: null
                meta:
                  request_uuid: 01a0f4fe-de00-75b3-8d8a-b74b0cde8b07
                  timestamp: '2026-10-21T15:04:05Z'
        '422':
          $ref: '#/components/responses/Invalid'
        '503':
          $ref: '#/components/responses/Unavailable'
