        Returns per-channel economics for the trailing 30 days.
        Seven canonical channels in fixed order, each carrying
        converted revenue, distinct visitors, revenue-per-visitor,
        and the page-view delta versus the preceding 30-day window.
        Composes the same Metrics::TrafficSourcesCalculator and
