  "/api/v202604/analytics/dashboard/subscription_engine":
    get:
      operationId: getAnalyticsDashboardSubscriptionEngine
      tags:
      - analytics_dashboard_home_overview
      summary: Home > Overview subscription-engine card (4-week schedule + health tiles)
      description: |
        Returns the forward-looking recurring-revenue snapshot: four
        weekly scheduled-revenue bars for the next 28 days, the active
        subscriber count (with net change this month), the recovery
        rate (with a trailing 6-month baseline), and cancels this
        month (with a trailing 6-month monthly-average baseline).

        Active subscribers = `active` + `past_due` — past-due subs
        still bill through dunning and still count as customers.
        Recovery rate uses a simple failed→succeeded transition proxy;
        Card 6 will formalise the full recovered / retrying /
        written-off split.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Subscription-engine card payload
          content:
