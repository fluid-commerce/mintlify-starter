      summary: Home > Overview cumulative-revenue trend chart with comparators + band
      description: |
        Returns the cumulative-revenue trend chart that sits below the
        header tiles on the Home > Overview tab. One payload holds the
        current month's daily line, two comparator curves (vs last
        month, vs last year), and a DOW-derived expected-range band —
        the frontend toggles between comparators locally without a
        second fetch.

        The plan-overlay line and the "+$X vs plan" annotation from
        the design depend on the not-yet-migrated `revenue_budgets`
        table and are not returned here; the frontend renders without
        them until that table lands (spec decision D-1).
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Trend chart payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardTrendResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
  "/api/v202604/analytics/dashboard/field_momentum":
    get:
      operationId: getAnalyticsDashboardFieldMomentum
      tags:
      - analytics_dashboard_home_field
      summary: Home > Field momentum header (Phase 003 Card 1)
      description: |
        Returns the three tiles above the Field tab's 14-day rep-
        activity chart: reps active on the store-local calendar
        yesterday (with a same-weekday 12-week median for the
        sub-label), reps active month-to-date, and the sum of
        attribution-scoped revenue MTD in the company default
        currency. `typical_for_weekday` is null when the tenant has
        fewer than four same-weekday dates on record — the FE drops
        the sub-label in that case.

        When `country` is set: the two order-side aggregates
        (`rep_revenue_mtd`, `rep_revenue_share_pct`) filter on
        `orders.country_id`. The active-rep tiles (`active_yesterday`,
        `active_this_month`) and `typical_for_weekday` remain
        aggregate — share.visited events do not carry a reliable
        country signal today (see BE service TomDoc for the
        `analytics_events.country_code` coverage gap). Consumers
        should present the active-rep counts as company-wide even
        under a country pick until ingest populates the column.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Field momentum header payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardFieldMomentumResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
  "/api/v202604/analytics/dashboard/field_activity_chart":
    get:
      operationId: getAnalyticsDashboardFieldActivityChart
      tags:
      - analytics_dashboard_home_field
      summary: Home > Field 14-day rep activity chart (Phase 003 Card 2)
      description: |
        Returns a 14-day series of distinct active reps per day
        alongside a same-weekday 12-week median baseline. A rep is
        "active" on a date if they had a `share.visited` event keyed
        to them via `analytics_events.member_id` OR a paid order with
        `orders.attribution_member_id = rep.id`. `typical` per point
        is null when fewer than four prior same-weekday dates
        carried any activity — the FE renders a gap in the baseline
        line for that weekday.

        When `country` is set: only the order-side rep pluck
        filters on `orders.country_id`. The share.visited half of
        each daily count stays company-wide because
        `analytics_events.country_code` is unreliably populated
        today. The `reps` and `typical` numbers are therefore
        blended (country-scoped orders + aggregate shares); the
        Field header's active-rep tiles carry the same blend so
        the day-14 chart point matches the header's yesterday tile
        under either filter state.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: 14-day rep activity chart payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardFieldActivityChartResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
  "/api/v202604/analytics/dashboard/field_rising_reps":
    get:
      operationId: getAnalyticsDashboardFieldRisingReps
      tags:
      - analytics_dashboard_home_field
      summary: Home > Field "Rising" card (Phase 003 Card 3)
      description: |
        Returns up to five reps whose trailing-7-day attributed
        revenue has cleared 1.5× their trailing-28-day daily average
        scaled to a week. Ranked by that ratio descending. Each row
        carries `name`, a one-line `detail`, trailing-28-day
        `monthly_revenue`, and a 12-day `spark` of daily revenue.
        Returns an empty `movers` array when no rep meets the
        threshold.

        When `country` is set: the single order-side scan filters
        on `orders.country_id`, and the 7-day / 28-day windows are
        computed from the same country-scoped row set so the ratio
        stays self-consistent under the pick. The card doesn't
        read `share.visited` events, so no aggregate share carve-
        out applies here — all Rising numbers respect the country
        filter cleanly.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Rising reps payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardFieldRisingRepsResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
  "/api/v202604/analytics/dashboard/field_going_quiet_reps":
    get:
      operationId: getAnalyticsDashboardFieldGoingQuietReps
      tags:
      - analytics_dashboard_home_field
      summary: Home > Field "Going quiet" card (Phase 003 Card 4)
      description: |
        Returns up to five reps silent for 7+ days who had ≥ 4
        events (attributed orders + share.visited rows) in the
        prior 28 days. Ranked by days_quiet descending;
        days_quiet capped at 90 so the badge stays readable.
        Empty when no rep qualifies.

        When `country` is set: only the order-side trailing-28-day
        pluck filters on `orders.country_id`. The share.visited
        activity check remains company-wide because
        `analytics_events.country_code` is unreliably populated
        today. A rep with only share activity in-country counts
        as "active" under either filter state; the qualifying
        threshold (≥ 4 events) and the `days_quiet` calculation
        both blend country-scoped orders with aggregate shares.
        Consumers should present the "going quiet" list as a
        conservative signal under a country pick — a rep with
        country-scoped orders but out-of-country share activity
        would still not surface here.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Going quiet reps payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardFieldGoingQuietRepsResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
  "/api/v202604/analytics/dashboard/field_leaderboard":
    get:
      operationId: getAnalyticsDashboardFieldLeaderboard
      tags:
      - analytics_dashboard_home_field
      summary: Home > Field "Leaderboard" card (Phase 003 Card 5)
      description: |
        Returns up to 50 reps ranked by current-calendar-month
        attributed revenue, desc. Each row carries visitors
        (distinct share.visited sessions), orders (attributed
        order count), revenue, a 12-point spark, an optional
        top-asset preview, and a rank-change vs prior month
        (null = "new" this month). Rows are pre-sorted by
        revenue; the FE applies search / sort / filter
        client-side.

        When `country` is set: the ranking, spark, and rank-
        change all filter on `orders.country_id` — both the
        current-month AND prior-month scans, so the delta stays
        honest under the pick. `visitors` (distinct share.visited
        sessions) and the top-asset preview remain aggregate
        because `analytics_events.country_code` and the rep
        rollup tables are unreliably country-tagged today. The
        rank itself is country-scoped; the visitor number on
        each row still reflects company-wide share activity —
        useful for scale but not directly comparable to the
        country-scoped revenue.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Leaderboard payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardFieldLeaderboardResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '422':
          "$ref": "#/components/responses/Unprocessable"
