      summary: Home > Overview revenue-by-order-type card (two parallel stacked bars)
      description: |
        Returns the composition card that sits below the trend chart on
        Home > Overview. The payload contains two parallel per-day
        breakdowns — one bucketing paid revenue by order source and
        one bucketing by whether the buyer is a rep — plus MTD totals
        with percentage shares for each axis. The frontend renders
        both bars side by side with a Revenue / Orders toggle.

        Spec decision D-2 chose the two-parallel-bar layout (option A)
        because the source and buyer axes overlap in the data (a
        rep-bought web order lives in both `web` and `rep_bought`); a
        single cascaded bucket would have masked that overlap.
      parameters:
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Order-composition card payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardOrderCompositionResponse"
        '400':
          "$ref": "#/components/responses/InvalidCountry"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '403':
