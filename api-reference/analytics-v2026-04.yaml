  "/api/v202604/analytics/subscription_billing/day":
    get:
      operationId: getAnalyticsSubscriptionBillingDay
      tags:
      - analytics_subscription_billing
      summary: Subscription Billing one day's renewals, each with its risk band
      description: |
        Returns one page of a single day's renewals for the day drawer.

        A day has two kinds of row and a subscription can be either: one
        still scheduled to bill on the date, or one whose charge already
        ran. Today has both. A renewal that qualifies as both — billed
        early and already scheduled again — is reported as settled,
        because an outcome that exists outranks a grade that predicts
        one.

        The scheduled half repeats the billing pipeline's own
        eligibility gates, so a renewal automatic billing will never
        claim is not listed as one the operator can expect to collect.
        The settled half applies none of them: what ran, ran.

        Every row carries the risk band
        `Analytics::RenewalRiskBands` gave it — the same classifier
        behind the month grid's at-risk figures. The band is served
        rather than left to the caller precisely so a client cannot
        keep a second copy of those rules and drift from the cell that
        opened the drawer.

        `search` and `status` are answered over the whole day, not over
        the page. The drawer used to narrow the rows it had already
        loaded, which on a day spanning pages is not a filter but a
        coincidence — a "Failed" chip found the failures on page one and
        said nothing at all about the other five. `total_count` counts
        what matched; `summary` keeps describing the day itself, so the
        figures above the list do not move as the operator narrows it.
      parameters:
      - "$ref": "#/components/parameters/DayDateQueryParam"
      - "$ref": "#/components/parameters/CountryQueryParam"
      - "$ref": "#/components/parameters/TimeZoneQueryParam"
      - "$ref": "#/components/parameters/DaySearchQueryParam"
      - "$ref": "#/components/parameters/DayStatusQueryParam"
      - "$ref": "#/components/parameters/DayPageQueryParam"
      - "$ref": "#/components/parameters/DayPerPageQueryParam"
      responses:
        '200':
          description: One page of the day's renewals
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubscriptionBillingDayResponse"
              example:
                date: '2026-09-17'
                time_zone: America/New_York
                currency: USD
                page: 1
                per_page: 25
                total_count: 8
                summary:
                  renewal_count: 8
                  average_amount: '53.11'
                  new_customer_count: 2
                  returning_customer_count: 6
                  top_products:
                  - product_id: 9021
                    name: Dunder Mifflin 20lb Copy Paper
                    count: 5
                    amount: '329.94'
                  - product_id: 9044
                    name: Schrute Farms Beet Box
                    count: 2
                    amount: '79.98'
                  - product_id: 9037
                    name: Scranton Branch Mug
                    count: 1
                    amount: '14.99'
                  status_counts:
                    failed: 0
                    at_risk: 0
                    retrying: 1
                    scheduled: 0
                    cleared: 7
                entries:
                - subscription_id: 48213
                  subscription_token: sub_9f3c2a
                  customer_name: Holly Flax
                  customer_email: holly.flax@gmail.com
                  variant_name: Dunder Mifflin 20lb Copy Paper
                  quantity: 2
                  amount: '109.98'
                  currency: USD
                  status: active
                  occurred_at: '2026-09-17T14:05:12-04:00'
                  settled: true
                  outcome: awaiting_retry
                  declined: true
                  decline_reason: Your card has insufficient funds.
                  risk_level: elevated
                  risk_factors:
                  - dunning_in_flight
                  - prior_failures
                  awaiting_retry: true
                  next_retry_at: '2026-09-19T14:00:00-04:00'
                  last_failed_at: '2026-09-17T14:05:12-04:00'
                  already_emailed: false
                  failure_already_emailed: true
                  day_status: retrying
                - subscription_id: 48227
                  subscription_token: sub_4b71de
                  customer_name: Jan Levinson
                  customer_email: jan.levinson@serenitybyjan.com
                  variant_name: Schrute Farms Beet Box
                  quantity: 1
