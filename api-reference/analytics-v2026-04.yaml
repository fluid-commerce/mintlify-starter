paths:
  "/api/v202604/analytics/subscription_billing/calendar":
    get:
      operationId: getAnalyticsSubscriptionBillingCalendar
      tags:
      - analytics_subscription_billing
      summary: Subscription Billing month grid (scheduled, at risk, settled)
      description: |
        Returns one row per date in the requested month — what is
        scheduled to bill, how much of it is graded at risk, and what
        already settled — plus the previous month's totals for the
        month-over-month figure. Both months come from one service call
        over a single widened range, so the comparison cannot be
        assembled from two reads of different data.

        Two halves, two sources. Days still to come read
        `commerce_subscriptions.next_bill_date`, bucketed in the `tz`
        the operator is reading in (echoed back as `time_zone`). Days
        that have run read `commerce_billing_events`, whose
        `local_billed_date` is already local.

        Money is `price * quantity`, which is what a renewal charges.
        Note that the Home > Overview subscription-engine and
        payment-recovery cards still sum bare `price`, so they read low
        against this endpoint for any fleet carrying `quantity > 1`
        until that is corrected.

        Renewals are graded at risk by a deterministic read of dunning
        state — prior declines, hard declines, staleness, whether the
        retry chain has them in hand. No per-renewal likelihood is
        served; nothing in the platform produces one.
      parameters:
      - "$ref": "#/components/parameters/MonthQueryParam"
      - "$ref": "#/components/parameters/CountryQueryParam"
      - "$ref": "#/components/parameters/TimeZoneQueryParam"
      responses:
        '200':
          description: Month grid payload
          content:
