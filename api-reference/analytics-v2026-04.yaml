  "/api/v202604/analytics/payments/overview":
    get:
      operationId: getAnalyticsPaymentsOverview
      x-fluid-audience: company
      tags:
      - analytics_payments
      summary: Payment performance over a date range
      description: |
        Returns the Payments > Performance page in one payload: three
        rates, the trend, decline reasons, breakdowns and checkouts that
        tried many cards, for the range and for the range of equal
        length just before it.

        The three rates answer different questions.
        `checkout_success_rate` is the share of checkouts with an
        approved attempt, counting a checkout once however often it
        retried. `approval_rate` is approved over answered attempts,
        which retries pull down. `card_approval_rate` is distinct
        checkout cards approved over distinct checkout cards tried,
        which a stolen-card run moves most. Approval is the issuer's
        answer: an authorization counts when approved, before capture.

        Decline reasons use `Commerce::Payments::DeclineClassifier`, the
        classes renewal dunning acts on. Money is in the company's
        currency, or the selected country's.
      parameters:
      - "$ref": "#/components/parameters/PaymentRangeFromQueryParam"
      - "$ref": "#/components/parameters/PaymentRangeToQueryParam"
      - "$ref": "#/components/parameters/TimeZoneQueryParam"
      - "$ref": "#/components/parameters/CountryQueryParam"
      - "$ref": "#/components/parameters/PaymentModeQueryParam"
      - "$ref": "#/components/parameters/PaymentFlowQueryParam"
      - "$ref": "#/components/parameters/PaymentAccountQueryParam"
