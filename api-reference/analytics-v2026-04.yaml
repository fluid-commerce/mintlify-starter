  "/api/v202604/analytics/subscription_billing/breakdown":
    get:
      operationId: getAnalyticsSubscriptionBillingBreakdown
      tags:
      - analytics_subscription_billing
      summary: Subscription Billing month reporting (reasons, markets, timing)
      description: |
        Returns the requested month's failure reporting: decline
        reasons, market splits, timing buckets, and the daily revenue
        trend.

        Reasons are bucketed through the same category list the Home >
        Overview recovery card uses, and recoverability is
        `Commerce::BillingEvent.retriable_failure?` — the predicate the
        retry cron itself gates on — so nothing is reported as
        recoverable that the chain would refuse to attempt.

        Rates are withheld rather than estimated below a sample floor:
        a timing bucket reports `sufficient_sample: false` and a null
        rate, and a thin market reports a null `top_decline_reason`.

        Cohort retention is deliberately absent. It has no source in
        the platform today and is tracked as its own phase.
      parameters:
      - "$ref": "#/components/parameters/MonthQueryParam"
      - "$ref": "#/components/parameters/CountryQueryParam"
      responses:
        '200':
          description: Month reporting payload
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SubscriptionBillingBreakdownResponse"
              example:
                month: '2026-09-01'
                currency: USD
                resolved_count: 334
                succeeded_count: 325
                failure_count: 9
                failure_rate: '2.7'
                recoverable_amount: '274.95'
                lost_amount: '109.98'
                daily_trend:
                - date: '2026-09-01'
                  revenue: '604.89'
                - date: '2026-09-02'
                  revenue: '494.91'
                - date: '2026-09-03'
                  revenue: '659.88'
                - date: '2026-09-04'
                  revenue: '549.9'
