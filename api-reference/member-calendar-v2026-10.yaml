---
openapi: 3.1.0
info:
  title: Fluid Member API v2026-10 — Calendar
  description: >-
    Read the member’s private entries and visible company events in a bounded calendar window. Manage
    personal entries without changing the company calendar.
  contact:
    email: support@fluid.app
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 2026-10
security:
- MemberBearer: []
servers:
- url: https://api.fluid.app
  description: Production API server
- url: https://api.fluid.test
  description: Local development server
tags:
- name: calendar-events
  description: >-
    The member's own calendar entries and the company events visible to them, read through a bounded window.
  x-fluid-section: Content and tools
- name: calendar-catch-ups
  description: Follow-ups the company's catch-up rules generate for the member, with dismiss and complete
    actions.
  x-fluid-section: Content and tools
components:
  securitySchemes:
    MemberBearer:
      type: http
      scheme: bearer
      description: |
        A member credential in the `Authorization: Bearer` header: a member
        session JWT, a portal JWT whose login is linked to a membership in
        that company, or a member token. The credential alone
        identifies the member and company.
  headers:
    ETag:
      description: >-
        Fingerprint of this member's representation. Send it back in If-None-Match to skip the body while
        it is unchanged.
      schema:
        type: string
    CacheControl:
      description: Standard HTTP Cache-Control directive. Always private for this surface.
      schema:
        type: string
        example: max-age=60, private
  schemas:
    ResponseMeta:
      type: object
      description: Envelope metadata present on every response.
      properties:
        request_uuid:
          type: string
          format: uuid
          description: Server-generated UUIDv7 uniquely identifying this response.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp at which the server produced the response.
      required:
      - request_uuid
      - timestamp
      additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Standard error envelope.
      properties:
        status:
          type: integer
          description: HTTP status code (mirrors the response status line).
        error:
          type: object
          properties:
            message:
              type: string
              description: Human-readable error message.
            details:
              type: object
              additionalProperties: true
          required:
          - message
          - details
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
      required:
      - status
      - error
      - meta
    ContactReference:
      type: object
      description: A contact the member owns.
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: First and last name, or null when the contact has neither.
    CalendarLocation:
      type: object
      description: Where the entry happens.
      additionalProperties: false
      required:
      - kind
      - address
      - url
      properties:
        kind:
          type: string
          enum:
          - physical
          - virtual
          description: "`physical` when there is an address (a company event's venue), `virtual` when
            there is only a URL."
        address:
          type:
          - string
          - 'null'
          description: Street address or venue name.
        url:
          type:
          - string
          - 'null'
          description: Meeting or event URL.
    CalendarEvent:
      type: object
      description: One calendar entry.
      additionalProperties: false
      required:
      - id
      - source
      - title
      - description
      - starts_at
      - ends_at
      - all_day
      - time_zone
      - location
      - contact
      - created_at
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
          enum:
          - mine
          - company
          description: >-
            `mine` for the member's own entry, which only they see and can change; `company` for a company
            calendar event, which they can read.
        title:
          type: string
        description:
          type:
          - string
          - 'null'
          description: Plain text.
        starts_at:
          type: string
          format: date-time
          description: Start instant in UTC, preserving stored microsecond precision.
        ends_at:
          type: string
          format: date-time
          description: End instant in UTC, preserving stored microsecond precision. A company event without an end is a point event at its start.
        all_day:
          type: boolean
        time_zone:
          type: string
          description: The zone the entry is planned in, such as `America/Denver`.
        location:
          oneOf:
          - "$ref": "#/components/schemas/CalendarLocation"
          - type: 'null'
        contact:
          oneOf:
          - "$ref": "#/components/schemas/ContactReference"
          - type: 'null'
          description: The contact an own entry is about; always null on company events.
        created_at:
          type: string
          format: date-time
          description: Creation instant in UTC, preserving stored microsecond precision.
        rsvp:
          type:
          - string
          - 'null'
          enum:
          - going
          - maybe
          - declined
          -
          description: The member's own answer to a company event; always null on their own entries.
    CalendarEventCreate:
      type: object
      description: A new personal entry.
      additionalProperties: false
      required:
      - title
      - starts_at
      - ends_at
      - time_zone
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        description:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Must not precede `starts_at`.
        all_day:
          type: boolean
          description: Defaults to false.
        time_zone:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: An IANA or Rails time zone name.
        location:
          type:
          - object
          - 'null'
          description: Where the entry happens; null clears it.
          additionalProperties: false
          required:
          - kind
          properties:
            kind:
              type: string
              enum:
              - physical
              - virtual
            address:
              type:
              - string
              - 'null'
              maxLength: 255
            url:
              type:
              - string
              - 'null'
              maxLength: 255
        contact_id:
          type:
          - string
          - 'null'
          format: uuid
          description: A contact the member owns; null unlinks it. Any other id is 422.
    CalendarEventUpdate:
      type: object
      description: Fields to change; others stay as they are.
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
        description:
          type:
          - string
          - 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          description: Must not precede `starts_at`.
        all_day:
          type: boolean
          description: Defaults to false.
        time_zone:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          description: An IANA or Rails time zone name.
        location:
          type:
          - object
          - 'null'
          description: Where the entry happens; null clears it.
          additionalProperties: false
          required:
          - kind
          properties:
            kind:
              type: string
              enum:
              - physical
              - virtual
            address:
              type:
              - string
              - 'null'
              maxLength: 255
            url:
              type:
              - string
              - 'null'
              maxLength: 255
        contact_id:
          type:
          - string
          - 'null'
          format: uuid
          description: A contact the member owns; null unlinks it. Any other id is 422.
    CalendarEventEnvelope:
      type: object
      description: One calendar entry.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/CalendarEvent"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    CalendarEventsEnvelope:
      type: object
      description: Calendar entries in the window, ordered by start time.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CalendarEvent"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - truncated
            - pagination
            properties:
              truncated:
                type: boolean
                description: True while more entries remain beyond this page; send
                  `pagination.next_cursor` as `page[cursor]` to read them.
              pagination:
                type: object
                description: Keyset pagination state for the window.
                additionalProperties: false
                required:
                - next_cursor
                properties:
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Send as `page[cursor]` with the same `from`, `to`
                      and `source` for the next page; null on the last page.
    CatchUp:
      type: object
      description: A follow-up suggested by the company's catch-up rules.
      additionalProperties: false
      required:
      - id
      - kind
      - title
      - description
      - status
      - contact
      - created_at
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type:
          - string
          - 'null'
          description: The rule that generated it, such as `UpcomingEventCatchUp`.
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - pending
          - dismissed
          - completed
          description: "`pending` while an action awaits the member."
        contact:
          oneOf:
          - "$ref": "#/components/schemas/ContactReference"
          - type: 'null'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: After this the catch-up is no longer listed or addressable.
    CatchUpEnvelope:
      type: object
      description: One catch-up.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          "$ref": "#/components/schemas/CatchUp"
        meta:
          "$ref": "#/components/schemas/ResponseMeta"
    CatchUpsEnvelope:
      type: object
      description: A page of catch-ups.
      required:
      - status
      - data
      - meta
      properties:
        status:
          type: integer
        data:
          type: array
          items:
            "$ref": "#/components/schemas/CatchUp"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ResponseMeta"
          - type: object
            required:
            - pagination
            properties:
              pagination:
                "$ref": "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      description: Keyset pagination state for a list.
      additionalProperties: false
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Send as `page[cursor]` for the next page; null on the last page.
      required:
      - next_cursor
paths:
  "/api/member/v2026-10/calendar/events":
    get:
      operationId: member_calendar_events_index
      tags:
      - calendar-events
      summary: List calendar events in a window
      description: Return private entries and active company events overlapping [from,
        to), ordered by start time and public id. Company events must be available
        in the member’s country. GET_EVENTS_FROM_USER_COMPANY additionally restricts
        assigned events to the current user when enabled. Unscheduled company events
        are omitted. A missing company end is a point at its start; point events at
        from are included and events at to are excluded. Windows span at most 93 days.
        A page holds at most 250 entries; while meta.truncated is true, send
        meta.pagination.next_cursor as page[cursor] to read the rest of the same window.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication runs before a 304 is considered.
        schema:
          type: string
      - name: from
        in: query
        required: true
        description: Start of the window (inclusive), ISO 8601.
        schema:
          type: string
          format: date-time
        example: '2026-10-01T00:00:00Z'
      - name: to
        in: query
        required: true
        description: End of the window (exclusive), after `from` and at most 93 days later.
        schema:
          type: string
          format: date-time
        example: '2026-10-31T23:59:59Z'
      - name: source
        in: query
        required: false
        description: "`mine`, `company`, or `all` (the default)."
        schema:
          type: string
          enum:
          - mine
          - company
          - all
          default: all
      - name: page[cursor]
        in: query
        required: false
        description: Encrypted cursor from the previous page of this same `from`,
          `to` and `source`; any other window is 400.
        schema:
          type: string
      responses:
        '200':
          description: Entries in the window.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEventsEnvelope"
              example:
                status: 200
                data:
                - id: '0192f8b4-6e7f-7a8b-9c0d-1e2f3a4b5c6d'
                  source: mine
                  title: Coffee with Dana Whitfield
                  description: Bring the starter-kit samples.
                  starts_at: '2026-10-08T15:30:00Z'
                  ends_at: '2026-10-08T16:15:00Z'
                  all_day: false
                  time_zone: America/Denver
                  location:
                    kind: physical
                    address: Kaladi Brothers, 1500 W 47th Ave, Denver
                    url:
                  contact:
                    id: '0192f7c2-1a2b-7c3d-8e4f-5a6b7c8d9e0f'
                    name: Dana Whitfield
                  created_at: '2026-10-01T15:08:21Z'
                - id: '0192f8a1-3c4d-7e5f-8a6b-7c8d9e0f1a2b'
                  source: company
                  title: Fall product launch
                  description: Live walkthrough of the new wellness line.
                  starts_at: '2026-10-14T17:00:00Z'
                  ends_at: '2026-10-14T18:30:00Z'
                  all_day: false
                  time_zone: America/Denver
                  location:
                    kind: virtual
                    address:
                    url: https://events.primex.com/fall-launch
                  contact:
                  created_at: '2026-09-20T16:02:11Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
                  truncated: false
                  pagination:
                    next_cursor:
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '400':
          description: Malformed, tampered or foreign cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: >-
            `from` or `to` is missing or malformed, the window is empty or longer than 93 days, or a parameter
            is unknown.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    post:
      operationId: member_calendar_events_create
      tags:
      - calendar-events
      summary: Add a personal calendar event
      description: >-
        Create an entry only this member sees. It is never added to the company calendar, so it produces
        no company webhook, attendee notification or catch-up.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CalendarEventCreate"
            example:
              title: Coffee with Dana Whitfield
              description: Bring the starter-kit samples.
              starts_at: '2026-10-08T15:30:00Z'
              ends_at: '2026-10-08T16:15:00Z'
              time_zone: America/Denver
              location:
                kind: physical
                address: Kaladi Brothers, 1500 W 47th Ave, Denver
              contact_id: '0192f7c2-1a2b-7c3d-8e4f-5a6b7c8d9e0f'
      responses:
        '201':
          description: The created entry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEventEnvelope"
              example:
                status: 201
                data:
                  id: '0192f8b4-6e7f-7a8b-9c0d-1e2f3a4b5c6d'
                  source: mine
                  title: Coffee with Dana Whitfield
                  description: Bring the starter-kit samples.
                  starts_at: '2026-10-08T15:30:00Z'
                  ends_at: '2026-10-08T16:15:00Z'
                  all_day: false
                  time_zone: America/Denver
                  location:
                    kind: physical
                    address: Kaladi Brothers, 1500 W 47th Ave, Denver
                    url:
                  contact:
                    id: '0192f7c2-1a2b-7c3d-8e4f-5a6b7c8d9e0f'
                    name: Dana Whitfield
                  created_at: '2026-10-01T15:08:21Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: This credential cannot make changes (a read-only member JWT).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: >-
            A field is missing or invalid, an unknown field was sent, or `contact_id` is not one of the
            member's contacts.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/calendar/events/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of the member's own entry or of a company event visible to them.
      schema:
        type: string
        format: uuid
    get:
      operationId: member_calendar_events_show
      tags:
      - calendar-events
      summary: Show a calendar event
      description: One of the member's own entries, or a company event visible to them. Anything else
        is 404.
      x-fluid-audience: member
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: A previously returned ETag. Authentication runs before a 304 is considered.
        schema:
          type: string
      responses:
        '200':
          description: The entry.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEventEnvelope"
              example:
                status: 200
                data:
                  id: '0192f8a1-3c4d-7e5f-8a6b-7c8d9e0f1a2b'
                  source: company
                  title: Fall product launch
                  description: Live walkthrough of the new wellness line.
                  starts_at: '2026-10-14T17:00:00Z'
                  ends_at: '2026-10-14T18:30:00Z'
                  all_day: false
                  time_zone: America/Denver
                  location:
                    kind: virtual
                    address:
                    url: https://events.primex.com/fall-launch
                  contact:
                  created_at: '2026-09-20T16:02:11Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '304':
          description: The representation has not changed since the supplied ETag.
          headers:
            ETag:
              "$ref": "#/components/headers/ETag"
            Cache-Control:
              "$ref": "#/components/headers/CacheControl"
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No own entry or visible company event has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: member_calendar_events_update
      tags:
      - calendar-events
      summary: Change a personal calendar event
      description: >-
        Change supplied fields of one of the member's own entries. A company event is read-only to members
        and returns 403.
      x-fluid-audience: member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CalendarEventUpdate"
            example:
              starts_at: '2026-10-08T16:00:00Z'
              ends_at: '2026-10-08T16:45:00Z'
      responses:
        '200':
          description: The changed entry.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEventEnvelope"
              example:
                status: 200
                data:
                  id: '0192f8b4-6e7f-7a8b-9c0d-1e2f3a4b5c6d'
                  source: mine
                  title: Coffee with Dana Whitfield
                  description: Bring the starter-kit samples.
                  starts_at: '2026-10-08T16:00:00Z'
                  ends_at: '2026-10-08T16:45:00Z'
                  all_day: false
                  time_zone: America/Denver
                  location:
                    kind: physical
                    address: Kaladi Brothers, 1500 W 47th Ave, Denver
                    url:
                  contact:
                    id: '0192f7c2-1a2b-7c3d-8e4f-5a6b7c8d9e0f'
                    name: Dana Whitfield
                  created_at: '2026-10-01T15:08:21Z'
                meta:
                  request_uuid: '0192f4c8-5b6c-7d74-a3e8-0f1a2b3c4d5e'
                  timestamp: '2026-10-01T15:08:21Z'
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The id names a company event, which members cannot change, or the credential cannot
            make changes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No own entry or visible company event has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: >-
            A field is invalid, an unknown field was sent, the body is empty, or `contact_id` is not one
            of the member's contacts.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: member_calendar_events_destroy
      tags:
      - calendar-events
      summary: Delete a personal calendar event
      description: Remove one of the member's own entries. A company event returns 403.
      x-fluid-audience: member
      responses:
        '204':
          description: The entry was removed.
        '401':
          description: Missing credential, or a credential that is not a usable member credential.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: The id names a company event, which members cannot delete, or the credential cannot
            make changes.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '404':
          description: No own entry or visible company event has this id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '422':
          description: The entry changed while the removal was waiting; reload before retrying.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/member/v2026-10/calendar/events/{id}/rsvp":
    parameters:
    - name: id
      in: path
      required: true
      description: Public id of a company event visible to the member.
      schema:
        type: string
        format: uuid
    post:
      operationId: member_calendar_events_rsvp
      tags:
      - calendar-events
      summary: RSVP to a company event
      description: >-
        Record the member's own answer to a company event, replacing any earlier answer. Only the acting
        member's answer is recorded. The member's own entries take no RSVP and return 422.
